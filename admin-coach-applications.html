<script>

(async function () {

  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    return;

  }


  const ratingReviewSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     CHỈ ADMIN
  ====================================================== */

  const {
    data: userData,
    error: userError
  } =
    await ratingReviewSb.auth
      .getUser();


  if (
    userError
    ||
    !userData?.user
  ) {

    return;

  }


  const {
    data: adminProfile,
    error: adminProfileError
  } =
    await ratingReviewSb
      .from(
        "profiles"
      )
      .select(
        "role"
      )
      .eq(
        "id",
        userData.user.id
      )
      .maybeSingle();


  if (
    adminProfileError
    ||
    String(
      adminProfile?.role || ""
    )
      .trim()
      .toLowerCase()
    !==
    "admin"
  ) {

    return;

  }


  /* =====================================================
     TẠO KHỐI GIAO DIỆN
  ====================================================== */

  const main =
    document.querySelector(
      "main"
    );


  const toolbar =
    document.querySelector(
      "main .toolbar"
    );


  if (
    !main
    ||
    !toolbar
  ) {

    return;

  }


  const section =
    document.createElement(
      "section"
    );


  section.id =
    "pickdeePendingRatingSection";


  section.innerHTML = `

    <div class="pickdee-pending-rating-head">

      <div>

        <div class="pickdee-pending-rating-eyebrow">
          PICKDEE ADMIN
        </div>

        <div class="pickdee-pending-rating-title">
          Trình độ Coach chờ xác minh
        </div>

      </div>

      <div
        id="pickdeePendingRatingCount"
        class="pickdee-pending-rating-count"
      >
        0
      </div>

    </div>


    <div id="pickdeePendingRatingMessage"></div>


    <div id="pickdeePendingRatingList">

      <div class="pickdee-pending-rating-empty">
        Đang tải dữ liệu...
      </div>

    </div>

  `;


  main.insertBefore(
    section,
    toolbar
  );


  const listEl =
    section.querySelector(
      "#pickdeePendingRatingList"
    );


  const countEl =
    section.querySelector(
      "#pickdeePendingRatingCount"
    );


  const messageEl =
    section.querySelector(
      "#pickdeePendingRatingMessage"
    );


  let currentRows =
    [];


  function safeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function showReviewMessage(
    text,
    type
  ) {

    messageEl.className =
      type === "error"
        ?
        "error"
        :
        "success";


    messageEl.textContent =
      text || "";

  }


  function clearReviewMessage() {

    messageEl.className =
      "";

    messageEl.textContent =
      "";

  }


  /* =====================================================
     SIGNED URL
  ====================================================== */

  async function getProofUrl(
    path
  ) {

    if (!path) {
      return "";
    }


    const {
      data,
      error
    } =
      await ratingReviewSb
        .storage
        .from(
          "coach-documents"
        )
        .createSignedUrl(
          path,
          60 * 60
        );


    if (
      error
      ||
      !data?.signedUrl
    ) {

      console.error(
        "PENDING RATING SIGNED URL:",
        path,
        error
      );

      return "";

    }


    return data.signedUrl;

  }


    /* =====================================================
     LOAD PRODUCTION
  ====================================================== */

  async function loadPendingRatings() {

    clearReviewMessage();


    listEl.innerHTML = `
      <div class="pickdee-pending-rating-empty">
        Đang tải dữ liệu...
      </div>
    `;


    try {


      const {
        data,
        error
      } =
        await ratingReviewSb.rpc(
          "admin_get_pending_coach_rating_proofs"
        );


      if (error) {
        throw error;
      }


      currentRows =
        Array.isArray(data)
          ?
          data
          :
          [];


      await renderPendingRatings();


    }
    catch (error) {


      console.error(
        "LOAD PENDING COACH RATINGS:",
        error
      );


      countEl.textContent =
        "0";


      listEl.innerHTML = `
        <div class="pickdee-pending-rating-empty">
          Không tải được danh sách trình độ chờ xác minh.
        </div>
      `;


      showReviewMessage(
        "Không tải được dữ liệu: "
        +
        (
          error?.message
          ||
          String(error)
        ),
        "error"
      );


    }

  }
  /* =====================================================
     RENDER
  ====================================================== */

  async function renderPendingRatings() {

    countEl.textContent =
      String(
        currentRows.length
      );


    if (
      currentRows.length === 0
    ) {

      listEl.innerHTML = `
        <div class="pickdee-pending-rating-empty">
          Hiện không có trình độ Coach nào chờ xác minh.
        </div>
      `;

      return;

    }


    const cards =
      await Promise.all(
        currentRows.map(
          async function (row) {

            const proofUrl =
              await getProofUrl(
                row.proof_image_path
              );


            const ratingValue =
              row.rating_value
              ??
              row.rating_text
              ??
              "—";


            return `

              <article
                class="pickdee-pending-rating-card"
                data-rating-id="${Number(
                  row.rating_id
                )}"
              >

                <div class="pickdee-pending-rating-card-top">

                  <div class="pickdee-pending-rating-code">
                    ${safeHtml(
                      row.coach_code || "—"
                    )}
                    ${
                      row.is_test === true
                        ?
                        " · TEST"
                        :
                        ""
                    }
                  </div>

                  <div class="pickdee-pending-rating-name">
                    ${safeHtml(
                      row.coach_name || "Coach"
                    )}
                  </div>

                  <div class="pickdee-pending-rating-email">
                    ${safeHtml(
                      row.coach_email || ""
                    )}
                  </div>

                </div>


                <div class="pickdee-pending-rating-body">

                  <div class="pickdee-pending-rating-info">

                    <div>

                      <div class="pickdee-pending-rating-label">
                        HỆ THỐNG ĐÁNH GIÁ
                      </div>

                      <div class="pickdee-pending-rating-value">
                        ${safeHtml(
                          row.rating_system || "—"
                        )}
                      </div>

                    </div>


                    <div>

                      <div class="pickdee-pending-rating-label">
                        ĐIỂM / TRÌNH ĐỘ
                      </div>

                      <div class="pickdee-pending-rating-score">
                        ${safeHtml(
                          ratingValue
                        )}
                      </div>

                    </div>

                  </div>


                  <div class="pickdee-pending-rating-label">
                    ẢNH MINH CHỨNG COACH VỪA TẢI
                  </div>


                  ${
                    proofUrl
                      ?
                      `

                        <a
                          href="${safeHtml(
                            proofUrl
                          )}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >

                          <img
                            class="pickdee-pending-rating-image"
                            src="${safeHtml(
                              proofUrl
                            )}"
                            alt="Ảnh minh chứng trình độ Coach"
                          >

                        </a>


                        <a
                          class="pickdee-pending-rating-open"
                          href="${safeHtml(
                            proofUrl
                          )}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          MỞ ẢNH GỐC ↗
                        </a>

                      `
                      :
                      `

                        <div class="pickdee-pending-rating-empty">
                          Không mở được ảnh minh chứng.
                        </div>

                      `
                  }

                </div>


                <div class="pickdee-pending-rating-actions">

                  <button
                    type="button"
                    class="pickdee-rating-verify-btn"
                    data-rating-review-action="verify"
                    data-rating-id="${Number(
                      row.rating_id
                    )}"
                    data-coach-name="${safeHtml(
                      row.coach_name || ""
                    )}"
                  >
                    ✓ XÁC MINH
                  </button>


                  <button
                    type="button"
                    class="pickdee-rating-reject-btn"
                    data-rating-review-action="reject"
                    data-rating-id="${Number(
                      row.rating_id
                    )}"
                    data-coach-name="${safeHtml(
                      row.coach_name || ""
                    )}"
                  >
                    ↻ YÊU CẦU TẢI LẠI ẢNH
                  </button>

                </div>

              </article>

            `;

          }
        )
      );


    listEl.innerHTML =
      cards.join("");

  }


  /* =====================================================
     XỬ LÝ XÁC MINH / TỪ CHỐI ẢNH
  ====================================================== */

  listEl.addEventListener(
    "click",
    async function (event) {

      const button =
        event.target.closest(
          "button[data-rating-review-action]"
        );


      if (!button) {
        return;
      }


      const ratingId =
        Number(
          button.dataset.ratingId
        );


      const coachName =
        button.dataset.coachName
        ||
        "Coach";


      const action =
        button.dataset.ratingReviewAction;


      if (
        !Number.isFinite(
          ratingId
        )
      ) {

        return;

      }


      const newStatus =
        action === "verify"
          ?
          "Đã xác minh"
          :
          "Không xác minh được";


      const confirmText =
        action === "verify"
          ?
          (
            'Xác nhận ảnh trình độ của "'
            +
            coachName
            +
            '" là hợp lệ?'
          )
          :
          (
            'Yêu cầu "'
            +
            coachName
            +
            '" tải lại ảnh minh chứng?\n\n'
            +
            "Ảnh hiện tại sẽ bị loại khỏi rating "
            +
            "và popup sẽ hiện lại cho Coach."
          );


      const confirmed =
        window.confirm(
          confirmText
        );


      if (!confirmed) {
        return;
      }


      const card =
        button.closest(
          ".pickdee-pending-rating-card"
        );


      const buttons =
        card
          ?
          card.querySelectorAll(
            "button"
          )
          :
          [];


      buttons.forEach(
        item =>
          item.disabled = true
      );


      clearReviewMessage();


      try {


        const {
          error
        } =
          await ratingReviewSb.rpc(
            "admin_set_coach_rating_verification",
            {

              p_rating_id:
                ratingId,

              p_status:
                newStatus

            }
          );


        if (error) {
          throw error;
        }


        showReviewMessage(
          action === "verify"
            ?
            "✓ Đã xác minh trình độ Coach."
            :
            "✓ Đã yêu cầu Coach tải lại ảnh minh chứng.",
          "success"
        );


        await loadPendingRatings();


      }
      catch (error) {


        console.error(
          "ADMIN RATING VERIFICATION:",
          error
        );


        showReviewMessage(
          "Không cập nhật được trạng thái: "
          +
          (
            error?.message
            ||
            String(error)
          ),
          "error"
        );


        buttons.forEach(
          item =>
            item.disabled = false
        );

      }

    }
  );


  /* =====================================================
     START
  ====================================================== */

  await loadPendingRatings();


})();

</script>

<script>

(async function () {

  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    return;

  }


  const verifiedSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     ADMIN CHECK
  ====================================================== */

  const {
    data: userData,
    error: userError
  } =
    await verifiedSb.auth
      .getUser();


  if (
    userError
    ||
    !userData?.user
  ) {

    return;

  }


  const {
    data: profile,
    error: profileError
  } =
    await verifiedSb
      .from(
        "profiles"
      )
      .select(
        "role"
      )
      .eq(
        "id",
        userData.user.id
      )
      .maybeSingle();


  if (
    profileError
    ||
    String(
      profile?.role || ""
    )
      .trim()
      .toLowerCase()
    !==
    "admin"
  ) {

    return;

  }


  /* =====================================================
     HELPERS
  ====================================================== */

  function safeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatVerifiedDate(
    value
  ) {

    if (!value) {
      return "—";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "—";

    }


    return date.toLocaleString(
      "vi-VN",
      {

        timeZone:
          "Asia/Ho_Chi_Minh",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"

      }
    );

  }


  async function getVerifiedProofUrl(
    path
  ) {

    if (!path) {
      return "";
    }


    const {
      data,
      error
    } =
      await verifiedSb
        .storage
        .from(
          "coach-documents"
        )
        .createSignedUrl(
          path,
          60 * 60
        );


    if (
      error
      ||
      !data?.signedUrl
    ) {

      console.error(
        "VERIFIED RATING SIGNED URL:",
        path,
        error
      );

      return "";

    }


    return data.signedUrl;

  }


  /* =====================================================
     CHỜ KHỐI PENDING TẠO XONG
  ====================================================== */

  async function waitForPendingSection() {

    for (
      let i = 0;
      i < 100;
      i++
    ) {

      const pendingSection =
        document.getElementById(
          "pickdeePendingRatingSection"
        );


      if (pendingSection) {
        return pendingSection;
      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            50
          )
      );

    }


    return null;

  }


  /* =====================================================
     CREATE VERIFIED SECTION
  ====================================================== */

  const main =
    document.querySelector(
      "main"
    );


  const toolbar =
    document.querySelector(
      "main .toolbar"
    );


  if (
    !main
    ||
    !toolbar
  ) {

    return;

  }


  const pendingSection =
    await waitForPendingSection();


  const section =
    document.createElement(
      "section"
    );


  section.id =
    "pickdeeVerifiedRatingSection";


  section.innerHTML = `

    <div class="pickdee-verified-rating-head">

      <div>

        <div class="pickdee-verified-rating-eyebrow">
          PICKDEE ADMIN
        </div>

        <div class="pickdee-verified-rating-title">
          Trình độ Coach đã xác minh
        </div>

      </div>


      <div
        id="pickdeeVerifiedRatingCount"
        class="pickdee-verified-rating-count"
      >
        0
      </div>

    </div>


    <div id="pickdeeVerifiedRatingList">

      <div class="pickdee-pending-rating-empty">
        Đang tải dữ liệu...
      </div>

    </div>

  `;


  if (
    pendingSection
    &&
    pendingSection.parentNode
  ) {

    pendingSection.insertAdjacentElement(
      "afterend",
      section
    );

  }
  else {

    main.insertBefore(
      section,
      toolbar
    );

  }


  const listEl =
    section.querySelector(
      "#pickdeeVerifiedRatingList"
    );


  const countEl =
    section.querySelector(
      "#pickdeeVerifiedRatingCount"
    );


  let verifiedRows =
    [];


  let refreshTimer =
    null;


  /* =====================================================
     LOAD VERIFIED RATINGS
  ====================================================== */

  async function loadVerifiedRatings() {

    try {


      const {
        data,
        error
      } =
        await verifiedSb.rpc(
          "admin_get_verified_coach_ratings"
        );


      if (error) {
        throw error;
      }


      verifiedRows =
        Array.isArray(data)
          ?
          data
          :
          [];


      await renderVerifiedRatings();


    }
    catch (error) {


      console.error(
        "LOAD VERIFIED COACH RATINGS:",
        error
      );


      countEl.textContent =
        "0";


      listEl.innerHTML = `
        <div class="pickdee-pending-rating-empty">
          Không tải được danh sách trình độ đã xác minh.
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER
  ====================================================== */

  async function renderVerifiedRatings() {

    countEl.textContent =
      String(
        verifiedRows.length
      );


    if (
      verifiedRows.length === 0
    ) {

      listEl.innerHTML = `
        <div class="pickdee-pending-rating-empty">
          Chưa có trình độ Coach nào đã xác minh.
        </div>
      `;

      return;

    }


    const cards =
      await Promise.all(
        verifiedRows.map(
          async function (row) {


            const proofUrl =
              await getVerifiedProofUrl(
                row.proof_image_path
              );


            const ratingValue =
              row.rating_value
              ??
              row.rating_text
              ??
              "—";


            return `

              <article
                class="pickdee-pending-rating-card"
                data-verified-rating-id="${Number(
                  row.rating_id
                )}"
              >


                <div class="pickdee-pending-rating-card-top">

                  <div class="pickdee-pending-rating-code">

                    ${safeHtml(
                      row.coach_code || "—"
                    )}

                   
                  </div>


                  <div class="pickdee-pending-rating-name">

                    ${safeHtml(
                      row.coach_name || "Coach"
                    )}

                  </div>


                  <div class="pickdee-pending-rating-email">

                    ${safeHtml(
                      row.coach_email || ""
                    )}

                  </div>


                  <div class="pickdee-verified-rating-status">

                    ✓ ĐÃ XÁC MINH

                  </div>

                </div>


                <div class="pickdee-pending-rating-body">


                  <div class="pickdee-pending-rating-info">


                    <div>

                      <div class="pickdee-pending-rating-label">
                        HỆ THỐNG ĐÁNH GIÁ
                      </div>

                      <div class="pickdee-pending-rating-value">

                        ${safeHtml(
                          row.rating_system || "—"
                        )}

                      </div>

                    </div>


                    <div>

                      <div class="pickdee-pending-rating-label">
                        ĐIỂM / TRÌNH ĐỘ
                      </div>

                      <div class="pickdee-pending-rating-score">

                        ${safeHtml(
                          ratingValue
                        )}

                      </div>

                    </div>


                  </div>


                  <div class="pickdee-pending-rating-label">
                    ẢNH MINH CHỨNG ĐÃ XÁC MINH
                  </div>


                  ${
                    proofUrl
                      ?
                      `

                        <a
                          href="${safeHtml(
                            proofUrl
                          )}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >

                          <img
                            class="pickdee-pending-rating-image"
                            src="${safeHtml(
                              proofUrl
                            )}"
                            alt="Ảnh minh chứng trình độ đã xác minh"
                          >

                        </a>


                        <a
                          class="pickdee-pending-rating-open"
                          href="${safeHtml(
                            proofUrl
                          )}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          MỞ ẢNH GỐC ↗
                        </a>

                      `
                      :
                      `

                        <div class="pickdee-pending-rating-empty">
                          Không mở được ảnh minh chứng.
                        </div>

                      `
                  }


                  <div class="pickdee-verified-rating-meta">

                    Xác minh lúc:
                    <strong>
                      ${safeHtml(
                        formatVerifiedDate(
                          row.verified_at
                        )
                      )}
                    </strong>

                  </div>


                </div>


              </article>

            `;

          }
        )
      );


    listEl.innerHTML =
      cards.join("");

  }


  /* =====================================================
     TỰ REFRESH SAU KHI ADMIN XÁC MINH RATING MỚI
  ====================================================== */

  function scheduleVerifiedRefresh() {

    clearTimeout(
      refreshTimer
    );


    refreshTimer =
      setTimeout(
        loadVerifiedRatings,
        250
      );

  }


  const pendingList =
    document.getElementById(
      "pickdeePendingRatingList"
    );


  if (pendingList) {

    const observer =
      new MutationObserver(
        scheduleVerifiedRefresh
      );


    observer.observe(
      pendingList,
      {
        childList: true,
        subtree: true
      }
    );

  }


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  if (refreshBtn) {

    refreshBtn.addEventListener(
      "click",
      function () {

        setTimeout(
          loadVerifiedRatings,
          300
        );

      }
    );

  }


  /* =====================================================
     START
  ====================================================== */

  await loadVerifiedRatings();


})();

</script>

</style>


<script>

(async function () {


  const cfg =
    window.PICKDEE_CONFIG
    ||
    {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    return;

  }


  const profileLinkSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const applicationList =
    document.getElementById(
      "applicationList"
    );


  if (!applicationList) {
    return;
  }


  let coachIdByApplicationId =
    new Map();


  let renderTimer =
    null;


  async function loadCurrentCoachLinks() {


    try {


      const [
        applicationsResult,
        coachesResult
      ] =
        await Promise.all(
          [

            profileLinkSb
              .from(
                "coach_applications"
              )
              .select(`
                id,
                auth_user_id,
                status
              `)
              .eq(
                "status",
                "approved"
              ),


            profileLinkSb
              .from(
                "coaches"
              )
              .select(`
                id,
                auth_user_id
              `)

          ]
        );


      if (
        applicationsResult.error
      ) {

        throw applicationsResult.error;

      }


      if (
        coachesResult.error
      ) {

        throw coachesResult.error;

      }


      const applicationIdByAuthUser =
        new Map();


      (
        Array.isArray(
          applicationsResult.data
        )
          ?
          applicationsResult.data
          :
          []
      )
        .forEach(
          function (
            application
          ) {


            const authUserId =
              String(
                application.auth_user_id
                ||
                ""
              ).trim();


            const applicationId =
              Number(
                application.id
              );


            if (
              authUserId
              &&
              Number.isFinite(
                applicationId
              )
            ) {

              applicationIdByAuthUser
                .set(
                  authUserId,
                  applicationId
                );

            }


          }
        );


      coachIdByApplicationId =
        new Map();


      (
        Array.isArray(
          coachesResult.data
        )
          ?
          coachesResult.data
          :
          []
      )
        .forEach(
          function (
            coach
          ) {


            const authUserId =
              String(
                coach.auth_user_id
                ||
                ""
              ).trim();


            const coachId =
              Number(
                coach.id
              );


            const applicationId =
              applicationIdByAuthUser
                .get(
                  authUserId
                );


            if (
              Number.isFinite(
                applicationId
              )
              &&
              Number.isFinite(
                coachId
              )
            ) {

              coachIdByApplicationId
                .set(
                  applicationId,
                  coachId
                );

            }


          }
        );


      renderCurrentCoachLinks();


    }
    catch (
      error
    ) {

      console.error(
        "LOAD CURRENT COACH PROFILE LINKS:",
        error
      );

    }


  }


  function renderCurrentCoachLinks() {


    const cards =
      applicationList
        .querySelectorAll(
          ".application[data-application-id]"
        );


    cards.forEach(
      function (
        card
      ) {


        if (
          card.querySelector(
            ".pickdee-current-coach-profile-box"
          )
        ) {

          return;

        }


        const applicationId =
          Number(
            card.dataset.applicationId
          );


        const coachId =
          coachIdByApplicationId
            .get(
              applicationId
            );


        if (
          !Number.isFinite(
            coachId
          )
        ) {

          return;

        }


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "pickdee-current-coach-profile-box";


        box.innerHTML = `

          <a
            class="pickdee-current-coach-profile-link"
            href="./coach-profile?id=${coachId}"
            target="_blank"
            rel="noopener noreferrer"
          >
            XEM HỒ SƠ COACH HIỆN TẠI →
          </a>

        `;


        card.appendChild(
          box
        );


      }
    );


  }


  function scheduleRender() {


    clearTimeout(
      renderTimer
    );


    renderTimer =
      setTimeout(
        renderCurrentCoachLinks,
        80
      );


  }


  const observer =
    new MutationObserver(
      scheduleRender
    );


  observer.observe(
    applicationList,
    {
      childList: true,
      subtree: true
    }
  );


  await loadCurrentCoachLinks();


})();

</script>

  .pickdee-verified-rating-note {

</style>


<script>

(function () {

  function enhanceVerifiedRatingSection() {

    const section =
      document.getElementById(
        "pickdeeVerifiedRatingSection"
      );

    if (!section) {
      return false;
    }


    const title =
      section.querySelector(
        ".pickdee-verified-rating-title"
      );

    if (title) {
      title.textContent =
        "Rating bên ngoài đã xác minh";
    }


    const head =
      section.querySelector(
        ".pickdee-verified-rating-head"
      );

    if (
      head
      &&
      !section.querySelector(
        ".pickdee-verified-rating-note"
      )
    ) {

      const left =
        head.firstElementChild;

      if (left) {

        const note =
          document.createElement(
            "div"
          );

        note.className =
          "pickdee-verified-rating-note";

        note.textContent =
          "Chỉ gồm các rating bên ngoài đã được PickDee xác minh.";

        left.appendChild(
          note
        );

      }

    }


    if (
      !section.querySelector(
        ".pickdee-verified-rating-toggle"
      )
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "pickdee-verified-rating-toggle";

      button.textContent =
        "XEM DANH SÁCH ↓";


      button.addEventListener(
        "click",
        function () {

          const isOpen =
            section.classList.toggle(
              "pickdee-open"
            );

          button.textContent =
            isOpen
              ?
              "THU GỌN ↑"
              :
              "XEM DANH SÁCH ↓";

        }
      );


      const list =
        document.getElementById(
          "pickdeeVerifiedRatingList"
        );

      if (list) {

        section.insertBefore(
          button,
          list
        );

      }

    }


    return true;

  }


  if (
    enhanceVerifiedRatingSection()
  ) {
    return;
  }


  const observer =
    new MutationObserver(
      function () {

        if (
          enhanceVerifiedRatingSection()
        ) {

          observer.disconnect();

        }

      }
    );


  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

})();

</script>
