<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#071426"
  >

  <title>
    Hồ sơ đăng ký Coach | PickDee Academy
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        linear-gradient(
          145deg,
          #061326,
          #073768
        );

    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    .topbar {

      min-height: 68px;

      padding:
        0 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      position: sticky;

      top: 0;

      z-index: 100;

      border-bottom:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(5,17,34,.96);

      backdrop-filter:
        blur(14px);

    }


    .brand {

      font-size: 20px;

      font-weight: 1000;

    }


    .brand span {

      color: #d8ff45;

    }


    .back {

      color: #d8ff45;

      text-decoration: none;

      font-size: 13px;

      font-weight: 900;

    }


    .page {

      width:
        min(
          1100px,
          calc(100% - 30px)
        );

      margin:
        0 auto;

      padding:
        38px 0 80px;

    }


    .eyebrow {

      color: #d8ff45;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: .09em;

    }


    h1 {

      margin:
        8px 0 10px;

      font-size:
        clamp(
          38px,
          7vw,
          62px
        );

      line-height: 1;

    }


    .lead {

      max-width: 760px;

      margin: 0;

      color:
        rgba(255,255,255,.65);

      font-size: 15px;

      line-height: 1.6;

    }


    .summary {

      margin-top: 26px;

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );

      gap: 12px;

    }


    .summary-card {

      padding: 17px;

      border:
        1px solid rgba(255,255,255,.13);

      border-radius: 15px;

      background:
        rgba(8,32,62,.72);

    }


    .summary-label {

      color:
        rgba(255,255,255,.52);

      font-size: 11px;

      font-weight: 800;

    }


    .summary-number {

      margin-top: 5px;

      color: #d8ff45;

      font-size: 25px;

      font-weight: 1000;

    }


    .pending-number {

      color: #ffba53;

    }


    .approved-number {

      color: #d8ff45;

    }


    .rejected-number {

      color: #ff8d9a;

    }


    .toolbar {

      margin-top: 16px;

      display: grid;

      grid-template-columns:
        1fr 220px auto;

      gap: 10px;

    }


    .search,
    .filter,
    .refresh {

      min-height: 46px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.15);

      outline: none;

    }


    .search,
    .filter {

      padding:
        0 13px;

      color: white;

      background: #071a32;

    }


    .refresh {

      padding:
        0 18px;

      cursor: pointer;

      color: white;

      background:
        rgba(255,255,255,.07);

      font-weight: 900;

    }


    .refresh:hover {

      border-color: #d8ff45;

    }


    .load-message {

      margin-top: 17px;

      color: #d8ff45;

      font-size: 13px;

      font-weight: 800;

    }


    .applications {

      margin-top: 15px;

      display: grid;

      gap: 16px;

    }


    .application {

      padding: 20px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius: 18px;

      background:
        rgba(6,29,58,.88);

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.15);

    }


    .application.pending {

      border-color:
        rgba(255,185,65,.55);

    }


    .application.approved {

      border-color:
        rgba(216,255,69,.28);

    }


    .application.rejected {

      border-color:
        rgba(255,115,130,.32);

    }


    .application-head {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

    }


    .application-code {

      color: #d8ff45;

      font-size: 20px;

      font-weight: 1000;

    }


    .application-name {

      margin-top: 4px;

      font-size: 21px;

      font-weight: 1000;

    }


    .application-contact {

      margin-top: 5px;

      color:
        rgba(255,255,255,.55);

      font-size: 12px;

      line-height: 1.5;

    }


    .badge {

      flex-shrink: 0;

      padding:
        7px 11px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 1000;

    }


    .badge.pending {

      color: #191106;

      background: #ffba53;

    }


    .badge.approved {

      color: #071426;

      background: #d8ff45;

    }


    .badge.rejected {

      color: white;

      background: #b53b4b;

    }


    .info-grid {

      margin-top: 17px;

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: 10px;

    }


    .info {

      min-height: 82px;

      padding: 12px;

      border-radius: 11px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.035);

    }


    .info-label {

      color:
        rgba(255,255,255,.45);

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

    }


    .info-value {

      margin-top: 5px;

      color: white;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.45;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

    }


    .detail {

      margin-top: 10px;

      padding: 13px;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius: 11px;

      background:
        rgba(255,255,255,.025);

    }


    .detail-title {

      margin-bottom: 6px;

      color: #d8ff45;

      font-size: 11px;

      font-weight: 900;

    }


    .detail-value {

      color:
        rgba(255,255,255,.76);

      font-size: 13px;

      line-height: 1.55;

      white-space:
        pre-wrap;

    }


    .admin-note {

      width: 100%;

      min-height: 82px;

      margin-top: 13px;

      padding: 12px;

      resize: vertical;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.13);

      outline: none;

      background: #06182e;

      color: white;

      line-height: 1.5;

    }


    .admin-note:focus {

      border-color:
        rgba(216,255,69,.65);

    }


    .actions {

      margin-top: 11px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

    }


    .approve,
    .reject {

      min-height: 48px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 1000;

    }


    .approve {

      border: 0;

      background: #d8ff45;

      color: #071426;

    }


    .reject {

      border:
        1px solid rgba(255,120,135,.5);

      background:
        rgba(255,70,90,.08);

      color: #ffabb4;

    }


    .approve:disabled,
    .reject:disabled {

      opacity: .5;

      cursor: wait;

    }


    .reviewed {

      margin-top: 12px;

      padding-top: 12px;

      border-top:
        1px solid rgba(255,255,255,.07);

      color:
        rgba(255,255,255,.52);

      font-size: 12px;

      line-height: 1.5;

    }


    .empty {

      padding: 35px 20px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 16px;

      background:
        rgba(6,29,58,.72);

      color:
        rgba(255,255,255,.6);

      text-align: center;

    }


    .fatal {

      margin-top: 20px;

      padding: 17px;

      border:
        1px solid rgba(255,100,115,.35);

      border-radius: 12px;

      background:
        rgba(255,80,100,.08);

      color: #ffb1ba;

      line-height: 1.5;

    }


    @media(max-width:760px) {

      .topbar {

        padding:
          0 14px;

      }


      .page {

        width:
          min(
            100% - 22px,
            1100px
          );

        padding-top:
          26px;

      }


      .summary {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

      }


      .toolbar {

        grid-template-columns:
          1fr;

      }


      .info-grid {

        grid-template-columns:
          1fr;

      }


      .actions {

        grid-template-columns:
          1fr;

      }


      .application-head {

        align-items:
          flex-start;

      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    PickDee<span>Academy</span>

  </div>


  <a
    class="back"
    href="./admin"
  >

    ← TRUNG TÂM QUẢN TRỊ

  </a>

</header>



<main class="page">


  <div class="eyebrow">

    ADMIN • TUYỂN DỤNG COACH

  </div>


  <h1>

    Hồ sơ đăng ký Coach

  </h1>


  <p class="lead">

    Kiểm tra những người đăng ký trở thành Coach PickDee.
    Hồ sơ chỉ được đưa vào danh sách Coach chính thức
    sau khi Admin duyệt.

  </p>



  <!-- =====================================================
       SUMMARY
  ====================================================== -->

  <section class="summary">


    <div class="summary-card">

      <div class="summary-label">
        TỔNG HỒ SƠ
      </div>

      <div
        id="totalCount"
        class="summary-number"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        CHỜ DUYỆT
      </div>

      <div
        id="pendingCount"
        class="summary-number pending-number"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        ĐÃ DUYỆT
      </div>

      <div
        id="approvedCount"
        class="summary-number approved-number"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        TỪ CHỐI
      </div>

      <div
        id="rejectedCount"
        class="summary-number rejected-number"
      >
        0
      </div>

    </div>


  </section>



  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

  <section class="toolbar">


    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Tìm tên, email, SĐT, mã hồ sơ, khu vực..."
    >


    <select
      id="statusFilter"
      class="filter"
    >

      <option value="all">
        Tất cả trạng thái
      </option>

      <option value="pending">
        Chờ duyệt
      </option>

      <option value="approved">
        Đã duyệt
      </option>

      <option value="rejected">
        Từ chối
      </option>

    </select>


    <button
      id="refreshBtn"
      class="refresh"
      type="button"
    >

      ↻ CẬP NHẬT

    </button>


  </section>


  <div
    id="loadMessage"
    class="load-message"
  >
    Đang kiểm tra quyền Admin...
  </div>


  <section
    id="applications"
    class="applications"
  ></section>


</main>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js"></script>



<script>

(async function () {


  /* =====================================================
     ELEMENT
  ====================================================== */

  const applicationsEl =
    document.getElementById(
      "applications"
    );


  const loadMessage =
    document.getElementById(
      "loadMessage"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  const totalCount =
    document.getElementById(
      "totalCount"
    );


  const pendingCount =
    document.getElementById(
      "pendingCount"
    );


  const approvedCount =
    document.getElementById(
      "approvedCount"
    );


  const rejectedCount =
    document.getElementById(
      "rejectedCount"
    );


  let rows =
    [];


  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    fatal(
      "Không tải được cấu hình Supabase."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );



  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }



  function formatMoney(
    value
  ) {

    const number =
      Number(
        value || 0
      );


    if (!number) {

      return "Chưa khai báo";

    }


    return (
      new Intl.NumberFormat(
        "vi-VN"
      ).format(
        number
      )
      +
      "đ / buổi"
    );

  }



  function formatDateTime(
    value
  ) {

    if (!value) {

      return "—";

    }


    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "—";

    }


    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        hour:
          "2-digit",

        minute:
          "2-digit",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    ).format(
      date
    );

  }



  function statusLabel(
    status
  ) {

    if (
      status === "approved"
    ) {

      return "✓ Đã duyệt";

    }


    if (
      status === "rejected"
    ) {

      return "✕ Từ chối";

    }


    return "● Chờ duyệt";

  }



  function programsText(
    value
  ) {

    if (
      Array.isArray(
        value
      )
      &&
      value.length
    ) {

      return value.join(
        " • "
      );

    }


    return "Chưa khai báo";

  }



  function fatal(
    text
  ) {

    loadMessage.textContent =
      "";


    applicationsEl.innerHTML = `

      <div class="fatal">

        ${escapeHtml(
          text
        )}

      </div>

    `;

  }



  /* =====================================================
     ADMIN AUTH
  ====================================================== */

  async function requireAdmin() {


    const {
      data: {
        user
      },
      error: userError
    } =
      await sb.auth
        .getUser();


    if (
      userError
      ||
      !user
    ) {

      window.location.href =
        "./?v=login";

      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await sb
        .from(
          "profiles"
        )
        .select(
          "role"
        )
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if (
      profileError
      ||
      String(
        profile?.role || ""
      )
        .trim()
        .toLowerCase()
        !==
        "admin"
    ) {

      window.location.href =
        "./";

      return false;

    }


    return true;

  }



  /* =====================================================
     LOAD
  ====================================================== */

  async function loadApplications() {


    refreshBtn.disabled =
      true;


    refreshBtn.textContent =
      "ĐANG TẢI...";


    loadMessage.textContent =
      "Đang tải hồ sơ Coach...";


    try {


      const {
        data,
        error
      } =
        await sb
          .from(
            "coach_applications"
          )
          .select(
            `
              id,
              application_code,
              full_name,
              phone,
              email,
              preferred_area,
              preferred_ward,
              years_playing,
              years_coaching,
              specialties,
              programs,
              available_time,
              expected_rate,
              bio,
              achievements,
              status,
              admin_note,
              reviewed_at,
              created_at
            `
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (error) {

        throw error;

      }


      rows =
        Array.isArray(
          data
        )
          ?
          data
          :
          [];


      updateSummary();


      render();


      loadMessage.textContent =
        "✓ Đã tải "
        +
        rows.length
        +
        " hồ sơ.";


    }
    catch (error) {


      console.error(
        "LOAD COACH APPLICATIONS:",
        error
      );


      fatal(
        "Không tải được hồ sơ Coach: "
        +
        (
          error?.message
          ||
          error
        )
      );


    }
    finally {


      refreshBtn.disabled =
        false;


      refreshBtn.textContent =
        "↻ CẬP NHẬT";


    }

  }



  /* =====================================================
     SUMMARY
  ====================================================== */

  function updateSummary() {


    totalCount.textContent =
      String(
        rows.length
      );


    pendingCount.textContent =
      String(
        rows.filter(
          item =>
            item.status
            ===
            "pending"
        ).length
      );


    approvedCount.textContent =
      String(
        rows.filter(
          item =>
            item.status
            ===
            "approved"
        ).length
      );


    rejectedCount.textContent =
      String(
        rows.filter(
          item =>
            item.status
            ===
            "rejected"
        ).length
      );

  }



  /* =====================================================
     FILTER
  ====================================================== */

  function filteredRows() {


    const status =
      statusFilter.value;


    const keyword =
      searchInput.value
        .trim()
        .toLowerCase();


    return rows.filter(
      item => {


        if (
          status !== "all"
          &&
          item.status
          !==
          status
        ) {

          return false;

        }


        if (!keyword) {

          return true;

        }


        const searchable =
          [

            item.application_code,

            item.full_name,

            item.phone,

            item.email,

            item.preferred_area,

            item.preferred_ward

          ]
            .join(
              " "
            )
            .toLowerCase();


        return searchable.includes(
          keyword
        );

      }
    );

  }



  /* =====================================================
     RENDER
  ====================================================== */

  function render() {


    const displayRows =
      filteredRows();


    if (
      !displayRows.length
    ) {


      applicationsEl.innerHTML = `

        <div class="empty">

          ✅ Không có hồ sơ phù hợp với bộ lọc hiện tại.

        </div>

      `;


      return;

    }


    applicationsEl.innerHTML =
      displayRows
        .map(
          item => {


            const status =
              item.status
              ||
              "pending";


            const isPending =
              status
              ===
              "pending";


            return `

              <article
                class="application ${escapeHtml(
                  status
                )}"
              >


                <div class="application-head">


                  <div>


                    <div class="application-code">

                      ${escapeHtml(
                        item.application_code
                        ||
                        (
                          "CA"
                          +
                          String(
                            item.id
                          ).padStart(
                            6,
                            "0"
                          )
                        )
                      )}

                    </div>


                    <div class="application-name">

                      ${escapeHtml(
                        item.full_name
                      )}

                    </div>


                    <div class="application-contact">

                      📞
                      ${escapeHtml(
                        item.phone
                      )}

                      &nbsp; • &nbsp;

                      ✉️
                      ${escapeHtml(
                        item.email
                      )}

                    </div>


                  </div>


                  <div
                    class="badge ${escapeHtml(
                      status
                    )}"
                  >

                    ${escapeHtml(
                      statusLabel(
                        status
                      )
                    )}

                  </div>


                </div>



                <div class="info-grid">


                  <div class="info">

                    <div class="info-label">
                      Khu vực nhận học viên
                    </div>

                    <div class="info-value">

                      ${
                        escapeHtml(
                          item.preferred_area
                          ||
                          "Chưa khai báo"
                        )
                      }

                      ${
                        item.preferred_ward
                          ?
                          "<br>"
                          +
                          escapeHtml(
                            item.preferred_ward
                          )
                          :
                          ""
                      }

                    </div>

                  </div>


                  <div class="info">

                    <div class="info-label">
                      Kinh nghiệm
                    </div>

                    <div class="info-value">

                      Chơi:
                      ${
                        escapeHtml(
                          item.years_playing
                          ??
                          0
                        )
                      }
                      năm

                      <br>

                      Huấn luyện:
                      ${
                        escapeHtml(
                          item.years_coaching
                          ??
                          0
                        )
                      }
                      năm

                    </div>

                  </div>


                  <div class="info">

                    <div class="info-label">
                      Mức công mong muốn
                    </div>

                    <div class="info-value">

                      ${escapeHtml(
                        formatMoney(
                          item.expected_rate
                        )
                      )}

                    </div>

                  </div>


                  <div class="info">

                    <div class="info-label">
                      Chương trình có thể dạy
                    </div>

                    <div class="info-value">

                      ${escapeHtml(
                        programsText(
                          item.programs
                        )
                      )}

                    </div>

                  </div>


                  <div class="info">

                    <div class="info-label">
                      Khung giờ có thể dạy
                    </div>

                    <div class="info-value">

                      ${escapeHtml(
                        item.available_time
                        ||
                        "Chưa khai báo"
                      )}

                    </div>

                  </div>


                  <div class="info">

                    <div class="info-label">
                      Gửi hồ sơ lúc
                    </div>

                    <div class="info-value">

                      ${escapeHtml(
                        formatDateTime(
                          item.created_at
                        )
                      )}

                    </div>

                  </div>


                </div>



                <div class="detail">

                  <div class="detail-title">

                    CHUYÊN MÔN / THẾ MẠNH

                  </div>

                  <div class="detail-value">

                    ${escapeHtml(
                      item.specialties
                      ||
                      "Chưa khai báo."
                    )}

                  </div>

                </div>



                <div class="detail">

                  <div class="detail-title">

                    GIỚI THIỆU BẢN THÂN

                  </div>

                  <div class="detail-value">

                    ${escapeHtml(
                      item.bio
                      ||
                      "Chưa khai báo."
                    )}

                  </div>

                </div>



                <div class="detail">

                  <div class="detail-title">

                    THÀNH TÍCH / CHỨNG CHỈ

                  </div>

                  <div class="detail-value">

                    ${escapeHtml(
                      item.achievements
                      ||
                      "Chưa khai báo."
                    )}

                  </div>

                </div>



                ${
                  isPending
                    ?
                    `

                      <textarea
                        id="adminNote-${item.id}"
                        class="admin-note"
                        placeholder="Ghi chú của Admin nếu cần..."
                      ></textarea>


                      <div class="actions">


                        <button
                          class="approve"
                          type="button"
                          data-approve-id="${item.id}"
                        >

                          ✓ DUYỆT COACH

                        </button>


                        <button
                          class="reject"
                          type="button"
                          data-reject-id="${item.id}"
                        >

                          ✕ TỪ CHỐI

                        </button>


                      </div>

                    `
                    :
                    `

                      <div class="reviewed">

                        Xử lý lúc:
                        <b>
                          ${escapeHtml(
                            formatDateTime(
                              item.reviewed_at
                            )
                          )}
                        </b>

                        ${
                          item.admin_note
                            ?
                            "<br>Ghi chú Admin: "
                            +
                            escapeHtml(
                              item.admin_note
                            )
                            :
                            ""
                        }

                      </div>

                    `
                }


              </article>

            `;

          }
        )
        .join("");


    bindActions();

  }



  /* =====================================================
     APPROVE / REJECT
  ====================================================== */

  function bindActions() {


    document
      .querySelectorAll(
        "[data-approve-id]"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            async function () {


              const id =
                Number(
                  this.dataset
                    .approveId
                );


              await approveApplication(
                id,
                this
              );

            }
          );


        }
      );


    document
      .querySelectorAll(
        "[data-reject-id]"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            async function () {


              const id =
                Number(
                  this.dataset
                    .rejectId
                );


              await rejectApplication(
                id,
                this
              );

            }
          );


        }
      );

  }



  async function approveApplication(
    id,
    button
  ) {


    const item =
      rows.find(
        row =>
          Number(
            row.id
          )
          ===
          Number(
            id
          )
      );


    if (!item) {

      return;

    }


    const ok =
      window.confirm(
        "Duyệt "
        +
        item.full_name
        +
        " trở thành Coach PickDee?\n\n"
        +
        "Thao tác này sẽ tạo Coach chính thức trong bảng coaches."
      );


    if (!ok) {

      return;

    }


    const note =
      document
        .getElementById(
          "adminNote-"
          +
          id
        )
        ?.value
        .trim()
      ||
      null;


    button.disabled =
      true;


    button.textContent =
      "ĐANG DUYỆT...";


    try {


      const {
        data,
        error
      } =
        await sb.rpc(
          "admin_approve_coach_application",
          {

            p_application_id:
              id,

            p_admin_note:
              note

          }
        );


      if (error) {

        throw error;

      }


      alert(
        "✓ Đã duyệt Coach.\n\n"
        +
        "Mã Coach: "
        +
        (
          data?.coach_code
          ||
          "Đã tạo"
        )
        +
        "\n\n"
        +
        "Bước tiếp theo sẽ tạo tài khoản đăng nhập cho Coach."
      );


      await loadApplications();


      if (
        window.PickDeeNotifications
        &&
        typeof window
          .PickDeeNotifications
          .refresh
          ===
          "function"
      ) {

        await window
          .PickDeeNotifications
          .refresh();

      }


    }
    catch (error) {


      console.error(
        "APPROVE COACH:",
        error
      );


      alert(
        "Không duyệt được hồ sơ:\n"
        +
        (
          error?.message
          ||
          error
        )
      );


      button.disabled =
        false;


      button.textContent =
        "✓ DUYỆT COACH";


    }

  }



  async function rejectApplication(
    id,
    button
  ) {


    const item =
      rows.find(
        row =>
          Number(
            row.id
          )
          ===
          Number(
            id
          )
      );


    if (!item) {

      return;

    }


    const noteElement =
      document.getElementById(
        "adminNote-"
        +
        id
      );


    const note =
      noteElement
        ?.value
        .trim()
      ||
      null;


    const ok =
      window.confirm(
        "Từ chối hồ sơ Coach của "
        +
        item.full_name
        +
        "?"
      );


    if (!ok) {

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "ĐANG XỬ LÝ...";


    try {


      const {
        error
      } =
        await sb.rpc(
          "admin_reject_coach_application",
          {

            p_application_id:
              id,

            p_admin_note:
              note

          }
        );


      if (error) {

        throw error;

      }


      alert(
        "✓ Đã từ chối hồ sơ."
      );


      await loadApplications();


      if (
        window.PickDeeNotifications
        &&
        typeof window
          .PickDeeNotifications
          .refresh
          ===
          "function"
      ) {

        await window
          .PickDeeNotifications
          .refresh();

      }


    }
    catch (error) {


      console.error(
        "REJECT COACH:",
        error
      );


      alert(
        "Không xử lý được hồ sơ:\n"
        +
        (
          error?.message
          ||
          error
        )
      );


      button.disabled =
        false;


      button.textContent =
        "✕ TỪ CHỐI";


    }

  }



  /* =====================================================
     EVENTS
  ====================================================== */

  searchInput.addEventListener(
    "input",
    render
  );


  statusFilter.addEventListener(
    "change",
    render
  );


  refreshBtn.addEventListener(
    "click",
    loadApplications
  );



  /* =====================================================
     START
  ====================================================== */

  const isAdmin =
    await requireAdmin();


  if (!isAdmin) {

    return;

  }


  loadMessage.textContent =
    "✓ Đã xác nhận quyền Admin.";


  await loadApplications();


})();

</script>
