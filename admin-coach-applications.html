<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#09111f"
  >

  <title>
    Hồ sơ Coach | PickDee Academy
  </title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(185,255,24,.06),
          transparent 30%
        ),
        #09111f;
      color: white;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        Arial,
        sans-serif;
    }

    header {
      min-height: 72px;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom:
        1px solid #26364b;
      background:
        rgba(9,17,31,.96);
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
    }

    .brand span {
      color: #b9ff18;
    }

    .back {
      color: #b9ff18;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    main {
      width:
        min(
          1180px,
          calc(100% - 32px)
        );
      margin: auto;
      padding:
        36px 0 70px;
    }

    .eyebrow {
      color: #b9ff18;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .09em;
    }

    h1 {
      margin:
        7px 0 8px;
      font-size:
        clamp(
          34px,
          6vw,
          54px
        );
    }

    .intro {
      margin: 0 0 25px;
      color: #aab6c5;
      line-height: 1.6;
    }


    /* =====================================================
       SUMMARY
    ====================================================== */

    .summary {
      display: grid;
      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 18px;
      border:
        1px solid #26364b;
      border-radius: 14px;
      background: #0e1b2d;
    }

    .summary-label {
      color: #9eabba;
      font-size: 12px;
      font-weight: 800;
    }

    .summary-number {
      margin-top: 6px;
      font-size: 29px;
      font-weight: 900;
    }

    .green {
      color: #b9ff18;
    }

    .yellow {
      color: #ffd66b;
    }

    .red {
      color: #ff8e8e;
    }


    /* =====================================================
       TOOLBAR
    ====================================================== */

    .toolbar {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns:
        1fr 190px auto;
      gap: 10px;
    }

    input,
    select,
    button {
      min-height: 44px;
      border-radius: 9px;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding:
        0 13px;
      border:
        1px solid #34475e;
      outline: none;
      background: #0e1b2d;
      color: white;
    }

    input:focus,
    select:focus {
      border-color: #b9ff18;
    }

    button {
      border:
        1px solid #3a4b61;
      padding:
        0 15px;
      background: #17263a;
      color: white;
      cursor: pointer;
      font-weight: 900;
    }

    button:hover:not(:disabled) {
      border-color: #b9ff18;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #message {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    #message.show {
      display: block;
    }

    #message.success {
      color: #dfff85;
      border:
        1px solid rgba(185,255,24,.25);
      background:
        rgba(185,255,24,.07);
    }

    #message.error {
      color: #ffb2b2;
      border:
        1px solid rgba(255,100,100,.30);
      background:
        rgba(255,70,70,.08);
    }


    /* =====================================================
       LIST
    ====================================================== */

    .list {
      display: grid;
      gap: 14px;
    }

    .application {
      overflow: hidden;
      border:
        1px solid #26364b;
      border-radius: 15px;
      background: #0e1b2d;
    }

    .application-top {
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    .application-code {
      margin-bottom: 5px;
      color: #ffd66b;
      font-size: 12px;
      font-weight: 900;
    }

    .application-name {
      color: #d8ff45;
      font-size: 20px;
      font-weight: 900;
    }

    .status {
      flex: 0 0 auto;
      padding:
        7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .status.pending {
      color: #07101b;
      background: #ffd66b;
    }

    .status.approved {
      color: #07101b;
      background: #b9ff18;
    }

    .status.rejected {
      color: white;
      background: #c94c59;
    }

    .application-body {
      padding: 18px 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );
      gap: 13px 22px;
    }

    .info {
      min-width: 0;
    }

    .label {
      margin-bottom: 4px;
      color: #718399;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .05em;
    }

    .value {
      color: #dbe4ee;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .long-info {
      grid-column: 1 / -1;
    }

    .admin-note {
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      background:
        rgba(255,255,255,.045);
      color: #b8c4d1;
      font-size: 13px;
      line-height: 1.5;
    }


    /* =====================================================
       ACTIONS
    ====================================================== */

    .actions {
      padding:
        0 20px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .approve-btn {
      border: 0;
      background: #b9ff18;
      color: #07101b;
    }

    .reject-btn {
      border:
        1px solid rgba(255,100,100,.50);
      background:
        rgba(255,70,70,.10);
      color: #ffb0b0;
    }

    .processing {
      pointer-events: none;
      opacity: .6;
    }

    .empty {
      padding: 40px 20px;
      border:
        1px solid #26364b;
      border-radius: 14px;
      background: #0e1b2d;
      color: #8393a6;
      text-align: center;
    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media(max-width:800px) {

      .summary {
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .long-info {
        grid-column: auto;
      }

    }

    @media(max-width:520px) {

      main {
        width:
          min(
            100% - 22px,
            1180px
          );
        padding-top: 25px;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .application-top {
        flex-direction: column;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .actions button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="brand">
    PickDee<span>Academy</span>
  </div>

  <a
    href="./admin"
    class="back"
  >
    ← TRUNG TÂM QUẢN TRỊ
  </a>

</header>



<main>


  <div class="eyebrow">
    PICKDEE ADMIN
  </div>


  <h1>
    Hồ sơ đăng ký Coach
  </h1>


  <p class="intro">
    Xem, duyệt hoặc từ chối hồ sơ Coach đăng ký tham gia hệ thống PickDee Academy.
  </p>



  <!-- =====================================================
       SUMMARY
  ====================================================== -->

  <div class="summary">


    <div class="summary-card">

      <div class="summary-label">
        TỔNG HỒ SƠ
      </div>

      <div
        id="totalCount"
        class="summary-number green"
      >
        ...
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        CHỜ DUYỆT
      </div>

      <div
        id="pendingCount"
        class="summary-number yellow"
      >
        ...
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        ĐÃ DUYỆT
      </div>

      <div
        id="approvedCount"
        class="summary-number green"
      >
        ...
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        TỪ CHỐI
      </div>

      <div
        id="rejectedCount"
        class="summary-number red"
      >
        ...
      </div>

    </div>


  </div>



  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

  <div class="toolbar">

    <input
      id="searchInput"
      type="search"
      placeholder="Tìm mã hồ sơ, tên, SĐT, email..."
      autocomplete="off"
    >


    <select id="statusFilter">

      <option value="all">
        Tất cả trạng thái
      </option>

      <option value="pending">
        Chờ duyệt
      </option>

      <option value="approved">
        Đã duyệt
      </option>

      <option value="rejected">
        Từ chối
      </option>

    </select>


    <button
      id="refreshBtn"
      type="button"
    >
      ↻ CẬP NHẬT
    </button>

  </div>



  <div id="message"></div>


  <div
    id="applicationList"
    class="list"
  >

    <div class="empty">
      Đang tải hồ sơ...
    </div>

  </div>


</main>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="./config.js"></script>



<script>

(async function () {


  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const list =
    document.getElementById(
      "applicationList"
    );


  const message =
    document.getElementById(
      "message"
    );


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  const totalCount =
    document.getElementById(
      "totalCount"
    );


  const pendingCount =
    document.getElementById(
      "pendingCount"
    );


  const approvedCount =
    document.getElementById(
      "approvedCount"
    );


  const rejectedCount =
    document.getElementById(
      "rejectedCount"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    list.innerHTML = `
      <div class="empty">
        Không tải được cấu hình Supabase.
      </div>
    `;

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  let applications = [];

  let isProcessing =
    false;



  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function showMessage(
    text,
    type = "success"
  ) {

    message.className =
      `show ${type}`;

    message.textContent =
      text;

  }


  function clearMessage() {

    message.className =
      "";

    message.textContent =
      "";

  }


  function formatMoney(value) {

    const number =
      Number(
        value || 0
      );


    if (!number) {
      return "Chưa khai báo";
    }


    return (
      number.toLocaleString(
        "vi-VN"
      )
      +
      "đ / buổi"
    );

  }


  function formatDate(value) {

    if (!value) {
      return "—";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "—";

    }


    return date.toLocaleString(
      "vi-VN",
      {
        timeZone:
          "Asia/Ho_Chi_Minh",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  }


  function statusText(status) {

    if (
      status === "approved"
    ) {
      return "ĐÃ DUYỆT";
    }


    if (
      status === "rejected"
    ) {
      return "TỪ CHỐI";
    }


    return "CHỜ DUYỆT";

  }


  function statusClass(status) {

    if (
      status === "approved"
    ) {
      return "approved";
    }


    if (
      status === "rejected"
    ) {
      return "rejected";
    }


    return "pending";

  }


  function arrayText(value) {

    if (
      Array.isArray(value)
    ) {

      return value
        .filter(Boolean)
        .join(", ");

    }


    return String(
      value || ""
    );

  }



  /* =====================================================
     CHECK ADMIN
  ====================================================== */

  async function checkAdmin() {


    const {
      data: userData,
      error: userError
    } =
      await sb.auth
        .getUser();


    if (
      userError
      ||
      !userData?.user
    ) {

      location.replace(
        "./?v=login"
      );

      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await sb
        .from(
          "profiles"
        )
        .select(
          "role"
        )
        .eq(
          "id",
          userData.user.id
        )
        .maybeSingle();


    if (
      profileError
      ||
      !profile
      ||
      String(
        profile.role || ""
      )
        .trim()
        .toLowerCase()
      !==
      "admin"
    ) {

      location.replace(
        "./"
      );

      return false;

    }


    return true;

  }



  /* =====================================================
     SUMMARY
  ====================================================== */

  function renderSummary() {

    totalCount.textContent =
      applications.length;


    pendingCount.textContent =
      applications.filter(
        item =>
          item.status ===
          "pending"
      ).length;


    approvedCount.textContent =
      applications.filter(
        item =>
          item.status ===
          "approved"
      ).length;


    rejectedCount.textContent =
      applications.filter(
        item =>
          item.status ===
          "rejected"
      ).length;

  }



  /* =====================================================
     FILTER
  ====================================================== */

  function filteredRows() {

    const keyword =
      String(
        searchInput.value || ""
      )
        .trim()
        .toLowerCase();


    const status =
      statusFilter.value;


    return applications.filter(
      function (item) {


        if (
          status !== "all"
          &&
          item.status !== status
        ) {

          return false;

        }


        if (!keyword) {
          return true;
        }


        const haystack =
          [

            item.application_code,

            item.full_name,

            item.phone,

            item.email,

            item.preferred_area,

            item.preferred_ward

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


        return haystack.includes(
          keyword
        );

      }
    );

  }



  /* =====================================================
     RENDER
  ====================================================== */

  function renderApplications() {

    const rows =
      filteredRows();


    if (
      rows.length === 0
    ) {

      list.innerHTML = `
        <div class="empty">
          Không có hồ sơ phù hợp.
        </div>
      `;

      return;

    }


    list.innerHTML =
      rows
        .map(
          function (item) {


            const area =
              [
                item.preferred_area,
                item.preferred_ward
              ]
                .filter(Boolean)
                .join(" • ");


            return `

              <article
                class="application"
                data-application-id="${Number(
                  item.id
                )}"
              >


                <div class="application-top">


                  <div>

                    <div class="application-code">

                      ${escapeHtml(
                        item.application_code
                        ||
                        ""
                      )}

                    </div>


                    <div class="application-name">

                      ${escapeHtml(
                        item.full_name
                        ||
                        "Coach đăng ký"
                      )}

                    </div>

                  </div>


                  <div
                    class="
                      status
                      ${statusClass(
                        item.status
                      )}
                    "
                  >

                    ${statusText(
                      item.status
                    )}

                  </div>


                </div>


                <div class="application-body">


                  <div class="info-grid">


                    <div class="info">

                      <div class="label">
                        SỐ ĐIỆN THOẠI
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          item.phone
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info">

                      <div class="label">
                        EMAIL
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          item.email
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info">

                      <div class="label">
                        KHU VỰC
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          area
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info">

                      <div class="label">
                        MỨC CÔNG MONG MUỐN
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          formatMoney(
                            item.expected_rate
                          )
                        )}

                      </div>

                    </div>


                    <div class="info">

                      <div class="label">
                        SỐ NĂM CHƠI
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          item.years_playing
                          ??
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info">

                      <div class="label">
                        SỐ NĂM COACH
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          item.years_coaching
                          ??
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info long-info">

                      <div class="label">
                        CHUYÊN MÔN
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          arrayText(
                            item.specialties
                          )
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info long-info">

                      <div class="label">
                        CHƯƠNG TRÌNH CÓ THỂ DẠY
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          arrayText(
                            item.programs
                          )
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    <div class="info long-info">

                      <div class="label">
                        THỜI GIAN CÓ THỂ DẠY
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          item.available_time
                          ||
                          "—"
                        )}

                      </div>

                    </div>


                    ${
                      item.bio
                        ?
                        `

                          <div class="info long-info">

                            <div class="label">
                              GIỚI THIỆU
                            </div>

                            <div class="value">
                              ${escapeHtml(
                                item.bio
                              )}
                            </div>

                          </div>

                        `
                        :
                        ""
                    }


                    ${
                      item.achievements
                        ?
                        `

                          <div class="info long-info">

                            <div class="label">
                              THÀNH TÍCH
                            </div>

                            <div class="value">
                              ${escapeHtml(
                                item.achievements
                              )}
                            </div>

                          </div>

                        `
                        :
                        ""
                    }


                    <div class="info">

                      <div class="label">
                        NGÀY GỬI
                      </div>

                      <div class="value">

                        ${escapeHtml(
                          formatDate(
                            item.created_at
                          )
                        )}

                      </div>

                    </div>


                  </div>


                  ${
                    item.admin_note
                      ?
                      `

                        <div class="admin-note">

                          <strong>
                            Ghi chú Admin:
                          </strong>

                          ${escapeHtml(
                            item.admin_note
                          )}

                        </div>

                      `
                      :
                      ""
                  }


                </div>


                ${
                  item.status ===
                  "pending"
                    ?
                    `

                      <div class="actions">

                        <button
                          type="button"
                          class="approve-btn"
                          data-action="approve"
                          data-id="${Number(
                            item.id
                          )}"
                          data-name="${escapeHtml(
                            item.full_name || ""
                          )}"
                        >

                          ✓ DUYỆT COACH

                        </button>


                        <button
                          type="button"
                          class="reject-btn"
                          data-action="reject"
                          data-id="${Number(
                            item.id
                          )}"
                          data-name="${escapeHtml(
                            item.full_name || ""
                          )}"
                        >

                          ✕ TỪ CHỐI

                        </button>

                      </div>

                    `
                    :
                    ""
                }


              </article>

            `;

          }
        )
        .join("");

  }



  /* =====================================================
     LOAD DATA
  ====================================================== */

  async function loadApplications() {

    clearMessage();


    refreshBtn.disabled =
      true;


    refreshBtn.textContent =
      "ĐANG CẬP NHẬT...";


    try {


      const {
        data,
        error
      } =
        await sb
          .from(
            "coach_applications"
          )
          .select(`
            id,
            application_code,
            full_name,
            phone,
            email,
            preferred_area,
            preferred_ward,
            years_playing,
            years_coaching,
            specialties,
            programs,
            available_time,
            expected_rate,
            bio,
            achievements,
            status,
            admin_note,
            reviewed_at,
            created_at,
            updated_at
          `)
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (error) {
        throw error;
      }


      applications =
        Array.isArray(data)
          ?
          data
          :
          [];


      renderSummary();

      renderApplications();


    }
    catch (error) {


      console.error(
        "Load coach applications:",
        error
      );


      list.innerHTML = `
        <div class="empty">
          Không tải được hồ sơ Coach.
        </div>
      `;


      showMessage(
        "Không tải được hồ sơ Coach: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );


    }
    finally {


      refreshBtn.disabled =
        false;


      refreshBtn.textContent =
        "↻ CẬP NHẬT";


    }

  }



  /* =====================================================
     DUYỆT COACH
  ====================================================== */

  async function approveApplication(
    applicationId,
    coachName
  ) {


    if (isProcessing) {
      return;
    }


    const confirmed =
      window.confirm(
        `Duyệt hồ sơ Coach "${coachName || ""}"?\n\nSau khi duyệt, Coach sẽ được tạo trong danh sách Coach PickDee.`
      );


    if (!confirmed) {
      return;
    }


    isProcessing =
      true;


    clearMessage();


    list.classList.add(
      "processing"
    );


    showMessage(
      "Đang duyệt hồ sơ Coach...",
      "success"
    );


    try {


      const {
        data,
        error
      } =
        await sb.rpc(
          "admin_approve_coach_application",
          {
            p_application_id:
              Number(
                applicationId
              ),

            p_admin_note:
              null
          }
        );


      if (error) {
        throw error;
      }


      console.log(
        "APPROVE COACH RESULT:",
        data
      );


      showMessage(
        "✓ Đã duyệt Coach thành công.",
        "success"
      );


      await loadApplications();


      if (
        window.PickDeeNotifications
        &&
        typeof
          window
            .PickDeeNotifications
            .refresh
        ===
        "function"
      ) {

        await window
          .PickDeeNotifications
          .refresh();

      }


    }
    catch (error) {


      console.error(
        "Approve coach application:",
        error
      );


      showMessage(
        "KHÔNG DUYỆT ĐƯỢC COACH: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );


      window.alert(
        "Không duyệt được Coach:\n\n"
        +
        (
          error?.message
          ||
          error
        )
      );


    }
    finally {


      isProcessing =
        false;


      list.classList.remove(
        "processing"
      );


    }

  }



  /* =====================================================
     TỪ CHỐI
  ====================================================== */

  async function rejectApplication(
    applicationId,
    coachName
  ) {


    if (isProcessing) {
      return;
    }


    const note =
      window.prompt(
        `Lý do từ chối hồ sơ "${coachName || ""}":`,
        ""
      );


    /*
      Cancel prompt
    */

    if (note === null) {
      return;
    }


    const confirmed =
      window.confirm(
        "Xác nhận TỪ CHỐI hồ sơ Coach này?"
      );


    if (!confirmed) {
      return;
    }


    isProcessing =
      true;


    clearMessage();


    list.classList.add(
      "processing"
    );


    showMessage(
      "Đang từ chối hồ sơ...",
      "success"
    );


    try {


      const {
        data,
        error
      } =
        await sb.rpc(
          "admin_reject_coach_application",
          {
            p_application_id:
              Number(
                applicationId
              ),

            p_admin_note:
              String(
                note || ""
              ).trim()
              ||
              null
          }
        );


      if (error) {
        throw error;
      }


      console.log(
        "REJECT COACH RESULT:",
        data
      );


      showMessage(
        "✓ Đã từ chối hồ sơ.",
        "success"
      );


      await loadApplications();


      if (
        window.PickDeeNotifications
        &&
        typeof
          window
            .PickDeeNotifications
            .refresh
        ===
        "function"
      ) {

        await window
          .PickDeeNotifications
          .refresh();

      }


    }
    catch (error) {


      console.error(
        "Reject coach application:",
        error
      );


      showMessage(
        "KHÔNG TỪ CHỐI ĐƯỢC HỒ SƠ: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );


      window.alert(
        "Không từ chối được hồ sơ:\n\n"
        +
        (
          error?.message
          ||
          error
        )
      );


    }
    finally {


      isProcessing =
        false;


      list.classList.remove(
        "processing"
      );


    }

  }



  /* =====================================================
     CLICK HANDLER DUY NHẤT
     Không dùng onclick inline
  ====================================================== */

  list.addEventListener(
    "click",
    async function (event) {


      const button =
        event.target.closest(
          "button[data-action]"
        );


      if (!button) {
        return;
      }


      event.preventDefault();

      event.stopPropagation();


      const action =
        button.dataset.action;


      const id =
        Number(
          button.dataset.id
        );


      const name =
        button.dataset.name || "";


      if (
        !Number.isFinite(id)
      ) {

        showMessage(
          "Không xác định được ID hồ sơ.",
          "error"
        );

        return;

      }


      if (
        action === "approve"
      ) {

        await approveApplication(
          id,
          name
        );

        return;

      }


      if (
        action === "reject"
      ) {

        await rejectApplication(
          id,
          name
        );

      }


    }
  );



  /* =====================================================
     SEARCH / FILTER / REFRESH
  ====================================================== */

  searchInput.addEventListener(
    "input",
    renderApplications
  );


  statusFilter.addEventListener(
    "change",
    renderApplications
  );


  refreshBtn.addEventListener(
    "click",
    loadApplications
  );



  /* =====================================================
     START
  ====================================================== */

  const adminOk =
    await checkAdmin();


  if (!adminOk) {
    return;
  }


  await loadApplications();


})();

</script>

<script>

(function () {


  let approvingCoach = false;

  let extraCoachData =
    new Map();

  let enhanceTimer =
    null;


  /* =====================================================
     SUPABASE CLIENT
  ====================================================== */

  function getApproveClient() {

    const cfg =
      window.PICKDEE_CONFIG
      ||
      {};


    if (
      !window.supabase
      ||
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      throw new Error(
        "Không tìm thấy cấu hình Supabase."
      );

    }


    return window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );

  }


  /* =====================================================
     ESCAPE HTML
  ====================================================== */

  function safeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     TẢI TRÌNH ĐỘ + CHỨNG CHỈ
  ====================================================== */

  async function loadExtraCoachData() {

    try {

      const sb =
        getApproveClient();


      const {
        data,
        error
      } =
        await sb
          .from(
            "coach_applications"
          )
          .select(`
            id,
            pickleball_level,
            qualifications
          `);


      if (error) {
        throw error;
      }


      extraCoachData =
        new Map(
          (
            Array.isArray(data)
              ?
              data
              :
              []
          )
            .map(
              item => [
                Number(item.id),
                item
              ]
            )
        );


      enhanceApplicationCards();

    }
    catch (error) {

      console.error(
        "LOAD COACH EXTRA DATA:",
        error
      );

    }

  }


  /* =====================================================
     BỔ SUNG DỮ LIỆU VÀ SELECT HẠNG COACH
  ====================================================== */

   /* =====================================================
     DUYỆT COACH - HANDLER TRỰC TIẾP
  ====================================================== */

  async function handleApproveCoach(
    event,
    button
  ) {


    event.preventDefault();

    event.stopPropagation();

    event.stopImmediatePropagation();


    if (approvingCoach) {
      return false;
    }


    const applicationId =
      Number(
        button.dataset.id
      );


    if (
      !Number.isFinite(
        applicationId
      )
    ) {

      showApproveError(
        "Không xác định được ID hồ sơ Coach."
      );

      return false;

    }


    const card =
      button.closest(
        ".application"
      );


    const tierSelect =
      card
        ?.querySelector(
          ".coach-tier-select"
        );


    const compensationTier =
      tierSelect?.value
      ===
      "certified"
        ?
        "certified"
        :
        "standard";


    const tierLabel =
      compensationTier
      ===
      "certified"
        ?
        "Coach Chứng nhận"
        :
        "Coach Tiêu chuẩn";


    const confirmed =
      window.confirm(
        "Xác nhận duyệt hồ sơ này thành "
        +
        tierLabel
        +
        "?"
      );


    if (!confirmed) {
      return false;
    }


    const originalText =
      button.textContent;


    approvingCoach =
      true;


    button.disabled =
      true;


    if (tierSelect) {

      tierSelect.disabled =
        true;

    }


    button.textContent =
      "ĐANG DUYỆT...";


    showApproveStatus(
      "Đang duyệt hồ sơ thành "
      +
      tierLabel
      +
      "..."
    );


    try {


      const approveSb =
        getApproveClient();


      const {
        data: sessionData,
        error: sessionError
      } =
        await approveSb.auth
          .getSession();


      if (sessionError) {
        throw sessionError;
      }


      if (
        !sessionData
        ||
        !sessionData.session
      ) {

        throw new Error(
          "Phiên đăng nhập Admin đã hết. Hãy đăng nhập lại."
        );

      }


      const {
        data,
        error
      } =
        await approveSb.rpc(
          "admin_approve_coach_application",
          {

            p_application_id:
              applicationId,

            p_compensation_tier:
              compensationTier,

            p_admin_note:
              null

          }
        );


      if (error) {
        throw error;
      }


      console.log(
        "APPROVE COACH SUCCESS:",
        data
      );


      showApproveSuccess(
        "✓ ĐÃ DUYỆT "
        +
        tierLabel.toUpperCase()
        +
        " THÀNH CÔNG"
      );


      button.textContent =
        "✓ ĐÃ DUYỆT";


      try {

        if (
          window.PickDeeNotifications
          &&
          typeof
            window
              .PickDeeNotifications
              .refresh
          ===
          "function"
        ) {

          await window
            .PickDeeNotifications
            .refresh();

        }

      }
      catch (_) {}


      setTimeout(
        function () {

          window.location.href =
            "./admin-coach-applications?v="
            +
            Date.now();

        },
        1000
      );


    }
    catch (error) {


      console.error(
        "APPROVE COACH ERROR:",
        error
      );


      showApproveError(
        "KHÔNG DUYỆT ĐƯỢC COACH: "
        +
        (
          error?.message
          ||
          String(error)
        )
      );


      button.disabled =
        false;


      if (tierSelect) {

        tierSelect.disabled =
          false;

      }


      button.textContent =
        originalText;


    }
    finally {


      approvingCoach =
        false;


    }


    return false;

  }


  /* =====================================================
     BỔ SUNG DỮ LIỆU + HẠNG COACH + GẮN NÚT
  ====================================================== */

  function enhanceApplicationCards() {


    const cards =
      document.querySelectorAll(
        ".application[data-application-id]"
      );


    cards.forEach(
      function (card) {


        const applicationId =
          Number(
            card.dataset.applicationId
          );


        if (
          !Number.isFinite(
            applicationId
          )
        ) {
          return;
        }


        const extra =
          extraCoachData.get(
            applicationId
          )
          ||
          {};


        /* ==============================
           TRÌNH ĐỘ + CHỨNG CHỈ
        ============================== */

        const infoGrid =
          card.querySelector(
            ".info-grid"
          );


        if (
          infoGrid
          &&
          !card.querySelector(
            ".pickdee-extra-coach-info"
          )
        ) {


          const block =
            document.createElement(
              "div"
            );


          block.className =
            "pickdee-extra-coach-info";


          block.style.display =
            "contents";


          block.innerHTML =
            `

              <div class="info">

                <div class="label">
                  TRÌNH ĐỘ PICKLEBALL
                </div>

                <div class="value">
                  ${safeHtml(
                    extra.pickleball_level
                    ||
                    "—"
                  )}
                </div>

              </div>


              <div class="info">

                <div class="label">
                  BẰNG CẤP / CHỨNG CHỈ
                </div>

                <div class="value">
                  ${safeHtml(
                    extra.qualifications
                    ||
                    "—"
                  )}
                </div>

              </div>

            `;


          infoGrid.appendChild(
            block
          );

        }


        /* ==============================
           HẠNG COACH
        ============================== */

        const actions =
          card.querySelector(
            ".actions"
          );


        if (!actions) {
          return;
        }


        const approveButton =
          actions.querySelector(
            ".approve-btn[data-id]"
          );


        if (!approveButton) {
          return;
        }


        if (
          !actions.querySelector(
            ".coach-tier-box"
          )
        ) {


          const tierBox =
            document.createElement(
              "div"
            );


          tierBox.className =
            "coach-tier-box";


          tierBox.innerHTML =
            `

              <label>
                HẠNG COACH KHI DUYỆT
              </label>

              <select
                class="coach-tier-select"
                data-tier-for="${applicationId}"
              >

                <option value="standard">
                  Coach Tiêu chuẩn
                </option>

                <option value="certified">
                  Coach Chứng nhận
                </option>

              </select>

            `;


          actions.insertBefore(
            tierBox,
            approveButton
          );

        }


        /* ==============================
           GẮN CLICK TRỰC TIẾP VÀO NÚT
        ============================== */

        approveButton.onclick =
          function (event) {

            return handleApproveCoach(
              event,
              approveButton
            );

          };


      }
    );

  }


  /* =====================================================
     THEO DÕI DANH SÁCH RENDER LẠI
  ====================================================== */

  function scheduleEnhance() {


    clearTimeout(
      enhanceTimer
    );


    enhanceTimer =
      setTimeout(
        enhanceApplicationCards,
        50
      );

  }


  const applicationList =
    document.getElementById(
      "applicationList"
    );


  if (applicationList) {


    const observer =
      new MutationObserver(
        scheduleEnhance
      );


    observer.observe(
      applicationList,
      {
        childList: true,
        subtree: true
      }
    );


  }


  enhanceApplicationCards();


  function getStatusBox() {


    let box =
      document.getElementById(
        "coachApproveStatusBox"
      );


    if (box) {
      return box;
    }


    box =
      document.createElement(
        "div"
      );


    box.id =
      "coachApproveStatusBox";


    box.style.cssText = `

      position: fixed;

      left: 50%;

      bottom: 24px;

      transform:
        translateX(-50%);

      z-index: 999999;

      width:
        min(
          600px,
          calc(100vw - 30px)
        );

      padding:
        15px 18px;

      border-radius:
        12px;

      background:
        #13243a;

      color:
        white;

      border:
        1px solid
        #3a506b;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);

      font-size:
        14px;

      font-weight:
        900;

      line-height:
        1.5;

      display:
        none;

    `;


    document.body.appendChild(
      box
    );


    return box;

  }


  function showApproveStatus(
    text
  ) {


    const box =
      getStatusBox();


    box.style.display =
      "block";


    box.style.background =
      "#13243a";


    box.style.borderColor =
      "#54708f";


    box.style.color =
      "#ffffff";


    box.textContent =
      text;

  }


  function showApproveSuccess(
    text
  ) {


    const box =
      getStatusBox();


    box.style.display =
      "block";


    box.style.background =
      "#203514";


    box.style.borderColor =
      "#b9ff18";


    box.style.color =
      "#dfff85";


    box.textContent =
      text;

  }


  function showApproveError(
    text
  ) {


    const box =
      getStatusBox();


    box.style.display =
      "block";


    box.style.background =
      "#3b1820";


    box.style.borderColor =
      "#ff8e8e";


    box.style.color =
      "#ffb6b6";


    box.textContent =
      text;

  }


  /* =====================================================
     START
  ====================================================== */

  loadExtraCoachData();


})();

</script>

<script>

(function () {


  const cfg =
    window.PICKDEE_CONFIG
    ||
    {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    console.warn(
      "Không tải được ảnh hồ sơ Coach: thiếu Supabase config."
    );

    return;

  }


  const avatarSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  let avatarMap =
    new Map();


  let avatarTimer =
    null;



  /* =====================================================
     TẢI AVATAR_PATH
  ====================================================== */

  async function loadCoachApplicationAvatars() {


    try {


      const {
        data,
        error
      } =
        await avatarSb
          .from(
            "coach_applications"
          )
          .select(`
            id,
            avatar_path
          `);


      if (error) {
        throw error;
      }


      avatarMap =
        new Map(
          (
            Array.isArray(data)
              ?
              data
              :
              []
          )
            .map(
              item => [
                Number(item.id),
                item.avatar_path
                ||
                null
              ]
            )
        );


      renderCoachApplicationAvatars();


    }
    catch (error) {


      console.error(
        "LOAD COACH APPLICATION AVATARS:",
        error
      );


    }

  }



  /* =====================================================
     RENDER ẢNH VÀO CARD
  ====================================================== */

  function renderCoachApplicationAvatars() {


    const cards =
      document.querySelectorAll(
        ".application[data-application-id]"
      );


    cards.forEach(
      function (card) {


        if (
          card.querySelector(
            ".coach-application-avatar-box"
          )
        ) {
          return;
        }


        const applicationId =
          Number(
            card.dataset.applicationId
          );


        if (
          !Number.isFinite(
            applicationId
          )
        ) {
          return;
        }


        const avatarPath =
          avatarMap.get(
            applicationId
          );


        if (!avatarPath) {
          return;
        }


        const {
          data
        } =
          avatarSb
            .storage
            .from(
              "avatars"
            )
            .getPublicUrl(
              avatarPath
            );


        const publicUrl =
          data?.publicUrl
          ||
          "";


        if (!publicUrl) {
          return;
        }


        const applicationBody =
          card.querySelector(
            ".application-body"
          );


        if (!applicationBody) {
          return;
        }


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "coach-application-avatar-box";


        box.innerHTML =
          `

            <div
              class="coach-application-avatar-title"
            >
              ẢNH ĐẠI DIỆN
            </div>

            <img
              class="coach-application-avatar"
              src="${publicUrl}"
              alt="Ảnh đại diện Coach"
              loading="lazy"
            >

          `;


        card.insertBefore(
          box,
          applicationBody
        );


      }
    );

  }



  /* =====================================================
     CARD CÓ THỂ RENDER LẠI SAU FILTER / REFRESH
  ====================================================== */

  function scheduleAvatarRender() {


    clearTimeout(
      avatarTimer
    );


    avatarTimer =
      setTimeout(
        renderCoachApplicationAvatars,
        60
      );


  }


  const applicationList =
    document.getElementById(
      "applicationList"
    );


  if (applicationList) {


    const observer =
      new MutationObserver(
        scheduleAvatarRender
      );


    observer.observe(
      applicationList,
      {
        childList: true,
        subtree: true
      }
    );


  }


  loadCoachApplicationAvatars();


})();

</script>
</body>
