<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Chi tiết buổi học | PickDee Academy
  </title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;

      border-bottom:
        1px solid
        rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    #userEmail {
      color:
        rgba(255,255,255,.72);

      font-size: 13px;
      font-weight: 700;
    }

    .container {
      width:
        min(
          900px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        32px 0 60px;
    }

    .back {
      color: #d8ff45;

      text-decoration: none;

      font-weight: 800;
    }

    .eyebrow {
      margin-top: 26px;

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    h1 {
      margin:
        8px 0 6px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );
    }

    .sub {
      color:
        rgba(255,255,255,.65);

      margin-bottom: 24px;

      line-height: 1.5;
    }

    .grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 16px;
    }

    .card {
      padding: 20px;

      border-radius: 16px;

      background:
        rgba(6,39,88,.74);

      border:
        1px solid
        rgba(255,255,255,.12);
    }

    .card h2 {
      margin:
        0 0 18px;

      font-size: 20px;
    }

    .item {
      margin-bottom: 15px;
    }

    .label {
      color:
        rgba(255,255,255,.5);

      font-size: 12px;

      margin-bottom: 4px;
    }

    .value {
      font-weight: 800;

      line-height: 1.45;
    }

    .badge {
      display: inline-block;

      padding:
        6px 10px;

      border-radius: 999px;

      color: #d8ff45;

      background:
        rgba(216,255,69,.12);

      font-size: 12px;

      font-weight: 900;
    }

    .badge.finished {
      color: #9dffcf;

      background:
        rgba(50,220,140,.12);
    }

    .badge.absent {
      color: #ffb3b3;

      background:
        rgba(255,100,100,.12);
    }

    .actions {
      margin-top: 18px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    button {
      min-height: 52px;

      border: 0;

      border-radius: 11px;

      font-weight: 900;

      cursor: pointer;

      font-size: 14px;
    }

    .complete {
      background: #d8ff45;

      color: #172600;
    }

    .absent {
      background: #ffb3b3;

      color: #401010;
    }

    button:disabled {
      opacity: .45;

      cursor:
        not-allowed;
    }

    #message {
      margin-top: 15px;

      font-weight: 800;

      line-height: 1.5;
    }

    #message.info {
      color: #ffd884;
    }

    #message.success {
      color: #d8ff45;
    }

    #message.error {
      color: #ffb0b0;
    }

    @media (max-width: 700px) {

      .grid,
      .actions {
        grid-template-columns:
          1fr;
      }

      .topbar {
        padding:
          16px 14px;
      }

    }

  </style>
</head>


<body>


<header class="topbar">

  <div class="brand">
    PickDee
    <span>
      Academy
    </span>
  </div>

  <div id="userEmail">
  </div>

</header>


<main class="container">


  <a
    class="back"
    href="./coach-sessions.html"
  >
    ← Lịch dạy của tôi
  </a>


  <div class="eyebrow">
    CHI TIẾT BUỔI HỌC
  </div>


  <h1 id="sessionCode">
    Đang tải...
  </h1>


  <div
    class="sub"
    id="coachLine"
  >

  </div>


  <section class="grid">


    <div class="card">

      <h2>
        🏓 Buổi học
      </h2>


      <div class="item">

        <div class="label">
          Học viên
        </div>

        <div
          class="value"
          id="studentName"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Buổi số
        </div>

        <div
          class="value"
          id="sessionNo"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Trạng thái
        </div>

        <div class="value">

          <span
            class="badge"
            id="status"
          >
            —
          </span>

        </div>

      </div>


    </div>


    <div class="card">

      <h2>
        📅 Lịch & sân
      </h2>


      <div class="item">

        <div class="label">
          Ngày học
        </div>

        <div
          class="value"
          id="sessionDate"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Giờ bắt đầu
        </div>

        <div
          class="value"
          id="startTime"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Thời lượng
        </div>

        <div
          class="value"
          id="duration"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Sân
        </div>

        <div
          class="value"
          id="courtName"
        >
          —
        </div>

      </div>


    </div>


  </section>


  <section
    class="card"
    style="margin-top:16px"
  >

    <h2>
      📝 Ghi chú
    </h2>

    <div id="note">
      —
    </div>

  </section>


  <div class="actions">

    <button
      id="completeBtn"
      class="complete"
      type="button"
      disabled
    >
      ✓ HOÀN THÀNH BUỔI
    </button>


    <button
      id="absentBtn"
      class="absent"
      type="button"
      disabled
    >
      ✕ VẮNG
    </button>

  </div>


  <div
    id="message"
    class="info"
  >
    Đang kiểm tra quyền thao tác...
  </div>


</main>


<script>

window.PICKDEE_NOTIFICATION_ROLE =
  "coach";

</script>


<script src="./notifications.js?v=20260911-3"></script>
<script>
(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const actions =
    document.querySelector(".actions");

  const statusEl =
    document.getElementById("status");

  const messageEl =
    document.getElementById("message");


  if (
    !actions ||
    !statusEl ||
    !window.supabase ||
    !cfg.SUPABASE_URL ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {
    return;
  }


  if (
    document.getElementById("coverBtn")
  ) {
    return;
  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    Number(
      params.get("id") ||
      params.get("session_id")
    );


  if (
    !Number.isFinite(sessionId) ||
    sessionId <= 0
  ) {
    return;
  }


  const supportSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  let processing =
    false;


  const coverBtn =
    document.createElement("button");


  coverBtn.id =
    "coverBtn";

  coverBtn.type =
    "button";

  coverBtn.disabled =
    false;

  coverBtn.textContent =
    "📣 GỌI COACH HỖ TRỢ";

  coverBtn.style.gridColumn =
    "1 / -1";

  coverBtn.style.background =
    "#173e73";

  coverBtn.style.color =
    "#d8ff45";

  coverBtn.style.border =
    "1px solid rgba(216,255,69,.35)";

  coverBtn.style.minHeight =
    "52px";

  coverBtn.style.borderRadius =
    "11px";

  coverBtn.style.fontWeight =
    "900";

  coverBtn.style.cursor =
    "pointer";


  actions.appendChild(
    coverBtn
  );


  function setMessage(
    text,
    type = "info"
  ) {

    if (!messageEl) {
      return;
    }

    messageEl.textContent =
      text;

    messageEl.className =
      type;
  }


  function getStatusFromPage() {

    return String(
      statusEl.textContent || ""
    ).trim();
  }


  function setDefaultButton() {

    coverBtn.textContent =
      "📣 GỌI COACH HỖ TRỢ";
  }


  function setAssignedButton() {

    coverBtn.disabled =
      true;

    coverBtn.textContent =
      "✓ ĐÃ CÓ COACH HỖ TRỢ";
  }


  function setRequestedButton() {

    coverBtn.disabled =
      true;

    coverBtn.textContent =
      "✓ ĐÃ GỌI COACH HỖ TRỢ";
  }


  async function refreshCoverState() {

    if (processing) {
      return;
    }


    const pageStatus =
      getStatusFromPage();


    if (
      pageStatus === "Đã hoàn thành" ||
      pageStatus === "Vắng"
    ) {

      coverBtn.disabled =
        true;

      setDefaultButton();

      return;
    }


    const {
      data,
      error
    } =
      await supportSb
        .from("class_sessions")
        .select(`
          id,
          status,
          substitute_coach_id
        `)
        .eq(
          "id",
          sessionId
        )
        .maybeSingle();


    if (error) {

      console.error(
        "LOAD COACH COVER STATE:",
        error
      );


      if (
        pageStatus === "Chờ học"
      ) {

        coverBtn.disabled =
          false;

        setDefaultButton();

      } else {

        coverBtn.disabled =
          true;

        setDefaultButton();
      }

      return;
    }


    if (!data) {

      coverBtn.disabled =
        true;

      setDefaultButton();

      return;
    }


    if (
      data.substitute_coach_id
    ) {

      setAssignedButton();

      return;
    }


    const status =
      String(
        data.status || ""
      ).trim();


    if (
      status !== "Chờ học"
    ) {

      coverBtn.disabled =
        true;

      setDefaultButton();

      return;
    }


    coverBtn.disabled =
      false;

    setDefaultButton();
  }


  coverBtn.addEventListener(
    "click",
    async function () {

      if (processing) {
        return;
      }


      const currentStatus =
        getStatusFromPage();


      if (
        currentStatus !== "Chờ học"
      ) {

        setMessage(
          "Chỉ buổi đang ở trạng thái Chờ học mới được gọi Coach hỗ trợ.",
          "error"
        );

        await refreshCoverState();

        return;
      }


      const reason =
        window.prompt(
          "Nhập lý do cần Coach hỗ trợ:",
          "Coach chính bận"
        );


      if (reason === null) {
        return;
      }


      const finalReason =
        String(
          reason
        ).trim();


      if (!finalReason) {

        setMessage(
          "Vui lòng nhập lý do cần Coach hỗ trợ.",
          "error"
        );

        return;
      }


      const ok =
        window.confirm(
          "Xác nhận gửi yêu cầu tới các Coach phù hợp trong khu vực?"
        );


      if (!ok) {
        return;
      }


      processing =
        true;


      coverBtn.disabled =
        true;

      coverBtn.textContent =
        "⏳ ĐANG GỌI COACH...";


      setMessage(
        "Đang gửi yêu cầu Coach hỗ trợ...",
        "info"
      );


      try {

        const {
          data,
          error
        } =
          await supportSb.rpc(
            "request_coach_cover",
            {
              p_session_id:
                sessionId,

              p_reason:
                finalReason
            }
          );


        if (error) {
          throw error;
        }


        setRequestedButton();


        setMessage(
          `✓ Đã gửi yêu cầu Coach hỗ trợ. Mã yêu cầu: ${data}.`,
          "success"
        );

      }
      catch (error) {

        console.error(
          "REQUEST COACH COVER:",
          error
        );


        setMessage(
          "Không gửi được yêu cầu Coach hỗ trợ: " +
          (
            error?.message ||
            error
          ),
          "error"
        );


        processing =
          false;


        await refreshCoverState();

        return;
      }


      processing =
        false;

    }
  );


  const statusObserver =
    new MutationObserver(
      function () {

        refreshCoverState();

      }
    );


  statusObserver.observe(
    statusEl,
    {
      childList: true,
      characterData: true,
      subtree: true
    }
  );


  window.addEventListener(
    "pageshow",
    function () {

      refreshCoverState();

    }
  );


  refreshCoverState();

})();
</script>

<script>

(async function () {


  /* =====================================================
     PICKDEE ACADEMY
     COACH SESSION DETAIL

     QUY TẮC:

     - Phải đăng nhập.
     - Phải là đúng Coach của buổi học.
     - Buổi phải tồn tại.
     - Registration REAL chỉ được thao tác
       khi đã thanh toán đủ 100%.
     - Chỉ trạng thái "Chờ học"
       mới được Hoàn thành / Vắng.
     - Backend coach_mark_session()
       là nơi thực hiện thao tác chính thức.
  ====================================================== */


  const cfg =
    window.PICKDEE_CONFIG || {};


  const completeBtn =
    document.getElementById(
      "completeBtn"
    );


  const absentBtn =
    document.getElementById(
      "absentBtn"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    Number(
      params.get("id")
      ||
      params.get("session_id")
    );


  let sb =
    null;


  let currentCoachId =
    null;


  let currentSession =
    null;


  let paymentReady =
    false;


  /* =====================================================
     HELPERS
  ====================================================== */


  function el(id) {

    return document.getElementById(
      id
    );

  }


  function one(value) {

    if (
      Array.isArray(value)
    ) {

      return (
        value[0]
        ||
        null
      );

    }


    return (
      value
      ||
      null
    );

  }


  function show(
    id,
    value
  ) {

    const node =
      el(id);


    if (!node) {

      return;

    }


    node.textContent =
      (
        value === null
        ||
        value === undefined
        ||
        value === ""
      )

        ? "—"

        : value;

  }


  function setMessage(
    text,
    type = "info"
  ) {

    const node =
      el("message");


    node.textContent =
      text || "";


    node.className =
      type;

  }


  function formatDate(
    value
  ) {

    if (!value) {

      return "—";

    }


    return new Intl.DateTimeFormat(
      "vi-VN"
    ).format(
      new Date(
        `${value}T00:00:00`
      )
    );

  }


  function formatTime(
    value
  ) {

    if (!value) {

      return "—";

    }


    return String(
      value
    ).slice(
      0,
      5
    );

  }


  function updateBadge(
    status
  ) {

    const badge =
      el("status");


    badge.classList.remove(
      "finished",
      "absent"
    );


    if (
      status ===
      "Đã hoàn thành"
    ) {

      badge.classList.add(
        "finished"
      );

    }


    if (
      status ===
      "Vắng"
    ) {

      badge.classList.add(
        "absent"
      );

    }

  }


   function lockButtons() {

    completeBtn.disabled =
      true;

    absentBtn.disabled =
      true;

  }


  /* =====================================================
     THỜI ĐIỂM KẾT THÚC BUỔI HỌC

     Ví dụ:
     16/09/2026 10:00
     + 60 phút
     = 16/09/2026 11:00

     Sau 11:00 Coach mới được thao tác.
  ====================================================== */

  function getSessionEndAt() {

    if (
      !currentSession?.session_date
      ||
      !currentSession?.start_time
    ) {

      return null;

    }


    const time =
      String(
        currentSession.start_time
      ).slice(
        0,
        8
      );


    const startAt =
      new Date(
        `${currentSession.session_date}T${time}+07:00`
      );


    if (
      Number.isNaN(
        startAt.getTime()
      )
    ) {

      return null;

    }


    const duration =
      Number(
        currentSession.duration_minutes
        ||
        60
      );


    return new Date(
      startAt.getTime()
      +
      duration * 60 * 1000
    );

  }


  function formatDateTimeVN(
    date
  ) {

    if (!date) {

      return "";

    }


    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        timeZone:
          "Asia/Ho_Chi_Minh",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).format(
      date
    );

  }


  function updateButtons() {

    /*
      MẶC ĐỊNH LUÔN KHÓA.
    */

    lockButtons();


    if (
      !currentSession
    ) {

      return;

    }


    const status =
      String(
        currentSession.status
        ||
        ""
      ).trim();


    /* ===================================================
       ĐÃ XỬ LÝ
    ==================================================== */

    if (
      status ===
      "Đã hoàn thành"
    ) {

      setMessage(
        "✓ Buổi học này đã được hoàn thành.",
        "success"
      );

      return;

    }


    if (
      status ===
      "Vắng"
    ) {

      setMessage(
        "✓ Buổi học này đã được ghi nhận Vắng.",
        "info"
      );

      return;

    }


    /* ===================================================
       KHÔNG PHẢI CHỜ HỌC
    ==================================================== */

    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        `Buổi học hiện có trạng thái "${status}". Không thể điểm danh ở trạng thái này.`,
        "info"
      );

      return;

    }


    /* ===================================================
       PAYMENT GATE
    ==================================================== */

    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "🔒 Gói học chưa được xác nhận thanh toán đủ 100%. Coach không được phép điểm danh hoặc hoàn thành buổi học.",
        "error"
      );

      return;

    }


    /* ===================================================
       TIME GATE
    ==================================================== */

    const endAt =
      getSessionEndAt();


    if (!endAt) {

      setMessage(
        "⚠️ Không xác định được thời điểm kết thúc buổi học. Tạm khóa thao tác.",
        "error"
      );

      return;

    }


    const now =
      new Date();


    if (
      now.getTime()
      <
      endAt.getTime()
    ) {

      setMessage(
        `⏳ CHƯA ĐẾN GIỜ ĐIỂM DANH · Buổi học kết thúc lúc ${formatDateTimeVN(endAt)}. Sau thời điểm này Coach mới được bấm HOÀN THÀNH hoặc VẮNG.`,
        "info"
      );

      return;

    }


    /* ===================================================
       ĐỦ TOÀN BỘ ĐIỀU KIỆN
    ==================================================== */

    completeBtn.disabled =
      false;


    absentBtn.disabled =
      false;


    setMessage(
      "✓ Buổi học đã kết thúc · Đã xác minh đủ học phí · Coach được phép điểm danh.",
      "success"
    );

  }


  /* =====================================================
     SUPABASE
  ====================================================== */


  function initSupabase() {

    if (
      !window.supabase
    ) {

      throw new Error(
        "Không tải được thư viện Supabase."
      );

    }


    if (
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      throw new Error(
        "Không đọc được config.js."
      );

    }


    sb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

  }


  /* =====================================================
     LOGIN + COACH
  ====================================================== */


  async function checkCoach() {

    const {
      data: sessionData,
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (sessionError) {

      throw sessionError;

    }


    if (
      !sessionData?.session
    ) {

      location.replace(
        "./login.html"
      );

      return false;

    }


    show(
      "userEmail",
      sessionData.session
        .user
        .email
        ||
        ""
    );


    const {
      data: coachId,
      error: coachError
    } =
      await sb.rpc(
        "current_coach_id"
      );


    if (coachError) {

      throw new Error(
        "Không xác định được Coach: "
        +
        coachError.message
      );

    }


    if (!coachId) {

      throw new Error(
        "Tài khoản này chưa liên kết với hồ sơ Coach."
      );

    }


    currentCoachId =
      Number(
        coachId
      );


    return true;

  }


  /* =====================================================
     LOAD SESSION
  ====================================================== */


  async function loadSession() {

    if (
      !Number.isFinite(
        sessionId
      )
      ||
      sessionId <= 0
    ) {

      throw new Error(
        "Không tìm thấy ID buổi học."
      );

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "class_sessions"
        )
        .select(`
          id,
          session_code,
          registration_id,
          coach_id,
          session_no,
          session_date,
          start_time,
          duration_minutes,
          court_id,
          court_name,
          status,
          note,

          registrations (
            id,
            registration_code,
            student_id,
            package_name,
            tuition_fee,
            is_test,

            students (
              id,
              student_code,
              full_name
            )
          ),

         coaches!class_sessions_coach_id_fkey (
  id,
  coach_code,
  full_name
)
        `)

        .eq(
          "id",
          sessionId
        )

        .eq(
          "coach_id",
          currentCoachId
        )

        .maybeSingle();


    if (error) {

      throw new Error(
        "Không tải được buổi học: "
        +
        error.message
      );

    }


    if (!data) {

      throw new Error(
        "Không tìm thấy buổi học hoặc bạn không phải Coach phụ trách buổi này."
      );

    }


    currentSession =
      data;


    const registration =
      one(
        data.registrations
      );


    const student =
      one(
        registration
          ?.students
      );


    const coach =
      one(
        data.coaches
      );


    /* ===================================================
       PAYMENT GATE

       Backend là nguồn quyết định.
       Không tự tính tiền ở frontend.
    ==================================================== */


    if (
      !registration?.id
    ) {

      throw new Error(
        "Buổi học chưa liên kết với đăng ký học."
      );

    }


    const {
      data: paidReady,
      error: paidError
    } =
      await sb.rpc(
        "registration_payment_fully_paid",
        {
          p_registration_id:
            Number(
              registration.id
            )
        }
      );


    if (paidError) {

      console.error(
        "PAYMENT GATE:",
        paidError
      );


      throw new Error(
        "Không xác minh được trạng thái học phí. "
        +
        paidError.message
      );

    }


    paymentReady =
      paidReady === true;


    /* ===================================================
       RENDER
    ==================================================== */


    show(
      "sessionCode",
      data.session_code
      ||
      `Buổi ${data.id}`
    );


    const registrationText =
      registration
        ?.registration_code

        ? `Đăng ký: ${registration.registration_code}`

        : "Đăng ký: —";


    const coachText =
      coach?.full_name
      ||
      coach?.coach_code
      ||
      "Coach";


    show(
      "coachLine",
      `${registrationText} · Coach: ${coachText}`
    );


    show(
      "studentName",
      student?.full_name
      ||
      student?.student_code
      ||
      "—"
    );


    show(
      "sessionNo",
      data.session_no
        ? `Buổi ${data.session_no}`
        : "—"
    );


    show(
      "status",
      data.status
    );


    updateBadge(
      data.status
    );


    show(
      "sessionDate",
      formatDate(
        data.session_date
      )
    );


    show(
      "startTime",
      formatTime(
        data.start_time
      )
    );


    show(
      "duration",
      data.duration_minutes
        ? `${data.duration_minutes} phút`
        : "—"
    );


    show(
      "courtName",
      data.court_name
      ||
      "—"
    );


    show(
      "note",
      data.note
      ||
      "Không có ghi chú."
    );


    /* ===================================================
       TRẠNG THÁI QUYỀN
    ==================================================== */


    const status =
      String(
        data.status
        ||
        ""
      ).trim();


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "🔒 Gói học chưa được xác nhận thanh toán đủ 100%. Coach không được phép điểm danh hoặc hoàn thành buổi học.",
        "error"
      );


      updateButtons();

      return;

    }


    if (
      status ===
      "Đã hoàn thành"
    ) {

      setMessage(
        "✓ Buổi học này đã được hoàn thành.",
        "success"
      );


      updateButtons();

      return;

    }


    if (
      status ===
      "Vắng"
    ) {

      setMessage(
        "✓ Buổi học này đã được ghi nhận Vắng.",
        "info"
      );


      updateButtons();

      return;

    }


    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        `Buổi học hiện có trạng thái "${status}". Không thể điểm danh ở trạng thái này.`,
        "info"
      );


      updateButtons();

      return;

    }


    setMessage(
      "✓ Đã xác minh: đúng Coach phụ trách và gói học đã đủ 100% học phí. Buổi học đủ điều kiện thao tác.",
      "success"
    );


    updateButtons();

  }


  /* =====================================================
     MARK SESSION
  ====================================================== */


  async function markSession(
    action
  ) {

    if (
      !currentSession
    ) {

      return;

    }


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "Gói học chưa đủ điều kiện thanh toán.",
        "error"
      );

      return;

    }


    if (
      String(
        currentSession.status
        ||
        ""
      ).trim()
      !==
      "Chờ học"
    ) {

      setMessage(
        "Buổi học này đã được xử lý hoặc không còn ở trạng thái Chờ học.",
        "error"
      );

      return;

    }


    const isCompleted =
      action ===
      "completed";


    const ok =
      window.confirm(

        isCompleted

          ? "Xác nhận học viên đã hoàn thành buổi học này?"

          : "Xác nhận học viên VẮNG buổi học này?"

      );


    if (!ok) {

      return;

    }


    lockButtons();


    setMessage(
      "Đang xử lý...",
      "info"
    );


    /*
      Kiểm tra học phí LẦN CUỐI
      ngay trước khi thao tác.
    */


    const {
      data: freshPaid,
      error: freshPaidError
    } =
      await sb.rpc(
        "registration_payment_fully_paid",
        {
          p_registration_id:
            Number(
              currentSession
                .registration_id
            )
        }
      );


    if (
      freshPaidError
      ||
      freshPaid !== true
    ) {

      console.error(
        "PAYMENT RECHECK:",
        freshPaidError
      );


      paymentReady =
        false;


      setMessage(
        "Không thể thao tác: gói học hiện không còn được xác nhận đủ 100% học phí.",
        "error"
      );


      updateButtons();

      return;

    }


    /*
      RPC DÀNH RIÊNG CHO COACH.

      completed:
      - cập nhật Đã hoàn thành
      - điểm danh Có mặt
      - tạo Công Coach

      absent:
      - cập nhật Vắng
      - điểm danh Vắng
    */


    const {
      data,
      error
    } =
      await sb.rpc(
        "coach_mark_session",
        {

          p_session_id:
            Number(
              currentSession.id
            ),

          p_action:
            action

        }
      );


    if (error) {

      console.error(
        "COACH MARK SESSION:",
        error
      );


      setMessage(
        "Không xử lý được buổi học: "
        +
        (
          error.message
          ||
          error
        ),
        "error"
      );


      updateButtons();

      return;

    }


    const newStatus =
      data?.status
      ||
      (
        isCompleted
          ? "Đã hoàn thành"
          : "Vắng"
      );


    currentSession.status =
      newStatus;


    show(
      "status",
      newStatus
    );


    updateBadge(
      newStatus
    );


    if (
      isCompleted
    ) {

      setMessage(
        "✓ Đã hoàn thành buổi học · ghi Có mặt · tạo Công Coach thành công.",
        "success"
      );

    }
    else {

      setMessage(
        "✓ Đã ghi nhận học viên Vắng.",
        "success"
      );

    }


    updateButtons();

  }


  /* =====================================================
     EVENTS
  ====================================================== */


  completeBtn.addEventListener(
    "click",
    function () {

      markSession(
        "completed"
      );

    }
  );


  absentBtn.addEventListener(
    "click",
    function () {

      markSession(
        "absent"
      );

    }
  );


  /* =====================================================
     INIT
  ====================================================== */


  async function init() {

    lockButtons();


    try {

      initSupabase();


      const ok =
        await checkCoach();


      if (!ok) {

        return;

      }


      await loadSession();

    }
    catch (error) {

      console.error(
        "COACH SESSION DETAIL:",
        error
      );


      show(
        "sessionCode",
        "Không tải được buổi học"
      );


      show(
        "coachLine",
        "—"
      );


      setMessage(
        error?.message
        ||
        "Có lỗi khi tải buổi học.",
        "error"
      );


      lockButtons();

    }

  }


  await init();


})();

</script>

<script>
(function () {

  const noteEl =
    document.getElementById("note");

  if (!noteEl) {
    return;
  }


  let editorCreated =
    false;


  const observer =
    new MutationObserver(
      function () {

        createNoteEditor();

      }
    );


  observer.observe(
    noteEl,
    {
      childList: true,
      characterData: true,
      subtree: true
    }
  );


  function createNoteEditor() {

    if (editorCreated) {
      return;
    }


    const currentText =
      String(
        noteEl.textContent || ""
      ).trim();


    /*
      Chờ dữ liệu buổi học tải xong.
    */

    if (
      !currentText ||
      currentText === "—"
    ) {
      return;
    }


    editorCreated =
      true;


    observer.disconnect();


    const initialNote =
      currentText ===
      "Không có ghi chú."

        ? ""

        : currentText;


    const wrapper =
      document.createElement(
        "div"
      );


    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.id =
      "coachNoteInput";


    textarea.value =
      initialNote;


    textarea.placeholder =
      "Nhập ghi chú cho buổi học...";


    textarea.maxLength =
      2000;


    textarea.style.width =
      "100%";

    textarea.style.minHeight =
      "120px";

    textarea.style.padding =
      "14px";

    textarea.style.borderRadius =
      "10px";

    textarea.style.border =
      "1px solid rgba(255,255,255,.18)";

    textarea.style.background =
      "rgba(255,255,255,.06)";

    textarea.style.color =
      "white";

    textarea.style.fontFamily =
      "inherit";

    textarea.style.fontSize =
      "14px";

    textarea.style.lineHeight =
      "1.5";

    textarea.style.resize =
      "vertical";

    textarea.style.outline =
      "none";


    const count =
      document.createElement(
        "div"
      );


    count.style.marginTop =
      "7px";

    count.style.fontSize =
      "11px";

    count.style.color =
      "rgba(255,255,255,.5)";

    count.style.textAlign =
      "right";


    function updateCount() {

      count.textContent =
        `${textarea.value.length}/2000 ký tự`;

    }


    updateCount();


    textarea.addEventListener(
      "input",
      updateCount
    );


    const saveBtn =
      document.createElement(
        "button"
      );


    saveBtn.type =
      "button";


    saveBtn.textContent =
      "💾 LƯU GHI CHÚ";


    saveBtn.style.marginTop =
      "12px";

    saveBtn.style.width =
      "100%";

    saveBtn.style.minHeight =
      "48px";

    saveBtn.style.border =
      "0";

    saveBtn.style.borderRadius =
      "10px";

    saveBtn.style.background =
      "#d8ff45";

    saveBtn.style.color =
      "#172600";

    saveBtn.style.fontWeight =
      "900";

    saveBtn.style.cursor =
      "pointer";


    wrapper.appendChild(
      textarea
    );

    wrapper.appendChild(
      count
    );

    wrapper.appendChild(
      saveBtn
    );


    noteEl.replaceWith(
      wrapper
    );


    saveBtn.addEventListener(
      "click",
      async function () {

        const messageEl =
          document.getElementById(
            "message"
          );


        const note =
          textarea.value.trim();


        if (
          note.length > 2000
        ) {

          messageEl.textContent =
            "Ghi chú tối đa 2000 ký tự.";

          messageEl.className =
            "error";

          return;
        }


        const params =
          new URLSearchParams(
            window.location.search
          );


        const sessionId =
          Number(
            params.get("id")
            ||
            params.get(
              "session_id"
            )
          );


        if (
          !Number.isFinite(
            sessionId
          )
          ||
          sessionId <= 0
        ) {

          messageEl.textContent =
            "Không xác định được buổi học.";

          messageEl.className =
            "error";

          return;
        }


        const cfg =
          window.PICKDEE_CONFIG
          ||
          {};


        if (
          !window.supabase
          ||
          !cfg.SUPABASE_URL
          ||
          !cfg.SUPABASE_PUBLISHABLE_KEY
        ) {

          messageEl.textContent =
            "Không kết nối được Supabase.";

          messageEl.className =
            "error";

          return;
        }


        saveBtn.disabled =
          true;


        saveBtn.textContent =
          "ĐANG LƯU...";


        messageEl.textContent =
          "Đang lưu ghi chú...";

        messageEl.className =
          "info";


        try {

          const noteSb =
            window.supabase
              .createClient(
                cfg.SUPABASE_URL,
                cfg.SUPABASE_PUBLISHABLE_KEY
              );


          const {
            data,
            error
          } =
            await noteSb.rpc(
              "coach_update_session_note",
              {
                p_session_id:
                  sessionId,

                p_note:
                  note
              }
            );


          if (error) {
            throw error;
          }


          textarea.value =
            data?.note
            ||
            "";


          updateCount();


          messageEl.textContent =
            "✓ Đã lưu ghi chú buổi học.";

          messageEl.className =
            "success";


          saveBtn.textContent =
            "✓ ĐÃ LƯU";

        }
        catch (error) {

          console.error(
            "SAVE COACH NOTE:",
            error
          );


          messageEl.textContent =
            "Không lưu được ghi chú: "
            +
            (
              error?.message
              ||
              error
            );


          messageEl.className =
            "error";


          saveBtn.textContent =
            "💾 LƯU GHI CHÚ";

        }
        finally {

          saveBtn.disabled =
            false;

        }

      }
    );

  }


  /*
    Trường hợp dữ liệu đã tải
    trước khi observer hoạt động.
  */

  createNoteEditor();

})();
</script>
  <script>
(function () {

  function applyNoteLock() {

    const statusEl =
      document.getElementById("status");

    const textarea =
      document.getElementById(
        "coachNoteInput"
      );

    if (
      !statusEl ||
      !textarea
    ) {
      return;
    }


    const status =
      String(
        statusEl.textContent || ""
      ).trim();


    const wrapper =
      textarea.parentElement;


    const saveBtn =
      wrapper
        ? wrapper.querySelector("button")
        : null;


    let lockMessage =
      document.getElementById(
        "noteLockMessage"
      );


    /*
      =====================================
      BUỔI CÒN CHỜ HỌC
      → ĐƯỢC SỬA GHI CHÚ
      =====================================
    */

    if (
      status === "Chờ học"
    ) {

      textarea.readOnly =
        false;


      textarea.style.opacity =
        "1";


      textarea.style.cursor =
        "text";


      if (
        saveBtn &&
        saveBtn.textContent !==
        "ĐANG LƯU..."
      ) {

        saveBtn.disabled =
          false;


        if (
          saveBtn.textContent.includes(
            "KHÓA"
          )
        ) {

          saveBtn.textContent =
            "💾 LƯU GHI CHÚ";

        }

      }


      if (lockMessage) {

        lockMessage.remove();

      }


      return;
    }


    /*
      =====================================
      BUỔI ĐÃ XỬ LÝ
      → CHỈ ĐƯỢC XEM
      =====================================
    */

    textarea.readOnly =
      true;


    textarea.style.opacity =
      ".72";


    textarea.style.cursor =
      "not-allowed";


    if (saveBtn) {

      saveBtn.disabled =
        true;


      saveBtn.textContent =
        "🔒 GHI CHÚ ĐÃ KHÓA";


      saveBtn.style.opacity =
        ".55";


      saveBtn.style.cursor =
        "not-allowed";

    }


    /*
      Thông báo chỉ tạo 1 lần
    */

    if (
      !lockMessage &&
      wrapper
    ) {

      lockMessage =
        document.createElement(
          "div"
        );


      lockMessage.id =
        "noteLockMessage";


      lockMessage.style.marginTop =
        "10px";


      lockMessage.style.padding =
        "10px 12px";


      lockMessage.style.borderRadius =
        "9px";


      lockMessage.style.background =
        "rgba(255,255,255,.06)";


      lockMessage.style.color =
        "rgba(255,255,255,.65)";


      lockMessage.style.fontSize =
        "12px";


      lockMessage.style.lineHeight =
        "1.5";


      lockMessage.textContent =
        "🔒 Buổi học đã được xử lý. Ghi chú được giữ làm lịch sử và không thể chỉnh sửa.";


      wrapper.appendChild(
        lockMessage
      );

    }

  }


  /*
    =====================================
    CHỜ Ô GHI CHÚ ĐƯỢC TẠO
    =====================================
  */

  const waitForEditor =
    setInterval(
      function () {

        const textarea =
          document.getElementById(
            "coachNoteInput"
          );


        const statusEl =
          document.getElementById(
            "status"
          );


        if (
          !textarea ||
          !statusEl
        ) {
          return;
        }


        clearInterval(
          waitForEditor
        );


        applyNoteLock();


        /*
          Theo dõi khi Coach bấm
          HOÀN THÀNH hoặc VẮNG.
          Status đổi → khóa ngay.
        */

        const observer =
          new MutationObserver(
            function () {

              applyNoteLock();

            }
          );


        observer.observe(
          statusEl,
          {
            childList: true,
            characterData: true,
            subtree: true
          }
        );

      },
      200
    );

})();
</script>
