<script>

(async function () {


  const cfg =
    window.PICKDEE_CONFIG || {};


  const completeBtn =
    document.getElementById(
      "completeBtn"
    );


  const absentBtn =
    document.getElementById(
      "absentBtn"
    );


  const coverBtn =
    document.getElementById(
      "coverBtn"
    );


  const noteInput =
    document.getElementById(
      "coachNoteInput"
    );


  const noteCount =
    document.getElementById(
      "noteCount"
    );


  const saveNoteBtn =
    document.getElementById(
      "saveNoteBtn"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    Number(
      params.get("id")
      ||
      params.get("session_id")
    );


  let sb =
    null;


  let currentCoachId =
    null;


  let currentSession =
    null;


  let sessionDetail =
    null;


  let paymentReady =
    false;


  let coverRequestSent =
    false;


  function el(id) {

    return document.getElementById(
      id
    );

  }


  function one(value) {

    if (
      Array.isArray(value)
    ) {

      return (
        value[0]
        ||
        null
      );

    }

    return (
      value
      ||
      null
    );

  }


  function show(
    id,
    value
  ) {

    const node =
      el(id);


    if (!node) {
      return;
    }


    node.textContent =
      (
        value === null
        ||
        value === undefined
        ||
        value === ""
      )

        ? "—"

        : value;

  }


  function setMessage(
    text,
    type = "info"
  ) {

    const node =
      el("message");


    if (!node) {
      return;
    }


    node.textContent =
      text || "";


    node.className =
      type;

  }


  function formatDate(
    value
  ) {

    if (!value) {
      return "—";
    }


    return new Intl.DateTimeFormat(
      "vi-VN"
    ).format(
      new Date(
        `${value}T00:00:00`
      )
    );

  }


  function formatTime(
    value
  ) {

    if (!value) {
      return "—";
    }


    return String(
      value
    ).slice(
      0,
      5
    );

  }


  function formatDateTimeVN(
    date
  ) {

    if (!date) {
      return "";
    }


    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        timeZone:
          "Asia/Ho_Chi_Minh",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).format(
      date
    );

  }


  function updateBadge(
    status
  ) {

    const badge =
      el("status");


    if (!badge) {
      return;
    }


    badge.classList.remove(
      "finished",
      "absent"
    );


    if (
      status ===
      "Đã hoàn thành"
    ) {

      badge.classList.add(
        "finished"
      );

    }


    if (
      status ===
      "Vắng"
    ) {

      badge.classList.add(
        "absent"
      );

    }

  }


  function updateNoteCount() {

    noteCount.textContent =
      `${noteInput.value.length}/2000 ký tự`;

  }


  function lockAllButtons() {

    completeBtn.disabled =
      true;

    absentBtn.disabled =
      true;

    coverBtn.disabled =
      true;

  }


  function getSessionEndAt() {

    if (
      !currentSession?.session_date
      ||
      !currentSession?.start_time
    ) {

      return null;

    }


    const time =
      String(
        currentSession.start_time
      ).slice(
        0,
        8
      );


    const startAt =
      new Date(
        `${currentSession.session_date}T${time}+07:00`
      );


    if (
      Number.isNaN(
        startAt.getTime()
      )
    ) {

      return null;

    }


    const duration =
      Number(
        currentSession.duration_minutes
        ||
        60
      );


    return new Date(
      startAt.getTime()
      +
      duration * 60 * 1000
    );

  }


  function updateControls() {

    lockAllButtons();


    noteInput.disabled =
      true;

    noteInput.readOnly =
      true;

    saveNoteBtn.disabled =
      true;


    if (!currentSession) {
      return;
    }


    const status =
      String(
        currentSession.status
        ||
        ""
      ).trim();

if (
  currentSession.substitute_coach_id
) {

  if (
    Number(
      currentSession.substitute_coach_id
    ) ===
    Number(
      currentCoachId
    )
  ) {

    coverBtn.style.display =
      "none";

  }
  else {

    coverBtn.style.display =
      "";

    coverBtn.disabled =
      true;

    coverBtn.textContent =
      "✓ ĐÃ CÓ COACH HỖ TRỢ";

  }

}
else if (
  coverRequestSent
) {

  coverBtn.style.display =
    "";

  coverBtn.disabled =
    true;

  coverBtn.textContent =
    "✓ ĐÃ GỌI COACH HỖ TRỢ";

}
else {

  coverBtn.style.display =
    "";

  coverBtn.textContent =
    "📣 GỌI COACH HỖ TRỢ";

}


    if (
      status ===
      "Đã hoàn thành"
    ) {

      setMessage(
        "✓ Buổi học này đã được hoàn thành.",
        "success"
      );

      return;

    }


    if (
      status ===
      "Vắng"
    ) {

      setMessage(
        "✓ Buổi học này đã được ghi nhận Vắng.",
        "info"
      );

      return;

    }


    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        `Buổi học hiện có trạng thái "${status}". Không thể thao tác ở trạng thái này.`,
        "info"
      );

      return;

    }


    noteInput.disabled =
      false;

    noteInput.readOnly =
      false;

    saveNoteBtn.disabled =
      false;


    if (
      paymentReady === true
      &&
      !currentSession.substitute_coach_id
      &&
      !coverRequestSent
    ) {

      coverBtn.disabled =
        false;

    }


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "🔒 Gói học chưa được xác nhận thanh toán đủ 100%. Coach không được phép thao tác buổi học.",
        "error"
      );

      return;

    }


    const endAt =
      getSessionEndAt();


    if (!endAt) {

      setMessage(
        "⚠️ Không xác định được thời điểm kết thúc buổi học. Tạm khóa điểm danh.",
        "error"
      );

      return;

    }


    const now =
      new Date();


    if (
      now.getTime()
      <
      endAt.getTime()
    ) {

      setMessage(
        `⏳ CHƯA ĐẾN GIỜ ĐIỂM DANH · Buổi học kết thúc lúc ${formatDateTimeVN(endAt)}. Sau thời điểm này Coach mới được bấm HOÀN THÀNH hoặc VẮNG.`,
        "info"
      );

      return;

    }


    completeBtn.disabled =
      false;


    absentBtn.disabled =
      false;


    setMessage(
      "✓ Buổi học đã kết thúc · Đã xác minh đủ học phí · Coach được phép điểm danh.",
      "success"
    );

  }


  function initSupabase() {

    if (
      !window.supabase
    ) {

      throw new Error(
        "Không tải được thư viện Supabase."
      );

    }


    if (
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      throw new Error(
        "Không đọc được config.js."
      );

    }


    sb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

  }


  async function checkCoach() {

    const {
      data: sessionData,
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (
      !sessionData?.session
    ) {

      location.replace(
        "./login.html"
      );

      return false;

    }


    show(
      "userEmail",
      sessionData.session
        .user
        .email
      ||
      ""
    );


    // 1 lần gọi: Coach + buổi học (server lọc Coach chính/dạy thay) + học phí.
    const {
      data: detail,
      error: coachError
    } =
      await sb.rpc(
        "coach_get_session_detail",
        {
          p_session_id:
            Number.isFinite(sessionId)
              ? sessionId
              : 0
        }
      );


    if (coachError) {

      throw new Error(
        "Không xác định được Coach: "
        +
        coachError.message
      );

    }


    sessionDetail =
      detail;


    const coachId =
      detail?.coach_id;


    if (!coachId) {

      throw new Error(
        "Tài khoản này chưa liên kết với hồ sơ Coach."
      );

    }


    currentCoachId =
      Number(
        coachId
      );


    return true;

  }


  async function loadSession() {

    if (
      !Number.isFinite(
        sessionId
      )
      ||
      sessionId <= 0
    ) {

      throw new Error(
        "Không tìm thấy ID buổi học."
      );

    }


    // Dữ liệu buổi đã tải cùng lần gọi coach_get_session_detail (checkCoach).
    const data =
      sessionDetail?.session || null;

    const error =
      null;


    if (error) {

      throw new Error(
        "Không tải được buổi học: "
        +
        error.message
      );

    }


    if (!data) {

      throw new Error(
        "Không tìm thấy buổi học hoặc bạn không phải Coach phụ trách buổi này."
      );

    }


    currentSession =
      data;


    const registration =
      one(
        data.registrations
      );


    const student =
      one(
        registration
          ?.students
      );


    const coach =
      one(
        data.coaches
      );


    if (
      !registration?.id
    ) {

      throw new Error(
        "Buổi học chưa liên kết với đăng ký học."
      );

    }


    // Học phí đã có sẵn trong coach_get_session_detail.
    const paidReady =
      sessionDetail?.payment_ready;

    const paidError =
      null;


    if (paidError) {

      throw new Error(
        "Không xác minh được trạng thái học phí. "
        +
        paidError.message
      );

    }


    paymentReady =
      paidReady === true;


    show(
      "sessionCode",
      data.session_code
      ||
      `Buổi ${data.id}`
    );


    const registrationText =
      registration
        ?.registration_code

        ? `Đăng ký: ${registration.registration_code}`

        : "Đăng ký: —";


    const coachText =
      coach?.full_name
      ||
      coach?.coach_code
      ||
      "Coach";


    show(
      "coachLine",
      `${registrationText} · Coach: ${coachText}`
    );


    show(
      "studentName",
      student?.full_name
      ||
      student?.student_code
      ||
      "—"
    );


    show(
      "sessionNo",
      data.session_no
        ? `Buổi ${data.session_no}`
        : "—"
    );


    show(
      "status",
      data.status
    );


    updateBadge(
      data.status
    );


    show(
      "sessionDate",
      formatDate(
        data.session_date
      )
    );


    show(
      "startTime",
      formatTime(
        data.start_time
      )
    );


    show(
      "duration",
      data.duration_minutes
        ? `${data.duration_minutes} phút`
        : "—"
    );


    show(
      "courtName",
      data.court_name
      ||
      "—"
    );


    noteInput.value =
      data.note
      ||
      "";


 updateNoteCount();


/* =====================================================
   GIÁO ÁN PICKDEE ACADEMY
   CƠ BẢN - BUỔI 2
===================================================== */

const packageName =
  String(
    registration?.package_name || ""
  ).trim();

const sessionNumber =
  Number(
    data.session_no
  );

const actionsEl =
  document.querySelector(
    ".actions"
  );
const oldLearningGoal =
  document.getElementById(
    "pickdeeLearningGoal"
  );

if (oldLearningGoal) {
  oldLearningGoal.remove();
}


const normalizedPackageNameForGoal =
  packageName.toLocaleLowerCase(
    "vi-VN"
  );

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    };


  const lines =
    String(
      lesson.text || ""
    )
      .split("\n")
      .map(
        line =>
          line.trim()
      )
      .filter(
        Boolean
      );


  const headingRegex =
    /^(\d+–\d+\s*phút|Bài\s+\d+\s*:|Thực chiến$|Kiểm tra cuối buổi$|Ba câu nhắc$|Nội dung 60 phút$|Nội dung chính$|Ý nghĩa kỹ thuật$|Nguyên tắc quyết định$|Ôn và kiểm tra$|III\.\s*TIÊU CHÍ HOÀN THÀNH KHÓA$|Tiêu chí hoàn thành$|Cú thả bóng$|Cú hóa giải$)/i;

    "";

      escapeCurriculumHtml(
        line
      );

      line ===

    ) {

  async function saveNote() {

    if (
      !currentSession
    ) {
      return;
    }


    if (
      String(
        currentSession.status || ""
      ).trim()
      !==
      "Chờ học"
    ) {

      setMessage(
        "Buổi học đã được xử lý. Ghi chú đã khóa.",
        "error"
      );

      return;

    }


    const note =
      noteInput.value.trim();


    if (
      note.length > 2000
    ) {

      setMessage(
        "Ghi chú tối đa 2000 ký tự.",
        "error"
      );

      return;

    }


    saveNoteBtn.disabled =
      true;


    saveNoteBtn.textContent =
      "ĐANG LƯU...";


    setMessage(
      "Đang lưu ghi chú...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "coach_update_session_note",
          {
            p_session_id:
              Number(
                currentSession.id
              ),

            p_note:
              note
          }
        );


      if (error) {
        throw error;
      }


      currentSession.note =
        data?.note
        ??
        note;


      noteInput.value =
        currentSession.note || "";


      updateNoteCount();


      saveNoteBtn.textContent =
        "✓ ĐÃ LƯU";


      setMessage(
        "✓ Đã lưu ghi chú buổi học.",
        "success"
      );

    }
    catch (error) {

      console.error(
        "SAVE COACH NOTE:",
        error
      );


      saveNoteBtn.textContent =
        "💾 LƯU GHI CHÚ";


      setMessage(
        "Không lưu được ghi chú: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );

    }
    finally {

      if (
        String(
          currentSession?.status || ""
        ).trim()
        ===
        "Chờ học"
      ) {

        saveNoteBtn.disabled =
          false;

      }

    }

  }


  async function requestCoachCover() {

    if (
      !currentSession
    ) {
      return;
    }


    const status =
      String(
        currentSession.status || ""
      ).trim();


    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        "Chỉ buổi đang ở trạng thái Chờ học mới được gọi Coach hỗ trợ.",
        "error"
      );

      return;

    }


    if (
      currentSession.substitute_coach_id
    ) {

      setMessage(
        "Buổi học này đã có Coach hỗ trợ.",
        "info"
      );

      return;

    }


    const reason =
      window.prompt(
        "Nhập lý do cần Coach hỗ trợ:",
        "Coach chính bận"
      );


    if (
      reason === null
    ) {
      return;
    }


    const finalReason =
      String(
        reason
      ).trim();


    if (!finalReason) {

      setMessage(
        "Vui lòng nhập lý do cần Coach hỗ trợ.",
        "error"
      );

      return;

    }


    const ok =
      window.confirm(
        "Gửi yêu cầu cho các Coach phù hợp trong khu vực nhận dạy buổi này?"
      );


    if (!ok) {
      return;
    }


    coverBtn.disabled =
      true;


    coverBtn.textContent =
      "⏳ ĐANG GỌI COACH...";


    setMessage(
      "Đang gửi yêu cầu tới các Coach phù hợp trong khu vực...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "request_coach_cover",
          {
            p_session_id:
              Number(
                currentSession.id
              ),

            p_reason:
              finalReason
          }
        );


      if (error) {
        throw error;
      }


      coverRequestSent =
        true;


      coverBtn.disabled =
        true;


      coverBtn.textContent =
        "✓ ĐÃ GỌI COACH HỖ TRỢ";


      setMessage(
        `✓ Đã gửi yêu cầu Coach hỗ trợ thành công. Mã yêu cầu: ${data}.`,
        "success"
      );

    }
    catch (error) {

      console.error(
        "REQUEST COACH COVER:",
        error
      );


      coverRequestSent =
        false;


      updateControls();


      setMessage(
        "Không gửi được yêu cầu Coach hỗ trợ: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );

    }

  }


  async function markSession(
    action
  ) {

    if (
      !currentSession
    ) {
      return;
    }


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "Gói học chưa đủ điều kiện thanh toán.",
        "error"
      );

      return;

    }


    if (
      String(
        currentSession.status || ""
      ).trim()
      !==
      "Chờ học"
    ) {

      setMessage(
        "Buổi học này đã được xử lý hoặc không còn ở trạng thái Chờ học.",
        "error"
      );

      return;

    }


    const isCompleted =
      action ===
      "completed";


    const ok =
      window.confirm(

        isCompleted

          ? "Xác nhận học viên đã hoàn thành buổi học này?"

          : "Xác nhận học viên VẮNG buổi học này?"

      );


    if (!ok) {
      return;
    }


    lockAllButtons();


    setMessage(
      "Đang xử lý...",
      "info"
    );


    const {
      data: freshPaid,
      error: freshPaidError
    } =
      await sb.rpc(
        "registration_payment_fully_paid",
        {
          p_registration_id:
            Number(
              currentSession
                .registration_id
            )
        }
      );


    if (
      freshPaidError
      ||
      freshPaid !== true
    ) {

      paymentReady =
        false;


      updateControls();


      setMessage(
        "Không thể thao tác: gói học hiện không còn được xác nhận đủ 100% học phí.",
        "error"
      );

      return;

    }


    const {
      data,
      error
    } =
      await sb.rpc(
        "coach_mark_session",
        {
          p_session_id:
            Number(
              currentSession.id
            ),

          p_action:
            action
        }
      );


    if (error) {

      console.error(
        "COACH MARK SESSION:",
        error
      );


      updateControls();


      setMessage(
        "Không xử lý được buổi học: "
        +
        (
          error.message
          ||
          error
        ),
        "error"
      );

      return;

    }


    const newStatus =
      data?.status
      ||
      (
        isCompleted
          ? "Đã hoàn thành"
          : "Vắng"
      );


    currentSession.status =
      newStatus;


    show(
      "status",
      newStatus
    );


    updateBadge(
      newStatus
    );


    updateControls();

  }


  completeBtn.addEventListener(
    "click",
    function () {

      markSession(
        "completed"
      );

    }
  );


  absentBtn.addEventListener(
    "click",
    function () {

      markSession(
        "absent"
      );

    }
  );


  coverBtn.addEventListener(
    "click",
    function () {

      requestCoachCover();

    }
  );


  saveNoteBtn.addEventListener(
    "click",
    function () {

      saveNote();

    }
  );


  noteInput.addEventListener(
    "input",
    function () {

      updateNoteCount();

    }
  );


  async function init() {

    lockAllButtons();


    try {

      initSupabase();


      const ok =
        await checkCoach();


      if (!ok) {
        return;
      }


      await loadSession();

    }
    catch (error) {

      console.error(
        "COACH SESSION DETAIL:",
        error
      );


      show(
        "sessionCode",
        "Không tải được buổi học"
      );


      show(
        "coachLine",
        "—"
      );


      setMessage(
        error?.message
        ||
        "Có lỗi khi tải buổi học.",
        "error"
      );


      lockAllButtons();


      noteInput.disabled =
        true;


      saveNoteBtn.disabled =
        true;

    }

  }


  // Khối điểm danh nhóm (cuối trang) chờ promise này thay vì chờ cứng.
  window.PD_SESSION_READY =
    init();

  await window.PD_SESSION_READY;


})();

</script>
<script>
(function () {

  function installCoachCoverFix() {

    const btn =
      document.getElementById("coverBtn");

    const messageEl =
      document.getElementById("message");

    const statusEl =
      document.getElementById("status");

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !btn ||
      !window.supabase ||
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {
      return;
    }


    /*
      XÓA HỘP TEST ALERT CŨ
    */
    btn.onclick =
      null;

    btn.removeAttribute(
      "onclick"
    );


    /*
      BẢO ĐẢM NÚT BẤM ĐƯỢC
    */
    btn.disabled =
      false;

    btn.removeAttribute(
      "disabled"
    );

    btn.textContent =
      "📣 GỌI COACH HỖ TRỢ";

    btn.style.pointerEvents =
      "auto";

    btn.style.opacity =
      "1";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const sessionId =
      Number(
        params.get("id") ||
        params.get("session_id")
      );


    const coverSb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );


    function showMessage(
      text,
      type = "info"
    ) {

      if (!messageEl) {
        return;
      }

      messageEl.textContent =
        text;

      messageEl.className =
        type;
    }


    /*
      DÙNG CAPTURE + STOPIMMEDIATEPROPAGATION
      ĐỂ BỎ QUA TOÀN BỘ CLICK CŨ.
    */
    btn.addEventListener(
      "click",
      async function (event) {

        event.preventDefault();

        event.stopPropagation();

        event.stopImmediatePropagation();


        const status =
          String(
            statusEl?.textContent || ""
          ).trim();


        if (
          status !== "Chờ học"
        ) {

          showMessage(
            "Chỉ buổi đang ở trạng thái Chờ học mới được gọi Coach hỗ trợ.",
            "error"
          );

          return;
        }


        if (
          !Number.isFinite(sessionId) ||
          sessionId <= 0
        ) {

          showMessage(
            "Không xác định được buổi học.",
            "error"
          );

          return;
        }


        btn.disabled =
          true;

        btn.textContent =
          "⏳ ĐANG GỌI COACH...";


        showMessage(
          "Đang gửi yêu cầu Coach hỗ trợ...",
          "info"
        );


        try {

          const {
            data,
            error
          } =
            await coverSb.rpc(
              "request_coach_cover",
              {
                p_session_id:
                  sessionId,

                p_reason:
                  "Coach chính bận"
              }
            );


          if (error) {
            throw error;
          }


          btn.disabled =
            true;

          btn.textContent =
            "✓ ĐÃ GỌI COACH HỖ TRỢ";


          showMessage(
            "✓ Đã gửi yêu cầu Coach hỗ trợ thành công. Mã yêu cầu: " +
            data,
            "success"
          );

        }
        catch (error) {

          console.error(
            "REQUEST COACH COVER:",
            error
          );


          btn.disabled =
            false;

          btn.textContent =
            "📣 GỌI COACH HỖ TRỢ";


          showMessage(
            "Không gửi được yêu cầu Coach hỗ trợ: " +
            (
              error?.message ||
              error
            ),
            "error"
          );
        }

      },
      true
    );

  }


  if (
    document.readyState === "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      installCoachCoverFix
    );

  }
  else {

    installCoachCoverFix();

  }

})();
</script>

window.addEventListener(
  "load",
  async function () {

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !window.supabase ||
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

    const groupSb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const sessionId =
      Number(
        params.get("id") ||
        params.get("session_id")
      );

    if (
      !Number.isFinite(sessionId) ||
      sessionId <= 0
    ) {
      return;
    }

    // Gọi 2 truy vấn cùng lúc; chỉ chờ phần chính hiển thị xong
    // (PD_SESSION_READY) thay vì chờ cứng 800ms.
    const sessionRowPromise =
      groupSb
        .from("class_sessions")
        .select(`
          id,
          status,
          training_group_id
        `)
        .eq(
          "id",
          sessionId
        )
        .maybeSingle()
        .then(result => result);

    const [
      {
        data: participantData,
        error: participantError
      }
    ] =
      await Promise.all([
        groupSb.rpc(
          "coach_get_session_participants",
          {
            p_session_id:
              sessionId
          }
        ),
        Promise.resolve(
          window.PD_SESSION_READY
        ).catch(() => null)
      ]);

    if (
      participantError ||
      !participantData ||
      participantData.is_group !== true
    ) {
      return;
    }

    const members =
      Array.isArray(
        participantData.members
      )
        ? participantData.members
        : [];

    if (
      members.length < 2
    ) {
      return;
    }

    const {
      data: sessionRow,
      error: sessionError
    } =
      await sessionRowPromise;

    if (
      sessionError ||
      !sessionRow
    ) {
      console.error(
        "GROUP SESSION:",
        sessionError
      );

      return;
    }

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

       HIỂN THỊ ĐỦ 2 HỌC VIÊN

      const registrationCodes =

        "Đăng ký nhóm: "

       ẨN NÚT ĐIỂM DANH CŨ

        /* =====================================

    let groupAttendanceBusy =

                  registrationId

                ""

        ).trim();

        members.find(

        ![

          ===
          "Có mặt"

            ? "✅ ĐÃ GHI NHẬN CÓ MẶT"

            : "✅ ĐÃ GHI NHẬN VẮNG";


        if (message) {

          message.style.color =
            "#d8ff45";


          if (
            data?.session_finished
            ===
            true
          ) {

            message.textContent =
              "✅ Đã điểm danh đủ học viên. Buổi học đã hoàn thành.";

          }
          else {

            message.textContent =
              "✅ Đã ghi nhận "
              +
              attendanceStatus
              +
              ". Còn "
              +
              String(
                data?.remaining
                ??
                0
              )
              +
              " học viên chưa điểm danh.";

          }

        }


        /*
          Reload nhanh để lấy trạng thái chính xác
          từ backend và cập nhật toàn bộ trang.
        */

        setTimeout(
          function () {

            window.location.reload();

          },
          300
        );

      }
      catch (error) {

        console.error(
          "GROUP ATTENDANCE:",
          error
        );


        groupAttendanceBusy =
          false;


        button.textContent =
          oldButtonText;


        restoreGroupButtons();


        if (message) {

          message.style.color =
            "#ffb3b3";


          message.textContent =
            error?.message
            ||
            "Không thể điểm danh. Vui lòng thử lại.";

        }

      }

    }


    /*
      POINTERUP:
      phản hồi nhanh cho chuột, trackpad,
      màn hình cảm ứng.
    */

    box.addEventListener(
      "pointerup",
      function (event) {

        const button =
          event.target.closest(
            ".group-mark-btn"
          );


        if (
          !button
          ||
          button.disabled
        ) {

          return;

        }


        if (
          event.pointerType
          ===
          "mouse"
          &&
          event.button
          !==
          0
        ) {

          return;

        }


        event.preventDefault();


        lastPointerHandledAt =
          Date.now();


        markGroupAttendance(
          button
        );

      },
      {
        passive: false
      }
    );


    /*
      CLICK FALLBACK:
      hỗ trợ bàn phím và browser
      không xử lý PointerEvent như mong muốn.
    */

    box.addEventListener(
      "click",
      function (event) {

        const button =
          event.target.closest(
            ".group-mark-btn"
          );


        if (
          !button
          ||
          button.disabled
        ) {

          return;

        }


        /*
          PointerUp vừa xử lý rồi thì bỏ click
          tiếp theo để không gọi RPC 2 lần.
        */

        if (
          Date.now()
          -
          lastPointerHandledAt
          <
          700
        ) {

          return;

        }


        event.preventDefault();


        markGroupAttendance(
          button
        );

      }
    );

  }
);
</script>
