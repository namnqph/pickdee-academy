<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Chi tiết buổi học | PickDee Academy
  </title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;

      border-bottom:
        1px solid
        rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    #userEmail {
      color:
        rgba(255,255,255,.72);

      font-size: 13px;
      font-weight: 700;
    }

    .container {
      width:
        min(
          900px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        32px 0 60px;
    }

    .back {
      color: #d8ff45;

      text-decoration: none;

      font-weight: 800;
    }

    .eyebrow {
      margin-top: 26px;

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    h1 {
      margin:
        8px 0 6px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );
    }

    .sub {
      color:
        rgba(255,255,255,.65);

      margin-bottom: 24px;

      line-height: 1.5;
    }

    .grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 16px;
    }

    .card {
      padding: 20px;

      border-radius: 16px;

      background:
        rgba(6,39,88,.74);

      border:
        1px solid
        rgba(255,255,255,.12);
    }

    .card h2 {
      margin:
        0 0 18px;

      font-size: 20px;
    }

    .item {
      margin-bottom: 15px;
    }

    .label {
      color:
        rgba(255,255,255,.5);

      font-size: 12px;

      margin-bottom: 4px;
    }

    .value {
      font-weight: 800;

      line-height: 1.45;
    }

    .badge {
      display: inline-block;

      padding:
        6px 10px;

      border-radius: 999px;

      color: #d8ff45;

      background:
        rgba(216,255,69,.12);

      font-size: 12px;

      font-weight: 900;
    }

    .badge.finished {
      color: #9dffcf;

      background:
        rgba(50,220,140,.12);
    }

    .badge.absent {
      color: #ffb3b3;

      background:
        rgba(255,100,100,.12);
    }

    .actions {
      margin-top: 18px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    button {
      min-height: 52px;

      border: 0;

      border-radius: 11px;

      font-weight: 900;

      cursor: pointer;

      font-size: 14px;
    }

    button:disabled {
      opacity: .45;

      cursor:
        not-allowed;
    }

    .complete {
      background: #d8ff45;

      color: #172600;
    }

    .absent {
      background: #ffb3b3;

      color: #401010;
    }

    .cover {
      grid-column:
        1 / -1;

      background: #173e73;

      color: #d8ff45;

      border:
        1px solid
        rgba(216,255,69,.35);
    }

    #coachNoteInput {
      width: 100%;

      min-height: 120px;

      padding: 14px;

      border-radius: 10px;

      border:
        1px solid
        rgba(255,255,255,.18);

      background:
        rgba(255,255,255,.06);

      color: white;

      font-family: inherit;

      font-size: 14px;

      line-height: 1.5;

      resize: vertical;

      outline: none;
    }

    #coachNoteInput:disabled,
    #coachNoteInput[readonly] {
      opacity: .72;

      cursor:
        not-allowed;
    }

    #noteCount {
      margin-top: 7px;

      font-size: 11px;

      color:
        rgba(255,255,255,.5);

      text-align: right;
    }

    #saveNoteBtn {
      margin-top: 12px;

      width: 100%;

      min-height: 48px;

      background: #d8ff45;

      color: #172600;
    }

    #message {
      margin-top: 15px;

      font-weight: 800;

      line-height: 1.5;
    }

    #message.info {
      color: #ffd884;
    }

    #message.success {
      color: #d8ff45;
    }

    #message.error {
      color: #ffb0b0;
    }

    @media (max-width: 700px) {

      .grid,
      .actions {
        grid-template-columns:
          1fr;
      }

      .topbar {
        padding:
          16px 14px;
      }

    }

  </style>
</head>


<body>


<header class="topbar">

  <div class="brand">
    PickDee
    <span>
      Academy
    </span>
  </div>

  <div id="userEmail">
  </div>

</header>


<main class="container">


  <a
    class="back"
    href="./coach-sessions.html"
  >
    ← Lịch dạy của tôi
  </a>


  <div class="eyebrow">
    CHI TIẾT BUỔI HỌC
  </div>


  <h1 id="sessionCode">
    Đang tải...
  </h1>


  <div
    class="sub"
    id="coachLine"
  >
    Đang kiểm tra buổi học...
  </div>


  <section class="grid">


    <div class="card">

      <h2>
        🏓 Buổi học
      </h2>


      <div class="item">

        <div class="label">
          Học viên
        </div>

        <div
          class="value"
          id="studentName"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Buổi số
        </div>

        <div
          class="value"
          id="sessionNo"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Trạng thái
        </div>

        <div class="value">

          <span
            class="badge"
            id="status"
          >
            —
          </span>

        </div>

      </div>


    </div>


    <div class="card">

      <h2>
        📅 Lịch & sân
      </h2>


      <div class="item">

        <div class="label">
          Ngày học
        </div>

        <div
          class="value"
          id="sessionDate"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Giờ bắt đầu
        </div>

        <div
          class="value"
          id="startTime"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Thời lượng
        </div>

        <div
          class="value"
          id="duration"
        >
          —
        </div>

      </div>


      <div class="item">

        <div class="label">
          Sân
        </div>

        <div
          class="value"
          id="courtName"
        >
          —
        </div>

      </div>


    </div>


  </section>


  <section
    class="card"
    style="margin-top:16px"
  >

    <h2>
      📝 Ghi chú
    </h2>

    <textarea
      id="coachNoteInput"
      maxlength="2000"
      placeholder="Nhập ghi chú cho buổi học..."
      disabled
    ></textarea>

    <div id="noteCount">
      0/2000 ký tự
    </div>

    <button
      id="saveNoteBtn"
      type="button"
      disabled
    >
      💾 LƯU GHI CHÚ
    </button>

  </section>


  <div class="actions">

    <button
      id="completeBtn"
      class="complete"
      type="button"
      disabled
    >
      ✓ HOÀN THÀNH BUỔI
    </button>


    <button
      id="absentBtn"
      class="absent"
      type="button"
      disabled
    >
      ✕ VẮNG
    </button>


<button
  id="coverBtn"
  class="cover"
  type="button"
  onclick="alert('NÚT COACH HỖ TRỢ ĐÃ BẤM ĐƯỢC')"
>
  📣 TEST GỌI COACH HỖ TRỢ
</button>

  </div>


  <div
    id="message"
    class="info"
  >
    Đang kiểm tra quyền thao tác...
  </div>


</main>


<script>

window.PICKDEE_NOTIFICATION_ROLE =
  "coach";

</script>


<script src="./notifications.js?v=20260911-3"></script>


<script>

(async function () {


  const cfg =
    window.PICKDEE_CONFIG || {};


  const completeBtn =
    document.getElementById(
      "completeBtn"
    );


  const absentBtn =
    document.getElementById(
      "absentBtn"
    );


  const coverBtn =
    document.getElementById(
      "coverBtn"
    );


  const noteInput =
    document.getElementById(
      "coachNoteInput"
    );


  const noteCount =
    document.getElementById(
      "noteCount"
    );


  const saveNoteBtn =
    document.getElementById(
      "saveNoteBtn"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    Number(
      params.get("id")
      ||
      params.get("session_id")
    );


  let sb =
    null;


  let currentCoachId =
    null;


  let currentSession =
    null;


  let paymentReady =
    false;


  let coverRequestSent =
    false;


  function el(id) {

    return document.getElementById(
      id
    );

  }


  function one(value) {

    if (
      Array.isArray(value)
    ) {

      return (
        value[0]
        ||
        null
      );

    }

    return (
      value
      ||
      null
    );

  }


  function show(
    id,
    value
  ) {

    const node =
      el(id);


    if (!node) {
      return;
    }


    node.textContent =
      (
        value === null
        ||
        value === undefined
        ||
        value === ""
      )

        ? "—"

        : value;

  }


  function setMessage(
    text,
    type = "info"
  ) {

    const node =
      el("message");


    if (!node) {
      return;
    }


    node.textContent =
      text || "";


    node.className =
      type;

  }


  function formatDate(
    value
  ) {

    if (!value) {
      return "—";
    }


    return new Intl.DateTimeFormat(
      "vi-VN"
    ).format(
      new Date(
        `${value}T00:00:00`
      )
    );

  }


  function formatTime(
    value
  ) {

    if (!value) {
      return "—";
    }


    return String(
      value
    ).slice(
      0,
      5
    );

  }


  function formatDateTimeVN(
    date
  ) {

    if (!date) {
      return "";
    }


    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        timeZone:
          "Asia/Ho_Chi_Minh",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).format(
      date
    );

  }


  function updateBadge(
    status
  ) {

    const badge =
      el("status");


    if (!badge) {
      return;
    }


    badge.classList.remove(
      "finished",
      "absent"
    );


    if (
      status ===
      "Đã hoàn thành"
    ) {

      badge.classList.add(
        "finished"
      );

    }


    if (
      status ===
      "Vắng"
    ) {

      badge.classList.add(
        "absent"
      );

    }

  }


  function updateNoteCount() {

    noteCount.textContent =
      `${noteInput.value.length}/2000 ký tự`;

  }


  function lockAllButtons() {

    completeBtn.disabled =
      true;

    absentBtn.disabled =
      true;

    coverBtn.disabled =
      true;

  }


  function getSessionEndAt() {

    if (
      !currentSession?.session_date
      ||
      !currentSession?.start_time
    ) {

      return null;

    }


    const time =
      String(
        currentSession.start_time
      ).slice(
        0,
        8
      );


    const startAt =
      new Date(
        `${currentSession.session_date}T${time}+07:00`
      );


    if (
      Number.isNaN(
        startAt.getTime()
      )
    ) {

      return null;

    }


    const duration =
      Number(
        currentSession.duration_minutes
        ||
        60
      );


    return new Date(
      startAt.getTime()
      +
      duration * 60 * 1000
    );

  }


  function updateControls() {

    lockAllButtons();


    noteInput.disabled =
      true;

    noteInput.readOnly =
      true;

    saveNoteBtn.disabled =
      true;


    if (!currentSession) {
      return;
    }


    const status =
      String(
        currentSession.status
        ||
        ""
      ).trim();


    if (
      currentSession.substitute_coach_id
    ) {

      coverBtn.disabled =
        true;

      coverBtn.textContent =
        "✓ ĐÃ CÓ COACH HỖ TRỢ";

    }
    else if (
      coverRequestSent
    ) {

      coverBtn.disabled =
        true;

      coverBtn.textContent =
        "✓ ĐÃ GỌI COACH HỖ TRỢ";

    }
    else {

      coverBtn.textContent =
        "📣 GỌI COACH HỖ TRỢ";

    }


    if (
      status ===
      "Đã hoàn thành"
    ) {

      setMessage(
        "✓ Buổi học này đã được hoàn thành.",
        "success"
      );

      return;

    }


    if (
      status ===
      "Vắng"
    ) {

      setMessage(
        "✓ Buổi học này đã được ghi nhận Vắng.",
        "info"
      );

      return;

    }


    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        `Buổi học hiện có trạng thái "${status}". Không thể thao tác ở trạng thái này.`,
        "info"
      );

      return;

    }


    noteInput.disabled =
      false;

    noteInput.readOnly =
      false;

    saveNoteBtn.disabled =
      false;


    if (
      paymentReady === true
      &&
      !currentSession.substitute_coach_id
      &&
      !coverRequestSent
    ) {

      coverBtn.disabled =
        false;

    }


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "🔒 Gói học chưa được xác nhận thanh toán đủ 100%. Coach không được phép thao tác buổi học.",
        "error"
      );

      return;

    }


    const endAt =
      getSessionEndAt();


    if (!endAt) {

      setMessage(
        "⚠️ Không xác định được thời điểm kết thúc buổi học. Tạm khóa điểm danh.",
        "error"
      );

      return;

    }


    const now =
      new Date();


    if (
      now.getTime()
      <
      endAt.getTime()
    ) {

      setMessage(
        `⏳ CHƯA ĐẾN GIỜ ĐIỂM DANH · Buổi học kết thúc lúc ${formatDateTimeVN(endAt)}. Sau thời điểm này Coach mới được bấm HOÀN THÀNH hoặc VẮNG.`,
        "info"
      );

      return;

    }


    completeBtn.disabled =
      false;


    absentBtn.disabled =
      false;


    setMessage(
      "✓ Buổi học đã kết thúc · Đã xác minh đủ học phí · Coach được phép điểm danh.",
      "success"
    );

  }


  function initSupabase() {

    if (
      !window.supabase
    ) {

      throw new Error(
        "Không tải được thư viện Supabase."
      );

    }


    if (
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      throw new Error(
        "Không đọc được config.js."
      );

    }


    sb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

  }


  async function checkCoach() {

    const {
      data: sessionData,
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (
      !sessionData?.session
    ) {

      location.replace(
        "./login.html"
      );

      return false;

    }


    show(
      "userEmail",
      sessionData.session
        .user
        .email
      ||
      ""
    );


    const {
      data: coachId,
      error: coachError
    } =
      await sb.rpc(
        "current_coach_id"
      );


    if (coachError) {

      throw new Error(
        "Không xác định được Coach: "
        +
        coachError.message
      );

    }


    if (!coachId) {

      throw new Error(
        "Tài khoản này chưa liên kết với hồ sơ Coach."
      );

    }


    currentCoachId =
      Number(
        coachId
      );


    return true;

  }


  async function loadSession() {

    if (
      !Number.isFinite(
        sessionId
      )
      ||
      sessionId <= 0
    ) {

      throw new Error(
        "Không tìm thấy ID buổi học."
      );

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "class_sessions"
        )
        .select(`
          id,
          session_code,
          registration_id,
          coach_id,
          substitute_coach_id,
          substitute_reason,
          substitute_assigned_at,
          session_no,
          session_date,
          start_time,
          duration_minutes,
          court_id,
          court_name,
          status,
          note,

          registrations (
            id,
            registration_code,
            student_id,
            package_name,
            tuition_fee,
            is_test,

            students (
              id,
              student_code,
              full_name
            )
          ),

          coaches!class_sessions_coach_id_fkey (
            id,
            coach_code,
            full_name
          )
        `)

        .eq(
          "id",
          sessionId
        )

        .eq(
          "coach_id",
          currentCoachId
        )

        .maybeSingle();


    if (error) {

      throw new Error(
        "Không tải được buổi học: "
        +
        error.message
      );

    }


    if (!data) {

      throw new Error(
        "Không tìm thấy buổi học hoặc bạn không phải Coach phụ trách buổi này."
      );

    }


    currentSession =
      data;


    const registration =
      one(
        data.registrations
      );


    const student =
      one(
        registration
          ?.students
      );


    const coach =
      one(
        data.coaches
      );


    if (
      !registration?.id
    ) {

      throw new Error(
        "Buổi học chưa liên kết với đăng ký học."
      );

    }


    const {
      data: paidReady,
      error: paidError
    } =
      await sb.rpc(
        "registration_payment_fully_paid",
        {
          p_registration_id:
            Number(
              registration.id
            )
        }
      );


    if (paidError) {

      throw new Error(
        "Không xác minh được trạng thái học phí. "
        +
        paidError.message
      );

    }


    paymentReady =
      paidReady === true;


    show(
      "sessionCode",
      data.session_code
      ||
      `Buổi ${data.id}`
    );


    const registrationText =
      registration
        ?.registration_code

        ? `Đăng ký: ${registration.registration_code}`

        : "Đăng ký: —";


    const coachText =
      coach?.full_name
      ||
      coach?.coach_code
      ||
      "Coach";


    show(
      "coachLine",
      `${registrationText} · Coach: ${coachText}`
    );


    show(
      "studentName",
      student?.full_name
      ||
      student?.student_code
      ||
      "—"
    );


    show(
      "sessionNo",
      data.session_no
        ? `Buổi ${data.session_no}`
        : "—"
    );


    show(
      "status",
      data.status
    );


    updateBadge(
      data.status
    );


    show(
      "sessionDate",
      formatDate(
        data.session_date
      )
    );


    show(
      "startTime",
      formatTime(
        data.start_time
      )
    );


    show(
      "duration",
      data.duration_minutes
        ? `${data.duration_minutes} phút`
        : "—"
    );


    show(
      "courtName",
      data.court_name
      ||
      "—"
    );


    noteInput.value =
      data.note
      ||
      "";


    updateNoteCount();


    updateControls();

  }


  async function saveNote() {

    if (
      !currentSession
    ) {
      return;
    }


    if (
      String(
        currentSession.status || ""
      ).trim()
      !==
      "Chờ học"
    ) {

      setMessage(
        "Buổi học đã được xử lý. Ghi chú đã khóa.",
        "error"
      );

      return;

    }


    const note =
      noteInput.value.trim();


    if (
      note.length > 2000
    ) {

      setMessage(
        "Ghi chú tối đa 2000 ký tự.",
        "error"
      );

      return;

    }


    saveNoteBtn.disabled =
      true;


    saveNoteBtn.textContent =
      "ĐANG LƯU...";


    setMessage(
      "Đang lưu ghi chú...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "coach_update_session_note",
          {
            p_session_id:
              Number(
                currentSession.id
              ),

            p_note:
              note
          }
        );


      if (error) {
        throw error;
      }


      currentSession.note =
        data?.note
        ??
        note;


      noteInput.value =
        currentSession.note || "";


      updateNoteCount();


      saveNoteBtn.textContent =
        "✓ ĐÃ LƯU";


      setMessage(
        "✓ Đã lưu ghi chú buổi học.",
        "success"
      );

    }
    catch (error) {

      console.error(
        "SAVE COACH NOTE:",
        error
      );


      saveNoteBtn.textContent =
        "💾 LƯU GHI CHÚ";


      setMessage(
        "Không lưu được ghi chú: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );

    }
    finally {

      if (
        String(
          currentSession?.status || ""
        ).trim()
        ===
        "Chờ học"
      ) {

        saveNoteBtn.disabled =
          false;

      }

    }

  }


  async function requestCoachCover() {

    if (
      !currentSession
    ) {
      return;
    }


    const status =
      String(
        currentSession.status || ""
      ).trim();


    if (
      status !==
      "Chờ học"
    ) {

      setMessage(
        "Chỉ buổi đang ở trạng thái Chờ học mới được gọi Coach hỗ trợ.",
        "error"
      );

      return;

    }


    if (
      currentSession.substitute_coach_id
    ) {

      setMessage(
        "Buổi học này đã có Coach hỗ trợ.",
        "info"
      );

      return;

    }


    const reason =
      window.prompt(
        "Nhập lý do cần Coach hỗ trợ:",
        "Coach chính bận"
      );


    if (
      reason === null
    ) {
      return;
    }


    const finalReason =
      String(
        reason
      ).trim();


    if (!finalReason) {

      setMessage(
        "Vui lòng nhập lý do cần Coach hỗ trợ.",
        "error"
      );

      return;

    }


    const ok =
      window.confirm(
        "Gửi yêu cầu cho các Coach phù hợp trong khu vực nhận dạy buổi này?"
      );


    if (!ok) {
      return;
    }


    coverBtn.disabled =
      true;


    coverBtn.textContent =
      "⏳ ĐANG GỌI COACH...";


    setMessage(
      "Đang gửi yêu cầu tới các Coach phù hợp trong khu vực...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "request_coach_cover",
          {
            p_session_id:
              Number(
                currentSession.id
              ),

            p_reason:
              finalReason
          }
        );


      if (error) {
        throw error;
      }


      coverRequestSent =
        true;


      coverBtn.disabled =
        true;


      coverBtn.textContent =
        "✓ ĐÃ GỌI COACH HỖ TRỢ";


      setMessage(
        `✓ Đã gửi yêu cầu Coach hỗ trợ thành công. Mã yêu cầu: ${data}.`,
        "success"
      );

    }
    catch (error) {

      console.error(
        "REQUEST COACH COVER:",
        error
      );


      coverRequestSent =
        false;


      updateControls();


      setMessage(
        "Không gửi được yêu cầu Coach hỗ trợ: "
        +
        (
          error?.message
          ||
          error
        ),
        "error"
      );

    }

  }


  async function markSession(
    action
  ) {

    if (
      !currentSession
    ) {
      return;
    }


    if (
      paymentReady !==
      true
    ) {

      setMessage(
        "Gói học chưa đủ điều kiện thanh toán.",
        "error"
      );

      return;

    }


    if (
      String(
        currentSession.status || ""
      ).trim()
      !==
      "Chờ học"
    ) {

      setMessage(
        "Buổi học này đã được xử lý hoặc không còn ở trạng thái Chờ học.",
        "error"
      );

      return;

    }


    const isCompleted =
      action ===
      "completed";


    const ok =
      window.confirm(

        isCompleted

          ? "Xác nhận học viên đã hoàn thành buổi học này?"

          : "Xác nhận học viên VẮNG buổi học này?"

      );


    if (!ok) {
      return;
    }


    lockAllButtons();


    setMessage(
      "Đang xử lý...",
      "info"
    );


    const {
      data: freshPaid,
      error: freshPaidError
    } =
      await sb.rpc(
        "registration_payment_fully_paid",
        {
          p_registration_id:
            Number(
              currentSession
                .registration_id
            )
        }
      );


    if (
      freshPaidError
      ||
      freshPaid !== true
    ) {

      paymentReady =
        false;


      updateControls();


      setMessage(
        "Không thể thao tác: gói học hiện không còn được xác nhận đủ 100% học phí.",
        "error"
      );

      return;

    }


    const {
      data,
      error
    } =
      await sb.rpc(
        "coach_mark_session",
        {
          p_session_id:
            Number(
              currentSession.id
            ),

          p_action:
            action
        }
      );


    if (error) {

      console.error(
        "COACH MARK SESSION:",
        error
      );


      updateControls();


      setMessage(
        "Không xử lý được buổi học: "
        +
        (
          error.message
          ||
          error
        ),
        "error"
      );

      return;

    }


    const newStatus =
      data?.status
      ||
      (
        isCompleted
          ? "Đã hoàn thành"
          : "Vắng"
      );


    currentSession.status =
      newStatus;


    show(
      "status",
      newStatus
    );


    updateBadge(
      newStatus
    );


    updateControls();

  }


  completeBtn.addEventListener(
    "click",
    function () {

      markSession(
        "completed"
      );

    }
  );


  absentBtn.addEventListener(
    "click",
    function () {

      markSession(
        "absent"
      );

    }
  );


  coverBtn.addEventListener(
    "click",
    function () {

      requestCoachCover();

    }
  );


  saveNoteBtn.addEventListener(
    "click",
    function () {

      saveNote();

    }
  );


  noteInput.addEventListener(
    "input",
    function () {

      updateNoteCount();

    }
  );


  async function init() {

    lockAllButtons();


    try {

      initSupabase();


      const ok =
        await checkCoach();


      if (!ok) {
        return;
      }


      await loadSession();

    }
    catch (error) {

      console.error(
        "COACH SESSION DETAIL:",
        error
      );


      show(
        "sessionCode",
        "Không tải được buổi học"
      );


      show(
        "coachLine",
        "—"
      );


      setMessage(
        error?.message
        ||
        "Có lỗi khi tải buổi học.",
        "error"
      );


      lockAllButtons();


      noteInput.disabled =
        true;


      saveNoteBtn.disabled =
        true;

    }

  }


  await init();


})();

</script>


</body>
