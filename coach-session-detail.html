<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chi tiết buổi học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(90,255,180,.13), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(900px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 800;
    }

    .eyebrow {
      margin-top: 26px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(36px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.65);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(6,39,88,.74);
      border: 1px solid rgba(255,255,255,.12);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .item {
      margin-bottom: 15px;
    }

    .label {
      color: rgba(255,255,255,.5);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      font-weight: 800;
      line-height: 1.45;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      color: #d8ff45;
      background: rgba(216,255,69,.12);
      font-size: 12px;
      font-weight: 900;
    }

    .actions {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 11px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }

    .complete {
      background: #d8ff45;
      color: #172600;
    }

    .absent {
      background: #ffb3b3;
      color: #401010;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      color: #ffb0b0;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .grid,
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

  <a class="back" href="./coach-sessions.html">
    ← Lịch dạy của tôi
  </a>

  <div class="eyebrow">
    CHI TIẾT BUỔI HỌC
  </div>

  <h1 id="sessionCode">
    Đang tải...
  </h1>

  <div class="sub" id="coachLine"></div>

  <section class="grid">

    <div class="card">

      <h2>🏓 Buổi học</h2>

      <div class="item">
        <div class="label">Học viên</div>
        <div class="value" id="studentName">—</div>
      </div>

      <div class="item">
        <div class="label">Buổi số</div>
        <div class="value" id="sessionNo">—</div>
      </div>

      <div class="item">
        <div class="label">Trạng thái</div>
        <div class="value">
          <span class="badge" id="status">—</span>
        </div>
      </div>

    </div>


    <div class="card">

      <h2>📅 Lịch & sân</h2>

      <div class="item">
        <div class="label">Ngày học</div>
        <div class="value" id="sessionDate">—</div>
      </div>

      <div class="item">
        <div class="label">Giờ bắt đầu</div>
        <div class="value" id="startTime">—</div>
      </div>

      <div class="item">
        <div class="label">Thời lượng</div>
        <div class="value" id="duration">—</div>
      </div>

      <div class="item">
        <div class="label">Sân</div>
        <div class="value" id="courtName">—</div>
      </div>

    </div>

  </section>


  <section class="card" style="margin-top:16px">

    <h2>📝 Ghi chú</h2>

    <div id="note">—</div>

  </section>


  <div class="actions">

    <button
      id="completeBtn"
      class="complete"
      type="button"
      disabled
    >
      ✓ HOÀN THÀNH BUỔI
    </button>

    <button
      id="absentBtn"
      class="absent"
      type="button"
      disabled
    >
      ✕ VẮNG
    </button>

  </div>

  <div id="message">
    Đang kiểm tra quyền thao tác...
  </div>

</main>

<script src="./coach-session-detail.js?v=20260910-1"></script>

</body>
</html>
