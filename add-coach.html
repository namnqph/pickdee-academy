<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>Thêm Coach | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261017-logout1"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(90,255,180,.13), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(760px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 26px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 24px;
      font-size: clamp(34px, 6vw, 52px);
    }

    .card {
      background: rgba(6,39,88,.76);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
    }

    .field {
      margin-bottom: 18px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: white;
      outline: none;
    }

    select option {
      color: black;
    }
select:disabled {
  opacity: .55;
  cursor: not-allowed;
}
    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #d8ff45;
      color: #172600;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ffb0b0;
    }

    .success {
      color: #d8ff45;
    }

    @media (max-width: 650px) {
      .two {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

  <a class="back" href="./coaches.html">
    ← Danh sách Coach
  </a>

  <div class="eyebrow">
    QUẢN LÝ COACH
  </div>

  <h1>Thêm Coach</h1>

  <form id="coachForm" class="card">

    <div class="field">
      <label>Họ và tên *</label>
      <input id="fullName" type="text" required>
    </div>

    <div class="two">

      <div class="field">
        <label>Số điện thoại</label>
        <input id="phone" type="tel">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email">
      </div>

    </div>

    <div class="two">

     <div class="two">

  <div class="field">
    <label>Khu vực phụ trách</label>

    <select id="preferredArea">
      <option value="">Chọn Tỉnh/Thành</option>
    </select>
  </div>

  <div class="field">
    <label>Xã/Phường</label>

    <select id="preferredWard" disabled>
      <option value="">Chọn Tỉnh/Thành trước</option>
    </select>
  </div>

</div>

    <div class="field">
      <label>Trạng thái</label>

      <select id="status">
        <option value="Đang hoạt động">Đang hoạt động</option>
        <option value="Tạm nghỉ">Tạm nghỉ</option>
        <option value="Ngừng hoạt động">Ngừng hoạt động</option>
      </select>
    </div>

    <div class="field">
      <label>Ghi chú</label>
      <textarea
        id="note"
        placeholder="Kinh nghiệm, khu vực, lịch rảnh..."
      ></textarea>
    </div>

    <button id="saveBtn" type="submit">
      LƯU COACH
    </button>

    <div id="message" class="message"></div>

  </form>

</main>

<script src="./add-coach.js?v=20260909-1"></script>

</body>
</html>
