<script>
(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const coachBox =
    document.getElementById(
      "coachBox"
    );

  const coachName =
    document.getElementById(
      "coachName"
    );

  const coachMeta =
    document.getElementById(
      "coachMeta"
    );

  const noCoach =
    document.getElementById(
      "noCoach"
    );

  const area =
    document.getElementById(
      "area"
    );

  const ward =
    document.getElementById(
      "ward"
    );

  const packageSelect =
    document.getElementById(
      "packageSelect"
    );

  const packageInfo =
    document.getElementById(
      "packageInfo"
    );

  const requestedSessionsField =
    document.getElementById(
      "requestedSessionsField"
    );

  const requestedSessions =
    document.getElementById(
      "requestedSessions"
    );

  const goalField =
    document.getElementById(
      "goalField"
    );

  const learningGoal =
    document.getElementById(
      "learningGoal"
    );

  const registerForm =
    document.getElementById(
      "registerForm"
    );

  const message =
    document.getElementById(
      "message"
    );

  const password =
    document.getElementById(
      "password"
    );

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    );

  const togglePassword =
    document.getElementById(
      "togglePassword"
    );

  const toggleConfirmPassword =
    document.getElementById(
      "toggleConfirmPassword"
    );

  const groupPreference =
    document.getElementById(
      "groupPreference"
    );

  const partnerFields =
    document.getElementById(
      "partnerFields"
    );

  const partnerPhone =
    document.getElementById(
      "partnerPhone"
    );

  const partnerEmail =
    document.getElementById(
      "partnerEmail"
    );


  function setupPasswordToggle(
    input,
    button
  ) {

    button.addEventListener(
      "click",
      function () {

        const isHidden =
          input.type === "password";

        input.type =
          isHidden
            ? "text"
            : "password";

        button.textContent =
          isHidden
            ? "🙈"
            : "👁️";

        button.setAttribute(
          "aria-label",
          isHidden
            ? "Ẩn mật khẩu"
            : "Hiện mật khẩu"
        );

      }
    );

  }


  setupPasswordToggle(
    password,
    togglePassword
  );


  setupPasswordToggle(
    confirmPassword,
    toggleConfirmPassword
  );


  function updateGroupFields() {

    const hasPartner =
      groupPreference.value
      ===
      "bring_partner";

    partnerFields.style.display =
      hasPartner
        ? "grid"
        : "none";

    if (!hasPartner) {

      partnerPhone.value = "";
      partnerEmail.value = "";

    }

  }


  groupPreference.addEventListener(
    "change",
    updateGroupFields
  );


  updateGroupFields();


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    message.textContent =
      "Không tải được hệ thống PickDee Academy.";

    message.className =
      "message error";

    return;

  }


  const sb =
    window.PICKDEE_SUPABASE
    ||
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const authSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function money(value) {

    if (
      value === null
      ||
      value === undefined
      ||
      value === ""
    ) {
      return "";
    }

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value)
    ) + "đ";

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlCoachId =
    Number(
      params.get("coach_id")
    );


  const storedCoachId =
    Number(
      sessionStorage.getItem(
        "pickdee_selected_coach_id"
      )
    );


  const selectedCoachId =
    Number.isInteger(urlCoachId)
    &&
    urlCoachId > 0
      ?
        urlCoachId
      :
        (
          Number.isInteger(
            storedCoachId
          )
          &&
          storedCoachId > 0
            ?
              storedCoachId
            :
              null
        );


  let allAreas = [];
  let allWards = [];
  let allPackages = [];


  /* ===============================================
     LOAD COACH
  ================================================ */

  if (selectedCoachId) {

    const {
      data,
      error
    } =
      await sb.rpc(
        "public_get_coach_profile",
        {
          p_coach_id:
            selectedCoachId
        }
      );


    const coach =
      Array.isArray(data)
        ?
          data[0]
        :
          null;


    if (
      !error
      &&
      coach
    ) {

      coachName.textContent =
        coach.full_name
        ||
        "Coach PickDee";


      coachMeta.textContent =
        [
          coach.coach_code,
          coach.preferred_ward,
          coach.preferred_area
        ]
          .filter(Boolean)
          .join(" · ");


      coachBox.classList.add(
        "show"
      );


      noCoach.style.display =
        "none";


      sessionStorage.setItem(
        "pickdee_selected_coach_id",
        String(
          selectedCoachId
        )
      );

    }

  }


  /* ===============================================
     LOAD KHU VỰC + GÓI HỌC
  ================================================ */

  const [
    areasResult,
    wardsResult,
    packagesResult
  ] =
    await Promise.all([

      sb
        .from("dm_khu_vuc")
        .select(
          "ma_khu_vuc,tinh_thanh"
        )
        .eq(
          "dang_hoat_dong",
          true
        ),

      sb
        .from("dm_xa_phuong")
        .select(
          "ma_xa_phuong,ma_khu_vuc,tinh_thanh,ten_xa_phuong"
        )
        .eq(
          "dang_hoat_dong",
          true
        ),

      sb.rpc(
        "public_get_active_packages"
      )

    ]);


  if (
    areasResult.error
    ||
    wardsResult.error
    ||
    packagesResult.error
  ) {

    console.error(
      areasResult.error,
      wardsResult.error,
      packagesResult.error
    );

    message.textContent =
      "Không tải được dữ liệu đăng ký.";

    message.className =
      "message error";

    return;

  }


  allAreas =
    areasResult.data || [];

  allWards =
    wardsResult.data || [];

  allPackages =
    packagesResult.data || [];


  const areaNames =
    [
      ...new Set(
        allAreas
          .map(
            item =>
              String(
                item.tinh_thanh
                ||
                ""
              ).trim()
          )
          .filter(Boolean)
      )
    ]
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            "vi"
          )
      );


  area.innerHTML = `

    <option value="">
      Chọn Tỉnh / Thành
    </option>

    ${
      areaNames
        .map(
          item => `

            <option
              value="${escapeHtml(item)}"
            >
              ${escapeHtml(item)}
            </option>

          `
        )
        .join("")
    }

  `;


  packageSelect.innerHTML = `

    <option value="">
      Chọn gói học
    </option>

    ${
      allPackages
        .map(
          item => `

            <option
              value="${Number(item.id)}"
            >
              ${escapeHtml(
                item.package_name
              )}
            </option>

          `
        )
        .join("")
    }

  `;


  /* ===============================================
     PHƯỜNG / XÃ
  ================================================ */

  area.addEventListener(
    "change",
    function () {

      const selectedArea =
        String(
          area.value || ""
        ).trim();


      if (!selectedArea) {

        ward.disabled =
          true;

        ward.innerHTML = `

          <option value="">
            Chọn Tỉnh / Thành trước
          </option>

        `;

        return;

      }


      const wards =
        [
          ...new Set(
            allWards
              .filter(
                item =>
                  String(
                    item.tinh_thanh
                    ||
                    ""
                  ).trim()
                  ===
                  selectedArea
              )
              .map(
                item =>
                  String(
                    item.ten_xa_phuong
                    ||
                    ""
                  ).trim()
              )
              .filter(Boolean)
          )
        ]
          .sort(
            (a,b) =>
              a.localeCompare(
                b,
                "vi"
              )
          );


      ward.innerHTML = `

        <option value="">
          Chọn Phường / Xã
        </option>

        ${
          wards
            .map(
              item => `

                <option
                  value="${escapeHtml(item)}"
                >
                  ${escapeHtml(item)}
                </option>

              `
            )
            .join("")
        }

      `;


      ward.disabled =
        false;

    }
  );


  /* ===============================================
     GÓI HỌC
  ================================================ */

  packageSelect.addEventListener(
    "change",
    function () {

      const packageId =
        Number(
          packageSelect.value
        );


      const item =
        allPackages.find(
          row =>
            Number(row.id)
            ===
            packageId
        );


      if (!item) {

        packageInfo.classList.remove(
          "show"
        );

        requestedSessionsField.classList.remove(
          "show"
        );

        goalField.classList.remove(
          "show"
        );

        requestedSessions.required =
          false;

        learningGoal.required =
          false;

        return;

      }


      const priceText =
        item.price
          ?
            money(item.price)
          :
            (
              item.unit_price
                ?
                  money(
                    item.unit_price
                  )
                  +
                  "/người/buổi"
                :
                  "Liên hệ"
            );


      packageInfo.innerHTML = `

        <b>
          ${escapeHtml(
            item.package_name
          )}
        </b>

        <br>

        ${
          item.total_sessions
            ?
              escapeHtml(
                item.total_sessions
              )
              +
              " buổi · "
            :
              ""
        }

        ${escapeHtml(priceText)}

        ${
          item.price_note
            ?
              `

                <br>

                ${
                  escapeHtml(
                    item.price_note
                  )
                }

              `
            :
              ""
        }

      `;


      packageInfo.classList.add(
        "show"
      );


      const isCustom =
        String(
          item.package_code
          ||
          ""
        )
          .trim()
          .toUpperCase()
        ===
        "TYC";


      requestedSessionsField.classList.toggle(
        "show",
        isCustom
      );


      goalField.classList.toggle(
        "show",
        isCustom
      );


      requestedSessions.required =
        isCustom;


      learningGoal.required =
        isCustom;

    }
  );


  /* ===============================================
     GỬI ĐĂNG KÝ THẬT
  ================================================ */

  registerForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      if (
        !registerForm.checkValidity()
      ) {

        registerForm.reportValidity();

        return;

      }


      if (
        password.value
        !==
        confirmPassword.value
      ) {

        message.textContent =
          "Mật khẩu xác nhận không khớp.";

        message.className =
          "message error";

        confirmPassword.focus();

        return;

      }


      const submitBtn =
        registerForm.querySelector(
          ".button"
        );


      const selectedPackageId =
        Number(
          packageSelect.value
        );


      const selectedPackage =
        allPackages.find(
          item =>
            Number(item.id)
            ===
            selectedPackageId
        );


      if (!selectedPackage) {

        message.textContent =
          "Bạn chưa chọn gói học.";

        message.className =
          "message error";

        return;

      }


      const isCustom =
        String(
          selectedPackage.package_code
          ||
          ""
        )
          .trim()
          .toUpperCase()
        ===
        "TYC";


      const requestedSessionsValue =
        isCustom
          ?
            Number(
              requestedSessions.value
            )
          :
            null;


      if (
        isCustom
        &&
        (
          !Number.isInteger(
            requestedSessionsValue
          )
          ||
          requestedSessionsValue <= 0
        )
      ) {

        message.textContent =
          "Vui lòng nhập số buổi muốn học.";

        message.className =
          "message error";

        requestedSessions.focus();

        return;

      }


      if (
        isCustom
        &&
        !String(
          learningGoal.value || ""
        ).trim()
      ) {

        message.textContent =
          "Vui lòng nhập mục tiêu học.";

        message.className =
          "message error";

        learningGoal.focus();

        return;

      }


      const groupPreferenceValue =
        String(
          groupPreference.value
          ||
          "solo"
        ).trim();


      const partnerPhoneValue =
        String(
          partnerPhone.value
          ||
          ""
        ).trim();


      const partnerEmailValue =
        String(
          partnerEmail.value
          ||
          ""
        )
          .trim()
          .toLowerCase();


      const ownPhoneValue =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const ownEmailValue =
        document
          .getElementById(
            "email"
          )
          .value
          .trim()
          .toLowerCase();


      if (
        groupPreferenceValue
        ===
        "bring_partner"
        &&
        !partnerPhoneValue
        &&
        !partnerEmailValue
      ) {

        message.textContent =
          "Vui lòng nhập SĐT hoặc email của người bạn muốn học cùng.";

        message.className =
          "message error";

        partnerPhone.focus();

        return;

      }


      if (
        partnerPhoneValue
        &&
        partnerPhoneValue
        ===
        ownPhoneValue
      ) {

        message.textContent =
          "SĐT bạn học không được trùng với SĐT của bạn.";

        message.className =
          "message error";

        partnerPhone.focus();

        return;

      }


      if (
        partnerEmailValue
        &&
        partnerEmailValue
        ===
        ownEmailValue
      ) {

        message.textContent =
          "Email bạn học không được trùng với email của bạn.";

        message.className =
          "message error";

        partnerEmail.focus();

        return;

      }


      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "ĐANG GỬI ĐĂNG KÝ...";


      message.textContent =
        "";

      message.className =
        "message";


      try {

        const emailValue =
          ownEmailValue;


        /*
        ===============================================
        TẠO TÀI KHOẢN SUPABASE AUTH CHO HỌC VIÊN
        ===============================================
        */

        const {
          data: authData,
          error: authError
        } =
          await authSb.auth.signUp({
            email:
              emailValue,

            password:
              password.value
          });


        if (authError) {

          let authErrorText =
            authError.message
            ||
            "Không tạo được tài khoản học viên.";


          const lowerError =
            authErrorText
              .toLowerCase();


          if (
            lowerError.includes(
              "already registered"
            )
            ||
            lowerError.includes(
              "already exists"
            )
          ) {

            authErrorText =
              "Email này đã có tài khoản PickDee. Vui lòng dùng tài khoản hiện có.";

          }


          throw new Error(
            authErrorText
          );

        }


        const authUserId =
          authData?.user?.id;


        if (
          !authUserId
        ) {

          throw new Error(
            "Không lấy được mã tài khoản học viên."
          );

        }


        if (
          Array.isArray(
            authData?.user?.identities
          )
          &&
          authData.user.identities.length
          ===
          0
        ) {

          throw new Error(
            "Email này đã có tài khoản PickDee. Vui lòng dùng tài khoản hiện có."
          );

        }


        /*
        ===============================================
        PAYLOAD ĐĂNG KÝ HỌC
        ===============================================
        */

        const payload = {

          full_name:
            document
              .getElementById(
                "fullName"
              )
              .value
              .trim(),

          phone:
            ownPhoneValue,

          email:
            emailValue,

          auth_user_id:
            authUserId,

          preferred_area:
            area.value,

          preferred_ward:
            ward.value,

          package_id:
            selectedPackageId,

          coach_id:
            selectedCoachId,

          referral_code:
            document
              .getElementById(
                "referralCode"
              )
              .value
              .trim(),

          learning_goal:
            isCustom
              ?
                learningGoal.value.trim()
              :
                "",

          requested_sessions:
            isCustom
              ?
                requestedSessionsValue
              :
                null,

          group_preference:
            groupPreferenceValue,

          partner_email:
            groupPreferenceValue
            ===
            "bring_partner"
              ?
                (
                  partnerEmailValue
                  ||
                  null
                )
              :
                null,

          partner_phone:
            groupPreferenceValue
            ===
            "bring_partner"
              ?
                (
                  partnerPhoneValue
                  ||
                  null
                )
              :
                null,

          source:
            "Web PickDee"

        };


        const {
          data,
          error
        } =
          await sb.functions.invoke(
            "pickdee-registration",
            {
              body:
                payload
            }
          );


        if (error) {

          let errorText =
            error.message
            ||
            "Không gửi được đăng ký.";


          try {

            if (
              error.context
              &&
              typeof error.context.json
              ===
              "function"
            ) {

              const errorBody =
                await error.context.json();


              if (
                errorBody?.error
              ) {

                errorText =
                  errorBody.error;

              }

            }

          }
          catch (_) {}


          throw new Error(
            errorText
          );

        }


        if (
          !data
          ||
          data.ok !== true
        ) {

          throw new Error(
            data?.error
            ||
            "Không tạo được đăng ký học."
          );

        }


        const registrationId =
          Number(
            data.registration?.id
          );


        const registrationCode =
          String(
            data.registration
              ?.registration_code
            ||
            ""
          );


        sessionStorage.setItem(
          "pickdee_last_registration_id",
          String(
            registrationId
          )
        );


        sessionStorage.setItem(
          "pickdee_last_registration_code",
          registrationCode
        );


        sessionStorage.removeItem(
          "pickdee_selected_coach_id"
        );


        message.textContent =
          "✓ Đăng ký học thành công. Mã đăng ký: "
          +
          (
            registrationCode
            ||
            registrationId
          );


        message.className =
          "message ok";


        submitBtn.textContent =
          "ĐÃ ĐĂNG KÝ ✓";

      }
      catch (error) {

        console.error(
          "PICKDEE REGISTRATION:",
          error
        );


        message.textContent =
          error?.message
          ||
          "Không gửi được đăng ký. Vui lòng thử lại.";

        message.className =
          "message error";


        submitBtn.disabled =
          false;

        submitBtn.textContent =
          "TIẾP TỤC →";

      }

    }
  );

})();
</script>
