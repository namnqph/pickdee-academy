<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="./config.js"></script>


<script>

(async function () {


/* =====================================================
   SUPABASE
===================================================== */

const cfg =
  window.PICKDEE_CONFIG || {};


const sb =
  window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const areaSelect =
  document.getElementById(
    "areaSelect"
  );


const searchBtn =
  document.getElementById(
    "searchBtn"
  );


const importBtn =
  document.getElementById(
    "importBtn"
  );


const selectAll =
  document.getElementById(
    "selectAll"
  );


const message =
  document.getElementById(
    "message"
  );


const resultSection =
  document.getElementById(
    "resultSection"
  );


const resultBody =
  document.getElementById(
    "resultBody"
  );


const foundCount =
  document.getElementById(
    "foundCount"
  );


const selectedCount =
  document.getElementById(
    "selectedCount"
  );


const importedCount =
  document.getElementById(
    "importedCount"
  );


/* =====================================================
   DATA
===================================================== */

let results =
  [];


let imported =
  0;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  error = false
) {


  message.textContent =
    text || "";


  message.style.color =
    error
      ? "#ffaaaa"
      : "#b9ff18";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {


  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   AUTH ADMIN
===================================================== */

const {
  data: { session }
} =
  await sb.auth.getSession();


if (!session) {


  location.replace(
    "./login.html"
  );


  return;

}


const {
  data: profile,
  error: profileError
} =
  await sb
    .from("profiles")
    .select("role")
    .eq(
      "id",
      session.user.id
    )
    .single();


if (
  profileError
  ||
  !profile
  ||
  profile.role !== "admin"
) {


  location.replace(
    "./login.html"
  );


  return;

}


/* =====================================================
   LOAD TỈNH / THÀNH
===================================================== */

async function loadAreas() {


  areaSelect.disabled =
    true;


  areaSelect.innerHTML =
    `
      <option value="">
        Đang tải Tỉnh/Thành...
      </option>
    `;


  const {
    data,
    error
  } =
    await sb
      .from("dm_khu_vuc")
      .select(
        "ma_khu_vuc,tinh_thanh"
      )
      .eq(
        "dang_hoat_dong",
        true
      )
      .order(
        "tinh_thanh",
        {
          ascending: true
        }
      );


  if (error) {


    console.error(
      "Lỗi tải tỉnh/thành:",
      error
    );


    areaSelect.innerHTML =
      `
        <option value="">
          Không tải được Tỉnh/Thành
        </option>
      `;


    showMessage(
      "Không tải được danh sách Tỉnh/Thành.",
      true
    );


    return false;

  }


  areaSelect.innerHTML =
    `
      <option value="">
        Chọn Tỉnh/Thành
      </option>
    `;


  (data || []).forEach(
    area => {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        area.tinh_thanh;


      option.textContent =
        area.tinh_thanh;


      option.dataset.maKhuVuc =
        area.ma_khu_vuc;


      areaSelect.appendChild(
        option
      );


    }
  );


  areaSelect.disabled =
    false;


  return true;

}


/* =====================================================
   ESCAPE OVERPASS
===================================================== */

function escapeOverpass(value) {


  return String(
    value || ""
  )

    .replaceAll(
      "\\",
      "\\\\"
    )

    .replaceAll(
      '"',
      '\\"'
    );

}


/* =====================================================
   OVERPASS SERVERS
===================================================== */

/*
  Nếu server đầu lỗi,
  tự chuyển server tiếp theo.
*/

const OVERPASS_ENDPOINTS =
  [

    "https://overpass.kumi.systems/api/interpreter",

    "https://overpass-api.de/api/interpreter",

    "https://overpass.private.coffee/api/interpreter"

  ];


/* =====================================================
   FETCH CÓ TIMEOUT
===================================================== */

async function fetchWithTimeout(
  url,
  options = {},
  timeoutMs = 45000
) {


  const controller =
    new AbortController();


  const timer =
    setTimeout(
      function () {


        controller.abort();


      },
      timeoutMs
    );


  try {


    const response =
      await fetch(
        url,
        {

          ...options,

          signal:
            controller.signal

        }
      );


    return response;


  }
  finally {


    clearTimeout(
      timer
    );

  }

}


/* =====================================================
   GỌI OVERPASS
===================================================== */

async function fetchOverpass(
  query
) {


  let lastError =
    null;


  /*
    Thử từng server.
  */

  for (
    let i = 0;
    i < OVERPASS_ENDPOINTS.length;
    i++
  ) {


    const endpoint =
      OVERPASS_ENDPOINTS[i];


    const serverNumber =
      i + 1;


    /* =================================================
       THỬ POST
    ================================================= */

    try {


      showMessage(
        `Đang tìm dữ liệu sân... Máy chủ ${serverNumber}/${OVERPASS_ENDPOINTS.length}`
      );


      const response =
        await fetchWithTimeout(
          endpoint,
          {

            method:
              "POST",

            /*
              Không thêm custom headers.
              Tránh phát sinh CORS preflight.
            */

            body:
              "data="
              +
              encodeURIComponent(
                query
              )

          }
        );


      if (!response.ok) {


        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const text =
        await response.text();


      if (!text) {


        throw new Error(
          "Máy chủ trả về dữ liệu trống"
        );

      }


      const json =
        JSON.parse(
          text
        );


      return json;


    }
    catch (error) {


      console.warn(
        "Overpass POST lỗi:",
        endpoint,
        error
      );


      lastError =
        error;

    }


    /* =================================================
       NẾU POST LỖI → THỬ GET
    ================================================= */

    try {


      showMessage(
        `Máy chủ ${serverNumber} POST lỗi. Đang thử phương thức dự phòng...`
      );


      const getUrl =
        endpoint
        +
        "?data="
        +
        encodeURIComponent(
          query
        );


      const response =
        await fetchWithTimeout(
          getUrl,
          {

            method:
              "GET"

          }
        );


      if (!response.ok) {


        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const text =
        await response.text();


      if (!text) {


        throw new Error(
          "Máy chủ trả về dữ liệu trống"
        );

      }


      const json =
        JSON.parse(
          text
        );


      return json;


    }
    catch (error) {


      console.warn(
        "Overpass GET lỗi:",
        endpoint,
        error
      );


      lastError =
        error;

    }

  }


  throw new Error(

    "Không kết nối được máy chủ OpenStreetMap"

    +

    (
      lastError?.message
        ?
        `: ${lastError.message}`
        :
        ""
    )

  );

}


/* =====================================================
   TỌA ĐỘ
===================================================== */

function coordinates(
  element
) {


  if (

    typeof element.lat ===
      "number"

    &&

    typeof element.lon ===
      "number"

  ) {


    return {

      lat:
        element.lat,

      lon:
        element.lon

    };

  }


  if (

    element.center

    &&

    typeof element.center.lat ===
      "number"

    &&

    typeof element.center.lon ===
      "number"

  ) {


    return {

      lat:
        element.center.lat,

      lon:
        element.center.lon

    };

  }


  return {

    lat:
      null,

    lon:
      null

  };

}


/* =====================================================
   TÊN SÂN
===================================================== */

function getCourtName(
  element
) {


  const tags =
    element.tags || {};


  return (

    tags.name

    ||

    tags["name:vi"]

    ||

    tags.operator

    ||

    tags.brand

    ||

    `Sân Pickleball OSM ${element.id}`

  );

}


/* =====================================================
   ĐỊA CHỈ
===================================================== */

function getAddress(
  element
) {


  const tags =
    element.tags || {};


  const parts =
    [

      tags["addr:housenumber"],

      tags["addr:street"],

      tags["addr:suburb"],

      tags["addr:quarter"],

      tags["addr:district"],

      tags["addr:city"],

      tags["addr:province"]

    ]
      .filter(Boolean);


  return parts.join(
    ", "
  );

}


/* =====================================================
   PHƯỜNG / XÃ
===================================================== */

function getWard(
  element
) {


  const tags =
    element.tags || {};


  return (

    tags["addr:suburb"]

    ||

    tags["addr:quarter"]

    ||

    tags["addr:neighbourhood"]

    ||

    null

  );

}


/* =====================================================
   NHẬN BIẾT NGUỒN MATCH
===================================================== */

function getMatchType(
  element
) {


  const tags =
    element.tags || {};


  const sport =
    String(
      tags.sport || ""
    )
      .toLowerCase();


  const name =
    String(
      tags.name || ""
    )
      .toLowerCase();


  if (
    sport.includes(
      "pickleball"
    )
  ) {


    return "sport=pickleball";

  }


  if (
    name.includes(
      "pickleball"
    )
  ) {


    return "Tên có Pickleball";

  }


  return "OpenStreetMap";

}


/* =====================================================
   LOẠI BỎ KẾT QUẢ TRÙNG
===================================================== */

function uniqueElements(
  elements
) {


  const map =
    new Map();


  (elements || []).forEach(
    element => {


      const key =
        `${element.type}/${element.id}`;


      if (
        !map.has(
          key
        )
      ) {


        map.set(
          key,
          element
        );

      }

    }
  );


  return [
    ...map.values()
  ];

}


/* =====================================================
   RENDER
===================================================== */

function renderResults() {


  foundCount.textContent =
    results.length;


  if (
    results.length === 0
  ) {


    resultBody.innerHTML =
      `
        <tr>

          <td
            colspan="5"
            class="empty"
          >

            Chưa có kết quả.

          </td>

        </tr>
      `;


    updateSelectedCount();


    return;

  }


  resultBody.innerHTML =
    results
      .map(
        (item,index) => `


<tr>


<td>

<input
  class="court-checkbox"
  type="checkbox"
  data-index="${index}"
>

</td>


<td>

<strong>
  ${escapeHTML(
    item.name
  )}
</strong>


<div class="small">

${escapeHTML(
  item.type
)}
${escapeHTML(
  item.osmId
)}

</div>

</td>


<td>

<span class="badge">

  ${escapeHTML(
    item.matchType
  )}

</span>


<div class="small">

  OpenStreetMap

</div>

</td>


<td>

${escapeHTML(
  item.address
  ||
  "Chưa có địa chỉ"
)}


${
  item.ward
    ?
    `
      <div class="small">
        Khu vực OSM:
        ${escapeHTML(
          item.ward
        )}
      </div>
    `
    :
    ""
}

</td>


<td>

<div class="small">

${item.latitude ?? "—"}

<br>

${item.longitude ?? "—"}

</div>

</td>


</tr>


        `
      )
      .join("");


  updateSelectedCount();

}


/* =====================================================
   SELECT
===================================================== */

function getSelectedIndexes() {


  return [
    ...document.querySelectorAll(
      ".court-checkbox:checked"
    )
  ]
    .map(
      checkbox =>
        Number(
          checkbox.dataset.index
        )
    );

}


function updateSelectedCount() {


  selectedCount.textContent =
    getSelectedIndexes()
      .length;


  const allCheckboxes =
    [
      ...document.querySelectorAll(
        ".court-checkbox"
      )
    ];


  if (
    allCheckboxes.length === 0
  ) {


    selectAll.checked =
      false;


    return;

  }


  selectAll.checked =
    allCheckboxes.every(
      checkbox =>
        checkbox.checked
    );

}


/* =====================================================
   TÌM OSM
===================================================== */

searchBtn.addEventListener(
  "click",
  async function () {


    const area =
      areaSelect.value.trim();


    if (!area) {


      showMessage(
        "Hãy chọn Tỉnh/Thành.",
        true
      );


      return;

    }


    searchBtn.disabled =
      true;


    importBtn.disabled =
      false;


    selectAll.checked =
      false;


    resultSection.style.display =
      "none";


    results =
      [];


    imported =
      0;


    importedCount.textContent =
      "0";


    showMessage(
      `Đang tìm sân Pickleball tại ${area}...`
    );


    try {


      const safeArea =
        escapeOverpass(
          area
        );


      /*
        TÌM THEO 2 CÁCH:

        1. Có tag sport=pickleball
        2. Tên địa điểm có chữ pickleball

        Như vậy rộng hơn bản cũ.
      */

      const query = `

[out:json][timeout:45];

area
  ["boundary"="administrative"]
  ["name"="${safeArea}"]
  ->.searchArea;

(

  nwr
    ["sport"~"(^|;)pickleball(;|$)",i]
    (area.searchArea);

  nwr
    ["name"~"pickleball",i]
    (area.searchArea);

  nwr
    ["operator"~"pickleball",i]
    (area.searchArea);

);

out center tags;

`;


      const json =
        await fetchOverpass(
          query
        );


      const elements =
        uniqueElements(
          json.elements || []
        );


      results =
        elements
          .map(
            element => {


              const coords =
                coordinates(
                  element
                );


              return {


                externalId:
                  `${element.type}/${element.id}`,


                type:
                  element.type,


                osmId:
                  element.id,


                name:
                  getCourtName(
                    element
                  ),


                area:
                  area,


                ward:
                  getWard(
                    element
                  ),


                address:
                  getAddress(
                    element
                  ),


                latitude:
                  coords.lat,


                longitude:
                  coords.lon,


                matchType:
                  getMatchType(
                    element
                  ),


                sourceUrl:
                  `https://www.openstreetmap.org/${element.type}/${element.id}`

              };


            }
          );


      renderResults();


      resultSection.style.display =
        "block";


      if (
        results.length === 0
      ) {


        showMessage(

          `✓ Đã kết nối OpenStreetMap nhưng chưa tìm thấy sân Pickleball có dữ liệu tại ${area}.`

        );

      }
      else {


        showMessage(

          `✓ Tìm thấy ${results.length} địa điểm tại ${area}. Kiểm tra danh sách rồi chọn sân cần nhập.`

        );

      }


    }
    catch (error) {


      console.error(
        "Lỗi tìm OSM:",
        error
      );


      showMessage(

        "Không tìm được dữ liệu sân: "

        +

        (
          error.message
          ||
          error
        ),

        true

      );

    }
    finally {


      searchBtn.disabled =
        false;

    }

  }
);


/* =====================================================
   CHECKBOX
===================================================== */

resultBody.addEventListener(
  "change",
  function (event) {


    if (
      event.target.classList.contains(
        "court-checkbox"
      )
    ) {


      updateSelectedCount();

    }

  }
);


/* =====================================================
   SELECT ALL
===================================================== */

selectAll.addEventListener(
  "change",
  function () {


    document.querySelectorAll(
      ".court-checkbox"
    )
      .forEach(
        checkbox => {


          checkbox.checked =
            selectAll.checked;

        }
      );


    updateSelectedCount();

  }
);


/* =====================================================
   IMPORT SÂN
===================================================== */

importBtn.addEventListener(
  "click",
  async function () {


    const indexes =
      getSelectedIndexes();


    if (
      indexes.length === 0
    ) {


      showMessage(
        "Bạn chưa chọn sân nào.",
        true
      );


      return;

    }


    importBtn.disabled =
      true;


    searchBtn.disabled =
      true;


    showMessage(
      `Đang nhập ${indexes.length} sân vào kho PickDee...`
    );


    let success =
      0;


    let failed =
      0;


    for (
      const index
      of indexes
    ) {


      const court =
        results[index];


      if (!court) {

        continue;

      }


      try {


        const {
          error
        } =
          await sb.rpc(
            "admin_import_osm_court",
            {


              p_external_id:
                court.externalId,


              p_name:
                court.name,


              p_area:
                court.area,


              p_ward:
                court.ward
                ||
                null,


              p_address:
                court.address
                ||
                null,


              p_latitude:
                court.latitude,


              p_longitude:
                court.longitude,


              p_source_url:
                court.sourceUrl


            }
          );


        if (error) {


          throw error;

        }


        success++;


      }
      catch (error) {


        failed++;


        console.error(
          "Import lỗi:",
          court,
          error
        );

      }

    }


    imported +=
      success;


    importedCount.textContent =
      imported;


    if (
      failed === 0
    ) {


      showMessage(

        `✓ Đã nhập ${success} sân vào kho PickDee.`

      );

    }
    else {


      showMessage(

        `Đã nhập ${success} sân. Có ${failed} sân bị lỗi.`,

        true

      );

    }


    importBtn.disabled =
      false;


    searchBtn.disabled =
      false;

  }
);


/* =====================================================
   START
===================================================== */

await loadAreas();


})();

</script>


</body>

</html>
