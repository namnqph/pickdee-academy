<!doctype html>

<html lang="vi">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Đồng bộ sân | PickDee Academy
</title>


<style>

* {
  box-sizing: border-box;
}

html {
  color-scheme: dark;
}

body {

  margin: 0;

  background: #09111f;

  color: white;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    sans-serif;

}


header {

  padding: 18px 22px;

  border-bottom:
    1px solid #26364b;

  display: flex;

  justify-content:
    space-between;

  gap: 20px;

}


a {

  color: #b9ff18;

  text-decoration: none;

  font-weight: 900;

}


main {

  max-width: 1100px;

  margin: auto;

  padding: 35px 20px 70px;

}


.eyebrow {

  color: #b9ff18;

  font-weight: 900;

}


h1 {

  font-size:
    clamp(
      34px,
      6vw,
      50px
    );

  margin:
    8px 0 8px;

}


.sub {

  color: #9dacbe;

  line-height: 1.5;

  margin-bottom: 28px;

}


.card {

  background: #0e1b2d;

  border:
    1px solid #26364b;

  border-radius: 14px;

  padding: 20px;

  margin-bottom: 20px;

}


label {

  display: block;

  margin-bottom: 7px;

  font-weight: 800;

}


select {

  width: 100%;

  min-height: 48px;

  padding: 12px;

  border-radius: 9px;

  border:
    1px solid #394b62;

  background: #08111d;

  color: white;

  font-size: 16px;

}


.action {

  width: 100%;

  height: 52px;

  border: 0;

  border-radius: 9px;

  margin-top: 15px;

  background: #b9ff18;

  color: #07101b;

  font-weight: 900;

  cursor: pointer;

}


.action:disabled {

  opacity: .5;

  cursor: wait;

}


#importBtn {

  margin-top: 0;

}


.summary {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 12px;

  margin-bottom: 20px;

}


.summary-card {

  background: #0e1b2d;

  border:
    1px solid #26364b;

  border-radius: 12px;

  padding: 16px;

}


.summary-label {

  color: #9dacbe;

  font-size: 13px;

}


.summary-value {

  margin-top: 5px;

  color: #b9ff18;

  font-size: 26px;

  font-weight: 900;

}


.toolbar {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  margin-bottom: 15px;

}


.table-wrap {

  overflow-x: auto;

}


table {

  width: 100%;

  min-width: 850px;

  border-collapse:
    collapse;

}


th,
td {

  text-align: left;

  padding:
    13px 9px;

  border-bottom:
    1px solid #26364b;

  vertical-align:
    top;

}


th {

  color: #b9ff18;

  font-size: 13px;

}


.small {

  color: #9dacbe;

  font-size: 13px;

  margin-top: 4px;

}


.badge {

  display: inline-block;

  padding: 5px 8px;

  border-radius: 20px;

  background:
    rgba(
      185,
      255,
      24,
      .12
    );

  color: #b9ff18;

  font-size: 12px;

  font-weight: 900;

}


#message {

  min-height: 25px;

  margin:
    13px 0;

  font-weight: 800;

}


input[type="checkbox"] {

  width: 20px;

  height: 20px;

}


@media(max-width:700px) {

  .summary {

    grid-template-columns: 1fr;

  }

  .toolbar {

    align-items: stretch;

    flex-direction: column;

  }

}

</style>

</head>


<body>


<header>

<strong>
  PickDee Academy
</strong>


<a href="./admin-courts">
  ← Sân & khu vực
</a>

</header>


<main>


<div class="eyebrow">

  KHO SÂN PICKDEE

</div>


<h1>

  Tìm sân Pickleball

</h1>


<div class="sub">

  Tìm các địa điểm Pickleball
  đang có trên OpenStreetMap theo
  từng Tỉnh/Thành, sau đó đưa
  những sân cần dùng vào hệ thống PickDee.

</div>



<section class="card">


<label>
  Tỉnh / Thành
</label>


<select id="areaSelect">

<option value="">
  Đang tải Tỉnh/Thành...
</option>

</select>


<button
  id="searchBtn"
  class="action"
  type="button"
>

  🔎 TÌM SÂN PICKLEBALL

</button>


<div id="message"></div>


</section>



<section
  id="resultSection"
  style="display:none"
>


<div class="summary">


<div class="summary-card">

<div class="summary-label">
  Tìm thấy
</div>

<div
  id="foundCount"
  class="summary-value"
>
0
</div>

</div>


<div class="summary-card">

<div class="summary-label">
  Đã chọn
</div>

<div
  id="selectedCount"
  class="summary-value"
>
0
</div>

</div>


<div class="summary-card">

<div class="summary-label">
  Đã nhập
</div>

<div
  id="importedCount"
  class="summary-value"
>
0
</div>

</div>


</div>



<section class="card">


<div class="toolbar">


<label
  style="
    margin:0;
    display:flex;
    gap:8px;
    align-items:center
  "
>

<input
  id="selectAll"
  type="checkbox"
>

Chọn tất cả

</label>


<button
  id="importBtn"
  class="action"
  type="button"
  style="
    width:auto;
    padding:0 22px
  "
>

  + NHẬP SÂN ĐÃ CHỌN

</button>


</div>



<div class="table-wrap">


<table>


<thead>

<tr>

<th></th>

<th>Tên sân</th>

<th>Thông tin OSM</th>

<th>Địa chỉ</th>

<th>Tọa độ</th>

</tr>

</thead>


<tbody id="resultBody"></tbody>


</table>


</div>


</section>


</section>


</main>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="./config.js"></script>


<script>

(async function () {


const cfg =
  window.PICKDEE_CONFIG || {};


const sb =
  window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_PUBLISHABLE_KEY
  );


const areaSelect =
  document.getElementById(
    "areaSelect"
  );


const searchBtn =
  document.getElementById(
    "searchBtn"
  );


const importBtn =
  document.getElementById(
    "importBtn"
  );


const selectAll =
  document.getElementById(
    "selectAll"
  );


const message =
  document.getElementById(
    "message"
  );


const resultSection =
  document.getElementById(
    "resultSection"
  );


const resultBody =
  document.getElementById(
    "resultBody"
  );


const foundCount =
  document.getElementById(
    "foundCount"
  );


const selectedCount =
  document.getElementById(
    "selectedCount"
  );


const importedCount =
  document.getElementById(
    "importedCount"
  );


let results = [];

let imported =
  0;



/* =====================================
   MESSAGE
===================================== */

function showMessage(
  text,
  error = false
) {

  message.textContent =
    text || "";


  message.style.color =
    error
      ? "#ffaaaa"
      : "#b9ff18";

}



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =====================================
   AUTH ADMIN
===================================== */

const {
  data: { session }
} =
  await sb.auth.getSession();


if (!session) {

  location.replace(
    "./login.html"
  );

  return;

}


const {
  data: profile,
  error: profileError
} =
  await sb
    .from("profiles")
    .select("role")
    .eq(
      "id",
      session.user.id
    )
    .single();


if (
  profileError ||
  !profile ||
  profile.role !== "admin"
) {

  location.replace(
    "./login.html"
  );

  return;

}



/* =====================================
   LOAD 34 TỈNH / THÀNH
===================================== */

async function loadAreas() {


const {
  data,
  error
} =
  await sb
    .from("dm_khu_vuc")
    .select(
      "ma_khu_vuc,tinh_thanh"
    )
    .eq(
      "dang_hoat_dong",
      true
    )
    .order(
      "tinh_thanh",
      {
        ascending: true
      }
    );


if (error) {

  showMessage(
    "Không tải được danh sách Tỉnh/Thành.",
    true
  );

  return;

}


areaSelect.innerHTML =
  `
    <option value="">
      Chọn Tỉnh/Thành
    </option>
  `;


(data || []).forEach(
  area => {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      area.tinh_thanh;


    option.textContent =
      area.tinh_thanh;


    areaSelect.appendChild(
      option
    );


  }
);


}



/* =====================================
   ESCAPE OVERPASS STRING
===================================== */

function escapeOverpass(value) {

  return String(value || "")
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      '"',
      '\\"'
    );

}



/* =====================================
   LẤY TỌA ĐỘ
===================================== */

function coordinates(element) {


if (
  typeof element.lat ===
    "number"
  &&
  typeof element.lon ===
    "number"
) {

  return {
    lat: element.lat,
    lon: element.lon
  };

}


if (
  element.center
  &&
  typeof element.center.lat ===
    "number"
  &&
  typeof element.center.lon ===
    "number"
) {

  return {

    lat:
      element.center.lat,

    lon:
      element.center.lon

  };

}


return {

  lat: null,

  lon: null

};

}



/* =====================================
   TÊN SÂN
===================================== */

function getCourtName(
  element
) {


const tags =
  element.tags || {};


return (

  tags.name

  ||

  tags["name:vi"]

  ||

  tags.operator

  ||

  `Sân Pickleball OSM ${element.id}`

);

}



/* =====================================
   ĐỊA CHỈ
===================================== */

function getAddress(
  element
) {


const tags =
  element.tags || {};


const house =
  tags["addr:housenumber"];


const street =
  tags["addr:street"];


const suburb =
  tags["addr:suburb"];


const district =
  tags["addr:district"];


const city =
  tags["addr:city"];


const parts =
  [
    house,
    street,
    suburb,
    district,
    city
  ]
    .filter(Boolean);


return parts.join(", ");

}



/* =====================================
   PHƯỜNG/XÃ NẾU OSM CÓ
===================================== */

function getWard(
  element
) {


const tags =
  element.tags || {};


return (

  tags["addr:suburb"]

  ||

  tags["addr:quarter"]

  ||

  tags["addr:neighbourhood"]

  ||

  null

);

}



/* =====================================
   RENDER
===================================== */

function renderResults() {


foundCount.textContent =
  results.length;


resultBody.innerHTML =
  results
    .map(
      (item,index) => `


<tr>


<td>

<input
  class="court-checkbox"
  type="checkbox"
  data-index="${index}"
>

</td>


<td>

<strong>
  ${escapeHTML(item.name)}
</strong>

<div class="small">

${escapeHTML(
  item.type
)} ${escapeHTML(
  item.osmId
)}

</div>

</td>


<td>

<span class="badge">
  sport=pickleball
</span>

<div class="small">
  OpenStreetMap
</div>

</td>


<td>

${escapeHTML(
  item.address || "Chưa có địa chỉ"
)}

</td>


<td>

<div class="small">

${item.latitude ?? "—"}

<br>

${item.longitude ?? "—"}

</div>

</td>


</tr>


      `
    )
    .join("");


updateSelectedCount();

}



/* =====================================
   SELECT COUNT
===================================== */

function getSelectedIndexes() {


return [
  ...document.querySelectorAll(
    ".court-checkbox:checked"
  )
]
  .map(
    checkbox =>
      Number(
        checkbox.dataset.index
      )
  );

}


function updateSelectedCount() {


selectedCount.textContent =
  getSelectedIndexes()
    .length;

}



/* =====================================
   TÌM OSM
===================================== */

searchBtn.addEventListener(
  "click",
  async function () {


const area =
  areaSelect.value.trim();


if (!area) {

  showMessage(
    "Hãy chọn Tỉnh/Thành.",
    true
  );

  return;

}


searchBtn.disabled =
  true;


resultSection.style.display =
  "none";


results = [];


imported = 0;


importedCount.textContent =
  "0";


showMessage(
  `Đang tìm sân Pickleball tại ${area}...`
);


try {


const safeArea =
  escapeOverpass(area);


/*
  Tìm boundary cấp tỉnh.
  Sau đó tìm node / way / relation
  có sport=pickleball.
*/

const query = `

[out:json][timeout:60];

area
  ["boundary"="administrative"]
  ["admin_level"="4"]
  ["name"="${safeArea}"]
  ->.searchArea;

(

  nwr
    ["sport"~"(^|;)pickleball(;|$)"]
    (area.searchArea);

);

out center tags;

`;


const response =
  await fetch(
    "https://overpass-api.de/api/interpreter",
    {

      method:
        "POST",

      headers: {

        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"

      },

      body:
        "data="
        +
        encodeURIComponent(
          query
        )

    }
  );


if (!response.ok) {

  throw new Error(
    `Overpass HTTP ${response.status}`
  );

}


const json =
  await response.json();


const elements =
  json.elements || [];


results =
  elements
    .map(
      element => {


        const coords =
          coordinates(
            element
          );


        return {


          externalId:
            `${element.type}/${element.id}`,


          type:
            element.type,


          osmId:
            element.id,


          name:
            getCourtName(
              element
            ),


          area:
            area,


          ward:
            getWard(
              element
            ),


          address:
            getAddress(
              element
            ),


          latitude:
            coords.lat,


          longitude:
            coords.lon,


          sourceUrl:
            `https://www.openstreetmap.org/${element.type}/${element.id}`

        };


      }
    );


renderResults();


resultSection.style.display =
  "block";


if (
  results.length === 0
) {

  showMessage(
    `Chưa tìm thấy sân Pickleball được gắn dữ liệu OSM tại ${area}.`
  );

}
else {

  showMessage(
    `✓ Tìm thấy ${results.length} kết quả tại ${area}. Hãy kiểm tra rồi chọn sân cần nhập.`
  );

}


}
catch (error) {


console.error(
  error
);


showMessage(
  "Không tìm được dữ liệu sân: "
  +
  (
    error.message ||
    error
  ),
  true
);


}
finally {


searchBtn.disabled =
  false;


}


  }
);



/* =====================================
   CHECKBOX
===================================== */

resultBody.addEventListener(
  "change",
  function (event) {


if (
  event.target.classList.contains(
    "court-checkbox"
  )
) {

  updateSelectedCount();

}


  }
);



selectAll.addEventListener(
  "change",
  function () {


document.querySelectorAll(
  ".court-checkbox"
)
.forEach(
  checkbox => {

    checkbox.checked =
      selectAll.checked;

  }
);


updateSelectedCount();


  }
);



/* =====================================
   IMPORT
===================================== */

importBtn.addEventListener(
  "click",
  async function () {


const indexes =
  getSelectedIndexes();


if (
  indexes.length === 0
) {

  showMessage(
    "Bạn chưa chọn sân nào.",
    true
  );

  return;

}


importBtn.disabled =
  true;


showMessage(
  `Đang nhập ${indexes.length} sân vào PickDee...`
);


let success =
  0;


let failed =
  0;


for (
  const index of indexes
) {


const court =
  results[index];


try {


const {
  error
} =
  await sb.rpc(
    "admin_import_osm_court",
    {

      p_external_id:
        court.externalId,

      p_name:
        court.name,

      p_area:
        court.area,

      p_ward:
        court.ward,

      p_address:
        court.address
        ||
        null,

      p_latitude:
        court.latitude,

      p_longitude:
        court.longitude,

      p_source_url:
        court.sourceUrl

    }
  );


if (error) {

  throw error;

}


success++;


}
catch (error) {


failed++;


console.error(
  "Import lỗi:",
  court,
  error
);


}


}


imported +=
  success;


importedCount.textContent =
  imported;


if (
  failed === 0
) {

  showMessage(
    `✓ Đã nhập ${success} sân vào kho PickDee.`
  );

}
else {

  showMessage(
    `Đã nhập ${success} sân; ${failed} sân bị lỗi.`,
    true
  );

}


importBtn.disabled =
  false;


  }
);



/* =====================================
   START
===================================== */

await loadAreas();


})();

</script>


</body>

</html>
