<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>
  <title>Thêm học viên | PickDee Academy</title>

  <style>
    *{box-sizing:border-box}
    html{
  color-scheme: dark;
}
    body{
      margin:0;
      background:#09111f;
      color:#fff;
      font-family:Inter,system-ui,-apple-system,sans-serif;
    }
    header{
      padding:18px 22px;
      border-bottom:1px solid #26364b;
      display:flex;
      justify-content:space-between;
    }
    a{
      color:#b9ff18;
      text-decoration:none;
      font-weight:800;
    }
    main{
      max-width:760px;
      margin:auto;
      padding:35px 20px;
    }
    h1{font-size:40px;margin:8px 0 25px}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .full{grid-column:1/-1}
    label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
    }
    input,select,textarea{
      width:100%;
      padding:13px;
      border:1px solid #394b62;
      border-radius:9px;
      background:#08111d;
      color:white;
      font-size:16px;
    }
  select option{
  color:#fff;
  background:#08111d;
color-scheme:dark;
}

select{
  color:#fff;
  background:#08111d;
}

select:disabled{
  opacity:.55;
  cursor:not-allowed;
}
    textarea{min-height:90px}
    button{
      width:100%;
      height:52px;
      margin-top:22px;
      border:0;
      border-radius:9px;
      background:#b9ff18;
      color:#07101b;
      font-weight:900;
      cursor:pointer;
    }
    #message{
      margin-top:16px;
      min-height:24px;
    }
    @media(max-width:650px){
      .grid{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>

<body>

<header>
  <strong>PickDee Academy</strong>
  <a href="/students.html">← Danh sách học viên</a>
</header>

<main>

  <div style="color:#b9ff18;font-weight:900">
    QUẢN LÝ HỌC VIÊN
  </div>

  <h1>Thêm học viên</h1>

  <form id="studentForm">

    <div class="grid">

      <div class="full">
        <label>Họ và tên *</label>
        <input id="full_name" required>
      </div>

      <div>
        <label>Số điện thoại</label>
        <input id="phone" inputmode="tel">
      </div>

      <div>
        <label>Email</label>
        <input id="email" type="email">
      </div>

      <div>
        <label>Ngày sinh</label>
        <input id="birth_date" type="date">
      </div>

      <div>
        <label>Giới tính</label>
        <select id="gender">
          <option value="">Chọn</option>
          <option>Nam</option>
          <option>Nữ</option>
          <option>Khác</option>
        </select>
      </div>

    <div>
  <label>Khu vực muốn học</label>

  <select id="preferred_area">
    <option value="">Chọn Tỉnh/Thành</option>
  </select>
</div>

<div>
  <label>Xã/Phường muốn học</label>

  <select id="preferred_ward" disabled>
    <option value="">Chọn Tỉnh/Thành trước</option>
  </select>
</div>

      <div class="full">
        <label>Địa chỉ</label>
        <input id="address">
      </div>

      <div class="full">
        <label>Ghi chú</label>
        <textarea id="note"></textarea>
      </div>

    </div>

    <button type="submit">
      LƯU HỌC VIÊN
    </button>

    <div id="message"></div>

  </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261019-keep30"></script>
<script src="add-student.js?v=20260909-1"></script>

</body>
</html>
