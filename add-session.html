<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tạo đăng ký học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
html {
  color-scheme: dark;
}
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(90,255,180,.13), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(760px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 26px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(34px, 6vw, 52px);
    }

    .student {
      margin-bottom: 26px;
      color: rgba(255,255,255,.68);
    }

    .card {
      background: rgba(6,39,88,.76);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: white;
      outline: none;
    }

    select {
  color: #fff;
  color-scheme: dark;
}

select option {
  color: #fff;
  background: #08111d;
}
    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #d8ff45;
      color: #172600;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ffb0b0;
    }

    .success {
      color: #d8ff45;
    }

    @media (max-width: 650px) {
      .two {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

 <a id="backLink" class="back" href="#">
  ← Chi tiết đăng ký
</a>

  <div class="eyebrow">
    QUẢN LÝ HỌC VIÊN
  </div>

  <h1>Tạo buổi học</h1>

 <div class="sub">
  Tạo lịch học từ đăng ký đã duyệt.
</div>

<form id="sessionForm" class="card">

  <div class="field">
    <label>Đăng ký đã duyệt *</label>
    <select id="registrationId" required>
      <option value="">— Chọn đăng ký —</option>
    </select>
  </div>

  <div class="field">
    <label>Học viên</label>
    <input
      id="studentName"
      type="text"
      value=""
      placeholder="Tự động theo đăng ký"
      readonly
    />
  </div>

  <div class="field">
    <label>Coach phụ trách</label>
    <input
      id="coachName"
      type="text"
      value=""
      placeholder="Tự động theo đăng ký"
      readonly
    />
  </div>

  <div class="field">
    <label>Buổi số *</label>
    <input
      id="sessionNo"
      type="number"
      min="1"
      required
      readonly
    />
  </div>

  <div class="field">
    <label>Ngày học *</label>
    <input
      id="sessionDate"
      type="date"
      required
    />
  </div>

  <div class="field">
    <label>Giờ bắt đầu *</label>
    <input
      id="startTime"
      type="time"
      required
    />
  </div>

  <div class="field">
    <label>Thời lượng (phút) *</label>
    <input
      id="durationMinutes"
      type="number"
      min="30"
      step="15"
      value="60"
      required
    />
  </div>

  <div class="field">
    <label>Sân học</label>
    <input
      id="courtName"
      type="text"
      placeholder="Ví dụ: Sân PickDee Bắc Giang"
    />
  </div>

  <div class="field">
    <label>Ghi chú</label>
    <textarea
      id="note"
      rows="4"
      placeholder="Ghi chú cho buổi học..."
    ></textarea>
  </div>

  <button id="submitBtn" type="submit">
    + TẠO BUỔI HỌC
  </button>

  <div id="message"></div>

</form>
</main>

<script src="./add-session.js?v=20260909-2"></script>
</body>
</html>
