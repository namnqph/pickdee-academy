<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>Tạo buổi học | PickDee Academy</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #0e0e0e;
      color: #fff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        sans-serif;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #282828;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    a {
      color: #ffc118;
      text-decoration: none;
      font-weight: 800;
    }

    main {
      max-width: 820px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    h1 {
      font-size: 40px;
      margin: 8px 0 8px;
    }

    .sub {
      color: #aeaeae;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    select,
    textarea {

      width: 100%;

      padding: 13px;

      border:
        1px solid #4e4e4e;

      border-radius: 9px;

      background: #0d0d0d;

      color: white;

      font-size: 16px;

    }

    select option {
      color: #fff;
      background: #0d0d0d;
    }

    select:disabled,
    input:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    input[readonly] {
      color: #d3d3d3;
      background: #141414;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .court-info {

      margin-top: 10px;

      padding: 13px;

      border-radius: 9px;

      border:
        1px solid #282828;

      background: #151515;

      display: none;

    }

    .court-name {
      font-weight: 900;
      margin-bottom: 5px;
    }

    .court-price {
      color: #ffc118;
      font-weight: 900;
    }

    .court-address {
      margin-top: 5px;
      color: #aeaeae;
      font-size: 14px;
    }

    .hint {
      margin-top: 6px;
      color: #929292;
      font-size: 13px;
    }

    button {

      width: 100%;

      height: 52px;

      margin-top: 22px;

      border: 0;

      border-radius: 9px;

      background: #ffc118;

      color: #0c0c0c;

      font-weight: 900;

      cursor: pointer;

    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 800;
    }

    @media(max-width:650px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

    }

  </style>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link id="pdFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"><style id="pdFontCss">html body{font-family:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}:where(button,input,select){font-family:inherit}h1,h2,h3{text-wrap:balance}</style>
<script src="/pd-motion.js?v=20261020-m2"></script>
</head>


<body>


<header>

  <strong>
    PickDee Academy
  </strong>

  <a
    id="backLink"
    href="/sessions"
  >
    ← Lịch học
  </a>

</header>


<main>


  <div
    style="
      color:#ffc118;
      font-weight:900
    "
  >
    QUẢN LÝ LỊCH HỌC
  </div>


  <h1>
    Tạo buổi học
  </h1>


  <div class="sub">

    Tạo lịch học từ đăng ký đã được duyệt.
    Chọn khu vực để hệ thống tự lọc danh sách sân.

  </div>


  <form id="sessionForm">


    <div class="grid">


      <!-- ĐĂNG KÝ -->

      <div class="full">

        <label>
          Đăng ký học *
        </label>

        <select
          id="registrationId"
          required
        >

          <option value="">
            Đang tải đăng ký...
          </option>

        </select>

      </div>


      <!-- HỌC VIÊN -->

      <div>

        <label>
          Học viên
        </label>

        <input
          id="studentName"
          readonly
        >

      </div>


      <!-- COACH -->

      <div>

        <label>
          Coach
        </label>

        <input
          id="coachName"
          readonly
        >

      </div>


      <!-- BUỔI SỐ -->

      <div>

        <label>
          Buổi số
        </label>

        <input
          id="sessionNo"
          type="number"
          readonly
        >

      </div>


      <!-- THỜI LƯỢNG -->

      <div>

        <label>
          Thời lượng
        </label>

        <select id="duration">

          <option value="60">
            60 phút
          </option>

          <option value="90">
            90 phút
          </option>

          <option value="120">
            120 phút
          </option>

        </select>

      </div>


      <!-- NGÀY -->

      <div>

        <label>
          Ngày học *
        </label>

        <input
          id="sessionDate"
          type="date"
          required
        >

      </div>


      <!-- GIỜ -->

      <div>

        <label>
          Giờ bắt đầu *
        </label>

        <input
          id="startTime"
          type="time"
          required
        >

      </div>


      <!-- ===================================
           TỈNH / THÀNH
      ==================================== -->

      <div>

        <label>
          Tỉnh / Thành *
        </label>

        <select
          id="areaSelect"
          required
        >

          <option value="">
            Đang tải Tỉnh/Thành...
          </option>

        </select>

      </div>


      <!-- ===================================
           PHƯỜNG / XÃ
      ==================================== -->

      <div>

        <label>
          Phường / Xã
        </label>

        <select
          id="wardSelect"
          disabled
        >

          <option value="">
            Chọn Tỉnh/Thành trước
          </option>

        </select>

      </div>


      <!-- ===================================
           SÂN
      ==================================== -->

      <div class="full">

        <label>
          Sân học *
        </label>

        <select
          id="courtId"
          disabled
          required
        >

          <option value="">
            Chọn Tỉnh/Thành trước
          </option>

        </select>


        <!--
          Giữ lại courtName để tương thích
          với dữ liệu / code cũ.
        -->

        <input
          id="courtName"
          type="hidden"
        >


        <div class="hint">

          Chọn Tỉnh/Thành để xem các sân đang hoạt động.
          Chọn thêm Phường/Xã để lọc chính xác hơn.

        </div>


        <div
          id="courtInfo"
          class="court-info"
        >

          <div
            id="courtDisplayName"
            class="court-name"
          ></div>

          <div
            id="courtCostDisplay"
            class="court-price"
          ></div>

          <div
            id="courtAddressDisplay"
            class="court-address"
          ></div>

        </div>

      </div>


      <!-- GHI CHÚ -->

      <div class="full">

        <label>
          Ghi chú
        </label>

        <textarea
          id="note"
          placeholder="Không bắt buộc"
        ></textarea>

      </div>


    </div>


    <button
      id="submitBtn"
      type="submit"
    >

      TẠO BUỔI HỌC

    </button>


    <div id="message"></div>


  </form>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="./config.js?v=20261019-keep30"></script>

<script src="./add-session.js?v=20261020-gold1"></script>


</body>

</html>
