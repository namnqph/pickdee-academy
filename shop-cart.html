<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071523"
  >

  <title>Giỏ hàng | PickDee Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #071523;
      color: #ffffff;

      padding-bottom:
        calc(100px + env(safe-area-inset-bottom));
    }


    a {
      color: inherit;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      background:
        rgba(7,21,35,.96);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }


    .header-inner {
      width:
        min(900px,calc(100% - 22px));

      min-height: 64px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }


    .brand {
      text-decoration: none;

      font-size: 21px;
      font-weight: 950;

      letter-spacing: -.04em;
    }


    .brand span {
      color: #d8ff45;
    }


    .back-shop {
      min-height: 39px;

      padding:
        0 12px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      border:
        1px solid rgba(255,255,255,.12);

      text-decoration: none;

      color:
        rgba(255,255,255,.78);

      font-size: 11px;
      font-weight: 900;
    }


    /* =====================================================
       MAIN
    ====================================================== */

    main {
      width:
        min(900px,calc(100% - 22px));

      margin:
        22px auto 40px;
    }


    .eyebrow {
      margin-bottom: 7px;

      color: #d8ff45;

      font-size: 11px;
      font-weight: 950;

      letter-spacing: .1em;
    }


    h1 {
      margin:
        0 0 7px;

      font-size:
        clamp(30px,7vw,46px);

      letter-spacing:
        -.045em;

      line-height: 1;
    }


    .intro {
      margin:
        0 0 22px;

      color:
        rgba(255,255,255,.52);

      font-size: 13px;
    }


    /* =====================================================
       CART ITEM
    ====================================================== */

    .cart-list {
      display: grid;
      gap: 11px;
    }


    .cart-item {
      display: grid;

      grid-template-columns:
        92px minmax(0,1fr);

      gap: 12px;

      padding: 11px;

      border-radius: 16px;

      border:
        1px solid rgba(255,255,255,.09);

      background: #0d1d2f;
    }


    .item-image {
      width: 92px;
      height: 92px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #13263a;
    }


    .item-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .item-placeholder {
      color:
        rgba(255,255,255,.22);

      font-size: 31px;
    }


    .item-info {
      min-width: 0;
    }


    .item-name {
      margin-bottom: 4px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 950;

      line-height: 1.35;
    }


    .variant-name {
      margin-bottom: 7px;

      color:
        rgba(255,255,255,.42);

      font-size: 10px;

      font-weight: 800;
    }


    .item-price {
      color: #d8ff45;

      font-size: 16px;
      font-weight: 950;
    }


    /* =====================================================
       ITEM ACTION
    ====================================================== */

    .item-bottom {
      margin-top: 9px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }


    .quantity {
      display: grid;

      grid-template-columns:
        34px 38px 34px;

      height: 35px;

      overflow: hidden;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 9px;
    }


    .quantity button {
      padding: 0;

      border: 0;

      background:
        rgba(255,255,255,.045);

      color: #ffffff;

      font-size: 18px;

      cursor: pointer;
    }


    .quantity span {
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 950;
    }


    .remove-btn {
      border: 0;

      background: transparent;

      color:
        rgba(255,255,255,.40);

      font-size: 11px;
      font-weight: 850;

      cursor: pointer;
    }


    /* =====================================================
       SUMMARY
    ====================================================== */

    .summary {
      margin-top: 18px;

      padding: 17px;

      border-radius: 17px;

      border:
        1px solid rgba(216,255,69,.18);

      background:
        linear-gradient(
          145deg,
          #0d1d2f,
          #102533
        );
    }


    .summary-title {
      margin-bottom: 14px;

      font-size: 15px;
      font-weight: 950;
    }


    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 9px;

      color:
        rgba(255,255,255,.57);

      font-size: 12px;
    }


    .summary-row strong {
      color: #ffffff;
    }


    .summary-total {
      margin-top: 13px;

      padding-top: 13px;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 12px;

      border-top:
        1px solid rgba(255,255,255,.09);
    }


    .total-label {
      color:
        rgba(255,255,255,.55);

      font-size: 11px;
      font-weight: 900;
    }


    .total-price {
      margin-top: 3px;

      color: #d8ff45;

      font-size: 25px;
      font-weight: 950;
    }


    /* =====================================================
       EMPTY
    ====================================================== */

    .empty {
      padding:
        55px 20px;

      border-radius: 18px;

      text-align: center;

      border:
        1px dashed rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.025);
    }


    .empty-icon {
      margin-bottom: 13px;

      font-size: 45px;
    }


    .empty strong {
      display: block;

      margin-bottom: 7px;

      font-size: 18px;
    }


    .empty p {
      margin:
        0 0 18px;

      color:
        rgba(255,255,255,.5);

      font-size: 12px;
    }


    .empty a {
      min-height: 45px;

      padding:
        0 17px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: #d8ff45;

      color: #071523;

      text-decoration: none;

      font-size: 12px;
      font-weight: 950;
    }


    /* =====================================================
       BUY BAR
    ====================================================== */

    .checkout-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 80;

      padding:
        9px 11px
        calc(9px + env(safe-area-inset-bottom));

      border-top:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(7,21,35,.97);

      backdrop-filter:
        blur(16px);
    }


    .checkout-inner {
      width:
        min(900px,100%);

      margin: auto;

      display: grid;

      grid-template-columns:
        .7fr 1.3fr;

      gap: 10px;

      align-items: center;
    }


    .checkout-label {
      color:
        rgba(255,255,255,.45);

      font-size: 9px;

      font-weight: 900;
    }


    .checkout-total {
      margin-top: 2px;

      color: #d8ff45;

      font-size: 19px;
      font-weight: 950;
    }


    .checkout-btn {
      min-height: 50px;

      border: 0;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #d8ff45;
      color: #071523;

      text-decoration: none;

      font-size: 13px;
      font-weight: 950;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:420px) {

      .cart-item {
        grid-template-columns:
          82px minmax(0,1fr);
      }


      .item-image {
        width: 82px;
        height: 82px;
      }


      h1 {
        font-size: 31px;
      }

    }

  </style>

</head>



<body>


<header
  class="header"
  id="shopPublicHeader"
></header>

<script src="./shop-public-nav.js?v=20261006-2"></script>


<main>


  <div class="eyebrow">
    PICKDEE SHOP
  </div>


  <h1>
    Giỏ hàng
  </h1>


  <p class="intro">
    Tổng kho phụ kiện Pickleball hàng tuyển.
  </p>


  <div id="cartContent"></div>


</main>



<div
  id="checkoutBar"
  class="checkout-bar"
  style="display:none;"
>

  <div class="checkout-inner">

    <div>

      <div class="checkout-label">
        TỔNG THANH TOÁN
      </div>

      <div
        id="checkoutTotal"
        class="checkout-total"
      >
        0đ
      </div>

    </div>


    <a
      href="./shop-checkout"
      class="checkout-btn"
    >
      ĐẶT HÀNG →
    </a>

  </div>

</div>



<script>

(function () {


  const CART_KEY =
    "pickdee_shop_cart";


  const SPX_BASE_FEE =
    15000;


  const FREE_SHIPPING_THRESHOLD =
    300000;


  const cfg =
    window.PICKDEE_CONFIG || {};


  const cartContent =
    document.getElementById(
      "cartContent"
    );


  const checkoutBar =
    document.getElementById(
      "checkoutBar"
    );


  const checkoutTotal =
    document.getElementById(
      "checkoutTotal"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    cartContent.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <strong>
          Không tải được giỏ hàng
        </strong>

        <p>
          Không kết nối được hệ thống giá PickDee Shop.
        </p>

      </div>
    `;


    checkoutBar.style.display =
      "none";


    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );



  /* =====================================================
     HELPERS
  ====================================================== */

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function readCart() {

    try {

      const data =
        JSON.parse(
          localStorage.getItem(
            CART_KEY
          )
          ||
          "[]"
        );


      return Array.isArray(data)
        ?
          data
        :
          [];

    }
    catch (_) {

      return [];

    }

  }


  function saveCart(cart) {

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

  }



  /* =====================================================
     TÍNH LẠI GIÁ TỪ BACKEND
  ====================================================== */

  async function refreshCartPrices(
    cart
  ) {

    const pricedCart =
      await Promise.all(

        cart.map(
          async function (item) {

            const quantity =
              Math.max(
                1,
                Math.min(
                  9999,
                  Math.round(
                    Number(
                      item.quantity
                      ||
                      1
                    )
                  )
                )
              );


            const {
              data,
              error
            } =
              await sb.rpc(
                "shop_price_quote",
                {

                  p_variant_id:
                    Number(
                      item.variant_id
                    ),

                  p_quantity:
                    quantity

                }
              );


            if (error) {
              throw error;
            }


            const price =
              Number(
                data?.unit_price
                ??
                item.price
                ??
                0
              );


            const retailPrice =
              Number(
                data?.retail_price
                ??
                item.retail_price
                ??
                item.price
                ??
                0
              );


            return {

              ...item,

              quantity:
                quantity,

              price:
                price,

              retail_price:
                retailPrice,

              pricing_type:
                data?.pricing_type
                ||
                "retail",

              subtotal:
                Number(
                  data?.subtotal
                  ??
                  (
                    price
                    *
                    quantity
                  )
                )

            };

          }
        )

      );


    return pricedCart;

  }



  /* =====================================================
     TOTAL
  ====================================================== */

  function calculateTotal(cart) {

    return cart.reduce(
      function (sum,item) {

        return (
          sum
          +
          (
            Number(
              item.price || 0
            )
            *
            Number(
              item.quantity || 0
            )
          )
        );

      },
      0
    );

  }


  function cartHasPickleballBall(
    cart
  ) {

    const knownBallKeys =
      [
        "lt48",
        "ppa life time",
        "toniker nexus",
        "toniker mate pro"
      ];


    return cart.some(
      function (item) {

        const name =
          String(
            item.product_name || ""
          )
            .trim()
            .toLocaleLowerCase(
              "vi-VN"
            );


        if (
          name.startsWith(
            "bóng "
          )
        ) {

          return true;

        }


        return knownBallKeys.some(
          function (key) {

            return name.includes(
              key
            );

          }
        );

      }
    );

  }


  function shippingQuote(
    cart
  ) {

    const merchandiseTotal =
      calculateTotal(
        cart
      );


    const hasPickleballBall =
      cartHasPickleballBall(
        cart
      );


    const freeShipping =
      merchandiseTotal
        >=
      FREE_SHIPPING_THRESHOLD
      &&
      !hasPickleballBall;


    const shippingFee =
      freeShipping
        ?
          0
        :
          SPX_BASE_FEE;


    let reason =
      "Đơn dưới 300.000đ: phí giao hàng SPX 15.000đ.";


    if (
      hasPickleballBall
    ) {

      reason =
        "Đơn có bóng Pickleball: không áp dụng freeship mặc định.";

    }
    else if (
      freeShipping
    ) {

      reason =
        "Đơn từ 300.000đ và không có bóng Pickleball: PickDee freeship.";

    }


    return {

      merchandiseTotal,

      hasPickleballBall,

      freeShipping,

      shippingFee,

      customerTotal:
        merchandiseTotal
        +
        shippingFee,

      reason

    };

  }



  /* =====================================================
     RENDER
  ====================================================== */

  async function render() {

    let cart =
      readCart();


    if (!cart.length) {

      checkoutBar.style.display =
        "none";


      cartContent.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🛒
          </div>

          <strong>
            Giỏ hàng đang trống
          </strong>

          <p>
            Chọn một món hàng tuyển
            từ PickDee Shop nhé.
          </p>

          <a href="./shop">
            XEM SẢN PHẨM
          </a>

        </div>
      `;


      return;

    }


    /*
      Trong lúc kiểm tra lại giá,
      chưa cho khách đi Checkout.
    */

    checkoutBar.style.display =
      "none";


    try {

      cart =
        await refreshCartPrices(
          cart
        );


      saveCart(
        cart
      );

    }
    catch (error) {

      console.error(
        "CART PRICE ERROR:",
        error
      );


      cartContent.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <strong>
            Chưa kiểm tra được giá
          </strong>

          <p>
            Vui lòng tải lại trang để PickDee Shop
            cập nhật giá bán mới nhất.
          </p>

          <a href="./shop-cart">
            TẢI LẠI GIỎ HÀNG
          </a>

        </div>
      `;


      checkoutBar.style.display =
        "none";


      return;

    }


    const shipping =
      shippingQuote(
        cart
      );


    const total =
      shipping.merchandiseTotal;


    const totalQuantity =
      cart.reduce(
        function (sum,item) {

          return (
            sum
            +
            Number(
              item.quantity || 0
            )
          );

        },
        0
      );


    const itemsHtml =
      cart
        .map(
          function (item,index) {

            const isWholesale =
              item.pricing_type
              ===
              "wholesale"
              &&
              Number(
                item.retail_price || 0
              )
                >
              Number(
                item.price || 0
              );


            const priceNote =
              isWholesale
                ?
                  `
                    <div class="variant-name">
                      GIÁ SỈ • Niêm yết
                      <s>
                        ${money(
                          item.retail_price
                        )}
                      </s>
                    </div>
                  `
                :
                  "";


            return `

              <div class="cart-item">

                <a
                  class="item-image"
                  href="./shop-product?id=${encodeURIComponent(
                    item.product_id
                  )}"
                >

                  ${
                    item.image_url
                      ?
                        `
                          <img
                            src="${escapeHtml(
                              item.image_url
                            )}"
                            alt="${escapeHtml(
                              item.product_name
                            )}"
                          >
                        `
                      :
                        `
                          <div class="item-placeholder">
                            🏓
                          </div>
                        `
                  }

                </a>


                <div class="item-info">

                <a
  class="item-name"
  href="./shop-product?id=${encodeURIComponent(
    item.product_id
  )}"
  style="
    display:inline-block;
    color:#ffffff;
    text-decoration:none;
  "
>
  ${escapeHtml(
    item.product_name
  )}
</a>


                  ${
                    item.variant_name
                      ?
                        `
                          <div class="variant-name">
                            ${escapeHtml(
                              item.variant_name
                            )}
                          </div>
                        `
                      :
                        ""
                  }


                  <div class="item-price">
                    ${money(
                      item.price
                    )}
                  </div>


                  ${priceNote}


                  <div class="item-bottom">

                    <div class="quantity">

                      <button
                        type="button"
                        data-action="minus"
                        data-index="${index}"
                      >
                        −
                      </button>

                      <span>
                        ${Number(
                          item.quantity || 1
                        )}
                      </span>

                      <button
                        type="button"
                        data-action="plus"
                        data-index="${index}"
                      >
                        +
                      </button>

                    </div>


                    <button
                      class="remove-btn"
                      type="button"
                      data-action="remove"
                      data-index="${index}"
                    >
                      XÓA
                    </button>

                  </div>

                </div>

              </div>
            `;

          }
        )
        .join("");


    cartContent.innerHTML = `

      <div class="cart-list">
        ${itemsHtml}
      </div>


      <section class="summary">

        <div class="summary-title">
          Tóm tắt đơn hàng
        </div>


        <div class="summary-row">

          <span>
            Sản phẩm
          </span>

          <strong>
            ${totalQuantity}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Tiền hàng
          </span>

          <strong>
            ${money(total)}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Phí giao hàng
          </span>

          <strong>
            ${money(
              shipping.shippingFee
            )}
          </strong>

        </div>


        ${
          shipping.freeShipping
            ?
              `
                <div class="summary-row">

                  <span>
                    Ưu đãi vận chuyển
                  </span>

                  <strong style="color:#d8ff45;">
                    ✓ FREESHIP PICKDEE
                  </strong>

                </div>
              `
            :
              ""
        }


        <div
          style="
            margin-top:2px;
            color:rgba(255,255,255,.40);
            font-size:10px;
            line-height:1.5;
          "
        >
          ${escapeHtml(
            shipping.reason
          )}
        </div>


        <div class="summary-total">

          <div>

            <div class="total-label">
              TỔNG THANH TOÁN
            </div>

            <div class="total-price">
              ${money(
                shipping.customerTotal
              )}
            </div>

          </div>

        </div>

      </section>
    `;


    checkoutTotal.textContent =
      money(
        shipping.customerTotal
      );


    checkoutBar.style.display =
      "block";


    bindEvents();

  }



  /* =====================================================
     EVENTS
  ====================================================== */

  function bindEvents() {

    document
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            async function () {

              button.disabled =
                true;


              const action =
                button.dataset.action;


              const index =
                Number(
                  button.dataset.index
                );


              const cart =
                readCart();


              const item =
                cart[index];


              if (!item) {

                button.disabled =
                  false;

                return;

              }


              if (
                action === "plus"
              ) {

                item.quantity =
                  Math.min(
                    9999,
                    Number(
                      item.quantity || 1
                    )
                    +
                    1
                  );

              }


              if (
                action === "minus"
              ) {

                item.quantity =
                  Math.max(
                    1,
                    Number(
                      item.quantity || 1
                    )
                    -
                    1
                  );

              }


              if (
                action === "remove"
              ) {

                cart.splice(
                  index,
                  1
                );

              }


              saveCart(
                cart
              );


              await render();

            }
          );

        }
      );

  }



  /* =====================================================
     START
  ====================================================== */

  render();


})();

</script>


</body>

</html>
