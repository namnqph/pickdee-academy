<script>

(function () {

  const CART_KEY =
    "pickdee_shop_cart";

  const SPX_BASE_FEE =
    15000;

  const FREE_SHIPPING_THRESHOLD =
    300000;

  const cfg =
    window.PICKDEE_CONFIG || {};

  const cartContent =
    document.getElementById(
      "cartContent"
    );

  const checkoutBar =
    document.getElementById(
      "checkoutBar"
    );

  const checkoutTotal =
    document.getElementById(
      "checkoutTotal"
    );
  const checkoutBtn =
    document.getElementById(
      "checkoutBtn"
    );


  let checkoutBlockedMessage =
    "";

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    cartContent.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          ⚠️
        </div>

        <strong>
          Không tải được giỏ hàng
        </strong>

        <p>
          Không kết nối được hệ thống giá PickDee Shop.
        </p>
      </div>
    `;

    checkoutBar.style.display =
      "none";

    return;
  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     HELPERS
  ====================================================== */

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function readCart() {

    try {

      const data =
        JSON.parse(
          localStorage.getItem(
            CART_KEY
          )
          ||
          "[]"
        );

      return Array.isArray(data)
        ?
          data
        :
          [];

    }
    catch (_) {

      return [];

    }

  }


  function saveCart(cart) {

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

  }


  /* =====================================================
     TÍNH LẠI GIÁ TỪ BACKEND
  ====================================================== */

    async function refreshCartPrices(
    cart
  ) {

    const pricedCart =
      await Promise.all(

        cart.map(
          async function (item) {

            const quantity =
              Math.max(
                1,
                Math.min(
                  9999,
                  Math.round(
                    Number(
                      item.quantity
                      ||
                      1
                    )
                  )
                )
              );


            const variantId =
              Number(
                item.variant_id
              );


            const productId =
              Number(
                item.product_id
              );


            const [
              quoteResult,
              variantResult
            ] =
              await Promise.all([

                sb.rpc(
                  "shop_price_quote",
                  {
                    p_variant_id:
                      variantId,

                    p_quantity:
                      quantity
                  }
                ),

                sb
                  .from(
                    "shop_product_variants"
                  )
                  .select(
                    "id,product_id,variant_name,option1_name,option1_value,option2_name,option2_value"
                  )
                  .eq(
                    "id",
                    variantId
                  )
                  .maybeSingle()

              ]);


            if (
              quoteResult.error
            ) {

              throw quoteResult.error;

            }


            if (
              variantResult.error
            ) {

              throw variantResult.error;

            }


            const data =
              quoteResult.data;


            const variantData =
              variantResult.data
              ||
              {};


            const baseUnitPrice =
              Number(
                data?.unit_price
                ??
                item.price
                ??
                0
              );


            const baseSubtotal =
              Number(
                data?.subtotal
                ??
                (
                  baseUnitPrice
                  *
                  quantity
                )
              );


            const retailPrice =
              Number(
                data?.retail_price
                ??
                item.retail_price
                ??
                item.price
                ??
                0
              );


            let promoQuote =
              null;


            if (
              productId
              &&
              variantId
            ) {

              const {
                data: promoData,
                error: promoError
              } =
                await sb.rpc(
                  "shop_best_product_promotion_quote",
                  {

                    p_product_id:
                      productId,

                    p_variant_id:
                      variantId,

                    p_unit_price:
                      baseUnitPrice,

                    p_quantity:
                      quantity,

                    p_order_amount:
                      baseSubtotal

                  }
                );


              if (promoError) {
                throw promoError;
              }


              promoQuote =
                Array.isArray(
                  promoData
                )
                ?
                  (
                    promoData[0]
                    ||
                    null
                  )
                :
                  (
                    promoData
                    ||
                    null
                  );

            }


            const hasPromotion =
              promoQuote
              &&
              Number(
                promoQuote.final_unit_price
                ??
                baseUnitPrice
              )
              <
              baseUnitPrice;


            const price =
              hasPromotion
              ?
                Number(
                  promoQuote.final_unit_price
                )
              :
                baseUnitPrice;


            const originalPrice =
              hasPromotion
              ?
                Number(
                  promoQuote.original_unit_price
                  ??
                  baseUnitPrice
                )
              :
                Number(
                  item.original_price
                  ??
                  retailPrice
                  ??
                  baseUnitPrice
                );


            return {

              ...item,

              quantity:
                quantity,

              price:
                price,

              retail_price:
                retailPrice,

              original_price:
                originalPrice,

              promotion_id:
                hasPromotion
                ?
                  promoQuote.promotion_id
                :
                  null,

              promotion_name:
                hasPromotion
                ?
                  (
                    promoQuote.promotion_name
                    ||
                    ""
                  )
                :
                  "",

              promotion_discount:
                hasPromotion
                ?
                  Number(
                    promoQuote.total_discount
                    ??
                    (
                      (
                        originalPrice
                        -
                        price
                      )
                      *
                      quantity
                    )
                  )
                :
                  0,

              pricing_type:
                data?.pricing_type
                ||
                "retail",

              subtotal:
                Number(
                  price
                  *
                  quantity
                ),

              backend_variant_name:
                variantData.variant_name
                ||
                "",

              backend_option1_name:
                variantData.option1_name
                ||
                "",

              backend_option1_value:
                variantData.option1_value
                ||
                "",

              backend_option2_name:
                variantData.option2_name
                ||
                "",

              backend_option2_value:
                variantData.option2_value
                ||
                ""

            };

          }
        )

      );


    return pricedCart;

  }

  /* =====================================================
     TOTAL
  ====================================================== */

  function calculateTotal(cart) {

    return cart.reduce(
      function (sum,item) {

        return (
          sum
          +
          (
            Number(
              item.price || 0
            )
            *
            Number(
              item.quantity || 0
            )
          )
        );

      },
      0
    );

  }

  function normalizeProductText(value) {

    return String(
      value
      ||
      ""
    )
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  }


  function textHasPaddle(value) {

    const text =
      normalizeProductText(
        value
      );


    if (
      !text
    ) {

      return false;

    }


    const accessoryKeywords = [
      "quan can",
      "cuon can",
      "grip",
      "overgrip",
      "dan vien",
      "vien vot",
      "bao ve vien",
      "dan bao ve",
      "edge guard",
      "edge tape",
      "tape",
      "ppf",
      "bong",
      "ball",
      "tui",
      "tat",
      "ao",
      "phu kien",
      "cham soc",
      "ve sinh"
    ];


    if (
      accessoryKeywords.some(
        function (keyword) {

          return text.includes(
            keyword
          );

        }
      )
    ) {

      return false;

    }


    return (
      /^\s*(vợt|vot|paddle)/.test(text) // vợt = tên BẮT ĐẦU bằng "vợt"/"paddle" (không bắt "Chì độ vợt"...)
    );

  }


  function itemRequiresGiftShirtSize(item) {

    return textHasPaddle(
      [
        item.product_name,
        item.variant_name,
        item.backend_variant_name
      ]
        .filter(Boolean)
        .join(" ")
    );

  }


  function itemMissingRequiredSelections(item) {

    const missing =
      [];


    if (
      item.backend_option1_name
      ||
      item.backend_option1_value
    ) {

      if (
        !item.option1_value
      ) {

        missing.push(
          item.backend_option1_name
          ||
          "phân loại 1"
        );

      }

    }


    if (
      item.backend_option2_name
      ||
      item.backend_option2_value
    ) {

      if (
        !item.option2_value
      ) {

        missing.push(
          item.backend_option2_name
          ||
          "phân loại 2"
        );

      }

    }


    if (
      itemRequiresGiftShirtSize(
        item
      )
      &&
      !item.gift_shirt_size
    ) {

      missing.push(
        "size áo tặng"
      );

    }


    return missing;

  }


  function getInvalidCartItems(cart) {

    return cart
      .map(
        function (item,index) {

          return {
            item,
            index,
            missing:
              itemMissingRequiredSelections(
                item
              )
          };

        }
      )
      .filter(
        function (entry) {

          return (
            entry.missing.length
            >
            0
          );

        }
      );

  }
  function cartHasPickleballBall(
    cart
  ) {

    const knownBallKeys =
      [
        "lt48",
        "ppa life time",
        "toniker nexus",
        "toniker mate pro"
      ];


    return cart.some(
      function (item) {

        const name =
          String(
            item.product_name || ""
          )
            .trim()
            .toLocaleLowerCase(
              "vi-VN"
            );


        if (
          name.startsWith(
            "bóng "
          )
        ) {

          return true;

        }


        return knownBallKeys.some(
          function (key) {

            return name.includes(
              key
            );

          }
        );

      }
    );

  }


  function shippingQuote(
    cart
  ) {

    const merchandiseTotal =
      calculateTotal(
        cart
      );


    const hasPickleballBall =
      cartHasPickleballBall(
        cart
      );


    /*
      Bóng Pickleball là hàng cồng kềnh.

      Mức ship cơ bản của PickDee vẫn là 15.000đ,
      nhưng phí thực tế có thể cao hơn theo kích thước kiện.

      Vì vậy giao diện chỉ hiển thị:
      "Từ 15.000đ".
    */
    if (
      hasPickleballBall
    ) {

      return {

        merchandiseTotal,

        hasPickleballBall:
          true,

        freeShipping:
          false,

        shippingPending:
          true,

        shippingFee:
          SPX_BASE_FEE,

        customerTotal:
          merchandiseTotal
          +
          SPX_BASE_FEE,

        reason:
          "Bóng Pickleball là hàng cồng kềnh. Phí giao hàng ước tính từ 15.000đ và có thể cao hơn theo kích thước kiện thực tế. PickDee sẽ xác nhận trước khi gửi hàng."

      };

    }


    const freeShipping =
      merchandiseTotal
        >=
      FREE_SHIPPING_THRESHOLD;


    const shippingFee =
      freeShipping
        ?
          0
        :
          SPX_BASE_FEE;


    const reason =
      freeShipping
        ?
          "Đơn từ 300.000đ và không có bóng Pickleball: PickDee freeship."
        :
          "Đơn dưới 300.000đ: phí giao hàng SPX 15.000đ.";


    return {

      merchandiseTotal,

      hasPickleballBall:
        false,

      freeShipping,

      shippingPending:
        false,

      shippingFee,

      customerTotal:
        merchandiseTotal
        +
        shippingFee,

      reason

    };

  }


  /* =====================================================
     RENDER
  ====================================================== */

  async function render() {

    let cart =
      readCart();


    if (!cart.length) {

      checkoutBar.style.display =
        "none";


      cartContent.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          </div>

          <strong>
            Giỏ hàng đang trống
          </strong>

          <p>
            Chọn một món hàng tuyển
            từ PickDee Shop nhé.
          </p>

          <a href="./shop">
            XEM SẢN PHẨM
          </a>

        </div>
      `;


      return;

    }


    /*
      Trong lúc kiểm tra lại giá,
      chưa cho khách đi Checkout.
    */

    checkoutBar.style.display =
      "none";


    try {

      cart =
        await refreshCartPrices(
          cart
        );


      saveCart(
        cart
      );

    }
    catch (error) {

      console.error(
        "CART PRICE ERROR:",
        error
      );


      cartContent.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <strong>
            Chưa kiểm tra được giá
          </strong>

          <p>
            Vui lòng tải lại trang để PickDee Shop
            cập nhật giá bán mới nhất.
          </p>

          <a href="./shop-cart">
            TẢI LẠI GIỎ HÀNG
          </a>

        </div>
      `;


      checkoutBar.style.display =
        "none";


      return;

    }


       const shipping =
      shippingQuote(
        cart
      );


    const invalidCartItems =
      getInvalidCartItems(
        cart
      );


    const hasInvalidSelections =
      invalidCartItems.length
      >
      0;


    checkoutBlockedMessage =
      hasInvalidSelections
        ?
          "Có sản phẩm trong giỏ hàng chưa chọn đủ phân loại. Anh/chị vui lòng quay lại sản phẩm để chọn đủ trước khi đặt hàng."
        :
          "";


    const total =
      shipping.merchandiseTotal;


    const totalQuantity =
      cart.reduce(
        function (sum,item) {

          return (
            sum
            +
            Number(
              item.quantity || 0
            )
          );

        },
        0
      );


    const itemsHtml =
      cart
        .map(
          function (item,index) {

                        const hasPromotion =
              item.promotion_id
              &&
              Number(
                item.original_price || 0
              )
              >
              Number(
                item.price || 0
              );


            const isWholesale =
              !hasPromotion
              &&
              item.pricing_type
              ===
              "wholesale"
              &&
              Number(
                item.retail_price || 0
              )
                >
              Number(
                item.price || 0
              );


            const priceNote =
              hasPromotion
                ?
                  `
                    <div
                      class="variant-name"
                      style="
                        margin-top:5px;
                        color:#ffc934;
                        line-height:1.45;
                      "
                    >
                      🎁 ${escapeHtml(
                        item.promotion_name
                        ||
                        "Khuyến mãi PickDee"
                      )}
                      • Giá gốc
                      <s>
                        ${money(
                          item.original_price
                        )}
                      </s>
                    </div>
                  `
                :
                  (
                    isWholesale
                      ?
                        `
                          <div class="variant-name">
                            GIÁ SỈ • Niêm yết
                            <s>
                              ${money(
                                item.retail_price
                              )}
                            </s>
                          </div>
                        `
                      :
                        ""
                  );
            const missingSelections =
              itemMissingRequiredSelections(
                item
              );


            const missingSelectionsHtml =
              missingSelections.length
                ?
                  `
                    <div
                      class="variant-name"
                      style="
                        margin-top:7px;
                        padding:8px 9px;
                        border-radius:9px;
                        border:1px solid rgba(255,190,80,.35);
                        background:rgba(255,190,80,.08);
                        color:#ffcf73;
                        line-height:1.45;
                      "
                    >
                      ⚠️ Chưa chọn đủ:
                      ${escapeHtml(
                        missingSelections.join(
                          ", "
                        )
                      )}
                    </div>
                  `
                :
                  "";

            return `

              <div class="cart-item">

                <a
                  class="item-image"
                  href="./shop-product?id=${encodeURIComponent(
                    item.product_id
                  )}"
                >

                  ${
                    item.image_url
                      ?
                        `
                          <img
                            src="${escapeHtml(
                              item.image_url
                            )}"
                            alt="${escapeHtml(
                              item.product_name
                            )}"
                          >
                        `
                      :
                        `
                          <div class="item-placeholder">
                            🏓
                          </div>
                        `
                  }

                </a>


                <div class="item-info">

                  <a
                    class="item-name"
                    href="./shop-product?id=${encodeURIComponent(
                      item.product_id
                    )}"
                    style="
                      display:inline-block;
                      color:#ffffff;
                      text-decoration:none;
                    "
                  >
                    ${escapeHtml(
                      item.product_name
                    )}
                  </a>


                  ${
                    item.variant_name
                      ?
                        `
                          <div class="variant-name">
                            ${escapeHtml(
                              item.variant_name
                            )}
                          </div>
                        `
                      :
                        ""
                  }
                  ${missingSelectionsHtml}

                  <div class="item-price">
                    ${money(
                      item.price
                    )}
                  </div>


                  ${priceNote}


                 <div class="item-bottom">

  <div class="quantity">

    <button
      type="button"
      data-action="minus"
      data-index="${index}"
    >
      −
    </button>

   <input
  class="quantity-input"
  type="number"
  inputmode="numeric"
  min="1"
  max="9999"
  value="${Number(
    item.quantity || 1
  )}"
  data-quantity-index="${index}"
  aria-label="Số lượng ${escapeHtml(
    item.product_name
  )}"
>
    <button
      type="button"
      data-action="plus"
      data-index="${index}"
    >
      +
    </button>

  </div>


  <button
    class="remove-btn"
    type="button"
    data-action="remove"
    data-index="${index}"
  >
    XÓA
  </button>

</div>


<a
  href="./shop-product?id=${encodeURIComponent(
    item.product_id
  )}"
  style="
    width:100%;
    min-height:34px;
    margin-top:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    border:
      1px solid rgba(255,201,52,.22);

    background:
      rgba(255,201,52,.055);

    color:#ffc934;

    text-decoration:none;

    font-size:10px;
    font-weight:950;

    letter-spacing:.025em;

    touch-action:manipulation;
  "
>
↩ QUAY LẠI SẢN PHẨM
</a>

                </div>

              </div>
            `;

          }
        )
        .join("");


    cartContent.innerHTML = `

      <div class="cart-list">
        ${itemsHtml}
      </div>


      <section class="summary">

        <div class="summary-title">
          Tóm tắt đơn hàng
        </div>


        <div class="summary-row">

          <span>
            Sản phẩm
          </span>

          <strong>
            ${totalQuantity}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Tiền hàng
          </span>

          <strong>
            ${money(total)}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            ${
              shipping.shippingPending
                ?
                  "Phí giao hàng ước tính"
                :
                  "Phí giao hàng"
            }
          </span>

          <strong
            style="${
              shipping.shippingPending
                ?
                  "color:#ffc934;"
                :
                  ""
            }"
          >
            ${
              shipping.shippingPending
                ?
                  "Từ " + money(
                    shipping.shippingFee
                  )
                :
                  money(
                    shipping.shippingFee
                  )
            }
          </strong>

        </div>


        ${
          shipping.freeShipping
            ?
              `
                <div class="summary-row">

                  <span>
                    Ưu đãi vận chuyển
                  </span>

                  <strong style="color:#ffc934;">
                    ✓ FREESHIP PICKDEE
                  </strong>

                </div>
              `
            :
              ""
        }


        <div
          style="
            margin-top:2px;
            color:rgba(255,255,255,.40);
            font-size:10px;
            line-height:1.5;
          "
        >
          ${escapeHtml(
            shipping.reason
          )}
        </div>


        <div class="summary-total">

          <div>

            <div class="total-label">
              ${
                shipping.shippingPending
                  ?
                    "TẠM TÍNH TỪ"
                  :
                    "TỔNG THANH TOÁN"
              }
            </div>

            <div class="total-price">
              ${money(
                shipping.customerTotal
              )}
            </div>


            ${
              shipping.shippingPending
                ?
                  `
                    <div
                      style="
                        margin-top:4px;
                        color:rgba(255,255,255,.42);
                        font-size:9px;
                        line-height:1.45;
                      "
                    >
                      Phí thực tế có thể cao hơn do kiện bóng cồng kềnh
                    </div>
                  `
                :
                  ""
            }

          </div>

        </div>

      </section>
    `;


    const checkoutLabel =
      checkoutBar.querySelector(
        ".checkout-label"
      );


    if (
      checkoutLabel
    ) {

      checkoutLabel.textContent =
        hasInvalidSelections
          ?
            "CẦN CHỌN ĐỦ PHÂN LOẠI"
          :
            (
              shipping.shippingPending
                ?
                  "TẠM TÍNH TỪ • SHIP CÓ THỂ CAO HƠN"
                :
                  "TỔNG THANH TOÁN"
            );

    }


    checkoutTotal.textContent =
      hasInvalidSelections
        ?
          "Chưa đủ thông tin"
        :
          money(
            shipping.customerTotal
          );


    if (
      checkoutBtn
    ) {

      if (
        hasInvalidSelections
      ) {

        checkoutBtn.removeAttribute(
          "href"
        );

        checkoutBtn.textContent =
          "CHỌN ĐỦ PHÂN LOẠI";

        checkoutBtn.style.opacity =
          ".65";

        checkoutBtn.style.cursor =
          "not-allowed";

        checkoutBtn.onclick =
          function (event) {

            event.preventDefault();

            alert(
              checkoutBlockedMessage
            );

          };

      }
      else {

        checkoutBtn.setAttribute(
          "href",
          "./shop-checkout"
        );

        checkoutBtn.textContent =
          "ĐẶT HÀNG →";

        checkoutBtn.style.opacity =
          "";

        checkoutBtn.style.cursor =
          "";

        checkoutBtn.onclick =
          null;

      }

    }


    checkoutBar.style.display =
      "block";

bindEvents();

bindQuantityInputs();

  }


  /* =====================================================
     EVENTS
  ====================================================== */

  function bindEvents() {

    document
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            async function () {

              button.disabled =
                true;


              const action =
                button.dataset.action;


              const index =
                Number(
                  button.dataset.index
                );


              const cart =
                readCart();


              const item =
                cart[index];


              if (!item) {

                button.disabled =
                  false;

                return;

              }


              if (
                action === "plus"
              ) {

                item.quantity =
                  Math.min(
                    9999,
                    Number(
                      item.quantity || 1
                    )
                    +
                    1
                  );

              }


              if (
                action === "minus"
              ) {

                item.quantity =
                  Math.max(
                    1,
                    Number(
                      item.quantity || 1
                    )
                    -
                    1
                  );

              }


              if (
                action === "remove"
              ) {

                cart.splice(
                  index,
                  1
                );

              }


              saveCart(
                cart
              );


              await render();

            }
          );

        }
      );

  }

  function commitQuantityInput(input) {

    const index =
      Number(
        input.dataset.quantityIndex
      );

    const cart =
      readCart();

    const item =
      cart[index];

    if (!item) {
      return;
    }

    const quantity =
      Math.max(
        1,
        Math.min(
          9999,
          Math.round(
            Number(
              input.value || 1
            )
          )
        )
      );

    item.quantity =
      quantity;

    input.value =
      String(quantity);

    saveCart(
      cart
    );

    render();

  }


  function bindQuantityInputs() {

    document
      .querySelectorAll(
        ".quantity-input"
      )
      .forEach(
        function (input) {

          if (
            input.dataset.quantityBound === "1"
          ) {
            return;
          }

          input.dataset.quantityBound =
            "1";

          input.addEventListener(
            "change",
            function () {

              commitQuantityInput(
                input
              );

            }
          );

          input.addEventListener(
            "keydown",
            function (event) {

              if (
                event.key === "Enter"
              ) {

                event.preventDefault();

                commitQuantityInput(
                  input
                );

              }

            }
          );

        }
      );

  }
  /* =====================================================
     START
  ====================================================== */

  render();


})();

</script>

<style id="pdSupportLift">
  /* Support bubble sits above the fixed order bar so it never covers "ĐẶT HÀNG" */
  @media(max-width:760px){
    #pickdeeSupportRoot{right:12px!important;bottom:calc(var(--pd-orderbar-h,124px) + 10px)!important}
  }
</style>
<script>
(function(){
  var bar=document.getElementById("checkoutBar");if(!bar)return;
  function fit(){var h=getComputedStyle(bar).display==="none"?0:bar.getBoundingClientRect().height;document.documentElement.style.setProperty("--pd-orderbar-h",(h||0)+"px");}
  fit();addEventListener("resize",fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(bar);
  new MutationObserver(fit).observe(bar,{attributes:true,attributeFilter:["style","class"]});
})();
</script>
