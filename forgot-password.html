<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>
  <title>Quên mật khẩu | PickDee Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(177,255,0,.13), transparent 30%),
        linear-gradient(180deg, #072450 0%, #041b3c 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(8, 42, 87, .95);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,.28);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .brand span {
      color: #d8ff19;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .desc {
      color: #b9c9df;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: #092c5d;
      color: #fff;
      padding: 0 14px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #d8ff19;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: #d8ff19;
      color: #071c3a;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: rgba(52, 211, 153, .13);
      border: 1px solid rgba(52, 211, 153, .38);
      color: #b8ffd9;
    }

    .message.error {
      display: block;
      background: rgba(248, 113, 113, .13);
      border: 1px solid rgba(248, 113, 113, .4);
      color: #ffd0d0;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #d8ff19;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>

<body>

  <main class="card">

    <div class="brand">
      PickDee <span>Academy</span>
    </div>

    <h1>Quên mật khẩu</h1>

    <div class="desc">
      Nhập email tài khoản PickDee của bạn.
      Hệ thống sẽ gửi đường dẫn để tạo mật khẩu mới.
    </div>

    <form id="forgotForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Nhập email của bạn"
        required
      />

      <button id="submitBtn" type="submit">
        GỬI LINK ĐẶT LẠI MẬT KHẨU
      </button>

      <div id="message" class="message"></div>

    </form>

    <a class="back" href="/login">
      ← Quay lại đăng nhập
    </a>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261019-keep30"></script>

  <script>
    const sb =
      window.PICKDEE_SUPABASE ||
      window.supabaseClient;

    const form =
      document.getElementById("forgotForm");

    const emailInput =
      document.getElementById("email");

    const submitBtn =
      document.getElementById("submitBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        if (!email) {

          showMessage(
            "Vui lòng nhập email.",
            "error"
          );

          return;

        }


        submitBtn.disabled = true;

        submitBtn.textContent =
          "ĐANG GỬI...";

        message.className =
          "message";


        try {

          const { error } =
            await sb.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://pickdee.vn/reset-password"
              }
            );


          if (error) {

            throw error;

          }


          showMessage(
            "Nếu email này có tài khoản PickDee, hệ thống sẽ gửi link đặt lại mật khẩu. Vui lòng kiểm tra Inbox hoặc Spam.",
            "success"
          );


        } catch (error) {

          console.error(
            "RESET PASSWORD ERROR:",
            error
          );

          showMessage(
            "Chưa gửi được email. Vui lòng thử lại sau.",
            "error"
          );

        } finally {

          submitBtn.disabled = false;

          submitBtn.textContent =
            "GỬI LINK ĐẶT LẠI MẬT KHẨU";

        }

      }
    );
  </script>
<script src="/support-widget.js?v=20261020-chime1"></script>
</body>
</html>
