<head>

  <title>Đổi mật khẩu | PickDee Academy</title>

  <style>

    body {

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(255,193,24,.12), transparent 30%),
        linear-gradient(145deg, #131313, #202020 50%, #101010);
    }

    .box {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 18px;
      background: rgba(32,32,32,.8);
      border: 1px solid rgba(255,255,255,.13);
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 28px;
    }

    .brand span {
      color: #ffc934;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .sub {
      margin-bottom: 22px;
      color: rgba(255,255,255,.65);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 50px;
      margin-bottom: 15px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ffc934;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #ffc934;
      color: #0c0c0c;
      font-weight: 900;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .success {
      color: #ffc934;
    }

    .error {
      color: #ff9f9f;
    }

    .back {
      display: block;
      margin-top: 20px;

  </style>

<body>

  <div class="box">

    <div class="brand">
      PickDee <span>Academy</span>
    </div>

    <div id="pdFaceIdSettings"></div>

    <h1>Đổi mật khẩu</h1>

    <div class="sub">
      Tạo mật khẩu mới cho tài khoản đang đăng nhập.
    </div>

    <form id="changePasswordForm">

      <label for="newPassword">
        MẬT KHẨU MỚI
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Tối thiểu 8 ký tự"
        required
      >

      <label for="confirmPassword">
        NHẬP LẠI MẬT KHẨU
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Nhập lại mật khẩu mới"
        required
      >

      <button
        id="changeBtn"
        type="submit"
      >
        Cập nhật mật khẩu
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="javascript:history.back()"
    >
      ← Quay lại
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261019-keep30"></script>

  <script>
    (async function () {

      const sb =
        window.PICKDEE_SUPABASE ||
        window.supabaseClient;

      const form =
        document.getElementById("changePasswordForm");

      const changeBtn =
        document.getElementById("changeBtn");

      const message =
        document.getElementById("message");

      const newPassword =
        document.getElementById("newPassword");

      const confirmPassword =
        document.getElementById("confirmPassword");


      function showMessage(text, type) {

        message.className =
          type || "";

        message.textContent =
          text || "";

      }


      if (!sb || !sb.auth) {

        showMessage(
          "Không khởi tạo được hệ thống đăng nhập.",
          "error"
        );

        form.style.display =
          "none";

        return;

      }


      const {
        data,
        error
      } =
        await sb.auth.getSession();


      if (
        error ||
        !data ||
        !data.session
      ) {

        window.location.replace(
          "/login"
        );

        return;

      }


      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();


          const password =
            newPassword.value;

          const confirm =
            confirmPassword.value;


          if (password.length < 8) {

            showMessage(
              "Mật khẩu cần ít nhất 8 ký tự.",
              "error"
            );

            return;

          }


          if (password !== confirm) {

            showMessage(
              "Hai mật khẩu chưa giống nhau.",
              "error"
            );

            return;

          }


          changeBtn.disabled = true;

          changeBtn.textContent =
            "Đang cập nhật...";


          try {

            const {
              error
            } =
              await sb.auth.updateUser({
                password: password
              });


            if (error) {

              throw error;

            }


            form.style.display =
              "none";


            showMessage(
              "✓ Đổi mật khẩu thành công. Vui lòng đăng nhập lại.",
              "success"
            );


            await sb.auth.signOut();


            setTimeout(
              function () {

                window.location.replace(
                  "/login"
                );

              },
              1500
            );

          }
          catch (error) {

            console.error(
              "CHANGE PASSWORD:",
              error
            );


            showMessage(
              error &&
              error.message
                ? error.message
                : "Không đổi được mật khẩu.",
              "error"
            );

          }
          finally {

            changeBtn.disabled = false;

            changeBtn.textContent =
              "Cập nhật mật khẩu";

          }

        }
      );

    })();
  </script>
<script src="/support-widget.js?v=20261024-coach1"></script>
