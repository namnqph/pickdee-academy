<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071523">

  <title>Sản phẩm | PickDee Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;

      background: #071523;
      color: #fff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;

      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
    }

    a,
    button,
    input {
      touch-action: manipulation;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 60;

      background:
        rgba(7,21,35,.97);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      backdrop-filter:
        blur(16px);
    }

    .header-inner {
      width:
        min(900px,calc(100% - 18px));

      min-height: 60px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .brand {
      color: #fff;

      text-decoration: none;

      font-size: 20px;
      font-weight: 950;

      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      min-height: 36px;

      padding:
        0 10px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.72);

      text-decoration: none;

      font-size: 9px;
      font-weight: 950;

      white-space: nowrap;
    }


    /* =====================================================
       MAIN
    ====================================================== */

    main {
      width:
        min(900px,calc(100% - 18px));

      margin:
        15px auto 50px;
    }

    .eyebrow {
      margin-bottom: 5px;

      color: #d8ff45;

      font-size: 10px;
      font-weight: 950;

      letter-spacing: .1em;
    }

    h1 {
      margin:
        0 0 5px;

      font-size:
        clamp(29px,7vw,40px);

      line-height: 1;

      letter-spacing: -.045em;
    }

    .intro {
      margin:
        0 0 14px;

      color:
        rgba(255,255,255,.48);

      font-size: 11px;

      line-height: 1.45;
    }


    /* =====================================================
       ACTIONS
    ====================================================== */

    .actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-bottom: 12px;
    }

    .action-btn {
      min-height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      text-decoration: none;

      font-size: 10px;
      font-weight: 950;

      text-align: center;
    }

    .action-btn.primary {
      background: #d8ff45;
      color: #071523;
    }

    .action-btn.secondary {
      border:
        1px solid rgba(216,255,69,.26);

      background:
        rgba(216,255,69,.06);

      color: #d8ff45;
    }


    /* =====================================================
       STATS
    ====================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 7px;

      margin-bottom: 11px;
    }

    .stat {
      padding: 11px;

      border-radius: 12px;

      background: #0d1d2f;

      border:
        1px solid rgba(255,255,255,.08);
    }

    .stat-label {
      color:
        rgba(255,255,255,.42);

      font-size: 8px;
      font-weight: 900;

      line-height: 1.3;
    }

    .stat-value {
      margin-top: 5px;

      color: #d8ff45;

      font-size: 20px;
      font-weight: 950;
    }


    /* =====================================================
       SEARCH
    ====================================================== */

    .search-box {
      margin-bottom: 11px;
    }

    .search-box input {
      width: 100%;

      min-height: 44px;

      padding:
        0 12px;

      border-radius: 11px;

      border:
        1px solid rgba(255,255,255,.12);

      outline: none;

      background: #10243a;

      color: #fff;

      font-family: inherit;

      font-size: 16px;
    }

    .search-box input:focus {
      border-color:
        rgba(216,255,69,.55);
    }
/* =====================================================
   PRODUCT FILTERS
====================================================== */

.product-filters {
  display: grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap: 6px;

  margin:
    0 0 11px;
}


.product-filter-btn {
  min-height: 38px;

  padding:
    0 6px;

  border-radius: 10px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    rgba(255,255,255,.035);

  color:
    rgba(255,255,255,.62);

  font-family: inherit;

  font-size: 8px;
  font-weight: 950;

  cursor: pointer;
}


.product-filter-btn.active {
  border-color:
    #d8ff45;

  background:
    rgba(216,255,69,.10);

  color:
    #d8ff45;
}

    /* =====================================================
       PRODUCT LIST
    ====================================================== */

    .product-list {
      display: grid;
      gap: 9px;
    }

    .product-card {
      padding: 11px;

      border-radius: 15px;

      border:
        1px solid rgba(255,255,255,.08);

      background: #0d1d2f;
    }

    .product-head {
      display: grid;

      grid-template-columns:
        66px minmax(0,1fr);

      gap: 10px;

      align-items: center;
    }

    .product-image {
      width: 66px;
      height: 66px;

      border-radius: 11px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.07);
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .no-image {
      color:
        rgba(255,255,255,.25);

      font-size: 8px;
      font-weight: 900;

      text-align: center;
    }

    .product-name {
      font-size: 14px;
      font-weight: 950;

      line-height: 1.25;
    }

    .product-meta {
      margin-top: 4px;

      display: flex;
      flex-wrap: wrap;

      gap: 5px;
    }

    .tag {
      min-height: 20px;

      padding:
        0 7px;

      display: inline-flex;
      align-items: center;

      border-radius: 999px;

      background:
        rgba(255,255,255,.055);

      color:
        rgba(255,255,255,.55);

      font-size: 7px;
      font-weight: 950;
    }

    .tag.active {
      background:
        rgba(216,255,69,.08);

      color: #d8ff45;
    }

    .tag.draft {
      background:
        rgba(255,193,90,.09);

      color: #ffd071;
    }

    .variant-list {
      margin-top: 10px;

      display: grid;
      gap: 7px;
    }

    .variant {
      padding: 9px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.06);
    }

    .variant-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 8px;
    }

    .variant-name {
      font-size: 11px;
      font-weight: 950;
    }

    .sku {
      margin-top: 3px;

      color:
        rgba(255,255,255,.38);

      font-size: 8px;
      font-weight: 850;
    }

    .price {
      color: #d8ff45;

      font-size: 13px;
      font-weight: 950;

      white-space: nowrap;
    }

    .stock-grid {
      margin-top: 8px;

      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 5px;
    }

    .stock-item {
      padding: 7px;

      border-radius: 8px;

      background:
        rgba(255,255,255,.035);
    }

    .stock-label {
      color:
        rgba(255,255,255,.38);

      font-size: 7px;
      font-weight: 900;

      line-height: 1.25;
    }

    .stock-value {
      margin-top: 3px;

      font-size: 14px;
      font-weight: 950;
    }

    .stock-value.available {
      color: #d8ff45;
    }

    .stock-value.low {
      color: #ffd071;
    }

    .stock-value.out {
      color: #ff9a9a;
    }

    .cost {
      margin-top: 6px;

      color:
        rgba(255,255,255,.38);

      font-size: 8px;
    }


    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        45px 18px;

      text-align: center;

      border-radius: 14px;

      border:
        1px dashed rgba(255,255,255,.13);

      color:
        rgba(255,255,255,.5);

      font-size: 11px;

      line-height: 1.5;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:390px) {

     

      .stats {
        gap: 5px;
      }

      .stat {
        padding: 9px;
      }

      .stat-value {
        font-size: 18px;
      }

    }

  </style>

</head>



<body>


<header class="header">

  <div class="header-inner">

    <a
      class="brand"
      href="./shop-admin-products"
    >
      PickDee<span>Shop</span>
    </a>

    <a
      class="back"
      href="./shop-admin"
    >
      ← ĐƠN HÀNG
    </a>

  </div>

</header>



<main>

  <div class="eyebrow">
    SHOP ADMIN
  </div>

  <h1>
    Sản phẩm & tồn kho
  </h1>

  <p class="intro">
    Theo dõi sản phẩm, giá bán và số lượng có thể bán.
    Tồn kho chỉ thay đổi qua nhập hàng và đơn hàng.
  </p>


 <div class="actions">

  <a
    class="action-btn primary"
    href="./shop-admin-product-new"
  >
    + THÊM SẢN PHẨM
  </a>

  <a
    class="action-btn secondary"
    href="./shop-admin-stock-receipt"
  >
    + NHẬP HÀNG
  </a>

  <a
    class="action-btn secondary"
    href="./shop-admin-stock-count"
  >
    KIỂM KHO
  </a>

  <a
    class="action-btn secondary"
    href="./shop-admin-stock-receipts"
  >
    LỊCH SỬ NHẬP
  </a>

  <a
    class="action-btn secondary"
    href="./shop-admin-suppliers"
  >
    NHÀ CUNG CẤP
  </a>

  <a
  class="action-btn secondary"
  href="./shop-admin-stock-history"
>
  LỊCH SỬ KHO
</a>
</div>

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        SẢN PHẨM
      </div>

      <div
        id="statProducts"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        SKU ĐANG BÁN
      </div>

      <div
        id="statVariants"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        SẮP HẾT
      </div>

      <div
        id="statLow"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="Tìm tên sản phẩm / SKU..."
      autocomplete="off"
    >

  </div>
<div
  id="productFilters"
  class="product-filters"
>

  <button
    type="button"
    class="product-filter-btn active"
    data-filter="all"
  >
    TẤT CẢ
  </button>

  <button
    type="button"
    class="product-filter-btn"
    data-filter="active"
  >
    ĐANG BÁN
  </button>

  <button
    type="button"
    class="product-filter-btn"
    data-filter="draft"
  >
    NHÁP
  </button>

  <button
    type="button"
    class="product-filter-btn"
    data-filter="out"
  >
    HẾT HÀNG
  </button>

</div>

  <div
    id="productList"
    class="product-list"
  >

    <div class="state">
      Đang tải sản phẩm...
    </div>

  </div>

</main>



<script>

(function () {


  const cfg =
    window.PICKDEE_CONFIG || {};


  const productList =
    document.getElementById(
      "productList"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  let products = [];

  let variants = [];

  let inventory = [];

  let images = [];
let selectedProductFilter =
  "all";


  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showState(
      "Không tải được hệ thống Shop."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );



  /* =====================================================
     HELPERS
  ====================================================== */

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function normalize(value) {

    return String(
      value || ""
    )
      .toLowerCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      );

  }


  function showState(text) {

    productList.innerHTML = `
      <div class="state">
        ${escapeHtml(text)}
      </div>
    `;

  }


  function publicImageUrl(
    storagePath
  ) {

    if (!storagePath) {
      return "";
    }


    const {
      data
    } =
      sb.storage
        .from(
          "shop-products"
        )
        .getPublicUrl(
          storagePath
        );


    return (
      data?.publicUrl
      ||
      ""
    );

  }



  /* =====================================================
     AUTH + ROLE
  ====================================================== */

  async function requireShopAccess() {

    const {
      data: sessionData
    } =
      await sb.auth.getSession();


    const user =
      sessionData?.session?.user;


    if (!user) {

      location.href =
        "./";

      return false;

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_user_roles"
        )
        .select(
          "role,is_active"
        )
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        );


    if (error) {

      throw new Error(
        "Không kiểm tra được quyền Shop."
      );

    }


    const allowed =
      (data || [])
        .some(
          item =>
            [
              "owner",
              "shop_admin",
              "shop_staff"
            ].includes(
              item.role
            )
        );


    if (!allowed) {

      throw new Error(
        "Tài khoản chưa có quyền quản lý Shop."
      );

    }


    return true;

  }



  /* =====================================================
     DATA HELPERS
  ====================================================== */

  function inventoryOf(
    variantId
  ) {

    return (
      inventory.find(
        item =>
          String(
            item.variant_id
          )
          ===
          String(
            variantId
          )
      )
      ||
      {
        stock_on_hand:
          0,

        reserved_qty:
          0,

        reorder_level:
          0,

        average_cost:
          0
      }
    );

  }


  function primaryImageOf(
    productId
  ) {

    const productImages =
      images
        .filter(
          item =>
            String(
              item.product_id
            )
            ===
            String(
              productId
            )
        )
        .sort(
          function (a,b) {

            if (
              Boolean(
                a.is_primary
              )
              !==
              Boolean(
                b.is_primary
              )
            ) {

              return (
                a.is_primary
                  ?
                    -1
                  :
                    1
              );

            }


            return (
              Number(
                a.sort_order || 0
              )
              -
              Number(
                b.sort_order || 0
              )
            );

          }
        );


    return (
      productImages[0]
      ||
      null
    );

  }


  function variantsOf(
    productId
  ) {

    return variants
      .filter(
        item =>
          String(
            item.product_id
          )
          ===
          String(
            productId
          )
      )
      .sort(
        (a,b) =>
          Number(
            a.sort_order || 0
          )
          -
          Number(
            b.sort_order || 0
          )
      );

  }



  /* =====================================================
     STATS
  ====================================================== */

  function updateStats() {

  const activeProductIds =
    new Set(
      products
        .filter(
          function (product) {

            return (
              product.status
              ===
              "active"
            );

          }
        )
        .map(
          function (product) {

            return String(
              product.id
            );

          }
        )
    );


  const activeVariants =
    variants.filter(
      function (variant) {

        return (
          variant.is_active
          ===
          true
          &&
          activeProductIds.has(
            String(
              variant.product_id
            )
          )
        );

      }
    );


  const lowCount =
    activeVariants
      .filter(
        function (variant) {

          const inv =
            inventoryOf(
              variant.id
            );


          const available =
            Number(
              inv.stock_on_hand || 0
            )
            -
            Number(
              inv.reserved_qty || 0
            );


          return (
            available
            <=
            Number(
              inv.reorder_level || 0
            )
          );

        }
      )
      .length;


  document
    .getElementById(
      "statProducts"
    )
    .textContent =
      String(
        products.length
      );


  document
    .getElementById(
      "statVariants"
    )
    .textContent =
      String(
        activeVariants.length
      );


  document
    .getElementById(
      "statLow"
    )
    .textContent =
      String(
        lowCount
      );

}

function availableOfProduct(
  productId
) {

  return variantsOf(
    productId
  )
    .reduce(
      function (total,variant) {

        const inv =
          inventoryOf(
            variant.id
          );


        return (
          total
          +
          Number(
            inv.stock_on_hand || 0
          )
          -
          Number(
            inv.reserved_qty || 0
          )
        );

      },
      0
    );

}
  /* =====================================================
     RENDER
  ====================================================== */

  function renderProducts() {

    const keyword =
      normalize(
        searchInput.value
      );


    const filtered =
      products.filter(
        function (product) {

          const productVariants =
            variantsOf(
              product.id
            );


          const text =
            normalize(
              [
                product.name,
                product.product_code,
                product.brand,
                ...productVariants.map(
                  item =>
                    `${item.sku} ${item.variant_name || ""}`
                )
              ].join(" ")
            );


         const productAvailable =
  availableOfProduct(
    product.id
  );


const matchesFilter =
  selectedProductFilter
  ===
  "all"

  ||

  (
    selectedProductFilter
    ===
    "active"
    &&
    product.status
    ===
    "active"
  )

  ||

  (
    selectedProductFilter
    ===
    "draft"
    &&
    product.status
    ===
    "draft"
  )

  ||

  (
    selectedProductFilter
    ===
    "out"
    &&
    product.status
    ===
    "active"
    &&
    productAvailable
    <=
    0
  );


const matchesSearch =
  (
    !keyword
    ||
    text.includes(
      keyword
    )
  );


return (
  matchesFilter
  &&
  matchesSearch
);

        }
      );


    if (!filtered.length) {

      showState(
        "Không tìm thấy sản phẩm."
      );

      return;

    }


    productList.innerHTML =
      filtered
        .map(
          function (product) {

            const productVariants =
              variantsOf(
                product.id
              );


            const image =
              primaryImageOf(
                product.id
              );


            const imageUrl =
              image
                ?
                  publicImageUrl(
                    image.storage_path
                  )
                :
                  "";


            const statusClass =
              product.status
              ===
              "active"
                ?
                  "active"
                :
                  "draft";


const statusText =
  product.status
  ===
  "active"
    ?
      "ĐANG BÁN"
    :
      String(
        product.status
        ||
        "DRAFT"
      )
        .toUpperCase();


const totals =
  productVariants.reduce(
    function (result,variant) {

      const inv =
        inventoryOf(
          variant.id
        );


      const stock =
        Number(
          inv.stock_on_hand || 0
        );


      const reserved =
        Number(
          inv.reserved_qty || 0
        );


      result.stock +=
        stock;


      result.reserved +=
        reserved;


      result.available +=
        stock
        -
        reserved;


      return result;

    },
    {
      stock: 0,
      reserved: 0,
      available: 0
    }
  );


const variantHtml =
  productVariants.length
    ?
      productVariants
        .map(
          function (variant) {

            const inv =
              inventoryOf(
                variant.id
              );


            const stock =
              Number(
                inv.stock_on_hand || 0
              );


            const reserved =
              Number(
                inv.reserved_qty || 0
              );


            const available =
              stock
              -
              reserved;


            const reorder =
              Number(
                inv.reorder_level || 0
              );


            let stockClass =
              "available";


            if (
              available <= 0
            ) {

              stockClass =
                "out";

            }
            else if (
              available <= reorder
            ) {

              stockClass =
                "low";

            }


            return `

              <div class="variant">

                <div class="variant-top">

                  <div>

                    <div class="variant-name">
                      ${escapeHtml(
                        variant.variant_name
                        ||
                        "Mặc định"
                      )}
                    </div>

                    <div class="sku">
                      SKU:
                      ${escapeHtml(
                        variant.sku
                        ||
                        "-"
                      )}
                    </div>

                  </div>


                  <div class="price">
                    ${money(
                      variant.price
                    )}
                  </div>

                </div>


                <div class="stock-grid">

                  <div class="stock-item">

                    <div class="stock-label">
                      TỒN THỰC
                    </div>

                    <div class="stock-value">
                      ${stock}
                    </div>

                  </div>


                  <div class="stock-item">

                    <div class="stock-label">
                      ĐANG GIỮ
                    </div>

                    <div class="stock-value">
                      ${reserved}
                    </div>

                  </div>


                  <div class="stock-item">

                    <div class="stock-label">
                      CÓ THỂ BÁN
                    </div>

                    <div class="stock-value ${stockClass}">
                      ${available}
                    </div>

                  </div>

                </div>


                <div class="cost">
                  Giá vốn bình quân:
                  ${money(
                    inv.average_cost
                  )}
                  •
                  Mức cảnh báo:
                  ${Number(
                    inv.reorder_level || 0
                  )}
                </div>

              </div>
            `;

          }
        )
        .join("")
    :
      `
        <div class="state">
          Sản phẩm chưa có biến thể.
        </div>
      `;


return `

  <div class="product-card">


    <div class="product-head">


      <div class="product-image">

        ${
          imageUrl
            ?
              `
                <img
                  src="${escapeHtml(
                    imageUrl
                  )}"
                  alt="${escapeHtml(
                    image?.alt_text
                    ||
                    product.name
                  )}"
                  loading="lazy"
                >
              `
            :
              `
                <div class="no-image">
                  CHƯA CÓ ẢNH
                </div>
              `
        }

      </div>


      <div>

        <div class="product-name">
          ${escapeHtml(
            product.name
          )}
        </div>


        <div class="product-meta">

          <span class="tag ${statusClass}">
            ${escapeHtml(
              statusText
            )}
          </span>


          ${
            product.product_code
              ?
                `
                  <span class="tag">
                    ${escapeHtml(
                      product.product_code
                    )}
                  </span>
                `
              :
                ""
          }


          ${
            product.brand
              ?
                `
                  <span class="tag">
                    ${escapeHtml(
                      product.brand
                    )}
                  </span>
                `
              :
                ""
          }


          <span class="tag">
            ${productVariants.length} SKU
          </span>

        </div>

      </div>


    </div>


    <div class="stock-grid">

      <div class="stock-item">

        <div class="stock-label">
          TỔNG TỒN
        </div>

        <div class="stock-value">
          ${totals.stock}
        </div>

      </div>


      <div class="stock-item">

        <div class="stock-label">
          ĐANG GIỮ
        </div>

        <div class="stock-value">
          ${totals.reserved}
        </div>

      </div>


      <div class="stock-item">

        <div class="stock-label">
          CÓ THỂ BÁN
        </div>

        <div class="stock-value ${
          totals.available > 0
            ?
              "available"
            :
              "out"
        }">
          ${totals.available}
        </div>

      </div>

    </div>


    <div
      style="
        display:grid;
        grid-template-columns:1fr;
        gap:7px;
        margin-top:9px;
      "
    >

      <a
        href="./shop-admin-product-edit?id=${encodeURIComponent(
          product.id
        )}"
        style="
          min-height:38px;
          display:flex;
          align-items:center;
          justify-content:center;
          border-radius:9px;
          border:1px solid rgba(216,255,69,.24);
          background:rgba(216,255,69,.06);
          color:#d8ff45;
          text-decoration:none;
          font-size:9px;
          font-weight:950;
        "
      >
        SỬA
      </a>


      <details>

        <summary
          style="
            min-height:38px;
            padding:0 10px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:9px;
            border:1px solid rgba(255,255,255,.10);
            background:rgba(255,255,255,.04);
            color:#fff;
            cursor:pointer;
            list-style:none;
            font-size:9px;
            font-weight:950;
          "
        >
          XEM ${productVariants.length} SKU
        </summary>


        <div
          class="variant-list"
          style="
            margin-top:8px;
            grid-column:1 / -1;
          "
        >
          ${variantHtml}
        </div>

      </details>

    </div>


  </div>

`;

          }
        )
        .join("");

  }



  /* =====================================================
     SEARCH
  ====================================================== */

  searchInput.addEventListener(
    "input",
    renderProducts
  );

document
  .querySelectorAll(
    ".product-filter-btn"
  )
  .forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          selectedProductFilter =
            button.dataset.filter
            ||
            "all";


          document
            .querySelectorAll(
              ".product-filter-btn"
            )
            .forEach(
              function (item) {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          renderProducts();

        }
      );

    }
  );
  /* =====================================================
     LOAD
  ====================================================== */

  async function loadData() {

    await requireShopAccess();


    const [
      productResult,
      variantResult,
      inventoryResult,
      imageResult
    ] =
      await Promise.all([


        sb
          .from(
            "shop_products"
          )
          .select(
            "id,product_code,name,brand,status,is_featured,created_at"
          )
          .order(
            "created_at",
            {
              ascending:
                false
            }
          ),


        sb
          .from(
            "shop_product_variants"
          )
          .select(
            "id,product_id,sku,variant_name,price,is_active,sort_order"
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          ),


        sb
          .from(
            "shop_inventory"
          )
          .select(
            "variant_id,stock_on_hand,reserved_qty,reorder_level,average_cost"
          ),


        sb
          .from(
            "shop_product_images"
          )
          .select(
            "id,product_id,variant_id,storage_path,alt_text,sort_order,is_primary"
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          )


      ]);


    if (productResult.error) {
      throw productResult.error;
    }


    if (variantResult.error) {
      throw variantResult.error;
    }


    if (inventoryResult.error) {
      throw inventoryResult.error;
    }


    if (imageResult.error) {
      throw imageResult.error;
    }


    products =
      productResult.data || [];


    variants =
      variantResult.data || [];


    inventory =
      inventoryResult.data || [];


    images =
      imageResult.data || [];


    updateStats();

    renderProducts();

  }



  async function start() {

    try {

      await loadData();

    }
    catch (error) {

      console.error(
        "SHOP PRODUCTS ERROR:",
        error
      );


      showState(
        error?.message
        ||
        "Không tải được dữ liệu sản phẩm."
      );

    }

  }


  start();


})();

</script>


</body>

</html>
