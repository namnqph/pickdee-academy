<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <meta name="theme-color" content="#071523">

  <title>Tạo đơn nhanh | PickDee Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;

      background: #071523;
      color: #fff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;

      padding-bottom:
        calc(95px + env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea,
    select,
    label,
    a {
      touch-action: manipulation;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(7,21,35,.97);

      backdrop-filter: blur(15px);
    }

    .header-inner {
      width:
        min(760px,calc(100% - 18px));

      min-height: 60px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .brand {
      color: #fff;

      text-decoration: none;

      font-size: 20px;
      font-weight: 950;

      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      min-height: 36px;

      padding: 0 10px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.72);

      text-decoration: none;

      font-size: 10px;
      font-weight: 900;
    }


    /* =====================================================
       PAGE
    ====================================================== */

    main {
      width:
        min(760px,calc(100% - 18px));

      margin:
        15px auto 35px;
    }

    .eyebrow {
      margin-bottom: 5px;

      color: #d8ff45;

      font-size: 10px;
      font-weight: 950;

      letter-spacing: .1em;
    }

    h1 {
      margin:
        0 0 5px;

      font-size:
        clamp(29px,7vw,40px);

      line-height: 1;

      letter-spacing: -.045em;
    }

    .intro {
      margin:
        0 0 14px;

      color:
        rgba(255,255,255,.5);

      font-size: 11px;

      line-height: 1.45;
    }


    /* =====================================================
       SECTION
    ====================================================== */

    .section {
      margin-bottom: 10px;

      padding: 14px;

      border-radius: 15px;

      border:
        1px solid rgba(255,255,255,.09);

      background: #0d1d2f;
    }

    .section-title {
      margin-bottom: 11px;

      font-size: 14px;
      font-weight: 950;
    }


    /* =====================================================
       SOURCE
    ====================================================== */

    .source-grid {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 7px;
    }

    .source-btn {
      min-height: 42px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.11);

      background:
        rgba(255,255,255,.04);

      color:
        rgba(255,255,255,.72);

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;
    }

    .source-btn.active {
      border-color: #d8ff45;

      background:
        rgba(216,255,69,.09);

      color: #d8ff45;
    }


    /* =====================================================
       FORM
    ====================================================== */

    .form-grid {
      display: grid;
      gap: 9px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color:
        rgba(255,255,255,.48);

      font-size: 9px;
      font-weight: 950;

      letter-spacing: .05em;
    }

    input,
    textarea,
    select {
      width: 100%;

      min-height: 44px;

      padding:
        0 11px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.12);

      outline: none;

      background: #10243a;

      color: #fff;

      font-family: inherit;

      /*
        16px để iPhone không tự zoom khi focus.
      */
      font-size: 16px;
    }

    textarea {
      min-height: 68px;

      padding:
        10px 11px;

      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color:
        rgba(216,255,69,.65);
    }

    .phone-row {
      display: grid;

      grid-template-columns:
        minmax(0,1fr) auto;

      gap: 7px;
    }

    .find-btn {
      min-width: 92px;

      border: 0;

      border-radius: 10px;

      background:
        rgba(216,255,69,.10);

      color: #d8ff45;

      font-size: 10px;
      font-weight: 950;

      cursor: pointer;
    }

    .paste-box {
      margin-bottom: 12px;
      padding: 10px;

      border-radius: 11px;
      border: 1px dashed rgba(216,255,69,.35);
      background: rgba(216,255,69,.04);
    }

    .paste-box textarea {
      min-height: 76px;
    }

    .paste-btn {
      width: 100%;
      min-height: 42px;
      margin-top: 7px;

      border: 0;
      border-radius: 10px;

      background: #d8ff45;
      color: #071523;

      font-size: 11px;
      font-weight: 950;
    }

    .paste-result {
      display: none;
      margin-top: 8px;

      color: rgba(255,255,255,.78);

      font-size: 11px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .paste-result.warn {
      color: #ffd27a;
    }

    .customer-found {
      display: none;

      margin-top: 7px;

      padding:
        8px 10px;

      border-radius: 9px;

      background:
        rgba(216,255,69,.07);

      color: #d8ff45;

      font-size: 10px;
      font-weight: 850;
    }


    /* =====================================================
       PRODUCTS
    ====================================================== */

    .item-list {
      display: grid;
      gap: 8px;
    }

    .item-row {
      padding: 10px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.08);
    }

    .item-top {
      display: grid;

      grid-template-columns:
        minmax(0,1fr) 80px;

      gap: 7px;
    }

    .qty {
      text-align: center;
    }

    .item-opts {
      margin-top: 7px;

      display: grid;
      grid-template-columns: minmax(0,1fr) 96px;
      gap: 7px;
    }

    .item-opts.single {
      grid-template-columns: minmax(0,1fr);
    }

    .opt-label {
      margin-bottom: 3px;

      color: rgba(255,255,255,.45);

      font-size: 9px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-bottom {
      margin-top: 7px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .item-price {
      color: #d8ff45;

      font-size: 11px;
      font-weight: 950;
    }

    .remove-item {
      border: 0;

      background: transparent;

      color:
        rgba(255,255,255,.38);

      font-size: 9px;
      font-weight: 900;

      cursor: pointer;
    }

    .add-item {
      width: 100%;

      min-height: 40px;

      margin-top: 8px;

      border-radius: 10px;

      border:
        1px dashed rgba(216,255,69,.28);

      background:
        rgba(216,255,69,.04);

      color: #d8ff45;

      font-size: 10px;
      font-weight: 950;

      cursor: pointer;
    }


    /* =====================================================
       TOTAL
    ====================================================== */

    .total-row {
      margin-top: 12px;

      padding-top: 11px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      border-top:
        1px solid rgba(255,255,255,.08);
    }

    .total-label {
      color:
        rgba(255,255,255,.46);

      font-size: 9px;
      font-weight: 900;
    }

    .total-value {
      color: #d8ff45;

      font-size: 23px;
      font-weight: 950;
    }


    /* =====================================================
       MESSAGE
    ====================================================== */

    .message {
      display: none;

      margin-top: 10px;

      padding: 10px 11px;

      border-radius: 10px;

      font-size: 11px;
      font-weight: 850;

      line-height: 1.45;
    }

    .message.error {
      display: block;

      background:
        rgba(255,90,90,.08);

      border:
        1px solid rgba(255,90,90,.24);

      color: #ffb0b0;
    }

    .message.success {
      display: block;

      background:
        rgba(216,255,69,.07);

      border:
        1px solid rgba(216,255,69,.24);

      color: #d8ff45;
    }


    /* =====================================================
       BOTTOM BAR
    ====================================================== */

    .bottom-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding:
        7px 9px
        calc(7px + env(safe-area-inset-bottom));

      border-top:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(7,21,35,.98);

      backdrop-filter:
        blur(16px);
    }

    .bottom-inner {
      width:
        min(760px,100%);

      margin: auto;

      display: grid;

      grid-template-columns:
        .72fr 1.28fr;

      gap: 8px;

      align-items: center;
    }

    .bottom-label {
      color:
        rgba(255,255,255,.42);

      font-size: 8px;
      font-weight: 900;
    }

    .bottom-total {
      margin-top: 2px;

      color: #d8ff45;

      font-size: 17px;
      font-weight: 950;
    }

    .create-btn {
      min-height: 48px;

      border: 0;

      border-radius: 11px;

      background: #d8ff45;

      color: #071523;

      font-size: 12px;
      font-weight: 950;

      cursor: pointer;
    }

    .create-btn:disabled {
      opacity: .55;
      cursor: wait;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:390px) {

      .source-grid {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

    }

  </style>

</head>



<body>


<header class="header">

  <div class="header-inner">

    <a
      href="./shop-admin"
      class="brand"
    >
      PickDee<span>Shop</span>
    </a>

    <a
      href="./shop-admin"
      class="back"
    >
      ← ĐƠN HÀNG
    </a>

  </div>

</header>



<main>

  <div class="eyebrow">
    SHOP ADMIN
  </div>

  <h1>
    Tạo đơn nhanh
  </h1>

  <p class="intro">
    Dùng cho đơn chốt qua Zalo, TikTok, Facebook,
    điện thoại hoặc khách mua trực tiếp.
  </p>



  <!-- ===================================================
       NGUỒN ĐƠN
  ==================================================== -->

  <section class="section">

    <div class="section-title">
      Đơn này đến từ đâu?
    </div>

    <div
      id="sourceGrid"
      class="source-grid"
    >

      <button
        type="button"
        class="source-btn active"
        data-source="zalo"
      >
        ZALO
      </button>

      <button
        type="button"
        class="source-btn"
        data-source="tiktok"
      >
        TIKTOK
      </button>

      <button
        type="button"
        class="source-btn"
        data-source="facebook"
      >
        FACEBOOK
      </button>

      <button
        type="button"
        class="source-btn"
        data-source="phone"
      >
        ĐIỆN THOẠI
      </button>

      <button
        type="button"
        class="source-btn"
        data-source="walk_in"
      >
        KHÁCH TRỰC TIẾP
      </button>

      <button
        type="button"
        class="source-btn"
        data-source="other"
      >
        KHÁC
      </button>

    </div>

  </section>



  <!-- ===================================================
       KHÁCH
  ==================================================== -->

  <section class="section">

    <div class="section-title">
      Khách hàng
    </div>


    <div class="paste-box">

      <label for="pasteText">
        ✨ DÁN TIN NHẮN CỦA KHÁCH – TỰ ĐIỀN
      </label>

      <textarea
        id="pasteText"
        placeholder="Dán nguyên tin nhắn: tên, SĐT, địa chỉ (cũ hoặc mới), sản phẩm. Ví dụ: Vợt ess hồng elong, áo xxl"
      ></textarea>

      <button
        id="pasteFillBtn"
        class="paste-btn"
        type="button"
      >
        ✨ TỰ ĐIỀN ĐƠN
      </button>

      <div
        id="pasteResult"
        class="paste-result"
      ></div>

    </div>


    <div class="form-grid">

      <div class="field">

        <label>
          SỐ ĐIỆN THOẠI *
        </label>

        <div class="phone-row">

          <input
            id="phone"
            type="tel"
            inputmode="tel"
            placeholder="09xxxxxxxx"
          >

          <button
            id="findCustomerBtn"
            class="find-btn"
            type="button"
          >
            TÌM KHÁCH
          </button>

        </div>

        <div
          id="customerFound"
          class="customer-found"
        ></div>

      </div>


      <div class="field">

        <label>
          HỌ VÀ TÊN *
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="Tên người nhận"
        >

      </div>


      <div class="field">

        <label>
          ĐỊA CHỈ *
        </label>

        <input
          id="addressLine"
          type="text"
          placeholder="Số nhà / đường / thôn / xóm"
        >

      </div>


           <div class="field">

        <label>
          TỈNH / THÀNH *
        </label>

        <select id="province">
          <option value="">
            Đang tải tỉnh/thành...
          </option>
        </select>

      </div>


      <div class="field">

        <label>
          PHƯỜNG / XÃ *
        </label>

        <select
          id="ward"
          disabled
        >
          <option value="">
            Chọn tỉnh/thành trước
          </option>
        </select>

      </div>
      <div class="field">

        <label>
          ĐỊA CHỈ CŨ *
        </label>

        <textarea
          id="legacyAddress"
          placeholder="Nhập địa chỉ cũ trước sáp nhập: xã/phường cũ, quận/huyện cũ, tỉnh/thành cũ"
        ></textarea>

      </div>
    </div>

  </section>



  <!-- ===================================================
       SẢN PHẨM
  ==================================================== -->

  <section class="section">

    <div class="section-title">
      Sản phẩm
    </div>

    <div
      id="itemList"
      class="item-list"
    ></div>

    <button
      id="addItemBtn"
      class="add-item"
      type="button"
    >
      + THÊM SẢN PHẨM
    </button>


    <div class="total-row">

      <div class="total-label">
        TẠM TÍNH
      </div>

      <div
        id="totalValue"
        class="total-value"
      >
        0đ
      </div>

    </div>

  </section>



  <!-- ===================================================
       THANH TOÁN
  ==================================================== -->

  <section class="section">

    <div class="section-title">
      Thanh toán & ghi chú
    </div>


    <div class="form-grid">

      <div class="field">

        <label>
          THANH TOÁN
        </label>

        <select id="paymentMethod">

          <option value="cod">
            Thanh toán khi nhận hàng
          </option>

          <option value="bank_transfer">
            Chuyển khoản
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          GHI CHÚ
        </label>

        <textarea
          id="customerNote"
          placeholder="Ví dụ: khách chốt qua Zalo, gọi trước khi giao..."
        ></textarea>

      </div>
      <div class="field">

        <label>
          TRẠNG THÁI THANH TOÁN
        </label>

        <select id="paymentStatus">

          <option value="unpaid">
            Chưa thanh toán
          </option>

          <option value="paid">
            Đã thanh toán
          </option>

        </select>

      </div>
    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>

</main>



<div class="bottom-bar">

  <div class="bottom-inner">

    <div>

      <div class="bottom-label">
        TẠM TÍNH
      </div>

      <div
        id="bottomTotal"
        class="bottom-total"
      >
        0đ
      </div>

    </div>


    <button
      id="createBtn"
      class="create-btn"
      type="button"
    >
      TẠO ĐƠN
    </button>

  </div>

</div>



<script>

(function () {


  const cfg =
    window.PICKDEE_CONFIG || {};


  const itemList =
    document.getElementById(
      "itemList"
    );


  const totalValue =
    document.getElementById(
      "totalValue"
    );


  const bottomTotal =
    document.getElementById(
      "bottomTotal"
    );


  const message =
    document.getElementById(
      "message"
    );


  const createBtn =
    document.getElementById(
      "createBtn"
    );


  const customerFound =
    document.getElementById(
      "customerFound"
    );


  const SOURCE_KEY =
    "pickdee_quick_order_source";

  let selectedSource =
    localStorage.getItem(SOURCE_KEY)
    ||
    "zalo";

  let linesTouched =
    false;


  let products = [];

  let variants = [];

  let lines = [];

  const ADDRESS_PROVINCE_URL =
    "https://raw.githubusercontent.com/open-admin-data/vietnam-administrative-divisions/main/data/all-province.json";


  const ADDRESS_WARD_URL =
    "https://raw.githubusercontent.com/open-admin-data/vietnam-administrative-divisions/main/data/all-ward.json";


  let addressProvinces = [];

  let addressWards = [];

  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showMessage(
      "Không tải được hệ thống Shop.",
      "error"
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );



  /* =====================================================
     HELPERS
  ====================================================== */

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function showMessage(
    text,
    type
  ) {

    message.className =
      `message ${type}`;

    message.textContent =
      text;

  }


  function clearMessage() {

    message.className =
      "message";

    message.textContent =
      "";

  }


  function valueFrom(
    object,
    keys
  ) {

    for (
      const key
      of keys
    ) {

      if (
        object
        &&
        object[key] !== null
        &&
        object[key] !== undefined
        &&
        String(
          object[key]
        ).trim() !== ""
      ) {

        return object[key];

      }

    }


    return "";

  }
  function addressName(item) {

    return (
      item?.name?.local
      ||
      item?.name
      ||
      ""
    );

  }


  function fillProvinceOptions(
    selectedName
  ) {

    const provinceSelect =
      document.getElementById(
        "province"
      );


    provinceSelect.innerHTML =
      `
        <option value="">
          Chọn tỉnh/thành
        </option>
      `
      +
      addressProvinces
        .map(
          province => {

            const name =
              addressName(province);


            return `

              <option
                value="${escapeHtml(name)}"
                data-province-id="${escapeHtml(province.id)}"
                ${
                  name === selectedName
                  ?
                    "selected"
                  :
                    ""
                }
              >
                ${escapeHtml(name)}
              </option>

            `;

          }
        )
        .join("");

  }


  function fillWardOptions(
    provinceId,
    selectedName
  ) {

    const wardSelect =
      document.getElementById(
        "ward"
      );


    if (!provinceId) {

      wardSelect.disabled =
        true;


      wardSelect.innerHTML =
        `
          <option value="">
            Chọn tỉnh/thành trước
          </option>
        `;


      return;

    }


    const wards =
      addressWards
        .filter(
          ward =>
            String(ward?.parent?.id)
            ===
            String(provinceId)
        );


    wardSelect.disabled =
      false;


    wardSelect.innerHTML =
      `
        <option value="">
          Chọn phường/xã
        </option>
      `
      +
      wards
        .map(
          ward => {

            const name =
              addressName(ward);


            return `

              <option
                value="${escapeHtml(name)}"
                ${
                  name === selectedName
                  ?
                    "selected"
                  :
                    ""
                }
              >
                ${escapeHtml(name)}
              </option>

            `;

          }
        )
        .join("");

  }


  async function loadAddressData() {

    /*
      Bản gọn 97KB đặt trong web (thay 2,7MB từ GitHub).
      Lỗi thì quay về nguồn GitHub.
    */

    try {

      const localResult =

  /* =====================================================
     ✨ DÁN TIN NHẮN KHÁCH → TỰ ĐIỀN
     - Tách tên, SĐT, địa chỉ, sản phẩm từ tin nhắn.
     - Địa chỉ cũ (trước 1/7/2025) → tự đổi sang tỉnh/xã mới
       (provinces.open-api.vn, miễn phí), giữ nguyên làm "Địa chỉ cũ".
     - Đoán sản phẩm + tuỳ chọn (vd "ess hồng elong áo xxl").
     Mọi thứ chỉ điền sẵn — người tạo đơn vẫn xem lại trước khi bấm TẠO ĐƠN.
  ====================================================== */

  function plain(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/đ/g, "d")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }


  // Tỉnh cũ → tỉnh mới (Nghị quyết 202/2025/QH15, hiệu lực 1/7/2025)
  const OLD_PROVINCE_TO_NEW = {
    "ha giang": "Tuyên Quang", "yen bai": "Lào Cai", "bac kan": "Thái Nguyên",
    "vinh phuc": "Phú Thọ", "hoa binh": "Phú Thọ", "bac giang": "Bắc Ninh",
    "thai binh": "Hưng Yên", "hai duong": "Hải Phòng", "ha nam": "Ninh Bình",
    "nam dinh": "Ninh Bình", "quang binh": "Quảng Trị", "thua thien hue": "Huế",
    "quang nam": "Đà Nẵng", "kon tum": "Quảng Ngãi", "binh dinh": "Gia Lai",
    "ninh thuan": "Khánh Hòa", "dak nong": "Lâm Đồng", "binh thuan": "Lâm Đồng",
    "phu yen": "Đắk Lắk", "binh duong": "Hồ Chí Minh", "ba ria vung tau": "Hồ Chí Minh",
    "ba ria - vung tau": "Hồ Chí Minh", "vung tau": "Hồ Chí Minh",
    "binh phuoc": "Đồng Nai", "long an": "Tây Ninh", "soc trang": "Cần Thơ",
    "hau giang": "Cần Thơ", "ben tre": "Vĩnh Long", "tra vinh": "Vĩnh Long",
    "tien giang": "Đồng Tháp", "bac lieu": "Cà Mau", "kien giang": "An Giang",
    "ho chi minh": "Hồ Chí Minh", "hcm": "Hồ Chí Minh", "sai gon": "Hồ Chí Minh",
    "ha noi": "Hà Nội", "hn": "Hà Nội", "hue": "Huế"
  };


  function stripAdminPrefix(value) {
    return plain(value)
      .replace(/^(tinh|thanh pho|tp\.?|t\.p\.?|thi tran|tt\.?|thi xa|tx\.?|phuong|p\.|xa|x\.|quan|q\.|huyen|h\.)\s*/, "")
      .trim();
  }


  function findProvince(segment) {

    const key = stripAdminPrefix(segment);

    if (!key) {
      return null;
    }

    const direct =
      addressProvinces.find(
        p => plain(addressName(p)) === key
      );

    if (direct) {
      return { province: direct, isOld: false };
    }

    const newName =
      OLD_PROVINCE_TO_NEW[key];

    if (newName) {
      const mapped =
        addressProvinces.find(
          p => addressName(p) === newName
        );
      if (mapped) {
        return { province: mapped, isOld: !["ho chi minh", "hcm", "sai gon", "ha noi", "hn", "hue"].includes(key) };
      }
    }

    return null;

  }


  const WARD_RE = /^(xa|phuong|thi tran|tt\.?|p\.|x\.)(\s|$)/;
  const DISTRICT_RE = /^(huyen|quan|thi xa|thanh pho|tp\.?|tx\.?|h\.|q\.)(\s|$)/;


  function splitAddress(text) {

    const parts =
      String(text || "")
        .split(/[,\n]/)
        .map(x => x.trim())
        .filter(Boolean);

    let provinceInfo = null;
    let provinceIndex = -1;

    for (let i = parts.length - 1; i >= 0; i--) {
      const found = findProvince(parts[i]);
      if (found) {
        provinceInfo = found;
        provinceIndex = i;
        break;
      }
    }

    const before =
      provinceIndex >= 0
        ? parts.slice(0, provinceIndex)
        : parts;

    let wardIndex = -1;
    let districtIndex = -1;

    before.forEach(
      (part, i) => {
        const p = plain(part);
        if (WARD_RE.test(p) && wardIndex < 0) wardIndex = i;
        if (DISTRICT_RE.test(p) && i > wardIndex && wardIndex >= 0) districtIndex = i;
        else if (DISTRICT_RE.test(p) && wardIndex < 0) districtIndex = i;
      }
    );

    const streetEnd =
      [wardIndex, districtIndex]
        .filter(i => i >= 0)
        .reduce((a, b) => Math.min(a, b), before.length);

    return {
      street: before.slice(0, streetEnd).join(", "),
      ward: wardIndex >= 0 ? before[wardIndex] : "",
      district: districtIndex >= 0 ? before[districtIndex] : "",
      provinceInfo
    };

  }


  function wardsOfProvince(provinceId) {
    return addressWards.filter(
      w => String(w?.parent?.id) === String(provinceId)
    );
  }


  function normalizeWardQuery(ward) {
    return String(ward || "")
      .replace(/^\s*(TT\.?|tt\.?)\s*/, "Thị trấn ")
      .replace(/^\s*(P\.|p\.)\s*/, "Phường ")
      .replace(/^\s*(X\.|x\.)\s*/, "Xã ")
      .trim();
  }


  /*
    Nhiều xã trùng tên (vd "Phường 1"): tra mã xã cũ theo quận/huyện cũ
    (API v1 dữ liệu trước sáp nhập) rồi đổi sang xã mới theo mã.
  */

  async function pickByLegacyDistrict(wardText, districtText, candidates) {

    try {

      const base = "https://provinces.open-api.vn/api";

      const districts =
        await (await fetch(base + "/v1/d/search/?q=" + encodeURIComponent(districtText.replace(/^(TP\.?|Tp\.?|tp\.?)\s*/, "Thành phố ").trim()))).json();

      const wardQuery =
        normalizeWardQuery(wardText);

      const hits = [];

      for (const d of (Array.isArray(districts) ? districts : []).slice(0, 5)) {

        const wards =
          await (await fetch(base + "/v1/w/search/?q=" + encodeURIComponent(wardQuery) + "&d=" + d.code)).json();

        for (const w of (Array.isArray(wards) ? wards : []).filter(x => plain(x.name) === plain(wardQuery)).slice(0, 3)) {

          const mapped =
            await (await fetch(base + "/v2/w/from-legacy/?legacy_code=" + w.code)).json();

          (Array.isArray(mapped) ? mapped : []).forEach(
            m => {
              const hit = candidates.find(c => String(c.id) === String(m?.ward?.code));
              if (hit && !hits.includes(hit)) {
                hits.push(hit);
              }
            }
          );

        }

      }

      return hits.length === 1 ? hits[0] : null;

    }
    catch (_) {
      return null;
    }

  }


  async function resolveAddress(text) {

    const parsed = splitAddress(text);

    const result = {
      street: parsed.street,
      provinceName: "",
      provinceId: "",
      wardName: "",
      isOld: false,
      hint: ""
    };

    if (!parsed.provinceInfo) {
      result.hint = "Chưa nhận ra tỉnh/thành – chọn tay giúp em.";
      return result;
    }

    const province = parsed.provinceInfo.province;

    result.provinceName = addressName(province);
    result.provinceId = province.id;
    result.isOld = parsed.provinceInfo.isOld || Boolean(parsed.district);

    const pool = wardsOfProvince(province.id);
    const wardKey = stripAdminPrefix(parsed.ward);
    const districtKey = stripAdminPrefix(parsed.district);

    // Địa chỉ mới: xã/phường có sẵn trong tỉnh mới, không có huyện
    if (!result.isOld && wardKey) {
      const hit = pool.find(w => plain(addressName(w)) === wardKey);
      if (hit) {
        result.wardName = addressName(hit);
        return result;
      }
    }

    if (!parsed.ward) {
      result.hint = "Chưa nhận ra phường/xã – chọn tay giúp em.";
      return result;
    }

    // Địa chỉ cũ → tra xã mới
    try {

      const url =
        "https://provinces.open-api.vn/api/v2/w/from-legacy/?legacy_name="
        + encodeURIComponent(normalizeWardQuery(parsed.ward));

      const response = await fetch(url);
      const list = response.ok ? await response.json() : [];

      const candidates =
        (Array.isArray(list) ? list : [])
          .map(x => x.ward)
          .filter(w => w && String(w.province_code).padStart(2, "0") === String(province.id).padStart(2, "0"))
          .map(w => pool.find(p => String(p.id) === String(w.code)))
          .filter(Boolean)
          .filter((w, i, arr) => arr.indexOf(w) === i);

      let pick = null;

      if (candidates.length === 1) {
        pick = candidates[0];
      }
      else if (candidates.length > 1) {
        pick =
          candidates.find(w => stripAdminPrefix(addressName(w)) === wardKey)
          ||
          candidates.find(w => districtKey && plain(addressName(w)).includes(districtKey))
          ||
          null;

        if (!pick && parsed.district) {
          pick = await pickByLegacyDistrict(parsed.ward, parsed.district, candidates);
        }

        if (!pick) {
          result.hint =
            "Có nhiều xã/phường trùng tên: "
            + candidates.map(addressName).join(" / ")
            + " – chọn đúng giúp em.";
        }
      }

      if (pick) {
        result.wardName = addressName(pick);
      }
      else if (!result.hint) {
        result.hint = "Không tra được xã/phường mới – chọn tay giúp em.";
      }

    }
    catch (_) {
      result.hint = "Không tra được địa chỉ mới (mạng) – chọn tay giúp em.";
    }

    return result;

  }


  function parseMessage(text) {

    const raw = String(text || "").replace(/\r/g, "");

    const phoneMatch =
      raw.match(/(?:\+?84|0)(?:[\s.\-]?\d){9}/);

    const phone =
      phoneMatch
        ? phoneMatch[0].replace(/\D/g, "").replace(/^84/, "0")
        : "";

    const lines =
      raw
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    let name = "";
    let address = "";
    let legacy = "";
    const productLines = [];

    const LABEL = /^\s*([^:：]{2,25})[:：]\s*(.*)$/;

    const NAME_PREFIX = /^(ten nguoi nhan|nguoi nhan|ho va ten|ho ten|ten khach|ten)\s+/;

    function countAdminWords(p) {
      const m = p.match(/(^|[\s,])(xa|phuong|thi tran|huyen|quan|thi xa|tinh|tp|thanh pho|khu pho|ap|thon|xom|duong|so nha|kp|ngo|hem)(?=\s|\.|,|$)/g);
      return m ? m.length : 0;
    }

    lines.forEach(
      rawLine => {

        // bỏ SĐT nằm chung dòng (vd "Chị Hoa - 0903.111.222")
        const line =
          rawLine
            .replace(/(?:\+?84|0)(?:[\s.\-]?\d){9}/g, "")
            .replace(/[\s\-–,:]+$/, "")
            .trim();

        if (!line) {
          return;
        }

        const np = plain(line).match(NAME_PREFIX);
        if (np && !/[:：]/.test(line) && !name) {
          name = line.split(/\s+/).slice(np[0].trim().split(" ").length).join(" ");
          return;
        }

        const m = line.match(LABEL);
        const label = m ? plain(m[1]) : "";
        const value = m ? m[2].trim() : line;

        if (/^(ten|ho ten|ho va ten|nguoi nhan|ten nguoi nhan|khach)/.test(label)) {
          name = value;
          return;
        }

        if (/dia chi cu/.test(label)) {
          legacy = value.replace(/^dia chi\s*[:：]\s*/i, "").replace(/^Địa chỉ\s*[:：]\s*/i, "");
          return;
        }

        if (/^(dia chi|dc|d\/c|address)/.test(label)) {
          address = value;
          return;
        }

        if (/^(sdt|so dien thoai|dien thoai|dt|phone)/.test(label)) {
          return;
        }

        const p = plain(line);
        const digitsOnly = line.replace(/[\s.\-+]/g, "");

        if (/^\d{9,12}$/.test(digitsOnly)) {
          return;
        }

        const adminWords = countAdminWords(p);

        if (
          adminWords >= 2
          ||
          (adminWords >= 1 && line.includes(","))
        ) {
          if (!address || line.length > address.length) {
            address = line;
          }
          return;
        }

        const looksLikeName =
          !/\d/.test(line)
          &&
          line.split(/\s+/).length <= 5
          &&
          (
            /^(anh|chi|em|co|chu|bac|ong|ba|a|c|e)\s/.test(p)
            ||
            !findProductGuess(line)
          );

        if (!name && looksLikeName) {
          name = line;
          return;
        }

        productLines.push(line);

      }
    );

    if (!address && legacy) {
      address = legacy;
    }

    return {
      phone,
      name: name.replace(/\s*[-–]\s*$/, "").trim(),
      address,
      legacy,
      productText: productLines.join(" ")
    };

  }


  function tokensOf(text) {
    return plain(text)
      .replace(/[^a-z0-9\s]/g, " ")
      .split(" ")
      .filter(Boolean);
  }


  function tokenHit(textTokens, word) {
    return textTokens.some(
      t =>
        t === word
        ||
        (t.length >= 5 && word.startsWith(t))
        ||
        (word.length >= 5 && t.startsWith(word))
    );
  }


  const STOP = new Set(["pickleball", "chuyen", "dung", "cho", "nam", "va", "nu", "the", "thao", "loai", "mau", "size", "ao", "tang", "kem", "lop", "tui", "chiec", "hang"]);


  function findProductGuess(text) {

    const textTokens = tokensOf(text);

    if (!textTokens.length) {
      return null;
    }

    let best = null;
    let bestScore = 0;
    let tie = false;

    products.forEach(
      p => {

        if (!productVariants(p.id).length) {
          return;
        }

        const words =
          tokensOf(p.name).filter(w => w.length >= 2 && !STOP.has(w));

        const nameHits =
          words.filter(w => tokenHit(textTokens, w)).length;

        if (!nameHits) {
          return;
        }

        const optionWords = new Set();
        productVariants(p.id).forEach(
          v =>
            tokensOf((v.option1_value || "") + " " + (v.option2_value || "") + " " + (v.variant_name || ""))
              .filter(w => w.length >= 2 && !STOP.has(w))
              .forEach(w => optionWords.add(w))
        );

        const optionHits =
          [...optionWords].filter(w => textTokens.includes(w) || tokenHit(textTokens, w)).length;

        const score =
          nameHits * 10 + Math.min(optionHits, 9);

        if (score > bestScore) {
          best = p;
          bestScore = score;
          tie = false;
        }
        else if (score && score === bestScore) {
          tie = true;
        }

      }
    );

    if (!best || tie) {
      return null;
    }

    // Chọn tuỳ chọn khớp nhiều chữ nhất
    const list = productVariants(best.id);

    function bestValue(key, pool) {
      let value = null;
      let score = 0;
      uniqueValues(pool, key).forEach(
        v => {
          const words = tokensOf(v).filter(w => !STOP.has(w));
          const hit =
            words.length && words.every(w => w.length <= 3 ? textTokens.includes(w) : tokenHit(textTokens, w))
              ? words.join("").length + 100
              : words.filter(w => w.length > 3 && tokenHit(textTokens, w)).length;
          if (hit > score) {
            value = v;
            score = hit;
          }
        }
      );
      return value;
    }

    const opt1 = bestValue("option1_value", list);
    const opt2 =
      bestValue(
        "option2_value",
        list.filter(v => opt1 == null || v.option1_value === opt1)
      );

    const qtyMatch =
      plain(text).match(/(?:sl|so luong|x)\s*(\d{1,3})\b|\b(\d{1,3})\s*(?:cai|chiec|doi|hop|tui|cay)\b/);

    return {
      variant: pickVariant(best.id, opt1, opt2),
      quantity: qtyMatch ? Number(qtyMatch[1] || qtyMatch[2]) || 1 : 1
    };

  }


  function setValue(id, value) {
    const el = document.getElementById(id);
    if (el && value) {
      el.value = value;
    }
  }


  async function smartFill() {

    const box = document.getElementById("pasteResult");
    const text = document.getElementById("pasteText").value;

    if (!text.trim()) {
      return;
    }

    const info = parseMessage(text);
    const done = [];
    const warn = [];

    if (info.phone) {
      setValue("phone", info.phone);
      done.push("SĐT " + info.phone);
    }
    else {
      warn.push("Chưa thấy SĐT.");
    }

    if (info.name) {
      setValue("customerName", info.name);
      done.push("Tên " + info.name);
    }
    else {
      warn.push("Chưa thấy tên người nhận.");
    }

    if (info.address) {

      box.style.display = "block";
      box.className = "paste-result";
      box.textContent = "Đang đổi địa chỉ...";

      const addr = await resolveAddress(info.address);

      if (addr.street) {
        setValue("addressLine", addr.street);
      }

      if (addr.provinceName) {
        fillProvinceOptions(addr.provinceName);
        fillWardOptions(addr.provinceId, addr.wardName);
      }

      if (addr.isOld || info.legacy) {
        setValue("legacyAddress", info.legacy || info.address);
      }

      if (addr.wardName) {
        done.push(
          (addr.isOld ? "Địa chỉ mới: " : "Địa chỉ: ")
          + addr.wardName + ", " + addr.provinceName
        );
      }

      if (addr.hint) {
        warn.push(addr.hint);
      }

      if (!addr.isOld && !info.legacy) {
        warn.push("Khách gửi địa chỉ mới – nhập thêm địa chỉ cũ nếu có.");
      }

    }
    else {
      warn.push("Chưa thấy địa chỉ.");
    }

    const guess =
      info.productText
        ? findProductGuess(info.productText)
        : null;

    if (guess && guess.variant) {

      if (!linesTouched && lines.length === 1) {
        lines[0] = { variant_id: guess.variant.id, quantity: guess.quantity };
      }
      else {
        lines.push({ variant_id: guess.variant.id, quantity: guess.quantity });
      }

      linesTouched = true;
      renderLines();

      const product =
        products.find(p => String(p.id) === String(guess.variant.product_id));

      done.push(
        "Sản phẩm: " + (product ? product.name : "")
        + (guess.variant.variant_name && guess.variant.variant_name !== "Mặc định" ? " • " + guess.variant.variant_name : "")
        + (guess.quantity > 1 ? " × " + guess.quantity : "")
      );

    }
    else if (info.productText) {
      warn.push("Chưa đoán được sản phẩm – chọn tay giúp em.");
    }

    box.style.display = "block";
    box.className = "paste-result" + (warn.length ? " warn" : "");
    box.textContent =
      (done.length ? "✓ " + done.join("\n✓ ") : "")
      + (warn.length ? (done.length ? "\n" : "") + "⚠️ " + warn.join("\n⚠️ ") : "")
      + "\nKiểm tra lại rồi bấm TẠO ĐƠN.";

  }

              .querySelectorAll(
                ".source-btn"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );

          }
        );

      }
    );



  /* =====================================================
     PRODUCTS
  ====================================================== */

  /*
    Chọn theo 3 bước: Sản phẩm → tuỳ chọn 1 (vd Loại vợt / Màu vợt)
    → tuỳ chọn 2 (vd Size áo). Không phải dò danh sách gộp dài.
  */

  function productVariants(productId) {

    return variants.filter(
      v =>
        String(v.product_id)
        ===
        String(productId)
    );

  }


  function uniqueValues(list, key) {

    const seen = [];

    list.forEach(
      v => {
        const value = v[key];
        if (
          value != null
          &&
          value !== ""
          &&
          !seen.includes(value)
        ) {
          seen.push(value);
        }
      }
    );

    return seen;

  }


  function optionTags(values, selected) {

    return values
      .map(
        value => `
          <option
            value="${escapeHtml(value)}"
            ${String(value) === String(selected) ? "selected" : ""}
          >
            ${escapeHtml(value)}
          </option>
        `
      )
      .join("");

  }


  function productOptions(selectedProductId) {

    return products
      .filter(
        p => productVariants(p.id).length
      )
      .map(
        p => {

          const list = productVariants(p.id);

          const prices =
            list.map(v => Number(v.price || 0));

          const min = Math.min(...prices);
          const max = Math.max(...prices);

          return `
            <option
              value="${p.id}"
              ${String(p.id) === String(selectedProductId) ? "selected" : ""}
            >
              ${escapeHtml(
                p.name
                + " — "
                + (min === max ? money(min) : money(min) + " – " + money(max))
              )}
            </option>
          `;

        }
      )
      .join("");

  }


  /*
    Tìm biến thể khớp lựa chọn; thiếu tổ hợp thì lấy
    biến thể đầu tiên khớp tuỳ chọn 1.
  */

  function pickVariant(productId, opt1, opt2) {

    const list = productVariants(productId);

    return (
      list.find(
        v =>
          (opt1 == null || v.option1_value === opt1)
          &&
          (opt2 == null || v.option2_value === opt2)
      )
      ||
      list.find(
        v =>
          opt1 == null || v.option1_value === opt1
      )
      ||
      list[0]
    );

  }


  function lineOptionSelects(variant, index) {

    const list =
      productVariants(variant.product_id);

    if (list.length < 2) {
      return "";
    }

    const opt1Values =
      uniqueValues(list, "option1_value");

    /*
      Sản phẩm nhiều biến thể nhưng không khai báo tuỳ chọn:
      chọn theo tên biến thể.
    */

    if (!opt1Values.length) {

      return `
        <div class="item-opts single">
          <div>
            <div class="opt-label">Phân loại</div>
            <select class="variant-select" data-index="${index}">
              ${list
                .map(
                  v => `
                    <option value="${v.id}" ${v.id === variant.id ? "selected" : ""}>
                      ${escapeHtml((v.variant_name || "Mặc định") + " — " + money(v.price))}
                    </option>
                  `
                )
                .join("")}
            </select>
          </div>
        </div>
      `;

    }

    const opt2Values =
      uniqueValues(
        list.filter(
          v => v.option1_value === variant.option1_value
        ),
        "option2_value"
      );

    return `
      <div class="item-opts ${opt2Values.length ? "" : "single"}">

        <div>
          <div class="opt-label">
            ${escapeHtml(list[0].option1_name || "Phân loại")}
          </div>
          <select class="opt1-select" data-index="${index}">
            ${optionTags(opt1Values, variant.option1_value)}
          </select>
        </div>

        ${
          opt2Values.length
            ?
              `
                <div>
                  <div class="opt-label">
                    ${escapeHtml(list[0].option2_name || "Tuỳ chọn")}
                  </div>
                  <select class="opt2-select" data-index="${index}">
                    ${optionTags(opt2Values, variant.option2_value)}
                  </select>
                </div>
              `
            :
              ""
        }

      </div>
    `;

  }


  function addLine() {

    if (!variants.length) {
      return;
    }

    linesTouched = true;


    lines.push({

      variant_id:
        variants[0].id,

      quantity:
        1

    });


    renderLines();

  }


  function renderLines() {

    itemList.innerHTML =
      lines
        .map(
          function (line,index) {

            const variant =
              variants.find(
                v =>
                  String(v.id)
                  ===
                  String(
                    line.variant_id
                  )
              );


            return `

              <div
                class="item-row"
                data-index="${index}"
              >

                <div class="item-top">

                  <select
                    class="product-select"
                    data-index="${index}"
                  >
                    ${productOptions(
                      variant
                        ? variant.product_id
                        : ""
                    )}
                  </select>


                  <input
                    class="qty"
                    data-index="${index}"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="999"
                    value="${line.quantity}"
                  >

                </div>


                ${
                  variant
                    ? lineOptionSelects(variant, index)
                    : ""
                }


                <div class="item-bottom">

                  <div class="item-price">

                    ${
                      variant
                        ?
                          money(
                            Number(
                              variant.price || 0
                            )
                            *
                            Number(
                              line.quantity || 1
                            )
                          )
                        :
                          "-"
                    }

                  </div>


                  ${
                    lines.length > 1
                    ?
                      `
                        <button
                          type="button"
                          class="remove-item"
                          data-remove="${index}"
                        >
                          XÓA
                        </button>
                      `
                    :
                      ""
                  }

                </div>

              </div>
            `;

          }
        )
        .join("");


    bindLineEvents();

    updateTotal();

  }


  function bindLineEvents() {

    function onChange(selector, apply) {

      document
        .querySelectorAll(selector)
        .forEach(
          function (select) {

            select.addEventListener(
              "change",
              function () {

                const index =
                  Number(select.dataset.index);

                const current =
                  variants.find(
                    v =>
                      String(v.id)
                      ===
                      String(lines[index].variant_id)
                  )
                  ||
                  {};

                const next =
                  apply(select.value, current);

                if (next) {
                  lines[index].variant_id = next.id;
                }

                linesTouched = true;

                renderLines();

              }
            );

          }
        );

    }


    onChange(
      ".product-select",
      function (productId) {
        return productVariants(productId)[0];
      }
    );


    onChange(
      ".opt1-select",
      function (value, current) {
        return pickVariant(
          current.product_id,
          value,
          current.option2_value
        );
      }
    );


    onChange(
      ".opt2-select",
      function (value, current) {
        return pickVariant(
          current.product_id,
          current.option1_value,
          value
        );
      }
    );


    document
      .querySelectorAll(
        ".variant-select"
      )
      .forEach(
        function (select) {

          select.addEventListener(
            "change",
            function () {

              const index =
                Number(
                  select.dataset.index
                );


              lines[index].variant_id =
                Number(
                  select.value
                );


              renderLines();

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".qty"
      )
      .forEach(
        function (input) {

          input.addEventListener(
            "change",
            function () {

              const index =
                Number(
                  input.dataset.index
                );


              lines[index].quantity =
                Math.max(
                  1,
                  Number(
                    input.value || 1
                  )
                );


              renderLines();

            }
          );

        }
      );


    document
      .querySelectorAll(
        "[data-remove]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              const index =
                Number(
                  button.dataset.remove
                );


              lines.splice(
                index,
                1
              );


              renderLines();

            }
          );

        }
      );

  }


  function updateTotal() {

    const total =
      lines.reduce(
        function (sum,line) {

          const variant =
            variants.find(
              v =>
                String(v.id)
                ===
                String(
                  line.variant_id
                )
            );


          return (
            sum
            +
            (
              Number(
                variant?.price || 0
              )
              *
              Number(
                line.quantity || 0
              )
            )
          );

        },
        0
      );


    totalValue.textContent =
      money(total);


    bottomTotal.textContent =
      money(total);

  }


  document
    .getElementById(
      "addItemBtn"
    )
    .addEventListener(
      "click",
      addLine
    );



  /* =====================================================
     TÌM KHÁCH CŨ QUA SĐT
  ====================================================== */

  document
    .getElementById(
      "findCustomerBtn"
    )
    .addEventListener(
      "click",
      async function () {


        const phone =
          document
            .getElementById(
              "phone"
            )
            .value
            .trim();


        if (!phone) {

          showMessage(
            "Nhập số điện thoại trước.",
            "error"
          );

          return;

        }


        clearMessage();


        customerFound.style.display =
          "none";


        try {


          const {
            data,
            error
          } =
            await sb
              .from(
                "shop_orders"
              )
              .select("*")
              .eq(
                "phone",
                phone
              )
              .order(
                "created_at",
                {
                  ascending:
                    false
                }
              )
              .limit(1);


          if (error) {

            throw error;

          }


          const previous =
            data?.[0];


          if (!previous) {

            customerFound.style.display =
              "block";


            customerFound.textContent =
              "Khách mới — nhập thông tin một lần.";

            return;

          }


          document
            .getElementById(
              "customerName"
            )
            .value =
              previous.customer_name
              ||
              "";


          document
            .getElementById(
              "addressLine"
            )
            .value =
              valueFrom(
                previous,
                [
                  "address_line",
                  "shipping_address_line",
                  "delivery_address",
                  "address"
                ]
              );


                 const previousWard =
            valueFrom(
              previous,
              [
                "ward",
                "shipping_ward"
              ]
            );


          const previousProvince =
            valueFrom(
              previous,
              [
                "province",
                "shipping_province",
                "city"
              ]
            );


          const provinceSelect =
            document.getElementById(
              "province"
            );


          provinceSelect.value =
            previousProvince;


          const selectedOption =
            provinceSelect.options[
              provinceSelect.selectedIndex
            ];


          fillWardOptions(
            selectedOption?.dataset?.provinceId
            ||
            "",
            previousWard
          );
            


          customerFound.style.display =
            "block";


          if (previous.legacy_address) {
            document
              .getElementById(
                "legacyAddress"
              )
              .value =
                previous.legacy_address;
          }

          customerFound.textContent =
            "✓ Khách cũ – đã điền lại thông tin từ đơn "
            + (previous.order_code || "gần nhất")
            + ".";


        }
        catch (error) {


          console.error(
            "FIND CUSTOMER ERROR:",
            error
          );


          showMessage(
            "Không tìm được thông tin khách cũ.",
            "error"
          );

        }

      }
    );



  /*
    Gõ đủ 10 số → tự tìm khách cũ (khi chưa có tên).
  */

  let lastLookupPhone = "";

  document
    .getElementById("phone")
    .addEventListener(
      "input",
      function () {

        const digits =
          this.value.replace(/\D/g, "");

        if (
          digits.length === 10
          &&
          digits !== lastLookupPhone
          &&
          !document.getElementById("customerName").value.trim()
        ) {
          lastLookupPhone = digits;
          this.value = digits;
          document.getElementById("findCustomerBtn").click();
        }

      }
    );


  /* =====================================================
     LOAD CATALOG
  ====================================================== */

  async function loadCatalog() {

    const [
      productResult,
      variantResult
    ] =
      await Promise.all([


        sb
          .from(
            "shop_products"
          )
          .select(
            "id,name,status"
          )
          .eq(
            "status",
            "active"
          )
          .order(
            "name",
            {
              ascending:
                true
            }
          ),


        sb
          .from(
            "shop_product_variants"
          )
          .select(
            "id,product_id,variant_name,option1_name,option1_value,option2_name,option2_value,price,is_active,sort_order"
          )
          .eq(
            "is_active",
            true
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          )


      ]);


    if (productResult.error) {

      throw productResult.error;

    }


    if (variantResult.error) {

      throw variantResult.error;

    }


    products =
      productResult.data
      ||
      [];


    const activeProductIds =
      new Set(
        products.map(
          p =>
            String(p.id)
        )
      );


    variants =
      (
        variantResult.data
        ||
        []
      )
        .filter(
          v =>
            activeProductIds.has(
              String(
                v.product_id
              )
            )
        );


    if (!variants.length) {

      throw new Error(
        "Chưa có sản phẩm đang bán."
      );

    }


    lines = [

      {
        variant_id:
          variants[0].id,

        quantity:
          1
      }

    ];


    renderLines();

  }



  /* =====================================================
     CREATE ORDER
  ====================================================== */

  createBtn.addEventListener(
    "click",
    async function () {


      clearMessage();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const customerName =
        document
          .getElementById(
            "customerName"
          )
          .value
          .trim();


      const addressLine =
        document
          .getElementById(
            "addressLine"
          )
          .value
          .trim();


      const ward =
        document
          .getElementById(
            "ward"
          )
          .value
          .trim();


            const province =
        document
          .getElementById(
            "province"
          )
          .value
          .trim();


      const legacyAddress =
        document
          .getElementById(
            "legacyAddress"
          )
          .value
          .trim();


      const customerNote =
        document
          .getElementById(
            "customerNote"
          )
          .value
          .trim();


      const paymentMethod =
        document
          .getElementById(
            "paymentMethod"
          )
          .value;
      const paymentStatus =
        document
          .getElementById(
            "paymentStatus"
          )
          .value;

      if (
        !phone
        ||
        !customerName
        ||
        !addressLine
        ||
        !ward
        ||
        !province
        ||
        !legacyAddress
      ) {

        showMessage(
          "Nhập đủ SĐT, tên, địa chỉ hiện tại và địa chỉ cũ.",
          "error"
        );

        return;

      }


      if (!lines.length) {

        showMessage(
          "Chưa có sản phẩm trong đơn.",
          "error"
        );

        return;

      }


      createBtn.disabled =
        true;


      createBtn.textContent =
        "ĐANG TẠO...";


      try {


        const rpcItems =
          lines.map(
            line => ({

              variant_id:
                Number(
                  line.variant_id
                ),

              quantity:
                Number(
                  line.quantity || 1
                )

            })
          );


        const {
          data,
          error
        } =
          await sb.rpc(
            "shop_admin_create_order",
            {

              p_customer_name:
                customerName,

              p_phone:
                phone,

              p_email:
                null,

              p_address_line:
                addressLine,

              p_ward:
                ward,

              p_province:
                province,

              p_payment_method:
                paymentMethod,

              p_customer_note:
                customerNote || null,

              p_order_source:
                selectedSource,

              p_items:
                rpcItems

            }
          );


        if (error) {

          throw error;

        }


        if (
          !data?.success
          ||
          !data?.order_id
        ) {

          console.error(
            "ADMIN ORDER RESULT:",
            data
          );


          throw new Error(
            "Không tạo được đơn hàng."
          );

        }


              const {
          error: orderUpdateError
        } =
          await sb
            .from(
              "shop_orders"
            )
            .update({
              legacy_address:
                legacyAddress,

              payment_status:
                paymentStatus
            })
            .eq(
              "id",
              data.order_id
            );


        if (orderUpdateError) {

          throw orderUpdateError;

        }

        showMessage(
          `✓ Đã tạo ${data.order_code}`,
          "success"
        );


        setTimeout(
          function () {

            location.href =
              `./shop-admin-order?id=${encodeURIComponent(
                data.order_id
              )}`;

          },
          700
        );


      }
      catch (error) {


        console.error(
          "CREATE QUICK ORDER ERROR:",
          error
        );


        showMessage(
          error?.message
          ||
          "Không tạo được đơn hàng.",
          "error"
        );


      }
      finally {


        createBtn.disabled =
          false;


        createBtn.textContent =
          "TẠO ĐƠN";


      }

    }
  );



  /* =====================================================
     START
  ====================================================== */

  function restoreSource() {

    document
      .querySelectorAll(".source-btn")
      .forEach(
        button =>
          button.classList.toggle(
            "active",
            button.dataset.source === selectedSource
          )
      );

  }


  async function start() {

    restoreSource();

    try {

            await requireShopAccess();

      await loadAddressData();

      await loadCatalog();

    }
    catch (error) {

      console.error(
        "QUICK ORDER START ERROR:",
        error
      );


      showMessage(
        error?.message
        ||
        "Không tải được trang tạo đơn.",
        "error"
      );


      createBtn.disabled =
        true;

    }

  }


  start();


})();

</script>
