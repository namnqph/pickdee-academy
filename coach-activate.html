<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>
  <title>Kích hoạt Coach | PickDee Academy</title>
  <meta name="theme-color" content="#09111f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="robots" content="noindex">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261017-logout1"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at top,#123158,#09111f 60%)}
    .card{width:min(420px,100%);padding:26px 20px 22px;border-radius:22px;text-align:center;
      background:linear-gradient(160deg,#0f2747,#0a1a30);border:1px solid rgba(216,255,69,.35);box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .icon{font-size:46px;line-height:1}
    h1{margin:12px 0 6px;font-size:21px;color:#d8ff45}
    p{margin:0 0 14px;font-size:15px;line-height:1.55;color:rgba(255,255,255,.85)}
    .field{position:relative;margin:6px 0 12px}
    input{width:100%;min-height:52px;padding:0 64px 0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);color:#fff;font-size:16px}
    .eye{position:absolute;right:8px;top:8px;height:36px;padding:0 10px;border:0;border-radius:10px;
      background:rgba(255,255,255,.1);color:#fff;font-size:13px}
    .btn{width:100%;min-height:52px;border:0;border-radius:14px;background:#d8ff45;color:#071523;font-size:16px;font-weight:900;cursor:pointer}
    .btn[disabled]{opacity:.6}
    .msg{margin-top:12px;font-size:14px;line-height:1.5;min-height:20px}
    .err{color:#ff8a8a}.ok{color:#9dff9d}
    .hint{margin-top:12px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.5}
    .spin{width:34px;height:34px;margin:16px auto;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#d8ff45;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>
<body>
  <div class="card" id="card">
    <div class="icon">🏓</div>
    <h1>Đang kích hoạt…</h1>
    <div class="spin"></div>
  </div>

<script>
(function () {
  const card = document.getElementById("card");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const token = new URLSearchParams(location.search).get("t") || "";

  function fail(text) {
    card.innerHTML = `<div class="icon">⚠️</div><h1>Chưa kích hoạt được</h1><p>${esc(text)}</p>
      <a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://zalo.me/0926629966">💬 Nhắn PickDee qua Zalo</a>
      <div class="hint">Đã có mật khẩu? <a href="/coach" style="color:#d8ff45">Đăng nhập tại đây</a></div>`;
  }

  function askPassword(name) {
    card.innerHTML = `<div class="icon">👋</div><h1>Chào ${esc(name || "Coach")}!</h1>
      <p>Bạn đã vào PickDee. Đặt mật khẩu riêng để lần sau đăng nhập (có thể dùng Face ID/vân tay).</p>
      <form id="f" autocomplete="on">
        <div class="field">
          <input id="pw" type="password" autocomplete="new-password" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" minlength="8" required>
          <button type="button" class="eye" id="eye">Hiện</button>
        </div>
        <button class="btn" id="go" type="submit">TIẾP TỤC</button>
      </form>
      <div class="msg" id="msg"></div>`;
    const pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
    document.getElementById("eye").onclick = e => {
      pw.type = pw.type === "password" ? "text" : "password";
      e.target.textContent = pw.type === "password" ? "Hiện" : "Ẩn";
    };
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const v = pw.value;
      if (v.length < 8) { msg.className = "msg err"; msg.textContent = "Mật khẩu cần ít nhất 8 ký tự."; return; }
      go.disabled = true; go.textContent = "ĐANG LƯU…"; msg.textContent = "";
      try {
        const { data: u } = await window.sb.auth.getUser();
        const { error } = await window.sb.auth.updateUser({
          password: v, data: { ...(u?.user?.user_metadata || {}), must_change_password: false }
        });
        if (error && !/same|khác|different/i.test(error.message || "")) throw error;
        msg.className = "msg ok"; msg.textContent = "✓ Xong! Đang mở khu vực Coach…";
        setTimeout(() => location.replace("/coach"), 800);
      } catch (err) {
        go.disabled = false; go.textContent = "TIẾP TỤC";
        msg.className = "msg err"; msg.textContent = "Không lưu được mật khẩu: " + (err?.message || err);
      }
    };
    pw.focus();
  }

  async function run() {
    if (!/^[0-9a-f-]{36}$/i.test(token)) return fail("Link kích hoạt không đúng. Hãy bấm lại đúng link PickDee gửi bạn.");
    const cfg = window.PICKDEE_CONFIG || {};
    let r;
    try {
      const res = await fetch(cfg.SUPABASE_URL + "/functions/v1/pickdee-coach-activate", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_PUBLISHABLE_KEY },
        body: JSON.stringify({ token })
      });
      r = await res.json().catch(() => ({}));
    } catch (e) { return fail("Mạng đang chập chờn. Kiểm tra kết nối rồi bấm lại link."); }
    if (!r?.ok) return fail(r?.error || "Link kích hoạt không hợp lệ.");

    let res = await window.sb.auth.verifyOtp({ token_hash: r.token_hash, type: "email" });
    if (res.error) res = await window.sb.auth.verifyOtp({ token_hash: r.token_hash, type: "magiclink" });
    if (res.error || !res.data?.session) return fail("Không đăng nhập được: " + (res.error?.message || "thử lại sau ít phút."));

    const md = res.data.user?.user_metadata || {};
    if (md.must_change_password === true || md.must_change_password === "true") return askPassword(r.full_name);
    location.replace("/coach");
  }

  (function wait(i) {
    if (window.sb?.auth) return run();
    if (i > 100) return fail("Không tải được PickDee. Kiểm tra mạng rồi bấm lại link.");
    setTimeout(() => wait(i + 1), 100);
  })(0);
})();
</script>
</body>
</html>
