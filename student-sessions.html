<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lịch học của tôi | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom:
        1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #userEmail {
      color: rgba(255,255,255,.8);
      font-size: 14px;
    }

    .logout {
      border:
        1px solid rgba(255,255,255,.18);

      background:
        rgba(255,255,255,.08);

      color: white;

      padding: 9px 12px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: 800;
    }

    .container {
      width:
        min(
          1150px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        32px 0 60px;
    }

    .back {
      color: #d8ff45;

      text-decoration: none;

      font-weight: 800;
    }

    .eyebrow {
      margin-top: 25px;

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    h1 {
      margin:
        8px 0 5px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );
    }

    .sub {
      color:
        rgba(255,255,255,.62);

      margin-bottom: 22px;
    }

    .summary {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 14px;

      margin-bottom: 18px;
    }

    .summary-card,
    .card {
      background:
        rgba(6,39,88,.74);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 16px;
    }

    .summary-card {
      padding: 18px;
    }

    .summary-label {
      color:
        rgba(255,255,255,.52);

      font-size: 12px;

      margin-bottom: 7px;
    }

    .summary-value {
      color: #d8ff45;

      font-size: 26px;

      font-weight: 900;
    }

    .card {
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 850px;
    }

    th,
    td {
      padding: 14px 12px;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      text-align: left;

      font-size: 14px;
    }

    th {
      color: #d8ff45;
    }

    tbody tr {
      transition: .15s ease;
    }

    tbody tr:hover {
      background:
        rgba(255,255,255,.035);
    }

    .badge {
      display: inline-block;

      padding:
        6px 9px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.12);

      color: #d8ff45;

      font-size: 12px;

      font-weight: 900;
    }

    .badge.waiting {
      color: #ffd86b;

      background:
        rgba(255,216,107,.12);
    }

    .badge.done {
      color: #d8ff45;

      background:
        rgba(216,255,69,.12);
    }

    .badge.absent {
      color: #ff9c9c;

      background:
        rgba(255,156,156,.12);
    }

    #message {
      margin-bottom: 15px;

      min-height: 20px;

      color: #ffb0b0;

      font-weight: 700;
    }

    #empty {
      display: none;

      padding: 32px;

      text-align: center;

      color:
        rgba(255,255,255,.62);
    }

    @media(max-width:700px) {

      .summary {
        grid-template-columns: 1fr;
      }

      #userEmail {
        display: none;
      }

      .topbar {
        padding: 15px;
      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div class="user-area">

    <div id="userEmail"></div>

    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      ĐĂNG XUẤT
    </button>

  </div>

</header>


<main class="container">

  <a
    class="back"
    href="./student"
  >
    ← Khu vực học viên
  </a>

  <div class="eyebrow">
    KHU VỰC HỌC VIÊN
  </div>

  <h1>
    Lịch học của tôi
  </h1>

  <div class="sub">
    Theo dõi các buổi học thuộc gói học của bạn.
  </div>


  <section class="summary">

    <div class="summary-card">

      <div class="summary-label">
        Đã sử dụng
      </div>

      <div
        id="usedSessions"
        class="summary-value"
      >
        —
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Tổng số buổi
      </div>

      <div
        id="totalSessions"
        class="summary-value"
      >
        —
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Còn lại
      </div>

      <div
        id="remainingSessions"
        class="summary-value"
      >
        —
      </div>

    </div>

  </section>


  <div id="message">
    Đang tải lịch học...
  </div>


  <section class="card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Mã buổi</th>
            <th>Buổi số</th>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Coach</th>
            <th>Sân</th>
            <th>Trạng thái</th>
          </tr>

        </thead>

        <tbody id="sessionBody">

          <tr>
            <td colspan="7">
              Đang tải lịch học...
            </td>
          </tr>

        </tbody>

      </table>


      <div id="empty">
        Bạn chưa có lịch học nào.
      </div>

    </div>

  </section>

</main>


<script>

(async function () {

  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};

  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     ELEMENTS
  ====================================================== */

  const userEmailEl =
    document.getElementById(
      "userEmail"
    );

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  const usedSessionsEl =
    document.getElementById(
      "usedSessions"
    );

  const totalSessionsEl =
    document.getElementById(
      "totalSessions"
    );

  const remainingSessionsEl =
    document.getElementById(
      "remainingSessions"
    );

  const sessionBody =
    document.getElementById(
      "sessionBody"
    );

  const emptyEl =
    document.getElementById(
      "empty"
    );

  const messageEl =
    document.getElementById(
      "message"
    );


  /* =====================================================
     HELPERS
  ====================================================== */

  function formatDate(value) {

    if (!value) {
      return "—";
    }

    return new Intl.DateTimeFormat(
      "vi-VN"
    ).format(
      new Date(
        `${value}T00:00:00`
      )
    );

  }


  function formatTime(value) {

    if (!value) {
      return "—";
    }

    return String(value)
      .slice(0,5);

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function statusClass(status) {

    const value =
      String(status || "")
        .trim();

    if (
      value === "Đã hoàn thành"
    ) {
      return "done";
    }

    if (
      value === "Vắng"
    ) {
      return "absent";
    }

    return "waiting";

  }


  function sessionTimestamp(item) {

    const date =
      item.session_date || "";

    const time =
      item.start_time ||
      "00:00:00";

    const result =
      new Date(
        `${date}T${time}`
      );

    return Number.isNaN(
      result.getTime()
    )
      ? 0
      : result.getTime();

  }


  /* =====================================================
     LOAD
  ====================================================== */

  async function loadSessions() {

    messageEl.textContent =
      "Đang tải lịch học...";


    /* ------------------------------
       SESSION LOGIN
    ------------------------------ */

    const {
      data: { session },
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (
      sessionError ||
      !session
    ) {

      window.location.href =
        "./login.html";

      return;
    }


    userEmailEl.textContent =
      session.user.email || "";


    /* ------------------------------
       STUDENT ID
    ------------------------------ */

    const {
      data: studentId,
      error: studentError
    } =
      await sb.rpc(
        "current_student_id"
      );


    if (
      studentError ||
      !studentId
    ) {

      console.error(
        "Student ID:",
        studentError
      );

      messageEl.textContent =
        "Không xác định được hồ sơ học viên.";

      return;
    }


    /* ------------------------------
       REGISTRATIONS
    ------------------------------ */

       const {
      data: registrations,
      error: registrationError
    } =
      await sb
        .from("registrations")
        .select(`
          id,
          registration_code,
          package_name,
          purchased_sessions,
          start_date,
          end_date,
          status,
          is_test
        `)
        .eq(
          "student_id",
          Number(studentId)
        )
        .eq(
          "is_test",
          false
        );


    if (registrationError) {

      console.error(
        "Registrations:",
        registrationError
      );

      messageEl.textContent =
        "Không tải được gói học.";

      return;
    }


    const registrationRows =
      registrations || [];


    if (
      registrationRows.length === 0
    ) {

      usedSessionsEl.textContent =
        "0";

      totalSessionsEl.textContent =
        "0";

      remainingSessionsEl.textContent =
        "0";

      sessionBody.innerHTML = "";

      emptyEl.style.display =
        "block";

      messageEl.textContent =
        "Bạn chưa có đăng ký học.";

      return;
    }


    const approvedRegistrations =
      registrationRows
        .filter(
          item =>
            String(
              item.status || ""
            ).trim()
            ===
            "Đã duyệt"
        )
        .sort(
          (a,b) =>
            String(
              b.start_date || ""
            )
            .localeCompare(
              String(
                a.start_date || ""
              )
            )
        );


    const currentRegistration =
      approvedRegistrations[0]
      ||
      registrationRows[0];


    const registrationIds =
      registrationRows
        .map(
          item =>
            Number(item.id)
        )
        .filter(Boolean);


    /* ------------------------------
       CLASS SESSIONS
    ------------------------------ */

    const {
      data: sessions,
      error: sessionRowsError
    } =
      await sb
        .from("class_sessions")
        .select(`
          id,
          session_code,
          registration_id,
          coach_id,
          session_no,
          session_date,
          start_time,
          duration_minutes,
          court_name,
          status,
          coaches (
            id,
            coach_code,
            full_name
          )
        `)
        .in(
          "registration_id",
          registrationIds
        )
        .order(
          "session_date",
          {
            ascending: true
          }
        )
        .order(
          "start_time",
          {
            ascending: true
          }
        );


    if (sessionRowsError) {

      console.error(
        "Class sessions:",
        sessionRowsError
      );

      messageEl.textContent =
        "Không tải được lịch học.";

      sessionBody.innerHTML = `
        <tr>
          <td colspan="7">
            Không tải được dữ liệu lịch học.
          </td>
        </tr>
      `;

      return;
    }


    const sessionRows =
      (sessions || [])
        .sort(
          (a,b) =>
            sessionTimestamp(a)
            -
            sessionTimestamp(b)
        );


    /* =====================================================
       SUMMARY
    ====================================================== */

    const currentRegistrationId =
      Number(
        currentRegistration.id
      );


    const currentSessions =
      sessionRows.filter(
        item =>
          Number(
            item.registration_id
          )
          ===
          currentRegistrationId
      );


    const used =
      currentSessions.filter(
        item => {

          const status =
            String(
              item.status || ""
            ).trim();

          return (
            status ===
              "Đã hoàn thành"
            ||
            status ===
              "Vắng"
          );

        }
      ).length;


    const total =
      Number(
        currentRegistration
          .purchased_sessions
        ||
        0
      );


    const remaining =
      Math.max(
        total - used,
        0
      );


    usedSessionsEl.textContent =
      String(used);

    totalSessionsEl.textContent =
      String(total);

    remainingSessionsEl.textContent =
      String(remaining);


    /* =====================================================
       TABLE
    ====================================================== */

    if (
      sessionRows.length === 0
    ) {

      sessionBody.innerHTML =
        "";

      emptyEl.style.display =
        "block";

      messageEl.textContent =
        "Bạn chưa có lịch học nào.";

      return;
    }


    emptyEl.style.display =
      "none";


    sessionBody.innerHTML =
      sessionRows
        .map(
          item => {

            const coach =
              item.coaches || {};

            const coachName =
              coach.full_name
              ||
              coach.coach_code
              ||
              "—";

            const status =
              String(
                item.status || "—"
              ).trim();

            return `
              <tr>

                <td>
                  <strong>
                    ${escapeHtml(
                      item.session_code
                      ||
                      `BH${item.id}`
                    )}
                  </strong>
                </td>

                <td>
                  ${escapeHtml(
                    item.session_no
                    ??
                    "—"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    formatDate(
                      item.session_date
                    )
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    formatTime(
                      item.start_time
                    )
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    coachName
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    item.court_name
                    ||
                    "Chưa chọn sân"
                  )}
                </td>

                <td>
                  <span
                    class="badge ${
                      statusClass(status)
                    }"
                  >
                    ${escapeHtml(
                      status
                    )}
                  </span>
                </td>

              </tr>
            `;

          }
        )
        .join("");


    messageEl.style.color =
      "rgba(255,255,255,.55)";

    messageEl.textContent =
      `✓ Đã tải ${sessionRows.length} buổi học.`;

  }


  /* =====================================================
     LOGOUT
  ====================================================== */

  logoutBtn.addEventListener(
    "click",
    async function () {

      await sb.auth
        .signOut();

      window.location.href =
        "./login.html";

    }
  );


  /* =====================================================
     START
  ====================================================== */

  await loadSessions();


  setInterval(
    loadSessions,
    60000
  );

})();

</script>


<script src="./notifications.js?v=20260911-3"></script>


</body>
</html>
