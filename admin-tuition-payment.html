<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>Thu học phí | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261019-keep30"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #userEmail {
      color: rgba(255,255,255,.75);
      font-size: 14px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 800;
    }

    .container {
      width: min(950px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 900;
    }

    .eyebrow {
      margin-top: 25px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(36px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.62);
      margin-bottom: 24px;
    }

    .card {
      padding: 22px;
      border-radius: 17px;
      background: rgba(6,39,88,.74);
      border: 1px solid rgba(255,255,255,.12);
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: rgba(255,255,255,.58);
      font-size: 13px;
      font-weight: 800;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: #09285a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 8px 0 22px;
    }

    .summary-item {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
    }

    .summary-label {
      color: rgba(255,255,255,.5);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 900;
    }

    .lime {
      color: #d8ff45;
    }

    .debt {
      color: #ffcf70;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #d8ff45;
      color: #172600;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .5;
      cursor: wait;
    }

    #message {
      margin-top: 14px;
      min-height: 22px;
      font-weight: 800;
    }

    .section-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      padding: 13px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
    }

    th {
      color: #d8ff45;
    }

    @media (max-width: 700px) {
      .form-grid,
      .summary {
        grid-template-columns: 1fr;
      }

      #userEmail {
        display: none;
      }
    }
  </style>
<!-- App PickDee Admin: thêm vào Màn hình chính → mở như app, không thanh trình duyệt -->
<link rel="manifest" href="/admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PD Admin">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>

<body>

<header class="topbar">

  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div class="top-actions">

    <div id="userEmail"></div>

    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      ĐĂNG XUẤT
    </button>

  </div>

</header>


<main class="container">

  <a
    href="./admin"
    class="back"
  >
    ← Khu vực Admin
  </a>

  <div class="eyebrow">
    QUẢN LÝ TÀI CHÍNH
  </div>

  <h1>Thu học phí</h1>

  <div class="sub">
    Ghi nhận tiền học viên đã thanh toán cho PickDee Academy.
  </div>


  <section class="card">

    <div class="form-grid">

      <div class="field">

        <label>
          Học viên
        </label>

        <select id="studentSelect">
          <option value="">
            -- Chọn học viên --
          </option>
        </select>

      </div>


      <div class="field">

        <label>
          Đăng ký / Gói học
        </label>

        <select
          id="registrationSelect"
          disabled
        >
          <option value="">
            -- Chọn đăng ký --
          </option>
        </select>

      </div>

    </div>


    <div class="summary">

      <div class="summary-item">

        <div class="summary-label">
          Học phí
        </div>

        <div
          id="tuitionValue"
          class="summary-value"
        >
          0đ
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          Đã thu
        </div>

        <div
          id="paidValue"
          class="summary-value lime"
        >
          0đ
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          Còn phải thu
        </div>

        <div
          id="remainingValue"
          class="summary-value debt"
        >
          0đ
        </div>

      </div>

    </div>


    <form id="paymentForm">

      <div class="form-grid">

        <div class="field">

          <label>
            Số tiền thu
          </label>

          <input
            id="amount"
            type="number"
            min="1000"
            step="1000"
            placeholder="Ví dụ: 2000000"
            required
          >

        </div>


        <div class="field">

          <label>
            Hình thức thanh toán
          </label>

          <select
            id="paymentMethod"
            required
          >
            <option value="Chuyển khoản">
              Chuyển khoản
            </option>

            <option value="Tiền mặt">
              Tiền mặt
            </option>

            <option value="Khác">
              Khác
            </option>
          </select>

        </div>

      </div>


      <div class="field">

        <label>
          Ghi chú
        </label>

        <textarea
          id="note"
          placeholder="Không bắt buộc"
        ></textarea>

      </div>


      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
      >
        ✓ XÁC NHẬN ĐÃ THU
      </button>


      <div id="message"></div>

    </form>

  </section>


  <section class="card">

    <div class="section-title">
      Lịch sử thu của đăng ký này
    </div>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Mã phiếu</th>
            <th>Ngày</th>
            <th>Số tiền</th>
            <th>Hình thức</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="historyBody">

          <tr>
            <td colspan="5">
              Chọn một đăng ký để xem.
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script>
(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const studentSelect =
    document.getElementById("studentSelect");

  const registrationSelect =
    document.getElementById("registrationSelect");

  const tuitionValue =
    document.getElementById("tuitionValue");

  const paidValue =
    document.getElementById("paidValue");

  const remainingValue =
    document.getElementById("remainingValue");

  const amountInput =
    document.getElementById("amount");

  const paymentMethod =
    document.getElementById("paymentMethod");

  const noteInput =
    document.getElementById("note");

  const paymentForm =
    document.getElementById("paymentForm");

  const submitBtn =
    document.getElementById("submitBtn");

  const messageEl =
    document.getElementById("message");

  const historyBody =
    document.getElementById("historyBody");

  const logoutBtn =
    document.getElementById("logoutBtn");


  let registrations = [];
  let currentPayments = [];
  let currentRemaining = 0;


  function money(value) {

    return (
      Number(value || 0)
        .toLocaleString("vi-VN") +
      "đ"
    );
  }


  function dateVN(value) {

    if (!value) {
      return "—";
    }

    const parts =
      String(value).split("-");

    if (parts.length === 3) {

      return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
      );
    }

    return value;
  }


  function showMessage(
    text,
    error = false
  ) {

    messageEl.textContent =
      text || "";

    messageEl.style.color =
      error
        ? "#ffaaaa"
        : "#d8ff45";
  }


  /* =====================================
     AUTH ADMIN
  ====================================== */

  const {
    data: { session }
  } =
    await sb.auth.getSession();


  if (!session) {

    location.replace(
      "./login.html"
    );

    return;
  }


  document.getElementById(
    "userEmail"
  ).textContent =
    session.user.email || "";


  const {
    data: profile,
    error: profileError
  } =
    await sb
      .from("profiles")
      .select("role")
      .eq(
        "id",
        session.user.id
      )
      .single();


  if (
    profileError ||
    !profile ||
    profile.role !== "admin"
  ) {

    location.replace(
      "./login.html"
    );

    return;
  }


  /* =====================================
     LOAD STUDENTS
  ====================================== */

  async function loadStudents() {

    const {
      data,
      error
    } =
      await sb
        .from("students")
        .select(`
          id,
          student_code,
          full_name,
          email,
          status
        `)
        .order(
          "full_name",
          { ascending: true }
        );


    if (error) {
      throw error;
    }


    studentSelect.innerHTML =
      `
        <option value="">
          -- Chọn học viên --
        </option>
      `;


    (data || []).forEach(
      student => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          student.id;


        option.textContent =
          `${
            student.full_name ||
            "Chưa có tên"
          } · ${
            student.student_code ||
            ""
          }`;


        studentSelect.appendChild(
          option
        );

      }
    );
  }


  /* =====================================
     LOAD REGISTRATIONS
  ====================================== */

  async function loadRegistrations(
    studentId
  ) {

    registrationSelect.disabled =
      true;


    registrationSelect.innerHTML =
      `
        <option value="">
          -- Chọn đăng ký --
        </option>
      `;


    resetPaymentContext();


    if (!studentId) {
      return;
    }


    const {
      data,
      error
    } =
      await sb
  .from("registrations")
  .select(`
    id,
    registration_code,
    student_id,
    package_name,
    tuition_fee,
    status,
    created_at
  `)
  .eq(
    "student_id",
    Number(studentId)
  )
  .eq(
    "is_test",
    false
  )
        .order(
          "created_at",
          { ascending: false }
        );


    if (error) {
      throw error;
    }


    registrations =
      data || [];


    registrations.forEach(
      row => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          row.id;


        option.textContent =
          `${
            row.registration_code ||
            "—"
          } · ${
            row.package_name ||
            "Chưa có gói"
          } · ${
            money(
              row.tuition_fee
            )
          }`;


        registrationSelect.appendChild(
          option
        );

      }
    );


    registrationSelect.disabled =
      false;
  }


  /* =====================================
     PAYMENT CONTEXT
  ====================================== */

  function resetPaymentContext() {

    tuitionValue.textContent =
      "0đ";

    paidValue.textContent =
      "0đ";

    remainingValue.textContent =
      "0đ";

    currentRemaining =
      0;

    amountInput.value =
      "";

    amountInput.max =
      "";

    historyBody.innerHTML =
      `
        <tr>
          <td colspan="5">
            Chọn một đăng ký để xem.
          </td>
        </tr>
      `;
  }


  async function loadPaymentContext(
    registrationId
  ) {

    resetPaymentContext();


    if (!registrationId) {
      return;
    }


    const registration =
      registrations.find(
        row =>
          Number(row.id) ===
          Number(registrationId)
      );


    if (!registration) {
      return;
    }


    const {
      data,
      error
    } =
      await sb
        .from("tuition_payments")
        .select(`
          id,
          payment_code,
          registration_id,
          amount,
          payment_date,
          payment_method,
          status,
          note
        `)
        .eq(
          "registration_id",
          Number(registrationId)
        )
        .order(
          "payment_date",
          { ascending: false }
        )
        .order(
          "id",
          { ascending: false }
        );


    if (error) {
      throw error;
    }


    currentPayments =
      data || [];


    const tuition =
      Number(
        registration.tuition_fee || 0
      );


    const paid =
      currentPayments
        .filter(
          row =>
            row.status === "Đã thu"
        )
        .reduce(
          (sum, row) =>
            sum +
            Number(row.amount || 0),
          0
        );


    currentRemaining =
      Math.max(
        tuition - paid,
        0
      );


    tuitionValue.textContent =
      money(tuition);


    paidValue.textContent =
      money(paid);


    remainingValue.textContent =
      money(currentRemaining);


    amountInput.max =
      currentRemaining;


    if (currentRemaining <= 0) {

      amountInput.disabled =
        true;

      submitBtn.disabled =
        true;

      showMessage(
        "✓ Gói học này đã thanh toán đủ."
      );

    } else {

      amountInput.disabled =
        false;

      submitBtn.disabled =
        false;

      showMessage("");
    }


    renderHistory();
  }


  /* =====================================
     HISTORY
  ====================================== */

  function renderHistory() {

    if (
      currentPayments.length === 0
    ) {

      historyBody.innerHTML =
        `
          <tr>
            <td colspan="5">
              Chưa có phiếu thu nào.
            </td>
          </tr>
        `;

      return;
    }


    historyBody.innerHTML =
      currentPayments
        .map(
          row => `

            <tr>

              <td>
                ${row.payment_code || "—"}
              </td>

              <td>
                ${dateVN(row.payment_date)}
              </td>

              <td>
                <strong>
                  ${money(row.amount)}
                </strong>
              </td>

              <td>
                ${row.payment_method || "—"}
              </td>

              <td>
                ${row.status || "—"}
              </td>

            </tr>

          `
        )
        .join("");
  }


  /* =====================================
     EVENTS
  ====================================== */

  studentSelect.addEventListener(
    "change",
    async function () {

      try {

        await loadRegistrations(
          studentSelect.value
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Không tải được đăng ký.",
          true
        );
      }

    }
  );


  registrationSelect.addEventListener(
    "change",
    async function () {

      try {

        await loadPaymentContext(
          registrationSelect.value
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Không tải được học phí.",
          true
        );
      }

    }
  );


  paymentForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      const registrationId =
        Number(
          registrationSelect.value
        );


      const amount =
        Number(
          amountInput.value
        );


      if (!registrationId) {

        showMessage(
          "Vui lòng chọn đăng ký học.",
          true
        );

        return;
      }


      if (
        !amount ||
        amount <= 0
      ) {

        showMessage(
          "Vui lòng nhập số tiền thu.",
          true
        );

        return;
      }


      if (
        amount >
        currentRemaining
      ) {

        showMessage(
          "Số tiền thu không được vượt số còn phải thu.",
          true
        );

        return;
      }


      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "ĐANG GHI NHẬN...";


      showMessage(
        "Đang ghi nhận học phí..."
      );


      const {
        data,
        error
      } =
        await sb.rpc(
          "admin_create_tuition_payment",
          {
            p_registration_id:
              registrationId,

            p_amount:
              amount,

            p_payment_method:
              paymentMethod.value,

            p_note:
              noteInput.value.trim() ||
              null
          }
        );


      if (error) {

        console.error(error);

        showMessage(
          "Không ghi nhận được: " +
          error.message,
          true
        );

        submitBtn.disabled =
          false;

        submitBtn.textContent =
          "✓ XÁC NHẬN ĐÃ THU";

        return;
      }


      amountInput.value =
        "";

      noteInput.value =
        "";


      await loadPaymentContext(
        registrationId
      );


      showMessage(
        "✓ Đã ghi nhận học phí thành công."
      );


      submitBtn.textContent =
        "✓ XÁC NHẬN ĐÃ THU";


      if (currentRemaining > 0) {

        submitBtn.disabled =
          false;
      }

    }
  );


  /* =====================================
     LOGOUT
  ====================================== */

  logoutBtn.addEventListener(
    "click",
    async function () {

      await sb.auth.signOut();

      location.replace(
        "./login.html"
      );
    }
  );


  /* =====================================
     START
  ====================================== */

  try {

    await loadStudents();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Không tải được dữ liệu: " +
      error.message,
      true
    );
  }

})();
</script>
<script>
(async function () {

  /* =====================================================
     PICKDEE - ADMIN PAYMENT SUBMISSIONS
     Không thay đổi luồng thu học phí thủ công hiện tại
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};

  const paymentSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     STYLE
  ====================================================== */

  const style =
    document.createElement("style");

  style.textContent = `

      margin-top: 22px;
      border: 1px solid rgba(216,255,69,.22);

    .proof-empty {
      padding: 24px 12px;
      text-align: center;
      color: rgba(255,255,255,.6);

      margin-top: 12px;

    }

    .proof-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    .proof-code {
      color: #d8ff45;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .proof-student {
      font-size: 18px;
      font-weight: 900;
    }

    .proof-time {
      color: rgba(255,255,255,.52);
      font-size: 12px;
      text-align: right;
    }

    .proof-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));
      gap: 10px 18px;
      margin-top: 12px;
    }

    .proof-info-label {
      color: rgba(255,255,255,.48);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .proof-info-value {
      font-size: 14px;
      font-weight: 800;
      word-break: break-word;
    }

    .proof-amount {
      color: #d8ff45;
      font-size: 18px;
      font-weight: 900;
    }

    .proof-transfer {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.18);
      border: 1px dashed rgba(255,255,255,.18);
    }

    .proof-actions {
      display: grid;
      grid-template-columns:
        1fr 1fr 1fr;
      gap: 9px;
      margin-top: 15px;
    }

    .proof-btn {
      min-height: 42px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 12px;
    }

    .proof-btn-view {
      background: rgba(255,255,255,.11);
      color: white;
      border: 1px solid rgba(255,255,255,.18);
    }

    .proof-btn-confirm {
      background: #d8ff45;
      color: #132300;
    }

    .proof-btn-reject {
      background: rgba(255,103,103,.14);
      color: #ffaaaa;
      border: 1px solid rgba(255,103,103,.28);
    }

    .proof-btn:disabled {
      opacity: .45;
      cursor: wait;
    }

    .proof-admin-message {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .proof-admin-message.show {
      display: block;
    }

    .proof-admin-message.success {
      color: #eaffb2;
      background: rgba(216,255,69,.10);
      border: 1px solid rgba(216,255,69,.25);
    }

    .proof-admin-message.error {
      color: #ffc0c0;
      background: rgba(255,110,110,.10);
      border: 1px solid rgba(255,110,110,.28);
    }

    @media (max-width: 700px) {

      .proof-grid {
        grid-template-columns: 1fr;
      }

      .proof-actions {
        grid-template-columns: 1fr;
      }

      .proof-item-top {
        flex-direction: column;
      }

      .proof-time {
        text-align: left;
      }

    }

  `;

  document.head.appendChild(
    style
  );


  /* =====================================================
     TẠO KHU VỰC BILL
  ====================================================== */

  const section =
    document.createElement(
      "section"
    );

  section.className =
    "card proof-admin-card";

  section.innerHTML = `

    <div class="proof-admin-head">

      <div>

        <div class="proof-admin-title">
          🧾 Bill chờ xác nhận
        </div>

        <div class="proof-admin-sub">
          Học viên đã chuyển khoản và gửi bill.
          Chỉ khi Admin xác nhận thì hệ thống
          mới ghi nhận học phí là Đã thu.
        </div>

      </div>

      <div
        id="proofPendingCount"
        class="proof-count"
      >
        0
      </div>

    </div>

    <div
      id="proofAdminMessage"
      class="proof-admin-message"
    ></div>

    <div id="proofAdminList">

      <div class="proof-loading">
        Đang tải bill chờ xác nhận...
      </div>

    </div>

  `;


  const main =
    document.querySelector(
      "main.container"
    );

  const firstCard =
    main?.querySelector(
      "section.card"
    );


  if (
    main &&
    firstCard
  ) {

    main.insertBefore(
      section,
      firstCard
    );

  }
  else if (main) {

    main.appendChild(
      section
    );

  }


  const listEl =
    document.getElementById(
      "proofAdminList"
    );

  const countEl =
    document.getElementById(
      "proofPendingCount"
    );

  const proofMessage =
    document.getElementById(
      "proofAdminMessage"
    );


  let pendingRows =
    [];


  /* =====================================================
     HELPERS
  ====================================================== */

  /* Ngày/khung giờ/sân HV chọn khi đăng ký (student-register) → 1 dòng cho Admin */

  const STUDY_DAY_LABEL = { 1: "T2", 2: "T3", 3: "T4", 4: "T5", 5: "T6", 6: "T7", 7: "CN" };

  const STUDY_SLOT_LABEL = { sang: "Sáng", chieu: "Chiều", toi: "Tối" };

  async function attachStudyCourts(rows) {

    const ids = [...new Set(rows.map(r => r.preferred_court_id).filter(Boolean))];

    if (!ids.length) return;

    const { data } = await paymentSb.from("court_directory").select("id, court_name, ward, province").in("id", ids);

    const map = new Map((data || []).map(c => [Number(c.id), c]));

    rows.forEach(r => { r._court = map.get(Number(r.preferred_court_id)) || null; });

  }

  function studyScheduleText(r) {

    if (!r) return "—";

    const days = (r.study_days || []).slice().sort((a, b) => a - b).map(d => STUDY_DAY_LABEL[d] || d).join(", ");

    const slots = (r.study_slots || []).slice().sort((a, b) => Object.keys(STUDY_SLOT_LABEL).indexOf(a) - Object.keys(STUDY_SLOT_LABEL).indexOf(b)).map(v => STUDY_SLOT_LABEL[v] || v).join(", ");

    const court = r._court ? [r._court.court_name, r._court.ward, r._court.province].filter(Boolean).join(" – ") : (r.preferred_court_id ? "Sân #" + r.preferred_court_id : "");

    const parts = [days, slots, court].filter(Boolean);

    return parts.length ? parts.join(" · ") : "Chưa chọn (đăng ký cũ)";

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function money(value) {

    return (
      Number(value || 0)
        .toLocaleString(
          "vi-VN"
        )
      +
      "đ"
    );

  }


  function dateTimeVN(value) {

    if (!value) {
      return "—";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return String(value);

    }


    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(
      date
    );

  }


  function showProofMessage(
    text,
    type = "success"
  ) {

    proofMessage.textContent =
      text || "";

    proofMessage.className =
      `proof-admin-message show ${type}`;

  }


  function hideProofMessage() {

    proofMessage.textContent =
      "";

    proofMessage.className =
      "proof-admin-message";

  }


  /* =====================================================
     KIỂM TRA ADMIN
  ====================================================== */

  async function ensureAdmin() {

    const {
      data,
      error
    } =
      await paymentSb.auth.getSession();


    if (
      error
      ||
      !data?.session
    ) {

      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await paymentSb
        .from(
          "profiles"
        )
        .select(
          "role"
        )
        .eq(
          "id",
          data.session.user.id
        )
        .maybeSingle();


    if (
      profileError
      ||
      profile?.role !==
        "admin"
    ) {

      return false;

    }


    return true;

  }


  /* =====================================================
     LOAD BILL CHỜ XÁC NHẬN
  ====================================================== */

  async function loadPendingProofs() {

    hideProofMessage();


    listEl.innerHTML =
      `
        <div class="proof-loading">
          Đang tải bill chờ xác nhận...
        </div>
      `;


    const {
      data: submissions,
      error: submissionError
    } =
      await paymentSb
        .from(
          "payment_submissions"
        )
        .select(`
          id,
          submission_code,
          registration_id,
          student_id,
          amount,
          proof_path,
          transfer_content,
          status,
          policy_version,
          policy_accepted_at,
          submitted_at,
          auto_check
        `)
        .eq(
          "status",
          "Chờ xác nhận"
        )
        .order(
          "submitted_at",
          {
            ascending: true
          }
        );


    if (submissionError) {

      console.error(
        submissionError
      );

      countEl.textContent =
        "—";

      listEl.innerHTML =
        `
          <div class="proof-empty">
            Không tải được bill chờ xác nhận.
          </div>
        `;

      showProofMessage(
        submissionError.message
        ||
        "Không tải được dữ liệu bill.",
        "error"
      );

      return;

    }


    const rawRows =
      Array.isArray(
        submissions
      )
        ? submissions
        : [];


    if (
      rawRows.length === 0
    ) {

      pendingRows = [];

      countEl.textContent =
        "0";

      listEl.innerHTML =
        `
          <div class="proof-empty">
            ✅ Hiện không có bill nào
            đang chờ xác nhận.
          </div>
        `;

      return;

    }


    const registrationIds =
      [
        ...new Set(
          rawRows.map(
            row =>
              Number(
                row.registration_id
              )
          )
        )
      ];


    const studentIds =
      [
        ...new Set(
          rawRows.map(
            row =>
              Number(
                row.student_id
              )
          )
        )
      ];


    /*
      Lấy đăng ký REAL.
      TEST tuyệt đối không xuất hiện ở đây.
    */

    const {
      data: registrations,
      error: registrationError
    } =
      await paymentSb
        .from(
          "registrations"
        )
        .select(`
          id,
          registration_code,
          package_name,
          student_id,
          tuition_fee,
          is_test,
          study_days,
          study_slots,
          preferred_court_id
        `)
        .in(
          "id",
          registrationIds
        )
        .eq(
          "is_test",
          false
        );


    if (registrationError) {

      console.error(
        registrationError
      );

      throw registrationError;

    }


    const {
      data: students,
      error: studentError
    } =
      await paymentSb
        .from(
          "students"
        )
        .select(`
          id,
          student_code,
          full_name,
          email
        `)
        .in(
          "id",
          studentIds
        );


    if (studentError) {

      console.error(
        studentError
      );

      throw studentError;

    }


    const registrationMap =
      new Map(
        (registrations || []).map(
          row => [
            Number(row.id),
            row
          ]
        )
      );


    // Tên sân HV chọn khi đăng ký (registrations.preferred_court_id → court_directory)
    await attachStudyCourts(registrations || []);


    const studentMap =
      new Map(
        (students || []).map(
          row => [
            Number(row.id),
            row
          ]
        )
      );


    /*
      Chỉ giữ submission có đăng ký REAL.
    */

    pendingRows =
      rawRows
        .filter(
          row =>
            registrationMap.has(
              Number(
                row.registration_id
              )
            )
        )
        .map(
          row => ({
            ...row,

            registration:
              registrationMap.get(
                Number(
                  row.registration_id
                )
              ),

            student:
              studentMap.get(
                Number(
                  row.student_id
                )
              )
          })
        );


    countEl.textContent =
      String(
        pendingRows.length
      );


    if (
      pendingRows.length === 0
    ) {

      listEl.innerHTML =
        `
          <div class="proof-empty">
            ✅ Không có bill REAL nào
            đang chờ xác nhận.
          </div>
        `;

      return;

    }


    /*
      Tạo link tạm cho bill trong bucket PRIVATE.
      Link tự hết hạn sau 60 phút.
    */

    await Promise.all(

      pendingRows.map(
        async row => {

          try {

            const {
              data,
              error
            } =
              await paymentSb.storage
                .from(
                  "payment-proofs"
                )
                .createSignedUrl(
                  row.proof_path,
                  3600
                );


            row.proof_url =
              error
                ? null
                : data?.signedUrl
                  || null;

          }
          catch (error) {

            console.warn(
              "Signed URL error:",
              error
            );

            row.proof_url =
              null;

          }

        }
      )

    );


    renderPendingProofs();

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function renderPendingProofs() {

    listEl.innerHTML =
      pendingRows
        .map(
          row => {

            const student =
              row.student
              || {};

            const registration =
              row.registration
              || {};


            const proofButton =
              row.proof_url

                ? `
                    <button
                      type="button"
                      class="proof-btn proof-btn-view"
                      data-proof-view="${row.id}"
                    >
                      👁 XEM BILL
                    </button>
                  `

                : `
                    <button
                      type="button"
                      class="proof-btn proof-btn-view"
                      disabled
                    >
                      KHÔNG MỞ ĐƯỢC BILL
                    </button>
                  `;


            return `

              <div
                class="proof-item"
                data-proof-item="${row.id}"
              >

                <div class="proof-item-top">

                  <div>

                    <div class="proof-code">
                      ${escapeHtml(
                        row.submission_code
                        || "—"
                      )}
                    </div>

                    <div class="proof-student">
                      ${escapeHtml(
                        student.full_name
                        || "Học viên"
                      )}
                    </div>

                  </div>

                  <div class="proof-time">
                    Gửi lúc<br>
                    ${escapeHtml(
                      dateTimeVN(
                        row.submitted_at
                      )
                    )}
                  </div>

                </div>


                <div class="proof-grid">

                  <div>

                    <div class="proof-info-label">
                      Mã học viên
                    </div>

                    <div class="proof-info-value">
                      ${escapeHtml(
                        student.student_code
                        || "—"
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="proof-info-label">
                      Đăng ký
                    </div>

                    <div class="proof-info-value">
                      ${escapeHtml(
                        registration.registration_code
                        || "—"
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="proof-info-label">
                      Gói học
                    </div>

                    <div class="proof-info-value">
                      ${escapeHtml(
                        registration.package_name
                        || "—"
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="proof-info-label">
                      Lịch học HV chọn
                    </div>

                    <div class="proof-info-value">
                      ${escapeHtml(
                        studyScheduleText(registration)
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="proof-info-label">
                      Số tiền học viên khai đã chuyển
                    </div>

                    <div class="proof-amount">
                      ${money(
                        row.amount
                      )}
                    </div>

                  </div>

                </div>


                <div class="proof-transfer">

                  <div class="proof-info-label">
                    Nội dung chuyển khoản
                  </div>

                  <div class="proof-info-value">
                    ${escapeHtml(
                      row.transfer_content
                      || "—"
                    )}
                  </div>

                </div>


                ${(row.auto_check?.failed || []).length ? `
                <div class="proof-transfer" style="background:#fff4e5;border:1px solid #f5b971;border-radius:10px;padding:10px">
                  <div class="proof-info-label" style="color:#b45309">
                    ⚠️ Chưa tự xác nhận vì
                  </div>
                  <div class="proof-info-value" style="color:#7c2d12">
                    ${escapeHtml(row.auto_check.failed.join(" · "))}
                  </div>
                </div>` : ""}


                <div class="proof-actions">

                  ${proofButton}

                  <button
                    type="button"
                    class="proof-btn proof-btn-confirm"
                    data-proof-confirm="${row.id}"
                  >
                    ✓ XÁC NHẬN
                  </button>

                  <button
                    type="button"
                    class="proof-btn proof-btn-reject"
                    data-proof-reject="${row.id}"
                  >
                    ✕ TỪ CHỐI
                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("");

  }


  /* =====================================================
     EVENTS
  ====================================================== */

  listEl.addEventListener(
    "click",
    async function (event) {

      const viewButton =
        event.target.closest(
          "[data-proof-view]"
        );


      if (viewButton) {

        const id =
          Number(
            viewButton.dataset
              .proofView
          );


        const row =
          pendingRows.find(
            item =>
              Number(item.id)
              === id
          );


        if (
          row?.proof_url
        ) {

          window.open(
            row.proof_url,
            "_blank",
            "noopener"
          );

        }


        return;

      }


      const confirmButton =
        event.target.closest(
          "[data-proof-confirm]"
        );


      if (confirmButton) {

        const id =
          Number(
            confirmButton.dataset
              .proofConfirm
          );


        const row =
          pendingRows.find(
            item =>
              Number(item.id)
              === id
          );


        if (!row) {
          return;
        }


        const ok =
          window.confirm(
            "Xác nhận đã nhận đúng "
            +
            money(row.amount)
            +
            " từ học viên "
            +
            (
              row.student
                ?.full_name
              ||
              ""
            )
            +
            "?\n\n"
            +
            "Sau khi xác nhận, hệ thống sẽ tạo phiếu thu Đã thu."
          );


        if (!ok) {
          return;
        }


        await reviewProof(
          id,
          "confirm",
          null,
          confirmButton
        );


        return;

      }


      const rejectButton =
        event.target.closest(
          "[data-proof-reject]"
        );


      if (rejectButton) {

        const id =
          Number(
            rejectButton.dataset
              .proofReject
          );


        const reason =
          window.prompt(
            "Nhập lý do từ chối bill:"
          );


        if (
          reason === null
        ) {
          return;
        }


        if (
          !reason.trim()
        ) {

          showProofMessage(
            "Vui lòng nhập lý do từ chối.",
            "error"
          );

          return;

        }


        await reviewProof(
          id,
          "reject",
          reason.trim(),
          rejectButton
        );

      }

    }
  );


  /* =====================================================
     XÁC NHẬN / TỪ CHỐI
  ====================================================== */

  async function reviewProof(
    submissionId,
    action,
    note,
    button
  ) {

    hideProofMessage();


    const oldText =
      button.textContent;


    button.disabled =
      true;

    button.textContent =
      action === "confirm"
        ? "ĐANG XÁC NHẬN..."
        : "ĐANG TỪ CHỐI...";


    try {

      const {
        error
      } =
        await paymentSb.rpc(
          "admin_review_payment_submission",
          {
            p_submission_id:
              Number(
                submissionId
              ),

            p_action:
              action,

            p_admin_note:
              note
              || null
          }
        );


      if (error) {

        throw error;

      }


      if (
        action ===
        "confirm"
      ) {

        showProofMessage(
          "✓ Đã xác nhận thanh toán. Phiếu thu Đã thu đã được tạo.",
          "success"
        );

      }
      else {

        showProofMessage(
          "✓ Đã từ chối bill. Học viên có thể gửi lại bill mới.",
          "success"
        );

      }


      await loadPendingProofs();


      /*
        Nếu Admin đang mở đúng đăng ký
        vừa được xác nhận ở form bên dưới,
        refresh lại số đã thu / còn phải thu.
      */

      const registrationSelect =
        document.getElementById(
          "registrationSelect"
        );


      if (
        registrationSelect
        &&
        registrationSelect.value
      ) {

        registrationSelect.dispatchEvent(
          new Event(
            "change"
          )
        );

      }

    }
    catch (error) {

      console.error(
        error
      );


      showProofMessage(
        error?.message
        ||
        "Không xử lý được bill.",
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        oldText;

    }

  }


  /* =====================================================
     START
  ====================================================== */

  try {

    const isAdmin =
      await ensureAdmin();


    if (!isAdmin) {

      section.style.display =
        "none";

      return;

    }


    await loadPendingProofs();

  }
  catch (error) {

    console.error(
      error
    );


    countEl.textContent =
      "—";


    listEl.innerHTML =
      `
        <div class="proof-empty">
          Không tải được dữ liệu bill.
        </div>
      `;


    showProofMessage(
      error?.message
      ||
      "Không tải được bill chờ xác nhận.",
      "error"
    );

  }

})();
</script>
