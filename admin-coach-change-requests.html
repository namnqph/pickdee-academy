<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <meta
    name="theme-color"
    content="#101010"
  >

  <title>
    Yêu cầu đổi Coach | PickDee Admin
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        linear-gradient(
          145deg,
          #0f0f0f,
          #202020
        );

    }


    .topbar {

      min-height: 70px;

      padding:
        0 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      border-bottom:
        1px solid rgba(255,255,255,.1);

      background:
        rgba(12,12,12,.95);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color:
        #ffc934;

    }


    .back {

      color:
        #ffc934;

      font-size: 13px;

      font-weight: 900;

      text-decoration: none;

    }


    .container {

      width:
        min(1050px, calc(100% - 28px));

      margin:
        0 auto;

      padding:
        38px 0 70px;

    }


    .eyebrow {

      color:
        #ffc934;

      font-size:
        12px;

      font-weight: 900;

      letter-spacing:
        .08em;

    }


    h1 {

      margin:
        8px 0 8px;

      font-size:
        clamp(34px, 6vw, 54px);

      line-height:
        1;

    }


    .lead {

      margin:
        0 0 25px;

      color:
        rgba(255,255,255,.62);

      line-height:
        1.6;

    }


    .summary {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        12px;

      margin-bottom:
        18px;

    }


    .summary-card {

      padding:
        16px;

      border-radius:
        14px;

      border:
        1px solid rgba(255,255,255,.11);

      background:
        rgba(30,30,30,.78);

    }


    .summary-label {

      color:
        rgba(255,255,255,.52);

      font-size:
        12px;

    }


    .summary-value {

      margin-top:
        6px;

      color:
        #ffc934;

      font-size:
        25px;

      font-weight:
        900;

    }


    .toolbar {

      display:
        flex;

      gap:
        10px;

      margin-bottom:
        18px;

    }


    .toolbar select,
    .refresh {

      min-height:
        44px;

      padding:
        0 13px;

      border-radius:
        10px;

      border:
        1px solid rgba(255,255,255,.13);

      background:
        #1b1b1b;

      color:
        white;

      font:
        inherit;

    }


    .refresh {

      cursor: pointer;

      color:
        #ffc934;

      font-weight:
        900;

    }


    .list {

      display:
        grid;

      gap:
        15px;

    }


    .card {

      padding:
        20px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius:
        17px;

      background:
        rgba(28,28,28,.88);

    }


    .card.pending {

      border-color:
        rgba(255,185,60,.45);

    }


    .card.approved {

      border-color:
        rgba(255,201,52,.38);

    }


    .card.rejected {

      border-color:
        rgba(255,100,100,.32);

    }


    .card-head {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        15px;

      align-items:
        flex-start;

      margin-bottom:
        16px;

    }


    .student {

      color:
        #ffc934;

      font-size:
        21px;

      font-weight:
        900;

    }


    .code {

      margin-top:
        4px;

      color:
        rgba(255,255,255,.44);

      font-size:
        12px;

    }


    .status {

      padding:
        7px 10px;

      border-radius:
        999px;

      font-size:
        11px;

      font-weight:
        900;

      white-space:
        nowrap;

    }


    .status.pending {

      color:
        #141414;

      background:
        #ffbd55;

    }


    .status.approved {

      color:
        #142000;

      background:
        #ffc934;

    }


    .status.rejected {

      color:
        white;

      background:
        #b23c4c;

    }


    .coach-grid {

      display:
        grid;

      grid-template-columns:
        1fr auto 1fr;

      gap:
        12px;

      align-items:
        stretch;

    }


    .coach-box {

      padding:
        15px;

      border:
        1px solid rgba(255,255,255,.1);

      border-radius:
        13px;

      background:
        rgba(0,0,0,.12);

    }


    .coach-label {

      margin-bottom:
        6px;

      color:
        rgba(255,255,255,.48);

      font-size:
        11px;

      font-weight:
        900;

    }


    .coach-name {

      font-size:
        17px;

      font-weight:
        900;

    }


    .coach-meta {

      margin-top:
        5px;

      color:
        rgba(255,255,255,.52);

      font-size:
        12px;

      line-height:
        1.5;

    }


    .arrow {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      color:
        #ffc934;

      font-size:
        25px;

      font-weight:
        900;

    }


    .detail {

      margin-top:
        13px;

      padding:
        13px;

      border-radius:
        11px;

      background:
        rgba(255,255,255,.04);

      color:
        rgba(255,255,255,.72);

      font-size:
        13px;

      line-height:
        1.55;

    }


    .detail strong {

      color:
        white;

    }


    .admin-note {

      width:
        100%;

      min-height:
        72px;

      margin-top:
        13px;

      padding:
        11px;

      border:
        1px solid rgba(255,255,255,.13);

      border-radius:
        10px;

      outline:
        none;

      background:
        #141414;

      color:
        white;

      font:
        inherit;

      resize:
        vertical;

    }


    .actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        9px;

      margin-top:
        10px;

    }


    .btn {

      min-height:
        47px;

      border: 0;

      border-radius:
        10px;

      cursor:
        pointer;

      font-weight:
        900;

    }


    .approve {

      background:
        #ffc934;

      color:
        #102000;

    }


    .reject {

      background:
        rgba(255,90,90,.15);

      border:
        1px solid rgba(255,90,90,.35);

      color:
        #ffb2b2;

    }


    .btn:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    .empty,
    .loading,
    .error {

      padding:
        30px;

      text-align:
        center;

      border-radius:
        15px;

      background:
        rgba(255,255,255,.04);

      color:
        rgba(255,255,255,.6);

    }


    .error {

      color:
        #ffb1b1;

    }


    @media(max-width:700px) {

      .summary {

        grid-template-columns:
          1fr;

      }


      .coach-grid {

        grid-template-columns:
          1fr;

      }


      .arrow {

        transform:
          rotate(90deg);

      }


      .actions {

        grid-template-columns:
          1fr;

      }


      .topbar {

        padding:
          0 15px;

      }

    }

  </style>

  <section class="summary">

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js?v=20261019-keep30"></script>



<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const list =
    document.getElementById("list");

  const pendingCount =
    document.getElementById("pendingCount");

  const approvedCount =
    document.getElementById("approvedCount");

  const rejectedCount =
    document.getElementById("rejectedCount");

  const statusFilter =
    document.getElementById("statusFilter");

  const refreshBtn =
    document.getElementById("refreshBtn");

  let rows = [];


  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    list.innerHTML =
      '<div class="error">Không tải được hệ thống.</div>';

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function statusText(value) {

    if (value === "pending") {
      return "Chờ duyệt";
    }

    if (value === "approved") {
      return "Đã duyệt";
    }

    if (value === "rejected") {
      return "Từ chối";
    }

    return value || "—";

  }


  function formatDate(value) {

    if (!value) {
      return "—";
    }

    try {

      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      ).format(
        new Date(value)
      );

    }
    catch {

      return value;

    }

  }


  function formatSessionDate(value) {

    if (!value) {
      return "—";
    }

    try {

      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      ).format(
        new Date(`${value}T00:00:00`)
      );

    }
    catch {

      return value;

    }

  }


  function formatTime(value) {

    if (!value) {
      return "—";
    }

    return String(value)
      .slice(0, 5);

  }


  /* =====================================================
     SUMMARY
  ====================================================== */

  function updateSummary() {

    pendingCount.textContent =
      rows.filter(
        item =>
          item.status === "pending"
      ).length;


    approvedCount.textContent =
      rows.filter(
        item =>
          item.status === "approved"
      ).length;


    rejectedCount.textContent =
      rows.filter(
        item =>
          item.status === "rejected"
      ).length;

  }


  /* =====================================================
     KIỂM TRA CÁC LỊCH ĐANG CHẶN ĐỔI COACH

     Fail closed:
     Nếu không kiểm tra được lịch,
     giao diện cũng không mở nút DUYỆT.
  ====================================================== */

  async function attachBlockingWork(items) {

    const pendingRegistrationIds =
      [
        ...new Set(
          items

            .filter(
              item =>
                item.status === "pending"
                &&
                item.registration_id
            )

            .map(
              item =>
                Number(item.registration_id)
            )

            .filter(
              id =>
                Number.isFinite(id)
                &&
                id > 0
            )
        )
      ];


    items.forEach(
      item => {

        item.blocking_sessions = [];
        item.blocking_requests = [];
        item.blocker_check_error = false;

      }
    );


    if (!pendingRegistrationIds.length) {
      return;
    }


    /* ===================================================
       BUỔI HỌC CHỜ HỌC
    ==================================================== */

    const {
      data: openSessions,
      error: sessionError
    } =
      await sb
        .from("class_sessions")
        .select(`
          id,
          session_code,
          registration_id,
          session_no,
          session_date,
          start_time,
          duration_minutes,
          court_name,
          coach_id,
          status
        `)
        .in(
          "registration_id",
          pendingRegistrationIds
        )
        .eq(
          "status",
          "Chờ học"
        )
        .order(
          "session_date",
          {
            ascending: true
          }
        )
        .order(
          "start_time",
          {
            ascending: true
          }
        );


    if (sessionError) {

      console.error(
        "COACH CHANGE SESSION GATE:",
        sessionError
      );

      items.forEach(
        item => {

          if (
            item.status === "pending"
            &&
            item.registration_id
          ) {

            item.blocker_check_error =
              true;

          }

        }
      );

    }
    else {

      (openSessions || [])
        .forEach(
          session => {

            const item =
              items.find(
                row =>
                  Number(row.registration_id)
                  ===
                  Number(session.registration_id)
              );


            if (item) {

              item.blocking_sessions.push(
                session
              );

            }

          }
        );

    }


    /* ===================================================
       YÊU CẦU LỊCH CHỜ COACH
    ==================================================== */

    const {
      data: openRequests,
      error: requestError
    } =
      await sb
        .from("session_requests")
        .select(`
          id,
          request_code,
          registration_id,
          status,
          created_at
        `)
        .in(
          "registration_id",
          pendingRegistrationIds
        )
        .eq(
          "status",
          "Chờ Coach"
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (requestError) {

      console.error(
        "COACH CHANGE REQUEST GATE:",
        requestError
      );

      items.forEach(
        item => {

          if (
            item.status === "pending"
            &&
            item.registration_id
          ) {

            item.blocker_check_error =
              true;

          }

        }
      );

    }
    else {

      (openRequests || [])
        .forEach(
          request => {

            const item =
              items.find(
                row =>
                  Number(row.registration_id)
                  ===
                  Number(request.registration_id)
              );


            if (item) {

              item.blocking_requests.push(
                request
              );

            }

          }
        );

    }

  }


  /* =====================================================
     WARNING BLOCK
  ====================================================== */

  function blockerHtml(item) {

    if (
      item.status !== "pending"
    ) {

      return "";

    }


    if (
      item.blocker_check_error
    ) {

      return `
        <div
          style="
            margin-top:14px;
            padding:14px;
            border-radius:12px;
            border:1px solid rgba(255,100,100,.38);
            background:rgba(255,70,70,.10);
            color:#ffb5b5;
            line-height:1.55;
            font-weight:800;
          "
        >
          ⚠️ KHÔNG XÁC MINH ĐƯỢC LỊCH CHƯA XỬ LÝ
          <div
            style="
              margin-top:5px;
              color:rgba(255,255,255,.72);
              font-size:13px;
              font-weight:600;
            "
          >
            Hệ thống tạm khóa DUYỆT ĐỔI COACH để đảm bảo an toàn.
            Hãy bấm CẬP NHẬT hoặc kiểm tra lại dữ liệu lịch học.
          </div>
        </div>
      `;

    }


    const sessions =
      item.blocking_sessions || [];

    const requests =
      item.blocking_requests || [];


    if (
      !sessions.length
      &&
      !requests.length
    ) {

      return `
        <div
          style="
            margin-top:14px;
            padding:13px;
            border-radius:12px;
            border:1px solid rgba(255,201,52,.25);
            background:rgba(255,201,52,.06);
            color:#ffc934;
            font-size:13px;
            font-weight:800;
          "
        >
          ✓ Không còn lịch Chờ học hoặc yêu cầu Chờ Coach.
          Yêu cầu này đủ điều kiện để Admin xem xét đổi Coach.
        </div>
      `;

    }


    const sessionLines =
      sessions
        .map(
          session => {

            return `
              <div
                style="
                  margin-top:8px;
                  padding:10px 12px;
                  border-radius:9px;
                  background:rgba(0,0,0,.14);
                  color:white;
                "
              >
                <strong>
                  ${escapeHtml(
                    session.session_code
                    ||
                    `Buổi ${session.id}`
                  )}
                </strong>

                · ${escapeHtml(
                  formatSessionDate(
                    session.session_date
                  )
                )}

                · ${escapeHtml(
                  formatTime(
                    session.start_time
                  )
                )}

                ${
                  session.court_name
                  ?
                  ` · ${escapeHtml(
                    session.court_name
                  )}`
                  :
                  ""
                }

                <div
                  style="
                    margin-top:4px;
                    color:#ffd37a;
                    font-size:12px;
                  "
                >
                  Trạng thái: Chờ học
                </div>
              </div>
            `;

          }
        )
        .join("");


    const requestLines =
      requests
        .map(
          request => {

            return `
              <div
                style="
                  margin-top:8px;
                  padding:10px 12px;
                  border-radius:9px;
                  background:rgba(0,0,0,.14);
                  color:white;
                "
              >
                <strong>
                  ${escapeHtml(
                    request.request_code
                    ||
                    `YC${request.id}`
                  )}
                </strong>

                <div
                  style="
                    margin-top:4px;
                    color:#ffd37a;
                    font-size:12px;
                  "
                >
                  Yêu cầu lịch đang Chờ Coach xử lý
                </div>
              </div>
            `;

          }
        )
        .join("");


    return `
      <div
        style="
          margin-top:14px;
          padding:14px;
          border-radius:12px;
          border:1px solid rgba(255,183,60,.46);
          background:rgba(255,170,40,.09);
          color:#ffd37a;
          line-height:1.5;
        "
      >

        <div
          style="
            font-weight:900;
            font-size:14px;
          "
        >
          ⚠️ ĐANG CÓ LỊCH CHƯA XỬ LÝ
        </div>

        <div
          style="
            margin-top:5px;
            color:rgba(255,255,255,.72);
            font-size:13px;
          "
        >
          Admin chưa thể đổi Coach.
          Hãy xử lý toàn bộ lịch bên dưới trước.
        </div>

        ${sessionLines}

        ${requestLines}

      </div>
    `;

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function render() {

    const filter =
      statusFilter.value;


    const filtered =
      filter === "all"
        ?
        rows
        :
        rows.filter(
          item =>
            item.status === filter
        );


    list.innerHTML =
      "";


    if (!filtered.length) {

      list.innerHTML =
        `
          <div class="empty">
            Không có yêu cầu phù hợp.
          </div>
        `;

      return;

    }


    filtered.forEach(
      function (item) {

        const student =
          item.student
          ||
          {};


        const oldCoach =
          item.current_coach
          ||
          {};


        const newCoach =
          item.requested_coach
          ||
          {};


        const hasBlockingSession =
          (
            item.blocking_sessions
            ||
            []
          ).length > 0;


        const hasBlockingRequest =
          (
            item.blocking_requests
            ||
            []
          ).length > 0;


        const hasBlocker =
          item.blocker_check_error
          ||
          hasBlockingSession
          ||
          hasBlockingRequest;


        const canApprove =
          item.status === "pending"
          &&
          item.requested_coach_id
          &&
          !hasBlocker;


        const card =
          document.createElement(
            "article"
          );


        card.className =
          `card ${item.status || ""}`;


        card.innerHTML =
          `

            <div class="card-head">

              <div>

                <div class="student">

                  ${escapeHtml(
                    student.full_name
                    ||
                    student.student_code
                    ||
                    "Học viên"
                  )}

                </div>


                <div class="code">

                  ${
                    escapeHtml(
                      student.student_code
                      ||
                      ""
                    )
                  }

                  ${
                    item.registration?.registration_code
                    ?
                    " • "
                    +
                    escapeHtml(
                      item.registration.registration_code
                    )
                    :
                    ""
                  }

                </div>

              </div>


              <div
                class="status ${escapeHtml(
                  item.status
                )}"
              >

                ${escapeHtml(
                  statusText(
                    item.status
                  )
                )}

              </div>

            </div>


            <div class="coach-grid">


              <div class="coach-box">

                <div class="coach-label">
                  COACH HIỆN TẠI
                </div>

                <div class="coach-name">

                  ${escapeHtml(
                    oldCoach.full_name
                    ||
                    "Chưa xác định"
                  )}

                </div>

                <div class="coach-meta">

                  ${escapeHtml(
                    oldCoach.coach_code
                    ||
                    ""
                  )}

                </div>

              </div>


              <div class="arrow">
                →
              </div>


              <div class="coach-box">

                <div class="coach-label">
                  COACH HỌC VIÊN CHỌN
                </div>

                <div class="coach-name">

                  ${escapeHtml(
                    newCoach.full_name
                    ||
                    "Chưa chọn Coach cụ thể"
                  )}

                </div>

                <div class="coach-meta">

                  ${
                    newCoach.coach_code
                    ?
                    escapeHtml(
                      newCoach.coach_code
                    )
                    :
                    ""
                  }

                  ${
                    newCoach.preferred_area
                    ?
                    "<br>📍 "
                    +
                    escapeHtml(
                      newCoach.preferred_area
                    )
                    :
                    ""
                  }

                  ${
                    newCoach.preferred_ward
                    ?
                    " • "
                    +
                    escapeHtml(
                      newCoach.preferred_ward
                    )
                    :
                    ""
                  }

                </div>

              </div>


            </div>


            <div class="detail">

              <strong>
                Lý do:
              </strong>

              ${escapeHtml(
                item.reason
                ||
                "—"
              )}

              ${
                item.reason_note
                ?
                "<br><br><strong>Ghi chú Học viên:</strong> "
                +
                escapeHtml(
                  item.reason_note
                )
                :
                ""
              }

              <br><br>

              <strong>
                Gửi lúc:
              </strong>

              ${escapeHtml(
                formatDate(
                  item.created_at
                )
              )}

              ${
                item.admin_note
                ?
                "<br><br><strong>Ghi chú Admin:</strong> "
                +
                escapeHtml(
                  item.admin_note
                )
                :
                ""
              }

            </div>


            ${blockerHtml(item)}


            ${
              item.status === "pending"
              ?
              `

                <textarea
                  class="admin-note"
                  placeholder="Ghi chú của Admin nếu cần..."
                ></textarea>


                <div class="actions">

                  <button
                    class="btn approve"
                    type="button"
                   ${(
  !item.requested_coach_id
  ||
  item.blocker_check_error
)
  ? "disabled"
  : ""
}
                  >
                    ${
                      hasBlocker
                      ?
                      "⚠ XỬ LÝ LỊCH TRƯỚC"
                      :
                      "✓ DUYỆT ĐỔI COACH"
                    }
                  </button>


                  <button
                    class="btn reject"
                    type="button"
                  >
                    ✕ TỪ CHỐI
                  </button>

                </div>


                ${
                  !item.requested_coach_id
                  ?
                  `
                    <div class="detail">
                      Học viên chưa chọn được Coach thay thế.
                      Admin chưa thể duyệt tự động.
                    </div>
                  `
                  :
                  ""
                }

              `
              :
              ""
            }

          `;


        const note =
          card.querySelector(
            ".admin-note"
          );


        const approve =
          card.querySelector(
            ".approve"
          );


        const reject =
          card.querySelector(
            ".reject"
          );


        /* =================================================
           APPROVE
        ================================================== */

        if (
          approve
          &&
          canApprove
        ) {

          approve.addEventListener(
            "click",
            async function () {

              const ok =
                window.confirm(
                  `Xác nhận đổi Coach của ${
                    student.full_name
                    ||
                    "Học viên"
                  } sang ${
                    newCoach.full_name
                    ||
                    "Coach mới"
                  }?`
                );


              if (!ok) {
                return;
              }


              approve.disabled =
                true;


              if (reject) {

                reject.disabled =
                  true;

              }


              approve.textContent =
                "ĐANG DUYỆT...";


              const {
                error
              } =
                await sb.rpc(
                  "approve_coach_change_request",
                  {

                    p_request_id:
                      Number(item.id),

                    p_admin_note:
                      String(
                        note?.value
                        ||
                        ""
                      )
                        .trim()
                      ||
                      null

                  }
                );


              if (error) {

                alert(
                  "Không duyệt được: "
                  +
                  error.message
                );


                await loadRequests();

                return;

              }


              await loadRequests();

            }
          );

        }


        /* =================================================
           REJECT
        ================================================== */

        if (reject) {

          reject.addEventListener(
            "click",
            async function () {

              const ok =
                window.confirm(
                  "Xác nhận từ chối yêu cầu đổi Coach này?"
                );


              if (!ok) {
                return;
              }


              if (approve) {

                approve.disabled =
                  true;

              }


              reject.disabled =
                true;


              reject.textContent =
                "ĐANG XỬ LÝ...";


              const {
                error
              } =
                await sb.rpc(
                  "reject_coach_change_request",
                  {

                    p_request_id:
                      Number(item.id),

                    p_admin_note:
                      String(
                        note?.value
                        ||
                        ""
                      )
                        .trim()
                      ||
                      null

                  }
                );


              if (error) {

                alert(
                  "Không từ chối được: "
                  +
                  error.message
                );


                await loadRequests();

                return;

              }


              await loadRequests();

            }
          );

        }


        list.appendChild(
          card
        );

      }
    );

  }


  /* =====================================================
     LOAD REQUESTS
  ====================================================== */

  async function loadRequests() {

    refreshBtn.disabled =
      true;


    list.innerHTML =
      '<div class="loading">Đang tải yêu cầu...</div>';


    try {

      const {
        data: { session },
        error: sessionError
      } =
        await sb.auth
          .getSession();


      if (
        sessionError
        ||
        !session
      ) {

        window.location.href =
          "./?v=login";

        return;

      }


      const {
        data: isAdmin,
        error: adminError
      } =
        await sb.rpc(
          "is_pickdee_admin"
        );


      if (
        adminError
        ||
        !isAdmin
      ) {

        list.innerHTML =
          `
            <div class="error">
              Bạn không có quyền Admin.
            </div>
          `;

        return;

      }


      const {
        data,
        error
      } =
        await sb
          .from(
            "coach_change_requests"
          )
          .select(
            `

              id,
              student_id,
              registration_id,
              current_coach_id,
              requested_coach_id,
              reason,
              reason_note,
              status,
              admin_note,
              created_at,
              decided_at,

              student:
                students!coach_change_requests_student_id_fkey (
                  id,
                  student_code,
                  full_name
                ),

              registration:
                registrations!coach_change_requests_registration_id_fkey (
                  id,
                  registration_code,
                  package_name,
                  is_test
                ),

              current_coach:
                coaches!coach_change_requests_current_coach_id_fkey (
                  id,
                  coach_code,
                  full_name
                ),

              requested_coach:
                coaches!coach_change_requests_requested_coach_id_fkey (
                  id,
                  coach_code,
                  full_name,
                  preferred_area,
                  preferred_ward,
                  status
                )

            `
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "COACH CHANGE ADMIN:",
          error
        );


        list.innerHTML =
          `
            <div class="error">
              ${escapeHtml(
                error.message
                ||
                "Không tải được yêu cầu đổi Coach."
              )}
            </div>
          `;

        return;

      }


      /*
        Business/Admin view:
        chỉ giữ registration REAL.
      */

      rows =
        (data || [])
          .filter(
            item =>
              item.registration
              &&
              item.registration.is_test === false
          );


      /*
        Gắn dữ liệu lịch đang chặn
        trước khi render nút DUYỆT.
      */

      await attachBlockingWork(
        rows
      );


      updateSummary();

      render();

    }
    catch (error) {

      console.error(
        "ADMIN COACH CHANGE:",
        error
      );


      list.innerHTML =
        `
          <div class="error">
            ${escapeHtml(
              error?.message
              ||
              "Không tải được dữ liệu."
            )}
          </div>
        `;

    }
    finally {

      refreshBtn.disabled =
        false;

    }

  }


  /* =====================================================
     EVENTS
  ====================================================== */

  statusFilter.addEventListener(
    "change",
    render
  );


  refreshBtn.addEventListener(
    "click",
    loadRequests
  );


  /* =====================================================
     START
  ====================================================== */

  loadRequests();


})();

</script>

<script>
/* ============================================================
   PICKDEE ADMIN
   HỦY BUỔI ĐANG CHẶN YÊU CẦU ĐỔI COACH
   ============================================================ */

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !(
    cfg.SUPABASE_PUBLISHABLE_KEY
    )
  ) {
    console.error(
      "Không khởi tạo được Supabase cho chức năng hủy buổi."
    );
    return;
  }

  const cancelSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  document.addEventListener(
    "click",
    async function (event) {

      const button =
        event.target.closest("button");

      if (!button) {
        return;
      }


      const buttonText =
        String(
          button.textContent || ""
        )
          .trim()
          .toUpperCase();


      /*
        Chỉ bắt nút đang có trên màn hình:

        ⚠ XỬ LÝ LỊCH TRƯỚC
      */

      if (
        !buttonText.includes(
          "XỬ LÝ LỊCH TRƯỚC"
        )
      ) {
        return;
      }


      event.preventDefault();
      event.stopPropagation();


      const card =
        button.closest(
          "article, .card"
        );


      if (!card) {

        alert(
          "Không xác định được yêu cầu đổi Coach."
        );

        return;
      }


      const cardText =
        String(
          card.innerText || ""
        );


      /* =====================================================
         LẤY MÃ ĐĂNG KÝ
      ====================================================== */

      const registrationMatch =
        cardText.match(
          /\bDK[A-Z0-9]+\b/i
        );


      if (!registrationMatch) {

        alert(
          "Không xác định được mã đăng ký học."
        );

        return;
      }


      const registrationCode =
        registrationMatch[0]
          .toUpperCase();


      /* =====================================================
         LẤY MÃ BUỔI ĐANG CHẶN
      ====================================================== */

      const sessionMatch =
        cardText.match(
          /\bBH\d+\b/i
        );


      if (!sessionMatch) {

        alert(
          "Không tìm thấy buổi học đang chặn đổi Coach."
        );

        return;
      }


      const sessionCode =
        sessionMatch[0]
          .toUpperCase();


      button.disabled =
        true;

      const oldButtonText =
        button.textContent;

      button.textContent =
        "ĐANG KIỂM TRA...";


      try {

        /* ===================================================
           TÌM REGISTRATION
        ==================================================== */

        const {
          data: registration,
          error: registrationError
        } =
          await cancelSb
            .from("registrations")
            .select(`
              id,
              registration_code,
              is_test
            `)
            .eq(
              "registration_code",
              registrationCode
            )
            .maybeSingle();


        if (registrationError) {
          throw registrationError;
        }


        if (!registration) {

          throw new Error(
            "Không tìm thấy đăng ký "
            +
            registrationCode
            +
            "."
          );

        }


        if (
          registration.is_test === true
        ) {

          throw new Error(
            "Không được dùng chức năng vận hành REAL để hủy dữ liệu TEST."
          );

        }


        /* ===================================================
           TÌM BUỔI CHỜ HỌC
        ==================================================== */

        const {
          data: session,
          error: sessionError
        } =
          await cancelSb
            .from("class_sessions")
            .select(`
              id,
              session_code,
              session_date,
              start_time,
              status
            `)
            .eq(
              "registration_id",
              Number(
                registration.id
              )
            )
            .eq(
              "session_code",
              sessionCode
            )
            .eq(
              "status",
              "Chờ học"
            )
            .maybeSingle();


        if (sessionError) {
          throw sessionError;
        }


        if (!session) {

          throw new Error(
            sessionCode
            +
            " không còn là buổi Chờ học cần xử lý."
          );

        }


        /* ===================================================
           NHẬP LÝ DO
        ==================================================== */

               const reasonInput =
          card.querySelector(
            ".admin-note"
          );

        const cleanReason =
          String(
            reasonInput?.value
            ||
            ""
          ).trim();


        if (!cleanReason) {

          alert(
            "Hãy nhập lý do hủy buổi học vào ô Ghi chú của Admin trước."
          );

          if (reasonInput) {
            reasonInput.focus();
          }

          button.disabled =
            false;

          button.textContent =
            oldButtonText;

          return;
        }


        const confirmed =
          window.confirm(
            "Xác nhận hủy "
            +
            sessionCode
            +
            "?\n\n"
            +
            "Lý do: "
            +
            cleanReason
            +
            "\n\n"
            +
            "Sau khi hủy, buổi này sẽ không còn chặn việc đổi Coach."
          );


        if (!confirmed) {

          button.disabled =
            false;

          button.textContent =
            oldButtonText;

          return;
        }


        /* ===================================================
           GỌI BACKEND HARD GATE
        ==================================================== */

        button.textContent =
          "ĐANG HỦY BUỔI...";


        const {
          data,
          error
        } =
          await cancelSb.rpc(
            "admin_cancel_class_session",
            {
              p_session_id:
                Number(
                  session.id
                ),

              p_reason:
                cleanReason
            }
          );


        if (error) {
          throw error;
        }


        if (
          data
          &&
          data.success === false
        ) {

          throw new Error(
            data.message
              ||
            "Không hủy được buổi học."
          );

        }


        alert(
          "✅ ĐÃ HỦY "
          +
          sessionCode
          +
          ".\n\n"
          +
          "Hệ thống sẽ cập nhật lại yêu cầu đổi Coach."
        );


        /*
          Reload để logic hiện tại kiểm tra blocker lại.

          Nếu không còn buổi chưa xử lý,
          nút DUYỆT ĐỔI COACH sẽ tự được mở.
        */

        window.location.reload();


      }
      catch (error) {

        console.error(
          "Lỗi hủy buổi trước khi đổi Coach:",
          error
        );


        alert(
          "Không hủy được buổi học:\n"
          +
          (
            error?.message
            ||
            error
          )
        );


        button.disabled =
          false;

        button.textContent =
          oldButtonText;

      }

    },
    true
  );

})();
</script>
<script src="/academy-admin-appnav.js?v=20261020-gold1"></script>
<script src="/pd-app.js?v=20261020-gold1"></script>
