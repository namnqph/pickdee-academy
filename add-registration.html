<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>Tạo đăng ký học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261017-logout1"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(760px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 26px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(34px, 6vw, 52px);
    }

    .student {
      margin-bottom: 26px;
      color: rgba(255,255,255,.68);
    }

    .card {
      background: rgba(6,39,88,.76);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: white;
      outline: none;
    }

    select {
      color: #fff;
      color-scheme: dark;
    }

    select option {
      color: #fff;
      background: #08111d;
    }

    select:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ================================
       THÔNG TIN GIÁ GÓI HỌC
    ================================= */

    .package-info {
      display: none;
      margin: -2px 0 20px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(216,255,69,.07);
      border: 1px solid rgba(216,255,69,.25);
    }

    .package-info-title {
      margin-bottom: 14px;
      color: #d8ff45;
      font-weight: 900;
      font-size: 15px;
    }

    .package-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .package-item {
      min-width: 0;
    }

    .package-label {
      color: rgba(255,255,255,.52);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .package-value {
      font-size: 15px;
      line-height: 1.4;
      font-weight: 900;
      word-break: break-word;
    }

    .package-price {
      color: #d8ff45;
      font-size: 19px;
    }

    .court-note {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.10);
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    #customSessionsWrap {
      display: none;
      margin-top: 16px;
    }

    .hint {
      margin-top: 7px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #d8ff45;
      color: #172600;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ffb0b0;
    }

    .success {
      color: #d8ff45;
    }

    @media (max-width: 650px) {
      .two,
      .package-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>

</header>


<main class="container">

  <a
    id="backLink"
    class="back"
    href="./students.html"
  >
    ← Hồ sơ học viên
  </a>


  <div class="eyebrow">
    QUẢN LÝ HỌC VIÊN
  </div>


  <h1>Tạo đăng ký học</h1>


  <div class="student">

    Học viên:

    <strong id="studentName">
      Đang tải...
    </strong>

    <span id="studentCode"></span>

  </div>


  <form
    id="registrationForm"
    class="card"
  >

    <!-- ================================
         GÓI HỌC
    ================================= -->

    <div class="field">

      <label>
        Gói học *
      </label>

      <select
        id="packageName"
        required
      >
        <option value="">
          Đang tải gói học...
        </option>
      </select>

    </div>


    <!-- ================================
         THÔNG TIN GÓI ĐÃ CHỌN
    ================================= -->

    <section
      id="packageInfo"
      class="package-info"
    >

      <div class="package-info-title">
        💳 Thông tin gói học
      </div>


      <div class="package-grid">

        <div class="package-item">

          <div class="package-label">
            Số người
          </div>

          <div
            id="packageGroupSize"
            class="package-value"
          >
            —
          </div>

        </div>


        <div class="package-item">

          <div class="package-label">
            Đơn giá
          </div>

          <div
            id="packageUnitPrice"
            class="package-value"
          >
            —
          </div>

        </div>


        <div class="package-item">

          <div class="package-label">
            Số buổi
          </div>

          <div
            id="packageSessions"
            class="package-value"
          >
            —
          </div>

        </div>


        <div class="package-item">

          <div class="package-label">
            Thời hạn
          </div>

          <div
            id="packageDuration"
            class="package-value"
          >
            —
          </div>

        </div>


        <div class="package-item">

          <div class="package-label">
            Học phí / người
          </div>

          <div
            id="packagePrice"
            class="package-value package-price"
          >
            —
          </div>

        </div>


        <div class="package-item">

          <div class="package-label">
            Ngày dự kiến hết hạn
          </div>

          <div
            id="packageEndDate"
            class="package-value"
          >
            —
          </div>

        </div>

      </div>


      <!-- Chỉ hiện khi chọn Theo yêu cầu -->

      <div
        id="customSessionsWrap"
        class="field"
      >

        <label>
          Số buổi mua *
        </label>

        <input
          id="purchasedSessions"
          type="number"
          min="1"
          step="1"
          placeholder="Ví dụ: 3"
        >

        <div class="hint">
          Gói Theo yêu cầu tính 550.000đ/người/buổi.
        </div>

      </div>


      <div
        id="packageCourtNote"
        class="court-note"
      >
        ✓ Học phí đã bao gồm tiền sân.
      </div>

    </section>


    <!-- ================================
         COACH + NGÀY BẮT ĐẦU
    ================================= -->

    <div class="two">

      <div class="field">

        <label>
          Coach
        </label>

        <select id="coachId">

          <option value="">
            Chưa phân Coach
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Ngày bắt đầu
        </label>

        <input
          id="startDate"
          type="date"
        >

      </div>

    </div>


    <!-- ================================
         KHU VỰC
    ================================= -->

    <div class="two">

      <div class="field">

        <label>
          Khu vực muốn học
        </label>

        <select id="preferredArea">

          <option value="">
            Chọn Tỉnh/Thành
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Xã/Phường muốn học
        </label>

        <select
          id="preferredWard"
          disabled
        >

          <option value="">
            Chọn Tỉnh/Thành trước
          </option>

        </select>

      </div>

    </div>


    <!-- ================================
         REFERRAL
    ================================= -->

    <div class="field">

      <label>
        Mã người giới thiệu
      </label>

      <input
        id="referralCode"
        type="text"
        placeholder="Có thể để trống"
      >

    </div>


    <!-- ================================
         GHI CHÚ
    ================================= -->

    <div class="field">

      <label>
        Ghi chú
      </label>

      <textarea
        id="note"
        placeholder="Nhu cầu học, giờ học mong muốn..."
      ></textarea>

    </div>


    <button
      id="saveBtn"
      type="submit"
    >
      TẠO ĐĂNG KÝ HỌC
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>

</main>


<script src="./add-registration.js?v=20260910-3"></script>

</body>
</html>
