<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const page =
    document.getElementById(
      "page"
    );

  const params =
    new URLSearchParams(
      location.search
    );

  const token =
    String(
      params.get("token")
      ||
      ""
    ).trim();


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    renderError(
      "Không tải được hệ thống PickDee Shop."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  /* =====================================================
     THANH TOÁN CHUYỂN KHOẢN TRÊN LINK THEO DÕI

     Khách rời trang checkout (tải lại, đi xem việc khác…)
     vẫn quay lại đây để xem mã QR và gửi bill.
     Tài khoản nhận tiền giữ GIỐNG shop-checkout.html:
     đơn có vợt → tài khoản vợt, còn lại → tài khoản Shop.
  ====================================================== */

  const SHOP_BANK = {
    bankId: "Techcombank",
    accountNo: "135892926886",
    accountName: "TRAN THU TRA"
  };

  const PADDLE_BANK = {
    bankId: "Techcombank",
    accountNo: "9933629966",
    accountName: "NGUYEN QUOC NAM"
  };

  const PAYMENT_PROOF_BUCKET =
    "shop-payment-proofs";

  const MAX_PAYMENT_PROOF_SIZE =
    8 * 1024 * 1024;

  const PENDING_PAYMENT_KEY =
    "pickdee_shop_pending_payment";


  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function transferReference(orderCode) {

    return String(orderCode || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .slice(0, 40);

  }


  function vietQrUrl(amount, orderCode, bank) {

    const params =
      new URLSearchParams();

    params.set(
      "amount",
      String(
        Math.max(
          0,
          Math.round(Number(amount || 0))
        )
      )
    );

    params.set(
      "addInfo",
      transferReference(orderCode)
    );

    params.set(
      "accountName",
      bank.accountName
    );

    return (
      `https://img.vietqr.io/image/${
        encodeURIComponent(bank.bankId)
      }-${
        encodeURIComponent(bank.accountNo)
      }-compact2.png?${
        params.toString()
      }`
    );

  }


  async function copyText(value, button) {

    const text =
      String(value || "");

    if (!text) {
      return;
    }

    try {

      await navigator.clipboard.writeText(
        text
      );

    }
    catch (_) {

      const temp =
        document.createElement("textarea");

      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";

      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      document.execCommand("copy");
      temp.remove();

    }

    if (button) {

      const oldText =
        button.textContent;

      button.textContent =
        "✓ ĐÃ COPY";

      setTimeout(
        function () {
          button.textContent = oldText;
        },
        1400
      );

    }

  }


  function paymentProofExtension(file) {

    const mimeMap = {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp"
    };

    const mime =
      String(file?.type || "").toLowerCase();

    if (mimeMap[mime]) {
      return mimeMap[mime];
    }

    const name =
      String(file?.name || "");

    const rawExt =
      name.includes(".")
        ? name.split(".").pop().toLowerCase()
        : "";

    if (
      ["jpg", "jpeg", "png", "webp"].includes(rawExt)
    ) {
      return rawExt === "jpeg" ? "jpg" : rawExt;
    }

    return "";

  }


  /*
    Nén bill ở trình duyệt trước khi tải lên
    (Storage gói free chỉ 1GB) — cùng thông số checkout.
  */
  function compressPaymentProofFile(file) {

    return new Promise(
      function (resolve, reject) {

        if (!paymentProofExtension(file)) {

          reject(
            new Error(
              "Bill phải là ảnh JPG, PNG hoặc WEBP. Nếu dùng iPhone, vui lòng chụp màn hình bill rồi gửi lại."
            )
          );

          return;

        }

        const imageUrl =
          URL.createObjectURL(file);

        const image =
          new Image();

        image.onload =
          function () {

            try {

              const maxSide = 1600;

              const width =
                image.naturalWidth || image.width;

              const height =
                image.naturalHeight || image.height;

              const ratio =
                Math.max(width, height) > maxSide
                  ? maxSide / Math.max(width, height)
                  : 1;

              const canvas =
                document.createElement("canvas");

              canvas.width =
                Math.max(1, Math.round(width * ratio));

              canvas.height =
                Math.max(1, Math.round(height * ratio));

              const context =
                canvas.getContext("2d");

              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, canvas.width, canvas.height);
              context.drawImage(image, 0, 0, canvas.width, canvas.height);

              canvas.toBlob(
                function (blob) {

                  URL.revokeObjectURL(imageUrl);

                  if (!blob) {

                    reject(
                      new Error("Không nén được ảnh bill.")
                    );

                    return;

                  }

                  resolve(
                    new File(
                      [blob],
                      "payment-proof.jpg",
                      {
                        type: "image/jpeg",
                        lastModified: Date.now()
                      }
                    )
                  );

                },
                "image/jpeg",
                0.82
              );

            }
            catch (error) {

              URL.revokeObjectURL(imageUrl);

              reject(error);

            }

          };

        image.onerror =
          function () {

            URL.revokeObjectURL(imageUrl);

            reject(
              new Error(
                "Không đọc được ảnh bill. Vui lòng chọn ảnh JPG, PNG hoặc WEBP."
              )
            );

          };

        image.src =
          imageUrl;

      }
    );

  }


  /*
    Ghi nhớ đơn chưa thanh toán trên máy khách
    để trang Shop hiện banner "Xem mã QR"
    (shop-pending-payment.js).
  */
  function rememberPendingPayment(orderCode) {

    try {

      localStorage.setItem(
        PENDING_PAYMENT_KEY,
        JSON.stringify({
          token: token,
          order_code: orderCode,
          saved_at: Date.now()
        })
      );

    }
    catch (_) {}

  }


  function forgetPendingPayment() {

    try {

      const saved =
        JSON.parse(
          localStorage.getItem(PENDING_PAYMENT_KEY)
          ||
          "null"
        );

      if (saved?.token === token) {

        localStorage.removeItem(
          PENDING_PAYMENT_KEY
        );

      }

    }
    catch (_) {}

  }


  /*
    "" = không hiện khung thanh toán
    (COD, đơn đã xong/hủy, hoặc RPC cũ chưa trả thông tin thanh toán).
  */
  function paymentState(data) {

    if (
      data.payment_method !== "bank_transfer"
      ||
      !data.payment_status
    ) {
      return "";
    }

    if (data.payment_status === "paid") {
      return "paid";
    }

    if (
      data.payment_status === "refunded"
      ||
      ["cancelled", "completed"].includes(data.order_status)
    ) {
      return "";
    }

    if (data.shipping_pending_confirmation) {
      return "shipping_pending";
    }

    if (data.payment_review_status === "submitted") {
      return "submitted";
    }

    if (data.payment_review_status === "rejected") {
      return "rejected";
    }

    return "unpaid";

  }

    const openBtn =

        });

      "change",
      function () {

        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = "";

        preview.removeAttribute("src");
        message.className = "proof-message";

        const file =
          input.files?.[0];

        if (!file) {
          return;
        }

        if (file.size > MAX_PAYMENT_PROOF_SIZE) {

          input.value = "";

          showProofMessage(
            "Ảnh bill tối đa 8 MB.",
            "error"
          );

          return;

        }

        if (!paymentProofExtension(file)) {

          input.value = "";

          showProofMessage(
            "Bill phải là ảnh JPG, PNG hoặc WEBP. Nếu dùng iPhone, vui lòng chụp màn hình bill hoặc chọn ảnh đã lưu dạng JPG/PNG để Shop xem được trực tiếp.",
            "error"
          );

          URL.createObjectURL(file);

        preview.src =
          previewUrl;

        preview.classList.add("show");

      }
    );


    submitBtn.addEventListener(
      "click",
      async function () {

        const file =
          input.files?.[0];

        if (!file) {

          showProofMessage(
            "Vui lòng chọn ảnh bill trước khi gửi.",
            "error"
          );

          return;

        }

        paymentBusy = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "ĐANG NÉN BILL...";

        try {

          const uploadFile =
            await compressPaymentProofFile(file);

          submitBtn.textContent =
            "ĐANG GỬI BILL...";

          const randomId =
            typeof globalThis.crypto?.randomUUID === "function"
              ? globalThis.crypto.randomUUID()
              : Date.now() + "-" + Math.random().toString(36).slice(2);

          const objectPath =
            `${token}/${Date.now()}-${randomId}.jpg`;

          const { error: uploadError } =
            await sb
              .storage
              .from(PAYMENT_PROOF_BUCKET)
              .upload(
                objectPath,
                uploadFile,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: "image/jpeg"
                }
              );

          if (uploadError) {
            throw uploadError;

            await sb.rpc(
              "shop_submit_bank_transfer_proof",
              {
                p_tracking_token: token,
                p_payment_proof_path: objectPath
              }
            );

          if (proofError) {
            throw proofError;
          }

          if (!proofData?.success) {
            throw new Error("Không gửi được bill chuyển khoản.");
          }

          forgetPendingPayment();

          showProofMessage(
            "✓ Đã gửi bill thành công. PickDee sẽ kiểm tra và xác nhận đơn hàng.",

          );

          );

            error?.message
            ||
            "Không gửi được bill. Vui lòng thử lại.",
            "error"
          );

          submitBtn.disabled = false;
          submitBtn.textContent = "GỬI BILL XÁC NHẬN";

        }
        finally {

          paymentBusy = false;

        }

      }
    );


    return box;

  }


  /*
    Trang tự tải lại mỗi 30 giây (page.innerHTML).
    Khung thanh toán là phần tử riêng, chỉ dựng lại khi
    trạng thái thanh toán đổi → ảnh bill khách đang chọn không bị mất.
  */
  function mountPaymentBox(data) {

    const state =
      paymentState(data);

    if (
      ["unpaid", "rejected", "shipping_pending"].includes(state)
    ) {

      rememberPendingPayment(
        data.order_code
      );

    }
    else if (data.payment_status) {

      forgetPendingPayment();

    }

    const slot =
      document.getElementById("paymentSlot");

    if (!slot) {
      return;
    }

    if (!state) {

      slot.remove();

      return;

    }

    const key =
      [
        state,
        data.customer_total,
        data.has_paddle
      ].join("|");

    if (
      !paymentEl
      ||
      (
        key !== paymentKey
        &&
        !paymentBusy
      )
    ) {

      paymentEl =
        buildPaymentBox(data, state);

      paymentKey =
        key;

    }

    slot.replaceWith(
      paymentEl
    );

  }


  function formatTime(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "";
    }

    return date.toLocaleString(
      "vi-VN",
      {
        hour:
          "2-digit",

        minute:
          "2-digit",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    );

  }


  function providerLabel(value) {

    const map = {

      viettel_post:
        "Viettel Post",

      ghn:
        "GHN",

      ghtk:
        "GHTK",

      jnt:
        "J&T Express",

      spx:
        "SPX Shopee Express",

      other:
        "Đơn vị vận chuyển khác"

    };

    return (
      map[value]
      ||
      value
      ||
      "Chưa cập nhật"
    );

  }


  function shippingLabel(value) {

    const map = {

      not_shipped:
        "Chưa gửi hàng",

      shipped:
        "Đã giao cho đơn vị vận chuyển",

      in_transit:
        "Đang giao",

      delivered:
        "Giao thành công",

      returned:
        "Hoàn hàng"

    };

    return (
      map[value]
      ||
      "Đang xử lý"
    );

  }


  function renderError(message) {

    page.innerHTML = `

      <div class="state">

        <div style="
          font-size:32px;
          margin-bottom:10px;
        ">
          📦
        </div>

        ${escapeHtml(
          message
        )}

      </div>

    `;

  }


  function timelineState(
    orderStatus,
    shippingStatus
  ) {

    const orderRank = {

      new:
        1,

      confirmed:
        2,

      packing:
        3,

      shipping:
        4,

      completed:
        6

    };


    let reached =
      orderRank[
        orderStatus
      ]
      ||
      1;


    if (
      shippingStatus === "shipped"
    ) {

      reached =
        Math.max(
          reached,
          4
        );

    }


    if (
      shippingStatus === "in_transit"
    ) {

      reached =
        Math.max(
          reached,
          5
        );

    }


    if (
      shippingStatus === "delivered"
    ) {

      reached = 6;

    }


    return reached;

  }


  function timelineItem(
    step,
    reached,
    title,
    description
  ) {

    let state =
      "pending";


    if (step < reached) {

      state =
        "done";

    }
    else if (step === reached) {

      state =
        "current";

    }


    const symbol =
      state === "done"
        ?
          "✓"
        :
          step;


    return `

      <div class="timeline-item ${state}">

        <div class="timeline-line"></div>

        <div class="timeline-dot">
          ${symbol}
        </div>

        <div class="timeline-content">

          <div class="timeline-title">
            ${escapeHtml(
              title
            )}
          </div>

          <div class="timeline-desc">
            ${escapeHtml(
              description
            )}
          </div>

        </div>

      </div>

    `;

  }


/* =====================================================
   AUTO REFRESH TRACKING

   - Bước 1 → 3:
     tự kiểm tra trạng thái mỗi 30 giây.

   - Khi PickDee đã bàn giao cho SPX:
     dừng auto refresh.
     Khách tiếp tục theo dõi trên SPX.
===================================================== */

let autoRefreshTimer =
  null;

let autoRefreshEnabled =
  false;


function stopAutoRefresh() {

  autoRefreshEnabled =
    false;


  if (autoRefreshTimer) {

    clearTimeout(
      autoRefreshTimer
    );

    autoRefreshTimer =
      null;

  }

}


function startAutoRefresh() {

  autoRefreshEnabled =
    true;


  /*
    Đã có lịch kiểm tra
    thì không tạo thêm.
  */

  if (autoRefreshTimer) {
    return;
  }


  autoRefreshTimer =
    setTimeout(
      async function autoRefreshTick() {

        autoRefreshTimer =
          null;


        if (
          !autoRefreshEnabled
        ) {
          return;
        }


        /*
          Nếu tab đang mở thì
          lấy trạng thái mới nhất.
        */

        if (
          !document.hidden
        ) {

          await loadOrder();

        }


        /*
          Nếu renderOrder chưa dừng
          auto refresh thì tiếp tục
          kiểm tra sau 30 giây.
        */

        if (
          autoRefreshEnabled
        ) {

          startAutoRefresh();

        }

      },
      30000
    );

}



function renderOrder(data) {

  const orderStatus =
    data.order_status
    ||
    "new";


  const shippingStatus =
    data.shipping_status
    ||
    "not_shipped";


  /*
    Khi PickDee đã giao cho SPX
    và đã có mã vận đơn:

    => hành trình PickDee dừng tại bước 4.
    => khách tiếp tục theo dõi trên SPX.
  */

  const isSpxHandoff =
    Boolean(
      String(
        data.tracking_code || ""
      ).trim()
    )

    &&

    [
      "shipped",
      "in_transit",
      "delivered"
    ].includes(
      shippingStatus
    );


  /*
    Đơn đã hủy:
    không cần auto refresh nữa.
  */

  if (
    orderStatus === "cancelled"
  ) {

    stopAutoRefresh();


    page.innerHTML = `

      <div class="card">

        <div class="order-code-label">
          Mã đơn hàng
        </div>

        <div class="order-code">
          ${escapeHtml(
            data.order_code
          )}
        </div>

        <div class="created">
          Đặt lúc ${escapeHtml(
            formatTime(
              data.created_at
            )
          )}
        </div>

      </div>


      <div class="card">

        <div class="alert">
          Đơn hàng này đã được hủy.
        </div>

      </div>

    `;


    mountPaymentBox(
      data
    );


    return;

  }


  /*
    Trạng thái hoàn hàng cũ:
    dừng auto refresh PickDee.
  */

  if (
    shippingStatus === "returned"
  ) {

    stopAutoRefresh();


    page.innerHTML = `

      <div class="card">

        <div class="order-code-label">
          Mã đơn hàng
        </div>

        <div class="order-code">
          ${escapeHtml(
            data.order_code
          )}
        </div>

        <div class="created">
          Đặt lúc ${escapeHtml(
            formatTime(
              data.created_at
            )
          )}
        </div>

      </div>


      <div class="card">

        <div class="alert">
          Đơn hàng đang ở trạng thái hoàn hàng.
        </div>

      </div>

    `;


    mountPaymentBox(
      data
    );


    return;

  }


  /*
    AUTO REFRESH

    Trước khi bàn giao SPX:
    tự kiểm tra mỗi 30 giây.

    Sau khi bàn giao SPX:
    dừng hoàn toàn phía PickDee.
  */

  if (
    isSpxHandoff
  ) {

    stopAutoRefresh();

  }
  else {

    startAutoRefresh();

  }


  let reached =
    timelineState(
      orderStatus,
      shippingStatus
    );

  /*
    Đã bàn giao hãng vận chuyển:
    bước 4 xong, bước 5 "Đang giao đến bạn".
  */

  if (
    isSpxHandoff
    &&
    reached < 5
  ) {

    reached = 5;

  }


  const carrier =
    data.carrier_tracking
    ||
    null;

  const carrierEvents =
    Array.isArray(
      carrier && carrier.events
    )
      ? carrier.events
      : [];

  const carrierName =
    providerLabel(
      String(
        data.shipping_provider || ""
      ).toLowerCase()
    );


  


  /*
    Khung hướng dẫn khách
    tiếp tục theo dõi trên SPX.
  */

  /*
    Hành trình lấy tự động từ hãng vận chuyển
    (cron PickDee tra SPX / GHN mỗi 2 tiếng).
  */

  function journeyEvent(ev, latest) {

    return `
      <div class="journey-ev ${latest ? "latest" : ""}">
        <div class="journey-time">
          ${escapeHtml(formatTime(ev.at))}
        </div>
        <div class="journey-text">
          ${escapeHtml(ev.text || "")}
        </div>
      </div>
    `;

  }


  const journeyList =
    carrierEvents.length
      ?
        `
          <div class="journey-list">
            ${carrierEvents
              .slice(0, 4)
              .map(function (ev, i) {
                return journeyEvent(ev, i === 0);
              })
              .join("")}
          </div>

          ${
            carrierEvents.length > 4
              ?
                `
                  <details>
                    <summary>Xem thêm ${carrierEvents.length - 4} mốc trước đó</summary>
                    <div class="journey-list" style="margin-top:0">
                      ${carrierEvents
                        .slice(4)
                        .map(function (ev) {
                          return journeyEvent(ev, false);
                        })
                        .join("")}
                    </div>
                  </details>
                `
              :
                ""
          }
        `
      :
        `
          <div class="journey-sub" style="margin-top:10px">
            ${
              ["spx", "ghn"].includes(
                String(data.shipping_provider || "").toLowerCase()
              )
                ?
                  "PickDee đang lấy hành trình từ " + escapeHtml(carrierName) + ". Anh/chị quay lại sau ít phút để xem chi tiết."
                :
                  "Anh/chị bấm nút bên dưới để xem hành trình trên website " + escapeHtml(carrierName) + " (mã vận đơn đã được copy sẵn)."
            }
          </div>
        `;


  const spxTrackingBox =
    isSpxHandoff
      ?
        `
          <div class="journey">

            <div class="journey-head">
              🚚 HÀNH TRÌNH VẬN CHUYỂN • ${escapeHtml(carrierName.toUpperCase())}
            </div>

            ${
              carrier && carrier.checked_at
                ?
                  `
                    <div class="journey-sub">
                      Tự động cập nhật từ ${escapeHtml(carrierName)} • lần cuối ${escapeHtml(formatTime(carrier.checked_at))}
                    </div>
                  `
                :
                  ""
            }

            ${journeyList}

            <button
              id="openSpxTrackingBtn"
              class="journey-link"
              type="button"
            >
              Xem trên website ${escapeHtml(carrierName)}
            </button>

          </div>
        `
      :
        "";


  page.innerHTML = `

    <div class="card">

      <div class="order-code-label">
        Mã đơn hàng
      </div>


      <div class="order-code">
        ${escapeHtml(
          data.order_code
        )}
      </div>


      <div class="created">
        Đặt lúc ${escapeHtml(
          formatTime(
            data.created_at
          )
        )}
      </div>

    </div>


    <div id="paymentSlot"></div>



    <div class="card">

      <div class="section-title">
        Hành trình đơn hàng
      </div>


      <div class="timeline">

        ${timelineItem(
          1,
          reached,
          "Đã đặt hàng",
          "PickDee đã nhận được đơn hàng của bạn."
        )}


        ${timelineItem(
          2,
          reached,
          "PickDee đã xác nhận",
          "Đơn hàng đã được xác nhận để xử lý."
        )}


        ${timelineItem(
          3,
          reached,
          "Đang đóng gói",
          "PickDee đang chuẩn bị sản phẩm."
        )}


        ${timelineItem(
          4,
          reached,
          "Đã giao cho đơn vị vận chuyển",
          isSpxHandoff
            ?
              "PickDee đã bàn giao đơn hàng cho " + carrierName + "."
            :
              "Đơn hàng đã được bàn giao cho đơn vị vận chuyển."
        )}


        ${timelineItem(
          5,
          reached,
          reached >= 6
            ? "Giao thành công"
            : "Đang giao đến bạn",
          reached >= 6
            ? "Anh/chị đã nhận hàng. Cảm ơn anh/chị đã mua sắm tại PickDee!"
            : (
                carrier && carrier.status_text
                  ? carrier.status_text
                  : "Đơn hàng sẽ được giao đến địa chỉ của anh/chị."
              )
        )}


      

      </div>

    </div>



    <div class="card">

      <div class="section-title">
        Thông tin vận chuyển
      </div>


      <div class="shipping-grid">

        <div class="shipping-row">

          <div class="shipping-label">
            Trạng thái
          </div>


          <div class="shipping-value">
            ${escapeHtml(
              shippingLabel(
                shippingStatus
              )
            )}
          </div>

        </div>



        <div class="shipping-row">

          <div class="shipping-label">
            Đơn vị vận chuyển
          </div>


          <div class="shipping-value">
            ${escapeHtml(
              providerLabel(
                data.shipping_provider
              )
            )}
          </div>

        </div>



        <div class="shipping-row">

          <div class="shipping-label">
            Mã vận đơn
          </div>


          <div
            id="trackingCodeText"
            class="shipping-value tracking-code"
          >
            ${
              data.tracking_code
                ?
                  escapeHtml(
                    data.tracking_code
                  )
                :
                  "Chưa có mã vận đơn"
            }
          </div>


          ${
            data.tracking_code
              ?
                `

                  <button
                    id="copyTrackingBtn"
                    class="copy-btn"
                    type="button"
                  >
                    COPY MÃ VẬN ĐƠN
                  </button>

                `
              :
                ""
          }

        </div>

      </div>


      ${spxTrackingBox}

    </div>


   ${

  isSpxHandoff

    ?

      `

        <div class="note">
          Hành trình được PickDee tự động cập nhật từ
          ${escapeHtml(carrierName)}. Anh/chị chỉ cần mở lại link này để xem.
        </div>

      `

    :

      `

        <div class="note">
          Trạng thái đơn hàng được tự động cập nhật mỗi 30 giây.
          Anh/chị không cần thao tác cập nhật thủ công.
        </div>

      `

}

  `;


  mountPaymentBox(
    data
  );



  /* =====================================================
     COPY MÃ VẬN ĐƠN
  ====================================================== */

  const copyBtn =
    document.getElementById(
      "copyTrackingBtn"
    );


  if (
    copyBtn
    &&
    data.tracking_code
  ) {

    copyBtn.addEventListener(
      "click",
      async function () {

        try {

          await navigator.clipboard.writeText(
            data.tracking_code
          );


          copyBtn.textContent =
            "ĐÃ COPY";


          setTimeout(
            function () {

              copyBtn.textContent =
                "COPY MÃ VẬN ĐƠN";

            },
            1200
          );

        }
        catch (_) {

          window.prompt(
            "Copy mã vận đơn:",
            data.tracking_code
          );

        }

      }
    );

  }



  /* =====================================================
     MỞ SPX

     - Copy mã vận đơn.
     - Mở website chính thức SPX.
  ====================================================== */

  const openSpxTrackingBtn =
    document.getElementById(
      "openSpxTrackingBtn"
    );


  if (
    openSpxTrackingBtn
    &&
    data.tracking_code
  ) {

    openSpxTrackingBtn.addEventListener(
      "click",
      function () {

        if (
          navigator.clipboard
          &&
          navigator.clipboard.writeText
        ) {

          navigator.clipboard
            .writeText(
              data.tracking_code
            )
            .catch(
              function () {}
            );

        }


        const code =
          encodeURIComponent(
            data.tracking_code
          );

        const carrierSites = {
          spx: "https://spx.vn/vi",
          ghn: "https://donhang.ghn.vn/?order_code=" + code,
          ghtk: "https://i.ghtk.vn/" + code,
          jnt: "https://jtexpress.vn/vi/tracking?type=track&billcode=" + code,
          viettel_post: "https://viettelpost.com.vn/tra-cuu-hanh-trinh-don/"
        };

        window.open(
          carrierSites[
            String(data.shipping_provider || "").toLowerCase()
          ]
          ||
          "https://www.google.com/search?q=" + encodeURIComponent("tra cứu vận đơn " + data.tracking_code),
          "_blank",
          "noopener,noreferrer"
        );

      }
    );

  }



  
}

  async function loadOrder() {

    if (
      !token
      ||
      token.length < 32
    ) {

      renderError(
        "Link theo dõi đơn hàng không hợp lệ."
      );

      return;

    }


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "shop_public_track_order",
          {
            p_token:
              token
          }
        );


      if (error) {
        throw error;
      }


      if (
        !data
        ||
        data.success !== true
      ) {

        renderError(
          data?.message
          ||
          "Không tìm thấy đơn hàng."
        );

        return;

      }


      renderOrder(
        data
      );

    }
    catch (error) {

      console.error(
        "TRACK ORDER ERROR:",
        error
      );


      renderError(
        "Không tải được trạng thái đơn hàng. Anh/chị vui lòng thử lại."
      );

    }

  }


  loadOrder();

})();

</script>

  
</body>
</html>
