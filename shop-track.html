<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#071523">

  <title>Theo dõi đơn hàng | PickDee Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #071523;
      color: #fff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    a {
      font-family: inherit;
    }

    .header {
      border-bottom:
        1px solid rgba(255,255,255,.08);
      background:
        rgba(7,21,35,.96);
    }

    .header-inner {
      width:
        min(760px,calc(100% - 22px));
      min-height: 64px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .shop-link {
      min-height: 38px;
      padding: 0 12px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;
      border:
        1px solid rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.72);
      text-decoration: none;
      font-size: 9px;
      font-weight: 950;
    }

    main {
      width:
        min(760px,calc(100% - 22px));
      margin:
        22px auto 45px;
    }

    .eyebrow {
      margin-bottom: 7px;
      color: #d8ff45;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .1em;
    }

    h1 {
      margin: 0;
      font-size:
        clamp(30px,8vw,44px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .intro {
      margin:
        8px 0 18px;

      color:
        rgba(255,255,255,.5);
      font-size: 11px;
      line-height: 1.55;
    }

    .card {
      margin-bottom: 12px;
      padding: 16px;

      border-radius: 17px;
      border:
        1px solid rgba(255,255,255,.09);

      background: #0d1d2f;
    }

    .state {
      padding:
        48px 18px;

      text-align: center;

      border-radius: 16px;
      border:
        1px dashed rgba(255,255,255,.13);

      color:
        rgba(255,255,255,.55);

      font-size: 12px;
      line-height: 1.6;
    }

    .order-code-label {
      color:
        rgba(255,255,255,.4);
      font-size: 8px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .order-code {
      margin-top: 5px;
      color: #d8ff45;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -.035em;
    }

    .created {
      margin-top: 5px;
      color:
        rgba(255,255,255,.4);
      font-size: 9px;
    }

    .section-title {
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 950;
    }

    /* =====================================================
       TIMELINE
    ====================================================== */

    .timeline {
      position: relative;
    }

    .timeline-item {
      position: relative;

      display: grid;
      grid-template-columns:
        32px minmax(0,1fr);
      gap: 10px;

      min-height: 67px;
    }

    .timeline-item:last-child {
      min-height: 42px;
    }

    .timeline-line {
      position: absolute;
      left: 15px;
      top: 27px;
      bottom: -4px;

      width: 2px;

      background:
        rgba(255,255,255,.09);
    }

    .timeline-item:last-child
    .timeline-line {
      display: none;
    }

    .timeline-dot {
      position: relative;
      z-index: 2;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border:
        2px solid rgba(255,255,255,.14);

      background: #10243a;

      color:
        rgba(255,255,255,.35);

      font-size: 12px;
      font-weight: 950;
    }

    .timeline-item.done
    .timeline-dot {
      border-color: #d8ff45;
      background: #d8ff45;
      color: #071523;
    }

    .timeline-item.current
    .timeline-dot {
      border-color: #d8ff45;
      color: #d8ff45;

      box-shadow:
        0 0 0 5px rgba(216,255,69,.08);
    }

    .timeline-item.done
    .timeline-line {
      background:
        rgba(216,255,69,.55);
    }

    .timeline-content {
      padding-top: 3px;
    }

    .timeline-title {
      font-size: 11px;
      font-weight: 950;
    }

    .timeline-desc {
      margin-top: 3px;

      color:
        rgba(255,255,255,.4);

      font-size: 9px;
      line-height: 1.4;
    }

    .timeline-item.done
    .timeline-title,

    .timeline-item.current
    .timeline-title {
      color: #fff;
    }

    .timeline-item.pending
    .timeline-title {
      color:
        rgba(255,255,255,.37);
    }

    /* =====================================================
       SHIPPING
    ====================================================== */

    .shipping-grid {
      display: grid;
      gap: 9px;
    }

    .shipping-row {
      padding: 11px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.07);
    }

    .shipping-label {
      color:
        rgba(255,255,255,.38);

      font-size: 8px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .shipping-value {
      margin-top: 4px;

      color: #fff;

      font-size: 12px;
      font-weight: 900;

      word-break: break-word;
    }

    .tracking-code {
      color: #d8ff45;
      font-size: 15px;
    }

    .copy-btn {
      width: 100%;
      min-height: 42px;

      margin-top: 9px;

      border-radius: 10px;

      border:
        1px solid rgba(216,255,69,.23);

      background:
        rgba(216,255,69,.08);

      color: #d8ff45;

      font-size: 9px;
      font-weight: 950;

      cursor: pointer;
    }

    .refresh-btn {
      width: 100%;
      min-height: 46px;

      margin-top: 3px;

      border: 0;
      border-radius: 11px;

      background: #d8ff45;
      color: #071523;

      font-size: 10px;
      font-weight: 950;

      cursor: pointer;
    }

    .note {
      margin-top: 11px;

      color:
        rgba(255,255,255,.38);

      font-size: 9px;
      line-height: 1.5;
      text-align: center;
    }

    .alert {
      padding: 12px;

      border-radius: 11px;

      border:
        1px solid rgba(255,100,100,.2);

      background:
        rgba(255,100,100,.06);

      color: #ffb0b0;

      font-size: 10px;
      line-height: 1.5;
    }

  </style>
</head>

<body>

<header
  class="header"
  id="shopPublicHeader"
></header>

<script src="./shop-public-nav.js?v=20261006-2"></script>

<main>

  <div class="eyebrow">
    PICKDEE SHOP
  </div>

  <h1>
    Theo dõi đơn hàng
  </h1>

  <p class="intro">
    Theo dõi quá trình PickDee xử lý đơn hàng và tiếp tục tra cứu vận chuyển sau khi đơn được bàn giao cho đơn vị giao hàng.
  </p>

  <div id="page">

    <div class="state">
      Đang tải hành trình đơn hàng...
    </div>

  </div>

</main>

<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const page =
    document.getElementById(
      "page"
    );

  const params =
    new URLSearchParams(
      location.search
    );

  const token =
    String(
      params.get("token")
      ||
      ""
    ).trim();


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    renderError(
      "Không tải được hệ thống PickDee Shop."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function formatTime(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "";
    }

    return date.toLocaleString(
      "vi-VN",
      {
        hour:
          "2-digit",

        minute:
          "2-digit",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    );

  }


  function providerLabel(value) {

    const map = {

      viettel_post:
        "Viettel Post",

      ghn:
        "GHN",

      ghtk:
        "GHTK",

      jnt:
        "J&T Express",

      spx:
        "SPX Shopee Express",

      other:
        "Đơn vị vận chuyển khác"

    };

    return (
      map[value]
      ||
      value
      ||
      "Chưa cập nhật"
    );

  }


  function shippingLabel(value) {

    const map = {

      not_shipped:
        "Chưa gửi hàng",

      shipped:
        "Đã giao cho đơn vị vận chuyển",

      in_transit:
        "Đang giao",

      delivered:
        "Giao thành công",

      returned:
        "Hoàn hàng"

    };

    return (
      map[value]
      ||
      "Đang xử lý"
    );

  }


  function renderError(message) {

    page.innerHTML = `

      <div class="state">

        <div style="
          font-size:32px;
          margin-bottom:10px;
        ">
          📦
        </div>

        ${escapeHtml(
          message
        )}

      </div>

    `;

  }


  function timelineState(
    orderStatus,
    shippingStatus
  ) {

    const orderRank = {

      new:
        1,

      confirmed:
        2,

      packing:
        3,

      shipping:
        4,

      completed:
        6

    };


    let reached =
      orderRank[
        orderStatus
      ]
      ||
      1;


    if (
      shippingStatus === "shipped"
    ) {

      reached =
        Math.max(
          reached,
          4
        );

    }


    if (
      shippingStatus === "in_transit"
    ) {

      reached =
        Math.max(
          reached,
          5
        );

    }


    if (
      shippingStatus === "delivered"
    ) {

      reached = 6;

    }


    return reached;

  }


  function timelineItem(
    step,
    reached,
    title,
    description
  ) {

    let state =
      "pending";


    if (step < reached) {

      state =
        "done";

    }
    else if (step === reached) {

      state =
        "current";

    }


    const symbol =
      state === "done"
        ?
          "✓"
        :
          step;


    return `

      <div class="timeline-item ${state}">

        <div class="timeline-line"></div>

        <div class="timeline-dot">
          ${symbol}
        </div>

        <div class="timeline-content">

          <div class="timeline-title">
            ${escapeHtml(
              title
            )}
          </div>

          <div class="timeline-desc">
            ${escapeHtml(
              description
            )}
          </div>

        </div>

      </div>

    `;

  }


/* =====================================================
   AUTO REFRESH TRACKING

   - Bước 1 → 3:
     tự kiểm tra trạng thái mỗi 30 giây.

   - Khi PickDee đã bàn giao cho SPX:
     dừng auto refresh.
     Khách tiếp tục theo dõi trên SPX.
===================================================== */

let autoRefreshTimer =
  null;

let autoRefreshEnabled =
  false;


function stopAutoRefresh() {

  autoRefreshEnabled =
    false;


  if (autoRefreshTimer) {

    clearTimeout(
      autoRefreshTimer
    );

    autoRefreshTimer =
      null;

  }

}


function startAutoRefresh() {

  autoRefreshEnabled =
    true;


  /*
    Đã có lịch kiểm tra
    thì không tạo thêm.
  */

  if (autoRefreshTimer) {
    return;
  }


  autoRefreshTimer =
    setTimeout(
      async function autoRefreshTick() {

        autoRefreshTimer =
          null;


        if (
          !autoRefreshEnabled
        ) {
          return;
        }


        /*
          Nếu tab đang mở thì
          lấy trạng thái mới nhất.
        */

        if (
          !document.hidden
        ) {

          await loadOrder();

        }


        /*
          Nếu renderOrder chưa dừng
          auto refresh thì tiếp tục
          kiểm tra sau 30 giây.
        */

        if (
          autoRefreshEnabled
        ) {

          startAutoRefresh();

        }

      },
      30000
    );

}



function renderOrder(data) {

  const orderStatus =
    data.order_status
    ||
    "new";


  const shippingStatus =
    data.shipping_status
    ||
    "not_shipped";


  /*
    Khi PickDee đã giao cho SPX
    và đã có mã vận đơn:

    => hành trình PickDee dừng tại bước 4.
    => khách tiếp tục theo dõi trên SPX.
  */

  const isSpxHandoff =
    String(
      data.shipping_provider || ""
    ).toLowerCase() === "spx"

    &&

    Boolean(
      String(
        data.tracking_code || ""
      ).trim()
    )

    &&

    [
      "shipped",
      "in_transit",
      "delivered"
    ].includes(
      shippingStatus
    );


  /*
    Đơn đã hủy:
    không cần auto refresh nữa.
  */

  if (
    orderStatus === "cancelled"
  ) {

    stopAutoRefresh();


    page.innerHTML = `

      <div class="card">

        <div class="order-code-label">
          Mã đơn hàng
        </div>

        <div class="order-code">
          ${escapeHtml(
            data.order_code
          )}
        </div>

        <div class="created">
          Đặt lúc ${escapeHtml(
            formatTime(
              data.created_at
            )
          )}
        </div>

      </div>


      <div class="card">

        <div class="alert">
          Đơn hàng này đã được hủy.
        </div>

      </div>

    `;


    return;

  }


  /*
    Trạng thái hoàn hàng cũ:
    dừng auto refresh PickDee.
  */

  if (
    shippingStatus === "returned"
  ) {

    stopAutoRefresh();


    page.innerHTML = `

      <div class="card">

        <div class="order-code-label">
          Mã đơn hàng
        </div>

        <div class="order-code">
          ${escapeHtml(
            data.order_code
          )}
        </div>

        <div class="created">
          Đặt lúc ${escapeHtml(
            formatTime(
              data.created_at
            )
          )}
        </div>

      </div>


      <div class="card">

        <div class="alert">
          Đơn hàng đang ở trạng thái hoàn hàng.
        </div>

      </div>

    `;


    return;

  }


  /*
    AUTO REFRESH

    Trước khi bàn giao SPX:
    tự kiểm tra mỗi 30 giây.

    Sau khi bàn giao SPX:
    dừng hoàn toàn phía PickDee.
  */

  if (
    isSpxHandoff
  ) {

    stopAutoRefresh();

  }
  else {

    startAutoRefresh();

  }


  const reached =
    timelineState(
      orderStatus,
      shippingStatus
    );


  


  /*
    Khung hướng dẫn khách
    tiếp tục theo dõi trên SPX.
  */

  const spxTrackingBox =
    isSpxHandoff
      ?
        `

          <div
            style="
              margin-top:14px;
              padding:14px;
              border-radius:13px;
              border:1px solid rgba(216,255,69,.20);
              background:rgba(216,255,69,.045);
            "
          >

            <div
              style="
                color:#d8ff45;
                font-size:10px;
                font-weight:950;
                letter-spacing:.05em;
              "
            >
              🚚 TIẾP TỤC THEO DÕI ĐƠN HÀNG TRÊN SPX
            </div>


            <div
              style="
                margin-top:6px;
                color:rgba(255,255,255,.48);
                font-size:9px;
                line-height:1.55;
              "
            >
              PickDee đã bàn giao đơn hàng cho
              SPX Shopee Express.
              Từ thời điểm này, hành trình vận chuyển
              sẽ được cập nhật trực tiếp trên hệ thống SPX.
              Anh/chị có thể tiếp tục theo dõi đơn hàng
              bằng mã vận đơn ở phía trên.
            </div>


            <button
              id="openSpxTrackingBtn"
              class="refresh-btn"
              type="button"
              style="
                margin-top:12px;
              "
            >
              🚚 THEO DÕI ĐƠN TRÊN SPX
            </button>


            <div
              style="
                margin-top:8px;
                color:rgba(255,255,255,.36);
                font-size:8px;
                line-height:1.5;
                text-align:center;
              "
            >
              PickDee sẽ tự copy mã vận đơn.
              Khi trang SPX mở, anh/chị chỉ cần dán mã
              vào ô tra cứu vận đơn để tiếp tục theo dõi.
            </div>

          </div>

        `
      :
        "";


  page.innerHTML = `

    <div class="card">

      <div class="order-code-label">
        Mã đơn hàng
      </div>


      <div class="order-code">
        ${escapeHtml(
          data.order_code
        )}
      </div>


      <div class="created">
        Đặt lúc ${escapeHtml(
          formatTime(
            data.created_at
          )
        )}
      </div>

    </div>



    <div class="card">

      <div class="section-title">
        Hành trình đơn hàng
      </div>


      <div class="timeline">

        ${timelineItem(
          1,
          reached,
          "Đã đặt hàng",
          "PickDee đã nhận được đơn hàng của bạn."
        )}


        ${timelineItem(
          2,
          reached,
          "PickDee đã xác nhận",
          "Đơn hàng đã được xác nhận để xử lý."
        )}


        ${timelineItem(
          3,
          reached,
          "Đang đóng gói",
          "PickDee đang chuẩn bị sản phẩm."
        )}


        ${timelineItem(
          4,
          reached,
          "Đã giao cho đơn vị vận chuyển",
          isSpxHandoff
            ?
              "PickDee đã bàn giao đơn hàng cho SPX. Anh/chị tiếp tục theo dõi hành trình trên hệ thống của SPX."
            :
              "Đơn hàng đã được bàn giao cho đơn vị vận chuyển."
        )}


      

      </div>

    </div>



    <div class="card">

      <div class="section-title">
        Thông tin vận chuyển
      </div>


      <div class="shipping-grid">

        <div class="shipping-row">

          <div class="shipping-label">
            Trạng thái
          </div>


          <div class="shipping-value">
            ${escapeHtml(
              shippingLabel(
                shippingStatus
              )
            )}
          </div>

        </div>



        <div class="shipping-row">

          <div class="shipping-label">
            Đơn vị vận chuyển
          </div>


          <div class="shipping-value">
            ${escapeHtml(
              providerLabel(
                data.shipping_provider
              )
            )}
          </div>

        </div>



        <div class="shipping-row">

          <div class="shipping-label">
            Mã vận đơn
          </div>


          <div
            id="trackingCodeText"
            class="shipping-value tracking-code"
          >
            ${
              data.tracking_code
                ?
                  escapeHtml(
                    data.tracking_code
                  )
                :
                  "Chưa có mã vận đơn"
            }
          </div>


          ${
            data.tracking_code
              ?
                `

                  <button
                    id="copyTrackingBtn"
                    class="copy-btn"
                    type="button"
                  >
                    COPY MÃ VẬN ĐƠN
                  </button>

                `
              :
                ""
          }

        </div>

      </div>


      ${spxTrackingBox}

    </div>


   ${

  isSpxHandoff

    ?

      `

        <div class="note">
          Đơn hàng vẫn tiếp tục được vận chuyển sau khi
          PickDee bàn giao. Anh/chị theo dõi các chặng
          tiếp theo trực tiếp trên SPX.
        </div>

      `

    :

      `

        <div class="note">
          Trạng thái đơn hàng được tự động cập nhật mỗi 30 giây.
          Anh/chị không cần thao tác cập nhật thủ công.
        </div>

      `

}

  `;



  /* =====================================================
     COPY MÃ VẬN ĐƠN
  ====================================================== */

  const copyBtn =
    document.getElementById(
      "copyTrackingBtn"
    );


  if (
    copyBtn
    &&
    data.tracking_code
  ) {

    copyBtn.addEventListener(
      "click",
      async function () {

        try {

          await navigator.clipboard.writeText(
            data.tracking_code
          );


          copyBtn.textContent =
            "ĐÃ COPY";


          setTimeout(
            function () {

              copyBtn.textContent =
                "COPY MÃ VẬN ĐƠN";

            },
            1200
          );

        }
        catch (_) {

          window.prompt(
            "Copy mã vận đơn:",
            data.tracking_code
          );

        }

      }
    );

  }



  /* =====================================================
     MỞ SPX

     - Copy mã vận đơn.
     - Mở website chính thức SPX.
  ====================================================== */

  const openSpxTrackingBtn =
    document.getElementById(
      "openSpxTrackingBtn"
    );


  if (
    openSpxTrackingBtn
    &&
    data.tracking_code
  ) {

    openSpxTrackingBtn.addEventListener(
      "click",
      function () {

        if (
          navigator.clipboard
          &&
          navigator.clipboard.writeText
        ) {

          navigator.clipboard
            .writeText(
              data.tracking_code
            )
            .catch(
              function () {}
            );

        }


        window.open(
          "https://spx.vn/vi",
          "_blank",
          "noopener,noreferrer"
        );

      }
    );

  }



  
}

  async function loadOrder() {

    if (
      !token
      ||
      token.length < 32
    ) {

      renderError(
        "Link theo dõi đơn hàng không hợp lệ."
      );

      return;

    }


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "shop_public_track_order",
          {
            p_token:
              token
          }
        );


      if (error) {
        throw error;
      }


      if (
        !data
        ||
        data.success !== true
      ) {

        renderError(
          data?.message
          ||
          "Không tìm thấy đơn hàng."
        );

        return;

      }


      renderOrder(
        data
      );

    }
    catch (error) {

      console.error(
        "TRACK ORDER ERROR:",
        error
      );


      renderError(
        "Không tải được trạng thái đơn hàng. Anh/chị vui lòng thử lại."
      );

    }

  }


  loadOrder();

})();

</script>

    line-height: 1.5;

  .pickdee-track-cancel-btn {
    width: 100%;

    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid rgba(255,90,90,.35);
    background: rgba(255,90,90,.12);
    color: #ffb0b0;
    text-decoration: none;
    font-size: 11px;
    font-weight: 950;
    touch-action: manipulation;

</style>

<script>
  (function () {

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getOrderCodeFromPage() {
      const text =
        document.body?.innerText || "";

      const match =
        text.match(/PD-\d{4,}/i);

      return match
        ? String(match[0]).trim().toUpperCase()
        : "";
    }

    function canShowCancelButton() {
      const text =
        normalizeText(
          document.body?.innerText || ""
        );

      const blockedWords = [
        "da thanh toan",
        "da xac nhan thanh toan",
        "dang giao",
        "dang van chuyen",
        "da giao",
        "hoan tat",
        "da huy",
        "don hang nay da duoc huy",
        "cancelled",
        "completed",
        "shipping"
      ];

      return !blockedWords.some(function (word) {
        return text.includes(word);
      });
    }

    function findInsertTarget() {
      return (
        document.querySelector("#page")
        ||
        document.querySelector("#orderDetail")
        ||
        document.querySelector(".card")
        ||
        document.querySelector("main section:last-of-type")
        ||
        document.querySelector("main")
        ||
        document.body
      );
    }

    function ensureTrackCancelButton() {
      const oldBox =
        document.getElementById(
          "pickdeeTrackCancelBox"
        );

      const orderCode =
        getOrderCodeFromPage();

      if (
        !orderCode
        ||
        !canShowCancelButton()
      ) {

        if (oldBox) {
          oldBox.remove();
        }

        return;

      }

      const cancelUrl =
        "./shop-cancel-order?code="
        +
        encodeURIComponent(orderCode);

      if (oldBox) {

        const oldLink =
          oldBox.querySelector("a");

        if (oldLink) {
          oldLink.href = cancelUrl;
        }

        return;

      }

      const box =
        document.createElement("div");

      box.id =
        "pickdeeTrackCancelBox";

      box.className =
        "pickdee-track-cancel-box";

      box.innerHTML =
        `
          <div class="pickdee-track-cancel-note">
            Muốn hủy đơn? Chỉ hủy tự động được khi đơn chưa thanh toán và chưa giao hàng.
          </div>

          <a
            class="pickdee-track-cancel-btn"
            href="${cancelUrl}"
          >
            HỦY ĐƠN HÀNG
          </a>
        `;

      findInsertTarget()
        .appendChild(box);
    }

    function startTrackCancelWatcher() {
      ensureTrackCancelButton();

      let count = 0;

      const timer =
        window.setInterval(function () {
          ensureTrackCancelButton();

          count += 1;

          if (count >= 25) {
            window.clearInterval(timer);
          }
        }, 500);

      new MutationObserver(
        ensureTrackCancelButton
      ).observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        startTrackCancelWatcher
      );
    } else {
      startTrackCancelWatcher();
    }

  })();
</script>
