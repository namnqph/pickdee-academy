<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071523"
  >

  <title>Chi tiết sản phẩm | PickDee Shop</title>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #071523;
      color: #ffffff;

      padding-bottom:
        calc(90px + env(safe-area-inset-bottom));
    }

    a {
      color: inherit;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      min-height: 64px;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(7,21,35,.95);

      backdrop-filter:
        blur(14px);
    }


    .header-inner {
      width:
        min(1080px, calc(100% - 24px));

      min-height: 64px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }


    .brand {
      text-decoration: none;

      font-size: 21px;
      font-weight: 950;

      letter-spacing: -.04em;
    }


    .brand span {
      color: #d8ff45;
    }


    .cart-link {
      min-height: 39px;

      padding:
        0 11px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      border:
        1px solid rgba(216,255,69,.35);

      color: #d8ff45;

      text-decoration: none;

      font-size: 12px;
      font-weight: 900;
    }


    .cart-count {
      min-width: 20px;
      height: 20px;

      margin-left: 6px;

      padding:
        0 5px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: #d8ff45;
      color: #071523;

      font-size: 10px;
      font-weight: 950;
    }


    /* =====================================================
       PAGE
    ====================================================== */

    main {
      width:
        min(1080px, calc(100% - 24px));

      margin:
        14px auto 40px;
    }


    .back {
      display: inline-flex;
      align-items: center;

      min-height: 38px;

      margin-bottom: 10px;

      color:
        rgba(255,255,255,.65);

      text-decoration: none;

      font-size: 12px;
      font-weight: 850;
    }


    .product-layout {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(0,.88fr);

      gap: 26px;

      align-items: start;
    }


    /* =====================================================
       ẢNH
    ====================================================== */

    .gallery {
      min-width: 0;
    }


    .main-image {
      width: 100%;

      height:
        min(520px, 62vh);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        #0d1d2f;
    }


    .main-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    .image-placeholder {
      color:
        rgba(255,255,255,.22);

      text-align: center;

      font-size: 54px;
    }


    .image-placeholder span {
      display: block;

      margin-top: 10px;

      font-size: 12px;
      font-weight: 800;
    }


    .thumbs {
      display: flex;

      gap: 8px;

      margin-top: 9px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .thumbs::-webkit-scrollbar {
      display: none;
    }


    .thumb {
      flex: 0 0 60px;

      width: 60px;
      height: 60px;

      padding: 3px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.11);

      background:
        #0d1d2f;

      cursor: pointer;

      overflow: hidden;
    }


    .thumb.active {
      border-color:
        #d8ff45;
    }


    .thumb img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =====================================================
       INFO
    ====================================================== */

    .info {
      padding:
        20px;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        #0d1d2f;
    }


    .brand-name {
      margin-bottom: 6px;

      color:
        #d8ff45;

      font-size: 11px;
      font-weight: 950;

      letter-spacing: .09em;

      text-transform: uppercase;
    }


    h1 {
      margin:
        0 0 10px;

      font-size:
        clamp(25px,4vw,38px);

      line-height: 1.08;

      letter-spacing: -.035em;
    }


    .short-description {
      margin:
        0 0 16px;

      color:
        rgba(255,255,255,.62);

      font-size: 14px;

      line-height: 1.55;
    }


    .price-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;

      gap: 8px;

      margin:
        6px 0 16px;
    }


    .price {
      color:
        #d8ff45;

      font-size: 28px;
      font-weight: 950;

      letter-spacing: -.025em;
    }


    .compare-price {
      color:
        rgba(255,255,255,.35);

      font-size: 14px;

      text-decoration: line-through;
    }


    .trust {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 19px;
    }


    .trust span {
      padding:
        7px 9px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.09);

      color:
        rgba(255,255,255,.75);

      font-size: 10px;
      font-weight: 900;
    }


    /* =====================================================
       VARIANT
    ====================================================== */

    .section-label {
      margin-bottom: 8px;

      color:
        rgba(255,255,255,.55);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: .06em;
    }


    .variants {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 18px;
    }


    .variant-btn {
      min-height: 40px;

      padding:
        0 13px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.04);

      color: #ffffff;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }


    .variant-btn.active {
      color: #071523;

      background: #d8ff45;

      border-color: #d8ff45;
    }


    /* =====================================================
       QUANTITY
    ====================================================== */

    .quantity-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin:
        5px 0 18px;
    }


   .quantity {
  display: inline-grid;

  grid-template-columns:
    42px 82px 42px;

  min-height: 42px;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius: 11px;

  overflow: hidden;
}


.quantity button {
  border: 0;

  background:
    rgba(255,255,255,.05);

  color: #ffffff;

  font-size: 21px;

  cursor: pointer;
}


.quantity input {
  width: 82px;
  min-width: 0;
  height: 42px;

  padding: 0 6px;

  border: 0;
  border-left:
    1px solid rgba(255,255,255,.08);
  border-right:
    1px solid rgba(255,255,255,.08);

  border-radius: 0;

  outline: none;

  background: transparent;

  color: #ffffff;

  text-align: center;

  font-family: inherit;
  font-size: 16px;
  font-weight: 950;

  appearance: textfield;
  -moz-appearance: textfield;
}


.quantity input::-webkit-inner-spin-button,
.quantity input::-webkit-outer-spin-button {
  margin: 0;
  -webkit-appearance: none;
}


.wholesale-hint {
  margin:
    -7px 0 18px;

  padding: 10px 11px;

  border-radius: 11px;

  border:
    1px solid rgba(216,255,69,.18);

  background:
    rgba(216,255,69,.055);

  color:
    rgba(255,255,255,.72);

  font-size: 11px;
  font-weight: 800;

  line-height: 1.45;
}


.wholesale-hint strong {
  color: #d8ff45;
}

    /* =====================================================
       DESCRIPTION
    ====================================================== */

    .description {
      margin-top: 18px;

      padding-top: 17px;

      border-top:
        1px solid rgba(255,255,255,.08);
    }


    .description-title {
      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 950;
    }


    .description-text {
      color:
        rgba(255,255,255,.62);

      font-size: 13px;

      line-height: 1.65;

      white-space: pre-line;
    }


    /* =====================================================
       MOBILE BOTTOM BUY BAR
    ====================================================== */

    .buy-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding:
        9px 12px
        calc(9px + env(safe-area-inset-bottom));

      background:
        rgba(7,21,35,.97);

      border-top:
        1px solid rgba(255,255,255,.10);

      backdrop-filter:
        blur(15px);
    }


    .buy-bar-inner {
      width:
        min(1080px,100%);

      margin: auto;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(180px,330px);

      gap: 10px;

      align-items: center;
    }


    .bottom-price-label {
      color:
        rgba(255,255,255,.45);

      font-size: 10px;

      font-weight: 800;
    }


    .bottom-price {
      margin-top: 2px;

      color:
        #d8ff45;

      font-size: 19px;

      font-weight: 950;
    }


    .add-cart {
      min-height: 50px;

      border: 0;

      border-radius: 12px;

      cursor: pointer;

      background:
        #d8ff45;

      color:
        #071523;

      font-size: 13px;
      font-weight: 950;
    }


    .add-cart:active {
      transform:
        scale(.985);
    }


    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        60px 20px;

      text-align: center;

      color:
        rgba(255,255,255,.55);
    }


    .state strong {
      display: block;

      margin-bottom: 8px;

      color: #ffffff;

      font-size: 19px;
    }


    /* =====================================================
       TOAST
    ====================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom:
        calc(84px + env(safe-area-inset-bottom));

      z-index: 200;

      transform:
        translate(-50%,20px);

      max-width:
        calc(100% - 30px);

      padding:
        11px 16px;

      border-radius: 999px;

      background:
        #ffffff;

      color:
        #071523;

      font-size: 12px;
      font-weight: 900;

      opacity: 0;

      pointer-events: none;

      transition:
        .2s ease;
    }


    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:720px) {

      main {
        margin-top: 8px;
      }


      .product-layout {
        grid-template-columns:
          1fr;

        gap: 12px;
      }


      /*
        QUAN TRỌNG:
        Ảnh trên điện thoại KHÔNG chiếm quá nhiều màn hình.
      */
      .main-image {
        height:
          min(36vh,310px);

        min-height:
          230px;

        border-radius: 16px;
      }


      .info {
        padding:
          16px;

        border-radius: 16px;
      }


      h1 {
        font-size:
          25px;
      }


      .price {
        font-size:
          25px;
      }


      .thumb {
        flex-basis: 54px;

        width: 54px;
        height: 54px;
      }


      .buy-bar-inner {
        grid-template-columns:
          .72fr 1.28fr;
      }

    }


    @media(max-width:380px) {

      .main-image {
        height:
          min(34vh,270px);

        min-height:
          210px;
      }


      .header-inner,
      main {
        width:
          calc(100% - 18px);
      }

    }

  </style>

</head>



<body>


<header
  class="header"
  id="shopPublicHeader"
></header>

<script src="./shop-public-nav.js"></script>



<main>


  <a
    href="./shop"
    class="back"
  >
    ← QUAY LẠI SHOP
  </a>


  <div
    id="pageContent"
  >

    <div class="state">

      <strong>
        Đang tải sản phẩm...
      </strong>

      Vui lòng chờ trong giây lát.

    </div>

  </div>


</main>



<div
  id="buyBar"
  class="buy-bar"
  style="display:none;"
>

  <div class="buy-bar-inner">

    <div>

      <div class="bottom-price-label">
  TẠM TÍNH
</div>

      <div
        id="bottomPrice"
        class="bottom-price"
      >
        -
      </div>

    </div>


    <button
      id="addCartBtn"
      class="add-cart"
      type="button"
    >
      THÊM VÀO GIỎ
    </button>

  </div>

</div>



<div
  id="toast"
  class="toast"
>
  ✓ Đã thêm vào giỏ hàng
</div>



<script>

(function () {


  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const pageContent =
    document.getElementById(
      "pageContent"
    );


  const buyBar =
    document.getElementById(
      "buyBar"
    );


  const bottomPrice =
    document.getElementById(
      "bottomPrice"
    );


  const addCartBtn =
    document.getElementById(
      "addCartBtn"
    );


  const cartCount =
    document.getElementById(
      "cartCount"
    );


  const toast =
    document.getElementById(
      "toast"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showError(
      "Không tải được hệ thống Shop."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     STATE
  ====================================================== */

  let product = null;

  let variants = [];

  let images = [];

  let selectedVariant = null;

  let quantity = 1;



  /* =====================================================
     PARAM
  ====================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const productId =
    params.get(
      "id"
    );


  if (!productId) {

    showError(
      "Không tìm thấy sản phẩm."
    );

    return;

  }



  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }


  function imageUrl(path) {

    if (!path) {
      return "";
    }


    const {
      data
    } =
      sb.storage
        .from(
          "shop-products"
        )
        .getPublicUrl(
          path
        );


    return (
      data?.publicUrl || ""
    );

  }



  /* =====================================================
     CART COUNT
  ====================================================== */

  function readCart() {

    try {

      const cart =
        JSON.parse(
          localStorage.getItem(
            "pickdee_shop_cart"
          )
          ||
          "[]"
        );


      return Array.isArray(cart)
        ?
          cart
        :
          [];

    }
    catch (_) {

      return [];

    }

  }


function updateCartCount() {

  const cart =
    readCart();


  const uniqueVariantIds =
    new Set(
      cart
        .filter(
          function (item) {

            return (
              item
              &&
              item.variant_id != null
            );

          }
        )
        .map(
          function (item) {

            return String(
              item.variant_id
            );

          }
        )
    );


  cartCount.textContent =
    String(
      uniqueVariantIds.size
    );

}



  /* =====================================================
     TOAST
  ====================================================== */

  let toastTimer = null;


  function showToast() {

    clearTimeout(
      toastTimer
    );


    toast.classList.add(
      "show"
    );


    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            "show"
          );

        },
        1800
      );

  }



  /* =====================================================
     ERROR
  ====================================================== */

  function showError(message) {

    pageContent.innerHTML = `
      <div class="state">

        <strong>
          Không mở được sản phẩm
        </strong>

        ${escapeHtml(message)}

      </div>
    `;


    buyBar.style.display =
      "none";

  }



  /* =====================================================
     RENDER
  ====================================================== */

 function renderProduct() {

  selectedVariant =
    selectedVariant
    ||
    variants[0]
    ||
    null;


  if (!selectedVariant) {

    showError(
      "Sản phẩm chưa có giá bán."
    );

    return;

  }


  const sortedImages =
    [...images]
      .sort(
        function (a,b) {

          if (
            Boolean(a.is_primary)
            !==
            Boolean(b.is_primary)
          ) {

            return (
              a.is_primary
                ? -1
                : 1
            );

          }


          return (
            Number(a.sort_order || 0)
            -
            Number(b.sort_order || 0)
          );

        }
      );


  const firstImage =
    sortedImages[0]
    ||
    null;


  const firstUrl =
    firstImage
      ?
        imageUrl(
          firstImage.storage_path
        )
      :
        "";


  /*
    =====================================================
    PHÂN TÁCH OPTION
    =====================================================
  */

  const option1Variant =
    variants.find(
      function (variant) {

        return (
          variant.option1_name
          &&
          variant.option1_value
        );

      }
    )
    ||
    null;


  const option2Variant =
    variants.find(
      function (variant) {

        return (
          variant.option2_name
          &&
          variant.option2_value
        );

      }
    )
    ||
    null;


  const option1Name =
    option1Variant?.option1_name
    ||
    "";


  const option2Name =
    option2Variant?.option2_name
    ||
    "";


  const option1Values =
    [
      ...new Set(
        variants
          .map(
            function (variant) {

              return (
                variant.option1_value
                ||
                ""
              );

            }
          )
          .filter(Boolean)
      )
    ];


  const option2Values =
    [
      ...new Set(
        variants
          .map(
            function (variant) {

              return (
                variant.option2_value
                ||
                ""
              );

            }
          )
          .filter(Boolean)
      )
    ];


  const hasStructuredOptions =
    (
      option1Values.length > 0
      ||
      option2Values.length > 0
    );


  /*
    =====================================================
    OPTION 1 BUTTONS
    =====================================================
  */

  const option1Buttons =
    option1Values
      .map(
        function (value) {

          const active =
            String(
              selectedVariant?.option1_value
              ||
              ""
            )
            ===
            String(value);


          return `
            <button
              class="variant-btn option-btn ${
                active
                  ?
                    "active"
                  :
                    ""
              }"
              type="button"
              data-option-index="1"
              data-option-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>
          `;

        }
      )
      .join("");


  /*
    =====================================================
    OPTION 2 BUTTONS
    =====================================================
  */

  const option2Buttons =
    option2Values
      .map(
        function (value) {

          const active =
            String(
              selectedVariant?.option2_value
              ||
              ""
            )
            ===
            String(value);


          return `
            <button
              class="variant-btn option-btn ${
                active
                  ?
                    "active"
                  :
                    ""
              }"
              type="button"
              data-option-index="2"
              data-option-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>
          `;

        }
      )
      .join("");


  /*
    =====================================================
    SẢN PHẨM CŨ KHÔNG CÓ OPTION1 / OPTION2
    =====================================================
  */

  const legacyVariantButtons =
    !hasStructuredOptions
      ?
        variants
          .map(
            function (variant) {

              const active =
                String(
                  selectedVariant.id
                )
                ===
                String(
                  variant.id
                );


              return `
                <button
                  class="variant-btn legacy-variant-btn ${
                    active
                      ?
                        "active"
                      :
                        ""
                  }"
                  type="button"
                  data-variant-id="${variant.id}"
                >
                  ${
                    escapeHtml(
                      variant.variant_name
                      ||
                      "Mặc định"
                    )
                  }
                </button>
              `;

            }
          )
          .join("")
      :
        "";


  /*
    =====================================================
    HTML PHẦN LỰA CHỌN
    =====================================================
  */

  let variantSelectionHtml =
    "";


  if (hasStructuredOptions) {

    if (
      option1Name
      &&
      option1Values.length
    ) {

      variantSelectionHtml += `
        <div class="section-label">
          ${escapeHtml(
            String(option1Name)
              .toUpperCase()
          )}
        </div>

        <div class="variants">
          ${option1Buttons}
        </div>
      `;

    }


    if (
      option2Name
      &&
      option2Values.length
    ) {

      variantSelectionHtml += `
        <div class="section-label">
          ${escapeHtml(
            String(option2Name)
              .toUpperCase()
          )}
        </div>

        <div class="variants">
          ${option2Buttons}
        </div>
      `;

    }

  }
  else if (
    variants.length > 1
  ) {

    variantSelectionHtml = `
      <div class="section-label">
        LỰA CHỌN
      </div>

      <div class="variants">
        ${legacyVariantButtons}
      </div>
    `;

  }


  /*
    =====================================================
    THUMBNAILS
    =====================================================
  */

  const thumbnails =
    sortedImages
      .map(
        function (image,index) {

          const url =
            imageUrl(
              image.storage_path
            );


          return `
            <button
              type="button"
              class="thumb ${
                index === 0
                  ?
                    "active"
                  :
                    ""
              }"
              data-image="${escapeHtml(url)}"
            >

              <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(
                  image.alt_text
                  ||
                  product.name
                )}"
              >

            </button>
          `;

        }
      )
      .join("");


  /*
    =====================================================
    RENDER PAGE
    =====================================================
  */

  pageContent.innerHTML = `

    <div class="product-layout">


      <div class="gallery">

        <div
          id="mainImage"
          class="main-image"
        >

          ${
            firstUrl
            ?
              `
                <img
                  src="${escapeHtml(firstUrl)}"
                  alt="${escapeHtml(product.name)}"
                >
              `
            :
              `
                <div class="image-placeholder">

                  🏓

                  <span>
                    Ảnh sản phẩm đang cập nhật
                  </span>

                </div>
              `
          }

        </div>


        ${
          thumbnails
          ?
            `
              <div class="thumbs">
                ${thumbnails}
              </div>
            `
          :
            ""
        }

      </div>



      <section class="info">


        <div class="brand-name">
          ${
            escapeHtml(
              product.brand
              ||
              "PICKDEE HÀNG TUYỂN"
            )
          }
        </div>


        <h1>
          ${escapeHtml(product.name)}
        </h1>


        ${
          product.short_description
          ?
            `
              <p class="short-description">
                ${escapeHtml(
                  product.short_description
                )}
              </p>
            `
          :
            ""
        }


        <div class="price-line">

          <span
            id="mainPrice"
            class="price"
          >
            ${money(selectedVariant.price)}
          </span>


          <span
            id="comparePrice"
            class="compare-price"
            style="${
              selectedVariant.compare_at_price
              &&
              Number(
                selectedVariant.compare_at_price
              )
              >
              Number(
                selectedVariant.price
              )
                ?
                  ""
                :
                  "display:none;"
            }"
          >
            ${
              selectedVariant.compare_at_price
                ?
                  money(
                    selectedVariant.compare_at_price
                  )
                :
                  ""
            }
          </span>

        </div>


        <div class="trust">

          <span>
            ✓ HÀNG TUYỂN
          </span>

          <span>
            ✓ CHỌN LỌC KỸ
          </span>

          <span>
            🚚 GIAO TOÀN QUỐC
          </span>

        </div>


        ${variantSelectionHtml}


        <div class="quantity-row">

          <div class="section-label">
            SỐ LƯỢNG
          </div>


          <div class="quantity">

            <button
              id="minusBtn"
              type="button"
            >
              −
            </button>


            <input
              id="quantityInput"
              type="number"
              min="1"
              max="9999"
              step="1"
              inputmode="numeric"
              value="${quantity}"
            >


            <button
              id="plusBtn"
              type="button"
            >
              +
            </button>

          </div>

        </div>


        <div
          id="wholesaleHint"
          class="wholesale-hint"
          style="display:none;"
        ></div>


        ${
          product.description
          ?
            `
              <div class="description">

                <div class="description-title">
                  Thông tin sản phẩm
                </div>

                <div class="description-text">
                  ${escapeHtml(
                    product.description
                  )}
                </div>

              </div>
            `
          :
            ""
        }


      </section>


    </div>
  `;


  document.title =
    `${product.name} | PickDee Shop`;


  buyBar.style.display =
    "block";


  updateDisplayedPrice();

  bindProductEvents();

}



/* =====================================================
   PRICE
====================================================== */

async function updateDisplayedPrice() {

  if (!selectedVariant) {
    return;
  }


  const mainPrice =
    document.getElementById(
      "mainPrice"
    );


  const comparePrice =
    document.getElementById(
      "comparePrice"
    );


  const wholesaleHint =
    document.getElementById(
      "wholesaleHint"
    );


  const retailPrice =
    Number(
      selectedVariant.price
      ||
      0
    );


  const requestSeq =
    (
      updateDisplayedPrice._seq
      ||
      0
    )
    +
    1;


  updateDisplayedPrice._seq =
    requestSeq;


  let quote =
    null;


  try {

    const {
      data,
      error
    } =
      await sb.rpc(
        "shop_price_quote",
        {

          p_variant_id:
            Number(
              selectedVariant.id
            ),

          p_quantity:
            quantity

        }
      );


    if (error) {
      throw error;
    }


    quote =
      data;

  }
  catch (error) {

    console.error(
      "PRICE QUOTE ERROR:",
      error
    );

  }


  if (
    requestSeq
    !==
    updateDisplayedPrice._seq
  ) {

    return;

  }


  const unitPrice =
    Number(
      quote?.unit_price
      ??
      retailPrice
    );


  const subtotal =
    Number(
      quote?.subtotal
      ??
      (
        unitPrice
        *
        quantity
      )
    );


  if (mainPrice) {

    mainPrice.textContent =
      money(
        unitPrice
      );

  }


  bottomPrice.textContent =
    money(
      subtotal
    );


  /*
    GIÁ GẠCH
  */

  if (comparePrice) {

    if (
      quote?.pricing_type
      ===
      "wholesale"
      &&
      retailPrice > unitPrice
    ) {

      comparePrice.style.display =
        "";


      comparePrice.textContent =
        money(
          retailPrice
        );

    }
    else if (
      selectedVariant.compare_at_price
      &&
      Number(
        selectedVariant.compare_at_price
      )
      >
      retailPrice
    ) {

      comparePrice.style.display =
        "";


      comparePrice.textContent =
        money(
          selectedVariant.compare_at_price
        );

    }
    else {

      comparePrice.style.display =
        "none";

    }

  }


  if (!wholesaleHint) {
    return;
  }


  const nextQty =
    Number(
      quote?.quantity_to_next_tier
      ??
      0
    );


  const nextPrice =
    Number(
      quote?.next_tier_price
      ??
      0
    );


  const savings =
    Number(
      quote?.savings
      ??
      0
    );


  if (
    quote?.pricing_type
    ===
    "wholesale"
  ) {

    let html = `
      <strong>
        ✓ ĐÃ ĐẠT GIÁ SỈ
      </strong>
      • ${money(unitPrice)} / sản phẩm
    `;


    if (savings > 0) {

      html += `
        • Tiết kiệm
        <strong>
          ${money(savings)}
        </strong>
        so với giá niêm yết
      `;

    }


    if (
      nextQty > 0
      &&
      nextPrice > 0
    ) {

      html += `
        <br>
        Mua thêm
        <strong>
          ${nextQty}
        </strong>
        sản phẩm để đạt
        <strong>
          ${money(nextPrice)}
        </strong>
        / sản phẩm.
      `;

    }


    wholesaleHint.innerHTML =
      html;


    wholesaleHint.style.display =
      "";

  }
  else if (
    nextQty > 0
    &&
    nextPrice > 0
  ) {

    wholesaleHint.innerHTML = `
      Mua thêm
      <strong>
        ${nextQty}
      </strong>
      sản phẩm để đạt giá sỉ
      <strong>
        ${money(nextPrice)}
      </strong>
      / sản phẩm.
    `;


    wholesaleHint.style.display =
      "";

  }
  else {

    wholesaleHint.innerHTML =
      "";


    wholesaleHint.style.display =
      "none";

  }

}



/* =====================================================
   EVENT
====================================================== */

function bindProductEvents() {

  const minus =
    document.getElementById(
      "minusBtn"
    );


  const plus =
    document.getElementById(
      "plusBtn"
    );


  const quantityInput =
    document.getElementById(
      "quantityInput"
    );


  /*
    =====================================================
    SỐ LƯỢNG
    =====================================================
  */

  function syncQuantityInput() {

    if (quantityInput) {

      quantityInput.value =
        String(
          quantity
        );

    }

  }


  function setQuantity(value) {

    let next =
      Number(value);


    if (
      !Number.isFinite(next)
    ) {

      next =
        1;

    }


    next =
      Math.round(next);


    quantity =
      Math.max(
        1,
        Math.min(
          9999,
          next
        )
      );


    syncQuantityInput();

    updateDisplayedPrice();

  }


  minus?.addEventListener(
    "click",
    function () {

      setQuantity(
        quantity - 1
      );

    }
  );


  plus?.addEventListener(
    "click",
    function () {

      setQuantity(
        quantity + 1
      );

    }
  );


  quantityInput?.addEventListener(
    "input",
    function () {

      const value =
        Number(
          quantityInput.value
        );


      if (
        Number.isInteger(value)
        &&
        value >= 1
        &&
        value <= 9999
      ) {

        quantity =
          value;


        updateDisplayedPrice();

      }

    }
  );


  quantityInput?.addEventListener(
    "change",
    function () {

      setQuantity(
        quantityInput.value
      );

    }
  );


  /*
    =====================================================
    ĐỒNG BỘ NÚT OPTION
    =====================================================
  */

  function syncOptionButtons() {

    document
      .querySelectorAll(
        '[data-option-index="1"]'
      )
      .forEach(
        function (button) {

          button.classList.toggle(
            "active",
            String(
              button.dataset.optionValue
              ||
              ""
            )
            ===
            String(
              selectedVariant?.option1_value
              ||
              ""
            )
          );

        }
      );


    document
      .querySelectorAll(
        '[data-option-index="2"]'
      )
      .forEach(
        function (button) {

          button.classList.toggle(
            "active",
            String(
              button.dataset.optionValue
              ||
              ""
            )
            ===
            String(
              selectedVariant?.option2_value
              ||
              ""
            )
          );

        }
      );


    document
      .querySelectorAll(
        ".legacy-variant-btn"
      )
      .forEach(
        function (button) {

          button.classList.toggle(
            "active",
            String(
              button.dataset.variantId
              ||
              ""
            )
            ===
            String(
              selectedVariant?.id
              ||
              ""
            )
          );

        }
      );

  }


  /*
    =====================================================
    CHỌN OPTION 1 / MÀU
    =====================================================
  */

  document
    .querySelectorAll(
      '[data-option-index="1"]'
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            const value =
              button.dataset.optionValue
              ||
              "";


            const currentOption2 =
              selectedVariant?.option2_value
              ||
              "";


            let nextVariant =
              null;


            if (currentOption2) {

              nextVariant =
                variants.find(
                  function (variant) {

                    return (
                      String(
                        variant.option1_value
                        ||
                        ""
                      )
                      ===
                      String(value)
                      &&
                      String(
                        variant.option2_value
                        ||
                        ""
                      )
                      ===
                      String(currentOption2)
                    );

                  }
                )
                ||
                null;

            }


            if (!nextVariant) {

              nextVariant =
                variants.find(
                  function (variant) {

                    return (
                      String(
                        variant.option1_value
                        ||
                        ""
                      )
                      ===
                      String(value)
                    );

                  }
                )
                ||
                null;

            }


            if (!nextVariant) {
              return;
            }


            selectedVariant =
              nextVariant;


            syncOptionButtons();

            updateDisplayedPrice();

          }
        );

      }
    );


  /*
    =====================================================
    CHỌN OPTION 2 / SIZE
    =====================================================
  */

  document
    .querySelectorAll(
      '[data-option-index="2"]'
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            const value =
              button.dataset.optionValue
              ||
              "";


            const currentOption1 =
              selectedVariant?.option1_value
              ||
              "";


            let nextVariant =
              null;


            if (currentOption1) {

              nextVariant =
                variants.find(
                  function (variant) {

                    return (
                      String(
                        variant.option1_value
                        ||
                        ""
                      )
                      ===
                      String(currentOption1)
                      &&
                      String(
                        variant.option2_value
                        ||
                        ""
                      )
                      ===
                      String(value)
                    );

                  }
                )
                ||
                null;

            }


            if (!nextVariant) {

              nextVariant =
                variants.find(
                  function (variant) {

                    return (
                      String(
                        variant.option2_value
                        ||
                        ""
                      )
                      ===
                      String(value)
                    );

                  }
                )
                ||
                null;

            }


            if (!nextVariant) {
              return;
            }


            selectedVariant =
              nextVariant;


            syncOptionButtons();

            updateDisplayedPrice();

          }
        );

      }
    );


  /*
    =====================================================
    VARIANT CŨ
    =====================================================
  */

  document
    .querySelectorAll(
      ".legacy-variant-btn"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            const id =
              button.dataset.variantId;


            const nextVariant =
              variants.find(
                function (variant) {

                  return (
                    String(
                      variant.id
                    )
                    ===
                    String(id)
                  );

                }
              )
              ||
              null;


            if (!nextVariant) {
              return;
            }


            selectedVariant =
              nextVariant;


            syncOptionButtons();

            updateDisplayedPrice();

          }
        );

      }
    );


  /*
    =====================================================
    GALLERY
    =====================================================
  */

  document
    .querySelectorAll(
      ".thumb"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            const url =
              button.dataset.image;


            const mainImage =
              document.getElementById(
                "mainImage"
              );


            if (
              url
              &&
              mainImage
            ) {

              mainImage.innerHTML = `
                <img
                  src="${escapeHtml(url)}"
                  alt="${escapeHtml(product.name)}"
                >
              `;

            }


            document
              .querySelectorAll(
                ".thumb"
              )
              .forEach(
                function (item) {

                  item.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );

          }
        );

      }
    );

}

  /* =====================================================
     ADD CART
  ====================================================== */

  async function addToCart() {

  if (
    !product
    ||
    !selectedVariant
  ) {

    return;

  }


  addCartBtn.disabled =
    true;


  const oldText =
    addCartBtn.textContent;


  addCartBtn.textContent =
    "ĐANG THÊM...";


  try {

    const cart =
      readCart();


    const existing =
      cart.find(
        function (item) {

          return (
            String(
              item.variant_id
            )
            ===
            String(
              selectedVariant.id
            )
          );

        }
      );


    const currentQty =
      existing
        ?
          Number(
            existing.quantity || 0
          )
        :
          0;


    const finalQuantity =
      Math.min(
        9999,
        currentQty
        +
        quantity
      );


    const {
      data: quote,
      error: quoteError
    } =
      await sb.rpc(
        "shop_price_quote",
        {

          p_variant_id:
            Number(
              selectedVariant.id
            ),

          p_quantity:
            finalQuantity

        }
      );


    if (quoteError) {
      throw quoteError;
    }


    const effectivePrice =
      Number(
        quote?.unit_price
        ??
        selectedVariant.price
      );


    const primaryImage =
      [...images]
        .sort(
          function (a,b) {

            return (
              Number(
                b.is_primary
              )
              -
              Number(
                a.is_primary
              )
            );

          }
        )[0]
        ||
        null;


    const selectedImageUrl =
      primaryImage
        ?
          imageUrl(
            primaryImage.storage_path
          )
        :
          "";


    if (existing) {

      existing.quantity =
        finalQuantity;


      existing.price =
        effectivePrice;


      existing.retail_price =
        Number(
          selectedVariant.price
        );

    }
    else {

      cart.push({

        product_id:
          product.id,

        variant_id:
          selectedVariant.id,

        product_name:
          product.name,

        variant_name:
          selectedVariant.variant_name
          ||
          "",

        price:
          effectivePrice,

        retail_price:
          Number(
            selectedVariant.price
          ),

        quantity:
          finalQuantity,

        image_url:
          selectedImageUrl

      });

    }


    localStorage.setItem(
      "pickdee_shop_cart",
      JSON.stringify(cart)
    );


    updateCartCount();

    showToast();

  }
  catch (error) {

    console.error(
      "ADD CART PRICE ERROR:",
      error
    );


    alert(
      "Chưa thêm được sản phẩm vào giỏ. Anh vui lòng thử lại."
    );

  }
  finally {

    addCartBtn.disabled =
      false;


    addCartBtn.textContent =
      oldText;

  }

}


  addCartBtn.addEventListener(
    "click",
    addToCart
  );



  /* =====================================================
     LOAD
  ====================================================== */

  async function loadProduct() {

    try {


      const [
        productResult,
        variantsResult,
        imagesResult
      ] =
        await Promise.all([


          sb
            .from(
              "shop_products"
            )
            .select(
              "id,name,slug,brand,short_description,description,status"
            )
            .eq(
              "id",
              productId
            )
            .eq(
              "status",
              "active"
            )
            .single(),


          sb
            .from(
              "shop_product_variants"
            )
            .select(
              "id,product_id,sku,variant_name,option1_name,option1_value,option2_name,option2_value,price,compare_at_price,is_active,sort_order"
            )
            .eq(
              "product_id",
              productId
            )
            .eq(
              "is_active",
              true
            )
            .order(
              "sort_order",
              {
                ascending:
                  true
              }
            ),


          sb
            .from(
              "shop_product_images"
            )
            .select(
              "id,product_id,variant_id,storage_path,alt_text,sort_order,is_primary"
            )
            .eq(
              "product_id",
              productId
            )
            .order(
              "sort_order",
              {
                ascending:
                  true
              }
            )


        ]);


      if (productResult.error) {

        console.error(
          productResult.error
        );


        throw new Error(
          "Sản phẩm không tồn tại hoặc chưa được mở bán."
        );

      }


      if (variantsResult.error) {

        console.error(
          variantsResult.error
        );


        throw new Error(
          "Không tải được giá sản phẩm."
        );

      }


      if (imagesResult.error) {

        console.error(
          imagesResult.error
        );


        throw new Error(
          "Không tải được ảnh sản phẩm."
        );

      }


      product =
        productResult.data;


      variants =
        variantsResult.data
        ||
        [];


      images =
        imagesResult.data
        ||
        [];


      renderProduct();


    }
    catch (error) {


      console.error(
        "PRODUCT ERROR:",
        error
      );


      showError(
        error?.message
        ||
        "Không tải được sản phẩm."
      );

    }

  }



  /* =====================================================
     START
  ====================================================== */

  updateCartCount();

  loadProduct();


})();

</script>
