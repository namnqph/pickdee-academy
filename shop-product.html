<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <meta
    name="theme-color"
    content="#071523"
  >

  <title>Chi tiết sản phẩm | PickDee Shop</title>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js?v=20261019-keep30"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #071523;
      color: #ffffff;

      padding-bottom:
        calc(90px + env(safe-area-inset-bottom));
    }

    a {
      color: inherit;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      min-height: 64px;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(7,21,35,.95);

      backdrop-filter:
        blur(14px);
    }


    .header-inner {
      width:
        min(1080px, calc(100% - 24px));

      min-height: 64px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }


    .brand {
      text-decoration: none;

      font-size: 21px;
      font-weight: 950;

      letter-spacing: -.04em;
    }


    .brand span {
      color: #d8ff45;
    }


    .cart-link {
      min-height: 39px;

      padding:
        0 11px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      border:
        1px solid rgba(216,255,69,.35);

      color: #d8ff45;

      text-decoration: none;

      font-size: 12px;
      font-weight: 900;
    }


    .cart-count {
      min-width: 20px;
      height: 20px;

      margin-left: 6px;

      padding:
        0 5px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: #d8ff45;
      color: #071523;

      font-size: 10px;
      font-weight: 950;
    }


    /* =====================================================
       PAGE
    ====================================================== */

    main {
      width:
        min(1080px, calc(100% - 24px));

      margin:
        14px auto 40px;
    }


    .back {
      display: inline-flex;
      align-items: center;

      min-height: 38px;

      margin-bottom: 10px;

      color:
        rgba(255,255,255,.65);

      text-decoration: none;

      font-size: 12px;
      font-weight: 850;
    }


    .product-layout {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(0,.88fr);

      gap: 26px;

      align-items: start;
    }


    /* =====================================================
       ẢNH
    ====================================================== */

    .gallery {
      min-width: 0;
    }


    .main-image {
      width: 100%;

      height:
        min(520px, 62vh);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        #0d1d2f;
    }


    .main-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    .image-placeholder {
      color:
        rgba(255,255,255,.22);

      text-align: center;

      font-size: 54px;
    }


    .image-placeholder span {
      display: block;

      margin-top: 10px;

      font-size: 12px;
      font-weight: 800;
    }


    .thumbs {
      display: flex;

      gap: 8px;

      margin-top: 9px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .thumbs::-webkit-scrollbar {
      display: none;
    }


    .thumb {
      flex: 0 0 60px;

      width: 60px;
      height: 60px;

      padding: 3px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.11);

      background:
        #0d1d2f;

      cursor: pointer;

      overflow: hidden;
    }


    .thumb.active {
      border-color:
        #d8ff45;
    }


    .thumb img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =====================================================
       INFO
    ====================================================== */

    .info {
      padding:
        20px;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        #0d1d2f;
    }


    .brand-name {
      margin-bottom: 6px;

      color:
        #d8ff45;

      font-size: 11px;
      font-weight: 950;

      letter-spacing: .09em;

      text-transform: uppercase;
    }


    h1 {
      margin:
        0 0 10px;

      font-size:
        clamp(25px,4vw,38px);

      line-height: 1.08;

      letter-spacing: -.035em;
    }


    .short-description {
      margin:
        0 0 16px;

      color:
        rgba(255,255,255,.62);

      font-size: 14px;

      line-height: 1.55;
    }


    .price-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;

      gap: 8px;

      margin:
        6px 0 16px;
    }


    .price {
      color:
        #d8ff45;

      font-size: 28px;
      font-weight: 950;

      letter-spacing: -.025em;
    }


    .compare-price {
      color:
        rgba(255,255,255,.35);

      font-size: 14px;

      text-decoration: line-through;
    }


    .trust {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 19px;
    }


    .trust span {
      padding:
        7px 9px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.09);

      color:
        rgba(255,255,255,.75);

      font-size: 10px;
      font-weight: 900;
    }


    /* =====================================================
       VARIANT
    ====================================================== */

    .section-label {
      margin-bottom: 8px;

      color:
        rgba(255,255,255,.55);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: .06em;
    }


    .variants {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 18px;
    }


    .variant-btn {
      min-height: 40px;

      padding:
        0 13px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.04);

      color: #ffffff;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }


    .variant-btn.has-thumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-left: 5px;
      text-align: left;
    }

    .opt-thumb {
      width: 36px;
      height: 36px;
      flex: none;
      border-radius: 8px;
      object-fit: cover;
      background: #fff;
    }

    .variant-btn.sold-out {
      cursor: not-allowed;
      opacity: .5;
    }

    .variant-btn.sold-out .opt-thumb {
      filter: grayscale(1);
    }

    .variant-btn.sold-out small {
      display: block;
      margin-top: 1px;
      color: #ff9b9b;
      font-size: 10px;
      font-weight: 800;
    }

    .variant-btn.active {
      color: #071523;

      background: #d8ff45;

      border-color: #d8ff45;
    }


    /* =====================================================
       QUANTITY
    ====================================================== */

    .quantity-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin:
        5px 0 18px;
    }


   .quantity {
  display: inline-grid;

  grid-template-columns:
    42px 82px 42px;

  min-height: 42px;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius: 11px;

  overflow: hidden;
}


.quantity button {
  border: 0;

  background:
    rgba(255,255,255,.05);

  color: #ffffff;

  font-size: 21px;

  cursor: pointer;
}


.quantity input {
  width: 82px;
  min-width: 0;
  height: 42px;

  padding: 0 6px;

  border: 0;
  border-left:
    1px solid rgba(255,255,255,.08);
  border-right:
    1px solid rgba(255,255,255,.08);

  border-radius: 0;

  outline: none;

  background: transparent;

  color: #ffffff;

  text-align: center;

  font-family: inherit;
  font-size: 16px;
  font-weight: 950;

  appearance: textfield;
  -moz-appearance: textfield;
}


.quantity input::-webkit-inner-spin-button,
.quantity input::-webkit-outer-spin-button {
  margin: 0;
  -webkit-appearance: none;
}


.wholesale-hint {
  margin:
    -7px 0 18px;

  padding: 10px 11px;

  border-radius: 11px;

  border:
    1px solid rgba(216,255,69,.18);

  background:
    rgba(216,255,69,.055);

  color:
    rgba(255,255,255,.72);

  font-size: 11px;
  font-weight: 800;

  line-height: 1.45;
}


.wholesale-hint strong {
  color: #d8ff45;
}

    /* =====================================================
       DESCRIPTION
    ====================================================== */

    .description {
      margin-top: 18px;

      padding-top: 17px;

      border-top:
        1px solid rgba(255,255,255,.08);
    }


    .description-title {
      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 950;
    }


    .description-text {
      color:
        rgba(255,255,255,.62);

      font-size: 13px;

      line-height: 1.65;

      white-space: pre-line;
    }


    /* =====================================================
       MOBILE BOTTOM BUY BAR
    ====================================================== */

    .buy-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding:
        9px 12px
        calc(9px + env(safe-area-inset-bottom));

      background:
        rgba(7,21,35,.97);

      border-top:
        1px solid rgba(255,255,255,.10);

      backdrop-filter:
        blur(15px);
    }


    .buy-bar-inner {
      width:
        min(1080px,100%);

      margin: auto;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(150px,230px)
        minmax(150px,230px);

      gap: 10px;

      align-items: center;
    }


    .bottom-price-label {
      color:
        rgba(255,255,255,.45);

      font-size: 10px;

      font-weight: 800;
    }


    .bottom-price {
      margin-top: 2px;

      color:
        #d8ff45;

      font-size: 19px;

      font-weight: 950;
    }


    .add-cart,
    .buy-now {
      min-height: 50px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 950;
    }


    .add-cart {
      border: 0;

      background:
        #d8ff45;

      color:
        #071523;
    }


    .buy-now {
      border:
        1px solid rgba(216,255,69,.38);

      background:
        rgba(216,255,69,.10);

      color:
        #d8ff45;
    }


    .add-cart:disabled,
    .buy-now:disabled {
      opacity: .65;

      cursor: not-allowed;
    }


    .add-cart:active,
    .buy-now:active {
      transform:
        scale(.985);
    }


    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        60px 20px;

      text-align: center;

      color:
        rgba(255,255,255,.55);
    }


    .state strong {
      display: block;

      margin-bottom: 8px;

      color: #ffffff;

      font-size: 19px;
    }


    /* =====================================================
       TOAST
    ====================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom:
        calc(84px + env(safe-area-inset-bottom));

      z-index: 200;

      transform:
        translate(-50%,20px);

      max-width:
        calc(100% - 30px);

      padding:
        11px 16px;

      border-radius: 999px;

      background:
        #ffffff;

      color:
        #071523;

      font-size: 12px;
      font-weight: 900;

      opacity: 0;

      pointer-events: none;

      transition:
        .2s ease;
    }


    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0);
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:720px) {

      main {
        margin-top: 8px;
      }


      .product-layout {
        grid-template-columns:
          1fr;

        gap: 12px;
      }


      /*
        QUAN TRỌNG:
        Ảnh trên điện thoại KHÔNG chiếm quá nhiều màn hình.
      */
      .main-image {
        height:
          min(36vh,310px);

        min-height:
          230px;

        border-radius: 16px;
      }


      .info {
        padding:
          16px;

        border-radius: 16px;
      }


      h1 {
        font-size:
          25px;
      }


      .price {
        font-size:
          25px;
      }


      .thumb {
        flex-basis: 54px;

        width: 54px;
        height: 54px;
      }

      .buy-bar-inner {
        grid-template-columns:
          1fr 1fr;

        gap: 8px;
      }


      .buy-bar-price {
        grid-column:
          1 / -1;
      }


      .bottom-price {
        font-size:
          17px;
      }


      .add-cart,
      .buy-now {
        min-height:
          46px;

        font-size:
          11px;
      }
    }


    @media(max-width:380px) {

      .main-image {
        height:
          min(34vh,270px);

        min-height:
          210px;
      }


      .header-inner,
      main {
        width:
          calc(100% - 18px);
      }

    }

  </style>

<body>


<header
  class="header"
  id="shopPublicHeader"
></header>

<script src="./shop-public-nav.js?v=20261017-sales1"></script>
<script src="./shop-pending-payment.js?v=20261015-2" defer></script>



<main>


  <a
    href="./shop"
    class="back"
  >
    ← QUAY LẠI SHOP
  </a>


  <div
    id="pageContent"
  >

    <div class="state">

      <strong>
        Đang tải sản phẩm...
      </strong>

      Vui lòng chờ trong giây lát.

    </div>

</main>



<div
  id="buyBar"
  class="buy-bar"
  style="display:none;"
>

  <div class="buy-bar-inner">

    <div class="buy-bar-price">

      <div class="bottom-price-label">

      </div>

        id="bottomPrice"
        class="bottom-price"
      >
        -
      </div>

    </div>


    <button
      id="addCartBtn"

    >
      THÊM GIỎ
    </button>

      class="buy-now"
      type="button"

      MUA NGAY
    </button>

  </div>

</div>



<div
  id="toast"
  class="toast"
>
  ✓ Đã thêm vào giỏ hàng
</div>



<script>

(function () {


  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const pageContent =
    document.getElementById(
      "pageContent"
    );


  const buyBar =
    document.getElementById(
      "buyBar"
    );


  const bottomPrice =
    document.getElementById(
      "bottomPrice"
    );


  const addCartBtn =
    document.getElementById(
      "addCartBtn"
    );
  const buyNowBtn =
    document.getElementById(
      "buyNowBtn"
    );

  const cartCount =
    document.getElementById(
      "cartCount"
    );


  const toast =
    document.getElementById(
      "toast"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showError(
      "Không tải được hệ thống Shop."
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     STATE
  ====================================================== */

   let product = null;

  let variants = [];

  // Phân loại đang theo dõi tồn và hết hàng: hiện nút "Tạm hết", không cho chọn
  let soldOutVariants = [];

  let images = [];

  let selectedVariant = null;

  let selectedOption1Value = "";

  let selectedOption2Value = "";

  let selectedLegacyVariantId = "";

  let selectedGiftShirtSize = "";

  let currentHasStructuredOptions = false;

  let currentOption1Name = "";

  let currentOption2Name = "";

  let currentOption1Values = [];

  let currentOption2Values = [];

  let currentRequiresLegacyVariantChoice = false;

  let currentRequiresGiftShirtSize = false;

  let quantity = 1;



  /* =====================================================
     PARAM
  ====================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const productId =
    params.get(
      "id"
    );


  if (!productId) {

    showError(
      "Không tìm thấy sản phẩm."
    );

    return;

  }



  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }

  function normalizeProductText(value) {

    return String(
      value
      ||
      ""
    )
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  }


  function textHasPaddle(value) {

    const text =
      normalizeProductText(
        value
      );


    if (
      !text
    ) {

      return false;

    }


    const accessoryKeywords = [
      "quan can",
      "cuon can",
      "grip",
      "overgrip",
      "dan vien",
      "vien vot",
      "bao ve vien",
      "dan bao ve",
      "edge guard",
      "edge tape",
      "tape",
      "ppf",
      "bong",
      "ball",
      "tui",
      "tat",
      "ao",
      "phu kien",
      "cham soc",
      "ve sinh"
    ];


    if (
      accessoryKeywords.some(
        function (keyword) {

          return text.includes(
            keyword
          );

        }
      )
    ) {

      return false;

    }


    return (
      /^\s*(vợt|vot|paddle)/.test(text) // vợt = tên BẮT ĐẦU bằng "vợt"/"paddle" (không bắt "Chì độ vợt"...)
    );

  }


  function productRequiresGiftShirtSize(item) {

    return textHasPaddle(
      [
        item?.name,
        item?.brand,
        item?.short_description,
        item?.description
      ]
        .filter(Boolean)
        .join(" ")
    );

  }


  function selectedVariantLabel() {

    const parts = [];

    if (
      selectedVariant?.option1_name
      &&
      selectedVariant?.option1_value
    ) {

      parts.push(
        selectedVariant.option1_name
        +
        ": "
        +
        selectedVariant.option1_value
      );

    }

    if (
      selectedVariant?.option2_name
      &&
      selectedVariant?.option2_value
    ) {

      parts.push(
        selectedVariant.option2_name
        +
        ": "
        +
        selectedVariant.option2_value
      );

    }

    if (
      selectedGiftShirtSize
    ) {

      parts.push(
        "Size áo tặng: "
        +
        selectedGiftShirtSize
      );

    }

    return (
      selectedVariant?.variant_name
      ||
      parts.join(" / ")
      ||
      ""
    );

  }
  function imageUrl(path) {

    if (!path) {
      return "";
    }


    const {
      data
    } =
      sb.storage
        .from(
          "shop-products"
        )
        .getPublicUrl(
          path
        );


    return (
      data?.publicUrl || ""
    );

  }


  /*
    Ảnh nhỏ trên nút lựa chọn (màu / combo).
    Ô 2 ưu tiên biến thể cùng giá trị ô 1 đang chọn
    (vd. Tất: "Đen · 1 đôi" của Cao cổ khác Ngắn cổ).
  */
  function optionThumbUrl(index, value) {

    const key =
      index === 1
        ? "option1_value"
        : "option2_value";

    const matches =
      variants.filter(
        variant =>
          variant.is_active !== false
          &&
          String(variant[key] || "") === String(value)
      );

    const preferred =
      index === 2 && selectedOption1Value
        ? matches.filter(
            variant =>
              String(variant.option1_value || "")
              ===
              String(selectedOption1Value)
          )
        : [];

    for (const list of [preferred, matches]) {
      for (const variant of list) {
        const image =
          images.find(
            item =>
              String(item.variant_id || "")
              ===
              String(variant.id)
          );

        if (image) {
          return imageUrl(image.storage_path);
        }
      }
    }

    return "";

  }


  /*
    Chỉ hiện ảnh nhỏ cho 1 nhóm lựa chọn khi MỌI giá trị trong nhóm
    đều có ảnh (vd. màu vợt). Nhóm như size áo chỉ có ảnh lẻ do
    ảnh màu vợt gắn vào biến thể "size M" → không hiện ảnh.
  */
  function optionGroupHasThumbs(index, values) {

    return (
      values.length > 0
      &&
      values.every(
        value =>
          Boolean(
            optionThumbUrl(index, value)
          )
      )
    );

  }


  // Nút "Tạm hết" cho giá trị phân loại 1 mà mọi biến thể đều hết (chỉ hiện, không chọn được)
  function soldOutOption1Buttons(option1Values, withThumb) {
    const shown = new Set(option1Values.map(String));
    return soldOutVariants
      .filter(function (item) {
        const value = String(item.option1_value || "");
        if (!value || shown.has(value) || item.option2_value) return false;
        shown.add(value);
        return true;
      })
      .map(function (item) {
        const url = withThumb && item.image_path ? imageUrl(item.image_path) : "";
        return `
            <button class="variant-btn option-btn sold-out ${withThumb ? "has-thumb" : ""}" type="button" disabled aria-disabled="true">
              ${url ? `<img class="opt-thumb" src="${escapeHtml(url)}" alt="" loading="lazy">` : ""}
              <span>${escapeHtml(item.option1_value)}<small>Tạm hết</small></span>
            </button>
          `;
      })
      .join("");
  }

  function optionButtonInner(index, value, withThumb) {

    const url =
      withThumb
        ? optionThumbUrl(index, value)
        : "";

    return (
      url
        ? `<img class="opt-thumb" src="${escapeHtml(url)}" alt="" loading="lazy">`
        : ""
    )
    + `<span>${escapeHtml(value)}</span>`;

  }


  function refreshOption2Thumbs() {

async function updateDisplayedPrice() {

  if (!selectedVariant) {
    return;
  }


  const mainPrice =
    document.getElementById(
      "mainPrice"
    );


  const comparePrice =
    document.getElementById(
      "comparePrice"
    );


  const wholesaleHint =
    document.getElementById(
      "wholesaleHint"
    );


  const retailPrice =
    Number(
      selectedVariant.price
      ||
      0
    );


  const requestSeq =
    (
      updateDisplayedPrice._seq
      ||
      0
    )
    +
    1;


  updateDisplayedPrice._seq =
    requestSeq;


  let quote =
    null;


  let promoQuote =
    null;


  try {

    const {
      data,
      error
    } =
      await sb.rpc(
        "shop_price_quote",
        {

          p_variant_id:
            Number(
              selectedVariant.id
            ),

          p_quantity:
            quantity

        }
      );


    if (error) {
      throw error;
    }


    quote =
      data;

  }
  catch (error) {

    console.error(
      "PRICE QUOTE ERROR:",
      error
    );

  }


  const baseUnitPrice =
    Number(
      quote?.unit_price
      ??
      retailPrice
    );


  const baseSubtotal =
    Number(
      quote?.subtotal
      ??
      (
        baseUnitPrice
        *
        quantity
      )
    );


  try {

    const {
      data,
      error
    } =
      await sb.rpc(
        "shop_best_product_promotion_quote",
        {

          p_product_id:
            Number(
              product?.id
            ),

          p_variant_id:
            Number(
              selectedVariant.id
            ),

          p_unit_price:
            baseUnitPrice,

          p_quantity:
            quantity,

          p_order_amount:
            baseSubtotal

        }
      );


    if (error) {
      throw error;
    }


    promoQuote =
      Array.isArray(data)
      ?
        (
          data[0]
          ||
          null
        )
      :
        (
          data
          ||
          null
        );

  }
  catch (error) {

    console.error(
      "PROMOTION QUOTE ERROR:",
      error
    );

  }


  if (
    requestSeq
    !==
    updateDisplayedPrice._seq
  ) {

    return;

  }


  const hasPromotion =
    promoQuote
    &&
    Number(
      promoQuote.final_unit_price
      ??
      baseUnitPrice
    )
    <
    baseUnitPrice;


  const unitPrice =
    hasPromotion
    ?
      Number(
        promoQuote.final_unit_price
      )
    :
      baseUnitPrice;


  const subtotal =
    hasPromotion
    ?
      (
        unitPrice
        *
        quantity
      )
    :
      baseSubtotal;


  if (mainPrice) {

    mainPrice.textContent =
      money(
        unitPrice
      );

  }


  bottomPrice.textContent =
    money(
      subtotal
    );


  /*
    GIÁ GẠCH
  */

  if (comparePrice) {

    if (hasPromotion) {

      comparePrice.style.display =
        "";


      comparePrice.textContent =
        money(
          Number(
            promoQuote.original_unit_price
            ??
            baseUnitPrice
          )
        );

    }
    else if (
      quote?.pricing_type
      ===
      "wholesale"
      &&
      retailPrice > unitPrice
    ) {

      comparePrice.style.display =
        "";


      comparePrice.textContent =
        money(
          retailPrice
        );

    }
    else if (
      selectedVariant.compare_at_price
      &&
      Number(
        selectedVariant.compare_at_price
      )
      >
      retailPrice
    ) {

      comparePrice.style.display =
        "";


      comparePrice.textContent =
        money(
          selectedVariant.compare_at_price
        );

    }
    else {

      comparePrice.style.display =
        "none";

    }

  }


  if (!wholesaleHint) {
    return;
  }


  if (hasPromotion) {

    let promoHtml = `
      <strong>
        ✓ ĐANG ÁP DỤNG KHUYẾN MÃI
      </strong>
      • ${escapeHtml(
        promoQuote.promotion_name
        ||
        "Khuyến mãi PickDee"
      )}
      <br>
      Giá sau khuyến mãi:
      <strong>
        ${money(unitPrice)}
      </strong>
      / sản phẩm
    `;


    const promoSaving =
      Number(
        promoQuote.total_discount
        ??
        0
      );


    if (promoSaving > 0) {

      promoHtml += `
        <br>
        Tiết kiệm:
        <strong>
          ${money(promoSaving)}
        </strong>
        cho số lượng đang chọn.
      `;

    }


    wholesaleHint.innerHTML =
      promoHtml;


    wholesaleHint.style.display =
      "";


    return;

  }


  const nextQty =
    Number(
      quote?.quantity_to_next_tier
      ??
      0
    );


  const nextPrice =
    Number(
      quote?.next_tier_price
      ??
      0
    );


  const savings =
    Number(
      quote?.savings
      ??
      0
    );


  if (
    quote?.pricing_type
    ===
    "wholesale"
  ) {

    let html = `
      <strong>
        ✓ ĐÃ ĐẠT GIÁ SỈ
      </strong>
      • ${money(unitPrice)} / sản phẩm
    `;


    if (savings > 0) {

      html += `
        • Tiết kiệm
        <strong>
          ${money(savings)}
        </strong>
        so với giá niêm yết
      `;

    }


    if (
      nextQty > 0
      &&
      nextPrice > 0
    ) {

      html += `
        <br>
        Mua thêm
        <strong>
          ${nextQty}
        </strong>
        sản phẩm để đạt
        <strong>
          ${money(nextPrice)}
        </strong>
        / sản phẩm.
      `;

    }


    wholesaleHint.innerHTML =
      html;


    wholesaleHint.style.display =
      "";

  }
  else if (
    nextQty > 0
    &&
    nextPrice > 0
  ) {

    wholesaleHint.innerHTML = `
      Mua thêm
      <strong>
        ${nextQty}
      </strong>
      sản phẩm để đạt giá sỉ
      <strong>
        ${money(nextPrice)}
      </strong>
      / sản phẩm.
    `;


    wholesaleHint.style.display =
      "";

  }
  else {

    wholesaleHint.innerHTML =
      "";


    wholesaleHint.style.display =
      "none";

  }

}



/* =====================================================
   EVENT
====================================================== */

function bindProductEvents() {

  const minus =
    document.getElementById(
      "minusBtn"
    );


  const plus =
    document.getElementById(
      "plusBtn"
    );


  const quantityInput =
    document.getElementById(
      "quantityInput"
    );


  /*
    =====================================================
    SỐ LƯỢNG
    =====================================================
  */

  function syncQuantityInput() {

    if (quantityInput) {

      quantityInput.value =
        String(
          quantity
        );

    }

  }


  function setQuantity(value) {

    let next =
      Number(value);


    if (
      !Number.isFinite(next)
    ) {

      next =
        1;

    }


    next =
      Math.round(next);


    quantity =
      Math.max(
        1,
        Math.min(
          9999,
          next
        )
      );


    syncQuantityInput();

    updateDisplayedPrice();

  }


  minus?.addEventListener(
    "click",
    function () {

      setQuantity(
        quantity - 1
      );

    }
  );


  plus?.addEventListener(
    "click",
    function () {

      setQuantity(
        quantity + 1
      );

    }
  );


  quantityInput?.addEventListener(
    "input",
    function () {

      const value =
        Number(
          quantityInput.value
        );


      if (
        Number.isInteger(value)
        &&
        value >= 1
        &&
        value <= 9999
      ) {

        quantity =
          value;


        updateDisplayedPrice();

      }

    }
  );


  quantityInput?.addEventListener(
    "change",
    function () {

      setQuantity(
        quantityInput.value
      );

    }
  );


  /*
    =====================================================
    ĐỒNG BỘ NÚT OPTION
    =====================================================
  */

  function syncOptionButtons() {

    document
      .querySelectorAll(
        '[data-option-index="1"]'
      )
      .forEach(
        function (button) {

          button.classList.toggle(
            "active",
            String(
              button.dataset.optionValue
              ||
              ""
            )

  /*

    =====================================================
  */

  document
    .querySelectorAll(
      '[data-option-index="1"]'
    )
    .forEach(
      function (button) {

        button.addEventListener(

                      )

            ) {

                        variant.option1_value
                        ||
                        ""
                      )

            ) {

                      )

  function showSelectedVariantImage() {

    if (!selectedVariant) {
      return;
    }

    const thumb =
      document.querySelector(
        `.thumb[data-variant-id="${CSS.escape(String(selectedVariant.id))}"]`
      );

    if (!thumb) {
      return;
    }

    thumb.click();

    const strip =
      thumb.parentElement;

    if (strip) {
      strip.scrollTo({
        left:
          thumb.offsetLeft
          -
          (strip.clientWidth - thumb.clientWidth) / 2,
        behavior: "smooth"
      });
    }

  }


  if (!window.__pdVariantImageBound) {

    window.__pdVariantImageBound = true;

          )

              showSelectedVariantImage();

            0

  function getMissingRequiredSelections() {
    const missing = [];


    if (
      currentHasStructuredOptions
    ) {

      if (
        currentOption1Values.length
        &&
        !selectedOption1Value
      ) {

        missing.push(
          currentOption1Name
          ||
          "phân loại 1"
        );

      }


      if (
        currentOption2Values.length
        &&
        !selectedOption2Value
      ) {

        missing.push(
          currentOption2Name
          ||
          "phân loại 2"
        );

      }


      if (
        missing.length
      ) {

        return missing;

      }


      selectedVariant =
        variants.find(
          function (variant) {

            const option1Ok =
              !currentOption1Values.length
              ||
              String(
                variant.option1_value
                ||
                ""
              )
              ===
              String(
                selectedOption1Value
              );

            const option2Ok =
              !currentOption2Values.length
              ||
              String(
                variant.option2_value
                ||
                ""
              )
              ===
              String(
                selectedOption2Value
              );

            return (
              option1Ok
              &&
              option2Ok
            );

          }
        )
        ||
        null;


      if (
        !selectedVariant
      ) {

        return [
          "phân loại sản phẩm hợp lệ"
        ];

      }

    }


    if (
      currentRequiresLegacyVariantChoice
    ) {

      if (
        !selectedLegacyVariantId
      ) {

        return [
          "lựa chọn sản phẩm"
        ];

      }


      const matchedLegacyVariant =
        variants.find(
          function (variant) {

            return (
              String(
                variant.id
              )
              ===
              String(
                selectedLegacyVariantId
              )
            );

          }
        )
        ||
        null;


      if (
        !matchedLegacyVariant
      ) {

        return [
          "lựa chọn sản phẩm hợp lệ"
        ];

      }


      selectedVariant =
        matchedLegacyVariant;

    }


    if (
      currentRequiresGiftShirtSize
      &&
      !selectedGiftShirtSize
    ) {

      missing.push(
        "size áo tặng"
      );

    }


    return missing;

  }


  function validateRequiredSelections() {

    const missing =
      getMissingRequiredSelections();

    if (
      missing.length
    ) {

      window.alert(
        "Vui lòng chọn đầy đủ: "
        +
        missing.join(", ")
        +
        " trước khi thêm vào giỏ."
      );

      document
        .querySelector(
          ".info"
        )
        ?.scrollIntoView(
          {
            behavior: "smooth",
            block: "start"
          }
        );

      return false;

    }

    return true;

  }
  /* =====================================================
     ADD CART
  ====================================================== */

   async function addToCart(
    options
  ) {

    const shouldOpenCart =
      Boolean(
        options?.openCart
      );


    if (
      !product
      ||
      !selectedVariant
    ) {

      return;

    }
    if (
      !validateRequiredSelections()
    ) {

      return;

    }

    addCartBtn.disabled =
      true;


    if (buyNowBtn) {

      buyNowBtn.disabled =
        true;

    }


    const oldAddText =
      addCartBtn.textContent;


    const oldBuyNowText =
      buyNowBtn
        ?
          buyNowBtn.textContent
        :
          "";


    if (shouldOpenCart && buyNowBtn) {

      buyNowBtn.textContent =
        "ĐANG MỞ...";

    }
    else {

      addCartBtn.textContent =
        "ĐANG THÊM...";

    }


    try {

      const cart =
        readCart();


      const existing =
        cart.find(
          function (item) {

            return (
              String(
                item.variant_id
              )
              ===
              String(
                selectedVariant.id
              )
            );

          }
        );


      const currentQty =
        existing
          ?
            Number(
              existing.quantity || 0
            )
          :
            0;


      const finalQuantity =
        Math.min(
          9999,
          currentQty
          +
          quantity
        );


       const {
        data: quote,
        error: quoteError
      } =
        await sb.rpc(
          "shop_price_quote",
          {

            p_variant_id:
              Number(
                selectedVariant.id
              ),

            p_quantity:
              finalQuantity

          }
        );


      if (quoteError) {
        throw quoteError;
      }


      const baseUnitPrice =
        Number(
          quote?.unit_price
          ??
          selectedVariant.price
        );


      const baseSubtotal =
        Number(
          quote?.subtotal
          ??
          (
            baseUnitPrice
            *
            finalQuantity
          )
        );


      let promoQuote =
        null;


      const {
        data: promoData,
        error: promoError
      } =
        await sb.rpc(
          "shop_best_product_promotion_quote",
          {

            p_product_id:
              Number(
                product.id
              ),

            p_variant_id:
              Number(
                selectedVariant.id
              ),

            p_unit_price:
              baseUnitPrice,

            p_quantity:
              finalQuantity,

            p_order_amount:
              baseSubtotal

          }
        );


      if (promoError) {
        throw promoError;
      }


      promoQuote =
        Array.isArray(promoData)
        ?
          (
            promoData[0]
            ||
            null
          )
        :
          (
            promoData
            ||
            null
          );


      const hasPromotion =
        promoQuote
        &&
        Number(
          promoQuote.final_unit_price
          ??
          baseUnitPrice
        )
        <
        baseUnitPrice;


      const effectivePrice =
        hasPromotion
        ?
          Number(
            promoQuote.final_unit_price
          )
        :
          baseUnitPrice;


      const sameOption1VariantIds =
        variants
          .filter(
            function (variant) {

              return (
                variant.option1_value
                &&
                selectedVariant.option1_value
                &&
                String(
                  variant.option1_value
                )
                ===
                String(
                  selectedVariant.option1_value
                )
              );

            }
          )
          .map(
            function (variant) {
              return String(
                variant.id
              );
            }
          );

      const selectedVariantImage =
        images.find(
          function (image) {

            return (
              image.variant_id
              &&
              String(
                image.variant_id
              )
              ===
              String(
                selectedVariant.id
              )
            );

          }
        )
        ||
        images.find(
          function (image) {

            return (
              image.variant_id
              &&
              sameOption1VariantIds.includes(
                String(
                  image.variant_id
                )
              )
            );

          }
        )
        ||
        [...images]
          .sort(
            function (a,b) {

              if (
                Boolean(
                  a.is_primary
                )
                !==
                Boolean(
                  b.is_primary
                )
              ) {

                return a.is_primary
                  ?
                    -1
                  :
                    1;

              }

              return (
                Number(
                  a.sort_order || 0
                )
                -
                Number(
                  b.sort_order || 0
                )
              );

            }
          )[0]
        ||
        null;


      const selectedImageUrl =
        selectedVariantImage
          ?
            imageUrl(
              selectedVariantImage.storage_path
            )
          :
            "";


      if (existing) {

        existing.quantity =
          finalQuantity;
        existing.variant_name =
          selectedVariantLabel();

        existing.option1_name =
          selectedVariant.option1_name
          ||
          "";

        existing.option1_value =
          selectedVariant.option1_value
          ||
          "";

        existing.option2_name =
          selectedVariant.option2_name
          ||
          "";

        existing.option2_value =
          selectedVariant.option2_value
          ||
          "";

        existing.gift_shirt_size =
          selectedGiftShirtSize
          ||
          "";

               existing.price =
          effectivePrice;


        existing.retail_price =
          Number(
            selectedVariant.price
          );


        existing.promotion_id =
          hasPromotion
          ?
            promoQuote.promotion_id
          :
            null;


        existing.promotion_name =
          hasPromotion
          ?
            (
              promoQuote.promotion_name
              ||
              ""
            )
          :
            "";


        existing.original_price =
          hasPromotion
          ?
            Number(
              promoQuote.original_unit_price
              ??
              baseUnitPrice
            )
          :
            Number(
              selectedVariant.price
            );
        existing.image_url =
          selectedImageUrl
          ||
          existing.image_url
          ||
          "";
      }
      else {

        cart.push({

          product_id:
            product.id,

          variant_id:
            selectedVariant.id,

          product_name:
            product.name,

                    variant_name:
            selectedVariantLabel(),

          option1_name:
            selectedVariant.option1_name
            ||
            "",

          option1_value:
            selectedVariant.option1_value
            ||
            "",

          option2_name:
            selectedVariant.option2_name
            ||
            "",

          option2_value:
            selectedVariant.option2_value
            ||
            "",

          gift_shirt_size:
            selectedGiftShirtSize
            ||
            "",

                    price:
            effectivePrice,

          retail_price:
            Number(
              selectedVariant.price
            ),

          promotion_id:
            hasPromotion
            ?
              promoQuote.promotion_id
            :
              null,

          promotion_name:
            hasPromotion
            ?
              (
                promoQuote.promotion_name
                ||
                ""
              )
            :
              "",

          original_price:
            hasPromotion
            ?
              Number(
                promoQuote.original_unit_price
                ??
                baseUnitPrice
              )
            :
              Number(
                selectedVariant.price
              ),

          quantity:
            finalQuantity,

          image_url:
            selectedImageUrl

        });

      }


      localStorage.setItem(
        "pickdee_shop_cart",
        JSON.stringify(cart)
      );


      updateCartCount();


      if (shouldOpenCart) {

        window.location.href =
          "./shop-cart";

        return;

      }


      showToast();

    }
    catch (error) {

      console.error(
        "ADD CART PRICE ERROR:",
        error
      );


      alert(
        "Chưa thêm được sản phẩm vào giỏ. Anh vui lòng thử lại."
      );

    }
    finally {

      addCartBtn.disabled =
        false;


      addCartBtn.textContent =
        oldAddText;


      if (buyNowBtn) {

        buyNowBtn.disabled =
          false;


        buyNowBtn.textContent =
          oldBuyNowText;

      }

    }

  }


  addCartBtn.addEventListener(
    "click",
    function () {

      addToCart({
        openCart:
          false
      });

    }
  );


  buyNowBtn?.addEventListener(
    "click",
    function () {

      addToCart({
        openCart:
          true
      });

    }
  );



  /* =====================================================
     LOAD
  ====================================================== */

  async function loadProduct() {

    try {


      const [
        productResult,
        variantsResult,
        imagesResult
      ] =
        await Promise.all([


          sb
            .from(
              "shop_products"
            )
            .select(
              "id,name,slug,brand,short_description,description,status"
            )
            .eq(
              "id",
              productId
            )
            .eq(
              "status",
              "active"
            )
            .single(),


          sb
            .from(
              "shop_product_variants"
            )
            .select(
              "id,product_id,sku,variant_name,option1_name,option1_value,option2_name,option2_value,price,compare_at_price,is_active,sort_order"
            )
            .eq(
              "product_id",
              productId
            )
            .eq(
              "is_active",
              true
            )
            .order(
              "sort_order",
              {
                ascending:
                  true
              }
            ),


          sb
            .from(
              "shop_product_images"
            )
            .select(
              "id,product_id,variant_id,storage_path,alt_text,sort_order,is_primary"
            )
            .eq(
              "product_id",
              productId
            )
            .order(
              "sort_order",
              {
                ascending:
                  true
              }
            )


        ]);


      if (productResult.error) {

        console.error(
          productResult.error
        );


        throw new Error(
          "Sản phẩm không tồn tại hoặc chưa được mở bán."
        );

      }


      if (variantsResult.error) {

        console.error(
          variantsResult.error
        );


        throw new Error(
          "Không tải được giá sản phẩm."
        );

      }


      if (imagesResult.error) {

        console.error(
          imagesResult.error
        );


        throw new Error(
          "Không tải được ảnh sản phẩm."
        );

      }


      product =
        productResult.data;


      variants =
        variantsResult.data
        ||
        [];


      try {
        const soldOutResult =
          await sb.rpc(
            "shop_public_sold_out_variants_v1",
            { p_product_id: Number(productId) }
          );

        soldOutVariants =
          soldOutResult.error
            ? []
            : (soldOutResult.data || []);
      } catch (_) {
        soldOutVariants = [];
      }

      const soldOutIds =
        new Set(
          soldOutVariants.map(item => String(item.variant_id))
        );

      variants =
        variants.filter(
          variant => !soldOutIds.has(String(variant.id))
        );


      images =
        imagesResult.data
        ||
        [];


      renderProduct();


    }
    catch (error) {


      console.error(
        "PRODUCT ERROR:",
        error
      );


      showError(
        error?.message
        ||
        "Không tải được sản phẩm."
      );

    }

  }



  /* =====================================================
     START
  ====================================================== */

  updateCartCount();

  loadProduct();


})();

  toast.innerHTML = `

    </span>

  toast.setAttribute(
    "role",

  toast.setAttribute(
    "tabindex",
    "0"
  );


  function openCart() {

    window.location.href =
      "./shop-cart";

  toast.addEventListener(
    "click",

  );

    "keydown",

      if (

        openCart();

      }
