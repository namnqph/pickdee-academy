  <title>Đặt lại mật khẩu | PickDee Academy</title>

  <style>
    * {

    body {

      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(80,255,190,.12), transparent 30%),
        linear-gradient(145deg, #131313, #202020 50%, #101010);
    }

    .box {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 18px;
      background: rgba(32,32,32,.8);
      border: 1px solid rgba(255,255,255,.13);
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 28px;
    }

    .brand span {
      color: #ffc934;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .sub {
      margin-bottom: 22px;
      color: rgba(255,255,255,.65);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;

    input {
      width: 100%;
      min-height: 50px;
      margin-bottom: 15px;

      outline: none;
    }

    input:focus {
      border-color: #ffc934;

    button {
      width: 100%;
      min-height: 50px;
      border: 0;

      cursor: pointer;

      color: #0c0c0c;

    button:disabled {
      opacity: .6;

<body>

  <div class="box">

    <div class="brand">
      PickDee <span>Academy</span>
    </div>

    <h1>Đặt lại mật khẩu</h1>

    <div class="sub">
      Nhập mật khẩu mới cho tài khoản PickDee Academy của bạn.
    </div>

    <form id="resetForm">

      <label for="newPassword">
        MẬT KHẨU MỚI
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Tối thiểu 8 ký tự"
        required
      >

      <label for="confirmPassword">
        NHẬP LẠI MẬT KHẨU
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Nhập lại mật khẩu mới"
        required
      >

      <button
        id="resetBtn"
        type="submit"
      >
        Cập nhật mật khẩu
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="/login"
    >
      ← Quay về đăng nhập
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261019-keep30"></script>

  <script>
    (async function () {

      const sb =
        window.PICKDEE_SUPABASE ||
        window.supabaseClient;

      const form =
        document.getElementById("resetForm");

      const resetBtn =
        document.getElementById("resetBtn");

      const message =
        document.getElementById("message");

      const newPassword =
        document.getElementById("newPassword");

      const confirmPassword =
        document.getElementById("confirmPassword");


      function showMessage(text, type) {

        message.className =
          type || "";

        message.textContent =
          text || "";

      }


      if (!sb || !sb.auth) {

        showMessage(
          "Không khởi tạo được hệ thống đăng nhập. Vui lòng tải lại trang.",
          "error"
        );

        resetBtn.disabled = true;

        return;

      }


      /*
        Khi người dùng bấm link khôi phục trong email,
        Supabase sẽ tạo session tạm để cho phép đổi mật khẩu.

        config.js đang dùng client dùng chung và
        detectSessionInUrl = true, nên trang này chỉ cần
        kiểm tra session hiện tại.
      */

      let recoverySessionReady = false;


      sb.auth.onAuthStateChange(
        function (event, session) {

          if (
            event === "PASSWORD_RECOVERY" &&
            session
          ) {

            recoverySessionReady = true;

            showMessage(
              "Link khôi phục hợp lệ. Bạn có thể tạo mật khẩu mới.",
              "info"
            );

          }

        }
      );


      async function checkSession() {

        try {

          const {
            data,
            error
          } =
            await sb.auth.getSession();


          if (error) {

            throw error;

          }


          if (
            data &&
            data.session &&
            data.session.user
          ) {

            recoverySessionReady = true;

            return true;

          }


          return false;

        }
        catch (error) {

          console.error(
            "CHECK RECOVERY SESSION:",
            error
          );

          return false;

        }

      }


      /*
        Kiểm tra lần đầu.
        Nếu Supabase đang xử lý URL recovery thì chờ thêm
        một chút rồi kiểm tra lại.
      */

      let sessionOk =
        await checkSession();


      if (!sessionOk) {

        await new Promise(
          function (resolve) {

            setTimeout(
              resolve,
              800
            );

          }
        );


        sessionOk =
          await checkSession();

      }


      if (!sessionOk) {

        showMessage(
          "Đang xác thực link đặt lại mật khẩu...",
          "info"
        );

      }


      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();


          const password =
            newPassword.value;

          const confirm =
            confirmPassword.value;


          if (password.length < 8) {

            showMessage(
              "Mật khẩu cần ít nhất 8 ký tự.",
              "error"
            );

            return;

          }


          if (password !== confirm) {

            showMessage(
              "Hai mật khẩu chưa giống nhau.",
              "error"
            );

            return;

          }


          resetBtn.disabled = true;

          resetBtn.textContent =
            "Đang cập nhật...";


          try {

            const hasSession =
              await checkSession();


            if (
              !recoverySessionReady ||
              !hasSession
            ) {

              throw new Error(
                "Link đặt lại mật khẩu đã hết hạn hoặc không hợp lệ. Vui lòng yêu cầu gửi lại link mới."
              );

            }


            const {
              error
            } =
              await sb.auth.updateUser({
                password: password
              });


            if (error) {

              throw error;

            }


            form.style.display =
              "none";


            showMessage(
              "✓ Đổi mật khẩu thành công. Đang chuyển về trang đăng nhập...",
              "success"
            );


            await sb.auth.signOut();


            setTimeout(
              function () {

                window.location.replace(
                  "/login"
                );

              },
              1500
            );

          }
          catch (error) {

            console.error(
              "RESET PASSWORD:",
              error
            );


            showMessage(
              error &&
              error.message
                ? error.message
                : "Không đổi được mật khẩu. Vui lòng thử lại.",
              "error"
            );

          }
          finally {

            resetBtn.disabled = false;

            resetBtn.textContent =
              "Cập nhật mật khẩu";

          }

        }
      );

    })();
  </script>

</body>
