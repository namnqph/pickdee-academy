<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09111f">

  <title>Đặt lại mật khẩu | PickDee Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(80,255,190,.12), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .box {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 18px;
      background: rgba(6,39,88,.8);
      border: 1px solid rgba(255,255,255,.13);
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 28px;
    }

    .brand span {
      color: #d8ff45;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .sub {
      margin-bottom: 22px;
      color: rgba(255,255,255,.65);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 50px;
      margin-bottom: 15px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d8ff45;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #d8ff45;
      color: #07101b;
      font-weight: 900;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .success {
      color: #d8ff45;
    }

    .error {
      color: #ff9f9f;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #d8ff45;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="brand">
      PickDee <span>Academy</span>
    </div>

    <h1>Đặt lại mật khẩu</h1>

    <div class="sub">
      Nhập mật khẩu mới cho tài khoản PickDee Academy của bạn.
    </div>

    <form id="resetForm">

      <label for="newPassword">
        MẬT KHẨU MỚI
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Tối thiểu 6 ký tự"
        required
      >

      <label for="confirmPassword">
        NHẬP LẠI MẬT KHẨU
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Nhập lại mật khẩu mới"
        required
      >

      <button
        id="resetBtn"
        type="submit"
      >
        CẬP NHẬT MẬT KHẨU
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="/?v=login"
    >
      ← QUAY VỀ ĐĂNG NHẬP
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    (async function () {

      const cfg =
        window.PICKDEE_CONFIG || {};

      const sb =
        window.supabase.createClient(
          cfg.SUPABASE_URL,
          cfg.SUPABASE_PUBLISHABLE_KEY
        );

      const form =
        document.getElementById("resetForm");

      const resetBtn =
        document.getElementById("resetBtn");

      const message =
        document.getElementById("message");


      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();

          const password =
            document.getElementById("newPassword").value;

          const confirm =
            document.getElementById("confirmPassword").value;


          if (password.length < 6) {

            message.className = "error";

            message.textContent =
              "Mật khẩu cần ít nhất 6 ký tự.";

            return;
          }


          if (password !== confirm) {

            message.className = "error";

            message.textContent =
              "Hai mật khẩu chưa giống nhau.";

            return;
          }


          resetBtn.disabled = true;

          resetBtn.textContent =
            "ĐANG CẬP NHẬT...";


          try {

            const {
              data: { session }
            } =
              await sb.auth.getSession();


            if (!session) {

              throw new Error(
                "Link đặt lại mật khẩu đã hết hạn hoặc không hợp lệ."
              );
            }


            const {
              error
            } =
              await sb.auth.updateUser({
                password: password
              });


            if (error) {
              throw error;
            }


            message.className =
              "success";

            message.textContent =
              "✓ Đổi mật khẩu thành công.";


            await sb.auth.signOut();


            setTimeout(
              function () {

                window.location.replace(
                  "/?v=" + Date.now()
                );

              },
              1200
            );

          }
          catch (error) {

            console.error(
              "RESET PASSWORD:",
              error
            );

            message.className =
              "error";

            message.textContent =
              error.message
              ||
              "Không đổi được mật khẩu.";

          }
          finally {

            resetBtn.disabled = false;

            resetBtn.textContent =
              "CẬP NHẬT MẬT KHẨU";

          }

        }
      );

    })();
  </script>

</body>
</html>
