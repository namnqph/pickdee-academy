<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#071523">
  <title>Sửa sản phẩm | PickDee Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #071523;
      color: #fff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      min-height: 100vh;
      padding-bottom: 95px;
    }
    button,
    input,
    select,
    textarea,
    a {
      touch-action: manipulation;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 60;
      background:
        rgba(7,21,35,.97);
      border-bottom:
        1px solid rgba(255,255,255,.08);
      backdrop-filter:
        blur(16px);
    }

    .header-inner {
      width:
        min(760px,calc(100% - 18px));
      min-height: 60px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      min-height: 36px;
      padding:
        0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border:
        1px solid rgba(255,255,255,.12);
      color:
        rgba(255,255,255,.72);
      text-decoration: none;
      font-size: 9px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =====================================================
       MAIN
    ====================================================== */

    main {
      width:
        min(760px,calc(100% - 18px));
      margin:
        15px auto 30px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #d8ff45;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .1em;
    }

    h1 {
      margin:
        0 0 5px;
      font-size:
        clamp(29px,7vw,40px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .intro {
      margin:
        0 0 14px;
      color:
        rgba(255,255,255,.48);
      font-size: 11px;
      line-height: 1.45;
    }

    /* =====================================================
       PRODUCT OVERVIEW
    ====================================================== */

    .overview {
      padding: 11px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns:
        72px minmax(0,1fr);
      gap: 11px;
      align-items: center;
      border-radius: 14px;
      border:
        1px solid rgba(255,255,255,.08);
      background: #0d1d2f;
    }

    .product-image {
      width: 72px;
      height: 72px;
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border:
        1px solid rgba(255,255,255,.08);
      background:
        rgba(255,255,255,.04);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      color:
        rgba(255,255,255,.25);
      font-size: 8px;
      font-weight: 900;
      text-align: center;
    }

    .overview-name {
      font-size: 14px;
      font-weight: 950;
      line-height: 1.25;
    }

    .overview-meta {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      min-height: 21px;
      padding:
        0 7px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background:
        rgba(255,255,255,.055);
      color:
        rgba(255,255,255,.55);
      font-size: 7px;
      font-weight: 950;
    }

    .tag.fixed {
      color: #d8ff45;
      background:
        rgba(216,255,69,.07);
    }

    /* =====================================================
       CARD
    ====================================================== */

    .card {
      margin-bottom: 10px;
      padding: 13px;
      border-radius: 15px;
      border:
        1px solid rgba(255,255,255,.08);
      background: #0d1d2f;
    }

    .card-title {
      margin-bottom: 11px;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: -.01em;
    }

    .card-subtitle {
      margin:
        -5px 0 11px;
      color:
        rgba(255,255,255,.4);
      font-size: 9px;
      line-height: 1.45;
    }

    /* =====================================================
       FORM
    ====================================================== */

    .field {
      margin-bottom: 11px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color:
        rgba(255,255,255,.58);
      font-size: 8px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    input,
    select,
    textarea {
      width: 100%;
      border:
        1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      outline: none;
      background: #10243a;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
    }

    input,
    select {
      min-height: 44px;
      padding:
        0 11px;
    }

    textarea {
      min-height: 88px;
      padding: 10px 11px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color:
        rgba(216,255,69,.6);
    }

    input:disabled {
      opacity: .55;
      color:
        rgba(255,255,255,.55);
    }

    .grid-2 {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 8px;
    }

    .hint {
      margin-top: 5px;
      color:
        rgba(255,255,255,.32);
      font-size: 8px;
      line-height: 1.4;
    }

    /* =====================================================
       WHOLESALE TIERS
    ====================================================== */

    .wholesale-box {
      margin-top: 12px;
      padding: 11px;
      border-radius: 12px;
      border:
        1px solid rgba(216,255,69,.14);
      background:
        rgba(216,255,69,.035);
    }

    .wholesale-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 9px;
      margin-bottom: 9px;
    }

    .wholesale-title {
      font-size: 10px;
      font-weight: 950;
    }

    .wholesale-desc {
      margin-top: 3px;
      color:
        rgba(255,255,255,.38);
      font-size: 8px;
      line-height: 1.4;
    }

    .wholesale-add {
      flex: 0 0 auto;
      min-height: 32px;
      padding:
        0 9px;
      border-radius: 9px;
      border:
        1px solid rgba(216,255,69,.25);
      background:
        rgba(216,255,69,.08);
      color: #d8ff45;
      font-family: inherit;
      font-size: 8px;
      font-weight: 950;
      cursor: pointer;
    }

    .wholesale-tier-row {
      display: grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1.2fr)
        36px;
      gap: 6px;
      align-items: end;
      margin-top: 7px;
    }

    .wholesale-tier-row input {
      min-width: 0;
    }

    .tier-remove {
      width: 36px;
      height: 44px;
      border-radius: 9px;
      border:
        1px solid rgba(255,100,100,.18);
      background:
        rgba(255,100,100,.06);
      color: #ffaaaa;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .wholesale-empty {
      padding: 12px 8px;
      text-align: center;
      border-radius: 9px;
      border:
        1px dashed rgba(255,255,255,.1);
      color:
        rgba(255,255,255,.35);
      font-size: 8px;
    }

    .variant-add-toggle {
      width: 100%;
      min-height: 42px;
      margin-top: 8px;
      border-radius: 10px;
      border:
        1px solid rgba(216,255,69,.25);
      background:
        rgba(216,255,69,.08);
      color: #d8ff45;
      font-family: inherit;
      font-size: 9px;
      font-weight: 950;
      cursor: pointer;
    }

    .variant-add-box {
      margin:
        10px 0 12px;
      padding: 12px;
      border-radius: 12px;
      border:
        1px solid rgba(216,255,69,.18);
      background:
        rgba(216,255,69,.035);
    }

    .variant-add-title {
      margin-bottom: 5px;
      color: #d8ff45;
      font-size: 11px;
      font-weight: 950;
    }

    .variant-add-desc {
      margin-bottom: 11px;
      color:
        rgba(255,255,255,.42);
      font-size: 8px;
      line-height: 1.45;
    }

    .variant-add-actions {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }

    .variant-add-create,
    .variant-add-cancel {
      min-height: 42px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 950;
      cursor: pointer;
    }

    .variant-add-create {
      border: 0;
      background: #d8ff45;
      color: #071523;
    }

    .variant-add-cancel {
      border:
        1px solid rgba(255,255,255,.12);
      background:
        rgba(255,255,255,.05);
      color:
        rgba(255,255,255,.75);
    }

    .variant-add-create:disabled,
    .variant-add-cancel:disabled,
    .variant-add-toggle:disabled {
      opacity: .45;
      cursor: default;
    }

    /* =====================================================
       CHECKBOX
    ====================================================== */

    .switch-row {
      min-height: 46px;
      padding:
        0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 10px;
      border:
        1px solid rgba(255,255,255,.08);
      background:
        rgba(255,255,255,.03);
    }

    .switch-text {
      min-width: 0;
    }

    .switch-title {
      font-size: 10px;
      font-weight: 950;
    }

    .switch-desc {
      margin-top: 2px;
      color:
        rgba(255,255,255,.35);
      font-size: 8px;
    }

    .check {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      accent-color: #d8ff45;
    }

    /* =====================================================
       NOTICE
    ====================================================== */

    .notice {
      margin-top: 8px;
      padding: 10px;
      border-radius: 10px;
      border:
        1px solid rgba(216,255,69,.14);
      background:
        rgba(216,255,69,.05);
      color:
        rgba(255,255,255,.48);
      font-size: 8px;
      line-height: 1.5;
    }

    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        45px 18px;
      text-align: center;
      border-radius: 14px;
      border:
        1px dashed rgba(255,255,255,.13);
      color:
        rgba(255,255,255,.5);
      font-size: 11px;
      line-height: 1.5;
    }

    /* =====================================================
       MESSAGE
    ====================================================== */

    .message {
      display: none;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 850;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      border:
        1px solid rgba(216,255,69,.25);
      background:
        rgba(216,255,69,.07);
      color: #d8ff45;
    }

    .message.error {
      display: block;
      border:
        1px solid rgba(255,100,100,.24);
      background:
        rgba(255,100,100,.07);
      color: #ffaaaa;
    }

    /* =====================================================
       STICKY SAVE
    ====================================================== */

    .sticky-save {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      padding:
        8px 9px calc(8px + env(safe-area-inset-bottom));
      border-top:
        1px solid rgba(255,255,255,.08);
      background:
        rgba(7,21,35,.97);
      backdrop-filter:
        blur(16px);
    }

    .sticky-inner {
      width:
        min(760px,100%);
      margin: auto;
    }

    .save-btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #d8ff45;
      color: #071523;
      font-family: inherit;
      font-size: 11px;
      font-weight: 950;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .danger-card {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      border:
        1px solid rgba(255,100,100,.22);
      background:
        rgba(255,100,100,.055);
    }

    .danger-title {
      color: #ffb0b0;
      font-size: 11px;
      font-weight: 950;
    }

    .danger-desc {
      margin-top: 5px;
      color:
        rgba(255,255,255,.48);
      font-size: 9px;
      line-height: 1.45;
    }

    .delete-draft-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border-radius: 11px;
      border:
        1px solid rgba(255,100,100,.28);
      background:
        rgba(255,100,100,.12);
      color: #ffb0b0;
      font-family: inherit;
      font-size: 10px;
      font-weight: 950;
      cursor: pointer;
    }

    .delete-draft-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    @media(max-width:390px) {

      .grid-2 {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <a
      class="brand"
      href="./shop-admin-products"
    >
      PickDee<span>Shop</span>
    </a>

    <a
      class="back"
      href="./shop-admin-products"
    >
      ← SẢN PHẨM
    </a>

  </div>

</header>

<main>

  <div class="eyebrow">
    SHOP ADMIN
  </div>

  <h1>
    Sửa sản phẩm
  </h1>

  <p class="intro">
    Chỉnh thông tin bán hàng. Mã sản phẩm, SKU và tồn kho được hệ thống bảo vệ.
  </p>

  <div
    id="message"
    class="message"
  ></div>

  <div id="pageBody">

    <div class="state">
      Đang tải sản phẩm...
    </div>

  </div>

</main>

<div class="sticky-save">

  <div class="sticky-inner">

    <button
      id="saveBtn"
      class="save-btn"
      type="button"
      disabled
    >
      LƯU THAY ĐỔI
    </button>

  </div>

</div>

<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const pageBody =
    document.getElementById(
      "pageBody"
    );

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );

  const messageBox =
    document.getElementById(
      "message"
    );

  const params =
    new URLSearchParams(
      location.search
    );

  const productId =
    Number(
      params.get("id")
    );

  let product = null;
  let variants = [];
  let categories = [];
  let images = [];
  let selectedImageFile = null;
  let wholesaleTiers = [];
  let selectedVariantId = null;
  let canDeleteDraftProduct = false;
  let showAddVariantForm = false;

  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showFatal(
      "Không tải được hệ thống Shop."
    );

    return;

  }

  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );

  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }

  function moneyInput(value) {

    if (
      value === null
      ||
      value === undefined
    ) {

      return "";

    }

    return String(
      Number(value)
    );

  }

  function nullableText(value) {

    const text =
      String(
        value ?? ""
      ).trim();

    return (
      text
      ||
      null
    );

  }

  function nullableNumber(value) {

    const text =
      String(
        value ?? ""
      ).trim();

    if (!text) {
      return null;
    }

    const number =
      Number(text);

    if (
      !Number.isFinite(number)
    ) {
      return null;
    }

    return Math.round(number);

  }

  function showMessage(
    text,
    type
  ) {

    messageBox.className =
      `message ${type}`;

    messageBox.textContent =
      text;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  function clearMessage() {

    messageBox.className =
      "message";

    messageBox.textContent =
      "";

  }

  function showFatal(text) {

    pageBody.innerHTML = `
      <div class="state">
        ${escapeHtml(text)}
      </div>
    `;

    saveBtn.disabled =
      true;

  }

  function publicImageUrl(
    storagePath
  ) {

    if (!storagePath) {
      return "";
    }

    const {
      data
    } =
      sb.storage
        .from(
          "shop-products"
        )
        .getPublicUrl(
          storagePath
        );

    return (
      data?.publicUrl
      ||
      ""
    );

  }
  const SHOP_CATEGORY_GROUPS = [
    {
      id: "balls",
      slug: "balls",
      name: "Bóng Pickleball",
      sort_order: 10
    },
    {
      id: "paddles",
      slug: "paddles",
      name: "Vợt Pickleball",
      sort_order: 20
    },
    {
      id: "grips",
      slug: "grips",
      name: "Quấn cán / Grip",
      sort_order: 30
    },
    {
      id: "care",
      slug: "care",
      name: "Chăm sóc vợt",
      sort_order: 40
    },
    {
      id: "training",
      slug: "training",
      name: "Tập luyện",
      sort_order: 50
    },
    {
      id: "recovery",
      slug: "recovery",
      name: "Bảo hộ / Phục hồi",
      sort_order: 60
    },
    {
      id: "other",
      slug: "other",
      name: "Phụ kiện khác",
      sort_order: 70
    }
  ];


  function normalizeCategoryName(value) {

    return String(
      value ?? ""
    )
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();

  }


  function shopCategoryGroup(category) {

    const text =
      normalizeCategoryName(
        [
          category?.name,
          category?.slug
        ].join(" ")
      );

    if (
      text.includes("bong")
      ||
      text.includes("ball")
    ) {
      return "balls";
    }

    if (
      text.includes("quan can")
      ||
      text.includes("grip")
    ) {
      return "grips";
    }

    if (
      text.includes("cham soc")
      ||
      text.includes("ve sinh")
      ||
      text.includes("dan vien")
      ||
      text.includes("bao ve vot")
      ||
      text.includes("care")
    ) {
      return "care";
    }

    if (
      text.includes("ho tro tap luyen")
      ||
      text.includes("tap luyen")
      ||
      text.includes("training")
    ) {
      return "training";
    }

    if (
      text.includes("bao ho")
      ||
      text.includes("phuc hoi")
      ||
      text.includes("massage")
      ||
      text.includes("tat")
    ) {
      return "recovery";
    }

    if (
      text.includes("vot pickleball")
      ||
      text.includes("phu kien vot")
      ||
      text === "vot"
      ||
      text.includes("paddle")
    ) {
      return "paddles";
    }

    if (
      text.includes("tui")
      ||
      text.includes("phu kien bong")
      ||
      text.includes("phu kien khac")
      ||
      text.includes("other")
    ) {
      return "other";
    }

    return "other";

  }

  function shopCategoryDisplayName(category) {

    const groupId =
      shopCategoryGroup(
        category
      );

    const group =
      SHOP_CATEGORY_GROUPS.find(
        function (item) {
          return item.id === groupId;
        }
      );

    return (
      group?.name
      ||
      category?.name
      ||
      ""
    );

  }


  function shopCategoryOptions() {

    const currentCategoryId =
      String(
        product?.category_id || ""
      );

    const byGroup =
      new Map();

    categories
      .filter(
        function (category) {

          return (
            category.is_active === true
            ||
            String(category.id) === currentCategoryId
          );

        }
      )
      .forEach(
        function (category) {

          const groupId =
            shopCategoryGroup(
              category
            );

          const existing =
            byGroup.get(
              groupId
            );

          const isCurrent =
            String(category.id) === currentCategoryId;

          const existingIsCurrent =
            existing
            &&
            String(existing.id) === currentCategoryId;

          if (
            !existing
            ||
            isCurrent
            ||
            (
              !existingIsCurrent
              &&
              Number(category.sort_order || 9999)
              <
              Number(existing.sort_order || 9999)
            )
          ) {

            byGroup.set(
              groupId,
              category
            );

          }

        }
      );

    return SHOP_CATEGORY_GROUPS
      .map(
        function (group) {
          return byGroup.get(
            group.id
          );
        }
      )
      .filter(Boolean);

    async function ensureShopCategories() {

    const existingGroups =
      new Set(
        categories
          .filter(
            function (category) {
              return category.is_active === true;
            }
          )
          .map(
            function (category) {
              return shopCategoryGroup(category);
            }
          )
      );


    const missingGroups =
      SHOP_CATEGORY_GROUPS.filter(
        function (group) {
          return !existingGroups.has(group.id);
        }
      );


    if (!missingGroups.length) {
      return;
    }


    const rows =
      missingGroups.map(
        function (group) {

          return {
            name:
              group.name,

            slug:
              group.slug,

            is_active:
              true,

            sort_order:
              group.sort_order
          };

        }
      );


    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_categories"
        )
        .insert(
          rows
        )
        .select(
          "id,name,slug,is_active,sort_order"
        );


    if (error) {
      console.warn(
        "SYNC SHOP CATEGORIES ERROR:",
        error
      );

      return;
    }


    categories =
      [
        ...categories,
        ...(data || [])
      ].sort(
        function (a,b) {

          return (
            Number(a.sort_order || 9999)
            -
            Number(b.sort_order || 9999)
          );

        }
      );

  }
  function primaryImage() {

    return (

          function (a,b) {

            if (
              Boolean(

                b.is_primary

              return (
                a.is_primary

                    1

            }

            return (
              Number(
                a.sort_order || 0
              )
              -
              Number(
                b.sort_order || 0
              )

          }
        )[0]

  function productPublicUrl() {

    if (!product?.id) {
      return `${location.origin}/shop`;
    }

    return `${location.origin}/shop-product?id=${encodeURIComponent(
      product.id
    )}`;

  }

  function safeFileName(fileName) {

    const cleaned =
      String(
        fileName || "product-image"
      )
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .replace(
          /[^a-z0-9.]+/g,
          "-"
        )
        .replace(
          /^-+|-+$/g,
          ""
        )
        .slice(
          0,
          90
        );

    return (
      cleaned
      ||
      "product-image.jpg"
    );

  }

  async function uploadSelectedImage() {

    if (!selectedImageFile) {
      return;
    }

    if (
      !selectedImageFile.type
      ||
      !selectedImageFile.type.startsWith(
        "image/"
      )
    ) {

      throw new Error(
        "File tải lên phải là ảnh."
      );

    }

    if (
      selectedImageFile.size
      >
      10 * 1024 * 1024
    ) {

      throw new Error(
        "Ảnh tối đa 10MB."
      );

    }

    const storagePath =
      `products/${product.id}/${Date.now()}-${safeFileName(
        selectedImageFile.name
      )}`;

    const uploadResult =
      await sb.storage
        .from(
          "shop-products"
        )
        .upload(
          storagePath,
          selectedImageFile,
          {
            cacheControl:
              "3600",

            upsert:
              false,

            contentType:
              selectedImageFile.type
          }
        );

    if (uploadResult.error) {
      throw uploadResult.error;
    }

    const primaryResult =
      await sb
        .from(
          "shop_product_images"
        )
        .update({
          is_primary:
            false
        })
        .eq(
          "product_id",
          product.id
        );

    if (primaryResult.error) {
      throw primaryResult.error;
    }

    const insertResult =
      await sb
        .from(
          "shop_product_images"
        )
        .insert({
          product_id:
            product.id,

          variant_id:
            null,

          storage_path:
            storagePath,

          alt_text:
            product.name || null,

          sort_order:
            0,

          is_primary:
            true
        })
        .select(
          "id,product_id,variant_id,storage_path,alt_text,sort_order,is_primary"
        )
        .single();

    if (insertResult.error) {
      throw insertResult.error;
    }

    images =
      [
        insertResult.data,

        ...images.map(
          item => ({
            ...item,

            is_primary:
              false
          })
        )
      ];

    selectedImageFile =
      null;

  }

  function currentWholesaleTiers(
    variantId
  ) {

    return wholesaleTiers
      .filter(
        item =>
          String(
            item.variant_id
          )
          ===
          String(
            variantId
          )
      )
      .sort(
        function (a,b) {

          const aValue =
            Number(
              a.min_quantity
            );

          const bValue =
            Number(
              b.min_quantity
            );

          if (
            !Number.isFinite(aValue)
          ) {
            return 1;
          }

          if (
            !Number.isFinite(bValue)
          ) {
            return -1;
          }

          return (
            aValue
            -
            bValue
          );

        }
      );

  }

  function renderWholesaleTierRows(
    variantId
  ) {

    const box =
      document.getElementById(
        "wholesaleTierList"
      );

    if (!box) {
      return;
    }

    const rows =
      currentWholesaleTiers(
        variantId
      );

    if (!rows.length) {

      box.innerHTML = `
        <div class="wholesale-empty">
          Chưa thiết lập giá sỉ cho SKU này.
        </div>
      `;

      return;

    }

    box.innerHTML =
      rows
        .map(
          function (tier) {

            return `

              <div
                class="wholesale-tier-row"
                data-tier-key="${escapeHtml(
                  tier._key
                )}"
              >

                <div>

                  <label>
                    Từ số lượng
                  </label>

                  <input
                    class="tier-min-input"
                    type="number"
                    min="2"
                    step="1"
                    inputmode="numeric"
                    placeholder="VD: 10"
                    value="${escapeHtml(
                      tier.min_quantity
                      ??
                      ""
                    )}"
                  >

                </div>

                <div>

                  <label>
                    Giá / đơn vị
                  </label>

                  <input
                    class="tier-price-input"
                    type="number"
                    min="0"
                    step="1000"
                    inputmode="numeric"
                    placeholder="VD: 80000"
                    value="${escapeHtml(
                      tier.unit_price
                      ??
                      ""
                    )}"
                  >

                </div>

                <button
                  type="button"
                  class="tier-remove"
                  data-tier-key="${escapeHtml(
                    tier._key
                  )}"
                  aria-label="Xóa mức giá"
                >
                  ×
                </button>

              </div>

            `;

          }
        )
        .join("");

    box
      .querySelectorAll(
        ".wholesale-tier-row"
      )
      .forEach(
        function (row) {

          const key =
            row.dataset.tierKey;

          const tier =
            wholesaleTiers.find(
              item =>
                item._key === key
            );

          if (!tier) {
            return;
          }

          const minInput =
            row.querySelector(
              ".tier-min-input"
            );

          const priceInput =
            row.querySelector(
              ".tier-price-input"
            );

          minInput.addEventListener(
            "input",
            function () {

              tier.min_quantity =
                minInput.value;

            }
          );

          priceInput.addEventListener(
            "input",
            function () {

              tier.unit_price =
                priceInput.value;

            }
          );

        }
      );

    box
      .querySelectorAll(
        ".tier-remove"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              const key =
                button.dataset.tierKey;

              wholesaleTiers =
                wholesaleTiers.filter(
                  item =>
                    item._key !== key
                );

              renderWholesaleTierRows(
                variantId
              );

            }
          );

        }
      );

  }

  async function requireShopAccess() {

    const {
      data: sessionData
    } =
      await sb.auth.getSession();

    const user =
      sessionData?.session?.user;

    if (!user) {

      location.href =
        "./";

      return false;

    }

    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_user_roles"
        )
        .select(
          "role,is_active"
        )
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        );

    if (error) {

      throw new Error(
        "Không kiểm tra được quyền Shop."
      );

    }

    const allowed =
      (data || [])
        .some(
          item =>
            [
              "owner",
              "shop_admin",
              "shop_staff"
            ].includes(
              item.role
            )
        );

    canDeleteDraftProduct =
      (data || [])
        .some(
          item =>
            [
              "owner",
              "shop_admin"
            ].includes(
              item.role
            )
        );

    if (!allowed) {

      throw new Error(
        "Tài khoản chưa có quyền sửa sản phẩm."
      );

    }

    return true;

  }

  async function deleteDraftProduct() {

    clearMessage();

    if (!product?.id) {

      showMessage(
        "Không tìm thấy sản phẩm cần xóa.",
        "error"
      );

      return;

    }

    if (product.status !== "draft") {

      showMessage(
        "Chỉ được xóa sản phẩm đang ở trạng thái nháp.",
        "error"
      );

      return;

    }

    const firstConfirm =
      window.confirm(
        "Anh chắc chắn muốn xóa sản phẩm nháp này?"
      );

    if (!firstConfirm) {
      return;
    }

    const secondConfirm =
      window.confirm(
        "Xóa xong sẽ không khôi phục trên web. Anh xác nhận xóa?"
      );

    if (!secondConfirm) {
      return;
    }

    const deleteBtn =
      document.getElementById(
        "deleteDraftProductBtn"
      );

    if (deleteBtn) {

      deleteBtn.disabled =
        true;

      deleteBtn.textContent =
        "ĐANG XÓA...";

    }

    saveBtn.disabled =
      true;

    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "shop_admin_delete_draft_product",
          {
            p_product_id:
              product.id
          }
        );

      if (error) {
        throw error;
      }

      if (
        data
        &&
        data.success === false
      ) {

        throw new Error(
          data.message
          ||
          "Không xóa được sản phẩm nháp."
        );

      }

      showMessage(
        "Đã xóa sản phẩm nháp.",
        "success"
      );

      setTimeout(
        function () {

          location.href =
            "./shop-admin-products";

        },
        700
      );

    }
    catch (error) {

      console.error(
        "DELETE DRAFT PRODUCT ERROR:",
        error
      );

      showMessage(
        error?.message
        ||
        "Không xóa được sản phẩm nháp.",
        "error"
      );

      if (deleteBtn) {

        deleteBtn.disabled =
          false;

        deleteBtn.textContent =
          "XÓA SẢN PHẨM NHÁP";

      }

      saveBtn.disabled =
        false;

    }

  }

      document.getElementById(
        "toggleAddVariantBtn"
      );

    if (toggleAddVariantBtn) {

      toggleAddVariantBtn.addEventListener(
        "click",
        function () {

          showAddVariantForm =
            !showAddVariantForm;

          clearMessage();

          render();

        }
      );

    }

    const cancelAddVariantBtn =
      document.getElementById(
        "cancelAddVariantBtn"
      );

    if (cancelAddVariantBtn) {

      cancelAddVariantBtn.addEventListener(
        "click",
        function () {

          showAddVariantForm =
            false;

          clearMessage();

          render();

        }
      );

    }

    const newOption1ValueInput =
      document.getElementById(
        "newOption1ValueInput"
      );

    const newOption2ValueInput =
      document.getElementById(
        "newOption2ValueInput"
      );

    const newVariantNameInput =
      document.getElementById(
        "newVariantNameInput"
      );

    function syncNewVariantNamePreview() {

      if (!newVariantNameInput) {
        return;
      }

      const option1Value =
        String(
          newOption1ValueInput?.value
          ||
          ""
        ).trim();

      const option2Value =
        String(
          newOption2ValueInput?.value
          ||
          ""
        ).trim();

      if (option1Value) {

        newVariantNameInput.value =
          option2Value
            ?
              `${option1Value} / ${option2Value}`
            :
              option1Value;

        newVariantNameInput.readOnly =
          true;

      }
      else {

        newVariantNameInput.readOnly =
          false;

      }

    }

    [
      newOption1ValueInput,
      newOption2ValueInput
    ]
      .filter(Boolean)
      .forEach(
        function (input) {

          input.addEventListener(
            "input",
            syncNewVariantNamePreview
          );

        }
      );

    const createVariantBtn =
      document.getElementById(
        "createVariantBtn"
      );

    if (createVariantBtn) {

      createVariantBtn.addEventListener(
        "click",
        addProductVariant
      );

    const imageFileInput =
      document.getElementById(
        "imageFileInput"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );

    if (imageFileInput) {

      imageFileInput.addEventListener(
        "change",
        function (event) {

          const file =
            event.target.files?.[0] || null;

          selectedImageFile =
            file;

          if (!file) {

            if (imagePreview) {

              imagePreview.textContent =
                "Chưa chọn ảnh mới. Hỗ trợ JPG, PNG, WEBP, AVIF tối đa 10MB.";

            }

            return;

          }

          if (
            !file.type
            ||
            !file.type.startsWith(
              "image/"
            )
          ) {

            selectedImageFile =
              null;

            imageFileInput.value =
              "";

            if (imagePreview) {

              imagePreview.textContent =
                "File này không phải ảnh. Anh chọn lại ảnh sản phẩm.";

            }

            return;

          }

          if (
            file.size
            >
            10 * 1024 * 1024
          ) {

            selectedImageFile =
              null;

            imageFileInput.value =
              "";

            if (imagePreview) {

              imagePreview.textContent =
                "Ảnh vượt quá 10MB. Anh chọn ảnh nhẹ hơn.";

            }

            return;

          }

          if (imagePreview) {

            imagePreview.textContent =
              `Đã chọn ảnh mới: ${file.name}`;

          }

        }
      );

    }

    const option1NameInput =
      document.getElementById(
        "option1NameInput"
      );

    const option1ValueInput =
      document.getElementById(
        "option1ValueInput"
      );

    const option2NameInput =
      document.getElementById(
        "option2NameInput"
      );

    const option2ValueInput =
      document.getElementById(
        "option2ValueInput"
      );

    const variantNameInput =
      document.getElementById(
        "variantNameInput"
      );

    function syncVariantNamePreview() {

      if (!variantNameInput) {
        return;
      }

      const option1Value =
        String(
          option1ValueInput?.value
          ||
          ""
        ).trim();

      const option2Value =
        String(
          option2ValueInput?.value
          ||
          ""
        ).trim();

      if (option1Value) {

        variantNameInput.value =
          option2Value
            ?
              `${option1Value} / ${option2Value}`
            :
              option1Value;

      }

    }

    [
      option1NameInput,
      option1ValueInput,
      option2NameInput,
      option2ValueInput
    ]
      .filter(Boolean)
      .forEach(
        function (input) {

          input.addEventListener(
            "input",
            syncVariantNamePreview
          );

        }
      );

    const copyProductLinkBtn =
      document.getElementById(
        "copyProductLinkBtn"
      );

    if (copyProductLinkBtn) {

      copyProductLinkBtn.addEventListener(
        "click",
        async function () {

          const link =
            productPublicUrl();

          try {

            await navigator.clipboard.writeText(
              link
            );

            showMessage(
              "Đã copy link bán hàng.",
              "success"
            );

          }
          catch (error) {

            console.error(
              "COPY PRODUCT LINK ERROR:",
              error
            );

            showMessage(
              link,
              "success"
            );

          }

        }
      );

    }

    const deleteDraftProductBtn =
      document.getElementById(
        "deleteDraftProductBtn"
      );

    if (deleteDraftProductBtn) {

      deleteDraftProductBtn.addEventListener(
        "click",
        deleteDraftProduct
      );

    }

    const addWholesaleTierBtn =
      document.getElementById(
        "addWholesaleTierBtn"
      );

    if (addWholesaleTierBtn) {

      addWholesaleTierBtn
        .addEventListener(
          "click",
          function () {

            wholesaleTiers.push({

              variant_id:
                variant.id,

              min_quantity:
                "",

              unit_price:
                "",

              is_active:
                true,

              _key:
                newTierKey()

            });

            renderWholesaleTierRows(
              variant.id
            );

          }
        );

    }

    renderWholesaleTierRows(
      variant.id
    );

    saveBtn.disabled =
      false;

  }

  /* =====================================================
     ADD VARIANT
  ====================================================== */

  async function addProductVariant() {

    clearMessage();

    const createBtn =
      document.getElementById(
        "createVariantBtn"
      );

    const option1Name =
      nullableText(
        document
          .getElementById(
            "newOption1NameInput"
          )
          ?.value
      );

    const option1Value =
      nullableText(
        document
          .getElementById(
            "newOption1ValueInput"
          )
          ?.value
      );

    const option2Name =
      nullableText(
        document
          .getElementById(
            "newOption2NameInput"
          )
          ?.value
      );

    const option2Value =
      nullableText(
        document
          .getElementById(
            "newOption2ValueInput"
          )
          ?.value
      );

    const variantName =
      nullableText(
        document
          .getElementById(
            "newVariantNameInput"
          )
          ?.value
      );

    const price =
      nullableNumber(
        document
          .getElementById(
            "newVariantPriceInput"
          )
          ?.value
      );

    const comparePrice =
      nullableNumber(
        document
          .getElementById(
            "newVariantComparePriceInput"
          )
          ?.value
      );

    const variantActive =
      Boolean(
        document
          .getElementById(
            "newVariantActiveInput"
          )
          ?.checked
      );

    if (
      (
        option1Name
        &&
        !option1Value
      )
      ||
      (
        !option1Name
        &&
        option1Value
      )
    ) {

      showMessage(
        "Lựa chọn 1 phải có đủ tên và giá trị.",
        "error"
      );

      return;

    }

    if (
      (
        option2Name
        &&
        !option2Value
      )
      ||
      (
        !option2Name
        &&
        option2Value
      )
    ) {

      showMessage(
        "Lựa chọn 2 phải có đủ tên và giá trị.",
        "error"
      );

      return;

    }

    if (
      option2Name
      &&
      !option1Name
    ) {

      showMessage(
        "Phải có Lựa chọn 1 trước khi dùng Lựa chọn 2.",
        "error"
      );

      return;

    }

    if (
      !option1Value
      &&
      !variantName
    ) {

      showMessage(
        "Anh cần nhập lựa chọn hoặc tên biến thể mới.",
        "error"
      );

      return;

    }

    if (
      price === null
      ||
      price < 0
    ) {

      showMessage(
        "Giá niêm yết của biến thể mới không hợp lệ.",
        "error"
      );

      return;

    }

    if (
      comparePrice !== null
      &&
      comparePrice < 0
    ) {

      showMessage(
        "Giá so sánh của biến thể mới không hợp lệ.",
        "error"
      );

      return;

    }

    if (createBtn) {

      createBtn.disabled =
        true;

      createBtn.textContent =
        "ĐANG TẠO...";

    }

    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "shop_admin_add_product_variant_v1",
          {

            p_product_id:
              product.id,

            p_variant_name:
              variantName,

            p_option1_name:
              option1Name,

            p_option1_value:
              option1Value,

            p_option2_name:
              option2Name,

            p_option2_value:
              option2Value,

            p_retail_price:
              price,

            p_compare_at_price:
              comparePrice,

            p_variant_active:
              variantActive

          }
        );

      if (error) {
        throw error;
      }

      if (
        !data
        ||
        !data.id
      ) {

        throw new Error(
          "Hệ thống chưa trả về SKU mới."
        );

      }

      const newVariant = {

        id:
          Number(
            data.id
          ),

        product_id:
          Number(
            data.product_id
            ||
            product.id
          ),

        sku:
          data.sku
          ||
          "",

        variant_name:
          data.variant_name
          ||
          variantName
          ||
          "",

        option1_name:
          data.option1_name
          ??
          option1Name,

        option1_value:
          data.option1_value
          ??
          option1Value,

        option2_name:
          data.option2_name
          ??
          option2Name,

        option2_value:
          data.option2_value
          ??
          option2Value,

        price:
          Number(
            data.price
            ??
            price
          ),

        compare_at_price:
          data.compare_at_price === null
          ||
          data.compare_at_price === undefined
            ?
              null
            :
              Number(
                data.compare_at_price
              ),

        is_active:
          Boolean(
            data.is_active
          ),

        sort_order:
          Number(
            data.sort_order
            ??
            variants.length
          )

      };

      variants =
        [
          ...variants,
          newVariant
        ]
          .sort(
            function (a,b) {

              const sortDiff =
                Number(
                  a.sort_order
                  ||
                  0
                )
                -
                Number(
                  b.sort_order
                  ||
                  0
                );

              if (sortDiff !== 0) {
                return sortDiff;
              }

              return (
                Number(
                  a.id
                  ||
                  0
                )
                -
                Number(
                  b.id
                  ||
                  0
                )
              );

            }
          );

      selectedVariantId =
        newVariant.id;

      showAddVariantForm =
        false;

      showMessage(
        `Đã tạo ${newVariant.variant_name || "biến thể mới"} • ${newVariant.sku || "SKU mới"}.`,
        "success"
      );

      render();

    }
    catch (error) {

      console.error(
        "ADD PRODUCT VARIANT ERROR:",
        error
      );

      showMessage(
        error?.message
        ||
        "Không tạo được biến thể mới.",
        "error"
      );

      if (createBtn) {

        createBtn.disabled =
          false;

        createBtn.textContent =
          "TẠO BIẾN THỂ";

      }

    }

  }

  /* =====================================================
     LOAD
  ====================================================== */

  async function loadData() {

    if (
      !Number.isInteger(productId)
      ||
      productId <= 0
    ) {

      throw new Error(
        "Không có mã sản phẩm hợp lệ."
      );

    }

    await requireShopAccess();

    const [
      productResult,
      variantResult,
      categoryResult,
      imageResult
    ] =
      await Promise.all([

        sb
          .from(
            "shop_products"
          )
          .select(
            "id,product_code,category_id,name,slug,brand,short_description,description,status,is_featured,created_at,updated_at"
          )
          .eq(
            "id",
            productId
          )
          .maybeSingle(),

        sb
          .from(
            "shop_product_variants"
          )
          .select(
            "id,product_id,sku,variant_name,option1_name,option1_value,option2_name,option2_value,price,compare_at_price,is_active,sort_order"
          )
          .eq(
            "product_id",
            productId
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          )
          .order(
            "id",
            {
              ascending:
                true
            }
          ),

        sb
          .from(
            "shop_categories"
          )
          .select(
           "id,name,slug,is_active,sort_order"
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          )
          .order(
            "name",
            {
              ascending:
                true
            }
          ),

        sb
          .from(
            "shop_product_images"
          )
          .select(
            "id,product_id,variant_id,storage_path,alt_text,sort_order,is_primary"
          )
          .eq(
            "product_id",
            productId
          )
          .order(
            "sort_order",
            {
              ascending:
                true
            }
          )

      ]);

    if (productResult.error) {
      throw productResult.error;
    }

    if (variantResult.error) {
      throw variantResult.error;
    }

    if (categoryResult.error) {
      throw categoryResult.error;
    }

    if (imageResult.error) {
      throw imageResult.error;
    }

    if (!productResult.data) {

      throw new Error(
        "Không tìm thấy sản phẩm."
      );

    }

    if (
      !variantResult.data
      ||
      !variantResult.data.length
    ) {

      throw new Error(
        "Sản phẩm chưa có biến thể."
      );

    }

    product =
      productResult.data;

    variants =
      variantResult.data || [];

    categories =
      categoryResult.data || [];
    await ensureShopCategories();
    images =
      imageResult.data || [];

    const variantIds =
      variants.map(
        item =>
          item.id
      );

    let tierData = [];

    if (variantIds.length) {

      const {
        data,
        error
      } =
        await sb
          .from(
            "shop_variant_wholesale_tiers"
          )
          .select(
            "id,variant_id,min_quantity,unit_price,is_active"
          )
          .in(
            "variant_id",
            variantIds
          )
          .eq(
            "is_active",
            true
          )
          .order(
            "min_quantity",
            {
              ascending:
                true
            }
          );

      if (error) {
        throw error;
      }

      tierData =
        data || [];

    }

    wholesaleTiers =
      tierData.map(
        item => ({
          ...item,

          _key:
            `db-${item.id}`
        })
      );

    selectedVariantId =
      variants[0].id;

    render();

  }

  /* =====================================================
     SAVE
  ====================================================== */

  async function saveProduct() {

    clearMessage();

    const variant =
      selectedVariant();

    if (!variant) {

      showMessage(
        "Không tìm thấy biến thể cần sửa.",
        "error"
      );

      return;

    }

    const name =
      document
        .getElementById(
          "nameInput"
        )
        .value
        .trim();

    const brand =
      document
        .getElementById(
          "brandInput"
        )
        .value
        .trim();

    const categoryText =
      document
        .getElementById(
          "categoryInput"
        )
        .value;

    const shortDescription =
      document
        .getElementById(
          "shortDescriptionInput"
        )
        .value;

    const description =
      document
        .getElementById(
          "descriptionInput"
        )
        .value;

    const status =
      document
        .getElementById(
          "statusInput"
        )
        .value;

    const featured =
      document
        .getElementById(
          "featuredInput"
        )
        .checked;

    const variantName =
      document
        .getElementById(
          "variantNameInput"
        )
        .value;

    const option1Name =
      nullableText(
        document
          .getElementById(
            "option1NameInput"
          )
          .value
      );

    const option1Value =
      nullableText(
        document
          .getElementById(
            "option1ValueInput"
          )
          .value
      );

    const option2Name =
      nullableText(
        document
          .getElementById(
            "option2NameInput"
          )
          .value
      );

    const option2Value =
      nullableText(
        document
          .getElementById(
            "option2ValueInput"
          )
          .value
      );

    const priceText =
      document
        .getElementById(
          "priceInput"
        )
        .value;

    const comparePriceText =
      document
        .getElementById(
          "comparePriceInput"
        )
        .value;

    const variantActive =
      document
        .getElementById(
          "variantActiveInput"
        )
        .checked;

    const hasNewImage =
      Boolean(
        selectedImageFile
      );

    if (!name) {

      showMessage(
        "Anh cần nhập tên sản phẩm.",
        "error"
      );

      return;

    }

    if (
      (
        option1Name
        &&
        !option1Value
      )
      ||
      (
        !option1Name
        &&
        option1Value
      )
    ) {

      showMessage(
        "Lựa chọn 1 phải có đủ tên và giá trị.",
        "error"
      );

      return;

    }

    if (
      (
        option2Name
        &&
        !option2Value
      )
      ||
      (
        !option2Name
        &&
        option2Value
      )
    ) {

      showMessage(
        "Lựa chọn 2 phải có đủ tên và giá trị.",
        "error"
      );

      return;

    }

    if (
      option2Name
      &&
      !option1Name
    ) {

      showMessage(
        "Phải có Lựa chọn 1 trước khi dùng Lựa chọn 2.",
        "error"
      );

      return;

    }

    let finalVariantName =
      nullableText(
        variantName
      );

    if (option1Value) {

      finalVariantName =
        option2Value
          ?
            `${option1Value} / ${option2Value}`
          :
            option1Value;

    }

    const price =
      nullableNumber(
        priceText
      );

    if (
      price === null
      ||
      price < 0
    ) {

      showMessage(
        "Giá niêm yết không hợp lệ.",
        "error"
      );

      return;

    }

    const comparePrice =
      nullableNumber(
        comparePriceText
      );

    if (
      comparePrice !== null
      &&
      comparePrice < 0
    ) {

      showMessage(
        "Giá so sánh không hợp lệ.",
        "error"
      );

      return;

    }

    const categoryId =
      categoryText
        ?
          Number(
            categoryText
          )
        :
          null;

    /* =====================================================
       BẢNG GIÁ SỈ
    ====================================================== */

    const tierRows =
      currentWholesaleTiers(
        variant.id
      );

    const tiers = [];

    for (
      const tier
      of tierRows
    ) {

      const minText =
        String(
          tier.min_quantity
          ??
          ""
        ).trim();

      const tierPriceText =
        String(
          tier.unit_price
          ??
          ""
        ).trim();

      if (
        !minText
        &&
        !tierPriceText
      ) {

        continue;

      }

      if (
        !minText
        ||
        !tierPriceText
      ) {

        showMessage(
          "Mỗi mức giá sỉ phải có đủ số lượng tối thiểu và giá bán.",
          "error"
        );

        return;

      }

      const minQuantity =
        Number(
          minText
        );

      const unitPrice =
        Number(
          tierPriceText
        );

      if (
        !Number.isInteger(
          minQuantity
        )
        ||
        minQuantity < 2
      ) {

        showMessage(
          "Số lượng tối thiểu của giá sỉ phải từ 2 trở lên.",
          "error"
        );

        return;

      }

      if (
        !Number.isInteger(
          unitPrice
        )
        ||
        unitPrice < 0
      ) {

        showMessage(
          "Giá sỉ không hợp lệ.",
          "error"
        );

        return;

      }

      if (
        unitPrice > price
      ) {

        showMessage(
          "Giá sỉ không được cao hơn giá niêm yết.",
          "error"
        );

        return;

      }

      tiers.push({
        min_quantity:
          minQuantity,

        unit_price:
          unitPrice
      });

    }

    tiers.sort(
      (a,b) =>
        a.min_quantity
        -
        b.min_quantity
    );

    for (
      let i = 1;
      i < tiers.length;
      i++
    ) {

      if (
        tiers[i].min_quantity
        ===
        tiers[i - 1].min_quantity
      ) {

        showMessage(
          "Không được có hai mức giá sỉ cùng số lượng tối thiểu.",
          "error"
        );

        return;

      }

      if (
        tiers[i].unit_price
        >
        tiers[i - 1].unit_price
      ) {

        showMessage(
          "Số lượng càng cao thì giá sỉ không được tăng lên.",
          "error"
        );

        return;

      }

    }

    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "ĐANG LƯU...";

    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          "shop_admin_update_product_v4",
          {

            p_product_id:
              product.id,

            p_name:
              name,

            p_brand:
              nullableText(
                brand
              ),

            p_category_id:
              categoryId,

            p_short_description:
              nullableText(
                shortDescription
              ),

            p_description:
              nullableText(
                description
              ),

            p_status:
              status,

            p_is_featured:
              featured,

            p_variant_id:
              variant.id,

            p_variant_name:
              finalVariantName,

            p_retail_price:
              price,

            p_compare_at_price:
              comparePrice,

            p_variant_active:
              variantActive,

            p_option1_name:
              option1Name,

            p_option1_value:
              option1Value,

            p_option2_name:
              option2Name,

            p_option2_value:
              option2Value,

            p_tiers:
              tiers

          }
        );

      if (error) {
        throw error;
      }

      product = {
        ...product,

        name:
          name,

        brand:
          nullableText(
            brand
          ),

        category_id:
          categoryId,

        short_description:
          nullableText(
            shortDescription
          ),

        description:
          nullableText(
            description
          ),

        status:
          status,

        is_featured:
          featured
      };

      variants =
        variants.map(
          function (item) {

            if (
              String(item.id)
              !==
              String(variant.id)
            ) {

              return item;

            }

            return {
              ...item,

              variant_name:
                finalVariantName,

              option1_name:
                option1Name,

              option1_value:
                option1Value,

              option2_name:
                option2Name,

              option2_value:
                option2Value,

              price:
                price,

              compare_at_price:
                comparePrice,

              is_active:
                variantActive
            };

          }
        );

      wholesaleTiers = [

        ...wholesaleTiers.filter(
          item =>
            String(
              item.variant_id
            )
            !==
            String(
              variant.id
            )
        ),

        ...tiers.map(
          item => ({
            ...item,

            variant_id:
              variant.id,

            is_active:
              true,

            _key:
              newTierKey()
          })
        )

      ];

      if (hasNewImage) {

        await uploadSelectedImage();

      }

      showMessage(
        `Đã lưu ${data?.product_code || product.product_code || "sản phẩm"} • ${finalVariantName || variant.sku || "SKU"} • ${tiers.length} mức giá sỉ${hasNewImage ? " • đã cập nhật ảnh chính" : ""}.`,
        "success"
      );

      render();

    }
    catch (error) {

      console.error(
        "UPDATE PRODUCT V4 ERROR:",
        error
      );

      showMessage(
        error?.message
        ||
        "Không lưu được sản phẩm.",
        "error"
      );

    }
    finally {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "LƯU THAY ĐỔI";

    }

  }

  /* =====================================================
     EVENTS
  ====================================================== */

  saveBtn.addEventListener(
    "click",
    saveProduct
  );

  /* =====================================================
     START
  ====================================================== */

  async function start() {

    try {

      await loadData();

    }
    catch (error) {

      console.error(
        "PRODUCT EDIT LOAD ERROR:",
        error
      );

      showFatal(
        error?.message
        ||
        "Không tải được sản phẩm."
      );

    }

  }

  start();

})();

</script>

<script src="/shop-notifications.js?v=20261006-2"></script>
