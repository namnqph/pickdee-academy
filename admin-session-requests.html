  <style>

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #131313,
          #202020 50%,
          #101010
        );

    }


    header {

      padding: 18px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      border-bottom:
        1px solid rgba(255,255,255,.12);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color: #ffc934;

    }


    .back {

      color: #ffc934;

      text-decoration: none;

      font-weight: 900;

    }


    main {

      width:
        min(
          1100px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        38px 0 70px;

    }


    .eyebrow {

      color: #ffc934;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    h1 {

      margin:
        8px 0 8px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );

    }


    .intro {

      margin-bottom: 24px;

      color:
        rgba(255,255,255,.62);

      line-height: 1.55;

    }


    /* =====================================================
       SUMMARY
    ====================================================== */

    .summary-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 12px;

      margin-bottom: 20px;

    }


    .summary-card {

      padding: 17px;

      border-radius: 15px;

      background:
        rgba(32,32,32,.78);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .summary-card.alert {

      border-color:
        rgba(255,100,100,.38);

    }


    .summary-label {

      margin-bottom: 5px;

      color:
        rgba(255,255,255,.52);

      font-size: 12px;

    }


    .summary-value {

      color: #ffc934;

      font-size: 25px;

      font-weight: 900;

    }


    .summary-value.red {

      color: #ff9c9c;

    }


    /* =====================================================
       FILTER
    ====================================================== */

    .controls {

      display: grid;

      grid-template-columns:
        1fr 220px auto;

      gap: 10px;

      margin-bottom: 18px;

    }


    input,
    select {

      min-height: 48px;

      padding:
        11px 13px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.16);

      background: #121212;

      color: white;

      font-size: 14px;

      outline: none;

    }


    input:focus,
    select:focus {

      border-color:
        rgba(255,201,52,.55);

    }


    button {

      min-height: 48px;

      padding:
        0 17px;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.15);

      background:
        rgba(255,255,255,.08);

      color: white;

      font-weight: 900;

      cursor: pointer;

    }


    button:disabled {

      opacity: .5;

    }


    #message {

      min-height: 22px;

      margin-bottom: 15px;

      color: #ffc934;

      font-size: 13px;

      font-weight: 800;

    }


    /* =====================================================
       LIST
    ====================================================== */

    #list {

      display: grid;

      gap: 15px;

    }


    .request-card {

      padding: 20px;

      border-radius: 17px;

      background:
        rgba(32,32,32,.78);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .request-card.overdue {

      border-color:
        rgba(255,90,90,.45);

      background:
        linear-gradient(
          145deg,
          rgba(80,28,42,.45),
          rgba(32,32,32,.82)
        );

    }


    .request-head {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 14px;

      margin-bottom: 16px;

    }


    .request-code {

      color: #ffc934;

      font-size: 20px;

      font-weight: 900;

    }


    .student-name {

      margin-top: 5px;

      font-size: 17px;

      font-weight: 900;

    }


    .request-sub {

      margin-top: 4px;

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

      line-height: 1.45;

    }


    .badge {

      padding:
        7px 10px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 900;

      white-space: nowrap;

    }


    .badge.pending {

      color: #ffc46b;

      background:
        rgba(255,196,107,.12);

    }


    .badge.approved {

      color: #ffc934;

      background:
        rgba(255,255,255,.084);

    }


    .badge.rejected {

      color: #ffaaaa;

      background:
        rgba(255,100,100,.12);

    }


    .badge.overdue {

      color: white;

      background:
        rgba(255,65,65,.75);

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 10px;

    }


    .info-box {

      padding: 12px;

      border-radius: 11px;

      background:
        rgba(0,0,0,.13);

      border:
        1px solid rgba(255,255,255,.07);

    }


    .info-label {

      margin-bottom: 4px;

      color:
        rgba(255,255,255,.45);

      font-size: 11px;

    }


    .info-value {

      font-weight: 800;

      line-height: 1.45;

    }


    .result-box {

      margin-top: 14px;

      padding: 14px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.74);

      font-size: 13px;

      line-height: 1.55;

    }


    .result-box.approved {

      border-color:
        rgba(255,201,52,.25);

    }


    .result-box.rejected {

      border-color:
        rgba(255,100,100,.3);

    }


    .result-title {

      margin-bottom: 6px;

      font-weight: 900;

    }


    .approved
    .result-title {

      color: #ffc934;

    }


    .rejected
    .result-title {

      color: #ffaaaa;

    }


    .warning {

      margin-top: 14px;

      padding: 13px;

      border-radius: 11px;

      border:
        1px solid rgba(255,100,100,.3);

      background:
        rgba(255,70,70,.08);

      color: #ffb0b0;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.5;

    }


    .empty {

      padding: 38px 20px;

      border-radius: 17px;

      background:
        rgba(32,32,32,.72);

      border:
        1px solid rgba(255,255,255,.12);

      text-align: center;

      color:
        rgba(255,255,255,.62);

      line-height: 1.6;

    }


    @media(max-width:850px) {

      .summary-grid,
      .info-grid {

        grid-template-columns:
          repeat(2,1fr);

      }


      .controls {

        grid-template-columns: 1fr;

      }

    }


    @media(max-width:550px) {

      .summary-grid,
      .info-grid {

        grid-template-columns: 1fr;

      }


      .request-head {

        flex-direction: column;

      }

    }

  </style>

<main>

  <div class="intro">

  <section class="summary-grid">


    <div class="summary-card">

      <div class="summary-label">
        Chờ Coach
      </div>

      <div
        id="pendingCount"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card alert">

      <div class="summary-label">
        Cần can thiệp
      </div>

      <div
        id="overdueCount"
        class="summary-value red"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Đã duyệt
      </div>

      <div
        id="approvedCount"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Từ chối
      </div>

      <div
        id="rejectedCount"
        class="summary-value"

        0
      </div>

    </div>


  </section>


  <section class="controls">


    <input
      id="searchInput"
      type="search"
      placeholder="Tìm Học viên, Coach, mã YC, mã đăng ký..."
    >


    <select id="statusFilter">

      <option value="ALL">
        Tất cả trạng thái
      </option>

      <option value="OVERDUE">
        ⚠ Cần can thiệp
      </option>

      <option value="Chờ Coach">
        Chờ Coach
      </option>

      <option value="Đã duyệt">
        Đã duyệt
      </option>

      <option value="Từ chối">
        Từ chối
      </option>

    </select>


    <button
      id="refreshBtn"
      type="button"
    >

      ↻ Cập nhật

    </button>


  </section>


  <div id="message">

  </div>

<script>

(async function () {


  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     ELEMENTS
  ====================================================== */

  const pendingCount =
    document.getElementById(
      "pendingCount"
    );


  const overdueCount =
    document.getElementById(
      "overdueCount"
    );


  const approvedCount =
    document.getElementById(
      "approvedCount"
    );


  const rejectedCount =
    document.getElementById(
      "rejectedCount"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  const messageEl =
    document.getElementById(
      "message"
    );


  const listEl =
    document.getElementById(
      "list"
    );


  let allRows =
    [];


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function formatDate(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    const match =
      raw.match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );


    if (!match) {

      return raw;

    }


    return (
      match[3]
      +
      "/"
      +
      match[2]
      +
      "/"
      +
      match[1]
    );

  }


  function formatTime(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    const match =
      raw.match(
        /^(\d{1,2}):(\d{2})/
      );


    if (!match) {

      return raw;

    }


    return (
      String(
        Number(match[1])
      ).padStart(
        2,
        "0"
      )
      +
      ":"
      +
      match[2]
    );

  }


  function requestDateTime(row) {


    const date =
      String(
        row.requested_date || ""
      ).match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );


    const time =
      String(
        row.requested_time || ""
      ).match(
        /^(\d{1,2}):(\d{2})/
      );


    if (
      !date
      ||
      !time
    ) {

      return null;

    }


    const result =
      new Date(

        Number(date[1]),

        Number(date[2]) - 1,

        Number(date[3]),

        Number(time[1]),

        Number(time[2]),

        0,

        0

      );


    if (
      Number.isNaN(
        result.getTime()
      )
    ) {

      return null;

    }


    return result;

  }


  function isOverdue(row) {


    if (
      row.status !== "Chờ Coach"
    ) {

      return false;

    }


    const date =
      requestDateTime(row);


    if (!date) {

      return false;

    }


    return (
      date.getTime()
      <
      Date.now()
    );

  }


  function badgeClass(row) {


    if (
      isOverdue(row)
    ) {

      return "overdue";

    }


    if (
      row.status === "Đã duyệt"
    ) {

      return "approved";

    }


    if (
      row.status === "Từ chối"
    ) {

      return "rejected";

    }


    return "pending";

  }


  function badgeText(row) {


    if (
      isOverdue(row)
    ) {

      return "⚠ CẦN CAN THIỆP";

    }


    return row.status || "—";

  }


  function showMessage(text) {

    messageEl.textContent =
      text || "";

  }


  /* =====================================================
     AUTH
  ====================================================== */

  async function checkAdmin() {


    const {
      data,
      error
    } =
      await sb.auth
        .getSession();


    if (
      error
      ||
      !data?.session
    ) {


      location.replace(
        "./login.html"
      );


      return false;

    }


    return true;

  }


  /* =====================================================
     LOAD RPC
  ====================================================== */

  async function loadData() {


    refreshBtn.disabled =
      true;


    refreshBtn.textContent =
      "Đang tải...";


    showMessage(
      "Đang cập nhật yêu cầu lịch..."
    );


    listEl.innerHTML =
      `
        <div class="empty">

          Đang tải yêu cầu...

        </div>
      `;


    const {
      data,
      error
    } =
      await sb.rpc(
        "admin_get_session_requests"
      );


    if (error) {


      console.error(
        "RPC ERROR:",
        error
      );


      refreshBtn.disabled =
        false;


      refreshBtn.textContent =
        "↻ Cập nhật";


      showMessage(
        "Lỗi: "
        +
        (
          error.message
          ||
          "Không tải được dữ liệu"
        )
      );


      listEl.innerHTML =
        `
          <div class="empty">

            Không tải được yêu cầu lịch học.

          </div>
        `;


      return;

    }


    let rows =
      data;


    /*
      Phòng trường hợp RPC trả JSON dạng chuỗi.
    */

    if (
      typeof rows === "string"
    ) {


      try {

        rows =
          JSON.parse(rows);

      }
      catch {

        rows =
          [];

      }

    }


    if (
      !Array.isArray(rows)
    ) {

      rows =
        [];

    }


    allRows =
      rows;


    updateSummary();


    render();


    refreshBtn.disabled =
      false;


    refreshBtn.textContent =
      "↻ Cập nhật";


    showMessage(
      `✓ Đã tải ${allRows.length} yêu cầu.`
    );

  }


  /* =====================================================
     SUMMARY
  ====================================================== */

  function updateSummary() {


    pendingCount.textContent =
      allRows.filter(
        row =>
          row.status
          ===
          "Chờ Coach"
      ).length;


    overdueCount.textContent =
      allRows.filter(
        isOverdue
      ).length;


    approvedCount.textContent =
      allRows.filter(
        row =>
          row.status
          ===
          "Đã duyệt"
      ).length;


    rejectedCount.textContent =
      allRows.filter(
        row =>
          row.status
          ===
          "Từ chối"
      ).length;

  }


  /* =====================================================
     FILTER
  ====================================================== */

  function getFilteredRows() {


    const keyword =
      String(
        searchInput.value || ""
      )
        .trim()
        .toLowerCase();


    const filter =
      statusFilter.value;


    return allRows
      .filter(
        row => {


          if (
            filter === "OVERDUE"
            &&
            !isOverdue(row)
          ) {

            return false;

          }


          if (
            filter !== "ALL"
            &&
            filter !== "OVERDUE"
            &&
            row.status !== filter
          ) {

            return false;

          }


          if (!keyword) {

            return true;

          }


          const text =
            [

              row.request_code,

              row.registration_code,

              row.package_name,

              row.student_code,

              row.student_name,

              row.coach_code,

              row.coach_name,

              row.requested_area,

              row.requested_ward,

              row.session_code,

              row.coach_note

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          return text.includes(
            keyword
          );

        }
      )
      .sort(
        (a,b) => {


          const aOverdue =
            isOverdue(a)
              ?
              1
              :
              0;


          const bOverdue =
            isOverdue(b)
              ?
              1
              :
              0;


          if (
            aOverdue !== bOverdue
          ) {

            return (
              bOverdue
              -
              aOverdue
            );

          }


          if (
            a.status === "Chờ Coach"
            &&
            b.status !== "Chờ Coach"
          ) {

            return -1;

          }


          if (
            b.status === "Chờ Coach"
            &&
            a.status !== "Chờ Coach"
          ) {

            return 1;

          }


          return (
            Number(b.id || 0)
            -
            Number(a.id || 0)
          );

        }
      );

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function render() {


    const rows =
      getFilteredRows();


    if (
      rows.length === 0
    ) {


      listEl.innerHTML =
        `
          <div class="empty">

            Không có yêu cầu phù hợp.

          </div>
        `;


      return;

    }


    listEl.innerHTML =
      "";


    rows.forEach(
      row => {


        const overdue =
          isOverdue(row);


        const card =
          document.createElement(
            "article"
          );


        card.className =
          overdue
            ?
            "request-card overdue"
            :
            "request-card";


        let resultHtml =
          "";


        /* =================================================
           ĐÃ DUYỆT
        ================================================== */

        if (
          row.status === "Đã duyệt"
        ) {


          resultHtml =
            `

              <div class="result-box approved">

                <div class="result-title">

                  ✅ Coach đã duyệt

                </div>


                ${
                  row.session_code
                    ?
                    `
                      Buổi học:
                      <strong>
                        ${escapeHtml(
                          row.session_code
                        )}
                      </strong>
                      <br>
                    `
                    :
                    ""
                }


                Sân:

                <strong>

                  ${escapeHtml(
                    row.court_name
                    ||
                    "—"
                  )}

                </strong>


                ${
                  row.coach_note
                    ?
                    `
                      <br><br>

                      Ghi chú Coach:

                      <strong>

                        ${escapeHtml(
                          row.coach_note
                        )}

                      </strong>
                    `
                    :
                    ""
                }


              </div>

            `;

        }


        /* =================================================
           TỪ CHỐI
        ================================================== */

        if (
          row.status === "Từ chối"
        ) {


          resultHtml =
            `

              <div class="result-box rejected">

                <div class="result-title">

                  ✕ Coach đã từ chối

                </div>


                Lý do:

                <strong>

                  ${escapeHtml(
                    row.coach_note
                    ||
                    "Chưa có lý do"
                  )}

                </strong>


              </div>

            `;

        }


        /* =================================================
           CẦN CAN THIỆP
        ================================================== */

        if (overdue) {


          resultHtml +=
            `

              <div class="warning">

                ⚠ Yêu cầu đã đến thời gian học
                nhưng Coach vẫn chưa xử lý.

                <br><br>

                Admin cần kiểm tra Coach
                hoặc liên hệ Học viên.

              </div>

            `;

        }


        /* =================================================
           CARD
        ================================================== */

        card.innerHTML =
          `

            <div class="request-head">


              <div>


                <div class="request-code">

                  ${escapeHtml(
                    row.request_code
                    ||
                    `YC${row.id}`
                  )}

                </div>


                <div class="student-name">

                  ${escapeHtml(
                    row.student_name
                    ||
                    "Học viên"
                  )}

                </div>


                <div class="request-sub">

                  ${escapeHtml(
                    row.student_code
                    ||
                    ""
                  )}

                  ${
                    row.registration_code
                      ?
                      ` · ${escapeHtml(
                        row.registration_code
                      )}`
                      :
                      ""
                  }

                </div>


              </div>


              <div
                class="badge ${badgeClass(
                  row
                )}"
              >

                ${escapeHtml(
                  badgeText(row)
                )}

              </div>


            </div>


            <div class="info-grid">


              <div class="info-box">

                <div class="info-label">

                  Gói / Buổi

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    row.package_name
                    ||
                    "—"
                  )}

                  <br>

                  Buổi ${escapeHtml(
                    row.session_no
                    ||
                    "—"
                  )}

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Ngày / giờ yêu cầu

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    formatDate(
                      row.requested_date
                    )
                  )}

                  ·

                  ${escapeHtml(
                    formatTime(
                      row.requested_time
                    )
                  )}

                  <br>

                  ${escapeHtml(
                    row.duration_minutes
                    ||
                    60
                  )}
                  phút

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Coach phụ trách

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    row.coach_name
                    ||
                    row.coach_code
                    ||
                    "—"
                  )}

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Khu vực

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    [
                      row.requested_ward,
                      row.requested_area
                    ]
                    .filter(Boolean)
                    .join(" · ")
                    ||
                    "—"
                  )}

                </div>

              </div>


            </div>


            ${
              row.note
                ?
                `
                  <div class="result-box">

                    <strong>
                      Ghi chú Học viên:
                    </strong>

                    ${escapeHtml(
                      row.note
                    )}

                  </div>
                `
                :
                ""
            }


            ${resultHtml}


          `;


        listEl.appendChild(
          card
        );


      }
    );

  }


  /* =====================================================
     EVENTS
  ====================================================== */

  searchInput.addEventListener(
    "input",
    render
  );


  statusFilter.addEventListener(
    "change",
    render
  );


  refreshBtn.addEventListener(
    "click",
    loadData
  );


  /* =====================================================
     START
  ====================================================== */

  try {


    const ok =
      await checkAdmin();


    if (!ok) {

      return;

    }


    await loadData();


    setInterval(
      loadData,
      60000
    );


  }
  catch (error) {


    console.error(
      "PAGE ERROR:",
      error
    );


    showMessage(
      "Lỗi trang: "
      +
      (
        error?.message
        ||
        error
        ||
        "Không xác định"
      )
    );


    listEl.innerHTML =
      `
        <div class="empty">

          Có lỗi khi tải trang.

        </div>
      `;


  }


})();

</script>


<script src="/academy-admin-appnav.js?v=20261020-gold2"></script>
<script src="/pd-app.js?v=20261020-gold2"></script>
</body>
