<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>
    Gói học của tôi | PickDee Academy
  </title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js?v=20261017-logout1"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:

        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );

    }


    .topbar {

      padding: 18px 24px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      border-bottom:
        1px solid
        rgba(255,255,255,.12);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color: #d8ff45;

    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    #userEmail {

      color:
        rgba(255,255,255,.8);

      font-size: 14px;

    }


    .logout {

      border:
        1px solid
        rgba(255,255,255,.18);

      background:
        rgba(255,255,255,.08);

      color: white;

      padding:
        9px 12px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: 800;

    }


    .container {

      width:
        min(
          1050px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        32px 0 60px;

    }


    .back {

      color: #d8ff45;

      text-decoration: none;

      font-weight: 800;

    }


    .eyebrow {

      margin-top: 25px;

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    h1 {

      margin:
        8px 0 5px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );

    }


    .sub {

      color:
        rgba(255,255,255,.62);

      margin-bottom: 24px;

    }


    .student-card {

      padding: 18px;

      border-radius: 16px;

      background:
        rgba(6,39,88,.74);

      border:
        1px solid
        rgba(255,255,255,.12);

      margin-bottom: 18px;

    }


    .student-name {

      font-size: 20px;

      font-weight: 900;

    }


    .student-code {

      color: #d8ff45;

      margin-top: 5px;

      font-weight: 800;

    }


    .registration {

      padding: 20px;

      border-radius: 16px;

      background:
        rgba(6,39,88,.74);

      border:
        1px solid
        rgba(255,255,255,.12);

      margin-bottom: 14px;

    }


    .registration-top {

      display: flex;

      justify-content:
        space-between;

      gap: 14px;

      align-items:
        flex-start;

      margin-bottom: 18px;

    }


    .registration-code {

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: .5px;

    }


    .package-name {

      margin-top: 5px;

      font-size: 23px;

      font-weight: 900;

    }


    .badge {

      display: inline-block;

      padding:
        6px 10px;

      border-radius: 999px;

      color: #d8ff45;

      background:
        rgba(216,255,69,.12);

      font-size: 12px;

      font-weight: 900;

      white-space: nowrap;

    }


    .badge.pending {

      color: #ffd86b;

      background:
        rgba(255,216,107,.12);

    }


    .badge.rejected {

      color: #ff9c9c;

      background:
        rgba(255,156,156,.12);

    }


    .grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;

    }


    .label {

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

      margin-bottom: 4px;

    }


    .value {

      font-weight: 800;

      line-height: 1.4;

    }


    .payment-ok {

      color: #d8ff45;

    }


    .payment-wait {

      color: #ffd86b;

    }


    #message {

      margin:
        16px 0;

      min-height: 20px;

      color: #ffb0b0;

      font-weight: 700;

    }


    #empty {

      display: none;

      padding: 35px;

      text-align: center;

      border-radius: 16px;

      background:
        rgba(6,39,88,.74);

      border:
        1px solid
        rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.65);

    }


    @media (max-width: 700px) {

      .grid {

        grid-template-columns:
          1fr;

      }


      .registration-top {

        flex-direction:
          column;

      }


      #userEmail {

        display: none;

      }


      .topbar {

        padding:
          15px;

      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    PickDee
    <span>
      Academy
    </span>

  </div>


  <div class="user-area">

    <div id="userEmail">
    </div>


    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      ĐĂNG XUẤT
    </button>

  </div>

</header>


<main class="container">


  <a
    class="back"
    href="./student"
  >
    ← Khu vực học viên
  </a>


  <div class="eyebrow">
    KHU VỰC HỌC VIÊN
  </div>


  <h1>
    Gói học của tôi
  </h1>


  <div class="sub">
    Các đăng ký học thuộc tài khoản của bạn.
  </div>


  <section class="student-card">

    <div
      id="studentName"
      class="student-name"
    >
      Đang tải...
    </div>


    <div
      id="studentCode"
      class="student-code"
    >
    </div>

  </section>


  <div id="message">
    Đang tải gói học...
  </div>


  <div id="registrationList">
  </div>


  <div id="empty">
    Bạn chưa có đăng ký học REAL nào.
  </div>


</main>


<script>

window.PICKDEE_NOTIFICATION_ROLE =
  "student";

</script>


<script src="./notifications.js?v=20261017-sales1"></script>


<script>

(async function () {


  /* =====================================================
     PICKDEE ACADEMY
     STUDENT REGISTRATIONS

     QUY TẮC:
     - Phải đăng nhập
     - Chỉ lấy đăng ký của Học viên hiện tại
     - Chỉ hiển thị REAL: is_test = false
     - Tiền đã đóng chỉ tính tuition_payments
       có status = "Đã thu"
     - TEST tuyệt đối không xuất hiện
  ====================================================== */


  const cfg =
    window.PICKDEE_CONFIG || {};


  const studentNameEl =
    document.getElementById(
      "studentName"
    );


  const studentCodeEl =
    document.getElementById(
      "studentCode"
    );


  const userEmailEl =
    document.getElementById(
      "userEmail"
    );


  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );


  const messageEl =
    document.getElementById(
      "message"
    );


  const registrationList =
    document.getElementById(
      "registrationList"
    );


  const emptyEl =
    document.getElementById(
      "empty"
    );


  let sb = null;


  /* =====================================================
     HELPERS
  ====================================================== */


  function escapeHtml(value) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatMoney(value) {

    const number =
      Number(
        value || 0
      );


    return (
      number
        .toLocaleString(
          "vi-VN"
        )
      +
      "đ"
    );

  }


  function formatDate(value) {

    if (!value) {

      return "—";

    }


    const date =
      new Date(
        `${value}T00:00:00`
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return value;

    }


    return new Intl.DateTimeFormat(
      "vi-VN"
    ).format(
      date
    );

  }


  function statusClass(status) {

    const value =
      String(
        status || ""
      ).trim();


    if (
      value ===
      "Đã duyệt"
    ) {

      return "";

    }


    if (
      value.toLowerCase()
        .includes("từ chối")
    ) {

      return "rejected";

    }


    return "pending";

  }


  function getOne(value) {

    if (
      Array.isArray(value)
    ) {

      return (
        value[0]
        ||
        null
      );

    }


    return (
      value
      ||
      null
    );

  }


  /* =====================================================
     INIT SUPABASE
  ====================================================== */


  function initSupabase() {

    if (
      !window.supabase
    ) {

      throw new Error(
        "Không tải được thư viện Supabase."
      );

    }


    if (
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      throw new Error(
        "Không đọc được config.js."
      );

    }


    sb =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

  }


  /* =====================================================
     LOGIN
  ====================================================== */


  async function getSession() {

    const {
      data,
      error
    } =
      await sb.auth
        .getSession();


    if (error) {

      throw error;

    }


    if (
      !data?.session
    ) {

      location.replace(
        "./login.html"
      );

      return null;

    }


    userEmailEl.textContent =
      data.session.user.email
      ||
      "";


    return data.session;

  }


  /* =====================================================
     CURRENT STUDENT
  ====================================================== */


  async function getCurrentStudent() {

    const {
      data: studentId,
      error: studentIdError
    } =
      await sb.rpc(
        "current_student_id"
      );


    if (studentIdError) {

      throw new Error(
        "Không xác định được Học viên: "
        +
        studentIdError.message
      );

    }


    if (!studentId) {

      throw new Error(
        "Tài khoản chưa liên kết với hồ sơ Học viên."
      );

    }


    const {
      data: student,
      error: studentError
    } =
      await sb
        .from(
          "students"
        )
        .select(`
          id,
          student_code,
          full_name
        `)
        .eq(
          "id",
          Number(studentId)
        )
        .maybeSingle();


    if (studentError) {

      throw studentError;

    }


    if (!student) {

      throw new Error(
        "Không tìm thấy hồ sơ Học viên."
      );

    }


    return student;

  }


  /* =====================================================
     LOAD REAL REGISTRATIONS
  ====================================================== */


  async function getRegistrations(
    studentId
  ) {

    const {
      data,
      error
    } =
      await sb
        .from(
          "registrations"
        )
        .select(`
          id,
          registration_code,
          student_id,
          coach_id,
          package_name,
          purchased_sessions,
          start_date,
          end_date,
          tuition_fee,
          status,
          is_test,
          created_at
        `)

        .eq(
          "student_id",
          Number(studentId)
        )

        .eq(
          "is_test",
          false
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      throw new Error(
        "Không tải được gói học: "
        +
        error.message
      );

    }


    return (
      data || []
    );

  }


  /* =====================================================
     LOAD SESSIONS
  ====================================================== */


  async function getSessions(
    registrationIds
  ) {

    if (
      registrationIds.length === 0
    ) {

      return [];

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "class_sessions"
        )
        .select(`
          id,
          registration_id,
          status
        `)

        .in(
          "registration_id",
          registrationIds
        );


    if (error) {

      throw new Error(
        "Không tải được số buổi đã học: "
        +
        error.message
      );

    }


    return (
      data || []
    );

  }


  /* =====================================================
     LOAD OFFICIAL TUITION PAYMENTS

     Chỉ "Đã thu" mới được tính.
  ====================================================== */


  async function getPayments(
    registrationIds
  ) {

    if (
      registrationIds.length === 0
    ) {

      return [];

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "tuition_payments"
        )
        .select(`
          registration_id,
          amount,
          status
        `)

        .in(
          "registration_id",
          registrationIds
        )

        .eq(
          "status",
          "Đã thu"
        );


    if (error) {

      throw new Error(
        "Không tải được học phí đã thanh toán: "
        +
        error.message
      );

    }


    return (
      data || []
    );

  }


  /* =====================================================
     LOAD COACHES
  ====================================================== */


  async function getCoaches(
    coachIds
  ) {

    if (
      coachIds.length === 0
    ) {

      return [];

    }


    const {
      data,
      error
    } =
      await sb
        .from(
          "coaches"
        )
        .select(`
          id,
          coach_code,
          full_name,
          status
        `)

        .in(
          "id",
          coachIds
        );


    if (error) {

      throw new Error(
        "Không tải được Coach: "
        +
        error.message
      );

    }


    return (
      data || []
    );

  }


  /* =====================================================
     RENDER
  ====================================================== */


  function renderRegistrations(
    registrations,
    sessions,
    payments,
    coaches
  ) {

    if (
      registrations.length ===
      0
    ) {

      registrationList.innerHTML =
        "";


      emptyEl.style.display =
        "block";


      messageEl.style.color =
        "rgba(255,255,255,.6)";


      messageEl.textContent =
        "Bạn chưa có đăng ký học REAL nào.";


      return;

    }


    emptyEl.style.display =
      "none";


    const coachMap =
      new Map();


    coaches.forEach(
      coach => {

        coachMap.set(
          Number(coach.id),
          coach
        );

      }
    );


    registrationList.innerHTML =
      registrations

        .map(
          registration => {


            /* =========================
               COACH
            ========================== */


            const coach =
              registration.coach_id

                ? coachMap.get(
                    Number(
                      registration.coach_id
                    )
                  )

                : null;


            const coachName =
              coach?.full_name
              ||
              coach?.coach_code
              ||
              "Chưa phân Coach";


            /* =========================
               SESSION COUNTS
            ========================== */


            const ownSessions =
              sessions.filter(
                item =>
                  Number(
                    item.registration_id
                  )
                  ===
                  Number(
                    registration.id
                  )
              );


            const used =
              ownSessions.filter(
                item => {

                  const status =
                    String(
                      item.status || ""
                    ).trim();


                  return (
                    status ===
                      "Đã hoàn thành"
                    ||
                    status ===
                      "Vắng"
                  );

                }
              ).length;


            const hasTotal =
              registration
                .purchased_sessions
              !== null
              &&
              registration
                .purchased_sessions
              !== undefined;


            const total =
              hasTotal

                ? Number(
                    registration
                      .purchased_sessions
                    ||
                    0
                  )

                : null;


            const remaining =
              total === null

                ? null

                : Math.max(
                    total - used,
                    0
                  );


            /* =========================
               PAYMENT
            ========================== */


            const paid =
              payments

                .filter(
                  item =>
                    Number(
                      item.registration_id
                    )
                    ===
                    Number(
                      registration.id
                    )
                )

                .reduce(
                  (
                    sum,
                    item
                  ) =>
                    sum
                    +
                    Number(
                      item.amount
                      ||
                      0
                    ),
                  0
                );


            const tuition =
              Number(
                registration
                  .tuition_fee
                ||
                0
              );


            const debt =
              Math.max(
                tuition - paid,
                0
              );


            let paymentText =
              "Chưa thanh toán";


            let paymentClass =
              "payment-wait";


            if (
              tuition <= 0
            ) {

              paymentText =
                "Chưa có học phí";

            }
            else if (
              debt <= 0
              &&
              paid >= tuition
            ) {

              paymentText =
                "✓ Đã thanh toán đủ";

              paymentClass =
                "payment-ok";

            }
            else if (
              paid > 0
            ) {

              paymentText =
                "Đã thanh toán một phần";

            }


            return `

              <section
                class="registration"
              >


                <div
                  class="registration-top"
                >


                  <div>

                    <div
                      class="registration-code"
                    >
                      ${escapeHtml(
                        registration
                          .registration_code
                        ||
                        `DK${registration.id}`
                      )}
                    </div>


                    <div
                      class="package-name"
                    >
                      ${escapeHtml(
                        registration
                          .package_name
                        ||
                        "Gói học PickDee"
                      )}
                    </div>

                  </div>


                  <span
                    class="badge ${
                      statusClass(
                        registration.status
                      )
                    }"
                  >
                    ${escapeHtml(
                      registration.status
                      ||
                      "—"
                    )}
                  </span>


                </div>


                <div class="grid">


                  <div>

                    <div class="label">
                      Coach phụ trách
                    </div>

                    <div class="value">
                      ${escapeHtml(
                        coachName
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Tổng số buổi
                    </div>

                    <div class="value">
                      ${
                        total === null
                          ? "—"
                          : escapeHtml(total)
                      }
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Đã sử dụng
                    </div>

                    <div class="value">
                      ${escapeHtml(
                        used
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Còn lại
                    </div>

                    <div class="value">
                      ${
                        remaining === null
                          ? "—"
                          : escapeHtml(
                              remaining
                            )
                      }
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Ngày bắt đầu
                    </div>

                    <div class="value">
                      ${escapeHtml(
                        formatDate(
                          registration
                            .start_date
                        )
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Ngày hết hạn
                    </div>

                    <div class="value">
                      ${escapeHtml(
                        formatDate(
                          registration
                            .end_date
                        )
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Học phí
                    </div>

                    <div class="value">
                      ${
                        tuition > 0
                          ? escapeHtml(
                              formatMoney(
                                tuition
                              )
                            )
                          : "—"
                      }
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Đã thanh toán
                    </div>

                    <div class="value">
                      ${escapeHtml(
                        formatMoney(
                          paid
                        )
                      )}
                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Trạng thái học phí
                    </div>

                    <div
                      class="value ${paymentClass}"
                    >
                      ${escapeHtml(
                        paymentText
                      )}

                      ${
                        debt > 0
                        &&
                        tuition > 0

                          ? `<div
                               style="
                                 margin-top:4px;
                                 color:rgba(255,255,255,.62);
                                 font-size:12px;
                               "
                             >
                               Còn phải thu:
                               ${escapeHtml(
                                 formatMoney(
                                   debt
                                 )
                               )}
                             </div>`

                          : ""
                      }

                    </div>

                  </div>


                </div>


              </section>

            `;

          }
        )

        .join("");


    messageEl.style.color =
      "rgba(255,255,255,.6)";


    messageEl.textContent =
      `✓ Đã tải ${registrations.length} gói học REAL.`;

  }


  /* =====================================================
     LOAD PAGE
  ====================================================== */


  async function loadPage() {

    messageEl.style.color =
      "#ffb0b0";


    messageEl.textContent =
      "Đang tải gói học...";


    try {


      initSupabase();


      const session =
        await getSession();


      if (!session) {

        return;

      }


      const student =
        await getCurrentStudent();


      studentNameEl.textContent =
        student.full_name
        ||
        "Học viên PickDee";


      studentCodeEl.textContent =
        student.student_code
        ||
        "";


      const registrations =
        await getRegistrations(
          student.id
        );


      /*
        RegistrationIds ở đây chỉ đến từ
        registrations có is_test = false.

        Vì vậy Session/Payment phía dưới
        cũng chỉ thuộc REAL.
      */


      const registrationIds =
        registrations

          .map(
            item =>
              Number(item.id)
          )

          .filter(
            id =>
              Number.isFinite(id)
          );


      const coachIds =
        [

          ...new Set(

            registrations

              .map(
                item =>
                  Number(
                    item.coach_id
                  )
              )

              .filter(
                id =>
                  Number.isFinite(id)
                  &&
                  id > 0
              )

          )

        ];


      const [
        sessions,
        payments,
        coaches
      ] =
        await Promise.all([

          getSessions(
            registrationIds
          ),

          getPayments(
            registrationIds
          ),

          getCoaches(
            coachIds
          )

        ]);


      renderRegistrations(
        registrations,
        sessions,
        payments,
        coaches
      );


    }
    catch (error) {


      console.error(
        "STUDENT REGISTRATIONS:",
        error
      );


      studentNameEl.textContent =
        "Không tải được dữ liệu";


      studentCodeEl.textContent =
        "";


      registrationList.innerHTML =
        "";


      emptyEl.style.display =
        "none";


      messageEl.style.color =
        "#ffb0b0";


      messageEl.textContent =
        "Lỗi tải Gói học của tôi: "
        +
        (
          error?.message
          ||
          error
          ||
          "Không xác định"
        );

    }

  }


  /* =====================================================
     LOGOUT
  ====================================================== */


  logoutBtn.addEventListener(
    "click",
    async function () {


      if (sb) {

        await sb.auth
          .signOut();

      }


      location.replace(
        "./login.html"
      );

    }
  );


  /* =====================================================
     START
  ====================================================== */


  await loadPage();


})();

</script>
