<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <meta
    name="theme-color"
    content="#041733"
  >

  <title>
    Yêu cầu lịch học | PickDee Academy
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261017-logout1"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );

    }


    .topbar {

      padding: 18px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      border-bottom:
        1px solid rgba(255,255,255,.12);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color: #d8ff45;

    }


    .back {

      color: #d8ff45;

      text-decoration: none;

      font-weight: 900;

    }


    .container {

      width:
        min(
          950px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        38px 0 70px;

    }


    .eyebrow {

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    h1 {

      margin:
        8px 0 8px;

      font-size:
        clamp(
          36px,
          7vw,
          54px
        );

    }


    .intro {

      margin-bottom: 22px;

      color:
        rgba(255,255,255,.62);

      line-height: 1.55;

    }


    .top-actions {

      display: grid;

      grid-template-columns:
        1fr auto;

      gap: 12px;

      margin-bottom: 22px;

    }


    .new-request {

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 52px;

      padding:
        0 18px;

      border-radius: 11px;

      background: #d8ff45;

      color: #172600;

      text-decoration: none;

      font-weight: 900;

    }


    .refresh {

      min-height: 52px;

      padding:
        0 18px;

      border-radius: 11px;

      border:
        1px solid rgba(255,255,255,.15);

      background:
        rgba(255,255,255,.07);

      color: white;

      cursor: pointer;

      font-weight: 900;

    }


    .summary {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 12px;

      margin-bottom: 22px;

    }


    .summary-card {

      padding: 16px;

      border-radius: 14px;

      background:
        rgba(6,39,88,.75);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .summary-label {

      color:
        rgba(255,255,255,.52);

      font-size: 12px;

      margin-bottom: 5px;

    }


    .summary-value {

      color: #d8ff45;

      font-size: 24px;

      font-weight: 900;

    }


    #message {

      min-height: 20px;

      margin-bottom: 15px;

      font-weight: 800;

      line-height: 1.5;

    }


    .success {
      color: #d8ff45;
    }


    .error {
      color: #ffaaaa;
    }


    #list {

      display: grid;

      gap: 15px;

    }


    .request-card {

      padding: 20px;

      border-radius: 17px;

      background:
        rgba(6,39,88,.78);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .request-head {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 12px;

      margin-bottom: 16px;

    }


    .request-code {

      color: #d8ff45;

      font-size: 20px;

      font-weight: 900;

    }


    .request-sub {

      margin-top: 5px;

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

    }


    .badge {

      padding:
        7px 10px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 900;

      white-space: nowrap;

    }


    .badge.pending {

      color: #ffc46b;

      background:
        rgba(255,196,107,.12);

    }


    .badge.approved {

      color: #d8ff45;

      background:
        rgba(216,255,69,.12);

    }


    .badge.rejected {

      color: #ffaaaa;

      background:
        rgba(255,100,100,.12);

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 10px;

    }


    .info-box {

      padding: 12px;

      border-radius: 11px;

      background:
        rgba(0,0,0,.13);

      border:
        1px solid rgba(255,255,255,.07);

    }


    .info-label {

      margin-bottom: 4px;

      color:
        rgba(255,255,255,.45);

      font-size: 11px;

    }


    .info-value {

      font-weight: 800;

      line-height: 1.45;

    }


    .note-box {

      margin-top: 14px;

      padding: 13px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.72);

      line-height: 1.55;

      font-size: 13px;

    }


    .result-box {

      margin-top: 14px;

      padding: 15px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.08);

      line-height: 1.55;

    }


    .result-approved {

      border-color:
        rgba(216,255,69,.28);

      background:
        rgba(216,255,69,.05);

    }


    .result-rejected {

      border-color:
        rgba(255,110,110,.32);

      background:
        rgba(255,80,80,.05);

    }


    .result-pending {

      border-color:
        rgba(255,196,107,.26);

      background:
        rgba(255,196,107,.04);

    }


    .result-title {

      margin-bottom: 8px;

      font-size: 15px;

      font-weight: 900;

    }


    .result-approved .result-title {

      color: #d8ff45;

    }


    .result-rejected .result-title {

      color: #ffaaaa;

    }


    .result-pending .result-title {

      color: #ffc46b;

    }


    .reason {

      margin-top: 8px;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,80,80,.09);

      color: #ffd0d0;

      font-weight: 800;

      line-height: 1.5;

    }


    .session-link {

      display: inline-block;

      margin-top: 10px;

      color: #d8ff45;

      text-decoration: none;

      font-size: 13px;

      font-weight: 900;

    }


    .empty {

      padding: 38px 20px;

      border-radius: 17px;

      background:
        rgba(6,39,88,.72);

      border:
        1px solid rgba(255,255,255,.12);

      text-align: center;

      color:
        rgba(255,255,255,.62);

      line-height: 1.6;

    }


    @media(max-width:650px) {

      .summary,
      .info-grid {

        grid-template-columns: 1fr;

      }


      .top-actions {

        grid-template-columns: 1fr;

      }


      .request-head {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<header class="topbar">


  <div class="brand">

    PickDee
    <span>Academy</span>

  </div>


  <a
    class="back"
    href="./student"
  >
    ← Khu vực học viên
  </a>


</header>


<main class="container">


  <div class="eyebrow">

    HỌC VIÊN · ĐẶT LỊCH

  </div>


  <h1>

    Yêu cầu lịch học

  </h1>


  <div class="intro">

    Theo dõi các yêu cầu bạn đã gửi cho Coach:
    đang chờ, đã duyệt hoặc bị từ chối.

  </div>


  <div class="top-actions">


    <a
      class="new-request"
      href="./student-book-session"
    >
      + TẠO YÊU CẦU MỚI
    </a>


    <button
      id="refreshBtn"
      class="refresh"
      type="button"
    >
      ↻ CẬP NHẬT
    </button>


  </div>


  <section class="summary">


    <div class="summary-card">

      <div class="summary-label">
        Chờ Coach
      </div>

      <div
        id="pendingCount"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Đã duyệt
      </div>

      <div
        id="approvedCount"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Từ chối
      </div>

      <div
        id="rejectedCount"
        class="summary-value"
      >
        0
      </div>

    </div>


  </section>


  <div id="message"></div>


  <section id="list">

    <div class="empty">

      Đang tải lịch sử yêu cầu...

    </div>

  </section>


</main>


<script>

(async function () {


  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const listEl =
    document.getElementById(
      "list"
    );


  const messageEl =
    document.getElementById(
      "message"
    );


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  const pendingCount =
    document.getElementById(
      "pendingCount"
    );


  const approvedCount =
    document.getElementById(
      "approvedCount"
    );


  const rejectedCount =
    document.getElementById(
      "rejectedCount"
    );


  let currentStudentId =
    null;


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function formatDate(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    const match =
      raw.match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );


    if (match) {

      return (
        match[3]
        +
        "/"
        +
        match[2]
        +
        "/"
        +
        match[1]
      );

    }


    return raw;

  }


  function formatTime(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    const match =
      raw.match(
        /^(\d{1,2}):(\d{2})/
      );


    if (match) {

      return (
        String(
          Number(match[1])
        ).padStart(
          2,
          "0"
        )
        +
        ":"
        +
        match[2]
      );

    }


    return raw;

  }


  function formatDateTime(value) {

  if (!value) {
    return "—";
  }

  const raw =
    String(value).trim();

  const date =
    new Date(raw);

  if (
    !Number.isNaN(
      date.getTime()
    )
  ) {

    const parts =
      new Intl.DateTimeFormat(
        "vi-VN",
        {
          timeZone:
            "Asia/Ho_Chi_Minh",

          day:
            "2-digit",

          month:
            "2-digit",

          year:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false,

          hourCycle:
            "h23"
        }
      )
        .formatToParts(
          date
        );

    const map =
      Object.fromEntries(
        parts.map(
          part => [
            part.type,
            part.value
          ]
        )
      );

    return (
      `${map.day}/${map.month}/${map.year}`
      +
      " · "
      +
      `${map.hour}:${map.minute}`
    );
  }

  return raw;
}

  function statusClass(status) {


    if (
      status === "Đã duyệt"
    ) {

      return "approved";

    }


    if (
      status === "Từ chối"
    ) {

      return "rejected";

    }


    return "pending";

  }


  function showMessage(
    text,
    isError = false
  ) {


    messageEl.textContent =
      text || "";


    messageEl.className =
      isError
        ?
        "error"
        :
        "success";

  }


  /* =====================================================
     CHECK STUDENT
  ====================================================== */

  async function checkStudent() {


    const {
      data: sessionData,
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (
      sessionError
      ||
      !sessionData?.session
    ) {


      location.replace(
        "./login.html"
      );


      return false;

    }


    const {
      data: studentId,
      error: studentError
    } =
      await sb.rpc(
        "current_student_id"
      );


    if (
      studentError
      ||
      !studentId
    ) {


      showMessage(
        "Không xác định được hồ sơ Học viên.",
        true
      );


      return false;

    }


    currentStudentId =
      Number(studentId);


    return true;

  }


  /* =====================================================
     LOAD REQUESTS
  ====================================================== */

  async function loadRequests() {


    refreshBtn.disabled =
      true;


    refreshBtn.textContent =
      "ĐANG TẢI...";


    showMessage(
      "Đang tải lịch sử yêu cầu..."
    );


    /*
      QUAN TRỌNG:
      Chỉ lấy trực tiếp session_requests trước.
      Không JOIN để tránh 1 bảng phụ lỗi
      làm biến mất toàn bộ card.
    */


    const {
      data: rows,
      error
    } =
      await sb
        .from("session_requests")
        .select(`
          id,
          request_code,
          registration_id,
          student_id,
          coach_id,
          session_no,
          requested_date,
          requested_time,
          duration_minutes,
          requested_area,
          requested_ward,
          note,
          status,
          coach_note,
          court_id,
          session_id,
          created_at,
          approved_at,
          rejected_at
        `)
        .eq(
          "student_id",
          currentStudentId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if (error) {


      console.error(
        "REQUEST ERROR:",
        error
      );


      refreshBtn.disabled =
        false;


      refreshBtn.textContent =
        "↻ CẬP NHẬT";


      showMessage(
        error.message
        ||
        "Không tải được yêu cầu.",
        true
      );


      return;

    }


    const requests =
      rows || [];


    /* =================================================
       COUNTERS
    ================================================== */


    pendingCount.textContent =
      requests.filter(
        item =>
          item.status === "Chờ Coach"
      ).length;


    approvedCount.textContent =
      requests.filter(
        item =>
          item.status === "Đã duyệt"
      ).length;


    rejectedCount.textContent =
      requests.filter(
        item =>
          item.status === "Từ chối"
      ).length;


    if (
      requests.length === 0
    ) {


      listEl.innerHTML =
        `
          <div class="empty">

            Bạn chưa có yêu cầu lịch học nào.

          </div>
        `;


      refreshBtn.disabled =
        false;


      refreshBtn.textContent =
        "↻ CẬP NHẬT";


      showMessage("");


      return;

    }


    /* =================================================
       LOAD DỮ LIỆU PHỤ
    ================================================== */


    const registrationIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.registration_id
                )
            )
            .filter(Boolean)
        )
      ];


    const coachIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.coach_id
                )
            )
            .filter(Boolean)
        )
      ];


    const courtIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.court_id
                )
            )
            .filter(Boolean)
        )
      ];


    const sessionIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.session_id
                )
            )
            .filter(Boolean)
        )
      ];


    let registrations =
      [];


    let coaches =
      [];


    let courts =
      [];


    let sessions =
      [];


    /* =================================================
       REGISTRATION
    ================================================== */


    if (
      registrationIds.length > 0
    ) {


      const result =
        await sb
          .from("registrations")
          .select(`
            id,
            registration_code,
            package_name
          `)
          .in(
            "id",
            registrationIds
          );


      if (!result.error) {

        registrations =
          result.data || [];

      }
      else {

        console.warn(
          "REGISTRATION:",
          result.error
        );

      }

    }


    /* =================================================
       COACH
    ================================================== */


    if (
      coachIds.length > 0
    ) {


      const result =
        await sb
          .from("coaches")
          .select(`
            id,
            coach_code,
            full_name
          `)
          .in(
            "id",
            coachIds
          );


      if (!result.error) {

        coaches =
          result.data || [];

      }
      else {

        console.warn(
          "COACH:",
          result.error
        );

      }

    }


    /* =================================================
       COURT
    ================================================== */


    if (
      courtIds.length > 0
    ) {


      const result =
        await sb
          .from("courts")
          .select(`
            id,
            name
          `)
          .in(
            "id",
            courtIds
          );


      if (!result.error) {

        courts =
          result.data || [];

      }
      else {

        console.warn(
          "COURT:",
          result.error
        );

      }

    }


    /* =================================================
       SESSION
    ================================================== */


    if (
      sessionIds.length > 0
    ) {


      const result =
        await sb
          .from("class_sessions")
          .select(`
            id,
            session_code,
            session_no,
            session_date,
            start_time,
            court_name,
            status
          `)
          .in(
            "id",
            sessionIds
          );


      if (!result.error) {

        sessions =
          result.data || [];

      }
      else {

        console.warn(
          "SESSION:",
          result.error
        );

      }

    }


    /* =================================================
       MAP
    ================================================== */


    const registrationMap =
      new Map(
        registrations.map(
          item => [
            Number(item.id),
            item
          ]
        )
      );


    const coachMap =
      new Map(
        coaches.map(
          item => [
            Number(item.id),
            item
          ]
        )
      );


    const courtMap =
      new Map(
        courts.map(
          item => [
            Number(item.id),
            item
          ]
        )
      );


    const sessionMap =
      new Map(
        sessions.map(
          item => [
            Number(item.id),
            item
          ]
        )
      );


    /* =================================================
       RENDER
    ================================================== */


    listEl.innerHTML =
      "";


    requests.forEach(
      request => {


        try {


          const registration =
            registrationMap.get(
              Number(
                request.registration_id
              )
            )
            ||
            {};


          const coach =
            coachMap.get(
              Number(
                request.coach_id
              )
            )
            ||
            {};


          const court =
            courtMap.get(
              Number(
                request.court_id
              )
            )
            ||
            {};


          const session =
            sessionMap.get(
              Number(
                request.session_id
              )
            )
            ||
            {};


          let resultHtml =
            "";


          /* =============================================
             CHỜ COACH
          ============================================== */


          if (
            request.status === "Chờ Coach"
          ) {


            resultHtml =
              `

                <div class="result-box result-pending">

                  <div class="result-title">

                    ⏳ Đang chờ Coach xử lý

                  </div>

                  <div>

                    Coach sẽ xác nhận lịch và chọn sân phù hợp.

                  </div>

                </div>

              `;

          }


          /* =============================================
             ĐÃ DUYỆT
          ============================================== */


          if (
            request.status === "Đã duyệt"
          ) {


            resultHtml =
              `

                <div class="result-box result-approved">

                  <div class="result-title">

                    ✅ Coach đã duyệt lịch

                  </div>


                  <div>

                    ${
                      session.session_code
                        ?
                        `
                          Buổi học:
                          <strong>
                            ${escapeHtml(
                              session.session_code
                            )}
                          </strong>
                          <br>
                        `
                        :
                        ""
                    }


                    Sân:

                    <strong>

                      ${escapeHtml(
                        court.name
                        ||
                        session.court_name
                        ||
                        "Đã xác nhận"
                      )}

                    </strong>


                    ${
                      request.approved_at
                        ?
                        `
                          <br>
                          Duyệt lúc:
                          ${escapeHtml(
                            formatDateTime(
                              request.approved_at
                            )
                          )}
                        `
                        :
                        ""
                    }


                    ${
                      request.coach_note
                        ?
                        `
                          <br><br>

                          <strong>
                            Ghi chú Coach:
                          </strong>

                          ${escapeHtml(
                            request.coach_note
                          )}
                        `
                        :
                        ""
                    }

                  </div>


                  <a
                    href="./student-sessions"
                    class="session-link"
                  >

                    XEM LỊCH HỌC →

                  </a>

                </div>

              `;

          }


          /* =============================================
             TỪ CHỐI
          ============================================== */


          if (
            request.status === "Từ chối"
          ) {


            resultHtml =
              `

                <div class="result-box result-rejected">


                  <div class="result-title">

                    ✕ Coach đã từ chối yêu cầu

                  </div>


                  <div>

                    Yêu cầu Buổi ${escapeHtml(
                      request.session_no
                      ||
                      "—"
                    )} chưa được tạo thành lịch học.

                  </div>


                  <div class="reason">

                    <strong>
                      Lý do:
                    </strong>

                    <br>

                    ${escapeHtml(
                      request.coach_note
                      ||
                      "Coach chưa nhập lý do."
                    )}

                  </div>


                  ${
                    request.rejected_at
                      ?
                      `
                        <div
                          style="
                            margin-top:10px;
                            color:rgba(255,255,255,.55);
                            font-size:12px;
                          "
                        >

                          Từ chối lúc:

                          ${escapeHtml(
                            formatDateTime(
                              request.rejected_at
                            )
                          )}

                        </div>
                      `
                      :
                      ""
                  }


                  <a
                    href="./student-book-session"
                    class="session-link"
                  >

                    ĐẶT LẠI BUỔI HỌC →

                  </a>


                </div>

              `;

          }


          /* =============================================
             CARD
          ============================================== */


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "request-card";


          card.innerHTML =
            `

              <div class="request-head">


                <div>


                  <div class="request-code">

                    ${escapeHtml(
                      request.request_code
                      ||
                      `YC${request.id}`
                    )}

                  </div>


                  <div class="request-sub">

                    ${escapeHtml(
                      registration.registration_code
                      ||
                      `Đăng ký #${request.registration_id}`
                    )}

                    ${

                      registration.package_name

                        ?

                        ` · ${escapeHtml(
                          registration.package_name
                        )}`

                        :

                        ""

                    }

                  </div>


                </div>


                <div
                  class="badge ${statusClass(
                    request.status
                  )}"
                >

                  ${escapeHtml(
                    request.status
                    ||
                    "—"
                  )}

                </div>


              </div>


              <div class="info-grid">


                <div class="info-box">

                  <div class="info-label">
                    Buổi
                  </div>

                  <div class="info-value">

                    Buổi ${escapeHtml(
                      request.session_no
                      ||
                      "—"
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Ngày / giờ yêu cầu
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      formatDate(
                        request.requested_date
                      )
                    )}

                    ·

                    ${escapeHtml(
                      formatTime(
                        request.requested_time
                      )
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Coach phụ trách
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      coach.full_name
                      ||
                      coach.coach_code
                      ||
                      "Coach phụ trách"
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Khu vực
                  </div>

                  <div class="info-value">

                    ${escapeHtml(

                      [
                        request.requested_ward,
                        request.requested_area
                      ]
                      .filter(Boolean)
                      .join(" · ")

                      ||

                      "—"

                    )}

                  </div>

                </div>


              </div>


              ${
                request.note
                  ?
                  `
                    <div class="note-box">

                      <strong>
                        Ghi chú của bạn:
                      </strong>

                      <br>

                      ${escapeHtml(
                        request.note
                      )}

                    </div>
                  `
                  :
                  ""
              }


              ${resultHtml}

            `;


          listEl.appendChild(
            card
          );


        }
        catch (renderError) {


          console.error(
            "CARD ERROR:",
            renderError,
            request
          );


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "request-card";


          card.innerHTML =
            `

              <div class="request-code">

                ${escapeHtml(
                  request.request_code
                  ||
                  `YC${request.id}`
                )}

              </div>


              <div class="note-box">

                Trạng thái:

                <strong>

                  ${escapeHtml(
                    request.status
                    ||
                    "—"
                  )}

                </strong>

                <br><br>

                ${
                  request.coach_note
                    ?
                    `
                      Lý do / ghi chú Coach:
                      <br>
                      <strong>
                        ${escapeHtml(
                          request.coach_note
                        )}
                      </strong>
                    `
                    :
                    ""
                }

              </div>

            `;


          listEl.appendChild(
            card
          );


        }

      }
    );


    refreshBtn.disabled =
      false;


    refreshBtn.textContent =
      "↻ CẬP NHẬT";


    showMessage(
      `✓ Đã tải ${requests.length} yêu cầu.`
    );

  }


  /* =====================================================
     REFRESH
  ====================================================== */


  refreshBtn.addEventListener(
    "click",
    loadRequests
  );


  /* =====================================================
     START
  ====================================================== */


  try {


    const ok =
      await checkStudent();


    if (!ok) {

      return;

    }


    await loadRequests();


    setInterval(
      loadRequests,
      60000
    );


  }
  catch (error) {


    console.error(
      "PAGE ERROR:",
      error
    );


    showMessage(
      "Lỗi trang: "
      +
      (
        error?.message
        ||
        error
        ||
        "Không xác định"
      ),
      true
    );


  }


})();

</script>

<script src="./notifications.js?v=20261017-sales1"></script>
<script src="/pd-portal-appnav.js?v=20261016-1"></script>
</body>
