<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#041733"
  >

  <title>
    Yêu cầu lịch học | PickDee Academy
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );

    }


    header {

      padding: 18px 22px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      border-bottom:
        1px solid rgba(255,255,255,.12);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color: #d8ff45;

    }


    a {

      color: #d8ff45;

      text-decoration: none;

      font-weight: 900;

    }


    main {

      width:
        min(
          950px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        38px 0 70px;

    }


    .eyebrow {

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    h1 {

      margin:
        8px 0 8px;

      font-size:
        clamp(
          36px,
          7vw,
          54px
        );

    }


    .intro {

      color:
        rgba(255,255,255,.62);

      line-height: 1.55;

      margin-bottom: 24px;

    }


    .count-box {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 20px;

      padding:
        9px 13px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.11);

      border:
        1px solid rgba(216,255,69,.25);

      color: #d8ff45;

      font-weight: 900;

    }


    #message {

      min-height: 24px;

      margin-bottom: 16px;

      font-weight: 800;

      line-height: 1.5;

    }


    .success {

      color: #d8ff45;

    }


    .error {

      color: #ffaaaa;

    }


    #list {

      display: grid;

      gap: 16px;

    }


    .request-card {

      padding: 22px;

      border-radius: 18px;

      background:
        rgba(6,39,88,.8);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .request-head {

      display: flex;

      justify-content: space-between;

      gap: 16px;

      align-items: flex-start;

      margin-bottom: 17px;

    }


    .request-code {

      color: #d8ff45;

      font-size: 20px;

      font-weight: 900;

    }


    .student-name {

      margin-top: 5px;

      font-size: 17px;

      font-weight: 900;

    }


    .student-code {

      margin-top: 4px;

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

    }


    .status {

      padding:
        6px 10px;

      border-radius: 999px;

      background:
        rgba(255,196,107,.12);

      color: #ffc46b;

      font-size: 12px;

      font-weight: 900;

      white-space: nowrap;

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 10px;

      margin-bottom: 16px;

    }


    .info-box {

      padding: 12px;

      border-radius: 11px;

      background:
        rgba(0,0,0,.13);

      border:
        1px solid rgba(255,255,255,.07);

    }


    .info-label {

      margin-bottom: 4px;

      color:
        rgba(255,255,255,.45);

      font-size: 11px;

    }


    .info-value {

      font-weight: 800;

      line-height: 1.4;

    }


    .note-box {

      margin-bottom: 16px;

      padding: 13px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.04);

      color:
        rgba(255,255,255,.7);

      font-size: 13px;

      line-height: 1.5;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 900;

    }


    select,
    textarea {

      width: 100%;

      min-height: 48px;

      padding:
        11px 12px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 10px;

      background: #07172d;

      color: white;

      font-size: 15px;

      outline: none;

    }


    textarea {

      min-height: 80px;

      resize: vertical;

      margin-top: 10px;

    }


    select:focus,
    textarea:focus {

      border-color:
        rgba(216,255,69,.65);

    }


    select:disabled {

      opacity: .6;

    }


    .court-note {

      margin-top: 6px;

      color:
        rgba(255,255,255,.45);

      font-size: 12px;

      line-height: 1.4;

    }


    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 16px;

    }


    button {

      min-height: 50px;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

    }


    .approve {

      border: 0;

      background: #d8ff45;

      color: #162400;

    }


    .reject {

      border:
        1px solid rgba(255,110,110,.3);

      background:
        rgba(255,90,90,.12);

      color: #ffaaaa;

    }


    button:disabled {

      opacity: .5;

      cursor: wait;

    }


    .empty {

      padding: 35px 20px;

      border-radius: 18px;

      text-align: center;

      background:
        rgba(6,39,88,.7);

      border:
        1px solid rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.62);

      line-height: 1.6;

    }


    @media(max-width:650px) {

      .info-grid,
      .actions {

        grid-template-columns: 1fr;

      }


      .request-head {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="brand">

    PickDee
    <span>Academy</span>

  </div>


  <a href="./coach">

    ← Khu vực Coach

  </a>

</header>


<main>


  <div class="eyebrow">

    COACH · XỬ LÝ LỊCH

  </div>


  <h1>

    Yêu cầu lịch học

  </h1>


  <div class="intro">

    Xem lịch Học viên mong muốn, chọn sân phù hợp và duyệt.
    Sau khi duyệt, hệ thống tự tạo buổi học chính thức.

  </div>


  <div class="count-box">

    ⏳ Chờ xử lý:
    <span id="requestCount">0</span>

  </div>


  <div id="message"></div>


  <section id="list">

    <div class="empty">

      Đang tải yêu cầu...

    </div>

  </section>


</main>


<script>

(async function () {


  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const listEl =
    document.getElementById(
      "list"
    );


  const countEl =
    document.getElementById(
      "requestCount"
    );


  const messageEl =
    document.getElementById(
      "message"
    );


  let currentCoachId =
    null;


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function money(value) {

    return (
      Number(value || 0)
        .toLocaleString(
          "vi-VN"
        )
      +
      "đ"
    );

  }


  /* =====================================================
     SAFE DATE
     Không để ngày lỗi làm chết cả trang
  ====================================================== */

  function parseSafeDate(value) {


    if (!value) {

      return null;

    }


    if (
      value instanceof Date
    ) {

      return Number.isNaN(
        value.getTime()
      )
        ?
        null
        :
        value;

    }


    const raw =
      String(value).trim();


    /*
      YYYY-MM-DD
    */

    let match =
      raw.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


    if (match) {


      const year =
        Number(match[1]);


      const month =
        Number(match[2]);


      const day =
        Number(match[3]);


      const date =
        new Date(
          year,
          month - 1,
          day
        );


      if (
        date.getFullYear() === year
        &&
        date.getMonth() === month - 1
        &&
        date.getDate() === day
      ) {

        return date;

      }

    }


    /*
      DD/MM/YYYY
    */

    match =
      raw.match(
        /^(\d{2})\/(\d{2})\/(\d{4})$/
      );


    if (match) {


      const day =
        Number(match[1]);


      const month =
        Number(match[2]);


      const year =
        Number(match[3]);


      const date =
        new Date(
          year,
          month - 1,
          day
        );


      if (
        date.getFullYear() === year
        &&
        date.getMonth() === month - 1
        &&
        date.getDate() === day
      ) {

        return date;

      }

    }


    /*
      TIMESTAMP fallback
    */

    const fallback =
      new Date(raw);


    if (
      !Number.isNaN(
        fallback.getTime()
      )
    ) {

      return fallback;

    }


    return null;

  }


  function formatDate(value) {


    const date =
      parseSafeDate(value);


    if (!date) {

      return value
        ?
        String(value)
        :
        "—";

    }


    try {


      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      ).format(date);


    }
    catch (error) {


      console.warn(
        "DATE FORMAT ERROR:",
        value,
        error
      );


      return String(value);

    }

  }


  function formatTime(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    /*
      09:00
      hoặc
      09:00:00
    */

    const match =
      raw.match(
        /^(\d{1,2}):(\d{2})/
      );


    if (match) {


      const hour =
        String(
          Number(match[1])
        ).padStart(
          2,
          "0"
        );


      const minute =
        match[2];


      return `${hour}:${minute}`;

    }


    /*
      Nếu format lạ:
      hiện dữ liệu gốc thay vì crash
    */

    return raw;

  }


  function showMessage(
    text,
    isError = false
  ) {

    messageEl.textContent =
      text || "";


    messageEl.className =
      isError
        ?
        "error"
        :
        "success";

  }


  /* =====================================================
     CHECK COACH
  ====================================================== */

  async function checkCoach() {


    const {
      data: { session },
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (
      sessionError
      ||
      !session
    ) {

      location.replace(
        "./login.html"
      );

      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await sb
        .from("profiles")
        .select("role")
        .eq(
          "id",
          session.user.id
        )
        .maybeSingle();


    if (
      profileError
      ||
      !profile
      ||
      profile.role !== "coach"
    ) {

      location.replace(
        "./login.html"
      );

      return false;

    }


    const {
      data: coachId,
      error: coachError
    } =
      await sb.rpc(
        "current_coach_id"
      );


    if (
      coachError
      ||
      !coachId
    ) {

      showMessage(
        "Không xác định được hồ sơ Coach.",
        true
      );

      return false;

    }


    currentCoachId =
      Number(coachId);


    return true;

  }


  /* =====================================================
     LOAD REQUESTS
  ====================================================== */

  async function loadRequests() {


    showMessage(
      "Đang tải yêu cầu..."
    );


    listEl.innerHTML =
      `
        <div class="empty">
          Đang tải yêu cầu...
        </div>
      `;


    /* =================================================
       REQUEST
    ================================================== */

    const {
      data: requestRows,
      error: requestError
    } =
      await sb
        .from("session_requests")
        .select(`
          id,
          request_code,
          registration_id,
          student_id,
          coach_id,
          session_no,
          requested_date,
          requested_time,
          duration_minutes,
          requested_area,
          requested_ward,
          note,
          status,
          created_at
        `)
        .eq(
          "coach_id",
          currentCoachId
        )
        .eq(
          "status",
          "Chờ Coach"
        )
        .order(
          "requested_date",
          {
            ascending:true
          }
        )
        .order(
          "requested_time",
          {
            ascending:true
          }
        );


    if (requestError) {


      console.error(
        "REQUEST ERROR:",
        requestError
      );


      countEl.textContent =
        "0";


      showMessage(
        "Không tải được yêu cầu: "
        +
        (
          requestError.message
          ||
          "Lỗi không xác định"
        ),
        true
      );


      listEl.innerHTML =
        `
          <div class="empty">
            Không tải được yêu cầu lịch học.
          </div>
        `;


      return;

    }


    const requests =
      requestRows || [];


    countEl.textContent =
      requests.length;


    if (
      requests.length === 0
    ) {


      showMessage("");


      listEl.innerHTML =
        `
          <div class="empty">

            ✅ Hiện không có yêu cầu lịch học nào
            đang chờ Coach xử lý.

          </div>
        `;


      return;

    }


    /* =================================================
       REGISTRATIONS
    ================================================== */

    const registrationIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.registration_id
                )
            )
            .filter(Boolean)
        )
      ];


    let registrations =
      [];


    if (
      registrationIds.length > 0
    ) {


      const {
        data,
        error
      } =
        await sb
          .from("registrations")
          .select(`
            id,
            registration_code,
            package_name,
            student_id
          `)
          .in(
            "id",
            registrationIds
          );


      if (error) {


        console.warn(
          "REGISTRATION ERROR:",
          error
        );


      }
      else {


        registrations =
          data || [];

      }

    }


    const registrationMap =
      new Map();


    registrations.forEach(
      item => {

        registrationMap.set(
          Number(item.id),
          item
        );

      }
    );


    /* =================================================
       STUDENTS
    ================================================== */

    const studentIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.student_id
                )
            )
            .filter(Boolean)
        )
      ];


    let students =
      [];


    if (
      studentIds.length > 0
    ) {


      const {
        data,
        error
      } =
        await sb
          .from("students")
          .select(`
            id,
            student_code,
            full_name
          `)
          .in(
            "id",
            studentIds
          );


      if (error) {


        console.warn(
          "STUDENT ERROR:",
          error
        );


      }
      else {


        students =
          data || [];

      }

    }


    const studentMap =
      new Map();


    students.forEach(
      item => {

        studentMap.set(
          Number(item.id),
          item
        );

      }
    );


    /* =================================================
       COURTS
    ================================================== */

    let courts =
      [];


    const {
      data: courtRows,
      error: courtError
    } =
      await sb
        .from("courts")
        .select(`
          id,
          name,
          area,
          ward,
          price_per_session,
          status,
          verified,
          price_verified
        `)
        .eq(
          "status",
          "Hoạt động"
        )
        .eq(
          "verified",
          true
        )
        .eq(
          "price_verified",
          true
        )
        .gt(
          "price_per_session",
          0
        )
        .order(
          "name",
          {
            ascending:true
          }
        );


    if (courtError) {


      console.warn(
        "COURT ERROR:",
        courtError
      );


    }
    else {


      courts =
        courtRows || [];

    }


    /* =================================================
       RENDER
    ================================================== */

    listEl.innerHTML =
      "";


    requests.forEach(
      request => {


        try {


          const registration =
            registrationMap.get(
              Number(
                request.registration_id
              )
            )
            ||
            {};


          const student =
            studentMap.get(
              Number(
                request.student_id
              )
            )
            ||
            {};


          /* =============================================
             LỌC SÂN
          ============================================== */

          const matchingCourts =
            courts.filter(
              court => {


                const requestArea =
                  String(
                    request.requested_area
                    ||
                    ""
                  ).trim();


                const requestWard =
                  String(
                    request.requested_ward
                    ||
                    ""
                  ).trim();


                const courtArea =
                  String(
                    court.area
                    ||
                    ""
                  ).trim();


                const courtWard =
                  String(
                    court.ward
                    ||
                    ""
                  ).trim();


                const sameArea =
                  !requestArea
                  ||
                  courtArea === requestArea;


                const sameWard =
                  !requestWard
                  ||
                  courtWard === requestWard;


                return (
                  sameArea
                  &&
                  sameWard
                );

              }
            );


          const courtOptions =

            matchingCourts.length > 0

              ?

              matchingCourts
                .map(
                  court =>
                    `
                      <option value="${court.id}">

                        ${escapeHtml(
                          court.name
                        )}

                        ·

                        ${escapeHtml(
                          court.ward
                          ||
                          court.area
                          ||
                          ""
                        )}

                        ·

                        ${money(
                          court.price_per_session
                        )}

                      </option>
                    `
                )
                .join("")

              :

              `
                <option value="">
                  Không có sân phù hợp
                </option>
              `;


          /* =============================================
             CARD
          ============================================== */

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "request-card";


          card.dataset.requestId =
            request.id;


          card.innerHTML =
            `

              <div class="request-head">


                <div>


                  <div class="request-code">

                    ${escapeHtml(
                      request.request_code
                      ||
                      `YC${request.id}`
                    )}

                  </div>


                  <div class="student-name">

                    ${escapeHtml(
                      student.full_name
                      ||
                      "Học viên"
                    )}

                  </div>


                  <div class="student-code">

                    ${escapeHtml(
                      student.student_code
                      ||
                      ""
                    )}

                    ${
                      registration.registration_code

                        ?

                        ` · ${escapeHtml(
                          registration.registration_code
                        )}`

                        :

                        ""
                    }

                  </div>


                </div>


                <div class="status">

                  CHỜ COACH

                </div>


              </div>


              <div class="info-grid">


                <div class="info-box">

                  <div class="info-label">
                    Gói học
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      registration.package_name
                      ||
                      "—"
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Buổi
                  </div>

                  <div class="info-value">

                    Buổi ${escapeHtml(
                      request.session_no
                      ||
                      "—"
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Ngày / giờ
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      formatDate(
                        request.requested_date
                      )
                    )}

                    ·

                    ${escapeHtml(
                      formatTime(
                        request.requested_time
                      )
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Thời lượng
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      request.duration_minutes
                      ||
                      60
                    )}
                    phút

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Tỉnh / Thành
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      request.requested_area
                      ||
                      "—"
                    )}

                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Phường / Xã
                  </div>

                  <div class="info-value">

                    ${escapeHtml(
                      request.requested_ward
                      ||
                      "—"
                    )}

                  </div>

                </div>


              </div>


              <div class="note-box">

                ${
                  request.note

                    ?

                    `
                      <strong>
                        Ghi chú Học viên:
                      </strong>

                      ${escapeHtml(
                        request.note
                      )}
                    `

                    :

                    "Học viên không có ghi chú."
                }

              </div>


              <label>

                Sân học *

              </label>


              <select
                class="court-select"
                ${
                  matchingCourts.length > 0
                    ?
                    ""
                    :
                    "disabled"
                }
              >

                <option value="">
                  Chọn sân
                </option>

                ${courtOptions}

              </select>


              <div class="court-note">

                ${
                  matchingCourts.length > 0

                    ?

                    `${matchingCourts.length} sân phù hợp với khu vực yêu cầu.`

                    :

                    "⚠ Chưa có sân đã xác minh đúng Tỉnh/Phường của yêu cầu này."
                }

              </div>


              <textarea
                class="coach-note"
                placeholder="Ghi chú của Coach nếu cần..."
              ></textarea>


              <div class="actions">


                <button
                  type="button"
                  class="approve"
                  ${
                    matchingCourts.length > 0
                      ?
                      ""
                      :
                      "disabled"
                  }
                >

                  ✅ DUYỆT & TẠO BUỔI HỌC

                </button>


                <button
                  type="button"
                  class="reject"
                >

                  ✕ TỪ CHỐI

                </button>


              </div>

            `;


          listEl.appendChild(
            card
          );


        }
        catch (renderError) {


          console.error(
            "CARD RENDER ERROR:",
            renderError,
            request
          );


          const errorCard =
            document.createElement(
              "article"
            );


          errorCard.className =
            "request-card";


          errorCard.innerHTML =
            `

              <div class="request-code">

                ${escapeHtml(
                  request.request_code
                  ||
                  `YC${request.id}`
                )}

              </div>

              <div class="note-box">

                ⚠ Yêu cầu này có dữ liệu hiển thị chưa chuẩn,
                nhưng dữ liệu vẫn còn trong hệ thống.

              </div>

            `;


          listEl.appendChild(
            errorCard
          );

        }

      }
    );


    bindActions();


    showMessage(
      `✓ Đã tải ${requests.length} yêu cầu đang chờ.`
    );

  }


  /* =====================================================
     ACTIONS
  ====================================================== */

  function bindActions() {


    const cards =
      document.querySelectorAll(
        ".request-card[data-request-id]"
      );


    cards.forEach(
      card => {


        const requestId =
          Number(
            card.dataset.requestId
          );


        const courtSelect =
          card.querySelector(
            ".court-select"
          );


        const coachNote =
          card.querySelector(
            ".coach-note"
          );


        const approveBtn =
          card.querySelector(
            ".approve"
          );


        const rejectBtn =
          card.querySelector(
            ".reject"
          );


        /* =================================================
           DUYỆT
        ================================================== */

        if (approveBtn) {


          approveBtn.addEventListener(
            "click",
            async function () {


              const courtId =
                Number(
                  courtSelect?.value
                  ||
                  0
                );


              if (!courtId) {


                showMessage(
                  "Hãy chọn sân trước khi duyệt.",
                  true
                );


                return;

              }


              approveBtn.disabled =
                true;


              rejectBtn.disabled =
                true;


              approveBtn.textContent =
                "ĐANG TẠO BUỔI HỌC...";


              const {
                data,
                error
              } =
                await sb.rpc(
                  "coach_approve_session_request",
                  {

                    p_request_id:
                      requestId,

                    p_court_id:
                      courtId,

                    p_coach_note:
                      coachNote?.value.trim()
                      ||
                      null

                  }
                );


              if (error) {


                console.error(
                  "APPROVE ERROR:",
                  error
                );


                showMessage(
                  error.message
                  ||
                  "Không duyệt được yêu cầu.",
                  true
                );


                approveBtn.disabled =
                  false;


                rejectBtn.disabled =
                  false;


                approveBtn.textContent =
                  "✅ DUYỆT & TẠO BUỔI HỌC";


                return;

              }


              showMessage(
                `✓ Đã duyệt và tạo buổi học ID ${data}.`
              );


              await loadRequests();

            }
          );

        }


        /* =================================================
           TỪ CHỐI
        ================================================== */

        if (rejectBtn) {


          rejectBtn.addEventListener(
            "click",
            async function () {


              const reason =
                window.prompt(
                  "Nhập lý do từ chối yêu cầu lịch học:"
                );


              if (reason === null) {

                return;

              }


              if (
                !reason.trim()
              ) {


                showMessage(
                  "Coach cần nhập lý do từ chối.",
                  true
                );


                return;

              }


              if (approveBtn) {

                approveBtn.disabled =
                  true;

              }


              rejectBtn.disabled =
                true;


              rejectBtn.textContent =
                "ĐANG TỪ CHỐI...";


              const {
                error
              } =
                await sb.rpc(
                  "coach_reject_session_request",
                  {

                    p_request_id:
                      requestId,

                    p_reason:
                      reason.trim()

                  }
                );


              if (error) {


                console.error(
                  "REJECT ERROR:",
                  error
                );


                showMessage(
                  error.message
                  ||
                  "Không từ chối được yêu cầu.",
                  true
                );


                if (approveBtn) {

                  approveBtn.disabled =
                    false;

                }


                rejectBtn.disabled =
                  false;


                rejectBtn.textContent =
                  "✕ TỪ CHỐI";


                return;

              }


              showMessage(
                "✓ Đã từ chối yêu cầu lịch học."
              );


              await loadRequests();

            }
          );

        }


      }
    );

  }


  /* =====================================================
     START
  ====================================================== */

  try {


    const ok =
      await checkCoach();


    if (!ok) {

      return;

    }


    await loadRequests();


  }
  catch (error) {


    console.error(
      "PAGE ERROR:",
      error
    );


    showMessage(
      "Lỗi trang: "
      +
      (
        error?.message
        ||
        error
        ||
        "Không xác định"
      ),
      true
    );


    listEl.innerHTML =
      `
        <div class="empty">

          Có lỗi khi hiển thị yêu cầu.

        </div>
      `;

  }


})();

</script>


</body>

</html>
