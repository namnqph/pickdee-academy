<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#041733"
  >

  <title>
    Yêu cầu lịch học | PickDee Academy
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="./config.js?v=20261003-1"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );

    }


    header {

      padding: 18px 22px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      border-bottom:
        1px solid rgba(255,255,255,.12);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

    }


    .brand span {

      color: #d8ff45;

    }


    a {

      color: #d8ff45;

      text-decoration: none;

      font-weight: 900;

    }


    main {

      width:
        min(
          950px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        38px 0 70px;

    }


    .eyebrow {

      color: #d8ff45;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    h1 {

      margin:
        8px 0 8px;

      font-size:
        clamp(
          36px,
          7vw,
          54px
        );

    }


    .intro {

      color:
        rgba(255,255,255,.62);

      line-height: 1.55;

      margin-bottom: 24px;

    }


    .count-box {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 20px;

      padding:
        9px 13px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.11);

      border:
        1px solid rgba(216,255,69,.25);

      color: #d8ff45;

      font-weight: 900;

    }


    #message {

      min-height: 24px;

      margin-bottom: 16px;

      font-weight: 800;

      line-height: 1.5;

    }


    .success {

      color: #d8ff45;

    }


    .error {

      color: #ffaaaa;

    }


    #list {

      display: grid;

      gap: 16px;

    }


    .request-card {

      position: relative;

      padding: 22px;

      border-radius: 18px;

      background:
        rgba(6,39,88,.8);

      border:
        1px solid rgba(255,255,255,.12);

    }


    .request-head {

      display: flex;

      justify-content: space-between;

      gap: 16px;

      align-items: flex-start;

      margin-bottom: 17px;

    }


    .request-code {

      color: #d8ff45;

      font-size: 20px;

      font-weight: 900;

    }


    .student-name {

      margin-top: 5px;

      font-size: 17px;

      font-weight: 900;

    }


    .student-code {

      margin-top: 4px;

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

    }


    .status {

      padding:
        6px 10px;

      border-radius: 999px;

      background:
        rgba(255,196,107,.12);

      color: #ffc46b;

      font-size: 12px;

      font-weight: 900;

      white-space: nowrap;

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 10px;

      margin-bottom: 16px;

    }


    .info-box {

      padding: 12px;

      border-radius: 11px;

      background:
        rgba(0,0,0,.13);

      border:
        1px solid rgba(255,255,255,.07);

    }


    .info-label {

      margin-bottom: 4px;

      color:
        rgba(255,255,255,.45);

      font-size: 11px;

    }


    .info-value {

      font-weight: 800;

      line-height: 1.4;

    }


    .note-box {

      margin-bottom: 16px;

      padding: 13px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.04);

      color:
        rgba(255,255,255,.7);

      font-size: 13px;

      line-height: 1.5;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 900;

    }


    select,
    textarea {

      width: 100%;

      min-height: 48px;

      padding:
        11px 12px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 10px;

      background: #07172d;

      color: white;

      font-size: 15px;

      outline: none;

    }


    textarea {

      min-height: 90px;

      resize: vertical;

      margin-top: 10px;

    }


    select:focus,
    textarea:focus {

      border-color:
        rgba(216,255,69,.65);

    }


    select:disabled {

      opacity: .6;

    }


    .court-note {

      margin-top: 6px;

      color:
        rgba(255,255,255,.45);

      font-size: 12px;

      line-height: 1.4;

    }


    .coach-note-help {

      margin-top: 6px;

      color:
        rgba(255,255,255,.48);

      font-size: 12px;

      line-height: 1.45;

    }


    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 16px;

    }


    button {

      position: relative;

      z-index: 2;

      min-height: 50px;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

      pointer-events: auto;

    }


    .approve {

      border: 0;

      background: #d8ff45;

      color: #162400;

    }


    .reject {

      border:
        1px solid rgba(255,110,110,.5);

      background:
        rgba(255,90,90,.14);

      color: #ffb0b0;

    }


    .reject:hover {

      background:
        rgba(255,90,90,.22);

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .reject:not(:disabled) {

      opacity: 1;

      cursor: pointer;

    }


    .empty {

      padding: 35px 20px;

      border-radius: 18px;

      text-align: center;

      background:
        rgba(6,39,88,.7);

      border:
        1px solid rgba(255,255,255,.12);

      color:
        rgba(255,255,255,.62);

      line-height: 1.6;

    }


    @media(max-width:650px) {

      .info-grid,
      .actions {

        grid-template-columns: 1fr;

      }


      .request-head {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="brand">

    PickDee
    <span>Academy</span>

  </div>


  <a href="./coach">

    ← Khu vực Coach

  </a>

</header>


<main>


  <div class="eyebrow">

    COACH · XỬ LÝ LỊCH

  </div>


  <h1>

    Yêu cầu lịch học

  </h1>


  <div class="intro">

    Xem lịch Học viên mong muốn, chọn sân phù hợp và duyệt.
    Nếu không thể nhận lịch, Coach nhập lý do và từ chối để Học viên chọn lại lịch khác.

  </div>


  <div class="count-box">

    ⏳ Chờ xử lý:
    <span id="requestCount">0</span>

  </div>


  <div id="message"></div>


  <section id="list">

    <div class="empty">

      Đang tải yêu cầu...

    </div>

  </section>


</main>


<script>

(async function () {


  /* =====================================================
     SUPABASE
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const listEl =
    document.getElementById(
      "list"
    );


  const countEl =
    document.getElementById(
      "requestCount"
    );


  const messageEl =
    document.getElementById(
      "message"
    );


  let currentCoachId =
    null;


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function money(value) {

    return (
      Number(value || 0)
        .toLocaleString(
          "vi-VN"
        )
      +
      "đ"
    );

  }


  function showMessage(
    text,
    isError = false
  ) {

    messageEl.textContent =
      text || "";


    messageEl.className =
      isError
        ?
        "error"
        :
        "success";

  }
  /* =====================================================
     NOTIFY STUDENT - SESSION REQUEST RESULT

     Push chỉ là bước phụ.
     Push lỗi KHÔNG được làm hỏng việc
     Coach duyệt / từ chối yêu cầu.
  ====================================================== */

  async function notifyStudentSessionRequestResult(
    requestId,
    action
  ) {

    try {

      const {
        data,
        error
      } =
        await sb.functions.invoke(
          "pickdee-session-request-result-notify",
          {
            body: {
              request_id:
                Number(requestId),

              action:
                action
            }
          }
        );


      if (error) {

        console.warn(
          "SESSION REQUEST RESULT PUSH:",
          error
        );

        return false;

      }


      console.log(
        "SESSION REQUEST RESULT PUSH:",
        data
      );


      return (
        data?.notification_sent
        ===
        true
      );

    }
    catch (error) {

      console.warn(
        "SESSION REQUEST RESULT PUSH EXCEPTION:",
        error
      );

      return false;

    }

  }

  /* =====================================================
     SAFE DATE
  ====================================================== */

  function formatDate(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    /*
      YYYY-MM-DD
    */

    let match =
      raw.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


    if (match) {


      const year =
        Number(match[1]);


      const month =
        Number(match[2]);


      const day =
        Number(match[3]);


      if (
        year > 1900
        &&
        month >= 1
        &&
        month <= 12
        &&
        day >= 1
        &&
        day <= 31
      ) {


        return (
          String(day).padStart(2,"0")
          +
          "/"
          +
          String(month).padStart(2,"0")
          +
          "/"
          +
          String(year)
        );

      }

    }


    /*
      DD/MM/YYYY
    */

    match =
      raw.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
      );


    if (match) {


      return (
        String(
          Number(match[1])
        ).padStart(2,"0")
        +
        "/"
        +
        String(
          Number(match[2])
        ).padStart(2,"0")
        +
        "/"
        +
        match[3]
      );

    }


    /*
      Không dùng Intl.DateTimeFormat ở đây.
      Nếu format lạ thì hiển thị nguyên dữ liệu.
    */

    return raw;

  }


  function formatTime(value) {


    if (!value) {

      return "—";

    }


    const raw =
      String(value).trim();


    const match =
      raw.match(
        /^(\d{1,2}):(\d{2})/
      );


    if (match) {


      return (
        String(
          Number(match[1])
        ).padStart(2,"0")
        +
        ":"
        +
        match[2]
      );

    }


    return raw;

  }


  /* =====================================================
     CHECK COACH
  ====================================================== */

  async function checkCoach() {


    const {
      data: sessionData,
      error: sessionError
    } =
      await sb.auth
        .getSession();


    if (sessionError) {


      console.error(
        "SESSION ERROR:",
        sessionError
      );


      location.replace(
        "./login.html"
      );


      return false;

    }


    const session =
      sessionData?.session;


    if (!session) {


      location.replace(
        "./login.html"
      );


      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await sb
        .from("profiles")
        .select("role")
        .eq(
          "id",
          session.user.id
        )
        .maybeSingle();


    if (
      profileError
      ||
      !profile
      ||
      profile.role !== "coach"
    ) {


      location.replace(
        "./login.html"
      );


      return false;

    }


    const {
      data: coachId,
      error: coachError
    } =
      await sb.rpc(
        "current_coach_id"
      );


    if (
      coachError
      ||
      !coachId
    ) {


      showMessage(
        "Không xác định được hồ sơ Coach.",
        true
      );


      return false;

    }


    currentCoachId =
      Number(coachId);


    return true;

  }


  /* =====================================================
     LOAD REQUESTS
  ====================================================== */

  async function loadRequests() {


    showMessage(
      "Đang tải yêu cầu..."
    );


    listEl.innerHTML =
      `
        <div class="empty">
          Đang tải yêu cầu...
        </div>
      `;


    /* =================================================
       REQUEST
    ================================================== */

  const {
  data: requestRows,
  error: requestError
} =
  await sb.rpc(
    "coach_get_session_requests"
  );


    if (requestError) {


      console.error(
        "REQUEST ERROR:",
        requestError
      );


      countEl.textContent =
        "0";


      showMessage(
        "Không tải được yêu cầu: "
        +
        (
          requestError.message
          ||
          "Lỗi không xác định"
        ),
        true
      );


      listEl.innerHTML =
        `
          <div class="empty">

            Không tải được yêu cầu lịch học.

          </div>
        `;


      return;

    }


    const requests =
      requestRows || [];


    countEl.textContent =
      requests.length;


    if (
      requests.length === 0
    ) {


      showMessage("");


      listEl.innerHTML =
        `
          <div class="empty">

            ✅ Hiện không có yêu cầu lịch học nào
            đang chờ Coach xử lý.

          </div>
        `;


      return;

    }


    /* =================================================
       REGISTRATIONS
    ================================================== */

    const registrationIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.registration_id
                )
            )
            .filter(Boolean)
        )
      ];


    let registrations =
      [];


    if (
      registrationIds.length > 0
    ) {


      const {
        data,
        error
      } =
        await sb
          .from("registrations")
          .select(`
            id,
            registration_code,
            package_name,
            student_id
          `)
          .in(
            "id",
            registrationIds
          );


      if (error) {


        console.warn(
          "REGISTRATION ERROR:",
          error
        );


      }
      else {


        registrations =
          data || [];

      }

    }


    const registrationMap =
      new Map();


    registrations.forEach(
      item => {


        registrationMap.set(
          Number(item.id),
          item
        );


      }
    );


    /* =================================================
       STUDENTS
    ================================================== */

    const studentIds =
      [
        ...new Set(
          requests
            .map(
              item =>
                Number(
                  item.student_id
                )
            )
            .filter(Boolean)
        )
      ];


    let students =
      [];


    if (
      studentIds.length > 0
    ) {


      const {
        data,
        error
      } =
        await sb
          .from("students")
          .select(`
            id,
            student_code,
            full_name
          `)
          .in(
            "id",
            studentIds
          );


      if (error) {


        console.warn(
          "STUDENT ERROR:",
          error
        );


      }
      else {


        students =
          data || [];

      }

    }


    const studentMap =
      new Map();


    students.forEach(
      item => {


        studentMap.set(
          Number(item.id),
          item
        );


      }
    );


    /* =================================================
       COURTS
    ================================================== */

    let courts =
      [];


       const {
      data: courtRows,
      error: courtError
    } =
      await sb
        .from("courts")
        .select(`
          id,
          name,
          area,
          ward,
          cost_type,
          price_per_session,
          status,
          verified,
          price_verified
        `)
        .eq(
          "status",
          "Hoạt động"
        )
        .eq(
          "verified",
          true
        )
        .or(
          "and(cost_type.eq.Có phí,price_verified.eq.true,price_per_session.gt.0),and(cost_type.eq.Miễn phí,price_per_session.eq.0)"
        )
        .order(
          "name",
          {
            ascending:true
          }
        );

    if (courtError) {


      console.warn(
        "COURT ERROR:",
        courtError
      );


    }
    else {


      courts =
        courtRows || [];

    }


    /* =================================================
       RENDER
    ================================================== */

    listEl.innerHTML =
      "";


    requests.forEach(
      request => {


       const isGroup =
  Boolean(
    request.is_group
    ||
    request.training_group_id
  );


const displayName =

  isGroup
    ?
      (
        request.group_name
        ||
        request.group_code
        ||
        request.display_name
        ||
        "Nhóm học"
      )
    :
      (
        request.student_name
        ||
        "Học viên"
      );


const memberCount =
  Number(
    request.member_count
    ||
    0
  );


const detailLine =

  isGroup
    ?
      [
        memberCount > 0
          ?
            `${memberCount} học viên`
          :
            "",

        request.member_names
        ||
        "",

        request.group_code
        ||
        ""

      ]
        .filter(Boolean)
        .join(" · ")

    :
      [
        request.student_code
        ||
        "",

        request.registration_code
        ||
        ""
      ]
        .filter(Boolean)
        .join(" · ");


        /* =============================================
           LỌC SÂN
        ============================================== */

        const matchingCourts =
          courts.filter(
            court => {


              const requestArea =
                String(
                  request.requested_area
                  ||
                  ""
                ).trim();


              const requestWard =
                String(
                  request.requested_ward
                  ||
                  ""
                ).trim();


              const courtArea =
                String(
                  court.area
                  ||
                  ""
                ).trim();


              const courtWard =
                String(
                  court.ward
                  ||
                  ""
                ).trim();


              const sameArea =
                !requestArea
                ||
                courtArea === requestArea;


              const sameWard =
                !requestWard
                ||
                courtWard === requestWard;


              return (
                sameArea
                &&
                sameWard
              );

            }
          );


                const courtOptions =
          matchingCourts
            .map(
              court => {

                const priceText =
                  String(
                    court.cost_type || ""
                  ).trim()
                  ===
                  "Miễn phí"
                    ?
                    "MIỄN PHÍ"
                    :
                    money(
                      court.price_per_session
                    );

                return `
                  <option value="${court.id}">

                    ${escapeHtml(
                      court.name
                    )}

                    ·

                    ${escapeHtml(
                      court.ward
                      ||
                      court.area
                      ||
                      ""
                    )}

                    ·

                    ${escapeHtml(
                      priceText
                    )}

                  </option>
                `;

              }
            )
            .join("");


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "request-card";


        card.dataset.requestId =
          request.id;


        card.innerHTML =
          `

            <div class="request-head">


              <div>


                <div class="request-code">

                  ${escapeHtml(
                    request.request_code
                    ||
                    `YC${request.id}`
                  )}

                </div>


              <div class="student-name">

  ${escapeHtml(
    displayName
  )}

</div>


<div class="student-code">

  ${escapeHtml(
    detailLine
  )}

</div>


              </div>


              <div class="status">

                CHỜ COACH

              </div>


            </div>


            <div class="info-grid">


              <div class="info-box">

                <div class="info-label">

                  Gói học

                </div>

        <div class="info-value">

  ${escapeHtml(
    request.package_name
    ||
    "—"
  )}

</div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Buổi

                </div>

                <div class="info-value">

                  Buổi ${escapeHtml(
                    request.session_no
                    ||
                    "—"
                  )}

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Ngày / giờ

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    formatDate(
                      request.requested_date
                    )
                  )}

                  ·

                  ${escapeHtml(
                    formatTime(
                      request.requested_time
                    )
                  )}

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Thời lượng

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    request.duration_minutes
                    ||
                    60
                  )}
                  phút

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Tỉnh / Thành

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    request.requested_area
                    ||
                    "—"
                  )}

                </div>

              </div>


              <div class="info-box">

                <div class="info-label">

                  Phường / Xã

                </div>

                <div class="info-value">

                  ${escapeHtml(
                    request.requested_ward
                    ||
                    "—"
                  )}

                </div>

              </div>


            </div>


            <div class="note-box">

              ${
                request.note
                  ?
                  `
                    <strong>
                      Ghi chú Học viên:
                    </strong>

                    ${escapeHtml(
                      request.note
                    )}
                  `
                  :
                  "Học viên không có ghi chú."
              }

            </div>


            <label>

              Sân học

            </label>


            <select
              class="court-select"
              ${
                matchingCourts.length > 0
                  ?
                  ""
                  :
                  "disabled"
              }
            >

              <option value="">

                ${
                  matchingCourts.length > 0
                    ?
                    "Chọn sân"
                    :
                    "Không có sân phù hợp"
                }

              </option>

              ${courtOptions}

            </select>


            <div class="court-note">

              ${
                matchingCourts.length > 0

                  ?

                  `${matchingCourts.length} sân phù hợp với khu vực Học viên yêu cầu.`

                  :

                  "⚠ Chưa có sân đã xác minh đúng Tỉnh/Phường. Coach vẫn có thể TỪ CHỐI yêu cầu."
              }

            </div>


            <textarea
              class="coach-note"
              placeholder="Nhập ghi chú khi duyệt hoặc nhập LÝ DO TỪ CHỐI tại đây..."
            ></textarea>


            <div class="coach-note-help">

              Khi từ chối, Coach bắt buộc nhập lý do vào ô trên để Học viên biết và chọn lịch khác.

            </div>


            <div class="actions">


              <button
                type="button"
                class="approve"
                data-action="approve"
                data-request-id="${request.id}"
                ${
                  matchingCourts.length > 0
                    ?
                    ""
                    :
                    "disabled"
                }
              >

                ✅ DUYỆT & TẠO BUỔI HỌC

              </button>


              <button
                type="button"
                class="reject"
                data-action="reject"
                data-request-id="${request.id}"
              >

                ✕ TỪ CHỐI

              </button>


            </div>

          `;


        listEl.appendChild(
          card
        );


      }
    );


    showMessage(
      `✓ Đã tải ${requests.length} yêu cầu đang chờ.`
    );

  }


  /* =====================================================
     CLICK ACTION
     Dùng event delegation để nút luôn hoạt động
     kể cả sau khi danh sách được render lại.
  ====================================================== */

  listEl.addEventListener(
    "click",
    async function (event) {


      const button =
        event.target.closest(
          "button[data-action]"
        );


      if (!button) {

        return;

      }


      event.preventDefault();


      const action =
        button.dataset.action;


      const requestId =
        Number(
          button.dataset.requestId
        );


      const card =
        button.closest(
          ".request-card"
        );


      if (
        !card
        ||
        !requestId
      ) {

        return;

      }


      const courtSelect =
        card.querySelector(
          ".court-select"
        );


      const coachNote =
        card.querySelector(
          ".coach-note"
        );


      const approveBtn =
        card.querySelector(
          '[data-action="approve"]'
        );


      const rejectBtn =
        card.querySelector(
          '[data-action="reject"]'
        );


      /* =================================================
         DUYỆT
      ================================================== */

      if (
        action === "approve"
      ) {


        const courtId =
          Number(
            courtSelect?.value
            ||
            0
          );


        if (!courtId) {


          showMessage(
            "Hãy chọn sân trước khi duyệt.",
            true
          );


          return;

        }


        approveBtn.disabled =
          true;


        rejectBtn.disabled =
          true;


        approveBtn.textContent =
          "ĐANG TẠO BUỔI HỌC...";


        const {
          data,
          error
        } =
          await sb.rpc(
            "coach_approve_session_request",
            {

              p_request_id:
                requestId,

              p_court_id:
                courtId,

              p_coach_note:
                String(
                  coachNote?.value
                  ||
                  ""
                ).trim()
                ||
                null

            }
          );


        if (error) {


          console.error(
            "APPROVE ERROR:",
            error
          );


          showMessage(
            error.message
            ||
            "Không duyệt được yêu cầu.",
            true
          );


          approveBtn.disabled =
            false;


          rejectBtn.disabled =
            false;


          approveBtn.textContent =
            "✅ DUYỆT & TẠO BUỔI HỌC";


          return;

        }


        showMessage(
          `✓ Đã duyệt và tạo buổi học ID ${data}.`
        );

        await notifyStudentSessionRequestResult(
          requestId,
          "approved"
        );
        await loadRequests();


        return;

      }


      /* =================================================
         TỪ CHỐI
      ================================================== */

      if (
        action === "reject"
      ) {


        const reason =
          String(
            coachNote?.value
            ||
            ""
          ).trim();


        /*
          KHÔNG DÙNG WINDOW.PROMPT.
          Coach nhập lý do ngay trên trang.
        */

        if (!reason) {


          showMessage(
            "Hãy nhập lý do từ chối vào ô Ghi chú của Coach trước.",
            true
          );


          if (coachNote) {


            coachNote.focus();


            coachNote.placeholder =
              "Ví dụ: Coach bận khung giờ này, vui lòng chọn lịch khác.";


          }


          return;

        }


        /*
          Hỏi xác nhận bằng confirm.
          Nếu môi trường chặn confirm thì
          người dùng vẫn có thể bỏ đoạn này sau.
        */

        const confirmed =
          window.confirm(
            "Xác nhận từ chối yêu cầu lịch học này?"
          );


        if (!confirmed) {

          return;

        }


        if (approveBtn) {

          approveBtn.disabled =
            true;

        }


        rejectBtn.disabled =
          true;


        rejectBtn.textContent =
          "ĐANG TỪ CHỐI...";


        const {
          data,
          error
        } =
          await sb.rpc(
            "coach_reject_session_request",
            {

              p_request_id:
                requestId,

              p_reason:
                reason

            }
          );


        if (error) {


          console.error(
            "REJECT ERROR:",
            error
          );


          showMessage(
            error.message
            ||
            "Không từ chối được yêu cầu.",
            true
          );


          if (approveBtn) {

            /*
              Chỉ mở lại DUYỆT nếu có sân.
            */

            if (
              courtSelect
              &&
              !courtSelect.disabled
            ) {

              approveBtn.disabled =
                false;

            }

          }


          rejectBtn.disabled =
            false;


          rejectBtn.textContent =
            "✕ TỪ CHỐI";


          return;

        }


        console.log(
          "REJECT RESULT:",
          data
        );


        showMessage(
          "✓ Đã từ chối yêu cầu lịch học."
        );

        await notifyStudentSessionRequestResult(
          requestId,
          "rejected"
        );
        await loadRequests();


        return;

      }


    }
  );

  /* =====================================================
     HIỂN THỊ CHI TIẾT SÂN + GOOGLE MAPS
  ====================================================== */

  listEl.addEventListener(
    "change",
    async function (event) {

      const courtSelect =
        event.target.closest(
          ".court-select"
        );


      if (!courtSelect) {

        return;

      }


      const card =
        courtSelect.closest(
          ".request-card"
        );


      if (!card) {

        return;

      }


      let detailBox =
        card.querySelector(
          ".court-detail-box"
        );


      if (!detailBox) {

        detailBox =
          document.createElement(
            "div"
          );


        detailBox.className =
          "court-detail-box";


        detailBox.style.marginTop =
          "10px";


        detailBox.style.padding =
          "13px";


        detailBox.style.borderRadius =
          "11px";


        detailBox.style.background =
          "rgba(216,255,69,.07)";


        detailBox.style.border =
          "1px solid rgba(216,255,69,.20)";


        detailBox.style.fontSize =
          "13px";


        detailBox.style.lineHeight =
          "1.6";


        const courtNote =
          card.querySelector(
            ".court-note"
          );


        if (courtNote) {

          courtNote.insertAdjacentElement(
            "afterend",
            detailBox
          );

        }
        else {

          courtSelect.insertAdjacentElement(
            "afterend",
            detailBox
          );

        }

      }


      const courtId =
        Number(
          courtSelect.value
          ||
          0
        );


      if (!courtId) {

        detailBox.innerHTML =
          "";


        detailBox.style.display =
          "none";


        return;

      }


      detailBox.style.display =
        "block";


      detailBox.innerHTML =
        "Đang tải thông tin sân...";


      try {

        const {
          data: court,
          error
        } =
          await sb
            .from("courts")
            .select(`
              id,
              name,
              area,
              ward,
              address,
              cost_type,
              price_per_session,
              google_maps_url
            `)
            .eq(
              "id",
              courtId
            )
            .maybeSingle();


        if (error) {

          throw error;

        }


        if (!court) {

          detailBox.innerHTML =
            "Không tìm thấy thông tin sân.";


          return;

        }


        const priceText =
          String(
            court.cost_type
            ||
            ""
          ).trim()
          ===
          "Miễn phí"
            ?
            "MIỄN PHÍ"
            :
            money(
              court.price_per_session
            );


        const addressText =
          court.address
          ||
          [
            court.ward,
            court.area
          ]
            .filter(Boolean)
            .join(", ")
          ||
          "Chưa có địa chỉ";


        const mapButton =
          court.google_maps_url
            ?
            `
              <a
                href="${escapeHtml(
                  court.google_maps_url
                )}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                  display:inline-block;
                  margin-top:10px;
                  padding:10px 14px;
                  border-radius:9px;
                  background:#d8ff45;
                  color:#162400;
                  text-decoration:none;
                  font-weight:900;
                "
              >
                📍 CHỈ ĐƯỜNG GOOGLE MAPS
              </a>
            `
            :
            `
              <div
                style="
                  margin-top:8px;
                  color:#ffb0b0;
                "
              >
                ⚠ Sân này chưa có Google Maps.
              </div>
            `;


        detailBox.innerHTML =
          `
            <div
              style="
                font-size:15px;
                font-weight:900;
                color:#d8ff45;
                margin-bottom:5px;
              "
            >
              ${escapeHtml(
                court.name
                ||
                "Sân học"
              )}
            </div>

            <div>
              📍
              <strong>Địa chỉ:</strong>
              ${escapeHtml(
                addressText
              )}
            </div>

            <div>
              💰
              <strong>Giá sân:</strong>
              ${escapeHtml(
                priceText
              )}
              / buổi
            </div>

            ${mapButton}
          `;

      }
      catch (error) {

        console.error(
          "COURT DETAIL ERROR:",
          error
        );


        detailBox.innerHTML =
          `
            <span style="color:#ffb0b0;">
              Không tải được thông tin sân.
            </span>
          `;

      }

    }
  );
  /* =====================================================
     START
  ====================================================== */

  try {


    const ok =
      await checkCoach();


    if (!ok) {

      return;

    }


    await loadRequests();


  }
  catch (error) {


    console.error(
      "PAGE ERROR:",
      error
    );


    showMessage(
      "Lỗi trang: "
      +
      (
        error?.message
        ||
        error
        ||
        "Không xác định"
      ),
      true
    );


    listEl.innerHTML =
      `
        <div class="empty">

          Có lỗi khi hiển thị yêu cầu.

        </div>
      `;

  }


})();

</script>
