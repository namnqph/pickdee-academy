<script src="./coach-sessions.js?v=20260930-1"></script>
 <script>
(function setupRequestDayCover() {

  const button =
    document.getElementById(
      "requestDayCoverBtn"
    );

  const message =
    document.getElementById(
      "message"
    );

  if (!button || !message) {
    return;
  }


  const dayCoverSb =
    (
      typeof sb !== "undefined"
      &&
      sb
    )
      ?
      sb
      :
      window.supabase.createClient(
        window.PICKDEE_CONFIG.SUPABASE_URL,
        window.PICKDEE_CONFIG.SUPABASE_PUBLISHABLE_KEY
      );


  function localTodayISO() {

    const now =
      new Date();

    return (
      now.getFullYear()
      +
      "-"
      +
      String(
        now.getMonth() + 1
      ).padStart(2, "0")
      +
      "-"
      +
      String(
        now.getDate()
      ).padStart(2, "0")
    );

  }


  function closeDayCoverModal() {

    const oldModal =
      document.getElementById(
        "dayCoverModal"
      );

    if (oldModal) {
      oldModal.remove();
    }

  }


  function openDayCoverModal() {

    closeDayCoverModal();


    const today =
      localTodayISO();


    const overlay =
      document.createElement(
        "div"
      );


    overlay.id =
      "dayCoverModal";


    overlay.style.cssText = `
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.68);
      backdrop-filter:blur(5px);
    `;


    overlay.innerHTML = `
      <div
        style="
          width:min(520px,100%);
          padding:22px;
          border-radius:18px;
          background:#062456;
          border:1px solid rgba(216,255,69,.30);
          box-shadow:0 20px 60px rgba(0,0,0,.45);
          color:white;
        "
      >

        <div
          style="
            color:#d8ff45;
            font-size:12px;
            font-weight:900;
            letter-spacing:.8px;
            margin-bottom:6px;
          "
        >
          COACH BẬN CẢ NGÀY
        </div>

        <div
          style="
            font-size:24px;
            font-weight:900;
            margin-bottom:8px;
          "
        >
          🔄 Nhờ Coach dạy thay
        </div>

        <div
          style="
            color:rgba(255,255,255,.65);
            font-size:13px;
            line-height:1.5;
            margin-bottom:20px;
          "
        >
          PickDee sẽ tạo yêu cầu dạy thay cho toàn bộ
          buổi đủ điều kiện trong ngày đã chọn.
        </div>


        <label
          style="
            display:block;
            margin-bottom:7px;
            color:rgba(255,255,255,.65);
            font-size:12px;
            font-weight:800;
          "
        >
          Ngày cần nghỉ
        </label>

        <input
          id="dayCoverDate"
          type="date"
          min="${today}"
          value="${today}"
          style="
            width:100%;
            margin-bottom:16px;
            padding:13px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,.18);
            background:#0a315f;
            color:white;
            font-size:15px;
          "
        >


        <label
          style="
            display:block;
            margin-bottom:7px;
            color:rgba(255,255,255,.65);
            font-size:12px;
            font-weight:800;
          "
        >
          Lý do
        </label>

        <textarea
          id="dayCoverReason"
          style="
            width:100%;
            min-height:90px;
            resize:vertical;
            margin-bottom:18px;
            padding:13px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,.18);
            background:#0a315f;
            color:white;
            font:inherit;
          "
        >Coach chính bận cả ngày</textarea>


        <div
          id="dayCoverModalMessage"
          style="
            display:none;
            margin-bottom:14px;
            padding:11px;
            border-radius:9px;
            background:rgba(255,255,255,.06);
            font-size:13px;
            line-height:1.45;
          "
        ></div>


        <div
          style="
            display:flex;
            gap:10px;
          "
        >

          <button
            id="dayCoverCancel"
            type="button"
            style="
              flex:1;
              min-height:46px;
              border-radius:10px;
              border:1px solid rgba(255,255,255,.16);
              background:rgba(255,255,255,.08);
              color:white;
              font-weight:900;
              cursor:pointer;
            "
          >
            HỦY
          </button>

          <button
            id="dayCoverConfirm"
            type="button"
            style="
              flex:1.4;
              min-height:46px;
              border:0;
              border-radius:10px;
              background:#d8ff45;
              color:#172600;
              font-weight:900;
              cursor:pointer;
            "
          >
            XÁC NHẬN NHỜ DẠY THAY
          </button>

        </div>

      </div>
    `;


    document.body.appendChild(
      overlay
    );


    const dateInput =
      document.getElementById(
        "dayCoverDate"
      );


    const reasonInput =
      document.getElementById(
        "dayCoverReason"
      );


    const cancelBtn =
      document.getElementById(
        "dayCoverCancel"
      );


    const confirmBtn =
      document.getElementById(
        "dayCoverConfirm"
      );


    const modalMessage =
      document.getElementById(
        "dayCoverModalMessage"
      );


    cancelBtn.addEventListener(
      "click",
      closeDayCoverModal
    );


    overlay.addEventListener(
      "click",
      function (event) {

        if (
          event.target === overlay
        ) {
          closeDayCoverModal();
        }

      }
    );


    confirmBtn.addEventListener(
      "click",
      async function () {

        const sessionDate =
          String(
            dateInput.value || ""
          ).trim();


        const reason =
          String(
            reasonInput.value || ""
          ).trim()
          ||
          "Coach chính bận cả ngày";


        if (!sessionDate) {

          modalMessage.style.display =
            "block";

          modalMessage.style.color =
            "#ffb0b0";

          modalMessage.textContent =
            "Vui lòng chọn ngày cần nghỉ.";

          return;
        }


        if (
          sessionDate < today
        ) {

          modalMessage.style.display =
            "block";

          modalMessage.style.color =
            "#ffb0b0";

          modalMessage.textContent =
            "Không thể nhờ dạy thay cho ngày đã qua.";

          return;
        }


        confirmBtn.disabled =
          true;

        cancelBtn.disabled =
          true;

        confirmBtn.textContent =
          "⏳ ĐANG GỬI...";


        modalMessage.style.display =
          "block";

        modalMessage.style.color =
          "#ffd884";

        modalMessage.textContent =
          "Đang tạo yêu cầu dạy thay cho các buổi trong ngày...";


        try {

          const {
            data,
            error
          } =
            await dayCoverSb.rpc(
              "request_coach_cover_for_day",
              {
                p_session_date:
                  sessionDate,

                p_reason:
                  reason
              }
            );


          if (error) {
            throw error;
          }


          const requested =
            Number(
              data?.requested || 0
            );


          const skipped =
            Number(
              data?.skipped || 0
            );


          if (
            requested === 0
            &&
            skipped === 0
          ) {

            modalMessage.style.color =
              "#ffd884";

            modalMessage.textContent =
              `Ngày ${sessionDate} không có buổi nào đủ điều kiện để nhờ dạy thay.`;

          }
          else if (
            requested > 0
            &&
            skipped === 0
          ) {

            modalMessage.style.color =
              "#d8ff45";

            modalMessage.textContent =
              `✓ Đã gửi yêu cầu dạy thay cho ${requested} buổi.`;

          }
          else {

            modalMessage.style.color =
              requested > 0
                ? "#ffd884"
                : "#ffb0b0";

            modalMessage.textContent =
              `Đã gửi ${requested} buổi · Bỏ qua ${skipped} buổi.`;

          }


          message.style.color =
            requested > 0
              ? "#d8ff45"
              : "#ffd884";

          message.textContent =
            requested > 0
              ?
              `✓ Đã tạo ${requested} yêu cầu dạy thay cho ngày ${sessionDate}.`
              :
              `Ngày ${sessionDate} chưa có buổi nào đủ điều kiện.`;


          if (
            requested > 0
          ) {

            setTimeout(
              closeDayCoverModal,
              1200
            );

          }

        }
        catch (error) {

          console.error(
            "REQUEST DAY COACH COVER:",
            error
          );


          modalMessage.style.display =
            "block";

          modalMessage.style.color =
            "#ffb0b0";

          modalMessage.textContent =
            "Không tạo được yêu cầu dạy thay: "
            +
            (
              error?.message
              ||
              error
            );

        }
        finally {

          confirmBtn.disabled =
            false;

          cancelBtn.disabled =
            false;

          confirmBtn.textContent =
            "XÁC NHẬN NHỜ DẠY THAY";

        }

      }
    );

  }


  button.addEventListener(
    "click",
    function (event) {

      event.preventDefault();

      event.stopPropagation();

      openDayCoverModal();

    }
  );

})();
</script>
<script>
(async function () {

  const wait = (ms) =>
    new Promise(
      resolve => setTimeout(resolve, ms)
    );


  /* Chờ script gốc xác định Coach */
  for (
    let i = 0;
    i < 80;
    i++
  ) {

    if (
      typeof currentCoach !== "undefined"
      &&
      currentCoach
      &&
      currentCoach.id
    ) {
      break;
    }

    await wait(100);
  }


  if (
    typeof currentCoach === "undefined"
    ||
    !currentCoach
    ||
    !currentCoach.id
    ||
    typeof sb === "undefined"
  ) {
    return;
  }


  /*
    Chờ loadSessions() gốc chạy xong
    để tránh bị danh sách cũ ghi đè lại.
  */

  await wait(1500);


  try {

    const {
      data,
      error
    } =
      await sb
        .from("class_sessions")
        .select(`
          id,
          session_code,
          registration_id,
          training_group_id,
          coach_id,
          substitute_coach_id,
          session_no,
          session_date,
          start_time,
          duration_minutes,
          court_name,
          status,
          note,

          registrations (
            id,
            student_id,
            is_test,

            students (
              id,
              student_code,
              full_name
            )
          )
        `)
        .or(
          `coach_id.eq.${currentCoach.id},substitute_coach_id.eq.${currentCoach.id}`
        );


    if (error) {
      throw error;
    }


    const cleanRows =
      (data || []).filter(
        item => {

          const registration =
            one(
              item.registrations
            );


          const isGroupSession =
            Number(
              item.training_group_id || 0
            ) > 0;


          /*
            Lịch cá nhân TEST:
            vẫn ẩn như hệ thống cũ.

            Lịch nhóm TEST:
            được hiện để test luồng nhóm.
          */

          const canShow =
            registration?.is_test !== true
            ||
            isGroupSession;


          const actualCoachId =
            Number(
              item.substitute_coach_id
              ||
              item.coach_id
              ||
              0
            );


          return (
            canShow
            &&
            actualCoachId ===
              Number(
                currentCoach.id
              )
          );

        }
      );


    /* =====================================
       LẤY 2 HỌC VIÊN CỦA BUỔI NHÓM
    ====================================== */

    await Promise.all(

      cleanRows.map(
        async item => {

          if (
            !item.training_group_id
          ) {
            return;
          }


          try {

            const {
              data: participantData,
              error: participantError
            } =
              await sb.rpc(
                "coach_get_session_participants",
                {
                  p_session_id:
                    item.id
                }
              );


            if (participantError) {
              throw participantError;
            }


            /*
              RPC thật trả:
              {
                is_group: true,
                members: [...]
              }
            */

            const memberRows =
              (
                participantData
                &&
                Array.isArray(
                  participantData.members
                )
              )
                ?
                participantData.members
                :
                [];


            const names =
              [
                ...new Set(

                  memberRows
                    .map(
                      member =>
                        String(
                          member.student_name
                          ||
                          member.student_code
                          ||
                          ""
                        ).trim()
                    )
                    .filter(Boolean)

                )
              ];


            if (
              names.length === 0
            ) {
              return;
            }


            const groupName =
              names.join(
                " + "
              );


            item.group_student_text =
              groupName;


            /*
              Render cũ đang đọc:
              registrations -> students -> full_name

              Ta chỉ thay tên hiển thị
              cho riêng session nhóm.
            */

            let registration =
              one(
                item.registrations
              );


            if (!registration) {

              item.registrations = [
                {
                  students: [
                    {
                      full_name:
                        groupName,

                      student_code:
                        ""
                    }
                  ]
                }
              ];

              return;
            }


            let student =
              one(
                registration.students
              );


            if (!student) {

              registration.students = [
                {
                  full_name:
                    groupName,

                  student_code:
                    ""
                }
              ];

              return;
            }


            student.full_name =
              groupName;

          }
          catch (participantError) {

            console.error(
              "GROUP SESSION MEMBERS:",
              item.id,
              participantError
            );

          }

        }
      )

    );


    /* =====================================
       RENDER LẠI DANH SÁCH COACH
    ====================================== */

    sessions =
      sortCoachSessions(
        cleanRows
      );


    renderSessions(
      sessions
    );


    /*
      Render lại thêm 1 lần để chắc chắn
      script gốc không ghi đè.
    */

    setTimeout(
      function () {

        renderSessions(
          sessions
        );

      },
      1500
    );


    console.log(
      "COACH GROUP SESSIONS OK:",
      sessions
    );

  }
  catch (error) {

    console.error(
      "COACH GROUP SESSION PATCH:",
      error
    );

  }

})();
</script>


  <script>
(async function setupCoachSessionCourtDirections() {

  const wait = (ms) =>
    new Promise(
      resolve => setTimeout(resolve, ms)
    );


  /*
    Chờ script Coach hiện tại tải xong.
  */

  for (
    let i = 0;
    i < 80;
    i++
  ) {

    if (
      typeof sb !== "undefined"
      &&
      typeof currentCoach !== "undefined"
      &&
      currentCoach
      &&
      currentCoach.id
    ) {

      break;

    }


    await wait(100);

  }


  if (
    typeof sb === "undefined"
    ||
    typeof currentCoach === "undefined"
    ||
    !currentCoach
    ||
    !currentCoach.id
  ) {

    return;

  }


  const sessionBody =
    document.getElementById(
      "sessionBody"
    );


  if (!sessionBody) {

    return;

  }


  /*
    Map:
    Mã buổi -> thông tin sân
  */

  const courtInfoMap =
    new Map();


  async function loadCourtInfo() {

    try {

      const {
        data: sessionRows,
        error: sessionError
      } =
        await sb
          .from("class_sessions")
          .select(`
            id,
            session_code,
            coach_id,
            substitute_coach_id,
            court_id,
            court_name,
            court_cost
          `)
          .or(
            `coach_id.eq.${currentCoach.id},substitute_coach_id.eq.${currentCoach.id}`
          );


      if (sessionError) {

        throw sessionError;

      }


      const rows =
        sessionRows || [];


      const courtIds =
        [
          ...new Set(
            rows
              .map(
                item =>
                  Number(
                    item.court_id || 0
                  )
              )
              .filter(Boolean)
          )
        ];


      let courts =
        [];


      if (
        courtIds.length > 0
      ) {

        const {
          data: courtRows,
          error: courtError
        } =
          await sb
            .from("courts")
            .select(`
              id,
              name,
              address,
              area,
              ward,
              google_maps_url,
              price_per_session
            `)
            .in(
              "id",
              courtIds
            );


        if (courtError) {

          throw courtError;

        }


        courts =
          courtRows || [];

      }


      const courtMap =
        new Map();


      courts.forEach(
        court => {

          courtMap.set(
            Number(court.id),
            court
          );

        }
      );


      courtInfoMap.clear();


      rows.forEach(
        item => {

          const sessionCode =
            String(
              item.session_code || ""
            ).trim();


          if (!sessionCode) {

            return;

          }


          const court =
            courtMap.get(
              Number(
                item.court_id || 0
              )
            )
            ||
            null;


          courtInfoMap.set(
            sessionCode,
            {
              session:
                item,

              court:
                court
            }
          );

        }
      );

    }
    catch (error) {

      console.error(
        "COACH SESSION COURT INFO:",
        error
      );

    }

  }


  function formatMoney(value) {

    return (
      Number(value || 0)
        .toLocaleString(
          "vi-VN"
        )
      +
      "đ"
    );

  }


  function decorateCourtCells() {

    const rows =
      sessionBody.querySelectorAll(
        "tr"
      );


    rows.forEach(
      row => {

        const cells =
          row.querySelectorAll(
            "td"
          );


        /*
          Bảng Coach có:
          0 Mã buổi
          1 Học viên
          2 Buổi số
          3 Ngày
          4 Giờ
          5 Sân
          6 Trạng thái
        */

        if (
          cells.length < 7
        ) {

          return;

        }


        const sessionCode =
          String(
            cells[0].textContent || ""
          ).trim();


        const info =
          courtInfoMap.get(
            sessionCode
          );


        if (
          !info
          ||
          !info.court
        ) {

          return;

        }


        const court =
          info.court;


        const courtCell =
          cells[5];


        if (
          courtCell.querySelector(
            ".coach-court-route"
          )
        ) {

          return;

        }


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "coach-court-route";


        box.style.marginTop =
          "7px";


        box.style.display =
          "flex";


        box.style.flexDirection =
          "column";


        box.style.alignItems =
          "flex-start";


        box.style.gap =
          "4px";


        const address =
          document.createElement(
            "div"
          );


        address.style.fontSize =
          "11px";


        address.style.lineHeight =
          "1.35";


        address.style.color =
          "rgba(255,255,255,.58)";


        address.textContent =
          "📍 "
          +
          (
            court.address
            ||
            [
              court.ward,
              court.area
            ]
              .filter(Boolean)
              .join(", ")
            ||
            "Chưa có địa chỉ"
          );


        box.appendChild(
          address
        );


        const price =
          document.createElement(
            "div"
          );


        price.style.fontSize =
          "11px";


        price.style.color =
          "rgba(255,255,255,.58)";


        price.textContent =
          "💰 Giá sân: "
          +
          formatMoney(
            info.session.court_cost
            ||
            court.price_per_session
            ||
            0
          )
          +
          " / buổi";


        box.appendChild(
          price
        );


        const mapUrl =
          court.google_maps_url
          ||
          (
            "https://www.google.com/maps/search/?api=1&query="
            +
            encodeURIComponent(
              [
                court.name,
                court.address,
                court.ward,
                court.area,
                "Việt Nam"
              ]
                .filter(Boolean)
                .join(", ")
            )
          );


        const button =
          document.createElement(
            "a"
          );


        button.href =
          mapUrl;


        button.target =
          "_blank";


        button.rel =
          "noopener noreferrer";


        button.textContent =
          "📍 CHỈ ĐƯỜNG";


        button.style.marginTop =
          "2px";


        button.style.display =
          "inline-block";


        button.style.padding =
          "6px 9px";


        button.style.borderRadius =
          "7px";


        button.style.background =
          "#d8ff45";


        button.style.color =
          "#172600";


        button.style.fontSize =
          "11px";


        button.style.fontWeight =
          "900";


        button.style.textDecoration =
          "none";


        button.addEventListener(
          "click",
          function (event) {

            /*
              Không để click nút Google Maps
              kích hoạt click của cả dòng.
            */

            event.stopPropagation();

          }
        );


        box.appendChild(
          button
        );


        courtCell.appendChild(
          box
        );

      }
    );

  }


  /*
    Lấy dữ liệu sân lần đầu.
  */

  await loadCourtInfo();


  /*
    Chờ renderSessions() hiện tại render bảng.
  */

  await wait(300);


  decorateCourtCells();


  /*
    Nếu tìm kiếm / renderSessions() render lại bảng,
    tự gắn lại địa chỉ + nút chỉ đường.
  */

  let decorateTimer =
    null;


  const observer =
    new MutationObserver(
      function () {

        clearTimeout(
          decorateTimer
        );


        decorateTimer =
          setTimeout(
            decorateCourtCells,
            80
          );

      }
    );


  observer.observe(
    sessionBody,
    {
      childList: true,
      subtree: true
    }
  );


  console.log(
    "COACH SESSION GOOGLE MAPS OK"
  );

})();
</script>

<script>
(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const avatarSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const avatarImage =
    document.getElementById(
      "coachAvatarImage"
    );

  const avatarPlaceholder =
    document.getElementById(
      "coachAvatarPlaceholder"
    );


  async function showCoachAvatar(path) {

    if (!path) {

      avatarImage.style.display =
        "none";

      avatarPlaceholder.style.display =
        "block";

      return;
    }


    const {
      data,
      error
    } =
      await avatarSb
        .storage
        .from("profile-photos")
        .createSignedUrl(
          path,
          3600
        );


    if (
      error ||
      !data?.signedUrl
    ) {

      console.error(
        "Không tải được ảnh Coach:",
        error
      );

      avatarImage.style.display =
        "none";

      avatarPlaceholder.style.display =
        "block";

      return;
    }


    avatarImage.src =
      data.signedUrl +
      "&t=" +
      Date.now();


    avatarImage.onload =
      function () {

        avatarPlaceholder.style.display =
          "none";

        avatarImage.style.display =
          "block";

      };


    avatarImage.onerror =
      function () {

        avatarImage.style.display =
          "none";

        avatarPlaceholder.style.display =
          "block";

      };
  }


  const {
    data: { session }
  } =
    await avatarSb.auth.getSession();


  if (!session) {
    return;
  }


  const {
    data: avatarPath,
    error: avatarError
  } =
    await avatarSb.rpc(
      "get_my_coach_avatar"
    );


  if (avatarError) {

    console.error(
      "Không lấy được avatar Coach:",
      avatarError
    );

    return;
  }


  await showCoachAvatar(
    avatarPath || null
  );

})();
</script>
