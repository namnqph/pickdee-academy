<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lịch dạy của tôi | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    #userEmail {
      color: rgba(255,255,255,.8);
      font-size: 14px;
    }

    .logout-btn {
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,.12);
    }

    .logout-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .container {
      width: min(1150px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    /* =====================================
       MENU COACH
    ====================================== */

    .coach-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .coach-nav a {
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .coach-nav a:hover {
      border-color: rgba(216,255,69,.45);
    }

    .coach-nav a.active {
      background: #d8ff45;
      color: #172600;
    }

    /* =====================================
       THÔNG TIN NHẬN DIỆN COACH
    ====================================== */

    .coach-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px;
      margin-bottom: 24px;
      border-radius: 16px;
      background: rgba(6,39,88,.72);
      border: 1px solid rgba(255,255,255,.12);
    }

    .coach-avatar {
      width: 78px;
      height: 78px;
      min-width: 78px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          145deg,
          rgba(216,255,69,.18),
          rgba(255,255,255,.06)
        );
      border: 2px solid rgba(216,255,69,.65);
    }

    #coachAvatarImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #coachAvatarPlaceholder {
      font-size: 34px;
      opacity: .8;
    }

    .coach-info {
      min-width: 0;
    }

    .coach-label {
      color: rgba(255,255,255,.48);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: .8px;
    }

    .coach-name {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.3;
    }

    .coach-code {
      margin-top: 5px;
      color: #d8ff45;
      font-weight: 800;
    }

    /* =====================================
       PAGE
    ====================================== */

    .eyebrow {
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(36px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.65);
      margin-bottom: 24px;
    }

    .toolbar {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
      font-size: 15px;
    }

    .card {
      overflow: hidden;
      border-radius: 16px;
      background: rgba(6,39,88,.72);
      border: 1px solid rgba(255,255,255,.12);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      color: #d8ff45;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.045);
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(216,255,69,.13);
      color: #d8ff45;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .today {
      color: #d8ff45;
      font-weight: 900;
    }

    #message {
      margin-bottom: 15px;
      color: #ffb0b0;
    }

    #empty {
      display: none;
      padding: 30px;
      text-align: center;
      color: rgba(255,255,255,.6);
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 15px;
      }

      #userEmail {
        display: none;
      }

      .container {
        width: calc(100% - 20px);
      }

      .coach-card {
        gap: 13px;
        padding: 15px;
      }

      .coach-avatar {
        width: 65px;
        height: 65px;
        min-width: 65px;
      }

      .coach-name {
        font-size: 18px;
      }

      th,
      td {
        padding: 12px 9px;
      }
    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div class="topbar-actions">

    <div id="userEmail"></div>

    <button
      id="logoutBtn"
      class="logout-btn"
      type="button"
    >
      ĐĂNG XUẤT
    </button>

  </div>

</header>


<main class="container">

  <!-- =====================================
       MENU CHUNG COACH
  ====================================== -->

  <nav class="coach-nav">

    <a href="./coach">
      👤 Hồ sơ của tôi
    </a>

    <a
      class="active"
      href="./coach-sessions"
    >
      📅 Lịch dạy của tôi
    </a>

    <a href="./coach-my-work">
      💰 Công của tôi
    </a>

  </nav>


  <!-- =====================================
       NHẬN DIỆN COACH
  ====================================== -->

  <section class="coach-card">

    <div class="coach-avatar">

      <img
        id="coachAvatarImage"
        alt="Ảnh Coach"
      >

      <div id="coachAvatarPlaceholder">
        👤
      </div>

    </div>


    <div class="coach-info">

      <div class="coach-label">
        COACH ĐANG ĐĂNG NHẬP
      </div>

      <div
        class="coach-name"
        id="coachName"
      >
        Đang tải Coach...
      </div>

      <div
        class="coach-code"
        id="coachCode"
      ></div>

    </div>

  </section>


  <!-- =====================================
       LỊCH DẠY
  ====================================== -->

  <div class="eyebrow">
    KHU VỰC COACH
  </div>

  <h1>
    Lịch dạy của tôi
  </h1>

  <div class="sub">
    Chỉ hiển thị các buổi học được phân công cho bạn.
  </div>


  <div id="message"></div>


  <div class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Tìm mã buổi, học viên, sân, trạng thái..."

  </div>


  <section class="card">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Mã buổi</th>
            <th>Học viên</th>
            <th>Buổi số</th>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Sân</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="sessionBody">

          <tr>
            <td colspan="7">
              Đang tải lịch dạy...
            </td>
          </tr>

        </tbody>

      </table>


      <div id="empty">
        Bạn chưa có lịch dạy.
      </div>

    </div>

  </section>

</main>


<!-- =====================================
     JS LỊCH DẠY HIỆN TẠI
====================================== -->

<script src="./coach-sessions.js?v=20260910-2"></script>
<script>
(async function () {

  const wait =
    ms =>
      new Promise(
        resolve =>
          setTimeout(resolve, ms)
      );


  /* Chờ coach-sessions.js tải xong Coach */
  for (
    let i = 0;
    i < 60;
    i++
  ) {

    if (
      typeof currentCoach !== "undefined"
      &&
      currentCoach?.id
    ) {
      break;
    }

    await wait(100);
  }


  if (
    typeof currentCoach === "undefined"
    ||
    !currentCoach?.id
    ||
    typeof sb === "undefined"
  ) {
    return;
  }


  const {
    data,
    error
  } =
    await sb
      .from("class_sessions")
      .select(`
        id,
        session_code,
        registration_id,
        training_group_id,
        coach_id,
        substitute_coach_id,
        session_no,
        session_date,
        start_time,
        duration_minutes,
        court_name,
        status,
        note,

        registrations (
          id,
          student_id,
          is_test,

          students (
            id,
            student_code,
            full_name
          )
        )
      `)
      .or(
        `coach_id.eq.${currentCoach.id},substitute_coach_id.eq.${currentCoach.id}`
      );


  if (error) {

    console.error(
      "Không tải được lịch Coach:",
      error
    );

    return;
  }


  const cleanRows =
    (data || [])
      .filter(
        item => {

          const registration =
            one(
              item.registrations
            );


          const isGroupSession =
            Number(
              item.training_group_id
              ||
              0
            ) > 0;


          /*
            Lịch cá nhân TEST vẫn ẩn.

            Riêng lịch NHÓM TEST
            vẫn hiển thị để Coach test.
          */

          const canShow =
            registration?.is_test !== true
            ||
            isGroupSession;


          const actualCoachId =
            Number(
              item.substitute_coach_id
              ||
              item.coach_id
              ||
              0
            );


          return (
            canShow
            &&
            actualCoachId ===
              Number(
                currentCoach.id
              )
          );

        }
      );


  /*
    Lấy đủ tên học viên
    cho từng buổi nhóm
  */

  await Promise.all(

    cleanRows.map(
      async item => {

        if (
          !item.training_group_id
        ) {
          return;
        }


        const {
          data: participantData,
          error: participantError
        } =
          await sb.rpc(
            "coach_get_session_participants",
            {
              p_session_id:
                item.id
            }
          );


        if (participantError) {

          console.error(
            "Không tải được thành viên buổi nhóm:",
            item.id,
            participantError
          );

          return;
        }


        const participantRows =
          Array.isArray(
            participantData
          )
            ?
            participantData
            :
            (
              Array.isArray(
                participantData?.participants
              )
                ?
                participantData.participants
                :
                []
            );


        const names =
          [
            ...new Set(

              participantRows
                .map(
                  row => {

                    const student =
                      one(
                        row.students
                        ||
                        row.student
                      );


                    return (
                      row.full_name
                      ||
                      row.student_name
                      ||
                      row.student_full_name
                      ||
                      student?.full_name
                      ||
                      row.student_code
                      ||
                      student?.student_code
                      ||
                      ""
                    );

                  }
                )
                .filter(Boolean)

            )
          ];


        if (
          names.length === 0
        ) {
          return;
        }


        const groupName =
          names.join(
            " + "
          );


        item.group_student_text =
          groupName;


        let registration =
          one(
            item.registrations
          );


        /*
          Bảo đảm renderSessions()
          hiện tên nhóm thay vì
          chỉ học viên gốc.
        */

        if (!registration) {

          item.registrations = [
            {
              students: [
                {
                  full_name:
                    groupName,

                  student_code:
                    ""
                }
              ]
            }
          ];

          return;
        }


        let student =
          one(
            registration.students
          );


        if (!student) {

          registration.students = [
            {
              full_name:
                groupName,

              student_code:
                ""
            }
          ];

          return;
        }


        student.full_name =
          groupName;

      }
    )

  );


  /*
    Ghi đè lại danh sách dùng chung
    của coach-sessions.js
  */

  sessions =
    sortCoachSessions(
      cleanRows
    );


  renderSessions(
    sessions
  );


  console.log(
    "PickDee Coach group sessions:",
    sessions
  );

})();
</script>

<!-- =====================================
     JS HIỂN THỊ AVATAR COACH
====================================== -->

<script>
(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const avatarSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const avatarImage =
    document.getElementById(
      "coachAvatarImage"
    );

  const avatarPlaceholder =
    document.getElementById(
      "coachAvatarPlaceholder"
    );


  async function showCoachAvatar(path) {

    if (!path) {

      avatarImage.style.display =
        "none";

      avatarPlaceholder.style.display =
        "block";

      return;
    }


    const {
      data,
      error
    } =
      await avatarSb
        .storage
        .from("profile-photos")
        .createSignedUrl(
          path,
          3600
        );


    if (
      error ||
      !data?.signedUrl
    ) {

      console.error(
        "Không tải được ảnh Coach:",
        error
      );

      avatarImage.style.display =
        "none";

      avatarPlaceholder.style.display =
        "block";

      return;
    }


    avatarImage.src =
      data.signedUrl +
      "&t=" +
      Date.now();


    avatarImage.onload =
      function () {

        avatarPlaceholder.style.display =
          "none";

        avatarImage.style.display =
          "block";

      };


    avatarImage.onerror =
      function () {

        avatarImage.style.display =
          "none";

        avatarPlaceholder.style.display =
          "block";

      };
  }


  const {
    data: { session }
  } =
    await avatarSb.auth.getSession();


  if (!session) {
    return;
  }


  const {
    data: avatarPath,
    error: avatarError
  } =
    await avatarSb.rpc(
      "get_my_coach_avatar"
    );


  if (avatarError) {

    console.error(
      "Không lấy được avatar Coach:",
      avatarError
    );

    return;
  }


  await showCoachAvatar(
    avatarPath || null
  );

})();
</script>
