<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>
    Cập nhật hồ sơ Coach | PickDee Academy
  </title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js?v=20261019-keep30"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      min-height: 68px;

      padding:
        14px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid
        rgba(255,255,255,.1);
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      color: #d8ff45;

      text-decoration: none;

      font-size: 13px;
      font-weight: 900;
    }

    .container {
      width:
        min(
          760px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        35px 0 70px;
    }

    .eyebrow {
      color: #d8ff45;

      font-size: 12px;
      font-weight: 900;
    }

    h1 {
      margin:
        7px 0 8px;

      font-size:
        clamp(
          28px,
          6vw,
          42px
        );
    }

    .sub {
      margin:
        0 0 25px;

      color:
        rgba(255,255,255,.6);

      line-height: 1.6;
    }

    .card {
      padding: 22px;

      border-radius: 18px;

      background:
        rgba(6,39,88,.78);

      border:
        1px solid
        rgba(255,255,255,.12);
    }

    .coach-head {
      margin-bottom: 22px;

      padding-bottom: 18px;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);
    }

    .coach-name {
      margin-bottom: 6px;

      font-size: 24px;
      font-weight: 900;
    }

    .coach-meta {
      color:
        rgba(255,255,255,.6);

      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      margin-top: 18px;

      display: grid;

      gap: 8px;
    }

    label {
      font-size: 12px;
      font-weight: 900;

      color:
        rgba(255,255,255,.67);
    }

    input,
    textarea {
      width: 100%;

      padding:
        13px 14px;

      border-radius: 11px;

      border:
        1px solid
        rgba(255,255,255,.15);

      outline: none;

      background: #081c3b;

      color: white;

      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;

      resize: vertical;

      line-height: 1.55;
    }

    input:focus,
    textarea:focus {
      border-color:
        rgba(216,255,69,.75);

      box-shadow:
        0 0 0 3px
        rgba(216,255,69,.08);
    }

    .save-btn {
      width: 100%;

      min-height: 50px;

      margin-top: 22px;

      border: 0;

      border-radius: 11px;

      background: #d8ff45;

      color: #06152c;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;

      min-height: 22px;

      font-size: 13px;
      font-weight: 800;
    }

    .message.ok {
      color: #d8ff45;
    }

    .message.error {
      color: #ff9b9b;
    }

  </style>

<!-- App PickDee Admin: thêm vào Màn hình chính → mở như app, không thanh trình duyệt -->
<link rel="manifest" href="/admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PD Admin">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>


<body>


<header class="topbar">

  <div class="brand">

    PickDee
    <span>
      Academy
    </span>

  </div>


  <a
    class="back"
    href="./admin"
  >
    ← ADMIN
  </a>

</header>


<main class="container">

  <div class="eyebrow">
    ADMIN · HỒ SƠ COACH
  </div>

  <h1>
    CẬP NHẬT HỒ SƠ PUBLIC
  </h1>

  <p class="sub">
    Thông tin tại đây có thể hiển thị
    cho khách khi xem hồ sơ Coach.
    Không bao gồm email hoặc số điện thoại.
  </p>


  <section class="card">

    <div class="coach-head">

      <div
        id="coachName"
        class="coach-name"
      >
        Đang tải...
      </div>

      <div
        id="coachMeta"
        class="coach-meta"
      >
      </div>

    </div>


    <div class="field">

      <label for="pickleballLevel">
        TRÌNH ĐỘ PICKLEBALL
      </label>

      <input
        id="pickleballLevel"
        type="text"
        placeholder="Ví dụ: 4.0"
      >

    </div>


    <div class="field">

      <label for="qualifications">
        BẰNG CẤP / CHỨNG CHỈ
      </label>

      <textarea
        id="qualifications"
        placeholder="Ví dụ: Chứng chỉ HLV Pickleball..., chứng nhận đào tạo..."
      ></textarea>

    </div>


    <button
      id="saveBtn"
      class="save-btn"
      type="button"
    >
      LƯU HỒ SƠ COACH
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </section>

</main>


<script>

(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};


  const coachName =
    document.getElementById(
      "coachName"
    );

  const coachMeta =
    document.getElementById(
      "coachMeta"
    );

  const pickleballLevel =
    document.getElementById(
      "pickleballLevel"
    );

  const qualifications =
    document.getElementById(
      "qualifications"
    );

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );

  const message =
    document.getElementById(
      "message"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    message.textContent =
      "Không tải được hệ thống PickDee Academy.";

    message.className =
      "message error";

    return;

  }


  const sb =
    window.PICKDEE_SUPABASE
    ||
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const coachId =
    Number(
      params.get("id")
    );


  if (
    !Number.isInteger(coachId)
    ||
    coachId <= 0
  ) {

    message.textContent =
      "Không tìm thấy ID Coach.";

    message.className =
      "message error";

    saveBtn.disabled =
      true;

    return;

  }


  const {
    data: {
      session
    },
    error:
      sessionError
  } =
    await sb.auth.getSession();


  if (
    sessionError
    ||
    !session
  ) {

    window.location.href =
      "./";

    return;

  }


  const {
    data: profile,
    error:
      profileError
  } =
    await sb
      .from("profiles")
      .select("role")
      .eq(
        "id",
        session.user.id
      )
      .maybeSingle();


  if (
    profileError
    ||
    profile?.role !== "admin"
  ) {

    window.location.href =
      "./";

    return;

  }


  async function loadCoach() {

    message.textContent =
      "";


    const {
      data,
      error
    } =
      await sb.rpc(
        "admin_get_coach_public_profile",
        {
          p_coach_id:
            coachId
        }
      );


    if (error) {

      console.error(error);

      message.textContent =
        error.message
        ||
        "Không tải được Coach.";

      message.className =
        "message error";

      return;

    }


    const coach =
      Array.isArray(data)
        ?
          data[0]
        :
          null;


    if (!coach) {

      message.textContent =
        "Không tìm thấy Coach.";

      message.className =
        "message error";

      saveBtn.disabled =
        true;

      return;

    }


    coachName.textContent =
      coach.full_name
      ||
      "Coach PickDee";


    coachMeta.textContent =
      [
        coach.coach_code,
        coach.preferred_ward,
        coach.preferred_area
      ]
        .filter(Boolean)
        .join(" · ");


    pickleballLevel.value =
      coach.pickleball_level
      ||
      "";


    qualifications.value =
      coach.qualifications
      ||
      "";

  }


  saveBtn.addEventListener(
    "click",
    async function () {

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "ĐANG LƯU...";

      message.textContent =
        "";


      const {
        data,
        error
      } =
        await sb.rpc(
          "admin_update_coach_public_profile",
          {
            p_coach_id:
              coachId,

            p_pickleball_level:
              pickleballLevel.value,

            p_qualifications:
              qualifications.value
          }
        );


      if (error) {

        console.error(error);

        message.textContent =
          error.message
          ||
          "Không lưu được hồ sơ Coach.";

        message.className =
          "message error";

      }
      else {

        message.textContent =
          "✓ Đã cập nhật hồ sơ Coach.";

        message.className =
          "message ok";

      }


      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "LƯU HỒ SƠ COACH";

    }
  );


  await loadCoach();

})();

</script>


<script src="/academy-admin-appnav.js?v=20261016-1"></script>
<script src="/pd-app.js?v=20261020-3"></script>
</body>

</html>
