  function normalise(value) {

    return String(
      value || ""
    )
      .trim()
      .toLowerCase();

  }
function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

  function lessonStatus(
    index,
    completed
  ) {

    const lessonNo =
      index + 1;

    if (
      lessonNo <= completed
    ) {

      return {
        className:
          "lesson done",

        label:
          "✓ ĐÃ HỌC"
      };

    }


    if (
      lessonNo === completed + 1
    ) {

      return {
        className:
          "lesson current",

        label:
          "BUỔI TIẾP THEO"
      };

    }


    return {
      className:
        "lesson",

      label:
        "CHƯA HỌC"
    };

  }


  function renderFixedProgram(
    lessons,
    completed
  ) {

    lessonList.className =
      "lesson-list";

    lessonList.innerHTML =
      lessons
        .map(
          (lesson,index) => {

            const status =
              lessonStatus(
                index,
                completed
              );

            return `
              <div class="${status.className}">

                <div class="lesson-head">

                  <div class="lesson-title">
                    ${lesson.title}
                  </div>

                  <div class="lesson-status">
                    ${status.label}
                  </div>

                </div>

                <div class="lesson-body">
                  ${lesson.text}
                </div>

              </div>
            `;

          }
        )
        .join("");

  }


 function renderCustomProgram(
  purchased,
  completed,
  learningGoal
) {

  const remaining =
    Math.max(
      purchased - completed,
      0
    );

  const goal =
    String(
      learningGoal || ""
    ).trim();

  lessonList.className =
    "";

  lessonList.innerHTML = `
    <div class="lesson custom-program">

      <h3>
        Chương trình theo nhu cầu
      </h3>

      <p>
        Với chương trình này, Coach sẽ điều chỉnh
        nội dung theo mục tiêu thực tế của học viên.
      </p>

      <div
        style="
          margin:18px 0;
          padding:16px;
          border-radius:14px;
          background:rgba(216,255,69,.08);
          border:1px solid rgba(216,255,69,.28);
        "
      >

        <div
          style="
            color:#d8ff45;
            font-size:13px;
            font-weight:900;
            margin-bottom:8px;
          "
        >
          🎯 MỤC TIÊU HIỆN TẠI
        </div>

        <div
          style="
            font-size:16px;
            font-weight:700;
            line-height:1.6;
          "
        >
          ${
            goal
              ? escapeHtml(goal)
              : "Admin chưa cập nhật mục tiêu học."
          }
        </div>

      </div>

      <p>
        Coach có thể tập trung vào các nội dung
        như forehand / backhand, dink, volley,
        reset, serve & return, footwork,
        chiến thuật đánh đôi hoặc sửa các điểm yếu cụ thể.
      </p>

      <p>
        <b>Đã hoàn thành:</b>
        ${completed} buổi
        <br>

        <b>Còn lại:</b>
        ${remaining} buổi
      </p>

    </div>
  `;

}

   


  const {
    data: { session },
    error: sessionError
  } =
    await sb.auth.getSession();


  if (
    sessionError
    ||
    !session
  ) {

    window.location.href =
      "/login";

    return;

  }


  const {
    data: studentId,
    error: studentError
  } =
    await sb.rpc(
      "current_student_id"
    );


  if (
    studentError
    ||
    !studentId
  ) {

    programTitle.textContent =
      "Không xác định được học viên";

    programSub.textContent =
      "Vui lòng đăng nhập lại.";

    return;

  }


  const {
    data: registrations,
    error: registrationError
  } =
    await sb
      .from("registrations")
      .select(`
        id,
        registration_code,
        package_name,
        purchased_sessions,
        learning_goal,
        start_date,
        end_date,
        status
      `)
      .eq(
        "student_id",
        Number(studentId)
      );


  if (registrationError) {

    console.error(
      registrationError
    );

    programTitle.textContent =
      "Không tải được lộ trình";

    programSub.textContent =
      "Có lỗi khi tải thông tin gói học.";

    return;

  }


  const rows =
    registrations || [];


  if (
    rows.length === 0
  ) {

    programTitle.textContent =
      "Chưa có gói học";

    programSub.textContent =
      "Bạn chưa có đăng ký học tại PickDee Academy.";

    progressText.textContent =
      "0 / 0 buổi";

    progressBar.style.width =
      "0%";

    lessonList.innerHTML =
      "";

    return;

  }


  const approved =
    rows
      .filter(
        item =>
          normalise(
            item.status
          )
          ===
          normalise(
            "Đã duyệt"
          )
      )
      .sort(
        (a,b) =>
          String(
            b.start_date || ""
          )
          .localeCompare(
            String(
              a.start_date || ""
            )
          )
      );


  const registration =
    approved[0]
    ||
    rows[0];


  const {
    data: sessions,
    error: sessionsError
  } =
    await sb
      .from("class_sessions")
      .select(`
        id,
        registration_id,
        session_no,
        status
      `)
      .eq(
        "registration_id",
        Number(
          registration.id
        )
      );


  const sessionRows =
    sessionsError
    ?
    []
    :
    (
      sessions || []
    );


  const completed =
    sessionRows
      .filter(
        item =>
          normalise(
            item.status
          )
          ===
          normalise(
            "Đã hoàn thành"
          )
      )
      .length;


  const purchased =
    Number(
      registration.purchased_sessions
      ||
      0
    );


  const packageName =
    String(
      registration.package_name
      ||
      ""
    );


  const packageKey =
    normalise(
      packageName
    );


  programTitle.textContent =
    packageName
    ||
    "Gói học của bạn";


  programSub.textContent =
    registration.registration_code
    ?
    `Mã đăng ký: ${registration.registration_code}`
    :
    "PickDee Academy";


  progressText.textContent =
    `${completed} / ${purchased} buổi`;


  const progressPercent =
    purchased > 0
    ?
    Math.min(
      100,
      Math.round(
        (
          completed
          /
          purchased
        )
        *
        100
      )
    )
    :
    0;


  progressBar.style.width =
    `${progressPercent}%`;


  if (
    packageKey.includes(
      "nâng cao"
    )
  ) {

    renderFixedProgram(
      ADVANCED_PROGRAM,
      completed
    );

    message.textContent =
      "Lộ trình Nâng cao gồm 12 buổi. Coach có thể điều chỉnh một phần nội dung theo tình hình thực tế.";

  }
  else if (
    packageKey.includes(
      "cơ bản"
    )
  ) {

    renderFixedProgram(
      BASIC_PROGRAM,
      completed
    );

    message.textContent =
      "Lộ trình Cơ bản gồm 12 buổi. Coach có thể điều chỉnh một phần nội dung theo tình hình thực tế.";

  }
  else {

  renderCustomProgram(
  purchased,
  completed,
  registration.learning_goal
);

    message.textContent =
      "Nội dung chương trình Theo nhu cầu sẽ được Coach điều chỉnh theo mục tiêu của học viên.";

  }

})();

</script>
