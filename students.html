<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Học viên | PickDee Academy</title>

  <style>
    * { box-sizing:border-box; }

    body {
      margin:0;
      background:#09111f;
      color:#fff;
      font-family:Inter,system-ui,-apple-system,sans-serif;
    }

    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 22px;
      border-bottom:1px solid #26364b;
    }

    a {
      color:#b9ff18;
      text-decoration:none;
      font-weight:800;
    }

    main {
      max-width:1180px;
      margin:auto;
      padding:35px 20px;
    }

    h1 {
      margin:8px 0;
      font-size:40px;
    }

    .sub {
      color:#aab6c5;
      margin-bottom:28px;
    }

    .toolbar {
      display:flex;
      gap:12px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    input {
      flex:1;
      min-width:220px;
      height:46px;
      padding:0 14px;
      border-radius:9px;
      border:1px solid #394b62;
      background:#08111d;
      color:#fff;
    }

    button {
      border:0;
      border-radius:9px;
      padding:0 18px;
      height:46px;
      background:#b9ff18;
      color:#08111d;
      font-weight:900;
      cursor:pointer;
    }

    .table-wrap {
      overflow:auto;
      border:1px solid #26364b;
      border-radius:12px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:850px;
    }

    th,td {
      padding:14px;
      border-bottom:1px solid #26364b;
      text-align:left;
    }

    th {
      color:#b9ff18;
      background:#0e1b2d;
    }

    td {
      color:#dfe7ef;
    }

    #empty {
      display:none;
      padding:30px;
      text-align:center;
      color:#aab6c5;
    }

    #message {
      margin:15px 0;
      color:#ffb4b4;
    }
  </style>
</head>

<body>

<header>
  <strong>PickDee Academy</strong>
  <a href="/admin.html">← Trung tâm quản trị</a>
</header>

<main>

  <div style="color:#b9ff18;font-weight:900">
    QUẢN LÝ HỌC VIÊN
  </div>

  <h1>Học viên</h1>

  <p class="sub">
    Danh sách học viên thật của PickDee Academy.
  </p>

 <div class="toolbar">

  <input
    id="search"
    placeholder="Tìm tên, SĐT, email..."
  >

  <button
    onclick="window.location.href='/add-student.html'"
  >
    + THÊM HỌC VIÊN
  </button>

</div>

  <div id="message"></div>

  <div class="table-wrap">

    <table>
      <thead>
        <tr>
          <th>Mã HV</th>
          <th>Họ tên</th>
          <th>SĐT</th>
          <th>Email</th>
          <th>Khu vực</th>
          <th>Xã/Phường</th>
          <th>Trạng thái</th>
        </tr>
      </thead>

      <tbody id="studentRows"></tbody>
    </table>

    <div id="empty">
      Chưa có học viên thật nào.
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="students.js"></script>

</body>
</html>
