<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>
    Học viên của tôi | PickDee Academy
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="./config.js?v=20261019-keep30"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      min-height: 72px;
      padding: 16px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(3,20,45,.75);
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    #userEmail {
      color:
        rgba(255,255,255,.78);

      font-size: 13px;
      font-weight: 700;
    }

    .container {
      width:
        min(
          1100px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        30px 0 60px;
    }

    .back {
      display: inline-block;

      margin-bottom: 24px;

      color: #d8ff45;

      text-decoration: none;

      font-size: 14px;
      font-weight: 900;
    }

    .eyebrow {
      color: #d8ff45;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: .08em;
    }

    h1 {
      margin: 8px 0 8px;

      font-size:
        clamp(
          36px,
          6vw,
          54px
        );
    }

    .subtitle {
      margin-bottom: 24px;

      color:
        rgba(255,255,255,.65);

      line-height: 1.55;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      padding: 16px 18px;

      border:
        1px solid rgba(216,255,69,.25);

      border-radius: 14px;

      background:
        rgba(216,255,69,.06);
    }

    .summary-number {
      color: #d8ff45;

      font-size: 30px;
      font-weight: 900;
    }

    .summary-text {
      color:
        rgba(255,255,255,.75);

      font-size: 13px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 16px;
    }

    .student-card {
      padding: 20px;

      border-radius: 16px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(7,39,84,.78);
    }

    .student-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 16px;
    }

    .student-name {
      color: #d8ff45;

      font-size: 20px;
      font-weight: 900;
    }

    .student-code {
      margin-top: 5px;

      color:
        rgba(255,255,255,.55);

      font-size: 12px;
    }

    .badge {
      padding: 6px 9px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.12);

      color: #d8ff45;

      font-size: 11px;
      font-weight: 900;

      white-space: nowrap;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 9px 0;

      border-bottom:
        1px solid rgba(255,255,255,.07);

      font-size: 13px;
    }

    .info-label {
      color:
        rgba(255,255,255,.50);
    }

    .info-value {
      text-align: right;

      color:
        rgba(255,255,255,.90);

      font-weight: 800;
    }

    .session-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap: 8px;

      margin-top: 16px;
    }

    .session-box {
      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.055);
    }

    .session-label {
      color:
        rgba(255,255,255,.48);

      font-size: 10px;
    }

    .session-value {
      margin-top: 5px;

      color: #d8ff45;

      font-size: 19px;
      font-weight: 900;
    }

    .phone {
      color: #d8ff45;

      text-decoration: none;

      font-weight: 900;
    }

    /* =====================================================
       PICKDEE ACADEMY SKILL
    ====================================================== */

    .skill-panel {
      margin-top: 16px;

      padding: 14px;

      border-radius: 12px;

      border:
        1px solid rgba(216,255,69,.18);

      background:
        rgba(216,255,69,.045);
    }

    .skill-panel-title {
      margin-bottom: 10px;

      color: #d8ff45;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: .04em;
    }

    .skill-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 8px;
    }

    .skill-box {
      padding: 10px;

      border-radius: 9px;

      background:
        rgba(0,0,0,.12);
    }

    .skill-label {
      color:
        rgba(255,255,255,.45);

      font-size: 9px;

      line-height: 1.35;
    }

    .skill-value {
      margin-top: 5px;

      color: #d8ff45;

      font-size: 15px;
      font-weight: 900;

      line-height: 1.3;
    }

    .skill-value.external {
      color: #fff;
    }

    .skill-empty {
      color:
        rgba(255,255,255,.52);

      font-size: 12px;

      line-height: 1.5;
    }

    .skill-history-link {
      display: inline-block;

      margin-top: 11px;

      color: #d8ff45;

      text-decoration: none;

      font-size: 10px;
      font-weight: 900;
    }

    #message {
      margin-bottom: 18px;

      color:
        rgba(255,255,255,.65);
    }

    .error {
      color: #ffabab !important;
    }

    .empty {
      padding: 35px;

      border-radius: 15px;

      border:
        1px dashed rgba(255,255,255,.16);

      color:
        rgba(255,255,255,.55);

      text-align: center;
    }

    @media(max-width:760px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding:
          14px 16px;
      }

      #userEmail {
        display: none;
      }

    }

  </style>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>


<body>


<header class="topbar">

  <div class="brand">
    PickDee<span>Academy</span>
  </div>

  <div id="userEmail"></div>

</header>


<main class="container">

  <a
    href="./coach"
    class="back"
  >
    ← Khu vực Coach
  </a>


  <div class="eyebrow">
    HỌC VIÊN CỦA TÔI
  </div>


  <h1>
    Học viên đang phụ trách
  </h1>


  <div class="subtitle">
    Danh sách học viên được phân công cho Coach.
    Bạn chỉ xem được học viên thuộc phạm vi phụ trách của mình.
  </div>


  <div class="summary">

    <div
      id="studentCount"
      class="summary-number"
    >
      0
    </div>

    <div class="summary-text">
      học viên đang được phân công
    </div>

  </div>


  <div id="message">
    Đang tải danh sách học viên...
  </div>


  <section
    id="studentGrid"
    class="grid"
  ></section>


</main>


<script>

(async function () {


  const cfg =
    window.PICKDEE_CONFIG || {};


  const message =
    document.getElementById(
      "message"
    );


  const studentGrid =
    document.getElementById(
      "studentGrid"
    );


  const studentCount =
    document.getElementById(
      "studentCount"
    );


  const userEmail =
    document.getElementById(
      "userEmail"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    message.textContent =
      "Không tải được cấu hình Supabase.";

    message.classList.add(
      "error"
    );

    return;
  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatDate(value) {

    if (!value) {
      return "—";
    }

    try {

      return new Intl.DateTimeFormat(
        "vi-VN"
      ).format(
        new Date(
          `${value}T00:00:00`
        )
      );

    }
    catch (_) {

      return value;

    }

  }


  /*
    =====================================================
    1. KIỂM TRA ĐĂNG NHẬP
    =====================================================
  */

  const {
    data: userData,
    error: userError
  } =
    await sb.auth.getUser();


  if (
    userError
    ||
    !userData?.user
  ) {

    window.location.replace(
      "./?v=login"
    );

    return;
  }


  const user =
    userData.user;


  userEmail.textContent =
    user.email || "";


  /*
    =====================================================
    2. KIỂM TRA ROLE COACH
    =====================================================
  */

  const {
    data: profile,
    error: profileError
  } =
    await sb
      .from(
        "profiles"
      )
      .select(
        "role"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (
    profileError
    ||
    !profile
    ||
    String(
      profile.role || ""
    )
      .trim()
      .toLowerCase()
    !==
      "coach"
  ) {

    window.location.replace(
      "./"
    );

    return;
  }


  /*
    =====================================================
    3. TÌM COACH HIỆN TẠI
    =====================================================
  */

  const {
    data: coach,
    error: coachError
  } =
    await sb
      .from(
        "coaches"
      )
      .select(`
        id,
        coach_code,
        full_name
      `)
      .eq(
        "auth_user_id",
        user.id
      )
      .maybeSingle();


  if (
    coachError
    ||
    !coach
  ) {

    console.error(
      "Coach:",
      coachError
    );

    message.textContent =
      "Không xác định được hồ sơ Coach.";

    message.classList.add(
      "error"
    );

    return;
  }


  /*
    =====================================================
    4. ĐĂNG KÝ ĐÃ GÁN CHO COACH
    =====================================================
  */

 const {
  data: registrationsData,
  error: registrationsError
} =
  await sb
    .from(
      "registrations"
    )
    .select(`
      id,
      registration_code,
      student_id,
      package_name,
      purchased_sessions,
      start_date,
      end_date,
      status,
      is_test
    `)
    .eq(
      "coach_id",
      coach.id
    )
    .eq(
      "status",
      "Đã duyệt"
    )
    .or(
      "is_test.is.null,is_test.eq.false"
    )
    .order(
      "id",
      {
        ascending: false
      }
    );

  if (
    registrationsError
  ) {

    console.error(
      "Registrations:",
      registrationsError
    );

    message.textContent =
      "Không tải được đăng ký học.";

    message.classList.add(
      "error"
    );

    return;
  }


  const registrations =
    registrationsData || [];


  if (
    registrations.length === 0
  ) {

    studentCount.textContent =
      "0";

    message.textContent =
      "";

    studentGrid.innerHTML =
      `
        <div class="empty">
          Hiện chưa có học viên nào được phân công cho bạn.
        </div>
      `;

    return;
  }


  /*
    =====================================================
    5. LẤY HỒ SƠ HỌC VIÊN
    =====================================================
  */

  const studentIds =
    [
      ...new Set(
        registrations
          .map(
            row =>
              Number(
                row.student_id
              )
          )
          .filter(
            Boolean
          )
      )
    ];


  const {
    data: studentsData,
    error: studentsError
  } =
    await sb
      .from(
        "students"
      )
      .select(`
        id,
        student_code,
        full_name,
        phone,
        email,
        preferred_area,
        preferred_ward,
        status
      `)
      .in(
        "id",
        studentIds
      );


  if (
    studentsError
  ) {

    console.error(
      "Students:",
      studentsError
    );

    message.textContent =
      "Không tải được hồ sơ học viên.";

    message.classList.add(
      "error"
    );

    return;
  }


  const students =
    studentsData || [];


  /*
    =====================================================
    6. ĐẾM BUỔI ĐÃ HOÀN THÀNH
    =====================================================
  */

  const registrationIds =
    registrations.map(
      row =>
        Number(
          row.id
        )
    );


  const {
    data: sessionsData,
    error: sessionsError
  } =
    await sb
      .from(
        "class_sessions"
      )
      .select(`
        registration_id,
        status
      `)
      .in(
        "registration_id",
        registrationIds
      );


  if (
    sessionsError
  ) {

    console.error(
      "Sessions:",
      sessionsError
    );

  }


  const completedMap =
    new Map();


  (
    sessionsData || []
  )
    .filter(
      row =>
        row.status
        ===
        "Đã hoàn thành"
    )
    .forEach(
      row => {

        const id =
          Number(
            row.registration_id
          );


        completedMap.set(
          id,
          (
            completedMap.get(
              id
            )
            ||
            0
          )
          +
          1
        );

      }
    );


  /*
    =====================================================
    7. LẤY TRÌNH PICKDEE ACADEMY MỚI NHẤT
    =====================================================
  */

  const {
    data: skillNotesData,
    error: skillNotesError
  } =
    await sb
      .from(
        "coach_student_notes"
      )
      .select(`
        id,
        registration_id,
        skill_score,
        skill_level,
        sportconnect_reference,
        dupr_reference,
        created_at
      `)
      .in(
        "registration_id",
        registrationIds
      )
      .not(
        "skill_score",
        "is",
        null
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (
    skillNotesError
  ) {

    console.error(
      "Skill notes:",
      skillNotesError
    );

  }


  const latestSkillByRegistration =
    new Map();


  (
    skillNotesData || []
  )
    .forEach(
      note => {

        const id =
          Number(
            note.registration_id
          );


        /*
          Vì dữ liệu đã sort created_at DESC,
          bản đầu tiên của mỗi registration
          chính là bản đánh giá mới nhất.
        */

        if (
          !latestSkillByRegistration.has(
            id
          )
        ) {

          latestSkillByRegistration.set(
            id,
            note
          );

        }

      }
    );


  /*
    =====================================================
    8. GHÉP DỮ LIỆU
    - mỗi học viên chỉ hiện 1 lần
    - dùng registration mới nhất của học viên
    =====================================================
  */

  const registrationByStudent =
    new Map();


  registrations.forEach(
    row => {

      const studentId =
        Number(
          row.student_id
        );


      if (
        !registrationByStudent.has(
          studentId
        )
      ) {

        registrationByStudent.set(
          studentId,
          row
        );

      }

    }
  );


  const rows =
    students
      .map(
        student => {

          const registration =
            registrationByStudent.get(
              Number(
                student.id
              )
            );


          if (!registration) {
            return null;
          }


          const total =
            Number(
              registration
                .purchased_sessions
              ||
              0
            );


          const completed =
            completedMap.get(
              Number(
                registration.id
              )
            )
            ||
            0;


          const remaining =
            Math.max(
              total
              -
              completed,
              0
            );


          const skill =
            latestSkillByRegistration.get(
              Number(
                registration.id
              )
            )
            ||
            null;


          return {
            student,
            registration,
            total,
            completed,
            remaining,
            skill
          };

        }
      )
      .filter(
        Boolean
      );


  /*
    =====================================================
    9. RENDER
    =====================================================
  */

  studentCount.textContent =
    rows.length;


  message.textContent =
    rows.length
      ?
      `✓ Đã tải ${rows.length} học viên.`
      :
      "";


  if (
    rows.length === 0
  ) {

    studentGrid.innerHTML =
      `
        <div class="empty">
          Hiện chưa có học viên nào được phân công cho bạn.
        </div>
      `;

    return;
  }


  studentGrid.innerHTML =
    rows
      .map(
        item => {

          const student =
            item.student;


          const registration =
            item.registration;


          const skill =
            item.skill;


          const phone =
            String(
              student.phone || ""
            )
              .trim();


          return `
            <article class="student-card">

              <div class="student-head">

                <div>

                  <a
                    href="./coach-student-detail?registration_id=${encodeURIComponent(
                      registration.id
                    )}"
                    class="student-name"
                    style="
                      display:inline-block;
                      color:#d8ff45;
                      text-decoration:none;
                      cursor:pointer;
                    "
                  >
                    ${escapeHtml(
                      student.full_name
                      ||
                      "Học viên"
                    )}
                  </a>

                  <div class="student-code">
                    ${escapeHtml(
                      student.student_code
                      ||
                      "—"
                    )}
                  </div>

                  <a
                    href="./coach-student-detail?registration_id=${encodeURIComponent(
                      registration.id
                    )}"
                    style="
                      display:inline-flex;
                      align-items:center;
                      justify-content:center;
                      margin-top:10px;
                      padding:7px 11px;
                      border-radius:8px;
                      border:1px solid rgba(216,255,69,.28);
                      background:rgba(216,255,69,.08);
                      color:#d8ff45;
                      text-decoration:none;
                      font-size:11px;
                      font-weight:900;
                    "
                  >
                    XEM CHI TIẾT →
                  </a>

                </div>

                <div class="badge">
                  ${escapeHtml(
                    registration.status
                    ||
                    "Đang học"
                  )}
                </div>

              </div>


              <div class="info-row">

                <span class="info-label">
                  SĐT
                </span>

                <span class="info-value">

                  ${
                    phone
                      ?
                      `
                        <a
                          class="phone"
                          href="tel:${escapeHtml(
                            phone
                          )}"
                        >
                          ${escapeHtml(
                            phone
                          )}
                        </a>
                      `
                      :
                      "—"
                  }

                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  Gói học
                </span>

                <span class="info-value">
                  ${escapeHtml(
                    registration.package_name
                    ||
                    "—"
                  )}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  Mã đăng ký
                </span>

                <span class="info-value">
                  ${escapeHtml(
                    registration.registration_code
                    ||
                    "—"
                  )}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  Bắt đầu
                </span>

                <span class="info-value">
                  ${escapeHtml(
                    formatDate(
                      registration.start_date
                    )
                  )}
                </span>

              </div>


              <div class="info-row">

                <span class="info-label">
                  Kết thúc
                </span>

                <span class="info-value">
                  ${escapeHtml(
                    formatDate(
                      registration.end_date
                    )
                  )}
                </span>

              </div>


              <div class="session-grid">

                <div class="session-box">

                  <div class="session-label">
                    Tổng buổi
                  </div>

                  <div class="session-value">
                    ${item.total}
                  </div>

                </div>


                <div class="session-box">

                  <div class="session-label">
                    Đã học
                  </div>

                  <div class="session-value">
                    ${item.completed}
                  </div>

                </div>


                <div class="session-box">

                  <div class="session-label">
                    Còn lại
                  </div>

                  <div class="session-value">
                    ${item.remaining}
                  </div>

                </div>

              </div>


              <!-- =========================================
                   TRÌNH PICKDEE ACADEMY
              ========================================== -->

              <div class="skill-panel">

                <div class="skill-panel-title">
                  🎯 TRÌNH ĐỘ HỌC VIÊN
                </div>


                ${
                  skill
                  ?
                  `

                    <div class="skill-grid">


                      <div class="skill-box">

                        <div class="skill-label">
                          ĐIỂM KỸ THUẬT PICKDEE ACADEMY
                        </div>

                        <div class="skill-value">
                          ${escapeHtml(
                            skill.skill_score
                          )} / 100
                        </div>

                      </div>


                      <div class="skill-box">

                        <div class="skill-label">
                          TRÌNH PICKDEE ACADEMY
                        </div>

                        <div class="skill-value">
                          ${escapeHtml(
                            skill.skill_level
                            ||
                            "Chưa chấm"
                          )}
                        </div>

                      </div>


                      <div class="skill-box">

                        <div class="skill-label">
                          SPORTCONNECT THAM CHIẾU
                        </div>

                        <div class="skill-value external">
                          ${escapeHtml(
                            skill.sportconnect_reference
                            ||
                            "Chưa có"
                          )}
                        </div>

                      </div>


                      <div class="skill-box">

                        <div class="skill-label">
                          DUPR THAM CHIẾU
                        </div>

                        <div class="skill-value external">
                          ${escapeHtml(
                            skill.dupr_reference
                            ||
                            "Chưa có"
                          )}
                        </div>

                      </div>


                    </div>


                    <a
                      class="skill-history-link"
                      href="./coach-student-notes?registration_id=${encodeURIComponent(
                        registration.id
                      )}"
                    >
                      XEM LỊCH SỬ ĐÁNH GIÁ →
                    </a>

                  `
                  :
                  `

                    <div class="skill-empty">
                      Học viên chưa có đánh giá trình PickDee Academy.
                    </div>

                    <a
                      class="skill-history-link"
                      href="./coach-student-notes?registration_id=${encodeURIComponent(
                        registration.id
                      )}"
                    >
                      CHẤM TRÌNH →
                    </a>

                  `
                }

              </div>


            </article>
          `;

        }
      )
      .join("");


})();

</script>

<script>
/* =========================================================
   PICKDEE ACADEMY
   NHẮC CHẤM TRÌNH CUỐI KHÓA
   - Cơ bản
   - Nâng cao
   - Không áp dụng Theo yêu cầu
========================================================= */

(async function () {

  /* =====================================================
     STYLE
  ====================================================== */

  const style =
    document.createElement(
      "style"
    );


  style.textContent =
    `
      .final-assessment-panel {
        margin-top: 14px;
        padding: 13px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,.11);
        background: rgba(0,0,0,.10);
      }

      .final-assessment-panel.not-due {
        border-color: rgba(255,255,255,.10);
      }

      .final-assessment-panel.due {
        border-color: rgba(255,190,60,.48);
        background: rgba(255,170,40,.07);
      }

      .final-assessment-panel.done {
        border-color: rgba(216,255,69,.30);
        background: rgba(216,255,69,.055);
      }

      .final-assessment-title {
        color: rgba(255,255,255,.85);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.45;
      }

      .final-assessment-panel.due
      .final-assessment-title {
        color: #ffd66b;
      }

      .final-assessment-panel.done
      .final-assessment-title {
        color: #d8ff45;
      }

      .final-assessment-text {
        margin-top: 5px;
        color: rgba(255,255,255,.52);
        font-size: 11px;
        line-height: 1.5;
      }

      .final-assessment-btn {
        margin-top: 10px;
        min-height: 36px;
        padding: 0 12px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 8px;

        background: #d8ff45;
        color: #071426;

        text-decoration: none;

        font-size: 11px;
        font-weight: 1000;
      }
    `;


  document.head.appendChild(
    style
  );


  /* =====================================================
     CONFIG
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    console.error(
      "PickDee Academy: thiếu cấu hình Supabase."
    );

    return;

  }


  /*
    Client riêng cho module nhắc cuối khóa.
    Không thay đổi logic chính của coach-students.
  */

  const finalSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     ĐỢI CARD HỌC VIÊN RENDER XONG
  ====================================================== */

  async function waitForStudentCards() {

    for (
      let i = 0;
      i < 80;
      i++
    ) {

      const cards =
        document.querySelectorAll(
          ".student-card"
        );


      if (
        cards.length > 0
      ) {

        return [
          ...cards
        ];

      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );

    }


    return [];

  }


  const cards =
    await waitForStudentCards();


  if (
    cards.length === 0
  ) {

    return;

  }


  /* =====================================================
     LẤY REGISTRATION ID TỪ CARD
  ====================================================== */

  function getRegistrationId(
    card
  ) {

    const link =
      card.querySelector(
        'a[href*="coach-student-detail?registration_id="]'
      );


    if (!link) {

      return null;

    }


    try {

      const url =
        new URL(
          link.getAttribute(
            "href"
          ),
          window.location.href
        );


      const id =
        Number(
          url.searchParams.get(
            "registration_id"
          )
        );


      return Number.isFinite(id)
        ?
        id
        :
        null;

    }
    catch (_) {

      return null;

    }

  }


  const registrationIds =
    [
      ...new Set(
        cards
          .map(
            card =>
              getRegistrationId(
                card
              )
          )
          .filter(Boolean)
      )
    ];


  if (
    registrationIds.length === 0
  ) {

    return;

  }


  /* =====================================================
     LẤY CÁC BẢN CHẤM TRÌNH CUỐI KHÓA ĐÃ CÓ
  ====================================================== */

  const {
    data: finalNotesData,
    error: finalNotesError
  } =
    await finalSb
      .from(
        "coach_student_notes"
      )
      .select(`
        registration_id,
        is_course_final,
        course_final_session_count,
        created_at
      `)
      .in(
        "registration_id",
        registrationIds
      )
      .eq(
        "is_course_final",
        true
      );


  if (
    finalNotesError
  ) {

    console.error(
      "PickDee Academy - final assessment:",
      finalNotesError
    );

    return;

  }


  const finalAssessmentIds =
    new Set(
      (
        finalNotesData || []
      )
        .map(
          row =>
            Number(
              row.registration_id
            )
        )
        .filter(Boolean)
    );


  /* =====================================================
     RPC DANH SÁCH ĐẾN HẠN
  ====================================================== */

  const {
    data: dueData,
    error: dueError
  } =
    await finalSb.rpc(
      "coach_get_students_needing_final_assessment"
    );


  if (
    dueError
  ) {

    console.warn(
      "PickDee Academy - RPC chấm cuối khóa:",
      dueError
    );

  }


  const dueIds =
    new Set(
      (
        Array.isArray(dueData)
          ?
          dueData
          :
          []
      )
        .map(
          row =>
            Number(
              row.registration_id
            )
        )
        .filter(Boolean)
    );


  /* =====================================================
     HELPERS
  ====================================================== */

  function getPackageName(
    card
  ) {

    const rows =
      [
        ...card.querySelectorAll(
          ".info-row"
        )
      ];


    const packageRow =
      rows.find(
        row => {

          const label =
            row.querySelector(
              ".info-label"
            );


          return String(
            label?.textContent || ""
          )
            .trim()
            .toLowerCase()
            ===
            "gói học";

        }
      );


    return String(
      packageRow
        ?.querySelector(
          ".info-value"
        )
        ?.textContent
      ||
      ""
    )
      .trim();

  }


  function getSessionNumber(
    card,
    wantedLabel
  ) {

    const boxes =
      [
        ...card.querySelectorAll(
          ".session-box"
        )
      ];


    const box =
      boxes.find(
        item => {

          const label =
            String(
              item
                .querySelector(
                  ".session-label"
                )
                ?.textContent
              ||
              ""
            )
              .trim()
              .toLowerCase();


          return label
            ===
            wantedLabel
              .trim()
              .toLowerCase();

        }
      );


    if (!box) {

      return 0;

    }


    const value =
      Number(
        String(
          box
            .querySelector(
              ".session-value"
            )
            ?.textContent
          ||
          "0"
        )
          .trim()
      );


    return Number.isFinite(value)
      ?
      value
      :
      0;

  }


  function normalizeText(
    value
  ) {

    return String(
      value || ""
    )
      .trim()
      .toLowerCase();

  }


  /* =====================================================
     RENDER TỪNG CARD
  ====================================================== */

  cards.forEach(
    card => {

      const registrationId =
        getRegistrationId(
          card
        );


      if (!registrationId) {

        return;

      }


      const packageName =
        getPackageName(
          card
        );


      const normalizedPackage =
        normalizeText(
          packageName
        );


      /*
        Theo yêu cầu:
        hiện tại KHÔNG tự nhắc chấm trình.
      */

      const isCustomPackage =
        normalizedPackage.includes(
          "theo yêu cầu"
        );


      const isBasic =
        normalizedPackage.includes(
          "cơ bản"
        );


      const isAdvanced =
        normalizedPackage.includes(
          "nâng cao"
        );


      if (
        isCustomPackage
        ||
        (
          !isBasic
          &&
          !isAdvanced
        )
      ) {

        return;

      }


      const total =
        getSessionNumber(
          card,
          "Tổng buổi"
        );


      const completed =
        getSessionNumber(
          card,
          "Đã học"
        );


      /*
        Dữ liệu gói cũ có thể total = 0.
        Không sinh cảnh báo cho dữ liệu chưa đủ.
      */

      if (
        total <= 0
      ) {

        return;

      }


      const finalDone =
        finalAssessmentIds.has(
          registrationId
        );


      /*
        RPC là nguồn chính.

        Nếu RPC lỗi thì fallback:
        đủ số buổi + chưa chấm cuối khóa
        = đến hạn.
      */

      const finalDue =
        dueError
          ?
          (
            completed >= total
            &&
            !finalDone
          )
          :
          dueIds.has(
            registrationId
          );


      const courseCompleted =
        completed >= total;


      let panelClass =
        "not-due";


      let title =
        "Chưa đến hạn chấm trình";


      let description =
        `Học viên đã hoàn thành ${completed}/${total} buổi. Chấm trình khi kết thúc toàn bộ khóa.`;


      let buttonHtml =
        "";


      if (
        finalDone
      ) {

        panelClass =
          "done";


        title =
          "✓ ĐÃ CHẤM TRÌNH CUỐI KHÓA";


        description =
          `Khóa học đã hoàn thành ${completed}/${total} buổi và đã có đánh giá cuối khóa.`;

      }
      else if (
        finalDue
        ||
        (
          courseCompleted
          &&
          !finalDone
        )
      ) {

        panelClass =
          "due";


        title =
          "⚠ CẦN CHẤM TRÌNH CUỐI KHÓA";


        description =
          `Học viên đã hoàn thành ${completed}/${total} buổi của khóa ${packageName}.`;


        buttonHtml =
          `
            <a
              class="final-assessment-btn"
              href="./coach-student-notes?registration_id=${encodeURIComponent(
                registrationId
              )}&mode=course-final"
            >
              CHẤM TRÌNH CUỐI KHÓA →
            </a>
          `;

      }


      const panel =
        document.createElement(
          "div"
        );


      panel.className =
        `final-assessment-panel ${panelClass}`;


      panel.innerHTML =
        `
          <div class="final-assessment-title">
            ${title}
          </div>

          <div class="final-assessment-text">
            ${description}
          </div>

          ${buttonHtml}
        `;


      /*
        Đặt ngay sau 3 ô:
        Tổng buổi / Đã học / Còn lại
      */

      const sessionGrid =
        card.querySelector(
          ".session-grid"
        );


      if (
        sessionGrid
      ) {

        sessionGrid.insertAdjacentElement(
          "afterend",
          panel
        );

      }

    }
  );


})();

</script>
<script src="./notifications.js?v=20261017-sales1"></script>


<script src="/pd-coach-gate.js?v=20261019-1"></script>
<script src="/pd-app.js?v=20261020-nav1"></script>
</body>
