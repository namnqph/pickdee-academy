<!-- =====================================================
     PICKDEE ACADEMY
     ADMIN TASKS - COACH OPERATIONAL BACKLOG V2
     FINAL CLEAN VERSION
====================================================== -->

<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {
    console.error(
      "PickDee Admin Tasks V2: thiếu cấu hình Supabase."
    );
    return;
  }

  const extraSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     HELPERS
  ====================================================== */

  function esc(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatSimpleDate(value) {

    if (!value) {
      return "—";
    }

    const parts =
      String(value)
        .split("-");

    if (parts.length !== 3) {
      return String(value);
    }

    return (
      parts[2]
      +
      "/"
      +
      parts[1]
      +
      "/"
      +
      parts[0]
    );

  }


  function formatSimpleTime(value) {

    if (!value) {
      return "—";
    }

    return String(value)
      .slice(0, 5);

  }


  /* =====================================================
     TẠO SECTION
  ====================================================== */

  function createSection(
    id,
    title,
    countId,
    bodyId,
    countClass
  ) {

    if (
      document.getElementById(id)
    ) {
      return;
    }

    const main =
      document.querySelector("main");

    if (!main) {
      return;
    }

    const section =
      document.createElement("section");

    section.id =
      id;

    section.className =
      "section";

    section.innerHTML = `

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div
          id="${countId}"
          class="count ${countClass}"
        >
          0
        </div>

      </div>

      <div
        id="${bodyId}"
        class="section-body"
      >

        <div class="empty">
          Đang kiểm tra...
        </div>

      </div>

    `;

    const otherSection =
      document.getElementById(
        "otherSection"
      );

    if (
      otherSection
      &&
      otherSection.parentElement
      ===
      main
    ) {

      main.insertBefore(
        section,
        otherSection
      );

    }
    else {

      main.appendChild(
        section
      );

    }

  }


  function ensureSections() {

    createSection(
      "coachOverdueAttendanceSection",
      "📋 Buổi Coach chưa điểm danh",
      "coachOverdueAttendanceCount",
      "coachOverdueAttendanceBody",
      "red"
    );

    createSection(
      "coachFinalAssessmentSection",
      "🎯 Chấm trình cuối khóa",
      "coachFinalAssessmentCount",
      "coachFinalAssessmentBody",
      "yellow"
    );

  }


  /* =====================================================
     RENDER TỪNG BUỔI CHƯA ĐIỂM DANH
  ====================================================== */

  function renderOverdueSessions(
    sessions
  ) {

    if (
      !Array.isArray(sessions)
      ||
      sessions.length === 0
    ) {

      return `

        <div class="empty">

          ✅ Không có buổi Coach quá giờ
          chưa điểm danh.

        </div>

      `;

    }


    return sessions
      .map(
        function (row) {

          const sessionId =
            Number(
              row.session_id
              ||
              0
            );

          const overdueMinutes =
            Number(
              row.overdue_minutes
              ||
              0
            );


          return `

            <div class="task">


              <div
                class="priority-bar high"
              ></div>


              <div>


                <div class="task-title">

                  ${esc(
                    row.session_code
                    ||
                    "BUỔI HỌC"
                  )}

                  ·

                  ${esc(
                    row.student_name
                    ||
                    "Học viên"
                  )}

                </div>


                <div class="task-meta">

                  Coach:
                  <strong>
                    ${esc(
                      row.coach_name
                      ||
                      "—"
                    )}
                  </strong>

                  ${
                    row.coach_code
                      ?
                      " • "
                      +
                      esc(
                        row.coach_code
                      )
                      :
                      ""
                  }

                  <br>

                  🗓️
                  ${esc(
                    formatSimpleDate(
                      row.session_date
                    )
                  )}

                  •

                  ⏰
                  ${esc(
                    formatSimpleTime(
                      row.start_time
                    )
                  )}

                  <br>

                  ${
                    overdueMinutes > 0
                      ?
                      "Đã quá giờ "
                      +
                      overdueMinutes
                      +
                      " phút và vẫn chưa được điểm danh."
                      :
                      "Buổi học đã quá giờ nhưng chưa được điểm danh."
                  }

                </div>


                <div
                  class="task-priority red"
                >
                  Cần xử lý
                </div>


              </div>


              <a
                class="task-action"
                href="./session-detail?id=${sessionId}"
              >
                XỬ LÝ BUỔI →
              </a>


            </div>

          `;

        }
      )
      .join("");

  }


  /* =====================================================
     RENDER CHẤM TRÌNH CUỐI KHÓA
  ====================================================== */

  function renderFinalAssessments(
    rows
  ) {

    const activeRows =
      (
        Array.isArray(rows)
          ?
          rows
          :
          []
      )
        .filter(
          function (row) {

            return (
              Number(
                row.pending_final_assessments
                ||
                0
              )
              >
              0
            );

          }
        );


    if (
      activeRows.length === 0
    ) {

      return `

        <div class="empty">

          ✅ Không có học viên cần Coach
          chấm trình cuối khóa.

        </div>

      `;

    }


    return activeRows
      .map(
        function (row) {

          const count =
            Number(
              row.pending_final_assessments
              ||
              0
            );


          return `

            <div class="task">


              <div
                class="priority-bar medium"
              ></div>


              <div>


                <div class="task-title">

                  ${esc(
                    row.coach_name
                    ||
                    "Coach"
                  )}

                </div>


                <div class="task-meta">

                  ${esc(
                    row.coach_code
                    ||
                    "—"
                  )}

                  ${
                    row.coach_email
                      ?
                      " • "
                      +
                      esc(
                        row.coach_email
                      )
                      :
                      ""
                  }

                  <br>

                  Có
                  <strong>
                    ${count}
                  </strong>
                  học viên cần chấm trình
                  cuối khóa.

                </div>


                <div
                  class="task-priority yellow"
                >
                  Cần theo dõi
                </div>


              </div>


              <a
                class="task-action"
                href="./admin-coach-backlog"
              >
                XỬ LÝ →
              </a>


            </div>

          `;

        }
      )
      .join("");

  }


  /* =====================================================
     LOAD DỮ LIỆU
  ====================================================== */

  async function loadExtraTasks() {

    ensureSections();


    try {


      const [
        baseResult,
        backlogResult,
        overdueResult,
        changeResult,
        applicationResult
      ] =
        await Promise.all([

          extraSb.rpc(
            "admin_get_pending_tasks"
          ),

          extraSb.rpc(
            "admin_get_coach_operational_backlog"
          ),

          extraSb.rpc(
            "admin_get_overdue_coach_sessions"
          ),

          extraSb
            .from(
              "coach_change_requests"
            )
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "status",
              "pending"
            ),

          extraSb
            .from(
              "coach_applications"
            )
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "status",
              "pending"
            )

        ]);


      if (
        baseResult.error
      ) {
        throw baseResult.error;
      }


      if (
        backlogResult.error
      ) {
        throw backlogResult.error;
      }


      if (
        overdueResult.error
      ) {
        throw overdueResult.error;
      }


      if (
        changeResult.error
      ) {

        console.warn(
          "Không đếm được yêu cầu đổi Coach:",
          changeResult.error
        );

      }


      if (
        applicationResult.error
      ) {

        console.warn(
          "Không đếm được hồ sơ Coach:",
          applicationResult.error
        );

      }


      const baseRows =
        Array.isArray(
          baseResult.data
        )
          ?
          baseResult.data
          :
          [];


      const coachRows =
        Array.isArray(
          backlogResult.data
        )
          ?
          backlogResult.data
          :
          [];


      const overdueSessions =
        Array.isArray(
          overdueResult.data
        )
          ?
          overdueResult.data
          :
          [];


      /* =================================================
         BUỔI CHƯA ĐIỂM DANH
      ================================================== */

      const attendanceTotal =
        overdueSessions.length;


      /* =================================================
         CHẤM TRÌNH CUỐI KHÓA
      ================================================== */

      const finalTotal =
        coachRows.reduce(
          function (
            sum,
            row
          ) {

            return (
              sum
              +
              Number(
                row.pending_final_assessments
                ||
                0
              )
            );

          },
          0
        );


      /*
        KHÔNG cộng:
        pending_session_requests

        vì Yêu cầu lịch đã thuộc
        admin_get_pending_tasks().
      */


      const coachChangeTotal =
        changeResult.error
          ?
          0
          :
          Number(
            changeResult.count
            ||
            0
          );


      const coachApplicationTotal =
        applicationResult.error
          ?
          0
          :
          Number(
            applicationResult.count
            ||
            0
          );


      /* =================================================
         TỔNG CHÍNH THỨC
      ================================================== */

      const total =
        baseRows.length
        +
        coachChangeTotal
        +
        coachApplicationTotal
        +
        attendanceTotal
        +
        finalTotal;


      /* =================================================
         RENDER BUỔI COACH
      ================================================== */

      const attendanceCount =
        document.getElementById(
          "coachOverdueAttendanceCount"
        );


      const attendanceBody =
        document.getElementById(
          "coachOverdueAttendanceBody"
        );


      if (
        attendanceCount
      ) {

        attendanceCount.textContent =
          String(
            attendanceTotal
          );

      }


      if (
        attendanceBody
      ) {

        attendanceBody.innerHTML =
          renderOverdueSessions(
            overdueSessions
          );

      }


      /* =================================================
         RENDER CHẤM TRÌNH
      ================================================== */

      const finalCount =
        document.getElementById(
          "coachFinalAssessmentCount"
        );


      const finalBody =
        document.getElementById(
          "coachFinalAssessmentBody"
        );


      if (
        finalCount
      ) {

        finalCount.textContent =
          String(
            finalTotal
          );

      }


      if (
        finalBody
      ) {

        finalBody.innerHTML =
          renderFinalAssessments(
            coachRows
          );

      }


      /* =================================================
         ĐỒNG BỘ TỔNG VIỆC
      ================================================== */

      const totalTasks =
        document.getElementById(
          "totalTasks"
        );


      if (
        totalTasks
      ) {

        totalTasks.textContent =
          String(
            total
          );

      }


      /* =================================================
         DÒNG CẬP NHẬT
      ================================================== */

      const message =
        document.getElementById(
          "message"
        );


      if (
        message
      ) {

        const now =
          new Date()
            .toLocaleTimeString(
              "vi-VN",
              {
                hour:
                  "2-digit",
                minute:
                  "2-digit"
              }
            );


        message.style.color =
          "#b9ff18";


        message.textContent =
          `✓ Đã cập nhật ${total} việc lúc ${now}`;

      }


      /* =================================================
         BANNER
      ================================================== */

      const allClear =
        document.getElementById(
          "allClear"
        );


      if (
        allClear
      ) {

        allClear.classList.add(
          "show"
        );


        if (
          total === 0
        ) {

          allClear.textContent =
            "✅ Hiện không có việc nào cần Admin xử lý.";


          allClear.style.color =
            "";


          allClear.style.borderColor =
            "";


          allClear.style.background =
            "";

        }
        else {

          allClear.textContent =
            `⚠️ Hiện có ${total} việc cần Admin theo dõi.`;


          allClear.style.color =
            "#ffd27d";


          allClear.style.borderColor =
            "rgba(255,142,142,.32)";


          allClear.style.background =
            "rgba(255,100,100,.07)";

        }

      }


      console.log(
        "PICKDEE ADMIN TASKS V2:",
        {
          baseTasks:
            baseRows.length,

          coachChanges:
            coachChangeTotal,

          coachApplications:
            coachApplicationTotal,

          overdueCoachSessions:
            attendanceTotal,

          finalAssessments:
            finalTotal,

          total:
            total
        }
      );


    }
    catch (
      error
    ) {

      console.error(
        "PICKDEE ADMIN TASKS V2 ERROR:",
        error
      );

    }

  }


  /* =====================================================
     CHẠY SAU SCRIPT GỐC
  ====================================================== */

  setTimeout(
    loadExtraTasks,
    500
  );


  setTimeout(
    loadExtraTasks,
    1800
  );


  const refreshButton =
    document.getElementById(
      "refreshBtn"
    );


  if (
    refreshButton
  ) {

    refreshButton.addEventListener(
      "click",
      function () {

        setTimeout(
          loadExtraTasks,
          700
        );

      }
    );

  }


  setInterval(
    function () {

      setTimeout(
        loadExtraTasks,
        700
      );

    },
    60000
  );


  window.addEventListener(
    "focus",
    function () {

      setTimeout(
        loadExtraTasks,
        300
      );

    }
  );


})();

</script>
