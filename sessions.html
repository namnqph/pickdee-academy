<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Lịch học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 80% 10%, rgba(80,255,190,.12), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(1150px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 25px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: clamp(36px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.66);
      margin-bottom: 24px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
    }

    .add {
      display: inline-flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 10px;
      background: #d8ff45;
      color: #172600;
      text-decoration: none;
      font-weight: 900;
      white-space: nowrap;
    }

    .card {
      overflow: hidden;
      border-radius: 16px;
      background: rgba(6,39,88,.72);
      border: 1px solid rgba(255,255,255,.12);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 13px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align: left;
      font-size: 14px;
    }

    th {
      color: #d8ff45;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.045);
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      color: #d8ff45;
      background: rgba(216,255,69,.12);
      font-size: 12px;
      font-weight: 800;
    }

    #empty {
      padding: 25px;
      color: rgba(255,255,255,.65);
      display: none;
    }

    #message {
      margin-bottom: 15px;
      color: #ffbbbb;
    }

    @media (max-width: 650px) {
      .toolbar {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">
  <a class="back" href="./admin.html">
    ← Trung tâm quản trị
  </a>

  <div class="eyebrow">
    QUẢN LÝ LỊCH HỌC
  </div>

  <h1>Lịch học</h1>

  <div class="sub">
    Quản lý lịch học, Coach, ngày giờ, sân và trạng thái buổi học.
  </div>

  <div class="toolbar">

  <input
    id="search"
    type="search"
    placeholder="Tìm mã buổi, học viên, Coach, sân..."
  />

  <a
    href="./add-session.html"
    class="add"
  >
    + TẠO BUỔI HỌC
  </a>

</div>

  <div class="card">
    <div style="overflow-x:auto;">
      <table style="width:100%;">
        <thead>
          <tr>
            <th>Mã buổi</th>
            <th>Học viên</th>
            <th>Coach</th>
            <th>Buổi số</th>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Sân</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="sessionsBody">
          <tr>
            <td colspan="8">Đang tải lịch học...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="./sessions.js?v=20260925-1"></script>

<script src="/academy-admin-appnav.js?v=20261016-1"></script>
</body>
</html>
