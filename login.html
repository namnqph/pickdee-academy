      sử dụng chung tài khoản PickDee.

    <form id="loginForm">


      <label for="email">

  <script

  <script>

  (async function () {


    const config =
      window.PICKDEE_CONFIG
      ||
      {};


    const form =
      document.getElementById(
        "loginForm"
      );


    const message =
      document.getElementById(
        "message"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    function setMessage(
      text,
      ok
    ) {

      message.textContent =
        text;


      message.className =
        ok
          ?
            "ok"
          :
            "";

    }


    if (
      !window.supabase
      ||
      !config.SUPABASE_URL
      ||
      !config.SUPABASE_PUBLISHABLE_KEY
    ) {

      setMessage(
        "Không tải được hệ thống đăng nhập PickDee.",
        false
      );


      loginBtn.disabled =
        true;


      return;

    }


    const supabaseClient =
      window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_PUBLISHABLE_KEY
      );


    function normalizeRole(
      value
    ) {

      return String(
        value
        ||
        ""
      )
        .trim()
        .toLocaleLowerCase(
          "vi-VN"
        );

    }


    function getNextPath() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      return String(
        params.get("next")
        ||
        ""
      )
        .trim();

    }


    function safeShopNext(
      next
    ) {

      return (
        next === "/shop-admin"
        ||
        next.startsWith(
          "/shop-admin?"
        )
        ||
        next.startsWith(
          "/shop-admin-"
        )
      );

    }


    function safeCoachNext(
      next
    ) {

      return (
        next === "/coach-teach-courts"
        ||
        next === "/coach-opportunity"
        ||
        next.startsWith(
          "/coach-opportunity?"
        )
      );

    }


    async function getShopRoles(
      userId
    ) {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "shop_user_roles"
            )
            .select(
              "role,is_active"
            )
            .eq(
              "user_id",
              userId
            )
            .eq(
              "is_active",
              true
            );


        if (
          error
        ) {

          console.warn(
            "SHOP ROLE ERROR:",
            error
          );


          return [];

        }


        return (
          data
          ||
          []
        )
          .map(
            function (item) {

              return normalizeRole(
                item?.role
              );

            }
          );

      }
      catch (error) {

        console.warn(
          "SHOP ROLE CHECK ERROR:",
          error
        );


        return [];

      }

    }


    async function getProfile(
      userId
    ) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "profiles"
          )
          .select(
            "email,full_name,role"
          )
          .eq(
            "id",
            userId
          )
          .maybeSingle();


      return {
        profile:
          data || null,

        error
      };

    }


  async function redirectUser(
  user
) {

  if (
    !user?.id
  ) {

    throw new Error(
      "Không lấy được thông tin tài khoản."
    );

  }


  const next =
    getNextPath();


  // Đọc hồ sơ song song với quyền Shop (trước đây chờ nối tiếp).
  const profilePromise =
    getProfile(
      user.id
    );


  const shopRoles =
    await getShopRoles(
      user.id
    );


  const hasShopAccess =
    [
      "owner",
      "shop_admin",
      "shop_staff"
    ]
      .some(
        function (role) {

          return shopRoles.includes(
            role
          );

        }
      );
const isShopOperator =
  shopRoles.includes(
    "shop_admin"
  )
  ||
  shopRoles.includes(
    "shop_staff"
  );


if (
  isShopOperator
) {

  // Bấm thông báo đơn → đăng nhập → quay lại đúng trang đơn.
  window.location.replace(
    safeShopNext(next)
      ? next
      : "/shop-admin"
  );

  return;

}

  /* =================================================
     ĐI TỪ SHOP
     → BẮT BUỘC ƯU TIÊN SHOP
  ================================================== */

  if (
    safeShopNext(
      next
    )
  ) {

    if (
      hasShopAccess
    ) {

      window.location.replace(
        next
      );


      return;

    }


    throw new Error(
      "Tài khoản này chưa có quyền quản lý PickDee Shop."
    );

  }


  /* =================================================
     ĐỌC PROFILE ACADEMY
  ================================================== */

  const {
    profile,
    error:
      profileError
  } =
    await profilePromise;


  const role =
    normalizeRole(
      profile?.role
    );


  /* =================================================
     LINK RIÊNG CỦA COACH
  ================================================== */

  if (
    role === "coach"
    &&
    safeCoachNext(
      next
    )
  ) {

    window.location.replace(
      next
    );


    return;

  }


  /* =================================================
     LOGIN BÌNH THƯỜNG
     → ĐI ĐÚNG ROLE ACADEMY
  ================================================== */

  if (
    role === "admin"
  ) {

    window.location.replace(
      "/admin"
    );


    return;

  }


  if (
    role === "coach"
  ) {

    window.location.replace(
      "/coach"
    );


    return;

  }


  if (
    role === "student"
    ||
    role === "hocvien"
    ||
    role === "học viên"
  ) {

    window.location.replace(
      "/student"
    );


    return;

  }


  /* =================================================
     KHÔNG CÓ ROLE ACADEMY
     NHƯNG CÓ QUYỀN SHOP
  ================================================== */

  if (
    hasShopAccess
  ) {

    window.location.replace(
      "/shop-admin"
    );


    return;

  }


  if (
    profileError
    ||
    !profile
  ) {

    const accountType =
      String(
        user
          ?.user_metadata
          ?.account_type
        ||
        ""
      )
        .trim();


    if (
      accountType
      ===
      "coach_application"
    ) {

      throw new Error(
        "Hồ sơ Coach của bạn đang chờ Admin duyệt."
      );

    }


    throw new Error(
      "Không đọc được hồ sơ tài khoản."
    );

  }


  throw new Error(
    "Tài khoản chưa được phân quyền."
  );

}
    form.addEventListener(
      "submit",
      async function (event) {


        event.preventDefault();


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "Đang đăng nhập...";


        setMessage(
          "Đang đăng nhập...",
          false
        );


        try {


          const email =
            document
              .getElementById(
                "email"
              )
              .value
              .trim();


          const password =
            document
              .getElementById(
                "password"
              )
              .value;


          let data = null;
          let error = null;


          if (
            email.includes("@")
          ) {

            ({
              data,
              error
            } =
              await supabaseClient
                .auth
                .signInWithPassword(
                  {
                    email,
                    password
                  }
                ));

          } else {

            /*
              Đăng nhập bằng số điện thoại:
              Edge Function pickdee-login tra SĐT → email
              rồi trả về phiên đăng nhập.
            */
            const result =
              await supabaseClient
                .functions
                .invoke(
                  "pickdee-login",
                  {
                    body: {
                      identifier: email,
                      password
                    }
                  }
                );

            if (
              result.error
              ||
              !result.data?.session?.access_token
            ) {

              error =
                result.error
                ||
                new Error("no_session");

            } else {

              ({
                data,
                error
              } =
                await supabaseClient
                  .auth
                  .setSession(
                    {
                      access_token:
                        result.data.session.access_token,
                      refresh_token:
                        result.data.session.refresh_token
                    }
                  ));

            }

          }


          if (
            error
          ) {

            console.error(
              "LOGIN ERROR:",
              error
            );


            throw new Error(
              "Email/số điện thoại hoặc mật khẩu chưa đúng."
            );

          }


          if (
            !data?.user
          ) {

            throw new Error(
              "Không lấy được thông tin tài khoản."
            );

          }


          setMessage(
            "✓ Đăng nhập thành công. Đang mở tài khoản...",
            true
          );



          await redirectUser(
            data.user
          );

        }
        catch (error) {


          console.error(
            "PICKDEE LOGIN ERROR:",
            error
          );


          setMessage(
            error?.message
            ||
            "Không đăng nhập được.",
            false
          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "Đăng nhập";

        }


      }
    );




    /*
      Máy đã bật Face ID → tự mở Face ID, ẩn form mật khẩu (bấm "Đăng nhập bằng mật khẩu" mới hiện).
    */
    /*
      Mở app (icon màn hình chính → /login) khi vẫn còn phiên đăng nhập
      → vào thẳng khu vực của mình như app, không hiện trang đăng nhập.
    */
    const {
      data: existingSession
    } =
      await supabaseClient.auth.getSession();

    if (
      existingSession?.session?.user
    ) {
      try {
        await redirectUser(
          existingSession.session.user
        );
        return;
      }
      catch (error) {
        console.warn(
          "AUTO REDIRECT:",
          error
        );
      }
    }


    if (
      window.PDFaceID
    ) {
      window.PDFaceID.mountLogin(
        document.getElementById(
          "pdFaceIdLogin"
        ),
        async function (user) {
          await redirectUser(
            user
          );
        },
        {
          form:
            document.getElementById(
              "loginForm"
            ),

          auto:
            true
        }
      );
    }
  })();

  </script>
