<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#09111f"
  >

  <title>Đăng nhập | PickDee</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 80% 15%,
          rgba(185,255,24,.12),
          transparent 25%
        ),
        #09111f;

      color: white;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        sans-serif;
    }

    .login-card {
      width: 100%;

      max-width: 420px;

      padding:
        32px 24px;

      background:
        #0e1b2d;

      border:
        1px solid #26364b;

      border-radius:
        18px;
    }

    .brand {
      color:
        #b9ff18;

      font-weight:
        900;

      margin-bottom:
        12px;
    }

    h1 {
      margin:
        0 0 8px;

      font-size:
        32px;
    }

    .sub {
      margin:
        0 0 28px;

      color:
        #aab6c5;

      line-height:
        1.5;
    }

    label {
      display:
        block;

      margin:
        16px 0 7px;

      font-weight:
        700;
    }

    input {
      width:
        100%;

      height:
        52px;

      padding:
        0 14px;

      border-radius:
        9px;

      border:
        1px solid #394b62;

      background:
        #08111d;

      color:
        white;

      font-size:
        16px;
    }

    input:focus {
      outline:
        2px solid rgba(185,255,24,.35);

      border-color:
        #b9ff18;
    }

    .forgot {
      display:
        block;

      width:
        fit-content;

      margin:
        10px 0 0 auto;

      color:
        #b9ff18;

      text-decoration:
        none;

      font-size:
        13px;

      font-weight:
        800;
    }

    .forgot:hover {
      text-decoration:
        underline;
    }

    button {
      width:
        100%;

      height:
        52px;

      margin-top:
        22px;

      border:
        0;

      border-radius:
        9px;

      background:
        #b9ff18;

      color:
        #07101b;

      font-weight:
        900;

      cursor:
        pointer;
    }

    button:disabled {
      opacity:
        .55;

      cursor:
        wait;
    }

    #message {
      min-height:
        22px;

      margin-top:
        16px;

      color:
        #ffb4b4;

      line-height:
        1.4;

      font-size:
        14px;
    }

    .back {
      display:
        block;

      margin-top:
        18px;

      text-align:
        center;

      color:
        #aab6c5;

      text-decoration:
        none;
    }

  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      PICKDEE
    </div>

    <h1>
      Đăng nhập
    </h1>

    <p class="sub">
      Học viên, Coach, Admin và quản trị PickDee Shop
      sử dụng chung tài khoản PickDee.
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">
        Mật khẩu
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <a
        class="forgot"
        href="/forgot-password"
      >
        QUÊN MẬT KHẨU?
      </a>

      <button
        id="loginBtn"
        type="submit"
      >
        ĐĂNG NHẬP
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="/"
    >
      ← Quay lại PickDee
    </a>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/config.js"></script>

  <script src="/login.js?v=20261007-1"></script>

</body>
</html>
