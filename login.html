<!doctype html>
<html lang="vi">

<head>

  <meta charset="utf-8">

  <link rel="preconnect" href="https://snxztjsluhdibrklougo.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <meta
    name="theme-color"
    content="#09111f"
  >

  <title>Đăng nhập | PickDee</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 80% 15%,
          rgba(185,255,24,.12),
          transparent 25%
        ),
        #09111f;

      color: white;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        sans-serif;
    }


    .login-card {
      width: 100%;

      max-width: 420px;

      padding:
        32px 24px;

      background:
        #0e1b2d;

      border:
        1px solid #26364b;

      border-radius:
        18px;
    }


    .brand {
      color:
        #b9ff18;

      font-weight:
        900;

      margin-bottom:
        12px;
    }


    h1 {
      margin:
        0 0 8px;

      font-size:
        32px;
    }


    .sub {
      margin:
        0 0 28px;

      color:
        #aab6c5;

      line-height:
        1.5;
    }


    label {
      display: block;

      margin:
        16px 0 7px;

      font-weight:
        700;
    }


    input {
      width:
        100%;

      height:
        52px;

      padding:
        0 14px;

      border-radius:
        9px;

      border:
        1px solid #394b62;

      background:
        #08111d;

      color:
        white;

      font-size:
        16px;
    }


    input:focus {
      outline:
        2px solid rgba(185,255,24,.35);

      border-color:
        #b9ff18;
    }


    .forgot {
      display: block;

      width:
        fit-content;

      margin:
        10px 0 0 auto;

      color:
        #b9ff18;

      text-decoration:
        none;

      font-size:
        13px;

      font-weight:
        800;
    }


    button {
      width:
        100%;

      height:
        52px;

      margin-top:
        22px;

      border:
        0;

      border-radius:
        9px;

      background:
        #b9ff18;

      color:
        #07101b;

      font-weight:
        900;

      cursor:
        pointer;
    }


    button:disabled {
      opacity:
        .55;

      cursor:
        wait;
    }


    #message {
      min-height:
        22px;

      margin-top:
        16px;

      color:
        #ffb4b4;

      line-height:
        1.45;

      font-size:
        14px;
    }


    #message.ok {
      color:
        #b9ff18;
    }


    .back {
      display: block;

      margin-top:
        18px;

      text-align:
        center;

      color:
        #aab6c5;

      text-decoration:
        none;
    }

  </style>

</head>


<body>


  <div class="login-card">


    <div class="brand">
      PICKDEE
    </div>


    <h1>
      Đăng nhập
    </h1>


    <p class="sub">
      Học viên, Coach, Admin và quản trị PickDee Shop
      sử dụng chung tài khoản PickDee.
    </p>


    <div id="pdFaceIdLogin"></div>


    <form id="loginForm">


      <label for="email">
        Email hoặc số điện thoại
      </label>


      <input
        id="email"
        type="text"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Nhập email hoặc số điện thoại"
        required
      >


      <label for="password">
        Mật khẩu
      </label>


      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >


      <a
        class="forgot"
        href="/forgot-password"
      >
        QUÊN MẬT KHẨU?
      </a>


      <button
        id="loginBtn"
        type="submit"
      >
        ĐĂNG NHẬP
      </button>


    </form>


    <div id="message"></div>


    <a
      class="back"
      href="/"
    >
      ← Quay lại PickDee
    </a>


  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script src="/config.js"></script>


  <script src="/pd-faceid.js?v=20261017-faceid1"></script>


  <script>

  (function () {


    const config =
      window.PICKDEE_CONFIG
      ||
      {};


    const form =
      document.getElementById(
        "loginForm"
      );


    const message =
      document.getElementById(
        "message"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    function setMessage(
      text,
      ok
    ) {

      message.textContent =
        text;


      message.className =
        ok
          ?
            "ok"
          :
            "";

    }


    if (
      !window.supabase
      ||
      !config.SUPABASE_URL
      ||
      !config.SUPABASE_PUBLISHABLE_KEY
    ) {

      setMessage(
        "Không tải được hệ thống đăng nhập PickDee.",
        false
      );


      loginBtn.disabled =
        true;


      return;

    }


    const supabaseClient =
      window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_PUBLISHABLE_KEY
      );


    function normalizeRole(
      value
    ) {

      return String(
        value
        ||
        ""
      )
        .trim()
        .toLocaleLowerCase(
          "vi-VN"
        );

    }


    function getNextPath() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      return String(
        params.get("next")
        ||
        ""
      )
        .trim();

    }


    function safeShopNext(
      next
    ) {

      return (
        next === "/shop-admin"
        ||
        next.startsWith(
          "/shop-admin?"
        )
        ||
        next.startsWith(
          "/shop-admin-"
        )
      );

    }


    function safeCoachNext(
      next
    ) {

      return (
        next === "/coach-opportunity"
        ||
        next.startsWith(
          "/coach-opportunity?"
        )
      );

    }


    async function getShopRoles(
      userId
    ) {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "shop_user_roles"
            )
            .select(
              "role,is_active"
            )
            .eq(
              "user_id",
              userId
            )
            .eq(
              "is_active",
              true
            );


        if (
          error
        ) {

          console.warn(
            "SHOP ROLE ERROR:",
            error
          );


          return [];

        }


        return (
          data
          ||
          []
        )
          .map(
            function (item) {

              return normalizeRole(
                item?.role
              );

            }
          );

      }
      catch (error) {

        console.warn(
          "SHOP ROLE CHECK ERROR:",
          error
        );


        return [];

      }

    }


    async function getProfile(
      userId
    ) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "profiles"
          )
          .select(
            "email,full_name,role"
          )
          .eq(
            "id",
            userId
          )
          .maybeSingle();


      return {
        profile:
          data || null,

        error
      };

    }


  async function redirectUser(
  user
) {

  if (
    !user?.id
  ) {

    throw new Error(
      "Không lấy được thông tin tài khoản."
    );

  }


  const next =
    getNextPath();


  // Đọc hồ sơ song song với quyền Shop (trước đây chờ nối tiếp).
  const profilePromise =
    getProfile(
      user.id
    );


  const shopRoles =
    await getShopRoles(
      user.id
    );


  const hasShopAccess =
    [
      "owner",
      "shop_admin",
      "shop_staff"
    ]
      .some(
        function (role) {

          return shopRoles.includes(
            role
          );

        }
      );
const isShopOperator =
  shopRoles.includes(
    "shop_admin"
  )
  ||
  shopRoles.includes(
    "shop_staff"
  );


if (
  isShopOperator
) {

  // Bấm thông báo đơn → đăng nhập → quay lại đúng trang đơn.
  window.location.replace(
    safeShopNext(next)
      ? next
      : "/shop-admin"
  );

  return;

}

  /* =================================================
     ĐI TỪ SHOP
     → BẮT BUỘC ƯU TIÊN SHOP
  ================================================== */

  if (
    safeShopNext(
      next
    )
  ) {

    if (
      hasShopAccess
    ) {

      window.location.replace(
        next
      );


      return;

    }


    throw new Error(
      "Tài khoản này chưa có quyền quản lý PickDee Shop."
    );

  }


  /* =================================================
     ĐỌC PROFILE ACADEMY
  ================================================== */

  const {
    profile,
    error:
      profileError
  } =
    await profilePromise;


  const role =
    normalizeRole(
      profile?.role
    );


  /* =================================================
     LINK RIÊNG CỦA COACH
  ================================================== */

  if (
    role === "coach"
    &&
    safeCoachNext(
      next
    )
  ) {

    window.location.replace(
      next
    );


    return;

  }


  /* =================================================
     LOGIN BÌNH THƯỜNG
     → ĐI ĐÚNG ROLE ACADEMY
  ================================================== */

  if (
    role === "admin"
  ) {

    window.location.replace(
      "/admin"
    );


    return;

  }


  if (
    role === "coach"
  ) {

    window.location.replace(
      "/coach"
    );


    return;

  }


  if (
    role === "student"
    ||
    role === "hocvien"
    ||
    role === "học viên"
  ) {

    window.location.replace(
      "/student"
    );


    return;

  }


  /* =================================================
     KHÔNG CÓ ROLE ACADEMY
     NHƯNG CÓ QUYỀN SHOP
  ================================================== */

  if (
    hasShopAccess
  ) {

    window.location.replace(
      "/shop-admin"
    );


    return;

  }


  if (
    profileError
    ||
    !profile
  ) {

    const accountType =
      String(
        user
          ?.user_metadata
          ?.account_type
        ||
        ""
      )
        .trim();


    if (
      accountType
      ===
      "coach_application"
    ) {

      throw new Error(
        "Hồ sơ Coach của bạn đang chờ Admin duyệt."
      );

    }


    throw new Error(
      "Không đọc được hồ sơ tài khoản."
    );

  }


  throw new Error(
    "Tài khoản chưa được phân quyền."
  );

}
    form.addEventListener(
      "submit",
      async function (event) {


        event.preventDefault();


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "ĐANG ĐĂNG NHẬP...";


        setMessage(
          "Đang đăng nhập...",
          false
        );


        try {


          const email =
            document
              .getElementById(
                "email"
              )
              .value
              .trim();


          const password =
            document
              .getElementById(
                "password"
              )
              .value;


          let data = null;
          let error = null;


          if (
            email.includes("@")
          ) {

            ({
              data,
              error
            } =
              await supabaseClient
                .auth
                .signInWithPassword(
                  {
                    email,
                    password
                  }
                ));

          } else {

            /*
              Đăng nhập bằng số điện thoại:
              Edge Function pickdee-login tra SĐT → email
              rồi trả về phiên đăng nhập.
            */
            const result =
              await supabaseClient
                .functions
                .invoke(
                  "pickdee-login",
                  {
                    body: {
                      identifier: email,
                      password
                    }
                  }
                );

            if (
              result.error
              ||
              !result.data?.session?.access_token
            ) {

              error =
                result.error
                ||
                new Error("no_session");

            } else {

              ({
                data,
                error
              } =
                await supabaseClient
                  .auth
                  .setSession(
                    {
                      access_token:
                        result.data.session.access_token,
                      refresh_token:
                        result.data.session.refresh_token
                    }
                  ));

            }

          }


          if (
            error
          ) {

            console.error(
              "LOGIN ERROR:",
              error
            );


            throw new Error(
              "Email/số điện thoại hoặc mật khẩu chưa đúng."
            );

          }


          if (
            !data?.user
          ) {

            throw new Error(
              "Không lấy được thông tin tài khoản."
            );

          }


          setMessage(
            "✓ Đăng nhập thành công. Đang mở tài khoản...",
            true
          );


          /*
            Hỏi bật Face ID cho máy này (máy hỗ trợ, chưa bật, chưa bấm "Để sau").
            Chọn xong mới chuyển trang.
          */
          if (
            window.PDFaceID
          ) {
            const sessionResult =
              await supabaseClient
                .auth
                .getSession();

            await window.PDFaceID.offer(
              data.user,
              sessionResult?.data?.session
            );
          }



          await redirectUser(
            data.user
          );

        }
        catch (error) {


          console.error(
            "PICKDEE LOGIN ERROR:",
            error
          );


          setMessage(
            error?.message
            ||
            "Không đăng nhập được.",
            false
          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "ĐĂNG NHẬP";

        }


      }
    );




    /*
      Máy đã bật Face ID → nút "Đăng nhập bằng Face ID" trên đầu form.
    */
    if (
      window.PDFaceID
    ) {
      window.PDFaceID.mountLogin(
        document.getElementById(
          "pdFaceIdLogin"
        ),
        async function (user) {
          await redirectUser(
            user
          );
        }
      );
    }
  })();

  </script>
<script src="/support-widget.js?v=20261017-bot8"></script>

</body>

</html>
