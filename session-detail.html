<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Chi tiết buổi học | PickDee Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #06152b;
      color: white;
    }

    .topbar {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,.15);
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      color: #b7ff00;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 24px 60px;
    }

    .back {
      color: #b7ff00;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 28px;
      color: #b7ff00;
      font-weight: 800;
    }

    h1 {
      font-size: 52px;
      margin: 10px 0 8px;
    }

    .sub {
      color: #b8c4d8;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #0d2b58;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 22px;
    }

    .card h2 {
      margin-top: 0;
    }

    .item {
      margin-bottom: 18px;
    }

    .label {
      color: #94a8c6;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(183,255,0,.15);
      color: #b7ff00;
      font-weight: 800;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    #completeBtn {
      background: #b7ff00;
      color: #07111f;
    }

    #absentBtn {
      background: #fff;
      color: #07111f;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #message {
      margin-top: 14px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .grid,
      .actions {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

  <a href="./sessions.html" class="back">
    ← Lịch học
  </a>

  <div class="eyebrow">
    CHI TIẾT BUỔI HỌC
  </div>

  <h1 id="sessionCode">Đang tải...</h1>

  <div class="sub" id="registrationLine">
    —
  </div>

  <div class="grid">

    <div class="card">
      <h2>📚 Thông tin buổi học</h2>

      <div class="item">
        <div class="label">Học viên</div>
        <div class="value" id="studentName">—</div>
      </div>

      <div class="item">
        <div class="label">Coach phụ trách</div>
        <div class="value" id="coachName">—</div>
      </div>

      <div class="item">
        <div class="label">Buổi số</div>
        <div class="value" id="sessionNo">—</div>
      </div>

      <div class="item">
        <div class="label">Trạng thái</div>
        <div class="value">
          <span class="badge" id="status">—</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📅 Thời gian & sân</h2>

      <div class="item">
        <div class="label">Ngày học</div>
        <div class="value" id="sessionDate">—</div>
      </div>

      <div class="item">
        <div class="label">Giờ bắt đầu</div>
        <div class="value" id="startTime">—</div>
      </div>

      <div class="item">
        <div class="label">Thời lượng</div>
        <div class="value" id="duration">—</div>
      </div>

      <div class="item">
        <div class="label">Sân học</div>
        <div class="value" id="courtName">—</div>
      </div>
    </div>

  </div>

  <div class="card" style="margin-top:18px;">
    <h2>📝 Ghi chú</h2>

    <div id="note">—</div>

    <div class="actions">
      <button id="completeBtn" type="button">
        ✅ HOÀN THÀNH BUỔI
      </button>

      <button id="absentBtn" type="button">
        ❌ VẮNG
      </button>
    </div>

    <div id="message"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./session-detail-v2.js"></script>
<script>
(async function () {

  /* =====================================================
     PICKDEE - HIỂN THỊ THÀNH VIÊN BUỔI HỌC NHÓM
     Không ảnh hưởng buổi học cá nhân
  ====================================================== */

  const cfg =
    window.PICKDEE_CONFIG || {};


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {
    return;
  }


  const groupDetailSb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    Number(
      params.get("id")
    );


  if (
    !Number.isFinite(sessionId)
    ||
    sessionId <= 0
  ) {
    return;
  }


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function firstObject(value) {

    if (
      Array.isArray(value)
    ) {

      return (
        value[0]
        ||
        {}
      );
    }

    return (
      value
      ||
      {}
    );
  }


  function normalizeParticipant(row) {

    const registration =
      firstObject(
        row.registration
        ||
        row.registrations
      );


    const student =
      firstObject(
        row.student
        ||
        row.students
      );


    return {

      registration_id:
        Number(
          row.registration_id
          ||
          registration.id
          ||
          0
        ),

      registration_code:
        String(
          row.registration_code
          ||
          registration.registration_code
          ||
          ""
        ),

      student_id:
        Number(
          row.student_id
          ||
          student.id
          ||
          registration.student_id
          ||
          0
        ),

      student_code:
        String(
          row.student_code
          ||
          student.student_code
          ||
          ""
        ),

      full_name:
        String(
          row.full_name
          ||
          row.student_name
          ||
          row.student_full_name
          ||
          student.full_name
          ||
          ""
        )

    };
  }


  /* =====================================================
     1. KIỂM TRA CÓ PHẢI BUỔI NHÓM KHÔNG
  ====================================================== */

  const {
    data: sessionRow,
    error: sessionError
  } =
    await groupDetailSb
      .from("class_sessions")
      .select(`
        id,
        training_group_id
      `)
      .eq(
        "id",
        sessionId
      )
      .maybeSingle();


  if (
    sessionError
    ||
    !sessionRow
    ||
    !sessionRow.training_group_id
  ) {

    /*
      Buổi cá nhân:
      giữ nguyên toàn bộ giao diện cũ.
    */

    return;
  }


  /* =====================================================
     2. THỬ LẤY PARTICIPANT QUA RPC CÓ SẴN
  ====================================================== */

  let participants =
    [];


  try {

    const {
      data,
      error
    } =
      await groupDetailSb.rpc(
        "coach_get_session_participants",
        {
          p_session_id:
            sessionId
        }
      );


    if (!error) {

      const rows =
        Array.isArray(data)
          ?
          data
          :
          (
            Array.isArray(
              data?.participants
            )
              ?
              data.participants
              :
              []
          );


      participants =
        rows
          .map(
            normalizeParticipant
          )
          .filter(
            item =>
              item.registration_id > 0
          );

    }

  }
  catch (error) {

    console.warn(
      "GROUP PARTICIPANTS RPC:",
      error
    );

  }


  /* =====================================================
     3. FALLBACK CHO ADMIN
  ====================================================== */

  if (
    participants.length < 2
  ) {

    try {

      const {
        data: links,
        error: linksError
      } =
        await groupDetailSb
          .from(
            "class_session_participants"
          )
          .select(`
            registration_id
          `)
          .eq(
            "session_id",
            sessionId
          );


      if (linksError) {
        throw linksError;
      }


      const registrationIds =
        [
          ...new Set(
            (links || [])
              .map(
                item =>
                  Number(
                    item.registration_id
                  )
              )
              .filter(
                id =>
                  Number.isFinite(id)
                  &&
                  id > 0
              )
          )
        ];


      if (
        registrationIds.length
      ) {

        const {
          data: registrations,
          error: registrationsError
        } =
          await groupDetailSb
            .from("registrations")
            .select(`
              id,
              registration_code,
              student_id
            `)
            .in(
              "id",
              registrationIds
            );


        if (registrationsError) {
          throw registrationsError;
        }


        const studentIds =
          [
            ...new Set(
              (registrations || [])
                .map(
                  item =>
                    Number(
                      item.student_id
                    )
                )
                .filter(
                  id =>
                    Number.isFinite(id)
                    &&
                    id > 0
                )
            )
          ];


        let students =
          [];


        if (
          studentIds.length
        ) {

          const {
            data,
            error
          } =
            await groupDetailSb
              .from("students")
              .select(`
                id,
                student_code,
                full_name
              `)
              .in(
                "id",
                studentIds
              );


          if (error) {
            throw error;
          }


          students =
            data || [];

        }


        const studentMap =
          new Map(
            students.map(
              student => [
                Number(student.id),
                student
              ]
            )
          );


        participants =
          (registrations || [])
            .map(
              registration => {

                const student =
                  studentMap.get(
                    Number(
                      registration.student_id
                    )
                  )
                  ||
                  {};


                return {

                  registration_id:
                    Number(
                      registration.id
                    ),

                  registration_code:
                    String(
                      registration.registration_code
                      ||
                      ""
                    ),

                  student_id:
                    Number(
                      registration.student_id
                      ||
                      0
                    ),

                  student_code:
                    String(
                      student.student_code
                      ||
                      ""
                    ),

                  full_name:
                    String(
                      student.full_name
                      ||
                      ""
                    )

                };

              }
            );

      }

    }
    catch (error) {

      console.error(
        "GROUP PARTICIPANTS FALLBACK:",
        error
      );

    }

  }


  /* =====================================================
     4. KHÔNG ĐỦ DỮ LIỆU THÌ GIỮ NGUYÊN
  ====================================================== */

  if (
    participants.length < 2
  ) {

    console.warn(
      "PickDee: chưa tải đủ thành viên buổi nhóm.",
      participants
    );

    return;
  }


  participants.sort(
    (
      a,
      b
    ) =>
      a.registration_id
      -
      b.registration_id
  );


  /* =====================================================
     5. CẬP NHẬT PHẦN HỌC VIÊN
  ====================================================== */

  const studentName =
    document.getElementById(
      "studentName"
    );


  const registrationLine =
    document.getElementById(
      "registrationLine"
    );


  if (
    studentName
  ) {

    const studentItem =
      studentName.closest(
        ".item"
      );


    const label =
      studentItem
        ?.querySelector(
          ".label"
        );


    if (label) {

      label.textContent =
        "Học viên trong nhóm";

    }


    studentName.textContent =
      participants
        .map(
          item =>
            item.full_name
            ||
            item.student_code
            ||
            (
              "Registration "
              +
              item.registration_id
            )
        )
        .join(
          " + "
        );


    /* ===============================================
       CHI TIẾT 2 THÀNH VIÊN
    =============================================== */

    let participantBox =
      document.getElementById(
        "groupParticipantBox"
      );


    if (!participantBox) {

      participantBox =
        document.createElement(
          "div"
        );


      participantBox.id =
        "groupParticipantBox";


      participantBox.style.marginTop =
        "12px";


      participantBox.style.display =
        "grid";


      participantBox.style.gap =
        "8px";


      studentName.insertAdjacentElement(
        "afterend",
        participantBox
      );

    }


    participantBox.innerHTML =
      participants
        .map(
          (
            item,
            index
          ) => {

            const title =
              item.full_name
              ||
              item.student_code
              ||
              (
                "Học viên "
                +
                (
                  index + 1
                )
              );


            const details =
              [
                item.student_code
                  ?
                  (
                    "Mã HV: "
                    +
                    item.student_code
                  )
                  :
                  "",

                item.registration_code
                  ?
                  (
                    "Đăng ký: "
                    +
                    item.registration_code
                  )
                  :
                  ""
              ]
                .filter(Boolean)
                .join(
                  " · "
                );


            return `
              <div
                style="
                  padding:10px 12px;
                  border:1px solid rgba(255,255,255,.14);
                  border-radius:10px;
                  background:rgba(0,0,0,.13);
                "
              >
                <div
                  style="
                    font-weight:800;
                    color:#fff;
                  "
                >
                  ${index + 1}. ${escapeHtml(title)}
                </div>

                ${
                  details
                    ?
                    `
                      <div
                        style="
                          margin-top:4px;
                          color:#94a8c6;
                          font-size:13px;
                        "
                      >
                        ${escapeHtml(details)}
                      </div>
                    `
                    :
                    ""
                }
              </div>
            `;

          }
        )
        .join("");

  }


  /* =====================================================
     6. KHÔNG HIỂN THỊ PRIMARY REGISTRATION GÂY HIỂU NHẦM
  ====================================================== */

  if (
    registrationLine
  ) {

    const registrationCodes =
      participants
        .map(
          item =>
            item.registration_code
        )
        .filter(Boolean);


    registrationLine.textContent =
      registrationCodes.length
        ?
        (
          "Đăng ký nhóm: "
          +
          registrationCodes.join(
            " + "
          )
        )
        :
        (
          "Buổi học nhóm · "
          +
          participants.length
          +
          " học viên"
        );

  }


  console.log(
    "PickDee group session participants:",
    participants
  );

})();
</script>
</body>
</html>
