<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Chi tiết buổi học | PickDee Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #06152b;
      color: white;
    }

    .topbar {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,.15);
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      color: #b7ff00;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 24px 60px;
    }

    .back {
      color: #b7ff00;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 28px;
      color: #b7ff00;
      font-weight: 800;
    }

    h1 {
      font-size: 52px;
      margin: 10px 0 8px;
    }

    .sub {
      color: #b8c4d8;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #0d2b58;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 22px;
    }

    .card h2 {
      margin-top: 0;
    }

    .item {
      margin-bottom: 18px;
    }

    .label {
      color: #94a8c6;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(183,255,0,.15);
      color: #b7ff00;
      font-weight: 800;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    #completeBtn {
      background: #b7ff00;
      color: #07111f;
    }

    #absentBtn {
      background: #fff;
      color: #07111f;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #message {
      margin-top: 14px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .grid,
      .actions {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

  <a href="./sessions.html" class="back">
    ← Lịch học
  </a>

  <div class="eyebrow">
    CHI TIẾT BUỔI HỌC
  </div>

  <h1 id="sessionCode">Đang tải...</h1>

  <div class="sub" id="registrationLine">
    —
  </div>

  <div class="grid">

    <div class="card">
      <h2>📚 Thông tin buổi học</h2>

      <div class="item">
        <div class="label">Học viên</div>
        <div class="value" id="studentName">—</div>
      </div>

      <div class="item">
        <div class="label">Coach phụ trách</div>
        <div class="value" id="coachName">—</div>
      </div>

      <div class="item">
        <div class="label">Buổi số</div>
        <div class="value" id="sessionNo">—</div>
      </div>

      <div class="item">
        <div class="label">Trạng thái</div>
        <div class="value">
          <span class="badge" id="status">—</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📅 Thời gian & sân</h2>

      <div class="item">
        <div class="label">Ngày học</div>
        <div class="value" id="sessionDate">—</div>
      </div>

      <div class="item">
        <div class="label">Giờ bắt đầu</div>
        <div class="value" id="startTime">—</div>
      </div>

      <div class="item">
        <div class="label">Thời lượng</div>
        <div class="value" id="duration">—</div>
      </div>

      <div class="item">
        <div class="label">Sân học</div>
        <div class="value" id="courtName">—</div>
      </div>
    </div>

  </div>

  <div class="card" style="margin-top:18px;">
    <h2>📝 Ghi chú</h2>

    <div id="note">—</div>

    <div class="actions">
      <button id="completeBtn" type="button">
        ✅ HOÀN THÀNH BUỔI
      </button>

      <button id="absentBtn" type="button">
        ❌ VẮNG
      </button>
    </div>

    <div id="message"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./session-detail-v2.js"></script>
<script>
window.addEventListener(
  "load",
  async function () {

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !window.supabase ||
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {
      return;
    }

    const sbGroupDetail =
      window.PICKDEE_SUPABASE ||
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const sessionId =
      Number(
        params.get("id")
      );

    if (
      !Number.isFinite(sessionId) ||
      sessionId <= 0
    ) {
      return;
    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================================
       ĐỢI session-detail-v2.js TẢI XONG
    ========================================== */

    for (
      let i = 0;
      i < 50;
      i++
    ) {

      const code =
        document.getElementById(
          "sessionCode"
        )?.textContent?.trim();

      const student =
        document.getElementById(
          "studentName"
        )?.textContent?.trim();

      if (
        code &&
        code !== "Đang tải..." &&
        student &&
        student !== "—"
      ) {
        break;
      }

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );
    }


    try {

      /* =========================================
         1. LẤY SESSION
      ========================================== */

      const {
        data: sessionRow,
        error: sessionError
      } =
        await sbGroupDetail
          .from("class_sessions")
          .select(`
            id,
            training_group_id
          `)
          .eq(
            "id",
            sessionId
          )
          .maybeSingle();


      if (sessionError) {
        throw sessionError;
      }


      if (
        !sessionRow ||
        !sessionRow.training_group_id
      ) {

        /*
          Đây là lịch cá nhân.
          Không thay đổi gì.
        */

        return;
      }


      const groupId =
        Number(
          sessionRow.training_group_id
        );


      /* =========================================
         2. LẤY 2 REGISTRATION CỦA NHÓM
      ========================================== */

      const {
        data: memberRows,
        error: memberError
      } =
        await sbGroupDetail
          .from(
            "training_group_members"
          )
          .select(`
            registration_id
          `)
          .eq(
            "group_id",
            groupId
          );


      if (memberError) {
        throw memberError;
      }


      const registrationIds =
        [
          ...new Set(
            (memberRows || [])
              .map(
                item =>
                  Number(
                    item.registration_id
                  )
              )
              .filter(
                id =>
                  Number.isFinite(id) &&
                  id > 0
              )
          )
        ];


      if (
        registrationIds.length < 2
      ) {

        throw new Error(
          "Nhóm chưa đủ 2 đăng ký."
        );
      }


      /* =========================================
         3. REGISTRATIONS
      ========================================== */

      const {
        data: registrations,
        error: registrationError
      } =
        await sbGroupDetail
          .from("registrations")
          .select(`
            id,
            registration_code,
            student_id
          `)
          .in(
            "id",
            registrationIds
          );


      if (registrationError) {
        throw registrationError;
      }


      const studentIds =
        [
          ...new Set(
            (registrations || [])
              .map(
                item =>
                  Number(
                    item.student_id
                  )
              )
              .filter(
                id =>
                  Number.isFinite(id) &&
                  id > 0
              )
          )
        ];


      /* =========================================
         4. STUDENTS
      ========================================== */

      const {
        data: students,
        error: studentError
      } =
        await sbGroupDetail
          .from("students")
          .select(`
            id,
            student_code,
            full_name
          `)
          .in(
            "id",
            studentIds
          );


      if (studentError) {
        throw studentError;
      }


      const studentMap =
        new Map(
          (students || [])
            .map(
              student => [
                Number(student.id),
                student
              ]
            )
        );


      const participants =
        (registrations || [])
          .map(
            registration => {

              const student =
                studentMap.get(
                  Number(
                    registration.student_id
                  )
                )
                ||
                {};

              return {

                registrationId:
                  Number(
                    registration.id
                  ),

                registrationCode:
                  registration.registration_code
                  ||
                  "",

                studentCode:
                  student.student_code
                  ||
                  "",

                fullName:
                  student.full_name
                  ||
                  ""

              };

            }
          )
          .sort(
            (a,b) =>
              a.registrationId
              -
              b.registrationId
          );


      if (
        participants.length < 2
      ) {

        throw new Error(
          "Không tải đủ 2 Học viên."
        );
      }


      /* =========================================
         5. RENDER
      ========================================== */

      function renderGroupStudents() {

        const studentName =
          document.getElementById(
            "studentName"
          );

        const registrationLine =
          document.getElementById(
            "registrationLine"
          );


        if (!studentName) {
          return;
        }


        const item =
          studentName.closest(
            ".item"
          );


        const label =
          item?.querySelector(
            ".label"
          );


        if (label) {

          label.textContent =
            "Học viên trong nhóm";

        }


        studentName.textContent =
          participants
            .map(
              item =>
                item.fullName
                ||
                item.studentCode
            )
            .join(
              " + "
            );


        let box =
          document.getElementById(
            "groupParticipantBox"
          );


        if (!box) {

          box =
            document.createElement(
              "div"
            );

          box.id =
            "groupParticipantBox";

          box.style.marginTop =
            "12px";

          box.style.display =
            "grid";

          box.style.gap =
            "8px";


          studentName.insertAdjacentElement(
            "afterend",
            box
          );

        }


        box.innerHTML =
          participants
            .map(
              (
                participant,
                index
              ) => `
                <div
                  style="
                    padding:10px 12px;
                    border:1px solid rgba(255,255,255,.15);
                    border-radius:10px;
                    background:rgba(0,0,0,.14);
                  "
                >
                  <div
                    style="
                      font-weight:800;
                      color:#fff;
                    "
                  >
                    ${index + 1}.
                    ${escapeHtml(
                      participant.fullName
                      ||
                      participant.studentCode
                    )}
                  </div>

                  <div
                    style="
                      margin-top:4px;
                      color:#94a8c6;
                      font-size:13px;
                    "
                  >
                    ${
                      participant.studentCode
                        ?
                        (
                          "Mã HV: "
                          +
                          escapeHtml(
                            participant.studentCode
                          )
                          +
                          " · "
                        )
                        :
                        ""
                    }

                    Đăng ký:
                    ${escapeHtml(
                      participant.registrationCode
                    )}
                  </div>
                </div>
              `
            )
            .join("");


        if (registrationLine) {

          registrationLine.textContent =
            "Đăng ký nhóm: "
            +
            participants
              .map(
                item =>
                  item.registrationCode
              )
              .join(
                " + "
              );

        }

      }


      /*
        Render ngay và render lại sau một chút
        để chắc chắn script cũ không ghi đè.
      */

      renderGroupStudents();

      setTimeout(
        renderGroupStudents,
        500
      );

      setTimeout(
        renderGroupStudents,
        1500
      );


      console.log(
        "GROUP SESSION OK:",
        {
          sessionId,
          groupId,
          participants
        }
      );

    }
    catch (error) {

      console.error(
        "GROUP SESSION DETAIL:",
        error
      );

    }

  }
);
</script>
</body>
</html>
