<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js?v=20261019-keep30"></script>
<script src="./session-detail-v2.js"></script>
<script>
window.addEventListener(
  "load",
  async function () {

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !window.supabase ||
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {
      return;
    }

    const sbGroupDetail =
      window.PICKDEE_SUPABASE ||
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const sessionId =
      Number(
        params.get("id")
      );

    if (
      !Number.isFinite(sessionId) ||
      sessionId <= 0
    ) {
      return;
    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================================
       ĐỢI session-detail-v2.js TẢI XONG
    ========================================== */

    for (
      let i = 0;
      i < 50;
      i++
    ) {

      const code =
        document.getElementById(
          "sessionCode"
        )?.textContent?.trim();

      const student =
        document.getElementById(
          "studentName"
        )?.textContent?.trim();

      if (
        code &&
        code !== "Đang tải..." &&
        student &&
        student !== "—"
      ) {
        break;
      }

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );
    }


    try {

      /* =========================================
         1. LẤY SESSION
      ========================================== */

      const {
        data: sessionRow,
        error: sessionError
      } =
        await sbGroupDetail
          .from("class_sessions")
          .select(`
            id,
            training_group_id
          `)
          .eq(
            "id",
            sessionId
          )
          .maybeSingle();


      if (sessionError) {
        throw sessionError;
      }


      if (
        !sessionRow ||
        !sessionRow.training_group_id
      ) {

        /*
          Đây là lịch cá nhân.
          Không thay đổi gì.
        */

        return;
      }


      const groupId =
        Number(
          sessionRow.training_group_id
        );


      /* =========================================
         2. LẤY 2 REGISTRATION CỦA NHÓM
      ========================================== */

      const {
        data: memberRows,
        error: memberError
      } =
        await sbGroupDetail
          .from(
            "training_group_members"
          )
          .select(`
            registration_id
          `)
          .eq(
            "group_id",
            groupId
          );


      if (memberError) {
        throw memberError;
      }


      const registrationIds =
        [
          ...new Set(
            (memberRows || [])
              .map(
                item =>
                  Number(
                    item.registration_id
                  )
              )
              .filter(
                id =>
                  Number.isFinite(id) &&
                  id > 0
              )
          )
        ];


      if (
        registrationIds.length < 2
      ) {

        throw new Error(
          "Nhóm chưa đủ 2 đăng ký."
        );
      }


      /* =========================================
         3. REGISTRATIONS
      ========================================== */

      const {
        data: registrations,
        error: registrationError
      } =
        await sbGroupDetail
          .from("registrations")
          .select(`
            id,
            registration_code,
            student_id
          `)
          .in(
            "id",
            registrationIds
          );


      if (registrationError) {
        throw registrationError;
      }


      const studentIds =
        [
          ...new Set(
            (registrations || [])
              .map(
                item =>
                  Number(
                    item.student_id
                  )
              )
              .filter(
                id =>
                  Number.isFinite(id) &&
                  id > 0
              )
          )
        ];


      /* =========================================
         4. STUDENTS
      ========================================== */

      const {
        data: students,
        error: studentError
      } =
        await sbGroupDetail
          .from("students")
          .select(`
            id,
            student_code,
            full_name
          `)
          .in(
            "id",
            studentIds
          );


      if (studentError) {
        throw studentError;
      }


      const studentMap =
        new Map(
          (students || [])
            .map(
              student => [
                Number(student.id),
                student
              ]
            )
        );


      const participants =
        (registrations || [])
          .map(
            registration => {

              const student =
                studentMap.get(
                  Number(
                    registration.student_id
                  )
                )
                ||
                {};

              return {

                registrationId:
                  Number(
                    registration.id
                  ),

                registrationCode:
                  registration.registration_code
                  ||
                  "",

                studentCode:
                  student.student_code
                  ||
                  "",

                fullName:
                  student.full_name
                  ||
                  ""

              };

            }
          )
          .sort(
            (a,b) =>
              a.registrationId
              -
              b.registrationId
          );


      if (
        participants.length < 2
      ) {

        throw new Error(
          "Không tải đủ 2 Học viên."
        );
      }


      /* =========================================
         5. RENDER
      ========================================== */

      function renderGroupStudents() {

        const studentName =
          document.getElementById(
            "studentName"
          );

        const registrationLine =
          document.getElementById(
            "registrationLine"
          );


        if (!studentName) {
          return;
        }


        const item =
          studentName.closest(
            ".item"
          );


        const label =
          item?.querySelector(
            ".label"
          );


        if (label) {

          label.textContent =
            "Học viên trong nhóm";

        }


        studentName.textContent =
          participants
            .map(
              item =>
                item.fullName
                ||
                item.studentCode
            )
            .join(
              " + "
            );


        let box =
          document.getElementById(
            "groupParticipantBox"
          );


        if (!box) {

          box =
            document.createElement(
              "div"
            );

          box.id =
            "groupParticipantBox";

          box.style.marginTop =
            "12px";

          box.style.display =
            "grid";

          box.style.gap =
            "8px";


          studentName.insertAdjacentElement(
            "afterend",
            box
          );

        }


        box.innerHTML =
          participants
            .map(
              (
                participant,
                index
              ) => `
                <div
                  style="
                    padding:10px 12px;
                    border:1px solid rgba(255,255,255,.15);
                    border-radius:10px;
                    background:rgba(0,0,0,.14);
                  "
                >
                  <div
                    style="
                      font-weight:800;
                      color:#fff;
                    "
                  >
                    ${index + 1}.
                    ${escapeHtml(
                      participant.fullName
                      ||
                      participant.studentCode
                    )}
                  </div>

                  <div
                    style="
                      margin-top:4px;
                      color:#adadad;
                      font-size:13px;
                    "
                  >
                    ${
                      participant.studentCode
                        ?
                        (
                          "Mã HV: "
                          +
                          escapeHtml(
                            participant.studentCode
                          )
                          +
                          " · "
                        )
                        :
                        ""
                    }

                    Đăng ký:
                    ${escapeHtml(
                      participant.registrationCode
                    )}
                  </div>
                </div>
              `
            )
            .join("");


        if (registrationLine) {

          registrationLine.textContent =
            "Đăng ký nhóm: "
            +
            participants
              .map(
                item =>
                  item.registrationCode
              )
              .join(
                " + "
              );

        }

      }


      /*
        Render ngay và render lại sau một chút
        để chắc chắn script cũ không ghi đè.
      */

      renderGroupStudents();

      setTimeout(
        renderGroupStudents,
        500
      );

      setTimeout(
        renderGroupStudents,
        1500
      );


      console.log(
        "GROUP SESSION OK:",
        {
          sessionId,
          groupId,
          participants
        }
      );

    }
    catch (error) {

      console.error(
        "GROUP SESSION DETAIL:",
        error
      );

    }

  }
);
</script>
  <script>
window.addEventListener(
  "load",
  async function () {

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !window.supabase ||
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {
      return;
    }


    const attendanceSb =
      window.PICKDEE_SUPABASE ||
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const sessionId =
      Number(
        params.get("id")
      );


    if (
      !Number.isFinite(sessionId) ||
      sessionId <= 0
    ) {
      return;
    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =====================================================
       1. KIỂM TRA SESSION NHÓM
    ====================================================== */

    const {
      data: sessionRow,
      error: sessionError
    } =
      await attendanceSb
        .from("class_sessions")
        .select(`
          id,
          training_group_id,
          status
        `)
        .eq(
          "id",
          sessionId
        )
        .maybeSingle();


    if (
      sessionError ||
      !sessionRow ||
      !sessionRow.training_group_id
    ) {

      /*
        Buổi cá nhân:
        giữ nguyên 2 nút cũ.
      */

      return;
    }


    const groupId =
      Number(
        sessionRow.training_group_id
      );


    /* =====================================================
       2. BUỔI NHÓM -> ẨN 2 NÚT XỬ LÝ CHUNG CŨ
    ====================================================== */

    const completeBtn =
      document.getElementById(
        "completeBtn"
      );

    const absentBtn =
      document.getElementById(
        "absentBtn"
      );


    const oldActions =
      completeBtn
        ?.closest(
          ".actions"
        );


    if (oldActions) {

      oldActions.style.display =
        "none";

    }


    /* =====================================================
       3. LẤY THÀNH VIÊN NHÓM
    ====================================================== */

    const {
      data: memberRows,
      error: memberError
    } =
      await attendanceSb
        .from(
          "training_group_members"
        )
        .select(`
          registration_id
        `)
        .eq(
          "group_id",
          groupId
        );


    if (memberError) {

      console.error(
        "GROUP ATTENDANCE MEMBERS:",
        memberError
      );

      return;
    }


    const registrationIds =
      [
        ...new Set(
          (memberRows || [])
            .map(
              item =>
                Number(
                  item.registration_id
                )
            )
            .filter(
              id =>
                Number.isFinite(id) &&
                id > 0
            )
        )
      ];


    if (
      registrationIds.length < 2
    ) {
      return;
    }


    const {
      data: registrations,
      error: registrationError
    } =
      await attendanceSb
        .from("registrations")
        .select(`
          id,
          registration_code,
          student_id
        `)
        .in(
          "id",
          registrationIds
        );


    if (registrationError) {

      console.error(
        "GROUP ATTENDANCE REGISTRATIONS:",
        registrationError
      );

      return;
    }


    const studentIds =
      [
        ...new Set(
          (registrations || [])
            .map(
              item =>
                Number(
                  item.student_id
                )
            )
            .filter(
              id =>
                Number.isFinite(id) &&
                id > 0
            )
        )
      ];


    const {
      data: students,
      error: studentError
    } =
      await attendanceSb
        .from("students")
        .select(`
          id,
          student_code,
          full_name
        `)
        .in(
          "id",
          studentIds
        );


    if (studentError) {

      console.error(
        "GROUP ATTENDANCE STUDENTS:",
        studentError
      );

      return;
    }


    const studentMap =
      new Map(
        (students || [])
          .map(
            student => [
              Number(student.id),
              student
            ]
          )
      );


    const participants =
      (registrations || [])
        .map(
          registration => {

            const student =
              studentMap.get(
                Number(
                  registration.student_id
                )
              )
              ||
              {};


            return {

              registrationId:
                Number(
                  registration.id
                ),

              registrationCode:
                registration.registration_code
                ||
                "",

              studentCode:
                student.student_code
                ||
                "",

              fullName:
                student.full_name
                ||
                "Học viên"

            };

          }
        )
        .sort(
          (a,b) =>
            a.registrationId
            -
            b.registrationId
        );


    /* =====================================================
       4. LẤY ĐIỂM DANH HIỆN CÓ
    ====================================================== */

    const attendanceMap =
      new Map();


    try {

      const {
        data: attendanceRows,
        error: attendanceError
      } =
        await attendanceSb
          .from("attendance")
          .select(`
            registration_id,
            attendance_status
          `)
          .eq(
            "session_id",
            sessionId
          );


      if (!attendanceError) {

        (attendanceRows || [])
          .forEach(
            row => {

              attendanceMap.set(
                Number(
                  row.registration_id
                ),
                String(
                  row.attendance_status
                  ||
                  ""
                )
              );

            }
          );

      }

    }
    catch (_) {}


    /* =====================================================
       5. TẠO KHỐI ĐIỂM DANH
    ====================================================== */

    const noteCard =
      document.getElementById(
        "note"
      )
        ?.closest(
          ".card"
        );


    if (!noteCard) {
      return;
    }


    let attendanceBox =
      document.getElementById(
        "groupAttendanceBox"
      );


    if (!attendanceBox) {

      attendanceBox =
        document.createElement(
          "div"
        );

      attendanceBox.id =
        "groupAttendanceBox";

      attendanceBox.style.marginTop =
        "22px";

      attendanceBox.style.paddingTop =
        "20px";

      attendanceBox.style.borderTop =
        "1px solid rgba(255,255,255,.15)";


      noteCard.appendChild(
        attendanceBox
      );

    }


    function renderAttendance() {

      const sessionClosed =
        String(
          sessionRow.status || ""
        ).trim()
        !==
        "Chờ học";


      attendanceBox.innerHTML = `

        <h2
          style="
            margin:0 0 16px;
          "
        >
          ✅ Điểm danh học viên
        </h2>

        <div
          style="
            color:#adadad;
            margin-bottom:16px;
            line-height:1.5;
          "
        >
          Điểm danh riêng từng thành viên.
          Buổi học sẽ tự hoàn tất sau khi đủ
          ${participants.length}/${participants.length}
          học viên được xử lý.
        </div>

        ${participants
          .map(
            (
              participant,
              index
            ) => {

              const currentStatus =
                attendanceMap.get(
                  participant.registrationId
                )
                ||
                "";


              return `

                <div
                  style="
                    margin-bottom:12px;
                    padding:16px;
                    border:1px solid rgba(255,255,255,.15);
                    border-radius:12px;
                    background:rgba(0,0,0,.12);
                  "
                >

                  <div
                    style="
                      font-size:16px;
                      font-weight:800;
                    "
                  >
                    ${index + 1}.
                    ${escapeHtml(
                      participant.fullName
                    )}
                  </div>

                  <div
                    style="
                      margin-top:4px;
                      color:#adadad;
                      font-size:13px;
                    "
                  >
                    ${escapeHtml(
                      participant.studentCode
                    )}
                    ·
                    ${escapeHtml(
                      participant.registrationCode
                    )}
                  </div>


                  <div
                    id="attendance-status-${participant.registrationId}"
                    style="
                      margin-top:9px;
                      font-weight:800;
                      color:${
                        currentStatus === "Có mặt"
                          ?
                          "#ffbb00"
                          :
                          currentStatus === "Vắng"
                            ?
                            "#ff9d9d"
                            :
                            "#c8c8c8"
                      };
                    "
                  >
                    ${
                      currentStatus
                        ?
                        (
                          "Đã điểm danh: "
                          +
                          escapeHtml(
                            currentStatus
                          )
                        )
                        :
                        "Chưa điểm danh"
                    }
                  </div>


                  <div
                    style="
                      display:grid;
                      grid-template-columns:1fr 1fr;
                      gap:10px;
                      margin-top:12px;
                    "
                  >

                    <button
                      type="button"
                      class="group-attendance-btn"
                      data-registration-id="${participant.registrationId}"
                      data-status="Có mặt"
                      ${sessionClosed || currentStatus ? "disabled" : ""}
                      style="
                        background:#ffbb00;
                        color:#0e0e0e;
                      "
                    >
                      ✅ CÓ MẶT
                    </button>


                    <button
                      type="button"
                      class="group-attendance-btn"
                      data-registration-id="${participant.registrationId}"
                      data-status="Vắng"
                      ${sessionClosed ? "disabled" : ""}
                      style="
                        background:#fff;
                        color:#0e0e0e;
                      "
                    >
                      ❌ VẮNG
                    </button>

                  </div>

                </div>
              `;

            }
          )
          .join("")
        }


        <div
          id="groupAttendanceMessage"
          style="
            margin-top:12px;
            font-weight:800;
            line-height:1.5;
          "
        ></div>
      `;


      attendanceBox
        .querySelectorAll(
          ".group-attendance-btn"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              async function () {

                const registrationId =
                  Number(
                    this.dataset
                      .registrationId
                  );


                const attendanceStatus =
                  String(
                    this.dataset.status
                    ||
                    ""
                  );


                const message =
                  document.getElementById(
                    "groupAttendanceMessage"
                  );
if (
  attendanceMap.has(
    registrationId
  )
) {
  return;
}


const selectedParticipant =
  participants.find(
    item =>
      item.registrationId
      ===
      registrationId
  );


const confirmed =
  window.confirm(
    "Xác nhận "
    +
    attendanceStatus
    +
    " cho "
    +
    (
      selectedParticipant?.fullName
      ||
      "Học viên"
    )
    +
    "?"
  );


if (!confirmed) {
  return;
}

                if (
                  !registrationId ||
                  ![
                    "Có mặt",
                    "Vắng"
                  ].includes(
                    attendanceStatus
                  )
                ) {
                  return;
                }


                attendanceBox
                  .querySelectorAll(
                    ".group-attendance-btn"
                  )
                  .forEach(
                    btn => {

                      btn.disabled =
                        true;

                    }
                  );


                if (message) {

                  message.style.color =
                    "#c8c8c8";

                  message.textContent =
                    "Đang ghi nhận điểm danh...";

                }


                try {

                  const {
                    data,
                    error
                  } =
                    await attendanceSb.rpc(
                      "coach_mark_group_attendance",
                      {

                        p_session_id:
                          sessionId,

                        p_registration_id:
                          registrationId,

                        p_attendance_status:
                          attendanceStatus

                      }
                    );


                  if (error) {
                    throw error;
                  }


                  attendanceMap.set(
                    registrationId,
                    attendanceStatus
                  );


                  if (
                    data?.session_finished
                    === true
                  ) {

                    if (message) {

                      message.style.color =
                        "#ffbb00";

                      message.textContent =
                        "✓ Đã điểm danh đủ "
                        +
                        String(
                          data.marked || participants.length
                        )
                        +
                        "/"
                        +
                        String(
                          data.members || participants.length
                        )
                        +
                        ". Trạng thái buổi: "
                        +
                        String(
                          data.session_status
                          ||
                          "Đã xử lý"
                        )
                        +
                        ".";

                    }


                    setTimeout(
                      function () {

                        window.location.reload();

                      },
                      800
                    );


                    return;
                  }


                  if (message) {

                    message.style.color =
                      "#ffbb00";

                    message.textContent =
                      "✓ Đã ghi nhận. Còn "
                      +
                      String(
                        data?.remaining ?? 0
                      )
                      +
                      " học viên chưa điểm danh.";

                  }


                  renderAttendance();

                }
                catch (error) {

                  console.error(
                    "GROUP ATTENDANCE:",
                    error
                  );


                  if (message) {

                    message.style.color =
                      "#ff9d9d";

                    message.textContent =
                      error?.message
                      ||
                      "Không thể điểm danh.";

                  }


                  attendanceBox
                    .querySelectorAll(
                      ".group-attendance-btn"
                    )
                    .forEach(
                      btn => {

                        btn.disabled =
                          false;

                      }
                    );

                }

              }
            );

          }
        );

    }


    renderAttendance();

  }
);
</script>

<script src="/pd-app.js?v=20261020-gold2"></script>
