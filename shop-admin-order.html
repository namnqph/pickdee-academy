<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#071523"
  >
  <title>Chi tiết đơn hàng | PickDee Shop</title>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
  <script src="./config.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #071523;
      color: #fff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      min-height: 100vh;
      padding-bottom:
        calc(110px + env(safe-area-inset-bottom));
    }
    button,
    a {
      touch-action: manipulation;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background:
        rgba(7,21,35,.97);
      border-bottom:
        1px solid rgba(255,255,255,.08);
      backdrop-filter:
        blur(15px);
    }

    .header-inner {
      width:
        min(800px,calc(100% - 20px));
      min-height: 62px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      min-height: 37px;
      padding:
        0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border:
        1px solid rgba(255,255,255,.12);
      color:
        rgba(255,255,255,.74);
      text-decoration: none;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
      margin-right: 52px;
    }

    /* =====================================================
       MAIN
    ====================================================== */

    main {
      width:
        min(800px,calc(100% - 20px));
      margin:
        17px auto 45px;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: #d8ff45;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .1em;
    }

    h1 {
      margin:
        0 0 6px;
      font-size:
        clamp(29px,7vw,42px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .created {
      margin-bottom: 16px;
      color:
        rgba(255,255,255,.42);
      font-size: 10px;
    }

    /* =====================================================
       STATUS
    ====================================================== */

    .status-card {
      margin-bottom: 11px;
      padding: 14px;
      border-radius: 15px;
      border:
        1px solid rgba(216,255,69,.18);
      background:
        linear-gradient(
          145deg,
          #0d1d2f,
          #102633
        );
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-label {
      color:
        rgba(255,255,255,.45);
      font-size: 9px;
      font-weight: 900;
    }

    .status-value {
      margin-top: 4px;
      color: #d8ff45;
      font-size: 15px;
      font-weight: 950;
    }

    .amount {
      color: #d8ff45;
      font-size: 22px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =====================================================
       SECTION
    ====================================================== */

    .section {
      margin-bottom: 11px;
      padding: 15px;
      border-radius: 15px;
      border:
        1px solid rgba(255,255,255,.09);
      background: #0d1d2f;
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 950;
    }

    /* =====================================================
       INFO
    ====================================================== */

    .info-grid {
      display: grid;
      gap: 10px;
    }

    .info-row {
      display: grid;
      grid-template-columns:
        105px minmax(0,1fr);
      gap: 10px;
      align-items: start;
    }

    .info-label {
      color:
        rgba(255,255,255,.42);
      font-size: 9px;
      font-weight: 900;
    }

    .info-value {
      min-width: 0;
      color:
        rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* =====================================================
       ITEMS
    ====================================================== */

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      padding-bottom: 10px;
      display: grid;
      grid-template-columns:
        minmax(0,1fr) auto;
      gap: 10px;
      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    .item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .item-name {
      font-size: 12px;
      font-weight: 950;
    }

    .item-meta {
      margin-top: 4px;
      color:
        rgba(255,255,255,.43);
      font-size: 9px;
      line-height: 1.5;
    }

    .item-total {
      color: #d8ff45;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =====================================================
       MESSAGE
    ====================================================== */

    .message {
      display: none;
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background:
        rgba(255,90,90,.08);
      color: #ffb0b0;
      border:
        1px solid rgba(255,90,90,.25);
    }

    .message.success {
      display: block;
      background:
        rgba(216,255,69,.07);
      color: #d8ff45;
      border:
        1px solid rgba(216,255,69,.25);
    }

    /* =====================================================
       ACTION BAR
    ====================================================== */

    .action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));
      background:
        rgba(7,21,35,.98);
      border-top:
        1px solid rgba(255,255,255,.10);
      backdrop-filter:
        blur(16px);
    }

    .action-inner {
      width:
        min(800px,100%);
      margin: auto;
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 950;
      cursor: pointer;
    }

    .action-primary {
      background: #d8ff45;
      color: #071523;
    }

    .action-secondary {
      background:
        rgba(255,255,255,.07);
      color: #fff;
      border:
        1px solid rgba(255,255,255,.11);
    }

    .action-danger {
      background:
        rgba(255,80,80,.10);
      color: #ffaaaa;
      border:
        1px solid rgba(255,80,80,.23);
    }

    .action-btn:disabled {
      opacity: .45;
      cursor: wait;
    }

    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        55px 20px;
      text-align: center;
      border-radius: 16px;
      border:
        1px dashed rgba(255,255,255,.13);
      color:
        rgba(255,255,255,.5);
      font-size: 12px;
    }

    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:520px) {
      .info-row {
        grid-template-columns:
          88px minmax(0,1fr);
      }

      .status-card {
        align-items: flex-end;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a
      href="./shop-admin"
      class="brand"
    >
      PickDee<span>Shop</span>
    </a>

    <a
      href="./shop-admin"
      class="back"
    >
      ← ĐƠN HÀNG
    </a>
  </div>
</header>

<main>
  <div
    id="page"
    class="state"
  >
    Đang tải đơn hàng...
  </div>
</main>

<div
  id="actionBar"
  class="action-bar"
  style="display:none;"
>
  <div
    id="actions"
    class="action-inner"
  ></div>
</div>

<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const page =
    document.getElementById(
      "page"
    );

  const actionBar =
    document.getElementById(
      "actionBar"
    );

  const actions =
    document.getElementById(
      "actions"
    );

  const params =
    new URLSearchParams(
      location.search
    );

  const orderId =
    params.get(
      "id"
    );

  let currentOrder = null;

  let currentItems = [];


  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showState(
      "Không tải được hệ thống Shop."
    );

    return;

  }

  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );

  if (!orderId) {

    showState(
      "Không tìm thấy mã đơn."
    );

    return;

  }


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }

  function formatTime(value) {

    if (!value) {
      return "-";
    }

    try {

      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(
        new Date(value)
      );

    }
    catch (_) {

      return value;

    }

  }

  function valueFrom(
    object,
    keys
  ) {

    for (
      const key
      of keys
    ) {

      if (
        object
        &&
        object[key] !== null
        &&
        object[key] !== undefined
        &&
        String(object[key]).trim() !== ""
      ) {

        return object[key];

      }

    }

    return "";

  }

  function statusLabel(status) {

    const map = {

      new:
        "ĐƠN MỚI",

      confirmed:
        "ĐÃ XÁC NHẬN",

      packing:
        "ĐANG ĐÓNG GÓI",

      shipping:
        "ĐÃ GIAO ĐVVC",

      completed:
        "HOÀN TẤT",

      cancelled:
        "ĐÃ HỦY"

    };

    return (
      map[status]
      ||
      status
      ||
      "-"
    );

  }

  function paymentLabel(method) {

    return (
      method === "bank_transfer"
        ?
          "Chuyển khoản"
        :
          "Thanh toán khi nhận hàng"
    );

  }

  function paymentStatusLabel(status) {

    const map = {

      paid:
        "Đã thanh toán",

      unpaid:
        "Chưa thanh toán",

      refunded:
        "Đã hoàn tiền",

      partial:
        "Thanh toán một phần"

    };

    return (
      map[status]
      ||
      status
      ||
      "Chưa thanh toán"
    );

  }

  function paymentReviewStatusLabel(status) {

    const map = {

      not_submitted:
        "Chưa gửi bill",

      submitted:
        "Chờ xác nhận",

      verified:
        "Đã xác nhận",

      rejected:
        "Bill bị từ chối"

    };

    return (
      map[status]
      ||
      status
      ||
      "Chưa gửi bill"
    );

  }

  function orderSourceLabel(source) {

    const raw =
      String(
        source || ""
      )
        .trim();

    const key =
      raw.toLowerCase();

    const map = {

      zalo:
        "ZALO",

      tiktok:
        "TIKTOK",

      facebook:
        "FACEBOOK",

      phone:
        "ĐIỆN THOẠI",

      walk_in:
        "KHÁCH TRỰC TIẾP",

      other:
        "KHÁC",

      web:
        "WEBSITE",

      website:
        "WEBSITE"

    };

    return (
      map[key]
      ||
      raw
      ||
      "Chưa có"
    );

  }

  function itemsHavePickleballBall(
    items
  ) {

    const knownBallKeys =
      [
        "lt48",
        "ppa life time",
        "toniker nexus",
        "toniker mate pro"
      ];

    return (
      Array.isArray(items)
      &&
      items.some(
        function (item) {

          const name =
            String(
              item?.product_name || ""
            )
              .trim()
              .toLocaleLowerCase(
                "vi-VN"
              );

          if (
            name.startsWith(
              "bóng "
            )
          ) {

            return true;

          }

          return knownBallKeys.some(
            function (key) {

              return name.includes(
                key
              );

            }
          );

        }
      )
    );

  }
  function itemsHavePaddle(
    items
  ) {

    return (
      Array.isArray(items)
      &&
      items.some(
        function (item) {

          const text =
            [
              item?.product_name,
              item?.variant_name,
              item?.sku
            ]
              .filter(Boolean)
              .join(" ")
              .toLocaleLowerCase(
                "vi-VN"
              );

          return (
            text.includes("vợt")
            ||
            text.includes("paddle")
            ||
            text.includes("esson")
            ||
            text.includes("ess/on")
          );

        }
      )
    );

  }


  function buildSupplierOrderText() {

    const o =
      currentOrder
      ||
      {};

    const addressLine =
      valueFrom(
        o,
        [
          "address_line",
          "shipping_address_line",
          "delivery_address",
          "address"
        ]
      );

    const ward =
      valueFrom(
        o,
        [
          "ward",
          "shipping_ward"
        ]
      );

    const province =
      valueFrom(
        o,
        [
          "province",
          "shipping_province",
          "city"
        ]
      );

    const legacyAddress =
      valueFrom(
        o,
        [
          "legacy_address"
        ]
      );

    const fullAddress =
      [
        addressLine,
        ward,
        province
      ]
        .filter(Boolean)
        .join(", ");

    const itemsText =
      (
        currentItems
        ||
        []
      )
        .map(
          function (item,index) {

            const quantity =
              Number(
                item.quantity
                ||
                1
              );

            const variantName =
              String(
                item.variant_name
                ||
                ""
              )
                .trim();

            const showVariantName =
              variantName
              &&
              variantName.toLocaleLowerCase(
                "vi-VN"
              )
              !==
              "mặc định";

            return [
              `${index + 1}. ${item.product_name || "Sản phẩm"}`,
              showVariantName
                ?
                  `   Phân loại: ${variantName}`
                :
                  "",
              `   Số lượng: ${quantity}`
            ]
              .filter(Boolean)
              .join("\n");

          }
        )
        .join("\n\n");

    return [
      "ĐƠN VỢT PICKDEE",
      "",
      "SẢN PHẨM:",
      itemsText || "-",
      "",
      "THÔNG TIN KHÁCH NHẬN:",
      `Họ tên: ${o.customer_name || "-"}`,
      `SĐT: ${o.phone || "-"}`,
      `Địa chỉ: ${fullAddress || "-"}`,
      legacyAddress
        ?
          `Địa chỉ cũ trước sáp nhập: ${legacyAddress}`
        :
          "",
      "",
      "GHI CHÚ KHÁCH:",
      valueFrom(
        o,
        [
          "customer_note",
          "note",
          "notes"
        ]
      )
      ||
      "-",
      "",
      "YÊU CẦU:",
      "Nhãn hàng đóng hàng và gửi trực tiếp cho khách.",
      "Khi có mã vận đơn, vui lòng gửi lại để PickDee cập nhật cho khách."
    ]
      .filter(
        function (line) {

          return line !== "";

        }
      )
      .join("\n");

  }
  function showState(text) {

    page.className =
      "state";

    page.innerHTML =
      escapeHtml(text);

    actionBar.style.display =
      "none";

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function render() {

    const o =
      currentOrder;

    const addressLine =
      valueFrom(
        o,
        [
          "address_line",
          "shipping_address_line",
          "delivery_address",
          "address"
        ]
      );

    const legacyAddress =
      valueFrom(
        o,
        [
          "legacy_address"
        ]
      );

    const ward =
      valueFrom(
        o,
        [
          "ward",
          "shipping_ward"
        ]
      );

    const province =
      valueFrom(
        o,
        [
          "province",
          "shipping_province",
          "city"
        ]
      );

    const fullAddress =
      [
        addressLine,
        ward,
        province
      ]
        .filter(Boolean)
        .join(", ");

    const email =
      valueFrom(
        o,
        [
          "email",
          "customer_email"
        ]
      );

    const note =
      valueFrom(
        o,
        [
          "customer_note",
          "note",
          "notes"
        ]
      );

    const orderSource =
      valueFrom(
        o,
        [
          "order_source",
          "source",
          "channel"
        ]
      );

    const internalNote =
      valueFrom(
        o,
        [
          "internal_note"
        ]
      );

    const shippingProvider =
      valueFrom(
        o,
        [
          "shipping_provider"
        ]
      );

    const trackingCode =
      valueFrom(
        o,
        [
          "tracking_code"
        ]
      );

    const shippingFee =
      valueFrom(
        o,
        [
          "shipping_fee"
        ]
      );

    const shippingNote =
      valueFrom(
        o,
        [
          "shipping_note"
        ]
      );

    const shippingStatus =
      valueFrom(
        o,
        [
          "shipping_status"
        ]
      )
      ||
      "not_shipped";
    const hasPaddleOrder =
      itemsHavePaddle(
        currentItems
      );

    const paddleFulfillmentType =
      valueFrom(
        o,
        [
          "paddle_fulfillment_type"
        ]
      )
      ||
      "pickdee_self_ship";

    const paddleSupplierName =
      valueFrom(
        o,
        [
          "paddle_supplier_name"
        ]
      );

 

    const paddleSupplierNote =
      valueFrom(
        o,
        [
          "paddle_supplier_note"
        ]
      );

    const paddleSupplierSentAt =
      valueFrom(
        o,
        [
          "paddle_supplier_sent_at"
        ]
      );
    const paymentProofPath =
      valueFrom(
        o,
        [
          "payment_proof_path"
        ]
      );

    const paymentProofUploadedAt =
      valueFrom(
        o,
        [
          "payment_proof_uploaded_at"
        ]
      );

    const paymentReviewStatus =
      valueFrom(
        o,
        [
          "payment_review_status"
        ]
      )
      ||
      "not_submitted";

    const paymentConfirmedAt =
      valueFrom(
        o,
        [
          "payment_confirmed_at"
        ]
      );

    const hasPaymentProof =
      Boolean(
        paymentProofPath
      );
       const isOrderCancelled =
      o.order_status
        ===
      "cancelled";


    const canConfirmBankTransfer =
      o.payment_method
        ===
      "bank_transfer"
      &&
      !isOrderCancelled
      &&
      hasPaymentProof
      &&
      paymentReviewStatus
        ===
      "submitted"
      &&
      o.payment_status
        !==
      "paid";

    const hasPickleballBall =
      itemsHavePickleballBall(
        currentItems
      );

    const shippingPending =
      hasPickleballBall
      &&
      Number(
        o.shipping_carrier_cost || 0
      ) <= 0
      &&
      Number(
        shippingFee || 0
      ) <= 0
      &&
      o.order_status !== "shipping";
    const productTotal =
      currentItems.reduce(
        function (
          sum,
          item
        ) {

          const unitPrice =
            Number(
              item.unit_price
              ??
              item.price
              ??
              0
            );

          const quantity =
            Number(
              item.quantity
              ??
              0
            );

          const lineTotal =
            Number(
              item.line_total
              ??
              (
                unitPrice
                *
                quantity
              )
            );

          return (
            sum
            +
            lineTotal
          );

        },
        0
      );


    const discountNote =
      valueFrom(
        o,
        [
          "order_discount_note"
        ]
      );


    const rawDiscountAmount =
      Math.max(
        0,
        Number(
          o.order_discount_amount || 0
        )
      );


    const discountAmount =
      Math.min(
        productTotal,
        rawDiscountAmount
      );


    const discountedProductTotal =
      Math.max(
        0,
        productTotal
        -
        discountAmount
      );


    const shippingFeeNumber =
      Math.max(
        0,
        Number(
          shippingFee || 0
        )
      );


    const customerTotal =
      discountedProductTotal
      +
      shippingFeeNumber;
    const itemHtml =
      currentItems
        .map(
          function (item) {

            const unitPrice =
              Number(
                item.unit_price
                ??
                item.price
                ??
                0
              );

            const quantity =
              Number(
                item.quantity
                ??
                0
              );

            const lineTotal =
              Number(
                item.line_total
                ??
                (
                  unitPrice
                  *

       async function setupPaymentProofReview() {

      if (
        currentOrder.payment_method
          !==
        "bank_transfer"
        ||
        !paymentProofPath
      ) {

        return;

      }

      const loading =
        document.getElementById(
          "paymentProofLoading"
        );

      let link =
        document.getElementById(
          "paymentProofLink"
        );

      const image =
        document.getElementById(
          "paymentProofImage"
        );

      const errorBox =
        document.getElementById(
          "paymentProofLoadError"
        );

      if (
        image
      ) {

        image.removeAttribute(
          "src"
        );

        image.style.display =
          "none";

        image.style.pointerEvents =
          "none";

      }

      if (
        errorBox
      ) {

        errorBox.style.display =
          "none";

        errorBox.textContent =
          "";

      }

      if (
        loading
      ) {

        loading.style.display =
          "block";

        loading.innerHTML =
          `
            <div
              style="
                padding:12px;
                border-radius:10px;
                border:1px solid rgba(216,255,69,.18);
                background:rgba(216,255,69,.06);
                color:#d8ff45;
                font-size:11px;
                font-weight:900;
                text-align:center;
                line-height:1.5;
              "
            >
              BILL ĐÃ GỬI ✅<br>
              Không tải ảnh bill trong trang để tránh lag.
            </div>
          `;

      }

      try {

        const {
          data:
            signedData,
          error:
            signedError
        } =
          await sb
            .storage
            .from(
              "shop-payment-proofs"
            )
            .createSignedUrl(
              paymentProofPath,
              3600
            );

        if (
          signedError
        ) {

          throw signedError;

        }

        const signedUrl =
          String(
            signedData?.signedUrl
            ||
            ""
          )
            .trim();

        if (
          !signedUrl
        ) {

          throw new Error(
            "Không tạo được link xem bill."
          );

        }

        if (
          !link
          &&
          loading
        ) {

          link =
            document.createElement(
              "a"
            );

          link.id =
            "paymentProofLink";

          loading.insertAdjacentElement(
            "afterend",
            link
          );

        }

        if (
          link
        ) {

          link.href =
            signedUrl;

          link.target =
            "_blank";

          link.rel =
            "noopener";

          link.style.display =
            "block";

          link.style.textDecoration =
            "none";

          link.style.marginTop =
            "10px";

          link.style.pointerEvents =
            "auto";

          link.innerHTML =
            `
              <div
                style="
                  padding:14px 12px;
                  border-radius:11px;
                  border:1px solid rgba(216,255,69,.24);
                  background:rgba(216,255,69,.08);
                  color:#d8ff45;
                  font-size:11px;
                  font-weight:950;
                  text-align:center;
                "
              >
                MỞ BILL GỐC
              </div>
            `;

        }

      }
      catch (error) {

        console.error(
          "PAYMENT PROOF LINK ERROR:",
          error
        );

        if (
          errorBox
        ) {

          errorBox.style.display =
            "block";

          errorBox.textContent =
            error?.message
            ||
            "Không tạo được link xem bill.";

        }

      }

    }
    async function confirmBankTransferPayment() {

      const button =
        document.getElementById(
          "confirmBankTransferBtn"
        );

      const floatingButton =
        document.getElementById(
          "confirmBankTransferFloatingBtn"
        );

      const messageBox =
        document.getElementById(
          "paymentProofAdminMessage"
        );

      if (
        !button
        &&
        !floatingButton
      ) {

        return;

      }
      if (
        currentOrder?.order_status
          ===
        "cancelled"
      ) {

        [
          button,
          floatingButton
        ].forEach(
          function (btn) {

            if (btn) {

              btn.disabled =
                true;

              btn.textContent =
                "ĐƠN ĐÃ HỦY";

            }

          }
        );

        if (
          messageBox
        ) {

          messageBox.className =
            "message error";

          messageBox.textContent =
            "Đơn đã hủy, không thể xác nhận thanh toán.";

        }

        return;

      }
      const ok =
        window.confirm(
          "Xác nhận PickDee đã nhận đúng tiền của đơn này?"
        );

      if (!ok) {

        return;

      }

      [
        button,
        floatingButton
      ].forEach(
        function (btn) {

          if (
            btn
          ) {

            btn.disabled =
              true;

            btn.textContent =
              "ĐANG XÁC NHẬN...";

          }

        }
      );

      try {

        const {
          data,
          error
        } =
          await sb.rpc(
            "shop_confirm_bank_transfer_payment",
            {
              p_order_id:
                Number(
                  currentOrder.id
                )
            }
          );

        if (error) {

          throw error;

        }

        if (
          !data?.success
        ) {

          throw new Error(
            "Không xác nhận được thanh toán."
          );

        }

        const {
          data:
            refreshedOrder,
          error:
            refreshError
        } =
          await sb
            .from(
              "shop_orders"
            )
            .select("*")
            .eq(
              "id",
              currentOrder.id
            )
            .single();

        if (
          refreshError
        ) {

          throw refreshError;

        }

        currentOrder =
          refreshedOrder;

        const oldFloating =
          document.getElementById(
            "confirmBankTransferFloatingBtn"
          );

        if (
          oldFloating
        ) {

          oldFloating.remove();

        }

        render();

        const refreshedMessage =
          document.getElementById(
            "paymentProofAdminMessage"
          );

        if (
          refreshedMessage
        ) {

          refreshedMessage.className =
            "message success";

          refreshedMessage.textContent =
            "✓ Đã xác nhận thanh toán chuyển khoản.";

        }

      }
      catch (error) {

        console.error(
          "CONFIRM BANK TRANSFER ERROR:",
          error
        );

        if (
          messageBox
        ) {

          messageBox.className =
            "message error";

          messageBox.textContent =
            error?.message
            ||
            "Không xác nhận được thanh toán.";

        }

        [
          button,
          floatingButton
        ].forEach(
          function (btn) {

            if (
              btn
            ) {

              btn.disabled =
                false;

              btn.textContent =
                "XÁC NHẬN ĐÃ THANH TOÁN";

            }

          }
        );

      }

    }


    function setupPaymentProofActions() {

      setupPaymentProofReview();

      const oldFloating =
        document.getElementById(
          "confirmBankTransferFloatingBtn"
        );

      if (
        oldFloating
      ) {

        oldFloating.remove();

      }

      const button =
        document.getElementById(
          "confirmBankTransferBtn"
        );

      if (
        !button
      ) {

        return;

      }

      button.style.position =
        "relative";

      button.style.zIndex =
        "999999";

      button.style.pointerEvents =
        "auto";

      button.style.cursor =
        "pointer";

      button.style.touchAction =
        "manipulation";

      const floatingButton =
        button.cloneNode(
          true
        );

      floatingButton.id =
        "confirmBankTransferFloatingBtn";

      floatingButton.style.position =
        "fixed";

      floatingButton.style.left =
        "12px";

      floatingButton.style.right =
        "12px";

      floatingButton.style.bottom =
        "84px";

      floatingButton.style.zIndex =
        "2147483647";

      floatingButton.style.width =
        "auto";

      floatingButton.style.minHeight =
        "52px";

      floatingButton.style.borderRadius =
        "13px";

      floatingButton.style.boxShadow =
        "0 12px 34px rgba(0,0,0,.45)";

      floatingButton.style.pointerEvents =
        "auto";

      floatingButton.style.touchAction =
        "manipulation";

      floatingButton.textContent =
        "XÁC NHẬN ĐÃ THANH TOÁN";

      document.body.appendChild(
        floatingButton
      );

      let isConfirming =
        false;

      function handleConfirm(
        event
      ) {

        if (
          event
        ) {

          event.preventDefault();

          event.stopPropagation();

        }

        if (
          isConfirming
        ) {

          return;

        }

        isConfirming =
          true;

        Promise
          .resolve(
            confirmBankTransferPayment()
          )
          .finally(
            function () {

              isConfirming =
                false;

            }
          );

      }

      [
        button,
        floatingButton
      ].forEach(
        function (btn) {

          btn.addEventListener(
            "click",
            handleConfirm
          );

          btn.addEventListener(
            "touchend",
            handleConfirm,
            {
              passive:
                false
            }
          );

        }
      );

    }

  /* =====================================================

  function renderActions() {

    const status =
      currentOrder.order_status;

    let html =
      "";


    /* =====================================================
       ĐƠN MỚI
    ====================================================== */

    if (
      status === "new"
    ) {

      html = `

        <button
          class="action-btn action-danger"
          data-status="cancelled"
        >
          HỦY ĐƠN
        </button>

        <button
          class="action-btn action-primary"
          data-status="confirmed"
        >
          XÁC NHẬN ĐƠN
        </button>

      `;

    }


    /* =====================================================
       ĐÃ XÁC NHẬN
    ====================================================== */

    if (
      status === "confirmed"
    ) {

      html = `

        <button
          class="action-btn action-danger"
          data-status="cancelled"
        >
          HỦY ĐƠN
        </button>

        <button
          class="action-btn action-primary"
          data-status="packing"
        >
          BẮT ĐẦU ĐÓNG GÓI
        </button>

      `;

    }


    /* =====================================================
       ĐANG ĐÓNG GÓI

       Không còn nút ĐÃ GIAO ĐVVC.
       Khi thực tế bàn giao hàng:
       chọn Đã gửi hàng + hãng vận chuyển + mã vận đơn
       rồi bấm LƯU VẬN CHUYỂN.
    ====================================================== */

    if (
      status === "packing"
    ) {

      html = `

        <button
          class="action-btn action-danger"
          data-status="cancelled"
          style="grid-column:1 / -1;"
        >
          HỦY ĐƠN
        </button>

      `;

    }


    /* =====================================================
       ĐÃ GIAO ĐVVC = KẾT THÚC QUY TRÌNH PICKDEE

       Không còn:
       - ĐÃ GIAO ĐVVC
       - HOÀN TẤT ĐƠN
    ====================================================== */

    if (
      status === "shipping"
      ||
      status === "completed"
      ||
      status === "cancelled"
    ) {

      actionBar.style.display =
        "none";

      return;

    }

    actions.innerHTML =
      html;

    actionBar.style.display =
      "block";

    actions
      .querySelectorAll(
        "[data-status]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              changeStatus(
                button.dataset.status
              );

            }
          );

        }
      );

  }


  /* =====================================================
     UPDATE STATUS
  ====================================================== */

  async function changeStatus(
    nextStatus
  ) {

    if (
      nextStatus === "cancelled"
    ) {

      const ok =
        window.confirm(
          "Anh chắc chắn muốn hủy đơn này?"
        );

      if (!ok) {

        return;

      }

    }

    actions
      .querySelectorAll(
        "button"
      )
      .forEach(
        button =>
          button.disabled = true
      );

    try {

      const updateData = {

        order_status:
          nextStatus

      };

      if (
        nextStatus === "completed"
        &&
        currentOrder.payment_method
          !==
        "bank_transfer"
      ) {

        updateData.payment_status =
          "paid";

      }

      const {
        data,
        error
      } =
        await sb
          .from(
            "shop_orders"
          )
          .update(
            updateData
          )
          .eq(
            "id",
            currentOrder.id
          )
          .select("*")
          .single();

      if (error) {

        console.error(
          "ORDER STATUS ERROR:",
          error
        );

        throw error;

      }

      currentOrder =
        data;

      render();

      const message =
        document.getElementById(
          "message"
        );

      if (
        message
      ) {

        message.className =
          "message success";

        message.textContent =
          "✓ Đã cập nhật trạng thái đơn hàng.";

      }

    }
    catch (error) {

      console.error(
        "UPDATE ORDER ERROR:",
        error
      );

      const message =
        document.getElementById(
          "message"
        );

      if (
        message
      ) {

        message.className =
          "message error";

        message.textContent =
          error?.message
          ||
          "Không cập nhật được đơn hàng.";

      }

      renderActions();

    }

  }


  /* =====================================================
     AUTH
  ====================================================== */

  async function requireShopAccess() {

    const {
      data: sessionData
    } =
      await sb.auth.getSession();

    const user =
      sessionData?.session?.user;

   if (!user) {

  location.href =
    "/login";

  return false;

}

    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_user_roles"
        )
        .select(
          "role,is_active"
        )
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        );

    if (error) {

      throw new Error(
        "Không kiểm tra được quyền Shop."
      );

    }

    const allowed =
      (data || [])
        .some(
          item =>
            [
              "owner",
              "shop_admin",
              "shop_staff"
            ]
              .includes(
                item.role
              )
        );

    if (!allowed) {

      throw new Error(
        "Tài khoản chưa có quyền quản lý Shop."
      );

    }

    return true;

  }

      [];


    /*
      Gắn dữ liệu vận hành mở rộng
      trực tiếp vào currentOrder
      để render() và event handlers
      dùng chung mà không cần thêm global.
    */

    currentOrder._supplierSettlements =
      settlementResult.data
      ||
      [];


    currentOrder._shopSuppliers =
      supplierResult.data
      ||
      [];


    render();

  }
  catch (error) {

    console.error(
      "SHOP ORDER DETAIL ERROR:",
      error
    );


    showState(
      error?.message
      ||
      "Không tải được đơn hàng."
    );

  }

}

  loadOrder();

})();

</script>

<script src="/shop-notifications.js?v=20261008-1"></script>

</body>
