<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>
  <meta
    name="theme-color"
    content="#071523"
  >
  <title>Chi tiết đơn hàng | PickDee Shop</title>
  <link rel="preconnect" href="https://snxztjsluhdibrklougo.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
  <script src="./config.js?v=20261019-keep30"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #071523;
      color: #fff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      min-height: 100vh;
      padding-bottom:
        calc(110px + env(safe-area-inset-bottom));
    }
    button,
    a {
      touch-action: manipulation;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background:
        rgba(7,21,35,.97);
      border-bottom:
        1px solid rgba(255,255,255,.08);
      backdrop-filter:
        blur(15px);
    }

    .header-inner {
      width:
        min(800px,calc(100% - 20px));
      min-height: 62px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      min-height: 37px;
      padding:
        0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border:
        1px solid rgba(255,255,255,.12);
      color:
        rgba(255,255,255,.74);
      text-decoration: none;
      font-size:13px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =====================================================
       MAIN
    ====================================================== */

    main {
      width:
        min(800px,calc(100% - 20px));
      margin:
        17px auto 45px;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: #d8ff45;
      font-size:13px;
      font-weight: 950;
      letter-spacing: .1em;
    }

    h1 {
      margin:
        0 0 6px;
      font-size:
        clamp(29px,7vw,42px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .created {
      margin-bottom: 16px;
      color:
        rgba(255,255,255,.42);
      font-size:13px;
    }

    /* =====================================================
       STATUS
    ====================================================== */

    .status-card {
      margin-bottom: 11px;
      padding: 14px;
      border-radius: 15px;
      border:
        1px solid rgba(216,255,69,.18);
      background:
        linear-gradient(
          145deg,
          #0d1d2f,
          #102633
        );
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-label {
      color:
        rgba(255,255,255,.45);
      font-size:12px;
      font-weight: 900;
    }

    .status-value {
      margin-top: 4px;
      color: #d8ff45;
      font-size: 15px;
      font-weight: 950;
    }

    .amount {
      color: #d8ff45;
      font-size: 22px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =====================================================
       SECTION
    ====================================================== */

    .section {
      margin-bottom: 11px;
      padding: 15px;
      border-radius: 15px;
      border:
        1px solid rgba(255,255,255,.09);
      background: #0d1d2f;
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 950;
    }

    /* =====================================================
       INFO
    ====================================================== */

    .info-grid {
      display: grid;
      gap: 10px;
    }

    .info-row {
      display: grid;
      grid-template-columns:
        105px minmax(0,1fr);
      gap: 10px;
      align-items: start;
    }

    .info-label {
      color:
        rgba(255,255,255,.42);
      font-size:12px;
      font-weight: 900;
    }

    .info-value {
      min-width: 0;
      color:
        rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* =====================================================
       ITEMS
    ====================================================== */

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      padding-bottom: 10px;
      display: grid;
      grid-template-columns:
        minmax(0,1fr) auto;
      gap: 10px;
      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    .item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .item.has-thumb {
      grid-template-columns:
        64px minmax(0,1fr) auto;
    }

    .item-thumb {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      background: #071523;
      border:
        1px solid rgba(255,255,255,.08);
    }

    .item-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-name {
      font-size: 12px;
      font-weight: 950;
    }

    .item-meta {
      margin-top: 4px;
      color:
        rgba(255,255,255,.43);
      font-size:12px;
      line-height: 1.5;
    }

    .item-total {
      color: #d8ff45;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* =====================================================
       MESSAGE
    ====================================================== */

    .message {
      display: none;
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size:13px;
      font-weight: 800;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background:
        rgba(255,90,90,.08);
      color: #ffb0b0;
      border:
        1px solid rgba(255,90,90,.25);
    }

    .message.success {
      display: block;
      background:
        rgba(216,255,69,.07);
      color: #d8ff45;
      border:
        1px solid rgba(216,255,69,.25);
    }

    /* =====================================================
       ACTION BAR
    ====================================================== */

    .action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));
      background:
        rgba(7,21,35,.98);
      border-top:
        1px solid rgba(255,255,255,.10);
      backdrop-filter:
        blur(16px);
    }

    .action-inner {
      width:
        min(800px,100%);
      margin: auto;
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      font-size:13px;
      font-weight: 950;
      cursor: pointer;
    }

    .action-primary {
      background: #d8ff45;
      color: #071523;
    }

    .action-secondary {
      background:
        rgba(255,255,255,.07);
      color: #fff;
      border:
        1px solid rgba(255,255,255,.11);
    }

    .action-danger {
      background:
        rgba(255,80,80,.10);
      color: #ffaaaa;
      border:
        1px solid rgba(255,80,80,.23);
    }

    .action-btn:disabled {
      opacity: .45;
      cursor: wait;
    }

    /* =====================================================
       STATE
    ====================================================== */

    .state {
      padding:
        55px 20px;
      text-align: center;
      border-radius: 16px;
      border:
        1px dashed rgba(255,255,255,.13);
      color:
        rgba(255,255,255,.5);
      font-size: 12px;
    }

    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:520px) {
      .info-row {
        grid-template-columns:
          88px minmax(0,1fr);
      }

      .status-card {
        align-items: flex-end;
      }
    }

    /* =====================================================
       DỄ NHÌN (14/10/2026): chữ to hơn, bớt in hoa / in đậm,
       nút lưu trong từng mục dùng kiểu viền nhẹ
    ====================================================== */

    textarea,
    input,
    select {
      font-family: inherit !important;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .04em;
    }

    .created {
      font-size: 13px;
      color: rgba(255,255,255,.55);
    }

    .status-label,
    .info-label {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: rgba(255,255,255,.55) !important;
      letter-spacing: 0 !important;
    }

    .status-value {
      font-size: 18px;
      font-weight: 800;
    }

    .amount {
      font-size: 24px;
    }

    .section {
      margin-bottom: 14px;
      padding: 16px;
      border-radius: 16px;
    }

    .section-title {
      margin-bottom: 14px;
      font-size: 17px;
      font-weight: 800;
    }

    .info-grid {
      gap: 12px;
    }

    .info-row {
      grid-template-columns: 110px minmax(0,1fr);
    }

    .info-value {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .item {
      padding-bottom: 12px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .owner-tag {
      display: inline-block;
      margin-bottom: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .owner-tag.is-paddle {
      color: #ffd28a;
      background: rgba(255,184,77,.12);
      border: 1px solid rgba(255,184,77,.30);
    }

    .owner-tag.is-accessory {
      color: #9be7ff;
      background: rgba(91,200,255,.10);
      border: 1px solid rgba(91,200,255,.28);
    }

    .mixed-note {
      margin-bottom: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(216,255,69,.22);
      background: rgba(216,255,69,.06);
      color: rgba(255,255,255,.86);
      font-size: 14px;
      line-height: 1.5;
    }

    .item-meta {
      font-size: 13px;
      color: rgba(255,255,255,.55);
    }

    .item-total {
      font-size: 15px;
      font-weight: 800;
    }

    .message {
      font-size: 14px;
      font-weight: 600;
    }

    .action-btn {
      font-size: 14px !important;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section .action-primary {
      background: rgba(216,255,69,.10);
      color: #d8ff45;
      border: 1px solid rgba(216,255,69,.40);
    }

    .section .action-secondary {
      font-size: 13px !important;
    }

    .collapsible > .section-title {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .collapsible > .section-title::after {
      content: "Mở ▾";
      flex: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.7);
      font-size: 13px;
      font-weight: 700;
    }

    .collapsible.is-open > .section-title {
      margin-bottom: 14px;
    }

    .collapsible.is-open > .section-title::after {
      content: "Thu gọn ▴";
    }

    @media(max-width:520px) {
      .info-row {
        grid-template-columns: 96px minmax(0,1fr);
      }
    }
  </style>
<!-- App PickDee Shop Admin: thêm vào Màn hình chính → mở như app, không thanh trình duyệt -->

<meta name="mobile-web-app-capable" content="yes">

</head>

<body>

<header class="header">
  <div class="header-inner">
    <a
      href="./shop-admin"
      class="brand"
    >
      PickDee<span>Shop</span>
    </a>

    <a
      href="./shop-admin"
      class="back"
    >
      ← ĐƠN HÀNG
    </a>
  </div>
</header>

<main>
  <div
    id="page"
    class="state"
  >
    Đang tải đơn hàng...
  </div>
</main>

<div
  id="actionBar"
  class="action-bar"
  style="display:none;"
>
  <div
    id="actions"
    class="action-inner"
  ></div>
</div>

<script>

(function () {

  const cfg =
    window.PICKDEE_CONFIG || {};

  const page =
    document.getElementById(
      "page"
    );

  const actionBar =
    document.getElementById(
      "actionBar"
    );

  const actions =
    document.getElementById(
      "actions"
    );

  const params =
    new URLSearchParams(
      location.search
    );

  const orderId =
    params.get(
      "id"
    );

  let currentOrder = null;
  let isShopOwner = false;
  /* owner hoặc shop_admin (shop_staff không xác nhận tiền ngoài web) */
  let isShopManager = false;

  let currentItems = [];


  /* =====================================================
     SUPABASE
  ====================================================== */

  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showState(
      "Không tải được hệ thống Shop."
    );

    return;

  }

  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );

  if (!orderId) {

    showState(
      "Không tìm thấy mã đơn."
    );

    return;

  }


  /* =====================================================
     HELPERS
  ====================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }

  function money(value) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(
      Number(value || 0)
    )
    + "đ";

  }

  function formatTime(value) {

    if (!value) {
      return "-";
    }

    try {

      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(
        new Date(value)
      );

    }
    catch (_) {

      return value;

    }

  }

  function valueFrom(
    object,
    keys
  ) {

    for (
      const key
      of keys
    ) {

      if (
        object
        &&
        object[key] !== null
        &&
        object[key] !== undefined
        &&
        String(object[key]).trim() !== ""
      ) {

        return object[key];

      }

    }

    return "";

  }

  function statusLabel(status) {

    const map = {

      new:
        "Đơn mới",

      confirmed:
        "Đã xác nhận",

      packing:
        "Đang đóng gói",

      shipping:
        "Đang giao",

      completed:
        "Hoàn tất",

      cancelled:
        "Đã hủy"

    };

    return (
      map[status]
      ||
      status
      ||
      "-"
    );

  }

  function paymentLabel(method) {

    return (
      method === "bank_transfer"
        ?
          "Chuyển khoản"
        :
          "Thanh toán khi nhận hàng"
    );

  }

  function paymentStatusLabel(status) {

    const map = {

      paid:
        "Đã thanh toán",

      unpaid:
        "Chưa thanh toán",

      refunded:
        "Đã hoàn tiền",

      partial:
        "Thanh toán một phần"

    };

    return (
      map[status]
      ||
      status
      ||
      "Chưa thanh toán"
    );

  }

  function paymentReviewStatusLabel(status) {

    const map = {

      not_submitted:
        "Chưa gửi bill",

      submitted:
        "Chờ xác nhận",

      verified:
        "Đã xác nhận",

      rejected:
        "Bill bị từ chối"

    };

    return (
      map[status]
      ||
      status
      ||
      "Chưa gửi bill"
    );

  }

  function orderSourceLabel(source) {

    const raw =
      String(
        source || ""
      )
        .trim();

    const key =
      raw.toLowerCase();

    const map = {

      zalo:
        "Zalo",

      tiktok:
        "TikTok",

      facebook:
        "Facebook",

      phone:
        "Điện thoại",

      walk_in:
        "Khách trực tiếp",

      other:
        "Khác",

      web:
        "Website",

      website:
        "Website"

    };

    return (
      map[key]
      ||
      raw
      ||
      "Chưa có"
    );

  }

  function itemsHavePickleballBall(
    items
  ) {

    const knownBallKeys =
      [
        "lt48",
        "ppa life time",
        "toniker nexus",
        "toniker mate pro"
      ];

    return (
      Array.isArray(items)
      &&
      items.some(
        function (item) {

          const name =
            String(
              item?.product_name || ""
            )
              .trim()
              .toLocaleLowerCase(
                "vi-VN"
              );

          if (
            name.startsWith(
              "bóng "
            )
          ) {

            return true;

          }

          return knownBallKeys.some(
            function (key) {

              return name.includes(
                key
              );

            }
          );

        }
      )
    );

  }
  function itemsHavePaddle(
    items
  ) {

    return (
      Array.isArray(items)
      &&
      items.some(
        function (item) {

          const text =
            [
              item?.product_name,
              item?.variant_name,
              item?.sku
            ]
              .filter(Boolean)
              .join(" ")
              .toLocaleLowerCase(
                "vi-VN"
              );

          return (
            /^\s*(vợt|vot|paddle)/.test(text) // vợt = tên BẮT ĐẦU bằng "vợt"/"paddle" (không bắt "Chì độ vợt"...)
          );

        }
      )
    );

  }


  function buildSupplierOrderText() {

    const o =
      currentOrder
      ||
      {};

    const addressLine =
      valueFrom(
        o,
        [
          "address_line",
          "shipping_address_line",
          "delivery_address",
          "address"
        ]
      );

    const ward =
      valueFrom(
        o,
        [
          "ward",
          "shipping_ward"
        ]
      );

    const province =
      valueFrom(
        o,
        [
          "province",
          "shipping_province",
          "city"
        ]
      );

    const legacyAddress =
      valueFrom(
        o,
        [
          "legacy_address"
        ]
      );

    const fullAddress =
      [
        addressLine,
        ward,
        province
      ]
        .filter(Boolean)
        .join(", ");

    const itemsText =
      (
        currentItems
        ||
        []
      )
        .map(
          function (item,index) {

            const quantity =
              Number(
                item.quantity
                ||
                1
              );

            const variantName =
              String(
                item.variant_name
                ||
                ""
              )
                .trim();

            const showVariantName =
              variantName
              &&
              variantName.toLocaleLowerCase(
                "vi-VN"
              )
              !==
              "mặc định";

            return [
              `${index + 1}. ${item.product_name || "Sản phẩm"}`,
              showVariantName
                ?
                  `   Phân loại: ${variantName}`
                :
                  "",
              `   Số lượng: ${quantity}`
            ]
              .filter(Boolean)
              .join("\n");

          }
        )
        .join("\n\n");

    return [
      "ĐƠN VỢT PICKDEE",
      "",
      "SẢN PHẨM:",
      itemsText || "-",
      "",
      "THÔNG TIN KHÁCH NHẬN:",
      `Họ tên: ${o.customer_name || "-"}`,
      `SĐT: ${o.phone || "-"}`,
      `Địa chỉ: ${fullAddress || "-"}`,
      legacyAddress
        ?
          `Địa chỉ cũ trước sáp nhập: ${legacyAddress}`
        :
          "",
      "",
      "GHI CHÚ KHÁCH:",
      valueFrom(
        o,
        [
          "customer_note",
          "note",
          "notes"
        ]
      )
      ||
      "-",
      "",
      "YÊU CẦU:",
      "Nhãn hàng đóng hàng và gửi trực tiếp cho khách.",
      "Khi có mã vận đơn, vui lòng gửi lại để PickDee cập nhật cho khách."
    ]
      .filter(
        function (line) {

          return line !== "";

        }
      )
      .join("\n");

  }
  function showState(text) {

    page.className =
      "state";

    page.innerHTML =
      escapeHtml(text);

    actionBar.style.display =
      "none";

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function render() {

    const o =
      currentOrder;

    const addressLine =
      valueFrom(
        o,
        [

    async function confirmBankTransferPayment() {

      const button =
        document.getElementById(
          "confirmBankTransferBtn"
        );

      const floatingButton =
        document.getElementById(
          "confirmBankTransferFloatingBtn"
        );

      const messageBox =
        document.getElementById(
          "paymentProofAdminMessage"
        );

      if (
        !button
        &&
        !floatingButton
      ) {

        return;

      }
      if (
        currentOrder?.order_status
          ===
        "cancelled"
      ) {

        [
          button,
          floatingButton
        ].forEach(
          function (btn) {

            if (btn) {

              btn.disabled =
                true;

              btn.textContent =
                "ĐƠN ĐÃ HỦY";

            }

          }
        );

        if (
          messageBox
        ) {

          messageBox.className =
            "message error";

          messageBox.textContent =
            "Đơn đã hủy, không thể xác nhận thanh toán.";

        }

        return;

      }
      const ok =
        window.confirm(
          "Xác nhận PickDee đã nhận đúng tiền của đơn này?"
        );

      if (!ok) {

        return;

      }

      [
        button,
        floatingButton
      ].forEach(
        function (btn) {

          if (
            btn
          ) {

            btn.disabled =
              true;

            btn.textContent =
              "ĐANG XÁC NHẬN...";

          }

        }
      );

      try {

        const {
          data,
          error
        } =
          await sb.rpc(
            "shop_confirm_bank_transfer_payment",
            {
              p_order_id:
                Number(
                  currentOrder.id
                )
            }
          );

        if (error) {

          throw error;

        }

        if (
          !data?.success
        ) {

          throw new Error(
            "Không xác nhận được thanh toán."
          );

        }

        const {
          data:
            refreshedOrder,
          error:
            refreshError
        } =
          await sb
            .from(
              "shop_orders"
            )
            .select("*")
            .eq(
              "id",
              currentOrder.id
            )
            .single();

        if (
          refreshError
        ) {

          throw refreshError;

        }

        currentOrder =
          refreshedOrder;

        const oldFloating =
          document.getElementById(
            "confirmBankTransferFloatingBtn"
          );

        if (
          oldFloating
        ) {

          oldFloating.remove();

        }

        render();

        const refreshedMessage =
          document.getElementById(
            "paymentProofAdminMessage"
          );

        if (
          refreshedMessage
        ) {

          refreshedMessage.className =
            "message success";

          refreshedMessage.textContent =
            "✓ Đã xác nhận thanh toán chuyển khoản.";

        }

      }
      catch (error) {

        console.error(
          "CONFIRM BANK TRANSFER ERROR:",
          error
        );

        if (
          messageBox
        ) {

          messageBox.className =
            "message error";

          messageBox.textContent =
            error?.message
            ||
            "Không xác nhận được thanh toán.";

        }

        [
          button,
          floatingButton
        ].forEach(
          function (btn) {

            if (
              btn
            ) {

              btn.disabled =
                false;

              btn.textContent =
                "XÁC NHẬN ĐÃ THANH TOÁN";

            }

          }
        );

      }

    }

        false;

      function handleConfirm(
        event
      ) {

        if (
          event
        ) {

          event.preventDefault();

          event.stopPropagation();

        }

        if (
          isConfirming
        ) {

          return;

        }

        isConfirming =
          true;

        Promise
          .resolve(
            confirmBankTransferPayment()
          )
          .finally(
            function () {

              isConfirming =
                false;

            }
          );

      }

      [
        button,
        floatingButton
      ].forEach(
        function (btn) {

          btn.addEventListener(
            "click",
            handleConfirm
          );

          btn.addEventListener(
            "touchend",
            handleConfirm,
            {
              passive:
                false
            }
          );

        }
      );

  function setupCustomerEdit() {
    const btn = document.getElementById("editCustomerBtn");
    const form = document.getElementById("customerEditForm");
    const grid = document.getElementById("customerInfoGrid");
    if (!btn || !form || !grid) return;
    const msg = document.getElementById("customerEditMessage");
    const val = function (id) { return String(document.getElementById(id).value || "").replace(/\s+/g, " ").trim(); };
    const toggle = function (open) {
      form.style.display = open ? "block" : "none";
      grid.style.display = open ? "none" : "";
      btn.style.display = open ? "none" : "";
      msg.className = "message";
      msg.textContent = "";
      if (open) document.getElementById("ceName").focus();
    };
    btn.addEventListener("click", function () { toggle(true); });
    document.getElementById("ceCancelBtn").addEventListener("click", function () { toggle(false); });
    const save = document.getElementById("ceSaveBtn");
    save.addEventListener("click", async function () {
      const name = val("ceName");
      const phone = val("cePhone").replace(/[\s.\-]/g, "").replace(/^\+?84/, "0");
      const line = val("ceLine"), ward = val("ceWard"), province = val("ceProvince"), legacy = val("ceLegacy");
      msg.className = "message";
      try {
        if (!name) throw new Error("Vui lòng nhập tên người nhận.");
        if (!/^0\d{9}$/.test(phone)) throw new Error("Số điện thoại phải gồm 10 số, bắt đầu bằng 0.");
        if (!line || !province) throw new Error("Vui lòng nhập địa chỉ và tỉnh/thành phố.");
        save.disabled = true;
        save.textContent = "ĐANG LƯU…";
        const { data, error } = await sb
          .from("shop_orders")
          .update({ customer_name: name, phone: phone, address_line: line, ward: ward || null, province: province, legacy_address: legacy || null })
          .eq("id", currentOrder.id)
          .select("*")
          .single();
        if (error) throw error;
        currentOrder = Object.assign({}, currentOrder, data);
        render();
        const m2 = document.getElementById("customerEditMessage");
        const f2 = document.getElementById("customerEditForm");
        if (m2 && f2) {
          f2.parentNode.insertBefore(m2, f2.nextSibling);
          m2.className = "message success";
          m2.style.marginBottom = "12px";
          m2.textContent = "✓ Đã lưu thông tin khách hàng.";
        }
      } catch (e) {
        console.error("SAVE CUSTOMER ERROR:", e);
        msg.className = "message error";
        msg.textContent = e?.message || "Không lưu được, thử lại.";
        save.disabled = false;
        save.textContent = "LƯU THÔNG TIN";
      }
    });
  }

  async function requireShopAccess() {

    const {
      data: sessionData
    } =
      await sb.auth.getSession();

    const user =
      sessionData?.session?.user;

   if (!user) {

  location.href =
    "/login?next="
    +
    encodeURIComponent(
      location.pathname
      +
      location.search
    );

  return false;

}

    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_user_roles"
        )
        .select(
          "role,is_active"
        )
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        );

    if (error) {

      throw new Error(
        "Không kiểm tra được quyền Shop."
      );

    }

    const allowed =
      (data || [])
        .some(
          item =>
            [
              "owner",
              "shop_admin",
              "shop_staff"
            ]
              .includes(
                item.role
              )
        );

    if (!allowed) {

      throw new Error(
        "Tài khoản chưa có quyền quản lý Shop."
      );

    }

    isShopOwner =
      (data || [])
        .some(
          item =>
            item.role === "owner"
        );

    isShopManager =
      (data || [])
        .some(
          item =>
            item.role === "owner"
            ||
            item.role === "shop_admin"
        );

    return true;

  }

     Ưu tiên ảnh đúng biến thể (màu), không có thì ảnh chính

  async function attachItemImages(items) {

    const productIds =
      [...new Set(
        items
          .map(item => item.product_id)
          .filter(Boolean)
      )];

    if (!productIds.length) {
      return;
    }

    const {
      data,
      error
    } =
      await sb
        .from(
          "shop_product_images"
        )
        .select(
          "product_id,variant_id,storage_path,sort_order,is_primary"
        )
        .in(
          "product_id",
          productIds
        )
        .order(
          "is_primary",
          { ascending: false }
        )
        .order(
          "sort_order",
          { ascending: true }
        );

    if (error) {
      console.warn("shop order item images:", error);
      return;
    }

    const rows =
      data || [];

    items.forEach(function (item) {

      const variantId =
        item.variant_id
        ??
        item.stock_variant_id;

      const row =
        rows.find(r => variantId && r.variant_id === variantId)
        ||
        rows.find(r => r.product_id === item.product_id && !r.variant_id)
        ||
        rows.find(r => r.product_id === item.product_id);

      item._imageUrl =
        row?.storage_path
          ? sb.storage
              .from("shop-products")
              .getPublicUrl(row.storage_path)
              .data?.publicUrl || ""
          : "";

    });

  }

            "order_id",
            orderId
          )
          .order(
            "id",
            {
              ascending:
                true
            }
          ),


        sb
          .from(
            "shop_supplier_settlement_summary"
          )
          .select("*")
          .eq(
            "order_id",
            orderId
          )
          .order(
            "id",
            {
              ascending:
                true
            }
          ),


        sb
          .from(
            "shop_suppliers"
          )
          .select("*")
          .order(
            "id",
            {
              ascending:
                true
            }
          )

      ]);


    if (
      !accessOk
    ) {

      return;

    }


    if (
      orderResult.error
    ) {

      throw orderResult.error;

    }


    if (
      itemsResult.error
    ) {

      throw itemsResult.error;

    }


    if (
      settlementResult.error
    ) {

      throw settlementResult.error;

    }


    if (
      supplierResult.error
    ) {

      throw supplierResult.error;

    }


    currentOrder =
      orderResult.data;


    currentItems =
      itemsResult.data
      ||
      [];


    await attachItemImages(currentItems);


    /*
      Gắn dữ liệu vận hành mở rộng
      trực tiếp vào currentOrder
      để render() và event handlers
      dùng chung mà không cần thêm global.
    */

    currentOrder._supplierSettlements =
      settlementResult.data
      ||
      [];


    currentOrder._shopSuppliers =
      supplierResult.data
      ||
      [];


    render();

  }
  catch (error) {

    console.error(
      "SHOP ORDER DETAIL ERROR:",
      error
    );


    showState(
      error?.message
      ||
      "Không tải được đơn hàng."
    );

  }

}

let settlementSectionOpen = null;

function setupSettlementCollapse(
  section,
  defaultOpen
) {

  const title =
    section.querySelector(
      ".section-title"
    );

  if (!title) {
    return;
  }

  if (settlementSectionOpen === null) {
    settlementSectionOpen = defaultOpen;
  }

  const body =
    document.createElement(
      "div"
    );

  while (title.nextSibling) {
    body.appendChild(
      title.nextSibling
    );
  }

  section.appendChild(
    body
  );

  section.classList.add(
    "collapsible"
  );

  title.setAttribute(
    "role",
    "button"
  );

  const apply =
    function () {
      body.hidden =
        !settlementSectionOpen;
      section.classList.toggle(
        "is-open",
        settlementSectionOpen
      );
    };

  title.addEventListener(
    "click",
    function () {
      settlementSectionOpen =
        !settlementSectionOpen;
      apply();
    }
  );

  apply();

}

            }
          >
            Chưa có / không ai ứng
          </option>

          <option
            value="supplier"
            ${
              selected
                ?.shipping_advanced_by
              ===
              "supplier"
                ?
                  "selected"
                :
                  ""
            }
          >
            Nhãn hàng / NCC ứng
          </option>

          <option
            value="pickdee"
            ${
              selected
                ?.shipping_advanced_by
              ===
              "pickdee"
                ?
                  "selected"
                :
                  ""
            }
          >
            PickDee ứng
          </option>

          <option
            value="customer"
            ${
              selected
                ?.shipping_advanced_by
              ===
              "customer"
                ?
                  "selected"
                :
                  ""
            }
          >
            Khách ứng / trả trực tiếp
          </option>

        </select>

      </div>


      <div>

        <div
          class="info-label"
          style="margin-bottom:6px;"
        >
          Cuối cùng ai chịu phí ship
        </div>

        <select
          id="settlementShippingBorneBy"
          style="
            width:100%;
            min-height:44px;
            padding:0 12px;
            border-radius:12px;
            border:
              1px solid
              rgba(255,255,255,.10);
            background:#071523;
            color:#fff;
            font-size:16px;
            font-weight:800;
          "
        >

          <option
            value="pickdee"
            ${
              (
                selected
                  ?.shipping_borne_by
                ||
                "pickdee"
              )
              ===
              "pickdee"
                ?
                  "selected"
                :
                  ""
            }
          >
            PickDee chịu
          </option>

          <option
            value="supplier"
            ${
              selected
                ?.shipping_borne_by
              ===
              "supplier"
                ?
                  "selected"
                :
                  ""
            }
          >
            Nhãn hàng / NCC chịu
          </option>

          <option
            value="customer"
            ${
              selected
                ?.shipping_borne_by
              ===
              "customer"
                ?
                  "selected"
                :
                  ""
            }
          >
            Khách chịu
          </option>

        </select>

      </div>


      <div>

        <div
          class="info-label"
          style="margin-bottom:6px;"
        >
          Điều chỉnh cộng / trừ
        </div>

        <input
          id="settlementAdjustmentAmount"
          type="number"
          step="1000"
          value="${escapeHtml(
            selected?.adjustment_amount
            ??
            0
          )}"
          placeholder="Có thể nhập số âm"
          style="
            width:100%;
            min-height:44px;
            padding:0 12px;
            border-radius:12px;
            border:
              1px solid
              rgba(255,255,255,.10);
            background:#071523;
            color:#fff;
            font-size:16px;
            font-weight:800;
          "
        >

      </div>


      <input
        id="settlementAdjustmentNote"
        type="text"
        value="${escapeHtml(
          selected?.adjustment_note
          ||
          ""
        )}"
        placeholder="Lý do điều chỉnh nếu có"
        style="
          width:100%;
          min-height:44px;
          padding:0 12px;
          border-radius:12px;
          border:
            1px solid
            rgba(255,255,255,.10);
          background:#071523;
          color:#fff;
          font-size:16px;
          font-weight:800;
        "
      >


      <textarea
        id="settlementNote"
        placeholder="Ghi chú đối soát..."
        style="
          width:100%;
          min-height:75px;
          padding:12px;
          border-radius:12px;
          border:
            1px solid
            rgba(255,255,255,.10);
          background:#071523;
          color:#fff;
          resize:vertical;
          font-size:16px;
          font-weight:750;
          line-height:1.5;
        "
      >${escapeHtml(
        selected?.note
        ||
        ""
      )}</textarea>


      <div
        style="
          padding:13px;
          border-radius:12px;
          border:
            1px solid
            rgba(216,255,69,.18);
          background:
            rgba(216,255,69,.045);
          display:grid;
          gap:8px;
        "
      >

        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >
          <span class="info-label">
            Dự kiến phải trả NCC
          </span>

          <strong
            id="settlementDraftDue"
            style="color:#d8ff45;"
          >
            0đ
          </strong>
        </div>

        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >
          <span class="info-label">
            Đã chuyển
          </span>

          <strong>
            ${money(
              selected?.paid_amount
              ||
              0
            )}
          </strong>
        </div>

        <div
          style="
            padding-top:8px;
            border-top:
              1px solid
              rgba(255,255,255,.08);
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >
          <span class="info-label">
            Còn phải trả
          </span>

          <strong
            id="settlementDraftBalance"
            style="
              color:#d8ff45;
              font-size:16px;
            "
          >
            0đ
          </strong>
        </div>

      </div>


      <button
        id="saveSupplierSettlementBtn"
        type="button"
        class="action-btn action-primary"
        style="
          width:100%;
          min-height:46px;
          font-size:13px;
        "
      >
        ${
          selected
            ?
              "LƯU ĐỐI SOÁT NCC"
            :
              "TẠO ĐỐI SOÁT NCC"
        }
      </button>


      <div
        id="supplierSettlementMessage"
        class="message"
      ></div>


      ${
        selected
          ?
            `
              <div
                style="
                  margin-top:5px;
                  padding-top:14px;
                  border-top:
                    1px solid
                    rgba(255,255,255,.08);
                  display:grid;
                  gap:9px;
                "
              >

                <div
                  style="
                    color:#fff;
                    font-size:13px;
                    font-weight:950;
                  "
                >
                  Ghi nhận tiền đã chuyển cho NCC
                </div>

                ${
                  Number(
                    selected.balance_due
                    ||
                    0
                  ) > 0
                    ?
                      `
                        <input
                          id="settlementPaymentAmount"
                          type="number"
                          min="1"
                          step="1000"
                          value="${escapeHtml(
                            selected.balance_due
                            ||
                            0
                          )}"
                          placeholder="Số tiền vừa chuyển"
                          style="
                            width:100%;
                            min-height:44px;
                            padding:0 12px;
                            border-radius:12px;
                            border:
                              1px solid
                              rgba(255,255,255,.10);
                            background:#071523;
                            color:#fff;
                            font-size:16px;
                            font-weight:800;
                          "
                        >

                        <input
                          id="settlementPaymentReference"
                          type="text"
                          placeholder="Mã GD / nội dung chuyển khoản"
                          style="
                            width:100%;
                            min-height:44px;
                            padding:0 12px;
                            border-radius:12px;
                            border:
                              1px solid
                              rgba(255,255,255,.10);
                            background:#071523;
                            color:#fff;
                            font-size:16px;
                            font-weight:800;
                          "
                        >

                        <input
                          id="settlementPaymentNote"
                          type="text"
                          placeholder="Ghi chú lần thanh toán"
                          style="
                            width:100%;
                            min-height:44px;
                            padding:0 12px;
                            border-radius:12px;
                            border:
                              1px solid
                              rgba(255,255,255,.10);
                            background:#071523;
                            color:#fff;
                            font-size:16px;
                            font-weight:800;
                          "
                        >

                        <button
                          id="saveSupplierPaymentBtn"
                          type="button"
                          class="action-btn action-primary"
                          style="
                            width:100%;
                            min-height:46px;
                            font-size:13px;
                          "
                        >
                          ✓ GHI NHẬN ĐÃ CHUYỂN TIỀN NCC
                        </button>
                      `
                    :
                      `
                        <div
                          style="
                            padding:11px;
                            border-radius:11px;
                            border:
                              1px solid
                              rgba(123,229,168,.20);
                            background:
                              rgba(123,229,168,.06);
                            color:#7be5a8;
                            font-size:13px;
                            font-weight:900;
                          "
                        >
                          ✓ Hiện không còn số tiền phải trả theo đối soát này.
                        </div>
                      `
                }

              </div>
            `
          :
            ""
      }

    </div>

  `;


  // Đặt cuối trang, thu gọn mặc định (chỉ mở khi bấm hoặc đơn đã có đối soát)
  page.appendChild(
    section
  );

  setupSettlementCollapse(
    section,
    settlements.length > 0
    ||
    settlementEditingId != null
  );


  /* =====================================================
     EDIT EXISTING
  ====================================================== */

  section
    .querySelectorAll(
      "[data-edit-settlement]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function () {

            settlementEditingId =
              button.dataset
                .editSettlement;

            mountSupplierSettlementUI();

            document
              .getElementById(
                "supplierSettlementSection"
              )
              ?.scrollIntoView(
                {
                  behavior:
                    "smooth",
                  block:
                    "start"
                }
              );

          }
        );

      }
    );


  /* =====================================================
     NEW
  ====================================================== */

  document
    .getElementById(
      "newSupplierSettlementBtn"
    )
    ?.addEventListener(
      "click",
      function () {

        settlementEditingId =
          null;

        mountSupplierSettlementUI();

      }
    );


  /* =====================================================
     SUPPLIER SELECT
  ====================================================== */

  const supplierSelect =
    document.getElementById(
      "settlementSupplierSelect"
    );

  const supplierNameInput =
    document.getElementById(
      "settlementSupplierName"
    );


  supplierSelect
    ?.addEventListener(
      "change",
      function () {

        const supplier =
          suppliers.find(
            item =>
              String(item.id)
              ===
              String(
                supplierSelect.value
              )
          );


        if (supplier) {

          supplierNameInput.value =
            supplierSettlementName(
              supplier
            );

        }

      }
    );


  /* =====================================================
     LIVE CALCULATION
  ====================================================== */

  const goodsInput =
    document.getElementById(
      "settlementGoodsAmount"
    );

  const shippingAmountInput =
    document.getElementById(
      "settlementShippingAmount"
    );

  const advancedByInput =
    document.getElementById(
      "settlementShippingAdvancedBy"
    );

  const borneByInput =
    document.getElementById(
      "settlementShippingBorneBy"
    );

  const adjustmentInput =
    document.getElementById(
      "settlementAdjustmentAmount"
    );


  function updateSettlementDraft() {

    const goods =
      Math.max(
        0,
        Number(
          goodsInput?.value
          ||
          0
        )
      );


    const ship =
      Math.max(
        0,
        Number(
          shippingAmountInput
            ?.value
          ||
          0
        )
      );


    const adjustment =
      Number(
        adjustmentInput?.value
        ||
        0
      );


    const shipReimbursement =
      advancedByInput?.value
      ===
      "supplier"
      &&
      borneByInput?.value
      ===
      "pickdee"
        ?
          ship
        :
          0;


    const amountDue =
      Math.max(
        0,
        goods
        +
        shipReimbursement
        +
        adjustment
      );


    const paid =
      Number(
        selected?.paid_amount
        ||
        0
      );


    const balance =
      Math.max(
        0,
        amountDue
        -
        paid
      );


    const dueEl =
      document.getElementById(
        "settlementDraftDue"
      );

    const balanceEl =
      document.getElementById(
        "settlementDraftBalance"
      );


    if (dueEl) {

      dueEl.textContent =
        money(
          amountDue
        );

    }


    if (balanceEl) {

      balanceEl.textContent =
        money(
          balance
        );

    }

  }


  [
    goodsInput,
    shippingAmountInput,
    advancedByInput,
    borneByInput,
    adjustmentInput
  ]
    .filter(Boolean)
    .forEach(
      input => {

        input.addEventListener(
          "input",
          updateSettlementDraft
        );

        input.addEventListener(
          "change",
          updateSettlementDraft
        );

      }
    );


  updateSettlementDraft();


  /* =====================================================
     SAVE SETTLEMENT
  ====================================================== */

  document
    .getElementById(
      "saveSupplierSettlementBtn"
    )
    ?.addEventListener(
      "click",
      async function () {

        const button =
          this;

        const message =
          document.getElementById(
            "supplierSettlementMessage"
          );


        button.disabled =
          true;


        try {

          const supplierNameValue =
            String(
              supplierNameInput
                ?.value
              ||
              ""
            )
              .trim();


          if (
            !supplierNameValue
          ) {

            throw new Error(
              "Vui lòng nhập tên nhãn hàng / NCC."
            );

          }


          const {
            data:
              sessionData
          } =
            await sb.auth.getSession();


          const userId =
            sessionData
              ?.session
              ?.user
              ?.id
            ||
            null;


          const payload = {

            order_id:
              Number(
                orderId
              ),

            supplier_id:
              supplierSelect
                ?.value
                ?
                  Number(
                    supplierSelect
                      .value
                  )
                :
                  null,

            supplier_name_snapshot:
              supplierNameValue,

            fulfillment_mode:
              document
                .getElementById(
                  "settlementFulfillmentMode"
                )
                ?.value
              ||
              "supplier",

            delivery_method:
              document
                .getElementById(
                  "settlementDeliveryMethod"
                )
                ?.value
              ||
              null,

            delivery_reference:
              String(
                document
                  .getElementById(
                    "settlementDeliveryReference"
                  )
                  ?.value
                ||
                ""
              )
                .trim()
              ||
              null,

            goods_amount:
              Math.max(
                0,
                Number(
                  goodsInput?.value
                  ||
                  0
                )
              ),

            shipping_amount:
              Math.max(
                0,
                Number(
                  shippingAmountInput
                    ?.value
                  ||
                  0
                )
              ),

            shipping_cost_status:
              document
                .getElementById(
                  "settlementShippingStatus"
                )
                ?.value
              ||
              "pending",

            shipping_advanced_by:
              advancedByInput
                ?.value
              ||
              "none",

            shipping_borne_by:
              borneByInput
                ?.value
              ||
              "pickdee",

            adjustment_amount:
              Number(
                adjustmentInput
                  ?.value
                ||
                0
              ),

            adjustment_note:
              String(
                document
                  .getElementById(
                    "settlementAdjustmentNote"
                  )
                  ?.value
                ||
                ""
              )
                .trim()
              ||
              null,

            note:
              String(
                document
                  .getElementById(
                    "settlementNote"
                  )
                  ?.value
                ||
                ""
              )
                .trim()
              ||
              null,

            updated_by:
              userId

          };


          let result;


          if (selected) {

            result =
              await sb
                .from(
                  "shop_order_supplier_settlements"
                )
                .update(
                  payload
                )
                .eq(
                  "id",
                  selected.id
                )
                .select(
                  "id"
                )
                .single();

          }
          else {

            result =
              await sb
                .from(
                  "shop_order_supplier_settlements"
                )
                .insert(
                  {
                    ...payload,

                    created_by:
                      userId
                  }
                )
                .select(
                  "id"
                )
                .single();

          }


          if (
            result.error
          ) {

            throw result.error;

          }


          settlementEditingId =
            result.data.id;


          await refreshSupplierSettlementData();


          mountSupplierSettlementUI();


          const refreshedMessage =
            document.getElementById(
              "supplierSettlementMessage"
            );


          if (
            refreshedMessage
          ) {

            refreshedMessage.className =
              "message success";

            refreshedMessage.textContent =
              "✓ Đã lưu đối soát nhãn hàng / NCC.";

          }

        }
        catch (error) {

          console.error(
            "SAVE SUPPLIER SETTLEMENT ERROR:",
            error
          );


          if (message) {

            message.className =
              "message error";

            message.textContent =
              error?.message
              ||
              "Không lưu được đối soát NCC.";

          }

        }
        finally {

          button.disabled =
            false;

        }

      }
    );


  /* =====================================================
     SAVE PAYMENT
  ====================================================== */

  document
    .getElementById(
      "saveSupplierPaymentBtn"
    )
    ?.addEventListener(
      "click",
      async function () {

        if (!selected) {
          return;
        }


        const button =
          this;

        const message =
          document.getElementById(
            "supplierSettlementMessage"
          );


        button.disabled =
          true;


        try {

          const amount =
            Math.max(
              0,
              Number(
                document
                  .getElementById(
                    "settlementPaymentAmount"
                  )
                  ?.value
                ||
                0
              )
            );


          const balance =
            Math.max(
              0,
              Number(
                selected.balance_due
                ||
                0
              )
            );


          if (
            amount <= 0
          ) {

            throw new Error(
              "Vui lòng nhập số tiền đã chuyển."
            );

          }


          if (
            balance > 0
            &&
            amount > balance
          ) {

            throw new Error(
              "Số tiền chuyển lớn hơn số tiền còn phải trả."
            );

          }


          const {
            data:
              sessionData
          } =
            await sb.auth.getSession();


          const {
            error
          } =
            await sb
              .from(
                "shop_supplier_settlement_payments"
              )
              .insert(
                {
                  settlement_id:
                    selected.id,

                  amount:
                    amount,

                  payment_method:
                    "bank_transfer",

                  payment_reference:
                    String(
                      document
                        .getElementById(
                          "settlementPaymentReference"
                        )
                        ?.value
                      ||
                      ""
                    )
                      .trim()
                    ||
                    null,

                  note:
                    String(
                      document
                        .getElementById(
                          "settlementPaymentNote"
                        )
                        ?.value
                      ||
                      ""
                    )
                      .trim()
                    ||
                    null,

                  created_by:
                    sessionData
                      ?.session
                      ?.user
                      ?.id
                    ||
                    null
                }
              );


          if (error) {
            throw error;
          }


          await refreshSupplierSettlementData();


          mountSupplierSettlementUI();


          const refreshedMessage =
            document.getElementById(
              "supplierSettlementMessage"
            );


          if (
            refreshedMessage
          ) {

            refreshedMessage.className =
              "message success";

            refreshedMessage.textContent =
              "✓ Đã ghi nhận tiền chuyển cho NCC.";

          }

        }
        catch (error) {

          console.error(
            "SAVE SUPPLIER PAYMENT ERROR:",
            error
          );


          if (message) {

            message.className =
              "message error";

            message.textContent =
              error?.message
              ||
              "Không ghi nhận được thanh toán NCC.";

          }

        }
        finally {

          button.disabled =
            false;

        }

      }
    );

}


/* =====================================================
   GẮN UI ĐỐI SOÁT SAU MỖI LẦN render()
===================================================== */

const renderBeforeSupplierSettlement =
  render;


render =
  function () {

    renderBeforeSupplierSettlement();

    mountSupplierSettlementUI();

  };
  loadOrder();

})();

</script>

<script src="/shop-notifications.js?v=20261017-sales1"></script>

<script src="/pd-app.js?v=20261020-2"></script>
</body>
