<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>
    Hồ sơ Coach | PickDee Academy
  </title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js?v=20261019-keep30"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(90,255,180,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .topbar {
      min-height: 68px;

      padding:
        14px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      border-bottom:
        1px solid
        rgba(255,255,255,.11);
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    .back {
      color: #d8ff45;

      text-decoration: none;

      font-size: 13px;
      font-weight: 900;
    }

    .container {
      width:
        min(
          760px,
          calc(100% - 28px)
        );

      margin: auto;

      padding:
        35px 0 70px;
    }

    .profile-card {
      padding: 26px;

      border-radius: 20px;

      border:
        1px solid
        rgba(255,255,255,.12);

      background:
        rgba(6,39,88,.76);
    }

    .coach-top {
      display: flex;
      align-items: center;

      gap: 18px;

      margin-bottom: 24px;
    }

    .avatar {
      width: 76px;
      height: 76px;

      flex:
        0 0 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(216,255,69,.12);

      border:
        1px solid
        rgba(216,255,69,.3);

      font-size: 34px;
    }

    .eyebrow {
      margin-bottom: 5px;

      color: #d8ff45;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 1px;
    }

    .coach-name {
      margin: 0 0 6px;

      font-size:
        clamp(
          25px,
          5vw,
          36px
        );

      line-height: 1.05;
    }

    .coach-code {
      color:
        rgba(255,255,255,.55);

      font-size: 13px;
      font-weight: 800;
    }

    .status {
      margin-top: 10px;

      display: inline-flex;
      align-items: center;

      min-height: 30px;

      padding:
        0 11px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.11);

      color: #d8ff45;

      font-size: 11px;
      font-weight: 900;
    }

    .section {
      margin-top: 18px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid
        rgba(255,255,255,.08);
    }

    .section-title {
      margin-bottom: 13px;

      color:
        rgba(255,255,255,.55);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: .5px;
    }

    .info-row {
      min-height: 42px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color:
        rgba(255,255,255,.52);

      font-size: 13px;
    }

    .info-value {
      text-align: right;

      font-size: 14px;
      font-weight: 900;
    }

    .program-list {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .program {
      padding:
        8px 11px;

      border-radius: 999px;

      background:
        rgba(216,255,69,.1);

      border:
        1px solid
        rgba(216,255,69,.22);

      color: #d8ff45;

      font-size: 12px;
      font-weight: 900;
    }

    .privacy-note {
      margin-top: 18px;

      padding: 14px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);

      color:
        rgba(255,255,255,.55);

      font-size: 12px;
      line-height: 1.6;
    }

    .message {
      padding: 30px 18px;

      text-align: center;

      border-radius: 16px;

      border:
        1px dashed
        rgba(255,255,255,.18);

      color:
        rgba(255,255,255,.65);

      line-height: 1.6;
    }

    @media(max-width:600px) {

      .topbar {
        padding:
          14px;
      }

      .profile-card {
        padding: 20px;
      }

      .coach-top {
        align-items: flex-start;
      }

      .avatar {
        width: 62px;
        height: 62px;

        flex-basis: 62px;

        font-size: 28px;
      }

    }

  </style>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>


<body>


<header class="topbar">

  <div class="brand">

    PickDee
    <span>
      Academy
    </span>

  </div>


  <a
    class="back"
    href="./find-coach"
  >
    ← TÌM COACH
  </a>
<script>
/* Nút quay lại: về đúng trang trước (Coach gần / hồ sơ / khu vực) thay vì link cứng */
(function () {
  var a = document.querySelector("header a.back"); if (!a) return;
  var near = new URLSearchParams(location.search).get("from") === "near", same = false;
  try { same = new URL(document.referrer).origin === location.origin; } catch (e) {}
  if (near) { a.textContent = "← COACH GẦN BẠN"; a.href = "/academy#coach"; }
  else if (same) a.textContent = "← QUAY LẠI";
  a.addEventListener("click", function (e) { if (same && history.length > 1) { e.preventDefault(); history.back(); } });
})();
</script>

</header>


<main class="container">

  <div
    id="profileBox"
    class="message"
  >
    Đang tải hồ sơ Coach...
  </div>

</main>


<script>

(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};


  const profileBox =
    document.getElementById(
      "profileBox"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    profileBox.textContent =
      "Không tải được hệ thống PickDee Academy.";

    return;

  }


  const sb =
    window.PICKDEE_SUPABASE
    ||
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const coachId =
    Number(
      params.get("id")
    );


  if (
    !Number.isInteger(coachId)
    ||
    coachId <= 0
  ) {

    profileBox.textContent =
      "Không tìm thấy Coach.";

    return;

  }


  const {
    data,
    error
  } =
    await sb.rpc(
      "public_get_coach_profile",
      {
        p_coach_id:
          coachId
      }
    );


  if (error) {

    console.error(
      error
    );

    profileBox.textContent =
      "Không tải được hồ sơ Coach.";

    return;

  }


  const coach =
    Array.isArray(data)
      ?
        data[0]
      :
        null;


  if (!coach) {

    profileBox.textContent =
      "Coach này hiện không còn hoạt động.";

    return;

  }

  /* ===============================================
     LOAD ẢNH ĐẠI DIỆN COACH
  ================================================ */

  let coachAvatarHtml =
    `
      <div class="avatar">
        🏓
      </div>
    `;


  try {

    const {
      data: avatarData,
      error: avatarError
    } =
      await sb.rpc(
        "public_get_coach_avatar",
        {
          p_coach_id:
            coachId
        }
      );


    if (!avatarError) {

      const avatarRow =
        Array.isArray(
          avatarData
        )
          ?
          avatarData[0]
          :
          null;


    const avatarPath =
  avatarRow?.avatar_path
  ||
  "";


const avatarBucket =
  (
    avatarRow?.avatar_bucket ===
      "avatars"
    ||
    avatarRow?.avatar_bucket ===
      "profile-photos"
  )
    ?
    avatarRow.avatar_bucket
    :
    "profile-photos";


if (avatarPath) {

  const {
    data: signedData,
    error: signedError
  } =
    await sb
      .storage
      .from(
        avatarBucket
      )
      .createSignedUrl(
        avatarPath,
        60 * 60
      );


  if (signedError) {

    console.warn(
      "COACH PROFILE AVATAR SIGNED URL:",
      coachId,
      signedError
    );

  }


  let publicUrl =
    signedData?.signedUrl
    ||
    "";


  if (!publicUrl) {

    const {
      data: publicData
    } =
      sb
        .storage
        .from(
          avatarBucket
        )
        .getPublicUrl(
          avatarPath
        );


    publicUrl =
      publicData?.publicUrl
      ||
      "";

  }

        if (publicUrl) {

          coachAvatarHtml =
            `
              <div class="avatar">
                <img
                  src="${publicUrl}"
                  alt="Ảnh Coach"
                  loading="lazy"
                  style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:50%;
                    display:block;
                  "
                >
              </div>
            `;

        }

      }

    }
    else {

      console.warn(
        "COACH AVATAR:",
        avatarError
      );

    }

  }
  catch (avatarException) {

    console.warn(
      "COACH AVATAR:",
      avatarException
    );

  }
  const programs =
    Array.isArray(
      coach.programs
    )
      ?
        coach.programs.filter(Boolean)
      :
        [];


  const yearsPlaying =
    coach.years_playing
    ?? "—";


  const yearsCoaching =
    coach.years_coaching
    ?? "—";


  /* ===============================================
     LOAD HẠNG COACH + GIÁ TYC
  ================================================ */

  let pricingTier =
    null;


  try {

    const {
      data: pricingData,
      error: pricingError
    } =
      await sb.rpc(
        "public_get_coach_pricing_tier",
        {
          p_coach_id:
            coachId
        }
      );


    if (pricingError) {

      console.warn(
        "COACH PRICING TIER:",
        pricingError
      );

    }
    else {

      const pricingRow =
        Array.isArray(pricingData)
          ?
            pricingData[0]
          :
            null;


      if (
        pricingRow
        &&
        (
          pricingRow.pricing_tier === "standard"
          ||
          pricingRow.pricing_tier === "certified"
        )
      ) {

        pricingTier =
          pricingRow.pricing_tier;

      }

    }

  }
  catch (pricingException) {

    console.warn(
      "COACH PRICING TIER:",
      pricingException
    );

  }


  const coachTierText =
  pricingTier === "certified"
    ?
      "Coach Chứng nhận"
    :
      (
        pricingTier === "standard"
          ?
            "Coach Tiêu chuẩn"
          :
            "Đang cập nhật"
      );


/* ===============================================
   LOAD TRÌNH ĐỘ / CHỨNG CHỈ ĐÃ XÁC MINH
================================================ */

let verifiedCredentials =
  {
    pickdee: null,
    external_ratings: [],
    certificate: null
  };


try {

  const {
    data: credentialData,
    error: credentialError
  } =
    await sb.rpc(
      "public_get_coach_verified_credentials",
      {
        p_coach_id:
          coachId
      }
    );


  if (credentialError) {

    console.warn(
      "COACH VERIFIED CREDENTIALS:",
      credentialError
    );

  }
  else if (
    credentialData
    &&
    typeof credentialData ===
      "object"
  ) {

    verifiedCredentials =
      credentialData;

  }

}
catch (
  credentialException
) {

  console.warn(
    "COACH VERIFIED CREDENTIALS:",
    credentialException
  );

}


/* ===============================================
   PICKDEE ACADEMY
================================================ */

let pickdeeCredentialHtml =
  "";


if (
  verifiedCredentials
    ?.pickdee
    ?.level
) {

  pickdeeCredentialHtml = `

    <div class="info-row">

      <span class="info-label">
        PickDee Academy
      </span>

      <span
        class="info-value"
        style="color:#d8ff45;"
      >
        ${escapeHtml(
          verifiedCredentials
            .pickdee
            .level
        )}
        ✓ Đã xác minh
      </span>

    </div>

  `;

}


/* ===============================================
   RATING NGOÀI + ẢNH MINH CHỨNG ĐÃ XÁC MINH
=============================================== */

const verifiedExternalRatings =
  Array.isArray(
    verifiedCredentials
      ?.external_ratings
  )
    ?
      verifiedCredentials
        .external_ratings
    :
      [];


const externalRatingHtml =
  (
    await Promise.all(

      verifiedExternalRatings
        .map(
          async function (
            rating
          ) {


            const ratingValue =
              rating?.rating_value
              ??
              rating?.rating_text
              ??
              "—";


            let proofImageHtml =
              "";


            /* ===========================================
               ẢNH MINH CHỨNG
            =========================================== */

            if (
              rating?.proof_image_path
            ) {

              try {


                const {
                  data: proofUrlData,
                  error: proofUrlError
                } =
                  await sb
                    .storage
                    .from(
                      "coach-documents"
                    )
                    .createSignedUrl(
                      rating.proof_image_path,
                      60 * 60
                    );


                if (
                  !proofUrlError
                  &&
                  proofUrlData
                    ?.signedUrl
                ) {


                  const proofUrl =
                    proofUrlData.signedUrl;


                  proofImageHtml = `

                    <div
                      style="
                        margin-top:14px;
                        padding-top:14px;
                        border-top:
                          1px solid
                          rgba(255,255,255,.08);
                      "
                    >

                      <div
                        style="
                          margin-bottom:8px;
                          color:
                            rgba(255,255,255,.52);
                          font-size:12px;
                          font-weight:700;
                        "
                      >
                        Ảnh minh chứng đã xác minh
                      </div>


                      <a
                        href="${escapeHtml(
                          proofUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          display:inline-block;
                        "
                      >

                        <img
                          src="${escapeHtml(
                            proofUrl
                          )}"
                          alt="Ảnh minh chứng trình độ Coach"
                          loading="lazy"
                          style="
     width:min(
  180px,
  100%
);
max-height:180px;
                            object-fit:contain;
                            display:block;
                            border-radius:12px;
                            border:
                              1px solid
                              rgba(216,255,69,.25);
                            background:#04152d;
                          "
                        >

                      </a>


                      <div
                        style="
                          margin-top:8px;
                          color:#d8ff45;
                          font-size:11px;
                          font-weight:900;
                        "
                      >
                        ✓ MINH CHỨNG ĐÃ ĐƯỢC PICKDEE XÁC MINH
                      </div>

                    </div>

                  `;

                }
                else {

                  console.warn(
                    "COACH RATING PROOF SIGNED URL:",
                    rating?.proof_image_path,
                    proofUrlError
                  );

                }

              }
              catch (
                proofImageError
              ) {

                console.warn(
                  "COACH RATING PROOF IMAGE:",
                  proofImageError
                );

              }

            }


            return `

              <div
                style="
                  padding:
                    2px 0 14px;
                "
              >

                <div class="info-row">

                  <span class="info-label">

                    ${escapeHtml(
                      rating?.system_name
                      ||
                      "Hệ thống khác"
                    )}

                  </span>


                  <span
                    class="info-value"
                    style="
                      color:#d8ff45;
                    "
                  >

                    ${escapeHtml(
                      ratingValue
                    )}

                    ✓ Đã xác minh

                  </span>

                </div>


                ${proofImageHtml}


              </div>

            `;

          }
        )

    )
  )
    .join("");

/* ===============================================
   CHỨNG CHỈ
================================================ */

let certificateHtml =
  "";


const certificate =
  verifiedCredentials
    ?.certificate
  ||
  null;


if (certificate) {

  let certificateImageHtml =
    "";


  if (
    certificate.image_path
  ) {

    try {

      const {
        data: certificateUrlData,
        error: certificateUrlError
      } =
        await sb
          .storage
          .from(
            "coach-documents"
          )
          .createSignedUrl(
            certificate.image_path,
            60 * 60
          );


      if (
        !certificateUrlError
        &&
        certificateUrlData
          ?.signedUrl
      ) {

        certificateImageHtml = `

          <div
            style="
              margin-top:14px;
            "
          >

            <div
              style="
                color:rgba(255,255,255,.52);
                font-size:12px;
                margin-bottom:8px;
              "
            >
              Ảnh chứng chỉ
            </div>

            <a
              href="${escapeHtml(
                certificateUrlData
                  .signedUrl
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                src="${escapeHtml(
                  certificateUrlData
                    .signedUrl
                )}"
                alt="Chứng chỉ Coach"
                loading="lazy"
                style="
                  width:min(300px,100%);
                  max-height:300px;
                  object-fit:contain;
                  display:block;
                  border-radius:12px;
                  border:1px solid rgba(216,255,69,.25);
                  background:#04152d;
                "
              >

            </a>

          </div>

        `;

      }

    }
    catch (
      certificateImageError
    ) {

      console.warn(
        "COACH CERTIFICATE IMAGE:",
        certificateImageError
      );

    }

  }


  certificateHtml = `

    <div
      style="
        margin-top:16px;
        padding-top:15px;
        border-top:1px solid rgba(255,255,255,.08);
      "
    >

      <div
        style="
          color:#d8ff45;
          font-size:12px;
          font-weight:900;
          margin-bottom:10px;
        "
      >
        BẰNG / CHỨNG CHỈ
      </div>


      <div class="info-row">

        <span class="info-label">
          Chứng chỉ
        </span>

        <span class="info-value">
          ${escapeHtml(
            certificate.name
            ||
            "—"
          )}
          ✓ Đã xác minh
        </span>

      </div>


      <div class="info-row">

        <span class="info-label">
          Đơn vị cấp
        </span>

        <span class="info-value">
          ${escapeHtml(
            certificate.issuer
            ||
            "—"
          )}
        </span>

      </div>


      <div class="info-row">

        <span class="info-label">
          Năm cấp
        </span>

        <span class="info-value">
          ${escapeHtml(
            certificate.year
            ??
            "—"
          )}
        </span>

      </div>


      ${certificateImageHtml}

    </div>

  `;

}


/* ===============================================
   KHỐI PUBLIC TRÌNH ĐỘ COACH
================================================ */

const verifiedCredentialContent =
  pickdeeCredentialHtml
  +
  externalRatingHtml
  +
  certificateHtml;


const verifiedCredentialsHtml = `

  <div class="section">

    <div class="section-title">
      TRÌNH ĐỘ & BẰNG CẤP
    </div>

    ${
      verifiedCredentialContent
        ?
          verifiedCredentialContent
        :
          `

            <div
              style="
                color:rgba(255,255,255,.52);
                font-size:13px;
                line-height:1.6;
              "
            >
              Chưa có thông tin trình độ
              hoặc chứng chỉ đã được
              PickDee xác minh.
            </div>

          `
    }

  </div>

`;


profileBox.className =
  "profile-card";



  profileBox.innerHTML = `

    <div class="coach-top">

     ${coachAvatarHtml}

      <div>

        <div class="eyebrow">
          COACH PICKDEE
        </div>

        <h1 class="coach-name">

          ${
            escapeHtml(
              coach.full_name
              ||
              "Coach PickDee"
            )
          }

        </h1>

        <div class="coach-code">

          ${
            escapeHtml(
              coach.coach_code
              ||
              ""
            )
          }

        </div>

        <div
  class="status"
  style="${
    coach.accepting_students === false
      ?
      'background:rgba(255,196,107,.12);color:#ffc46b;'
      :
      ''
  }"
>
  ${
    coach.accepting_students === false
      ?
      '● TẠM NGỪNG NHẬN HỌC VIÊN'
      :
      '● ĐANG NHẬN HỌC VIÊN'
  }
</div>

      </div>

    </div>


    <div class="section">

   <div class="section-title">
  HẠNG COACH
</div>


      <div class="info-row">

        <span class="info-label">
          Hạng Coach
        </span>

        <span class="info-value">
          ${escapeHtml(coachTierText)}
        </span>

      </div>


      

    </div>


    <div class="section">

      <div class="section-title">
        KHU VỰC HOẠT ĐỘNG
      </div>


      <div class="info-row">

        <span class="info-label">
