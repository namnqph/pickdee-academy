<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1, maximum-scale=1"
  >
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>
    Đổi mật khẩu | PickDee Academy
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(80,255,190,.12),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #041733,
          #062456 50%,
          #03142d
        );
    }

    .card {
      width:
        min(
          520px,
          100%
        );

      padding: 28px;

      border-radius: 18px;

      background:
        rgba(8,35,73,.94);

      border:
        1px solid rgba(255,255,255,.14);

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.40);
    }

    .brand {
      margin-bottom: 26px;

      font-size: 20px;
      font-weight: 900;
    }

    .brand span {
      color: #d8ff45;
    }

    .eyebrow {
      color: #d8ff45;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: .09em;
    }

    h1 {
      margin:
        7px 0 9px;

      font-size:
        clamp(
          31px,
          7vw,
          43px
        );
    }

    .intro {
      margin-bottom: 24px;

      color:
        rgba(255,255,255,.66);

      line-height: 1.6;

      font-size: 14px;
    }

    .account {
      margin-bottom: 18px;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.055);

      color:
        rgba(255,255,255,.80);

      font-size: 13px;
    }

    label {
      display: block;

      margin:
        16px 0 7px;

      color:
        rgba(255,255,255,.70);

      font-size: 11px;
      font-weight: 900;
    }

    input {
      width: 100%;

      min-height: 48px;

      padding:
        0 14px;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 10px;

      outline: none;

      background:
        rgba(255,255,255,.06);

      color: white;

      font-size: 15px;
    }

    input:focus {
      border-color: #d8ff45;
    }

    .help {
      margin-top: 7px;

      color:
        rgba(255,255,255,.43);

      font-size: 11px;

      line-height: 1.5;
    }

    button {
      width: 100%;

      min-height: 48px;

      margin-top: 22px;

      border: 0;

      border-radius: 10px;

      background: #d8ff45;

      color: #132300;

      cursor: pointer;

      font-size: 13px;
      font-weight: 900;
    }

    button:disabled {
      opacity: .55;

      cursor: wait;
    }

    #message {
      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;
      font-weight: 800;

      line-height: 1.5;
    }

    #message.show {
      display: block;
    }

    #message.error {
      color: #ffb9b9;

      background:
        rgba(255,80,80,.09);

      border:
        1px solid rgba(255,100,100,.30);
    }

    #message.success {
      color: #e2ff91;

      background:
        rgba(216,255,69,.08);

      border:
        1px solid rgba(216,255,69,.30);
    }
  </style>
</head>


<body>


<div class="card">

  <div class="brand">
    PickDee<span>Academy</span>
  </div>


  <div class="eyebrow">
    BẢO MẬT TÀI KHOẢN COACH
  </div>


  <h1>
    Đổi mật khẩu
  </h1>


  <div class="intro">
    Hãy tạo mật khẩu riêng của bạn thay cho mật khẩu tạm do PickDee cung cấp.
  </div>


  <div
    id="account"
    class="account"
  >
    Đang kiểm tra tài khoản...
  </div>


  <form id="passwordForm">

    <label for="newPassword">
      MẬT KHẨU MỚI
    </label>

    <input
      id="newPassword"
      type="password"
      autocomplete="new-password"
      placeholder="Nhập mật khẩu mới"
      required
      minlength="8"
    >

    <div class="help">
      Tối thiểu 8 ký tự. Nên có chữ hoa, chữ thường, số và ký tự đặc biệt.
    </div>


    <label for="confirmPassword">
      NHẬP LẠI MẬT KHẨU MỚI
    </label>

    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
      placeholder="Nhập lại mật khẩu mới"
      required
      minlength="8"
    >


    <button
      id="submitBtn"
      type="submit"
    >
      ĐỔI MẬT KHẨU
    </button>

  </form>


  <div id="message"></div>

</div>



<script>

(async function () {

  const cfg =
    window.PICKDEE_CONFIG || {};


  const account =
    document.getElementById(
      "account"
    );


  const form =
    document.getElementById(
      "passwordForm"
    );


  const newPassword =
    document.getElementById(
      "newPassword"
    );


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    );


  const submitBtn =
    document.getElementById(
      "submitBtn"
    );


  const message =
    document.getElementById(
      "message"
    );


  if (
    !window.supabase
    ||
    !cfg.SUPABASE_URL
    ||
    !cfg.SUPABASE_PUBLISHABLE_KEY
  ) {

    showMessage(
      "Không tải được cấu hình hệ thống.",
      "error"
    );

    return;

  }


  const sb =
    window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );



  function showMessage(
    text,
    type
  ) {

    message.className =
      `show ${type}`;

    message.textContent =
      text;

  }



  /* =====================================================
     KIỂM TRA COACH ĐANG ĐĂNG NHẬP
  ====================================================== */

  const {
    data: userData,
    error: userError
  } =
    await sb.auth.getUser();


  if (
    userError
    ||
    !userData?.user
  ) {

    window.location.replace(
      "./?v=login"
    );

    return;

  }


  const user =
    userData.user;


  const {
    data: profile,
    error: profileError
  } =
    await sb
      .from(
        "profiles"
      )
      .select(
        "role, full_name"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (
    profileError
    ||
    !profile
    ||
    String(
      profile.role || ""
    )
      .trim()
      .toLowerCase()
    !==
    "coach"
  ) {

    window.location.replace(
      "./"
    );

    return;

  }


  account.textContent =
    `${profile.full_name || "Coach"} • ${user.email || ""}`;



  /* =====================================================
     ĐỔI MẬT KHẨU
  ====================================================== */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      const password =
        newPassword.value;


      const confirm =
        confirmPassword.value;


      if (
        password.length < 8
      ) {

        showMessage(
          "Mật khẩu phải có tối thiểu 8 ký tự.",
          "error"
        );

        return;

      }


      if (
        password !== confirm
      ) {

        showMessage(
          "Hai lần nhập mật khẩu chưa giống nhau.",
          "error"
        );

        return;

      }


      submitBtn.disabled =
        true;


      submitBtn.textContent =
        "ĐANG ĐỔI MẬT KHẨU...";


      try {


        const oldMetadata =
          user.user_metadata || {};


        const {
          error
        } =
          await sb.auth.updateUser({

            password:
              password,

            data: {
              ...oldMetadata,

              must_change_password:
                false
            }

          });


        if (error) {
          throw error;
        }


        showMessage(
          "✓ Đổi mật khẩu thành công. Đang quay về khu vực Coach...",
          "success"
        );


        newPassword.value =
          "";


        confirmPassword.value =
          "";


        setTimeout(
          function () {

            window.location.replace(
              "./coach"
            );

          },
          1200
        );


      }
      catch (error) {


        console.error(
          "CHANGE PASSWORD:",
          error
        );


        showMessage(
          "Không đổi được mật khẩu: "
          +
          (
            error?.message
            ||
            error
          ),
          "error"
        );


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          "ĐỔI MẬT KHẨU";


      }

    }
  );


})();

</script>
<script>
(function () {

  let attempts = 0;

  function loadCoachSupport() {

    if (
      document.getElementById(
        "pickdeeSupportRoot"
      )
    ) {
      return;
    }

    const cfg =
      window.PICKDEE_CONFIG || {};

    if (
      !window.supabase
      ||
      !cfg.SUPABASE_URL
      ||
      !cfg.SUPABASE_PUBLISHABLE_KEY
    ) {

      attempts += 1;

      if (attempts < 30) {
        setTimeout(
          loadCoachSupport,
          300
        );
      }

      return;
    }

    const script =
      document.createElement(
        "script"
      );

    script.src =
      "/support-widget.js?v=20261016-bot4";

    document.body.appendChild(
      script
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      loadCoachSupport,
      {
        once: true
      }
    );

  }
  else {

    loadCoachSupport();

  }

})();
</script>

<script src="/pd-portal-appnav.js?v=20261016-1"></script>
</body>
</html>
