<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <style id="pd-no-zoom">html{touch-action:manipulation}</style>

  <title>Chi tiết đăng ký học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261019-keep30"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 80% 10%, rgba(80,255,190,.12), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-weight: 800;
      font-size: 19px;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(1050px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 25px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(34px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.62);
      margin-bottom: 26px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(6,39,88,.74);
      border: 1px solid rgba(255,255,255,.12);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .item {
      margin-bottom: 15px;
    }

    .label {
      color: rgba(255,255,255,.5);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      font-weight: 700;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(216,255,69,.13);
      color: #d8ff45;
      font-size: 12px;
      font-weight: 800;
    }

    .full {
      margin-top: 16px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: #08111d;
      color: #fff;
      color-scheme: dark;
      margin-bottom: 10px;
    }

    select option {
      color: #fff;
      background: #08111d;
    }

    .action-btn {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
    }

    .primary {
      background: #d8ff45;
      color: #172600;
    }

    .secondary {
      background: #f2f2f2;
      color: #111;
    }

    .assignment {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickDee">
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>

  <div id="userEmail"></div>
</header>

<main class="container">

  <a id="backLink" class="back" href="./students.html">
    ← Quay lại
  </a>

  <div class="eyebrow">
    CHI TIẾT ĐĂNG KÝ HỌC
  </div>

  <h1 id="registrationCode">
    Đang tải...
  </h1>

  <div class="sub" id="studentLine"></div>

  <section class="grid">

    <div class="card" id="infoCard">

      <h2>📚 Thông tin đăng ký</h2>

      <div class="item">
        <div class="label">Gói học</div>
        <div class="value" id="packageName">—</div>
      </div>

      <div class="item">
        <div class="label">Trạng thái</div>
        <div class="value">
          <span class="badge" id="status">—</span>
        </div>
      </div>

      <div class="item">
        <div class="label">Coach phụ trách</div>
        <div class="value" id="coachLine">—</div>
      </div>

      <div class="item">
        <div class="label">Nguồn</div>
        <div class="value" id="source">—</div>
      </div>

      <div class="item">
        <div class="label">Mã giới thiệu</div>
        <div class="value" id="referralCode">—</div>
      </div>

      <div id="actionsArea"></div>

    </div>


    <div class="card">

      <h2>📍 Khu vực học</h2>

      <div class="item">
        <div class="label">Khu vực muốn học</div>
        <div class="value" id="preferredArea">—</div>
      </div>

      <div class="item">
        <div class="label">Xã/Phường muốn học</div>
        <div class="value" id="preferredWard">—</div>
      </div>

      <div class="item">
        <div class="label">Ngày đăng ký</div>
        <div class="value" id="createdAt">—</div>
      </div>

    </div>

  </section>


 <section class="card full">

  <h2>🎯 Mục tiêu / nhu cầu học</h2>

  <textarea
    id="learningGoalInput"
    placeholder="Ví dụ: Cải thiện backhand, tập reset, chiến thuật đánh đôi..."
    style="
      width:100%;
      min-height:120px;
      padding:14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:white;
      font:inherit;
      line-height:1.5;
      resize:vertical;
      outline:none;
    "
  ></textarea>

  <button
    id="saveLearningGoalBtn"
    type="button"
    class="action-btn primary"
  >
    💾 LƯU MỤC TIÊU HỌC
  </button>

</section>

<section class="card full">

  <h2>📝 Ghi chú</h2>

  <div id="note">—</div>

</section>

</main>


<script>

const cfg =
  window.PICKDEE_CONFIG || {};

const sb =
  window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_PUBLISHABLE_KEY
  );

const params =
  new URLSearchParams(
    window.location.search
  );

const registrationId =
  Number(params.get("id") || 0);

let currentRegistration = null;
let coaches = [];


/* =====================================
   HELPER
===================================== */

function show(id, value) {

  const el =
    document.getElementById(id);

  if (!el) return;

  el.textContent =
    value || "—";
}


function dateVN(value) {

  if (!value) {
    return "—";
  }

  return new Intl.DateTimeFormat(
    "vi-VN",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  ).format(
    new Date(value)
  );
}


/* =====================================
   KIỂM TRA ADMIN
===================================== */

async function checkAdmin() {

  const {
    data: { session }
  } =
    await sb.auth.getSession();

  if (!session) {

    location.replace(
      "./login.html"
    );

    return false;
  }

  show(
    "userEmail",
    session.user.email
  );

  const {
    data: profile,
    error
  } =
    await sb
      .from("profiles")
      .select("role")
      .eq(
        "id",
        session.user.id
      )
      .single();

  if (
    error ||
    !profile ||
    profile.role !== "admin"
  ) {

    location.replace(
      "./login.html"
    );

    return false;
  }

  return true;
}


/* =====================================
   LOAD ĐĂNG KÝ
===================================== */

async function loadRegistration() {

  if (!registrationId) {

    alert(
      "Không tìm thấy ID đăng ký."
    );

    return false;
  }

  const {
    data,
    error
  } =
    await sb
      .from("registrations")
      .select(`
        id,
        registration_code,
        student_id,
        coach_id,
        is_test,
        package_name,
        preferred_area,
        preferred_ward,
        status,
        source,
        referral_code,
        note,
        created_at
      `)
      .eq(
        "id",
        registrationId
      )
      .single();

  if (
    error ||
    !data
  ) {

    console.error(error);

    alert(
      "Không tải được đăng ký học."
    );

    return false;
  }

  currentRegistration =
    data;


  const {
    data: student
  } =
    await sb
      .from("students")
      .select(`
        id,
        student_code,
        full_name
      `)
      .eq(
        "id",
        data.student_id
      )
      .maybeSingle();


  let coach = null;

  if (data.coach_id) {

    const {
      data: coachData
    } =
      await sb
        .from("coaches")
        .select(`
          id,
          coach_code,
          full_name
        `)
        .eq(
          "id",
          data.coach_id
        )
        .maybeSingle();

    coach =
      coachData || null;
  }


  show(
    "registrationCode",
    data.registration_code
  );

  show(
    "packageName",
    data.package_name
  );

  show(
    "status",
    data.status
  );

  show(
    "source",
    data.source
  );

  show(
    "referralCode",
    data.referral_code
  );

  show(
    "preferredArea",
    data.preferred_area
  );

  show(
    "preferredWard",
    data.preferred_ward
  );

  show(
    "createdAt",
    dateVN(data.created_at)
  );

  show(
    "note",
    data.note
  );

  show(
    "coachLine",
    coach
      ? `${coach.full_name || "—"} (${coach.coach_code || "—"})`
      : "Chưa gán Coach"
  );


  if (student) {

    show(
      "studentLine",
      `${student.full_name || "—"} · ${student.student_code || "—"}`
    );

    document.getElementById(
      "backLink"
    ).href =
      `./student-detail.html?id=${student.id}`;
  }

  return true;
}


/* =====================================
   LOAD COACH
===================================== */

async function loadCoaches() {

  const isTestRegistration =
    currentRegistration?.is_test === true;

  const {
    data,
    error
  } =
await sb
  .from("coaches")
  .select(`
    id,
    coach_code,
    full_name,
    is_test,
    status
  `)
  .eq(
    "is_test",
    isTestRegistration
  )
  .in(
    "status",
    [
      "Đang hoạt động",
      "Hoạt động"
    ]
  )
  .order(
    "full_name",
    { ascending: true }
  );

  if (error) {

    console.error(error);

    coaches = [];

    return;
  }

  coaches =
    data || [];
}


/* =====================================
   RENDER ACTIONS
===================================== */

function renderActions() {

  const area =
    document.getElementById(
      "actionsArea"
    );

  area.innerHTML = "";

  if (!currentRegistration) {
    return;
  }


  /* =====================
     GÁN / ĐỔI COACH
  ===================== */

  if (coaches.length) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "assignment";


    const label =
      document.createElement("div");

    label.textContent =
      "Gán Coach phụ trách";

    label.style.fontWeight =
      "700";

    label.style.marginBottom =
      "8px";


    const select =
      document.createElement(
        "select"
      );


    const empty =
      document.createElement(
        "option"
      );

    empty.value = "";

    empty.textContent =
      "— Chọn Coach —";

    select.appendChild(empty);


    coaches.forEach(
      coach => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(coach.id);

        option.textContent =
          `${coach.full_name || "—"} (${coach.coach_code || "—"})`;

        select.appendChild(
          option
        );
      }
    );


    if (
      currentRegistration.coach_id
    ) {

      select.value =
        String(
          currentRegistration.coach_id
        );
    }


    const coachBtn =
      document.createElement(
        "button"
      );

    coachBtn.type =
      "button";

    coachBtn.className =
      "action-btn secondary";

    coachBtn.textContent =
      currentRegistration.coach_id
        ? "ĐỔI COACH"
        : "GÁN COACH";


    coachBtn.onclick =
  async function () {

    if (!select.value) {

      alert(
        "Hãy chọn Coach."
      );

      return;
    }


    coachBtn.disabled =
      true;

    coachBtn.textContent =
      "ĐANG LƯU...";


   const coachId =
  Number(select.value);


const isReplacing =
  currentRegistration.coach_id
  &&
  Number(
    currentRegistration.coach_id
  ) !== coachId;


if (isReplacing) {

  const oldCoach =
    coaches.find(
      coach =>
        Number(coach.id) ===
        Number(
          currentRegistration.coach_id
        )
    );


  const newCoach =
    coaches.find(
      coach =>
        Number(coach.id) ===
        coachId
    );


  const confirmed =
    window.confirm(
      "Đăng ký này đã có Coach phụ trách.\n\n"
      +
      `Coach hiện tại: ${oldCoach?.full_name || "—"}\n`
      +
      `Đổi sang: ${newCoach?.full_name || "—"}\n\n`
      +
      "Bạn có chắc muốn ĐỔI COACH không?"
    );


  if (!confirmed) {

    coachBtn.disabled =
      false;

    coachBtn.textContent =
      "ĐỔI COACH";

    return;
  }

}


const {
  data: assignData,
  error: assignError
} =
  await sb.functions.invoke(
    "pickdee-assign-coach",
    {
           body: {
        registration_id:
          registrationId,

        coach_id:
          coachId,

        allow_replace:
          isReplacing === true,

        expected_current_coach_id:
          isReplacing
            ? Number(currentRegistration.coach_id)
            : null
      }
    }
  );

    if (assignError) {

      let message =
        assignError.message
        ||
        "Không thể gán Coach.";


      try {

        if (
          assignError.context
          &&
          typeof assignError.context.json
            ===
            "function"
        ) {

          const errorBody =
            await assignError.context.json();


          if (
            errorBody?.error
          ) {

            message =
              errorBody.error;

          }

        }

      }
      catch (_) {}


      console.error(
        assignError
      );


      alert(
        "Không thể gán Coach: "
        +
        message
      );


      coachBtn.disabled =
        false;


      coachBtn.textContent =
        currentRegistration.coach_id
          ?
            "ĐỔI COACH"
          :
            "GÁN COACH";


      return;
    }


    if (
      !assignData
      ||
      assignData.ok !== true
    ) {

      alert(
        "Không thể gán Coach: "
        +
        (
          assignData?.error
          ||
          "Không xác định được lỗi."
        )
      );


      coachBtn.disabled =
        false;


      coachBtn.textContent =
        currentRegistration.coach_id
          ?
            "ĐỔI COACH"
          :
            "GÁN COACH";


      return;
    }


    currentRegistration.coach_id =
      coachId;


    const selectedCoach =
      coaches.find(
        coach =>
          Number(coach.id) ===
          coachId
      );


    show(
      "coachLine",
      selectedCoach
        ?
          `${selectedCoach.full_name || "—"} (${selectedCoach.coach_code || "—"})`
        :
          "Chưa gán Coach"
    );


    renderActions();


    alert(
      "Đã gán Coach thành công."
    );

  };

    wrap.appendChild(label);
    wrap.appendChild(select);
    wrap.appendChild(coachBtn);

    area.appendChild(wrap);
  }


  /* =====================
     DUYỆT ĐĂNG KÝ
  ===================== */

  if (
    currentRegistration.status ===
    "Mới đăng ký"
  ) {

    const approveBtn =
      document.createElement(
        "button"
      );

    approveBtn.type =
      "button";

    approveBtn.className =
      "action-btn primary";

    approveBtn.textContent =
      "DUYỆT ĐĂNG KÝ";


    approveBtn.onclick =
      async function () {

        approveBtn.disabled =
          true;

        approveBtn.textContent =
          "ĐANG DUYỆT...";


        const {
          data,
          error
        } =
          await sb
            .from("registrations")
            .update({
              status:
                "Đã duyệt"
            })
            .eq(
              "id",
              registrationId
            )
            .select(
              "id, status"
            )
            .single();


        if (error) {

          console.error(error);

          alert(
            "Lỗi duyệt đăng ký: " +
            error.message
          );

          approveBtn.disabled =
            false;

          approveBtn.textContent =
            "DUYỆT ĐĂNG KÝ";

          return;
        }


        currentRegistration.status =
          data.status;


        show(
          "status",
          data.status
        );


        renderActions();


        alert(
          "Đã duyệt đăng ký thành công."
        );
      };


    area.appendChild(
      approveBtn
    );
  }


  /* =====================
     TẠO BUỔI HỌC
  ===================== */

  if (
    currentRegistration.status ===
      "Đã duyệt" &&
    currentRegistration.coach_id
  ) {

    const sessionBtn =
      document.createElement(
        "button"
      );

    sessionBtn.type =
      "button";

    sessionBtn.className =
      "action-btn primary";

    sessionBtn.textContent =
      "+ TẠO BUỔI HỌC";


    sessionBtn.onclick =
      function () {

        window.location.href =
          `./add-session.html?registration_id=${registrationId}`;
      };


    area.appendChild(
      sessionBtn
    );
  }
}


/* =====================================
   START
===================================== */

async function init() {

  try {

    const ok =
      await checkAdmin();

    if (!ok) {
      return;
    }

    const loaded =
      await loadRegistration();

    if (!loaded) {
      return;
    }

    await loadCoaches();

    renderActions();

  } catch (error) {

    console.error(
      "Lỗi khởi động trang:",
      error
    );

    alert(
      "Trang bị lỗi: " +
      (error.message || error)
    );
  }
}


init();

</script>
<script>
(async function () {

  const learningGoalInput =
    document.getElementById(
      "learningGoalInput"
    );

  const saveLearningGoalBtn =
    document.getElementById(
      "saveLearningGoalBtn"
    );

  if (
    !learningGoalInput
    ||
    !saveLearningGoalBtn
    ||
    !registrationId
  ) {
    return;
  }


  async function loadLearningGoal() {

    const {
      data,
      error
    } =
      await sb
        .from("registrations")
        .select("learning_goal")
        .eq(
          "id",
          registrationId
        )
        .single();


    if (error) {

      console.error(
        "Load learning goal:",
        error
      );

      learningGoalInput.value =
        "";

      return;
    }


    learningGoalInput.value =
      data?.learning_goal
      ||
      "";

  }


  saveLearningGoalBtn.addEventListener(
    "click",
    async function () {

      const value =
        learningGoalInput.value
          .trim();


      saveLearningGoalBtn.disabled =
        true;

      saveLearningGoalBtn.textContent =
        "ĐANG LƯU...";


      const {
        error
      } =
        await sb
          .from("registrations")
          .update({
            learning_goal:
              value || null
          })
          .eq(
            "id",
            registrationId
          );


      if (error) {

        console.error(
          "Save learning goal:",
          error
        );

        alert(
          "Không lưu được mục tiêu học: "
          +
          error.message
        );

        saveLearningGoalBtn.disabled =
          false;

        saveLearningGoalBtn.textContent =
          "💾 LƯU MỤC TIÊU HỌC";

        return;
      }


      if (currentRegistration) {

        currentRegistration.learning_goal =
          value || null;

      }


      saveLearningGoalBtn.textContent =
        "✓ ĐÃ LƯU";


      setTimeout(
        function () {

          saveLearningGoalBtn.disabled =
            false;

          saveLearningGoalBtn.textContent =
            "💾 LƯU MỤC TIÊU HỌC";

        },
        1200
      );

    }
  );


  await loadLearningGoal();

})();
</script>
<script src="/academy-admin-appnav.js?v=20261016-1"></script>
<script src="/pd-app.js?v=20261020-4"></script>
</body>
</html>
