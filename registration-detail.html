<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chi tiết đăng ký học | PickDee Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 80% 10%, rgba(80,255,190,.12), transparent 30%),
        linear-gradient(145deg, #041733, #062456 50%, #03142d);
    }

    .topbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      font-weight: 800;
      font-size: 19px;
    }

    .brand span {
      color: #d8ff45;
    }

    .container {
      width: min(1050px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    .back {
      color: #d8ff45;
      text-decoration: none;
      font-weight: 700;
    }

    .eyebrow {
      margin-top: 25px;
      color: #d8ff45;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(34px, 6vw, 54px);
    }

    .sub {
      color: rgba(255,255,255,.62);
      margin-bottom: 26px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(6,39,88,.74);
      border: 1px solid rgba(255,255,255,.12);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .item {
      margin-bottom: 15px;
    }

    .label {
      color: rgba(255,255,255,.5);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      font-weight: 700;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(216,255,69,.13);
      color: #d8ff45;
      font-size: 12px;
      font-weight: 800;
    }

    .full {
      margin-top: 16px;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    PickDee <span>Academy</span>
  </div>
  <div id="userEmail"></div>
</header>

<main class="container">

  <a id="backLink" class="back" href="./students.html">
    ← Quay lại
  </a>

  <div class="eyebrow">
    CHI TIẾT ĐĂNG KÝ HỌC
  </div>

  <h1 id="registrationCode">Đang tải...</h1>

  <div class="sub" id="studentLine"></div>

  <section class="grid">

    <div class="card">
      <h2>📚 Thông tin đăng ký</h2>

      <div class="item">
        <div class="label">Gói học</div>
        <div class="value" id="packageName">—</div>
      </div>

      <div class="item">
        <div class="label">Trạng thái</div>
        <div class="value">
          <span class="badge" id="status">—</span>
        </div>
      </div>
<div class="item">
  <div class="label">Coach phụ trách</div>
  <div class="value" id="coachLine">—</div>
</div>
      <div class="item">
        <div class="label">Nguồn</div>
        <div class="value" id="source">—</div>
      </div>

      <div class="item">
        <div class="label">Mã giới thiệu</div>
        <div class="value" id="referralCode">—</div>
      </div>
    </div>

    <div class="card">
      <h2>📍 Khu vực học</h2>

      <div class="item">
        <div class="label">Khu vực muốn học</div>
        <div class="value" id="preferredArea">—</div>
      </div>

      <div class="item">
        <div class="label">Xã/Phường muốn học</div>
        <div class="value" id="preferredWard">—</div>
      </div>

      <div class="item">
        <div class="label">Ngày đăng ký</div>
        <div class="value" id="createdAt">—</div>
      </div>
    </div>

  </section>

  <section class="card full">
    <h2>📝 Ghi chú</h2>
    <div id="note">—</div>
  </section>

</main>

<script>
  const cfg = window.PICKDEE_CONFIG || {};

  const sb = window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_PUBLISHABLE_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const registrationId = params.get("id");

  function show(id, value) {
    document.getElementById(id).textContent =
      value || "—";
  }

  function dateVN(value) {
    if (!value) return "—";

    return new Intl.DateTimeFormat(
      "vi-VN",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    ).format(new Date(value));
  }

  async function checkAdmin() {

    const {
      data: { session }
    } = await sb.auth.getSession();

    if (!session) {
      location.replace("./login.html");
      return false;
    }

    show("userEmail", session.user.email);

    const { data: profile } =
      await sb
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .single();

    if (!profile || profile.role !== "admin") {
      location.replace("./login.html");
      return false;
    }

    return true;
  }

  async function loadRegistration() {

    if (!registrationId) {
      alert("Không tìm thấy ID đăng ký.");
      return;
    }

    const { data, error } =
      await sb
        .from("registrations")
        .select(`
          id,
registration_code,
student_id,
coach_id,
package_name,
          preferred_area,
          preferred_ward,
          status,
          source,
          referral_code,
          note,
          created_at
        `)
        .eq("id", registrationId)
        .single();

    if (error || !data) {
      console.error(error);
      alert("Không tải được đăng ký học.");
      return;
    }

    const { data: student } =
      await sb
        .from("students")
        .select("id, student_code, full_name")
        .eq("id", data.student_id)
        .single();
let coach = null;

if (data.coach_id) {
  const { data: coachData, error: coachError } =
    await sb
      .from("coaches")
      .select(`
        id,
        coach_code,
        full_name
      `)
      .eq("id", data.coach_id)
      .maybeSingle();

  if (coachError) {
    console.error("Lỗi tải Coach:", coachError);
  } else {
    coach = coachData;
  }
}
    show("registrationCode", data.registration_code);
    show("packageName", data.package_name);
    show("status", data.status);
    show("source", data.source);
    show("referralCode", data.referral_code);
    show("preferredArea", data.preferred_area);
    show("preferredWard", data.preferred_ward);
    show("createdAt", dateVN(data.created_at));
    show("note", data.note);
show(
  "coachLine",
  coach
    ? `${coach.full_name || "—"} (${coach.coach_code || "—"})`
    : "Chưa gán Coach"
);
    if (student) {
      show(
        "studentLine",
        `${student.full_name || "—"} · ${student.student_code || "—"}`
      );

      document.getElementById("backLink").href =
        `./student-detail.html?id=${encodeURIComponent(student.id)}`;
    }
  }

 async function setupApproveButton() {

  const statusEl =
    document.getElementById("status");

  if (
    !statusEl ||
    statusEl.textContent.trim() !== "Mới đăng ký"
  ) {
    return;
  }

  const infoCard =
    document.querySelector(".grid .card");

  if (
    !infoCard ||
    document.getElementById("approveRegistrationBtn")
  ) {
    return;
  }

  const btn =
    document.createElement("button");

  btn.id = "approveRegistrationBtn";
  btn.textContent = "DUYỆT ĐĂNG KÝ";

  btn.style.marginTop = "18px";
  btn.style.padding = "12px 16px";
  btn.style.border = "0";
  btn.style.borderRadius = "10px";
  btn.style.background = "#d8ff45";
  btn.style.color = "#172600";
  btn.style.fontWeight = "900";
  btn.style.cursor = "pointer";

  btn.onclick = async function () {

  btn.disabled = true;
  btn.textContent = "ĐANG DUYỆT...";

  try {

    const { data, error } =
      await sb
        .from("registrations")
        .update({
          status: "Đã duyệt"
        })
        .eq(
          "id",
          Number(registrationId)
        )
        .select("id, status")
        .single();

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error(
        "Supabase không trả về đăng ký vừa cập nhật."
      );
    }

    statusEl.textContent =
      data.status;

    btn.remove();

    alert("Đã duyệt đăng ký thành công.");

  } catch (error) {

    console.error(error);

    alert(
      "Lỗi duyệt đăng ký: " +
      (error.message || error)
    );

    btn.disabled = false;
    btn.textContent =
      "DUYỆT ĐĂNG KÝ";
  }
};

  infoCard.appendChild(btn);
}

async function setupCoachAssignment() {
  const infoCard = document.querySelector(".grid .card");

  if (!infoCard || !registrationId) {
    return;
  }

  const { data: registration, error: registrationError } =
    await sb
      .from("registrations")
      .select("coach_id")
      .eq("id", registrationId)
      .single();

  if (registrationError) {
    console.error("Lỗi tải Coach của đăng ký:", registrationError);
    return;
  }

  const { data: coaches, error: coachesError } =
    await sb
      .from("coaches")
      .select(`
        id,
        coach_code,
        full_name
      `)
      .order("full_name", { ascending: true });

  if (coachesError) {
    console.error("Lỗi tải danh sách Coach:", coachesError);
    return;
  }

  if (!coaches || coaches.length === 0) {
    return;
  }

  const wrap = document.createElement("div");

  wrap.style.marginTop = "20px";
  wrap.style.paddingTop = "16px";
  wrap.style.borderTop = "1px solid rgba(255,255,255,0.12)";

  const label = document.createElement("div");

  label.textContent = "Gán Coach phụ trách";
  label.style.marginBottom = "8px";
  label.style.fontWeight = "700";

  const select = document.createElement("select");

  select.style.width = "100%";
  select.style.padding = "12px";
  select.style.borderRadius = "10px";
  select.style.marginBottom = "10px";

  const emptyOption = document.createElement("option");

  emptyOption.value = "";
  emptyOption.textContent = "— Chọn Coach —";

  select.appendChild(emptyOption);

  coaches.forEach((coach) => {
    const option = document.createElement("option");

    option.value = String(coach.id);
    option.textContent =
      `${coach.full_name || "—"} (${coach.coach_code || "—"})`;

    select.appendChild(option);
  });

  if (registration.coach_id) {
    select.value = String(registration.coach_id);
  }

  const btn = document.createElement("button");

  btn.type = "button";
  btn.textContent =
    registration.coach_id
      ? "ĐỔI COACH"
      : "GÁN COACH";

  btn.style.width = "100%";
  btn.style.padding = "12px 16px";
  btn.style.border = "0";
  btn.style.borderRadius = "10px";
  btn.style.fontWeight = "800";
  btn.style.cursor = "pointer";

  btn.addEventListener("click", async () => {
    if (!select.value) {
      alert("Hãy chọn Coach.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "ĐANG LƯU...";

    const coachId = Number(select.value);

    const { error } =
      await sb
        .from("registrations")
        .update({
          coach_id: coachId
        })
        .eq("id", registrationId);

    if (error) {
      console.error(error);

      alert(
        "Không thể gán Coach: " +
        (error.message || error)
      );

      btn.disabled = false;
      btn.textContent =
        registration.coach_id
          ? "ĐỔI COACH"
          : "GÁN COACH";

      return;
    }

    const selectedCoach =
      coaches.find(
        (coach) =>
          String(coach.id) === select.value
      );

    show(
      "coachLine",
      selectedCoach
        ? `${selectedCoach.full_name || "—"} (${selectedCoach.coach_code || "—"})`
        : "Chưa gán Coach"
    );

   registration.coach_id =
  coachId;

btn.disabled = false;

btn.textContent =
  "ĐỔI COACH";

await setupCreateSessionButton();

alert(
  "Đã gán Coach thành công."
);

  wrap.appendChild(label);
  wrap.appendChild(select);
  wrap.appendChild(btn);

  infoCard.appendChild(wrap);
}async function setupCreateSessionButton() {

  const infoCard =
    document.querySelector(".grid .card");

  const statusEl =
    document.getElementById("status");

  if (
    !infoCard ||
    !statusEl ||
    !registrationId
  ) {
    return;
  }

  /*
    Xóa nút cũ nếu hàm được gọi lại
  */
  const oldBtn =
    document.getElementById(
      "createSessionBtn"
    );

  if (oldBtn) {
    oldBtn.remove();
  }

  /*
    Chỉ đăng ký Đã duyệt
    mới được tạo buổi học
  */
  if (
    statusEl.textContent.trim() !==
    "Đã duyệt"
  ) {
    return;
  }

  /*
    Kiểm tra đăng ký đã có Coach
  */
  const {
    data: registration,
    error
  } =
    await sb
      .from("registrations")
      .select("coach_id")
      .eq(
        "id",
        Number(registrationId)
      )
      .single();

  if (error) {
    console.error(
      "Lỗi kiểm tra đăng ký:",
      error
    );
    return;
  }

  if (
    !registration ||
    !registration.coach_id
  ) {
    return;
  }

  /*
    Tạo nút
  */
  const btn =
    document.createElement("button");

  btn.id =
    "createSessionBtn";

  btn.type =
    "button";

  btn.textContent =
    "+ TẠO BUỔI HỌC";

  btn.style.width =
    "100%";

  btn.style.marginTop =
    "18px";

  btn.style.padding =
    "13px 16px";

  btn.style.border =
    "0";

  btn.style.borderRadius =
    "10px";

  btn.style.background =
    "#d8ff45";

  btn.style.color =
    "#172600";

  btn.style.fontWeight =
    "900";

  btn.style.cursor =
    "pointer";

  btn.onclick = function () {

    window.location.href =
      `./add-session.html?registration_id=${encodeURIComponent(registrationId)}`;
  };

  infoCard.appendChild(btn);
}
async function init() {

  const ok = await checkAdmin();

  if (!ok) return;

 await loadRegistration();

await setupCoachAssignment();

await setupApproveButton();
await setupCreateSessionButton();
}

init();
</script>

</body>
</html>
